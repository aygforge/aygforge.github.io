<body>
<div id="app">

      <div class="note">Baskı değerleri ikinci görseldeki çubukların piksel yüksekliklerinden ölçülüp 0–1 aralığına normalize edilmiştir. Göreli bir baskı endeksidir; gerçek xG veya resmi istatistik değildir.</div>
    </details>

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   1) MAÇ VERİSİ
   Kaynak: ikinci görsel (attacking pressure grafiği). Her çubuk kolonu
   piksel olarak ölçüldü. Yatay eksen iki parçalı doğrusal eşlendi:
   0' → x≈61px, İY (45') → x≈630px, MS (90') → x≈1185px.
   Üst (kırmızı) çubuklar = Takım A (ev sahibi), alt (koyu) = Takım B.
   Değerler, en yüksek çubuğa (≈109px) göre 0–1 normalize edilmiştir.
   minute: m  → [m, m+1) dakika aralığındaki baskı.
   ===================================================================== */
const RAW = [
 [0,0.0,0.54],[1,0.0,0.56],[2,0.0,0.98],[3,0.0,0.98],[4,0.58,0.66],[5,0.57,0.86],[6,0.16,0.84],[7,0.58,0.0],[8,0.42,0.0],[9,0.28,0.0],
 [10,0.07,0.0],[11,1.0,0.0],[12,1.0,0.0],[13,1.0,0.0],[14,0.95,0.14],[15,0.07,0.11],[16,0.0,0.12],[17,0.09,0.07],[18,0.26,0.0],[19,0.39,0.0],
 [20,0.86,0.0],[21,0.77,0.17],[22,0.78,0.0],[23,0.6,0.0],[24,0.76,0.0],[25,0.76,0.0],[26,0.76,0.0],[27,0.74,0.16],[28,0.12,0.13],[29,0.0,0.18],
 [30,0.0,0.31],[31,0.39,0.32],[32,0.39,0.36],[33,0.0,0.96],[34,0.0,0.94],[35,0.53,0.32],[36,0.56,0.0],[37,0.36,0.0],[38,1.0,0.0],[39,1.0,0.0],
 [40,0.28,0.0],[41,0.27,0.07],[42,0.17,0.05],[43,0.0,0.0],[44,0.0,0.0],[45,0.0,0.0],[46,0.0,0.42],[47,0.0,0.95],[48,0.0,1.0],[49,0.61,0.68],
 [50,0.64,0.58],[51,0.0,0.6],[52,0.0,0.94],[53,0.0,0.96],[54,0.85,0.36],[55,0.86,0.0],[56,0.0,0.97],[57,0.0,0.98],[58,0.55,0.84],[59,0.56,0.0],
 [60,0.34,0.0],[61,1.0,0.0],[62,1.0,0.0],[63,1.0,0.0],[64,0.34,0.0],[65,0.48,0.0],[66,0.48,0.0],[67,0.19,0.0],[68,0.06,0.0],[69,0.26,0.0],
 [70,0.26,0.39],[71,0.0,0.39],[72,0.0,0.6],[73,0.16,0.6],[74,0.51,0.0],[75,0.88,0.0],[76,0.88,0.0],[77,0.6,0.46],[78,0.0,0.7],[79,0.0,0.7],
 [80,0.0,0.47],[81,0.0,0.48],[82,0.0,0.47],[83,0.0,0.74],[84,0.0,0.72],[85,0.0,0.42],[86,0.0,0.4],[87,0.12,0.0],[88,0.1,0.22],[89,0.0,0.19],
 [90,0,0]
];
const matchData = RAW.map(([minute, home, away]) => ({ minute, home, away }));

/* Gol olayları: grafikteki top simgelerinin yatay konumlarından (yaklaşık).
   Üstteki toplar → Takım A, alttaki toplar → Takım B. Alttaki editörden değiştirilebilir. */
/* Goller: maç detayından (Ofsayt). minute = zaman çizelgesindeki dakika (uzatma: 90+2 → 92),
   label = ekranda yazan dakika, scorer = golü atan, assist = asist, pen = penaltı */
let GOALS = [
  { minute: 1,  team: 'away', scorer: 'Alysson',      assist: 'J. McGinn' },
  { minute: 4,  team: 'away', scorer: 'N. Jackson' },
  { minute: 16, team: 'home', scorer: 'B. Fernandes', pen: true },
  { minute: 44, team: 'home', scorer: 'Y. Tielemans', assist: 'N. Mazraoui' },
  { minute: 48, team: 'away', scorer: 'J. McGinn',    pen: true },
  { minute: 53, team: 'away', scorer: 'L. Goretzka',  assist: 'N. Jackson' },
  { minute: 92, label: '90+2', team: 'home', scorer: 'J. Zirkzee', assist: 'P. Dorgu' },
  { minute: 96, label: '90+6', team: 'home', scorer: 'P. Dorgu',   assist: 'B. Fernandes' },
];
const goalLabel = g => (g.label || String(g.minute)) + "'";

const TEAMS = {
  home: { code: 'MUN', name: 'Manchester United', upper: 'MANCHESTER UNITED', short: 'MAN UTD', ui: '#e0322a', base: '#c8201a', stripeA: '#da291c', stripeB: '#141414', mark: '#e0322a' },
  away: { code: 'AVL', name: 'Aston Villa', upper: 'ASTON VILLA', short: 'ASTON VILLA', ui: '#95bfe5', base: '#7a1440', stripeA: '#6e1137', stripeB: '#9cc8ec' },
};
const MATCH = { stop2: 7, title: 'Manchester United – Aston Villa', competition: 'PREMIER LEAGUE',
  // Premier League teması: koyu mor zemin, pembe/camgöbeği ışıma
  bgInner: '#2a0a33', bgOuter: '#08020b', glow: '#e90052', glow2: '#04f5ff', accent: '#00ff85' };

/* =====================================================================
   2) YARDIMCILAR
   ===================================================================== */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOutCubic = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeInOut = t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const DEG = Math.PI / 180;
const $ = id => document.getElementById(id);

function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
}
/* Dakika m'deki baskı: dakika merkezleri arasında Catmull-Rom (zirveleri korur) */
function pressureAt(key, m) {
  if (m <= 0) return 0;
  const x = m - 0.5, i = Math.floor(x), f = x - i;
  const g = k => matchData[clamp(k, 0, 90)][key];
  const v = catmull(g(i - 1), g(i), g(i + 1), g(i + 2), f);
  return clamp(v, 0, 1) * smooth(0, 0.7, m);
}
/* Genel üstünlük (renk tonu için daha geniş pencere) */
function dominanceAt(m) {
  let s = 0, a = 0, ws = 0;
  const sig = 1.6;
  for (let k = Math.floor(m - 6); k <= Math.ceil(m + 6); k++) {
    if (k < 0 || k > 89) continue;
    const c = k + 0.5, w = Math.exp(-((c - m) ** 2) / (2 * sig * sig));
    s += w * (matchData[k].home - matchData[k].away);
    a += w * Math.max(matchData[k].home, matchData[k].away);
    ws += w;
  }
  const e = smooth(0, 1.5, m);
  return ws ? { d: (s / ws) * e, act: (a / ws) * e } : { d: 0, act: 0 };
}

/* =====================================================================
   3) ZAMAN ÇİZELGESİ (saniye ↔ dakika)
   50 sn referans: 0–2 giriş | 2–24.5 1. yarı | 24.5–25.5 devre | 25.5–48 2. yarı | 48–50 maç sonu
   ===================================================================== */
const state = { t: 0, duration: 50, playing: false, format: '16:9', recording: false };
function phases() {
  const s = state.duration / 50;
  const st = (MATCH.stop2 || 0) > 0;
  return { intro: 2 * s, h1: 24.5 * s, ht: 25.5 * s, h2: (st ? 46 : 48) * s, ft: 48 * s, end: state.duration };
}
function minuteAt(t) {
  const p = phases();
  if (t <= p.intro) return 0;
  if (t < p.h1) return 45 * (t - p.intro) / (p.h1 - p.intro);
  if (t < p.ht) return 45;
  if (t < p.h2) return 45 + 45 * (t - p.ht) / (p.h2 - p.ht);
  if (t < p.ft) return 90 + (MATCH.stop2 || 0) * (t - p.h2) / (p.ft - p.h2);   // 2. yarı uzatması
  return 90 + (MATCH.stop2 || 0);
}
function timeAtMinute(m) {
  const p = phases();
  if (m <= 45) return p.intro + (m / 45) * (p.h1 - p.intro);
  if (m <= 90 || !MATCH.stop2) return p.ht + ((Math.min(m, 90) - 45) / 45) * (p.h2 - p.ht);
  return p.h2 + (Math.min(m - 90, MATCH.stop2) / MATCH.stop2) * (p.ft - p.h2);
}
function periodAt(t) {
  const p = phases();
  if (t < p.intro) return 'pre';
  if (t < p.h1) return 'h1';
  if (t < p.ht) return 'ht';
  if (t < p.ft) return 'h2';
  return 'ft';
}
function clockText(t) {
  const per = periodAt(t), m = minuteAt(t);
  if (per === 'pre') return "0'";
  if (per === 'h1') return Math.min(45, Math.floor(m) + 1) + "'";
  if (per === 'ht') return "45'";
  if (per === 'h2') return m < 90 ? Math.min(90, Math.floor(m) + 1) + "'" : `90+${Math.min(MATCH.stop2, Math.floor(m - 90) + 1)}'`;
  return "90'";
}
const PERIOD_LABEL = { pre: 'Kick-off', h1: '1st Half', ht: 'Half-Time', h2: '2nd Half', ft: 'Full-Time' };

/* Gol zamanı: "28'" golü, saatin 28' gösterdiği aralığın ortasında (27.5 dk) tetiklenir */
const goalTime = g => timeAtMinute(clamp(g.minute - 0.5, 0, 90 + (MATCH.stop2 || 0)));
/* t anındaki skor ve son gol — tamamen saf fonksiyon (ileri/geri sarmada bozulmaz) */
function goalState(t) {
  const score = { home: 0, away: 0 }, lastAge = { home: Infinity, away: Infinity };
  let last = null, age = Infinity;
  for (const g of GOALS) {
    const tg = goalTime(g);
    if (t >= tg) {
      score[g.team]++;
      lastAge[g.team] = Math.min(lastAge[g.team], t - tg);
      if (t - tg < age) { age = t - tg; last = g; }
    }
  }
  return { score, last, age, lastAge };
}

/* =====================================================================
   4) RENDERER / SAHNE
   ===================================================================== */
const out = $('out');
const octx = out.getContext('2d', { alpha: false });
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
} catch (e) {
  showMsg('WebGL başlatılamadı. Lütfen WebGL destekleyen bir tarayıcı kullanın.', true, 0);
  throw e;
}
THREE.ColorManagement.enabled = false;
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
const gl = renderer.domElement;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 16 / 9, 1, 3000);

const FIELD_L = 105, FIELD_W = 68;
const MESH_L = 112, MESH_W = 75;           // saha + kenar payı
const SEG_L = 176, SEG_W = 118;
const BASE_Y = -2.6;                        // yan yüzeylerin alt kenarı
const HEIGHT = 15;

const col3 = hex => new THREE.Color(hex);
const uniforms = {
  uTime: { value: 0 }, uHome: { value: 0 }, uAway: { value: 0 }, uHeight: { value: HEIGHT },
  uGoalAge: { value: 99 }, uGoalSide: { value: 0 }, uGoalAmp: { value: 0 }, uGoalGlow: { value: 0 },
  uGoalColor: { value: col3(TEAMS.home.ui) }, uReveal: { value: 1.2 }, uBase: { value: BASE_Y },
  uNeutral: { value: col3('#3a4050') }, uTint: { value: col3(TEAMS.away.base) }, uTintAmt: { value: 0 },
  uHomeA: { value: col3(TEAMS.home.stripeA) }, uHomeB: { value: col3(TEAMS.home.stripeB) },
  uAwayA: { value: col3(TEAMS.away.stripeA) }, uAwayB: { value: col3(TEAMS.away.stripeB) },
  uLines: { value: null },
};

const COMMON = /* glsl */`
  uniform float uTime, uHome, uAway, uHeight, uGoalAge, uGoalSide, uGoalAmp, uBase, uReveal;
  const float HL = ${(FIELD_L / 2).toFixed(2)};
  const float HW = ${(FIELD_W / 2).toFixed(2)};
  // Baskı zarfı: d=0 hücum edilen kale çizgisi. Güçlü baskı → dalga sahaya daha çok yayılır.
  float env(float d, float p){ float w = 0.15 + 0.42 * p; return exp(-(d * d) / (w * w) * 1.8); }
  float goalRing(vec2 q){
    if (uGoalAmp <= 0.0) return 0.0;
    vec2 gp = vec2(uGoalSide < 0.5 ? -HL : HL, 0.0);
    float r = length(q - gp);
    float front = uGoalAge * 62.0;
    return exp(-pow((r - front) / 8.0, 2.0)) * uGoalAmp * exp(-uGoalAge * 0.85);
  }
  float heightAt(vec2 q){
    // Takım A (ev) -x kalesine, Takım B (dep) +x kalesine hücum eder.
    float dH = (q.x + HL) / (2.0 * HL);
    float dA = (HL - q.x) / (2.0 * HL);
    float zN = q.y / HW;
    float latH = 0.80 + 0.20 * cos(zN * 2.3 + sin(uTime * 0.7) * 0.8);
    float latA = 0.80 + 0.20 * cos(zN * 2.3 - cos(uTime * 0.6) * 0.8 + 1.0);
    // Kaleye doğru ilerleyen dalgacıklar
    float rH = 0.72 + 0.28 * sin(dH * 25.0 + uTime * 5.2);
    float rA = 0.72 + 0.28 * sin(dA * 25.0 + uTime * 5.2 + 1.7);
    float h = uHeight * uHome * env(dH, uHome) * rH * latH;
    h      += uHeight * uAway * env(dA, uAway) * rA * latA;
    // Çok güçlü baskıda saha ucu yukarı kıvrılır
    h += uHeight * 0.45 * uHome * uHome * exp(-max(dH, 0.0) * 15.0);
    h += uHeight * 0.45 * uAway * uAway * exp(-max(dA, 0.0) * 15.0);
    // Sakin ortam hareketi
    h += 0.32 * sin(q.x * 0.09 + uTime * 0.9) * cos(q.y * 0.11 - uTime * 0.7);
    // Gol şok dalgası
    h += goalRing(q) * 8.5;
    return h;
  }
`;

const VERT = /* glsl */`
  ${COMMON}
  attribute float aSkY;       // yan yüzey: 1 üst kenar, 0 alt kenar
  varying vec3 vN; varying vec2 vUv; varying vec2 vQ; varying float vH; varying float vSkY;
  void main(){
    vec2 q = position.xz;
    float h = heightAt(q);
    vec3 p = vec3(q.x, h, q.y);
  #ifdef SKIRT
    if (aSkY < 0.5) p.y = uBase;
    vN = normalize(normal + vec3(0.0, 0.25, 0.0));
  #else
    float e = 0.6;
    float hx = heightAt(q + vec2(e, 0.0)) - heightAt(q - vec2(e, 0.0));
    float hz = heightAt(q + vec2(0.0, e)) - heightAt(q - vec2(0.0, e));
    vN = normalize(vec3(-hx / (2.0 * e), 1.0, -hz / (2.0 * e)));
  #endif
    vUv = uv; vQ = q; vH = h; vSkY = aSkY;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
  }
`;

const FRAG = /* glsl */`
  ${COMMON}
  uniform vec3 uNeutral, uTint, uHomeA, uHomeB, uAwayA, uAwayB, uGoalColor;
  uniform float uTintAmt, uGoalGlow;
  uniform sampler2D uLines;
  varying vec3 vN; varying vec2 vUv; varying vec2 vQ; varying float vH; varying float vSkY;
  float bands(float x){
    float f = fract(x);
    float aa = fwidth(x) * 1.5 + 0.01;
    return smoothstep(0.5 - aa, 0.5 + aa, f) * (1.0 - smoothstep(1.0 - aa, 1.0, f));
  }
  void main(){
    float xN = (vQ.x + HL + 3.5) / (2.0 * HL + 7.0);
    if (xN > uReveal) discard;
    float dH = (vQ.x + HL) / (2.0 * HL);
    float dA = 1.0 - dH;
    vec3 col = mix(uNeutral, uTint, uTintAmt);
    float iH = uHome * env(dH, uHome);
    float iA = uAway * env(dA, uAway);
    // Takım renk şeritleri (kale çizgisine paralel), baskı yönünde akar
    vec3 cH = mix(uHomeA, uHomeB, bands(dH * 9.0 + uTime * 0.55));
    vec3 cA = mix(uAwayA, uAwayB, bands(dA * 9.0 + uTime * 0.55));
    col = mix(col, cA, smoothstep(0.04, 0.42, iA));
    col = mix(col, cH, smoothstep(0.04, 0.42, iH));
    // Aydınlatma
    vec3 n = normalize(vN);
    vec3 L = normalize(vec3(-0.35, 1.0, -0.45));
    float dif = max(dot(n, L), 0.0);
    float crest = clamp(vH / (uHeight * 1.2), 0.0, 1.0);
    vec3 V = normalize(vec3(-0.5, 0.8, 0.6));
    float spec = pow(max(dot(n, normalize(L + V)), 0.0), 28.0) * 0.18;
    float light = 0.50 + 0.52 * dif + 0.22 * crest;
  #ifdef SKIRT
    light = mix(0.32, 0.72, vSkY);
    spec = 0.0;
  #endif
    col = col * light + spec;
  #ifndef SKIRT
    float a = texture2D(uLines, vUv).a;
    float lum = dot(col, vec3(0.299, 0.587, 0.114));
    vec3 lc = mix(vec3(0.97), vec3(0.07, 0.08, 0.14), smoothstep(0.58, 0.78, lum));
    col = mix(col, lc, a * 0.93);
  #endif
    // Gol ışığı
    col += uGoalColor * (uGoalGlow * 0.35 + goalRing(vQ) * 0.55);
    // Açılış süpürmesinin parlak kenarı
    col += vec3(1.0) * smoothstep(uReveal - 0.035, uReveal, xN) * step(uReveal, 1.05) * 0.6;
    gl_FragColor = vec4(col, 1.0);
  }
`;

function makeSkirt() {
  const hx = MESH_L / 2, hz = MESH_W / 2, pts = [];
  const side = (x0, z0, x1, z1, n, nx, nz) => {
    for (let i = 0; i < n; i++) { const t = i / n; pts.push([lerp(x0, x1, t), lerp(z0, z1, t), nx, nz]); }
  };
  side(-hx, hz, hx, hz, SEG_L, 0, 1);     // ön (+z)
  side(hx, hz, hx, -hz, SEG_W, 1, 0);     // sağ
  side(hx, -hz, -hx, -hz, SEG_L, 0, -1);  // arka
  side(-hx, -hz, -hx, hz, SEG_W, -1, 0);  // sol
  const pos = [], nor = [], sky = [], uv = [], idx = [];
  const add = (x, z, nx, nz, y) => { pos.push(x, 0, z); nor.push(nx, 0, nz); sky.push(y); uv.push(0, 0); };
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const nx = a[2], nz = a[3], base = pos.length / 3;
    add(a[0], a[1], nx, nz, 1); add(a[0], a[1], nx, nz, 0);
    add(b[0], b[1], nx, nz, 1); add(b[0], b[1], nx, nz, 0);
    idx.push(base, base + 1, base + 2, base + 2, base + 1, base + 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('aSkY', new THREE.Float32BufferAttribute(sky, 1));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

/* =====================================================================
   5) FORMAT / KAMERA YERLEŞİMİ
   ===================================================================== */
const FORMATS = {
  '16:9': { w: 1920, h: 1080, fov: 30, el: 37, az: -30, sx: 0.92, top: 0.60, bot: -0.64 },
  '9:16': { w: 1080, h: 1920, fov: 34, el: 44, az: -63, sx: 0.94, top: 0.52, bot: -0.64 },
};
const BOX = [];
for (const sx of [-1, 1]) for (const sz of [-1, 1]) for (const y of [BASE_Y, 17]) BOX.push(new THREE.Vector3(sx * MESH_L / 2, y, sz * MESH_W / 2));
const tmpV = new THREE.Vector3();
let fitDist = 200;
let quality = 1;

function placeCamera(d, el, az, target) {
  camera.position.set(target.x + d * Math.cos(el) * Math.sin(az), target.y + d * Math.sin(el), target.z + d * Math.cos(el) * Math.cos(az));
  camera.lookAt(target);
  camera.updateMatrixWorld();
}
function projBox() {
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of BOX) { tmpV.copy(p).project(camera); x0 = Math.min(x0, tmpV.x); x1 = Math.max(x1, tmpV.x); y0 = Math.min(y0, tmpV.y); y1 = Math.max(y1, tmpV.y); }
  return { x0, x1, y0, y1 };
}
function computeFit() {
  const F = FORMATS[state.format];
  camera.fov = F.fov; camera.aspect = F.w / F.h; camera.clearViewOffset(); camera.updateProjectionMatrix();
  let lo = 20, hi = 3000;
  const tgt = new THREE.Vector3(0, 3, 0);
  for (let i = 0; i < 40; i++) {
    const mid = (lo + hi) / 2;
    placeCamera(mid, F.el * DEG, F.az * DEG, tgt);
    const b = projBox();
    if (b.x1 - b.x0 <= 2 * F.sx && b.y1 - b.y0 <= F.top - F.bot) hi = mid; else lo = mid;
  }
  fitDist = hi;
}
function applyFormat(fmt) {
  state.format = fmt;
  const F = FORMATS[fmt];
  out.width = F.w; out.height = F.h;
  renderer.setSize(Math.round(F.w * quality), Math.round(F.h * quality), false);
  $('fmt169').classList.toggle('on', fmt === '16:9');
  $('fmt916').classList.toggle('on', fmt === '9:16');
  computeFit();
  buildTimelineCache();
  layoutCanvas();
}
function layoutCanvas() {
  const st = $('stage'), cs = getComputedStyle(st);
  const aw = st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = st.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const r = out.width / out.height;
  let w = aw, h = aw / r;
  if (h > ah) { h = ah; w = ah * r; }
  out.style.width = Math.max(10, Math.floor(w)) + 'px';
  out.style.height = Math.max(10, Math.floor(h)) + 'px';
}

function drawGoalBanner(ctx, gs) {
  if (!gs.last || gs.age > 2.3) return;

function drawCenterCard(ctx, t, gs) {

  if (t >= p.ft) { alpha = smooth(p.ft, p.ft + 0.5, t); title = 'FULL-TIME'; big = true; }

function drawIntro(ctx, t) {

/* =====================================================================
   7) KARE OLUŞTURMA — her şey yalnızca t'den yeniden hesaplanır
   ===================================================================== */
const tgtV = new THREE.Vector3();
const goalWorld = new THREE.Vector3();
function renderFrame(t) {
  const F = FORMATS[state.format], p = phases();
  const m = minuteAt(t);
  const home = pressureAt('home', m), away = pressureAt('away', m);
  const dom = dominanceAt(m);
  const gs = goalState(t);

  // --- shader uniformları
  uniforms.uTime.value = t;
  uniforms.uHome.value = home;
  uniforms.uAway.value = away;
  const tintAmt = smooth(0.02, 0.30, Math.abs(dom.d)) * 0.9 * smooth(0.03, 0.18, dom.act);
  uniforms.uTint.value.set(dom.d >= 0 ? TEAMS.home.base : TEAMS.away.base);
  uniforms.uTintAmt.value = tintAmt;
  const gAge = gs.last ? gs.age : 99;
  const goalActive = gs.last && gAge < 3;
  uniforms.uGoalAge.value = gAge;
  uniforms.uGoalAmp.value = goalActive ? 1 : 0;
  uniforms.uGoalSide.value = gs.last && gs.last.team === 'away' ? 1 : 0;
  uniforms.uGoalGlow.value = goalActive ? Math.exp(-gAge * 2.4) : 0;
  if (gs.last) uniforms.uGoalColor.value.set(TEAMS[gs.last.team].ui);
  uniforms.uReveal.value = lerp(-0.05, 1.25, easeInOut((t - p.intro * 0.1) / (p.intro * 0.75)));

  // --- kamera
  const ip = easeOutCubic(t / p.intro);
  let zoom = lerp(1.5, 1.045, ip) - 0.035 * clamp((t - p.intro) / (p.h2 - p.intro), 0, 1);
  const pulse = goalActive ? Math.sin(clamp(gAge / 1.8, 0, 1) * Math.PI) : 0;
  zoom -= 0.03 * pulse;
  const endP = easeInOut((t - p.ft) / (p.end - p.ft));
  if (t > p.ft) zoom = lerp(zoom, 1.03, endP);
  const sway = 1 - endP;
  const el = (F.el + lerp(16, 0, ip) + 1.0 * Math.sin(t * 0.23) * sway) * DEG;
  const az = (F.az + lerp(-20, 0, ip) + 1.6 * Math.sin(t * 0.17) * sway) * DEG;
  const gx = gs.last ? (gs.last.team === 'home' ? -1 : 1) * 4 * pulse : 0;
  tgtV.set(gx, 3, 0);
  camera.clearViewOffset();
  placeCamera(fitDist * zoom, el, az, tgtV);
  const b = projBox();
  const cxN = (b.x0 + b.x1) / 2, cyN = (b.y0 + b.y1) / 2, wantY = (F.top + F.bot) / 2;
  const rw = gl.width, rh = gl.height;
  camera.setViewOffset(rw, rh, cxN * rw / 2, (cyN - wantY) * rh / 2, rw, rh);

  // --- gölge
  shadowMat.opacity = (0.55 + 0.25 * Math.max(home, away)) * smooth(0.1, 0.9, uniforms.uReveal.value);
  shadow.scale.setScalar(1 + 0.05 * Math.max(home, away));

  renderer.render(scene, camera);

  // --- 2D kompozisyon
  const W = out.width, H = out.height, u = U();
  const bg = octx.createRadialGradient(W * 0.5, H * 0.48, 0, W * 0.5, H * 0.48, Math.max(W, H) * 0.75);
  bg.addColorStop(0, MATCH.bgInner); bg.addColorStop(1, MATCH.bgOuter);
  octx.globalCompositeOperation = 'source-over';
  octx.globalAlpha = 1;
  octx.fillStyle = bg; octx.fillRect(0, 0, W, H);
  // turnuva ışıması: üstten ve alttan yumuşak turuncu hale
  for (const [gy, r, a, gc] of [[-0.05, 0.72, 0.26, MATCH.glow], [1.08, 0.62, 0.16, MATCH.glow2 || MATCH.glow]]) {
    const gg = octx.createRadialGradient(W * 0.5, H * gy, 0, W * 0.5, H * gy, Math.max(W, H) * r);
    gg.addColorStop(0, hexA(gc, a)); gg.addColorStop(1, hexA(gc, 0));
    octx.fillStyle = gg; octx.fillRect(0, 0, W, H);
  }
  // ince turuncu çapraz ışık çizgileri
  octx.save(); octx.globalAlpha = 0.05; octx.strokeStyle = MATCH.glow; octx.lineWidth = 2 * u;
  for (let i = -6; i <= 12; i++) { const x = i * 180 * u + (t * 12 * u) % (180 * u); octx.beginPath(); octx.moveTo(x, 0); octx.lineTo(x - H * 0.6, H); octx.stroke(); }
  octx.restore();
  // baskın takım için hafif ortam rengi
  const tintCol = dom.d >= 0 ? TEAMS.home.ui : TEAMS.away.ui;
  const amb = octx.createRadialGradient(W * 0.5, H * 0.55, 0, W * 0.5, H * 0.55, Math.max(W, H) * 0.6);
  amb.addColorStop(0, hexA(tintCol, 0.10 * tintAmt)); amb.addColorStop(1, hexA(tintCol, 0));
  octx.fillStyle = amb; octx.fillRect(0, 0, W, H);

  octx.drawImage(gl, 0, 0, W, H);

  // gol ışık patlaması (hücum edilen kalenin ekran konumundan)
  if (goalActive && gAge < 1.6) {
    goalWorld.set(gs.last.team === 'home' ? -FIELD_L / 2 : FIELD_L / 2, 4, 0).project(camera);
    const sx = (goalWorld.x + 1) / 2 * W, sy = (1 - goalWorld.y) / 2 * H;
    const k = Math.pow(1 - gAge / 1.6, 2);
    const col = TEAMS[gs.last.team].ui;
    octx.globalCompositeOperation = 'lighter';
    const rg = octx.createRadialGradient(sx, sy, 0, sx, sy, (260 + 900 * easeOutCubic(gAge / 1.2)) * u);
    rg.addColorStop(0, hexA(col, 0.85 * k)); rg.addColorStop(0.35, hexA(col, 0.35 * k)); rg.addColorStop(1, hexA(col, 0));
    octx.fillStyle = rg; octx.fillRect(0, 0, W, H);
    octx.fillStyle = `rgba(255,255,255,${0.18 * Math.pow(1 - clamp(gAge / 0.35, 0, 1), 2)})`; octx.fillRect(0, 0, W, H);
    octx.globalCompositeOperation = 'source-over';
  }
  // vinyet
  const vg = octx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  octx.fillStyle = vg; octx.fillRect(0, 0, W, H);

  const hudA = smooth(p.intro * 0.55, p.intro, t);
  drawScoreboard(octx, t, gs, hudA);
  drawTimeline(octx, t, m, gs, hudA);
  drawGoalBanner(octx, gs);
  drawCenterCard(octx, t, gs);
  drawIntro(octx, t);
}

/* =====================================================================
   8) OYNATMA DÖNGÜSÜ, KONTROLLER, KAYIT
   ===================================================================== */
let last = performance.now(), frameAcc = 0, frameN = 0, lowTime = 0;
let dirty = true;
function loop(now) {
  const dt = Math.min(state.recording ? 0.25 : 0.1, (now - last) / 1000);
  last = now;
  if (state.playing) {
    state.t += dt;
    if (state.t >= state.duration) {
      state.t = state.duration; setPlaying(false);
      if (state.recording) stopRecording();
    }
    dirty = true;
  }
  if (dirty) {
    const t0 = performance.now();
    renderFrame(state.t);
    adaptQuality(performance.now() - t0, dt);
    syncUI();
    dirty = state.playing;
  }
  requestAnimationFrame(loop);
}
/* Cihaz yavaşsa WebGL çözünürlüğünü düşür (çıktı canvas'ı sabit kalır) */
function adaptQuality(cost, dt) {
  if (!state.playing || state.recording) return;
  frameAcc += dt; frameN++;
  if (frameN >= 45) {
    const avg = frameAcc / frameN;
    if (avg > 0.024) lowTime++; else lowTime = 0;
    if (lowTime >= 2 && quality > 0.5) {
      quality = Math.max(0.5, quality - 0.25);
      const F = FORMATS[state.format];
      renderer.setSize(Math.round(F.w * quality), Math.round(F.h * quality), false);
      lowTime = 0;
    }
    frameAcc = 0; frameN = 0;
  }
}

const btnPlay = $('btnPlay'), scrub = $('scrub'), timeLbl = $('timeLbl'), btnRec = $('btnRec');
function setPlaying(v) {
  state.playing = v;
  btnPlay.textContent = v ? '❚❚ Duraklat' : '▶ Oynat';
  if (recorder && recorder.state !== 'inactive') {
    if (!v && recorder.state === 'recording' && state.t < state.duration) recorder.pause();
    if (v && recorder.state === 'paused') recorder.resume();
  }
  last = performance.now();
  dirty = true;
}
function syncUI() {
  if (!scrubbing) scrub.value = Math.round(state.t / state.duration * 1000);
  timeLbl.textContent = `${clockText(state.t)} · ${state.t.toFixed(1)} / ${state.duration}s`;
}
btnPlay.onclick = () => {
  if (!state.playing && state.t >= state.duration) state.t = 0;
  setPlaying(!state.playing);
};
$('btnRestart').onclick = () => { state.t = 0; setPlaying(true); };
let scrubbing = false;
scrub.addEventListener('pointerdown', () => scrubbing = true);
window.addEventListener('pointerup', () => scrubbing = false);
scrub.addEventListener('input', () => { state.t = scrub.value / 1000 * state.duration; dirty = true; });
$('fmt169').onclick = () => { applyFormat('16:9'); dirty = true; };
$('fmt916').onclick = () => { applyFormat('9:16'); dirty = true; };
$('dur').onchange = e => {
  const r = state.t / state.duration;
  state.duration = +e.target.value;
  state.t = r * state.duration;
  dirty = true;
};
$('btnFull').onclick = () => {
  const el = $('app');
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsEl) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) { showMsg('Bu tarayıcı tam ekran modunu desteklemiyor.', true); return; }
  try { const r = req.call(el); if (r && r.catch) r.catch(() => showMsg('Tam ekran açılamadı.', true)); } catch { showMsg('Tam ekran açılamadı.', true); }
};
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => setTimeout(layoutCanvas, 50)));
window.addEventListener('resize', layoutCanvas);
if (window.ResizeObserver) new ResizeObserver(layoutCanvas).observe($('stage'));
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); btnPlay.click(); }
  else if (e.code === 'ArrowRight' && !state.recording) { state.t = clamp(state.t + 1, 0, state.duration); dirty = true; }
  else if (e.code === 'ArrowLeft' && !state.recording) { state.t = clamp(state.t - 1, 0, state.duration); dirty = true; }
  else if (e.key === 'f' || e.key === 'F') $('btnFull').click();
});

let msgTimer = 0;
function showMsg(text, err = false, ms = 4000) {
  const el = $('msg'); el.textContent = text; el.classList.toggle('err', err); el.classList.add('show');
  clearTimeout(msgTimer); if (ms) msgTimer = setTimeout(() => el.classList.remove('show'), ms);
}

/* --- WebM kaydı: yalnızca kompozit çıktı canvas'ı (kontroller hariç) --- */
let recorder = null, chunks = [];
function pickMime() {
  const c = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  for (const m of c) if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
function lockForRecording(v) {
  state.recording = v;
  for (const id of ['fmt169', 'fmt916', 'dur', 'btnRestart']) $(id).disabled = v;
  scrub.disabled = v;
  btnRec.classList.toggle('rec', v);
  btnRec.innerHTML = v ? '<span class="dot"></span>Kaydı durdur' : '<span class="dot"></span>WebM Kaydet';
}
function startRecording() {
  if (!out.captureStream || typeof MediaRecorder === 'undefined') {
    showMsg('Bu tarayıcı Canvas video kaydını (captureStream / MediaRecorder) desteklemiyor. Chrome, Edge veya Firefox deneyin.', true, 7000);
    return;
  }
  const mime = pickMime();
  if (!mime) { showMsg('Bu tarayıcı WebM kaydını desteklemiyor (ör. Safari). Chrome, Edge veya Firefox deneyin.', true, 7000); return; }
  let stream;
  try { stream = out.captureStream(30); } catch (e) { showMsg('Canvas akışı başlatılamadı: ' + e.message, true, 7000); return; }
  chunks = [];
  try {
    recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: state.format === '16:9' ? 14e6 : 12e6 });
  } catch (e) { showMsg('MediaRecorder başlatılamadı: ' + e.message, true, 7000); return; }
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    stream.getTracks().forEach(tr => tr.stop());
    const blob = new Blob(chunks, { type: 'video/webm' });
    lockForRecording(false);
    if (!blob.size) { showMsg('Kayıt boş oluştu.', true); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `man-utd-aston-villa-attacking-pressure-${state.format === '16:9' ? '1920x1080' : '1080x1920'}.webm`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    showMsg(`Video hazır: ${(blob.size / 1048576).toFixed(1)} MB WebM indirildi.`);
    recorder = null;
  };
  // Yüksek kalite kayıt için tam çözünürlük
  quality = 1;
  const F = FORMATS[state.format];
  renderer.setSize(F.w, F.h, false);
  lockForRecording(true);
  state.t = 0; renderFrame(0);
  recorder.start(500);
  setPlaying(true);
  showMsg(`Kayıt başladı (${F.w}×${F.h}, ${state.duration} sn). Bitince WebM otomatik indirilecek.`);
}
function stopRecording() {
  if (recorder && recorder.state !== 'inactive') { renderFrame(state.t); recorder.stop(); }
  setPlaying(false);
}
btnRec.onclick = () => { if (state.recording) stopRecording(); else startRecording(); };

/* --- Gol editörü --- */
function renderGoalEditor() {
  const box = $('goalEditor'); box.innerHTML = '';
  GOALS.forEach((g, i) => {
    const row = document.createElement('div'); row.className = 'goalRow';
    const inp = document.createElement('input'); inp.type = 'number'; inp.min = 1; inp.max = 90 + (MATCH.stop2 || 0); inp.value = g.minute; inp.title = 'Dakika';
    const sel = document.createElement('select');
    for (const k of ['home', 'away']) { const o = document.createElement('option'); o.value = k; o.textContent = TEAMS[k].code; if (g.team === k) o.selected = true; sel.appendChild(o); }
    const del = document.createElement('button'); del.textContent = '✕'; del.title = 'Golü sil';
    inp.onchange = () => { g.minute = clamp(Math.round(+inp.value || 1), 1, 90 + (MATCH.stop2 || 0)); if (g.minute <= 90) delete g.label; else g.label = '90+' + (g.minute - 90); inp.value = g.minute; sortGoals(); };
    sel.onchange = () => { g.team = sel.value; sortGoals(); };
    del.onclick = () => { GOALS.splice(i, 1); sortGoals(); };
    row.append(document.createTextNode("dk "), inp, sel, del);
    box.appendChild(row);
  });
  const add = document.createElement('button'); add.textContent = '+ Gol ekle';
  add.onclick = () => { GOALS.push({ minute: Math.max(1, Math.min(90, Math.round(minuteAt(state.t)) || 1)), team: 'home' }); sortGoals(); };
  box.appendChild(add);
}
function sortGoals() { GOALS.sort((a, b) => a.minute - b.minute); renderGoalEditor(); dirty = true; }

/* --- Temizlik --- */
window.addEventListener('pagehide', () => {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  surfGeo.dispose(); skirt.geometry.dispose(); surfMat.dispose(); skirtMat.dispose();
  shadow.geometry.dispose(); shadowMat.dispose(); uniforms.uLines.value.dispose(); renderer.dispose();
});
gl.addEventListener('webglcontextlost', e => { e.preventDefault(); setPlaying(false); showMsg('WebGL bağlamı kayboldu; sayfayı yenileyin.', true, 0); });

/* --- Başlat --- */
if (Math.min(screen.width, screen.height) < 700) quality = 0.75;
applyFormat('16:9');
renderGoalEditor();
const fontsReady = document.fonts ? Promise.race([
  Promise.all([document.fonts.load(`800 100px "Barlow Condensed"`), document.fonts.load(`700 40px "Barlow Condensed"`), document.fonts.load(`600 20px Barlow`), document.fonts.load(`700 20px Barlow`)]),
  new Promise(r => setTimeout(r, 2500)),
]) : Promise.resolve();
fontsReady.then(() => {
  buildTimelineCache();
  dirty = true;
  requestAnimationFrame(t => { last = t; loop(t); });
  setPlaying(true);
});
// test/otomasyon için
window.__pressure = { state, renderFrame, minuteAt, goalState, pressureAt, setPlaying, applyFormat };
</script>
</body>
</html>
