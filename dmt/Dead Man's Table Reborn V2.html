          C.splice(i, 1); continue;
        }
        if (I.inside && U.dist(I.x, I.y, c.x, c.y - c.z - 2) <= mag) this.collectCoin(c);
      }
      if (this.missRecent >= 3) { if (this.faro.say('coinMiss', { priority: 1, catGap: 18 })) this.missRecent = 0; }
    },
    collectCoin(c) {
      if (c.collected) return;
      c.collected = true; c.flyT = 0; c.sx = c.x; c.sy = c.y - c.z;
      RunM.addCoins(this.run, c.val, 'drop');
      this.coinPulse = 1;
      this.emit('onCoin', c);
      DMT.Audio.play('coin');
      this.parts.burst(c.x, c.y - c.z, 4, { c: [P.gold4, P.gold3, '#fff'], min: 10, max: 35, life: 0.3 });
    },
    pointerDown(x, y) {
      if (this.phase === 'fight' || this.phase === 'ending') {
        const r = this.stats.magnet * 1.8; let got = 0;
        for (const c of this.coins) if (!c.collected && U.dist(x, y, c.x, c.y - c.z) <= r) { this.collectCoin(c); got++; }
        if (got) this.fx.push({ kind: 'grab', x, y, t: 0, life: 0.2, r });
      }
    },

    updatePending(dt) {
      for (let i = this.pending.length - 1; i >= 0; i--) {
        const p = this.pending[i]; p.t -= dt;
        if (p.t <= 0) {
          this.pending.splice(i, 1);
          if (p.kind === 'powder') this.explode(p.x, p.y, 18, this.stats.dmg * 0.5, p.depth, 'powder', 'powderKeg');
          else if (p.kind === 'doom') this.explode(p.x, p.y, 54, this.stats.dmg * this.cv('doomSeed').mult, p.depth, 'doom', 'doomSeed');
          else if (p.kind === 'gold') this.explode(p.x, p.y, 40, this.stats.dmg * 2, p.depth, 'gold', 'bountyHunter');
          else this.explode(p.x, p.y, 26 + 3 * (p.n - 1), this.stats.dmg * (0.45 + 0.15 * (p.n - 1)), p.depth, 'corpse', 'corpseBlast');
        }
      }
      // gecikmeli kart eylemleri (İkiz Darbe, ikramiye yıldırımları…) — run bitince çalışmaz
      for (let i = this.timers.length - 1; i >= 0; i--) { const tm = this.timers[i]; tm.t -= dt; if (tm.t <= 0) { this.timers.splice(i, 1); if (!this.run.ended && !this.hero.dead) tm.fn(); } }
      if (this.chainT > 0) { this.chainT -= dt; if (this.chainT <= 0) { if (this.chainKills >= 4) { this.faro.say('combo', { priority: 2, catGap: 12 }); this.faro.act('surprised', 1.0); this.floatText(this.hero.x, this.hero.y - 34, 'ZİNCİR x' + this.chainKills, P.toxic, 9); } this.run.maxCombo = Math.max(this.run.maxCombo, this.chainKills); this.chainKills = 0; } }
    },
    updateFx(dt) {
      for (let i = this.fx.length - 1; i >= 0; i--) { const f = this.fx[i]; f.t += dt; if (f.t >= f.life) this.fx.splice(i, 1); }
      for (let i = this.texts.length - 1; i >= 0; i--) { const t = this.texts[i]; t.t += dt; t.y += t.vy * dt; t.vy *= Math.pow(0.1, dt); if (t.t >= t.life) this.texts.splice(i, 1); }
    },
    dmgText(x, y, n, crit, color) {
      if (this.texts.length > 46) this.texts.shift();
      this.texts.push({ x, y, txt: String(n), color: color || (crit ? '#ffcf3a' : '#f4ecdc'), t: 0, life: crit ? 0.8 : 0.55, vy: -38, size: crit ? 9 : 6.5, crit });
    },
    floatText(x, y, txt, color, size = 7) { this.texts.push({ x, y, txt, color, t: 0, life: 1.1, vy: -22, size, label: true }); },

    // ================== FARO RUH HÂLİ ==================
    updateFaroMood(dt) {
      const f = this.faro, h = this.hero;
      while (this.killTimes.length && this.elapsed - this.killTimes[0] > 3) this.killTimes.shift();
      if (this.killTimes.length >= 7) { if (f.say('multiKill', { priority: 1, catGap: 10 })) { f.setMood('surprised', 3); f.act('surprised', 1.0); } this.killTimes.length = 0; }
      const frac = h.hp / this.stats.maxHp;
      if (!h.dead && frac < 0.35) { f.setMood('amused', 2); if (this.elapsed - this.lowSaid > 14) { if (f.say('lowHp', { priority: 2, catGap: 14 })) { this.lowSaid = this.elapsed; f.act('laugh', 1.1); } } }
      if (frac > 0.8 && this.run.kills > this.elapsed * 0.9 && this.elapsed > 25) { this.doingWell += dt; if (this.doingWell > 10) { this.doingWell = 0; if (f.say('annoyed', { priority: 1, catGap: 25 })) { f.setMood('annoyed', 4); f.act('annoyed', 1.4); } } }
      if (f.quietFor > 11 && !f.bubble) { if (f.say(U.chance(0.5) ? 'bored' : 'boredReturn', { priority: 0, catGap: 22 })) { f.setMood('bored', 5); f.act('bored', 2.5); if (U.chance(0.4)) this.intervene('spawnPause', 'ivPause', () => { this.spawnPauseT = 8; this.floatText(320, 132, 'ÖLÜLER TATİLDE', '#88ddff', 8); }); } }
    },

    // ================== RUN SONU ==================
    endRun(won) {
      const run = this.run;
      if (run.ended) return;
      run.ended = true; run.won = won; run.time = Math.min(this.tdef.dur + Math.max(0, run.timeAdded || 0), this.elapsed); run.hpEnd = Math.max(0, this.hero.hp) / this.stats.maxHp;
      if (this.modal) { DMT.UI.remove('modal'); this.modal = null; }
      this.phase = 'ending'; this.endT = 0;
      this.pending.length = 0;
      // V2: tüm kart etkileri güvenle durur
      this.timers.length = 0; this.zones.length = 0; this.summons.length = 0; this.run.tmp.dance = 0; this.run.tmp.adr = 0;
      if (won) {
        this.faro.act(this.hero.hp / this.stats.maxHp < 0.25 ? 'surprised' : 'annoyed', 2.2);
        this.faro.say('win', { priority: 3 });
        DMT.Audio.play('fanfare');
        this.showBanner('HAYATTA KALDIN', 'Kalan coinleri hemen topla!', P.gold4, 3.2);
      } else {
        this.faro.act('celebrate', 2.8);
        this.faro.say('lose', { priority: 3 });
        DMT.Audio.play('defeat'); setTimeout(() => DMT.Audio.play('laugh'), 500);
        this.showBanner('MASA KAZANDI', 'Kahraman düştü', '#ff5050', 3.0);
      }
    },
  });
})();

// ============================================================
//  23b KART ETKİ SİSTEMİ (V2) — olay tabanlı kart davranışları
//  Olaylar: onHit, onKill, onCrit, onAttack, onDamageTaken, onProjectileHit, onInterval,
//           onEnemySpawn, onRunStart, onCoin, onAcquire. Her işleyici (S, ctx, yığın) alır.
//  Yeni kart eklemek: DMT.Data.CARDS'a tanım + buraya işleyici + DMT.Art ikonu.
//  Güvenlik: hero öldüğünde / run bittiğinde emit() hiçbir şey çalıştırmaz; iç içe olay derinliği sınırlı;
//  patlama zincirleri derinlik (depth<4) ile, alanlar/yardımcılar sayı sınırı ile korunur.
// ============================================================
DMT.CardFx = (function () {
  const fx = {
    // ---------------- PATLAMA ----------------
    powderKeg: {
      onKill(S, c, n) { if (c.depth < 4 && U.chance(Math.min(0.6, n * S.cv('powderKeg').ch))) S.pending.push({ t: 0.1, x: c.e.x, y: c.e.y - 6, depth: c.depth + 1, n: 1, kind: 'powder' }); },
    },
    doomSeed: {
      onInterval(S, dt) {
        const v = S.cv('doomSeed');
        S.cardT.doom = (S.cardT.doom == null ? 2 : S.cardT.doom) - dt;
        if (S.cardT.doom <= 0) {
          S.cardT.doom = v.every;
          let best = null; for (const e of S.enemies) if (!e.dying && e.spawnT <= 0 && !(e.doom > 0) && (!best || e.hp > best.hp)) best = e;
          if (best) { best.doom = v.fuse; best.doomMax = v.fuse; DMT.Audio.play('curseWarn'); S.floatText(best.x, best.y - 26, 'TOHUM', '#ff5a5a', 6.5); }
        }
        for (const e of S.enemies) if (e.doom > 0 && !e.dying) { e.doom -= dt; if (e.doom <= 0) S.doomBlast(e); }
      },
      onKill(S, c) { if (c.e.doom > 0) S.doomBlast(c.e); },
    },
    // ---------------- YILDIRIM / BÜYÜ ----------------
    staticCharge: {
      onHit(S, c, n) {
        const e = c.e; if (e.dying) return;
        S.charge(e, 1, n);
      },
      // ölen düşmanın yükü en yakın düşmana iletilir (zayıf düşmanlarda da tetiklenir)
      onKill(S, c, n) {
        const e = c.e; if (!(e.charge > 0)) return;
        const o = S.nearestEnemy(e.x, e.y, 70); if (!o || o === e) return;
        S.fx.push({ kind: 'bolt', pts: S.jag(e.x, e.y - 10, o.x, o.y - 10, 3), t: 0, life: 0.14, color: '#3b5089' });
        S.charge(o, e.charge, n); e.charge = 0;
      },
    },
    conductor: {
      onInterval(S, dt) {
        S.cardT.cond = (S.cardT.cond == null ? 2 : S.cardT.cond) - dt;
        if (S.cardT.cond > 0) return;
        S.cardT.cond = S.cv('conductor').every;
        const h = S.hero, e = S.nearestEnemy(h.x, h.y, 150); if (!e) return;
        S.fx.push({ kind: 'bolt', pts: S.jag(h.x, h.y - 16, e.x, e.y - 10, 4), t: 0, life: 0.2, color: P.cyan });
        DMT.Audio.play('zap');
        S.damage(e, S.stats.dmg * 0.9 * S.stats.boltMul, { depth: 1, color: P.cyan, quiet: true, src: 'conductor' });
      },
    },
    arcaneMissile: {
      onInterval(S, dt, n) {
        const v = S.cv('arcaneMissile');
        S.cardT.arc = (S.cardT.arc == null ? 1 : S.cardT.arc) - dt;
        if (S.cardT.arc > 0) return;
        S.cardT.arc = v.every;
        const h = S.hero, L = S.enemies.filter((e) => !e.dying && e.spawnT <= 0);
        if (!L.length) { S.cardT.arc = 0.4; return; }
        for (let i = 0; i < n + 1; i++) {
          const e = L[(i + U.randi(0, L.length - 1)) % L.length], a = -Math.PI / 2 + U.rand(-1.1, 1.1);
          S.proj.push({ kind: 'missile', x: h.x, y: h.y - 18, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, dmg: S.stats.dmg * v.mult * S.stats.boltMul, life: 1.8, depth: 1, target: e, src: 'arcaneMissile' });
        }
        DMT.Audio.play('ghost');
      },
    },
    stormCrown: {
      onCrit(S, c) { if (U.chance(S.cv('stormCrown').ch)) S.chainLightning(c.e, c.dmg * 0.5, 'stormCrown'); },
    },
    // ---------------- KANAMA ----------------
    hemorrhage: {
      onKill(S, c, n) { if (c.e.bleed || U.chance(0.25)) { const v = S.cv('hemorrhage'); S.addZone('blood', c.e.x, c.e.y, v.r + 4 * (n - 1), v.dur, n); } },
    },
    bloodFeast: {
      onKill(S, c) {
        const e = c.e; if (!e.bleed) return;
        const v = S.cv('bloodFeast');
        const near = S.enemies.filter((o) => o !== e && !o.dying && o.spawnT <= 0 && U.dist(o.x, o.y, e.x, e.y) < 80).sort((a, b) => U.dist2(a.x, a.y, e.x, e.y) - U.dist2(b.x, b.y, e.x, e.y)).slice(0, v.jumps);
        for (const o of near) {
          S.applyBleed(o, Math.min(e.bleed.dps * 1.25, S.stats.dmg * 0.8), 3, 'bloodFeast');
          S.fx.push({ kind: 'bloodArc', x0: e.x, y0: e.y - 8, x1: o.x, y1: o.y - 8, t: 0, life: 0.3 });
        }
        if (S.heal(v.heal, 'bloodFeast') > 0) S.parts.spawn({ x: S.hero.x, y: S.hero.y - 20, vx: 0, vy: -20, life: 0.5, c: '#ff5a6a', s: 2 });
      },
    },
    // ---------------- HAYALET ----------------
    soulHarvest: {
      onKill(S, c, n) {
        const alive = S.summons.filter((m) => m.kind === 'spirit').length;
        if (alive < 2 + n && U.chance(0.08 + 0.04 * n)) S.summons.push({ kind: 'spirit', x: c.e.x, y: c.e.y - 10, ang: Math.random() * 6.28, cd: 0.4, life: S.cv('soulHarvest').life, t: 0 });
      },
    },
    // ---------------- KRİTİK / HIZ ----------------
    adrenaline: {
      onCrit(S) { const t = S.run.tmp, v = S.cv('adrenaline'); S.cardT.adr = v.dur; if (t.adr < v.max) { t.adr++; S.recalc(); } },
      onInterval(S, dt) { const t = S.run.tmp; if (t.adr > 0) { S.cardT.adr -= dt; if (S.cardT.adr <= 0) { t.adr = 0; S.recalc(); } } },
    },
    deathDance: {
      onCrit(S) {
        const t = S.run.tmp, v = S.cv('deathDance'); if (t.dance > 0) return;
        S.cardT.danceN = (S.cardT.danceN || 0) + 1;
        if (S.cardT.danceN >= v.need) {
          S.cardT.danceN = 0; t.dance = v.dur; S.recalc();
          S.floatText(S.hero.x, S.hero.y - 34, 'ÖLÜM DANSI!', '#ffcf3a', 8.5); DMT.Audio.play('frenzy'); S.shake = Math.max(S.shake, 1.5);
        }
      },
      onInterval(S, dt) { const t = S.run.tmp; if (t.dance > 0) { t.dance -= dt; if (t.dance <= 0) { t.dance = 0; S.recalc(); } } },
    },
    // ---------------- ŞANS / COIN ----------------
    luckyDice: {
      onAcquire(S) {
        const r = U.randi(0, 6), h = S.hero;
        if (r) { DMT.Run.addCoins(S.run, r, 'refund'); S.coinPulse = 1; DMT.Audio.play('coin'); }
        S.floatText(h.x, h.y - 44, 'ZAR: ' + r + (r ? ' coin iade' : ' — boş'), r >= 4 ? P.gold4 : P.bone2, 7);
      },
    },
    gamblerWrath: {
      onCoin(S, c, n) { const per = S.cardT.gwPer || S.cv('gamblerWrath').per; S.cardT.gw = (S.cardT.gw || 0) + c.val; if (S.cardT.gw >= per) { S.cardT.gw -= per; S.shards(5 * n); } },
      onDamageTaken(S, c, n) { if (U.chance(0.3)) S.shards(3 * n); },
    },
    bountyHunter: {
      onEnemySpawn(S, e, n) { S.cardT.bounty = (S.cardT.bounty || 0) + 1; if (S.cardT.bounty >= 10 - 3 * n) { S.cardT.bounty = 0; e.bounty = true; } },
      onKill(S, c, n) {
        const e = c.e;
        if (e.bounty) {
          for (let i = 0; i < 2; i++) S.dropCoin(e.x, e.y);
          S.pending.push({ t: 0.08, x: e.x, y: e.y - 6, depth: Math.min(4, c.depth + 1), n: 1, kind: 'gold' });
          S.floatText(e.x, e.y - 28, 'ÖDÜL!', P.gold4, 7.5);
        }
        if (c.depth >= 1 && U.chance(0.2 * n)) S.dropCoin(e.x, e.y);
      },
    },
    jackpot: {
      onKill(S) { S.cardT.jp = (S.cardT.jp || 0) + 1; if (S.cardT.jp >= S.cv('jackpot').every) { S.cardT.jp = 0; S.later(0.05, () => S.spinJackpot()); } },
    },
  };
  return fx;
})();

(function () {
  const D = DMT.Data, S = DMT.FightScene, FX = DMT.CardFx;
  const AR = S.AR;
  const st = (run, id) => run.cards[id] || 0;
  Object.assign(S, {
    cv(id) { return D.cardById(id).v; },
    refreshFxIds() { this.fxIds = Object.keys(this.run.cards).filter((id) => FX[id]); },
    // merkezi olay dağıtıcısı
    emit(evt, ctx) {
      if (!this.fxIds.length || this.hero.dead || this.run.ended) return;
      if (this._emitDepth > 3) return; // iç içe tetiklemelerde güvenlik sınırı
      this._emitDepth++;
      try {
        for (const id of this.fxIds) { const hnd = FX[id][evt]; if (hnd) hnd(this, ctx, this.run.cards[id] || 0); }
      } catch (e) { console.error('[DMT] kart etkisi hatası', evt, e); }
      finally { this._emitDepth--; }
    },
    later(t, fn) { if (this.timers.length < 40) this.timers.push({ t, fn }); },
    charge(e, k, n) {
      e.chargeMax = Math.max(2, 4 - n); e.charge = (e.charge || 0) + k;
      if (e.charge >= e.chargeMax) { e.charge = 0; this.smallBolt(e, this.stats.dmg * this.cv('staticCharge').mult * (1 + 0.2 * (n - 1)), 'staticCharge'); }
    },
    applyBleed(e, dps, t, src) {
      if (!e || e.dying) return;
      t += st(this.run, 'leechAura') ? 1 : 0;
      const b = e.bleed;
      if (b && b.dps > dps && b.t > 0.5) { b.t = Math.max(b.t, t); return; }
      e.bleed = { t: Math.max(t, b ? b.t : 0), dps, src };
    },
    leech(a) {
      const n = st(this.run, 'leechAura'); if (!n) return;
      this.healAcc += a * n * this.cv('leechAura').heal;
      if (this.healAcc >= 1) { const k = Math.floor(this.healAcc); this.healAcc -= k; if (this.heal(k, 'leechAura') > 0 && Math.random() < 0.3) this.parts.spawn({ x: this.hero.x + U.rand(-4, 4), y: this.hero.y - 16, vx: 0, vy: -18, life: 0.4, c: '#ff5a6a', s: 1 }); }
    },
    luckFx(e, good) {
      if (good) { this.floatText(e.x, e.y - 30, 'ŞANS!', P.gold4, 7); this.parts.burst(e.x, e.y - 10, 5, { c: [P.gold4, '#fff'], min: 20, max: 50, life: 0.3 }); DMT.Audio.play('coinDrop'); }
      else if (Math.random() < 0.5) this.floatText(e.x, e.y - 30, 'ıska…', P.bone3, 6);
    },
    jag(x0, y0, x1, y1, n) { const pts = [[x0, y0]]; for (let i = 1; i < n; i++) pts.push([U.lerp(x0, x1, i / n) + U.rand(-5, 5), U.lerp(y0, y1, i / n) + U.rand(-5, 5)]); pts.push([x1, y1]); return pts; },
    smallBolt(e, dmg, src) {
      this.fx.push({ kind: 'bolt', pts: this.jag(e.x + U.rand(-8, 8), e.y - 46, e.x, e.y - 8, 4), t: 0, life: 0.2, color: P.cyan });
      DMT.Audio.play('zap');
      this.damage(e, dmg * this.stats.boltMul, { depth: 1, color: P.cyan, src });
    },
    doomBlast(e) {
      if (!(e.doom > 0) && !e.doomMax) return;
      e.doom = 0; e.doomMax = 0;
      this.pending.push({ t: 0.05, x: e.x, y: e.y - 6, depth: 1, n: 1, kind: 'doom' });
      this.floatText(e.x, e.y - 30, 'KIYAMET!', '#ff5a5a', 9);
    },
    shards(k) {
      const h = this.hero, s = this.stats, v = this.cv('gamblerWrath');
      if (this.proj.length > 120) return;
      for (let i = 0; i < k; i++) {
        const a = (i / k) * Math.PI * 2 + U.rand(-0.2, 0.2);
        this.proj.push({ kind: 'shard', x: h.x, y: h.y - 10, vx: Math.cos(a) * 210, vy: Math.sin(a) * 160, dmg: s.dmg * v.mult, life: 0.7, depth: 1, src: 'gamblerWrath', pierce: 2 });
      }
      DMT.Audio.play('coinDrop');
    },
    spinJackpot() {
      const h = this.hero, s = this.stats; if (h.dead || this.run.ended) return;
      const res = U.pick(['gold', 'storm', 'shield', 'blast', 'heal']);
      const names = { gold: 'Altın yağmuru', storm: 'Yıldırım fırtınası', shield: 'Kemik kalkan: 4 sn dokunulmazlık', blast: 'Dev patlama', heal: 'Can %40 doldu' };
      DMT.Audio.play('feast'); this.faro.act('surprised', 1.0);
      this.showBanner('BÜYÜK İKRAMİYE!', names[res], P.gold4, 1.8);
      this.fx.push({ kind: 'wheel', x: h.x, y: h.y - 40, t: 0, life: 0.9, res });
      if (res === 'gold') { for (let i = 0; i < 6; i++) this.dropCoin(h.x + U.rand(-34, 34), h.y + U.rand(-14, 14)); }
      else if (res === 'storm') { for (let i = 0; i < 8; i++) this.later(0.12 + i * 0.14, () => { const e = this.randomEnemy(); if (e) this.lightningStrike(e, 'jackpot'); }); }
      else if (res === 'shield') { h.inv = 4; this.cardT.shield = 4; this.hauntRing(70); }
      else if (res === 'blast') this.explode(h.x, h.y - 6, 85, s.dmg * 4, 1, 'jackpot', 'jackpot');
      else { this.heal(s.maxHp * 0.4, 'jackpot'); this.addBuff('mgBuff', 5); }
    },
    // ---------- zemin alanları: kor (Kor Yığını) ve kan gölü (Kan Gölü) ----------
    addZone(kind, x, y, r, life, n) {
      y = U.clamp(y, AR.y0 + 4, AR.y1);
      for (const z of this.zones) if (z.kind === kind && U.dist(z.x, z.y, x, y) < Math.max(z.r, r) * 0.7) { z.life = z.t + life; z.r = Math.min(40, Math.max(z.r, r)); z.n = Math.max(z.n, n); return; }
      if (this.zones.length >= 12) this.zones.shift();
      this.zones.push({ kind, x, y, r: Math.min(40, r), t: 0, life, n, tick: 0.15, seed: Math.random() * 100 });
    },
    updateZones(dt) {
      const s = this.stats;

        if (bleed) this.applyBleed(o, dmg * 0.25, 3, 'kanliYorunge');

      }
      if (hit && !one) this.fx.push({ kind: 'ring', x: e.x, y: e.y - 4, r: r * 0.8, t: 0, life: 0.2, color: bleed ? '#e0404e' : '#e8dcc0' });
    },
    whirlwind() {
      const h = this.hero, v = this.cv('kizilKasirga');

      this.parts.burst(h.x, h.y - 8, 14, { c: ['#c0263a', '#ff5a5a', '#e8dcc0'], min: 40, max: 110, life: 0.35, drag: 0.05 });
      DMT.Audio.play('swing'); this.shake = Math.max(this.shake, 1.5);
      for (const e of this.enemies) { if (e.dying || e.spawnT > 0) continue; if (U.dist(h.x, h.y, e.x, e.y) <= v.r + e.r) this.damage(e, this.stats.dmg * v.pct * this.v3DmgMul(e), { depth: 1, kb: 80, fromX: h.x, fromY: h.y, quiet: true, src: 'kizilKasirga' }); }
    },
    volley(n) {
      const h = this.hero, L = this.enemies.filter((e) => !e.dying && e.spawnT <= 0 && !e.phased).sort((a, b) => U.dist2(a.x, a.y, h.x, h.y) - U.dist2(b.x, b.y, h.x, h.y)).slice(0, n);
      for (const e of L) { const a = Math.atan2(e.y - 8 - (h.y - 10), e.x - h.x); this.proj.push({ kind: 'arrow', x: h.x, y: h.y - 12, vx: Math.cos(a) * 300, vy: Math.sin(a) * 300, life: 0.9, depth: 0, mult: 0.8, volley: true }); }

    },
    // Lyra ok eklentileri: sekme, patlama, zehir (ok bir düşmana çarptığında)
    arrowExtras(p, e) {
      const run = this.run, s = this.stats;
      if (p.ric) return; // sekme okları tekrar sekmez
      const base = s.dmg * (p.mult || 1);
      const chain = st(run, 'ciftSekme') ? this.cv('ciftSekme').m : st(run, 'okFirtinasi') ? [this.cv('okFirtinasi').pct] : null;
      if (chain) {
        let from = e; const used = new Set([e]);
        chain.forEach((pct, i) => this.later(0.06 + i * 0.08, () => {
          let best = null, bd = 120 * 120;
          for (const o of this.enemies) { if (o.dying || o.spawnT > 0 || used.has(o)) continue; const d = U.dist2(from.x, from.y, o.x, o.y); if (d < bd) { bd = d; best = o; } }
          if (!best) return; used.add(best);
          this.fx.push({ kind: 'bolt', pts: [[from.x, from.y - 10], [best.x, best.y - 10]], t: 0, life: 0.12, color: '#c8d0dc' });
          this.damage(best, base * pct * this.v3DmgMul(best), { depth: 1, color: '#c8d0dc', kb: 10, fromX: from.x, fromY: from.y, src: st(run, 'ciftSekme') ? 'ciftSekme' : 'okFirtinasi' });
          if (st(run, 'zehirliOk')) this.applyPoison(best, base);
          from = best;
        }));
      }
      const blast = st(run, 'barutCekirdegi') ? this.cv('barutCekirdegi') : st(run, 'patlayanOk') ? this.cv('patlayanOk') : null;
      if (blast) {

        this.fx.push({ kind: 'boom', x: e.x, y: e.y - 6, r, t: 0, life: 0.25, style: 'powder' });
        for (const o of this.enemies) { if (o === e || o.dying || o.spawnT > 0) continue; if (U.dist(o.x, o.y, e.x, e.y) <= r + o.r) this.damage(o, base * blast.pct * s.blastD, { depth: 1, quiet: true, kb: 30, fromX: e.x, fromY: e.y, src: st(run, 'barutCekirdegi') ? 'barutCekirdegi' : 'patlayanOk' }); }
      }

    applyPoison(e, base) {
      if (!e || e.dying) return;

      e.poison = { t: v.dur, dps: Math.max(e.poison ? e.poison.dps : 0, base * v.dps * n), acc: e.poison ? e.poison.acc : 0, tick: 0 };
    },
    poisonBloom(x, y, v, depth) {

      DMT.Audio.play('boom');
      for (const o of this.enemies) { if (o.dying || o.spawnT > 0) continue; if (U.dist(o.x, o.y, x, y) <= r + o.r) { this.damage(o, s.dmg * v.mult, { depth, quiet: true, color: '#8ad35a', src: 'zehirCicegi' }); this.applyPoison(o, s.dmg); } }
    },
    // ---------------- düşman güncellemesi eklentileri ----------------
    v3EnemyPre(e, dt) { // true → bu karede hareket/saldırı yok
      // zehir
      if (e.poison) {
        const z = e.poison; z.t -= dt; z.acc += z.dps * dt; z.tick += dt;
        if (z.tick >= 0.5) { z.tick = 0; if (z.acc >= 1) { const a = Math.floor(z.acc); z.acc -= a; this.damage(e, a, { depth: 1, quiet: true, color: '#8ad35a', src: st(this.run, 'zehirliOk') ? 'zehirliOk' : 'zehirCicegi' }); this.parts.spawn({ x: e.x + U.rand(-3, 3), y: e.y - 8, vx: 0, vy: -12, life: 0.4, c: '#8ad35a', s: 1 }); if (e.dying) return true; } }
        if (e.poison && e.poison.t <= 0) e.poison = null;
      }
      // Hayalet: saydamlaşma
      if (e.def.phase) { e.phaseT -= dt; if (e.phaseT <= 0) { e.phased = !e.phased; e.phaseT = e.phased ? 1.1 : U.rand(1.6, 2.6); } }
      // Fantom: kahramanın yakınına ışınlanma
      if (e.def.teleport && !this.hero.dead) {
        e.tpT -= dt;
        if (e.tpT <= 0) {
          e.tpT = e.def.teleport + U.rand(-0.5, 0.5);
          const a = Math.random() * Math.PI * 2, d = U.rand(46, 70);
          this.parts.burst(e.x, e.y - 8, 8, { c: ['#5e4a8a', '#b46cff', '#1a1028'], min: 10, max: 40, life: 0.4 });
          e.x = U.clamp(this.hero.x + Math.cos(a) * d, AR.x0 + 8, AR.x1 - 8); e.y = U.clamp(this.hero.y + Math.sin(a) * d * 0.6, AR.y0 + 8, AR.y1);
          this.parts.burst(e.x, e.y - 8, 8, { c: ['#5e4a8a', '#b46cff', '#e0b0ff'], min: 10, max: 40, life: 0.4 }); DMT.Audio.play('ghost');
        }
      }
      // donma (Donma Topu / Faro donması)
      if ((e.frozenT || 0) > 0) { e.frozenT -= dt; e.moving = false; e.atk = 0; return true; }
      if (this.em.freezeT > 0) { e.moving = false; e.atk = 0; return true; }
      return false;
    },
    // ---------------- ana V3 güncellemesi (savaş fazında, kahraman yaşarken) ----------------
    updateV3(dt) {
      const run = this.run, h = this.hero, em = this.em;
      // sayaçlar
      for (const k of ['atkT', 'shieldT', 'slowT', 'sayT', 'invulnT', 'invisT', 'freezeT', 'thickT', 'wardT']) if (em[k] > 0) em[k] -= dt;
      for (const k of ['heroFrozenT', 'noCoinT', 'spawnPauseT', 'spawnSlowT', 'weakT', 'forcedT', 'streakLockT']) if (this[k] > 0) this[k] -= dt;
      if (this.offerEveryT > 0) { this.offerEveryT -= dt; if (this.offerEveryT <= 0) this.offerEvery = 6; }
      // seri sönümü
      if (run.streak > 0 && this.streakLockT <= 0) { this.streakT -= dt; if (this.streakT <= 0) run.streak = 0; }
      // Kılıç Fırtınası bitti → kalıcı ceza
      if (this.swordStorm && !run.buffs.some((b) => b.id === 'swordStorm')) { this.swordStorm = false; run.mods.dmg *= 1 - this.cv('kilicFirtinasi').pen; this.recalc(); this.floatText(h.x, h.y - 36, 'FIRTINA DİNDİ -%10', '#ff8866', 7); }
      // Hız Tanrısı (tuzak): can emilimi
      if (run.buffs.some((b) => b.id === 'trapSpeed') && h.hp > 1) { this.drainAcc = (this.drainAcc || 0) + this.stats.maxHp * 0.03 * dt; if (this.drainAcc >= 1) { const k = Math.floor(this.drainAcc); this.drainAcc -= k; h.hp = Math.max(1, h.hp - k); } }
      // Faro'nun huyu
      if (this.temperSayT > 0) { this.temperSayT -= dt; if (this.temperSayT <= 0) { const tp = DMT.FaroMemory.temper; this.faro.say('temper' + tp.charAt(0).toUpperCase() + tp.slice(1), { priority: 2 }); this.floatText(320, 104, 'FARO BU GECE ' + TEMPERS[tp], '#e0c070', 7); } }
      // Faro'nun bahsi
      if (this.bet) {
        this.bet.t -= dt;
        if (this.bet.kills >= this.bet.need) { this.bet = null; run.mods.dmg *= 1.15; this.recalc(); this.showBanner('BAHSİ KAZANDIN', 'Hasar +%15', P.toxic, 1.8); this.faro.act('annoyed', 1.2); this.faro.say('trapAvoided', { priority: 2 }); }
        else if (this.bet.t <= 0) { this.bet = null; this.takeCoins(8); this.showBanner('BAHSİ KAYBETTİN', 'Faro 8 coin aldı', '#ff6a5a', 1.8); this.faro.act('laugh', 1.2); }
      }
      // ek mini oyun (Faro'nun Gözü)
      if (this.mgExtraAt != null && this.elapsed >= this.mgExtraAt && !this.event && !this.modal && this.offerT > 1.5) { this.mgExtraAt = null; this.mgDone = false; this.openMinigame(); return; }
      this.updateTableRule(dt);
      this.updateFreeze(dt);

      this.ivSec -= dt;
      if (this.ivSec <= 0) {
        this.ivSec = 1;
        if (this.elapsed >= 14 && run.kills <= Math.max(3, this.elapsed * 0.45) && U.chance(0.2)) this.intervene('addTime', 'ivAddTime', () => this.addTime(8));
        if (h.hp / this.stats.maxHp < 0.3 && U.chance(0.12)) this.intervene('reluctantHelp', 'reluctantHelp', () => { this.heal(this.stats.maxHp * 0.2, 'faro'); this.floatText(h.x, h.y - 36, 'FARO YARDIM ETTİ?', '#e8dcc0', 7); }, 0.8);
      }
      // kural kaprisi (bir kez)
      if (!this.capriceUsed && this.elapsed >= this.capriceCheck) {
        if (U.chance(0.35)) this.ruleCaprice(); else this.capriceCheck = this.elapsed + U.rand(15, 25);
      }
      // Faro'nun kesesi
      this.purse.t -= dt;
      if (this.purse.t <= 0) { this.purse.t = U.rand(12, 18); if (this.elapsed > 20 && U.chance(0.55)) this.purseEvent(); }
      // Ev Sigortası: masa fazla boşalırsa
      const alive = this.enemies.reduce((n, e) => n + (e.dying ? 0 : 1), 0);
      if (this.elapsed > 20 && alive <= 1 && !this.freeze) { this.lowAliveT += dt; if (this.lowAliveT > 2 && this.purse.vault >= 40 && (this.purse.used.houseInsurance || 0) < 2) { this.lowAliveT = 0; this.purse.used.houseInsurance = (this.purse.used.houseInsurance || 0) + 1; this.purse.vault -= 40; this.faro.say('purseHouseInsurance', { priority: 3 }); this.later(1.2, () => this.spawnN(5)); } }

    },
    // ---------------- Masa II: Kırık Ayna (yansıma, çatlak zemin, kuşatma) ----------------
    updateTableRule(dt) {
      const sp = this.special; if (!sp) return;
      if (sp.cracks) {
        this.crackT -= dt;
        if (this.crackT <= 0) {
          this.crackT = sp.crackEvery; this.cracks = [];
          for (let i = 0; i < sp.cracks; i++) this.cracks.push({ x: U.rand(AR.x0 + 60, AR.x1 - 60), y: U.rand(AR.y0 + 30, AR.y1 - 20), r: U.rand(24, 34), seed: Math.random() * 100, t: 0 });
          DMT.Audio.play('shatter');
        }
        for (const c of this.cracks) c.t += dt;
      }
      if (sp.swarmCap) {
        const alive = this.enemies.reduce((n, e) => n + (e.dying ? 0 : 1), 0);
        if (alive >= sp.swarmCap) {
          if (!this.overrunWarned) { this.overrunWarned = true; this.showBanner('KUŞATILIYORSUN!', 'Kalabalığı ' + sp.swarmGrace + ' sn içinde azalt', '#ff5050', 2); this.faro.say('overrunWarn', { priority: 2 }); }
          this.overrunT += dt;
          if (this.overrunT >= sp.swarmGrace) { this.faro.say('overrun', { priority: 3 }); const h = this.hero; h.hp = 0; h.dead = true; h.deathT = 0; this.run.overrun = true; this.parts.burst(h.x, h.y - 10, 24, { c: ['#5e4a8a', '#b46cff', '#f4ecdc'], min: 20, max: 90, life: 0.8, g: 120, s: 2, kind: 'shrink' }); this.endRun(false); this.banner = null; this.showBanner('MASA SENİ YUTTU', 'Kırık Ayna kalabalığı sevmez', '#c08aff', 3); }
        } else { this.overrunT = Math.max(0, this.overrunT - dt * 0.5); if (alive < sp.swarmCap - 6) this.overrunWarned = false; }

    },
    // ---------------- Faro donma senaryoları (eski FaroSystem._triggerFreezeScenario) ----------------
    updateFreeze(dt) {
      if (!this.iv.has('faroTimeFreeze')) return;
      if (!this.freeze && !this.ivUsed.has('faroTimeFreeze') && this.elapsed >= this.freezeCheck) {
        if (U.chance(0.15)) this.startFreeze(); else this.freezeCheck = this.elapsed + U.rand(20, 35);
      }
      const f = this.freeze; if (!f) return;
      f.t += dt;
      if (f.sc === 3 && !f.cleared && f.t > 0.8) { f.cleared = true; for (const e of this.enemies) if (!e.dying) { e.dying = true; e.dieT = 0; this.parts.burst(e.x, e.y - 8, 5, { c: [P.purp3, '#e0b0ff'], min: 10, max: 40, life: 0.4 }); } DMT.Audio.play('curse'); }
      if (f.sc === 3 && !f.endSaid && f.t > 10) { f.endSaid = true; this.faro.say('freeze3End', { priority: 3 }); this.faro.act('laugh', 1.2); }
      if (f.t >= f.dur) this.freeze = null;

    startFreeze(sc) {
      this.ivUsed.add('faroTimeFreeze');
      const r = Math.random(); sc = sc || (r < 0.3 ? 1 : r < 0.55 ? 2 : r < 0.75 ? 3 : 4);
      const dur = { 1: 12, 2: 10, 3: 13, 4: 12 }[sc];
      this.freeze = { sc, t: 0, dur };
      DMT.Audio.play('curseWarn');
      this.timerFrozenT = dur;                               // süre durur (eski _faroFreezeTimer)
      if (sc !== 3) this.em.freezeT = dur;                   // düşmanlar donar
      if (sc === 2 || sc === 3) this.heroFrozenT = dur;      // kahraman da durur
      if (sc !== 4) { this.noCoinT = dur; this.spawnPauseT = dur; }
      this.faro.say('freeze' + sc, { priority: 3 }); this.faro.act(sc === 1 || sc === 3 ? 'laugh' : 'point', 1.4);
      this.showBanner('FARO ZAMANI DURDURDU', { 1: 'Onlar dinleniyor. Sen vur. Coin yok.', 2: 'Herkes duruyor. Sen de.', 3: 'Sahne temizleniyor…', 4: 'Faro bugün cömert.' }[sc], '#bfe8ff', 2.2);
    },
    ruleCaprice() {
      this.capriceUsed = true; DMT.Audio.play('hmm');

      else { const pool = this.run.tableId === 't2' ? ['grunt', 'rusher', 'ghost', 'splitter'] : ['grunt', 'rusher', 'tank']; this.forced = U.shuffle(pool.slice()).slice(0, 2); this.forcedT = 25; this.faro.say('capriceForced', { priority: 3 }); }
      this.faro.act('point', 1.2); this.showBanner('MASA DEĞİŞTİ', this.forcedT > 0 ? 'Yalnızca bazı konuklar gelecek' : this.offerEvery < 6 ? 'Kartlar daha sık gelecek' : 'Kartlar daha seyrek gelecek', '#c8a96e', 2);
    },
    // ---------------- Faro'nun kesesi ----------------
    purseEvent() {
      const p = this.purse, run = this.run, h = this.hero;
      const el = PURSE.filter((e) => p.vault >= e.min && (p.used[e.id] || 0) < e.max);
      if (!el.length) return;
      let tot = 0; for (const e of el) tot += e.w; let r = Math.random() * tot, ev = el[0]; for (const e of el) { r -= e.w; if (r <= 0) { ev = e; break; } }
      const cost = Math.min(p.vault, ev.cost(p.vault)); p.vault -= cost; p.used[ev.id] = (p.used[ev.id] || 0) + 1;
      const say = (k) => this.faro.say(k, { priority: 3 });
      DMT.Audio.play('coin');
      if (ev.id === 'roundOnHouse') { say('purseRoundOnHouse'); this.heal(this.stats.maxHp * 0.25, 'faro'); this.floatText(h.x, h.y - 36, 'İÇKİLER FARO’DAN', '#ffcf6e', 7); }
      else if (ev.id === 'barTab') say('purseBarTab');
      else if (ev.id === 'oneForMe') say('purseOneForMe');

        else say('purseSpecialDeliveryShame');
      }
      else if (ev.id === 'markedDeck') { say('purseMarkedDeck'); this.markedNext = U.pick(['markedEdge', 'markedPact']); }
      else if (ev.id === 'houseCut') { say('purseHouseCut'); this.takeCoins(Math.max(1, Math.floor(run.currentRunCoins * 0.1))); }
      else if (ev.id === 'houseGenerous') { say('purseHouseGenerous'); this.coinRain(8); }
    },
    backRoom() {
      const run = this.run, ids = Object.keys(run.cards), tag = (t) => ids.reduce((n, id) => n + (D.cardById(id).tags.includes(t) ? run.cards[id] : 0), 0);
      const dmgN = ids.reduce((n, id) => n + (DMG_CARDS.includes(id) ? run.cards[id] : 0), 0);
      let k;
      if (run.heroId === 'kael' && tag('speed') >= 2) { k = 'HeavyHands'; this.addBuff('heavyHands', 10); }
      else if (run.heroId === 'lyra' && tag('crit') >= 1) { k = 'BadAim'; this.addBuff('badAim', 10); }
      else if (tag('crit') >= 2) { k = 'ThickSkin'; this.em.thickT = 10; }
      else if (dmgN >= 3) { k = 'BloodWard'; this.em.wardT = 10; }

      this.faro.say('purseBackRoom' + k, { priority: 3 }); this.faro.act('laugh', 1);
      this.showBanner('ARKA ODA', { HeavyHands: 'Saldırı hızın 10 sn düştü', BadAim: 'Kritik şansın 10 sn düştü', ThickSkin: 'Kritikler 10 sn zayıf', BloodWard: 'Yeni gelenler 10 sn daha dayanıklı', CrowdedTable: 'Masa kalabalıklaşıyor' }[k], '#c08aff', 1.8);
    },
    randomCardFor(filter) {
      const run = this.run;
      const L = D.CARDS.filter((c) => (run.cards[c.id] || 0) < c.max && (!c.hero || c.hero === run.heroId) && (!c.req || c.req.every((r) => run.cards[r])) && (!filter || filter(c)));
      return L.length ? U.pick(L) : null;
    },
    // ---------------- Faro'nun hileli kartları ----------------
    applyTrick(def) {

      run.tricks.push(def.id); if (def.kind === 'trap') run.trapsTaken++;
      const title = def.kind === 'sig' ? 'FARO’NUN İMZASI' : def.kind === 'marked' ? 'İŞARETLİ KART' : def.game ? 'FARO’NUN OYUNU' : 'TUZAK!';
      this.showBanner(title, def.hidden, def.kind === 'sig' ? P.gold4 : def.kind === 'marked' ? '#d08aff' : '#ff6a5a', 3.4);
      this.faro.say('x', { priority: 3, text: def.faro }); this.faro.act(def.kind === 'marked' ? 'point' : 'laugh', 1.4);
      DMT.Audio.play(def.kind === 'sig' ? 'hmm' : 'curse');
      switch (def.id) {
        case 'sahteCevher': run.mods.dmg *= 1.3; run.mods.priceMul *= 1.2; break;
        case 'ozelFiyat': run.mods.crit += 0.15; this.addBuff('ozelFiyat', 10); break;
        case 'evHediyesi': run.mods.aspd *= 1.2; this.noCoinT = Math.max(this.noCoinT, 10); break;
        case 'trapAtk': em.atkT = 10; break;
        case 'trapDef': em.shieldT = 5; break;
        case 'trapSlow': em.slowT = 8; this.addBuff('trapSlow', 8); break;
        case 'trapGold': RunM.addCoins(run, 15, 'refund'); run.mods.priceAdd += 3; this.coinPulse = 1; break;
        case 'trapHeal': h.hp = Math.max(1, Math.round(h.hp - this.stats.maxHp * 0.15)); h.flash = 0.2; break;
        case 'trapKillAtk': em.killBuffOn = true; break;
        case 'trapImmortal': em.invulnT = 5; break;
        case 'trapSpeed': this.addBuff('trapSpeed', 8); break;
        case 'trapVision': em.invisT = 8; break;

        case 'trapStats': em.hpMulRun *= 1.2; em.dmgMulRun *= 1.2; for (const e of this.enemies) if (!e.dying) { e.hp = Math.round(e.hp * 1.2); e.maxHp = Math.round(e.maxHp * 1.2); } break;
        case 'trapCardChoice': { const c = this.randomCardFor(); if (c) { RunM.addCard(run, c.id); this.later(1.2, () => { this.applyCard(c); this.floatText(h.x, h.y - 46, 'FARO SEÇTİ: ' + c.name, '#d08aff', 7); }); } break; }
        case 'faroBahsi': this.bet = { t: 10, need: 7, kills: 0 }; break;

        case 'yankiMasasi': this.echo += 5; break;
        case 'darSecim': this.narrowNext = true; break;
        case 'sigSurpriz': { const c = this.randomCardFor((d) => d.rarity !== 'common'); if (c) { RunM.addCard(run, c.id); this.later(1.2, () => { this.applyCard(c); this.floatText(h.x, h.y - 46, 'SÜRPRİZ: ' + c.name, P.gold4, 7); }); } break; }
        case 'sigHata': this.addBuff('sigHata', 8); break;
        case 'sigSaygi': em.sayT = 20; break;
        case 'markedEdge': run.mods.dmg *= 1.4; em.hpMulRun *= 1.2; break;
        case 'markedPact': run.mods.aspd *= 1.35; run.mods.priceMul *= 1.25; break;

    },
    // teklif kartlarına tuzak / imza / işaretli kart karıştır (eski drawCards: riskChance 0.25, sigChance 0.08)
    injectTricks(out) {
      const run = this.run, B = DMT.Balance;
      const priced = (d) => ({ def: d, price: d.price[1] === 0 ? 0 : Math.max(1, Math.round(U.randi(d.price[0], d.price[1]) * run.mods.priceMul) + run.mods.priceAdd) });
      if (this.markedNext) { const d = D.trickById(this.markedNext); this.markedNext = null; out[U.randi(0, out.length - 1)] = priced(d); return; }
      if (run.offers < 2) return;
      let pool = null;
      if (U.chance(0.07)) pool = D.TRICKS.filter((d) => d.kind === 'sig' && !run.tricks.includes(d.id));
      else if (U.chance(0.22)) pool = D.TRICKS.filter((d) => d.kind === 'trap' && !run.tricks.includes(d.id));
      if (pool && pool.length) out[U.randi(0, out.length - 1)] = priced(U.pick(pool));

    },
    // Faro'nun teklif üstü numaraları: takas, kart önerme, kapalı el
    offerTricks(m) {
      if (m.free) return;
      const run = this.run, R = { common: 0, rare: 1, epic: 2 };
      // FARO TAKASI (müdahale): en değerli kartı daha zayıf biriyle değiştirir
      if (this.has('replaceCard') && U.chance(0.4)) {
        this.ivUsed.add('replaceCard');
        const best = m.cards.filter((c) => !c.def.trick).sort((a, b) => R[b.def.rarity] - R[a.def.rarity])[0];
        const rep = best && this.randomCardFor((d) => R[d.rarity] < R[best.def.rarity] && !m.cards.some((c) => c.def === d));
        if (rep) { best.def = rep; best.price = DMT.Balance.cardPrice(rep, run.buys); this.faro.say('ivReplace', { priority: 3 }); m.swapLabel = best.i; }
      }
      const traps = m.cards.filter((c) => c.def.kind === 'trap' || c.def.kind === 'sig');
      // KAPALI EL
      if (run.offers >= 3 && U.chance(0.09)) { m.blind = true; this.faro.say('blindIntro', { priority: 3 }); return; }
      // FARO ÖNERİYOR
      if (run.offers >= 2 && (traps.length ? U.chance(0.7) : U.chance(0.28))) {
        let first = traps.length && U.chance(0.6) ? traps[0].i : U.randi(0, m.cards.length - 1);
        m.point = [first];
        if (m.cards.length > 2 && U.chance(0.25)) { const o = m.cards.find((c) => c.i !== first); m.point.push(o.i); }
        this.faro.say(m.point.length > 1 ? 'faroPointsTwo' : 'faroPoints', { priority: 3 });
      } else if (U.chance(0.25)) this.faro.say('cardOffer', { priority: 1, catGap: 12 });
    },
    offerReaction(m, chosen) {
      const isT = (c) => c && (c.def.kind === 'trap' || c.def.kind === 'sig');
      const traps = m.cards.filter(isT).map((c) => c.i), ch = chosen >= 0 ? m.cards[chosen] : null, chT = isT(ch);
      let cat = null;
      if (m.point) {
        const two = m.point.length > 1, took = ch && m.point.includes(chosen), pT = m.point.some((i) => traps.includes(i));
        if (took) cat = chT ? (two && m.point.every((i) => traps.includes(i)) ? 'doubleTrapTaken' : 'trapTaken') : (two ? 'doubleGoodTaken' : 'goodTaken');
        else cat = pT ? (two ? 'doubleTrapAvoided' : 'trapAvoided') : (two ? 'doubleGoodAvoided' : 'goodAvoided');
      } else if (chT) cat = 'trapTaken';
      else if (traps.length && U.chance(0.55)) cat = 'trapAvoided';
      if (traps.length && !chT) this.run.trapsAvoided++;
      if (!cat) return false;
      const laugh = /Taken$/.test(cat) && /trap|Trap/.test(cat);
      this.later(chT ? 2.6 : 0.4, () => { this.faro.say(cat, { priority: 3 }); this.faro.act(laugh ? 'laugh' : /Avoided/.test(cat) ? 'annoyed' : 'surprised', 1.2); });
      return true;
    },
  });
})();

// ============================================================
//  24 SAHNE — FIGHT: Faro'nun kart sunumu + Üç Kapalı Kart mini oyunu
// ============================================================
(function () {
  const D = DMT.Data, RunM = DMT.Run, S = DMT.FightScene;
  const CW = 104, CH = 148, CY = 158, CXS = [158, 268, 378];
  const MW = 70, MH = 98, MY = 168, MXS = [201, 285, 369];
  S.CARD = { CW, CH, CY, CXS, MW, MH, MY, MXS };
  const RARS = ['common', 'rare', 'epic'];

  Object.assign(S, {
    // V2 teklif algoritması:
    //  1) Nadirlik, kart sayısından BAĞIMSIZ ağırlıklarla seçilir (run ilerledikçe Rare/Epic kontrollü artar).
    //  2) Seçilen nadirliğin havuzundan kart çekilir; sahip olunan etiketlerle eşleşen kartlar hafifçe öne çıkar (build farkındalığı).
    //  3) Aynı teklifte tekrar yok; yığın sınırına ulaşan kartlar havuzdan çıkar. İlk ücretsiz el farklı oyun stilleri sunar.
    rarityWeights(free) {
      const B = DMT.Balance, k = U.clamp(this.elapsed / this.tdef.dur, 0, 1);
      if (free) return Object.assign({}, B.rarityWFree);
      const w = {}; for (const r of RARS) w[r] = U.lerp(B.rarityW[r][0], B.rarityW[r][1], k);
      return w;
    },
    tagCounts() { const o = {}; for (const id in this.run.cards) { const d = D.cardById(id); if (d) for (const t of d.tags) o[t] = (o[t] || 0) + this.run.cards[id]; } return o; },
    genOffer(free) {
      const run = this.run, B = DMT.Balance;
      // V3: kahramana özel kartlar yalnızca o kahramana; evrim kartları yalnızca gereken kart alındıysa
      const avail = D.CARDS.filter((c) => (run.cards[c.id] || 0) < c.max && (!c.hero || c.hero === run.heroId) && (!c.req || c.req.every((r) => run.cards[r])));
      const owned = this.tagCounts(), wR = this.rarityWeights(free);
      const narrow = !free && this.narrowNext; if (narrow) { this.narrowNext = false; wR.common = 0; } // Kaliteli Seçim tuzağı
      const pr = (d) => Math.max(1, Math.round(B.cardPrice(d, run.buys) * run.mods.priceMul) + run.mods.priceAdd);
      const cardW = (c) => { let b = 0; for (const t of c.tags) b += (owned[t] || 0) * B.synergyPerTag; return 1 + Math.min(B.synergyCap, b); };
      const picked = [], usedTags = new Set();
      const weighted = (pool, wf) => { let tot = 0; for (const c of pool) tot += wf(c); let r = Math.random() * tot; for (const c of pool) { r -= wf(c); if (r <= 0) return c; } return pool[pool.length - 1]; };
      for (let slot = 0; slot < (narrow ? 2 : 3); slot++) {
        const pools = {}; let tot = 0;
        for (const r of RARS) { pools[r] = avail.filter((c) => c.rarity === r && !picked.includes(c)); if (pools[r].length && wR[r] > 0) tot += wR[r]; }
        if (!tot) break;
        let x = Math.random() * tot, rar = null;
        for (const r of RARS) { if (!pools[r].length || !(wR[r] > 0)) continue; rar = r; x -= wR[r]; if (x <= 0) break; }
        let pool = pools[rar];
        if (free) { const div = pool.filter((c) => c.tags.length && !c.tags.some((t) => usedTags.has(t))); if (div.length) pool = div; }
        const ch = weighted(pool, cardW);
        picked.push(ch); for (const t of ch.tags) usedTags.add(t);
      }
      // evrim kartı açıldıysa teklife girme şansı yüksek (eski: %65)
      const evo = avail.filter((c) => c.req && !picked.includes(c));
      if (!free && evo.length && picked.length && U.chance(0.55)) picked[picked.length - 1] = U.pick(evo);
      const out = picked.map((def) => ({ def, price: free ? 0 : pr(def) }));
      if (!free && out.length) {
        const coins = run.currentRunCoins;

          const c = avail.filter((x) => x.rarity === 'common' && !out.some((o) => o.def === x));
          if (c.length && !narrow) { const d = weighted(c, cardW); out[out.length - 1] = { def: d, price: pr(d) }; }
        }
        this.injectTricks(out); // Faro'nun tuzak / imza / işaretli kartları
        // hiçbiri alınamıyorsa (ve oyuncunun biraz parası varsa) birini alınabilir yap — Faro'nun "indirimi"
        if (coins >= 4 && !out.some((o) => o.price <= coins)) {
          const cands = avail.filter((x) => x.rarity === 'common' && x.price[0] <= coins && !out.some((o) => o.def === x));
          if (cands.length && !narrow) { const d = weighted(cands, cardW); const i = out.reduce((bi, o, j) => (o.price < out[bi].price ? j : bi), 0); out[i] = { def: d, price: Math.min(pr(d), coins) }; }

    },
    openOffer(free) {

      const offer = this.genOffer(free);
      if (!offer.length) { this.offerT = 6; this.phase = 'fight'; return; } // bütün kartlar yığın sınırında
      if (!free) this.run.offers++;
      this.phase = 'offer';
      const cards = offer.map((o, i) => ({ def: o.def, price: o.price, i, x: CXS[i], y: CY, deal: 0.25 + i * 0.2, lift: 0, fade: 0 }));
      this.modal = { kind: 'offer', free, t: 0, cards, chosen: -1, closeT: 0, ready: false };
      this.faro.act('deal', 1.2);
      this.faro.setHand('r', { x: 30, y: -6, pose: 'flat' });

      cards.forEach((c, i) => {
        c.btn = UI.button({ group: 'modal', x: c.x + 12, y: CY + 128, w: CW - 24, h: 15, label: free ? 'SEÇ' : 'AL', size: 7.5, style: free ? 'green' : 'bord', silent: true,
          visible: () => self.modal && self.modal.ready && self.modal.chosen === -1,
          enabled: () => free || self.run.currentRunCoins >= c.price,
          onClick: () => self.chooseOffer(i), onDenied: () => { self.faro.say('noMoney', { priority: 1, catGap: 4 }); } });
      });
      if (!free) UI.button({ group: 'modal', x: 280, y: 314, w: 80, h: 16, label: 'PAS GEÇ', size: 7.5, style: 'dark', visible: () => self.modal && self.modal.ready && self.modal.chosen === -1, onClick: () => self.passOffer() });
      this.offerTricks(this.modal); // Faro: takas, öneri, kapalı el
      if (!free) this.tutorial('pass', 'tutPass');
    },
    updateOffer(dt) {
      const m = this.modal; if (!m) { this.phase = 'fight'; return; }
      const prev = m.t; m.t += dt;
      for (const c of m.cards) {
        if (prev < c.deal && m.t >= c.deal) { DMT.Audio.play('deal'); this.faro.setHand('r', { x: 4 + (c.i - 1) * 12, y: 10, pose: 'flat' }); }
        if (prev < c.deal - 0.12 && m.t >= c.deal - 0.12) this.faro.setHand('r', { x: 30, y: -8, pose: 'flat' });
      }
      const lastDeal = m.cards[m.cards.length - 1].deal + 0.35;
      if (!m.ready && m.t >= lastDeal) { m.ready = true; this.faro.setHand('r', m.point ? { x: 4 + (m.point[0] - 1) * 12, y: 12, pose: 'point' } : null); if (m.point) this.faro.act('point', 2); }
      const I = DMT.Input;
      for (const c of m.cards) {
        const over = m.ready && m.chosen === -1 && U.inRect(I.x, I.y, { x: c.x, y: CY, w: CW, h: CH });
        c.lift = U.clamp(c.lift + (over ? dt * 10 : -dt * 10), 0, 1);
        if (m.chosen >= 0 && c.i !== m.chosen) c.fade = Math.min(1, c.fade + dt * 4);
      }
      if (m.chosen !== -1) { m.closeT += dt; if (m.closeT > 0.6) this.closeOffer(); }
    },
    chooseOffer(i) {
      const m = this.modal; if (!m || !m.ready || m.chosen !== -1) return;
      const c = m.cards[i];
      if (!m.free && !RunM.spend(this.run, c.price)) { DMT.Audio.play('deny'); return; }
      if (!m.free) this.purse.vault += c.price; // harcanan coin Faro'nun kesesine
      m.chosen = i; this.faro.setHand('r', null);
      // KAPALI EL: Faro seçtiğini verir… ya da vermez
      if (m.blind) {
        if (!c.def.trick && U.chance(0.3)) { const alt = this.randomCardFor((d) => d.rarity === c.def.rarity && d !== c.def && !m.cards.some((x) => x.def === d)); if (alt) { c.def = alt; m.swapped = true; } }
        this.faro.say('blindReveal', { priority: 3 }); DMT.Audio.play('flip');
      }
      const reacted = this.offerReaction(m, i);
      this.run.buyLog.push({ id: c.def.id, price: m.free ? 0 : c.price, t: Math.round(this.elapsed) });
      if (!m.free) this.run.buys++;
      if (c.def.trick) { DMT.Audio.play('buy'); this.applyTrick(c.def); return; }

      DMT.Audio.play(m.free ? 'cardPick' : 'buy');
      this.applyCard(c.def);
      const n = this.run.cards[c.def.id];
      if (n === 2) this.tutorial('stack', 'tutStack');
      if (c.def.ms && n >= c.def.max) this.later(0.7, () => this.showBanner('KADEME: ' + c.def.ms.name, c.def.ms.desc, P.gold4, 2.4));
      if (!m.free && !reacted && !m.blind && U.chance(0.55)) this.faro.say('cardBuy', { priority: 1, catGap: 10 });
    },
    passOffer() {
      const m = this.modal; if (!m || !m.ready || m.chosen !== -1) return;
      m.chosen = -2; this.run.passes++; this.faro.setHand('r', null);
      if (this.offerReaction(m, -2)) return;

    },
    closeOffer() {
      DMT.UI.remove('modal');
      const m = this.modal;

    openMinigame() {

    },
    updateMinigame(dt) {

      if (!m.ready && m.t > m.cards[2].deal + 0.35) { m.ready = true; this.faro.setHand('r', null); }
      const I = DMT.Input;
      for (const c of m.cards) {
        const over = m.ready && m.chosen === -1 && U.inRect(I.x, I.y, { x: c.x, y: MY, w: MW, h: MH });
        c.lift = U.clamp(c.lift + (over ? dt * 10 : -dt * 10), 0, 1);
      }
      if (m.chosen >= 0) {
        m.revealT += dt;
        const ch = m.cards[m.chosen];
        ch.flip = U.clamp(m.revealT / 0.35, 0, 1);
        if (m.revealT > 0.35 && !m.reacted) {
          m.reacted = true;
          const r = ch.res, f = this.faro;
          if (r === 'curse') { f.say('mgCurse', { priority: 3 }); f.act('laugh', 1.3); }
          else { f.say(r === 'coin' ? 'mgCoin' : 'mgBuff', { priority: 3 }); f.act('annoyed', 1.3); }
          DMT.Audio.play(r === 'curse' ? 'curse' : r === 'coin' ? 'buy' : 'rise');
        }
        if (m.revealT > 1.0) for (const c of m.cards) if (c !== ch) c.flip = U.clamp((m.revealT - 1.0) / 0.35, 0, 1);

      }
    },
    chooseMg(i) {
      const m = this.modal; if (!m || m.kind !== 'mg' || !m.ready || m.chosen !== -1) return;
      m.chosen = i; DMT.Audio.play('flip');
    },
    closeMinigame() {
      const m = this.modal; const r = m.cards[m.chosen].res, h = this.hero;
      if (r === 'coin') { RunM.addCoins(this.run, m.coinAmt, 'minigame'); this.coinPulse = 1; this.floatText(h.x, h.y - 30, '+' + m.coinAmt + ' coin', P.gold4, 8); for (let k = 0; k < 6; k++) setTimeout(() => DMT.Audio.play('coin'), k * 60); }

    },
  });
})();

// ============================================================
//  25 SAHNE — FIGHT: çizim (dünya, HUD, kart ekranı)
// ============================================================
(function () {
  const A = DMT.Art, D = DMT.Data, S = DMT.FightScene;
  const { AR, FX, FBY } = S;
  const { CW, CH, CY, MW, MH, MY } = S.CARD;

  // ---------- kart görselleri (önbellekli) ----------
  function cardBack(w = CW, h = CH) {

            T.text(c, x.dmg || x.heal ? (x.dmg ? x.dmg + ' hasar' : '') + (x.heal ? (x.dmg ? ' · ' : '') + '+' + x.heal + ' can' : '') : 'pasif / istatistik', bx + 214, by + 1, { size: 5.2, align: 'right', color: x.dmg || x.heal ? P.bone : P.bone3, outline: false });
          });
          if (imp.list.length > 6) T.text(c, '+' + (imp.list.length - 6) + ' kart daha', 620, 306, { size: 5, align: 'right', color: P.bone3, outline: false });
        }
        T.text(c, 'FARO', FP.x + 6, FP.y + 4, { size: 6, color: P.gold3, font: 'title' });
      });
      DMT.UI.draw(R, 'main');
      this.faro.drawBubble(R, 170, 318, 300, { tail: [FARO_X + 30, 300], size: 7 });
      const I = DMT.Input;
      if (this.tab === 'cards') this.cardList.slice(0, 16).forEach((cc, i) => { const r = { x: 178 + i * 28, y: 256, w: 24, h: 24 }; if (U.inRect(I.x, I.y, r)) { const dm = Math.round(run.cardDmg[cc.d.id] || 0); DMT.UI.showTip(Math.min(480, r.x - 40), r.y - 60, cc.d.name + ' x' + cc.n, D.cardDesc(cc.d, run.heroId, cc.n) + (dm ? '\nHasar: ' + dm : ''), 150); } });
    },
  };
  DMT.Scenes.register('runend', S);
})();

// ============================================================
//  29 SİMÜLASYON (yalnızca geliştirici) — başsız run simülasyonu ile ekonomi/build testi
//  Kayda YAZMAZ: Save.write, BalanceLog ve ses geçici olarak devre dışı bırakılır, sonra geri yüklenir.
//  Konsol: DMT.debug.sim({ hero:'lyra', table:'t1', strategy:'balanced', skills:{coin:5}, mouse:240 })
//          DMT.debug.simBatch(20, { hero:'kael', strategy:'tag:blast' })
// ============================================================
DMT.Sim = {
  score(def, S, strategy) {
    const R = { common: 1, rare: 1.7, epic: 2.4 }[def.rarity];
    const own = S.tagCounts(); let syn = 0; for (const t of def.tags) syn += (own[t] || 0) * 0.35;
    let pref = 0;
    if (strategy === 'coin' && (def.tags.includes('luck') || def.id === 'goldTooth')) pref += 3;
    if (strategy && strategy.startsWith('tag:') && def.tags.includes(strategy.slice(4))) pref += 3;
    if (strategy === 'random') return Math.random();
    return R + syn + pref;
  },
  run(o = {}) {
    if (DMT.Scenes.currentName === 'fight') { console.warn('Simülasyon savaş sahnesindeyken çalıştırılamaz.'); return null; }
    const SV = DMT.Save, S = DMT.FightScene, I = DMT.Input;
    const bak = { write: SV.write, push: DMT.BalanceLog.push, play: DMT.Audio.play, skills: SV.data.skills, tables: SV.data.tables, ix: I.x, iy: I.y, inside: I.inside };
    SV.write = () => true; DMT.BalanceLog.push = () => {}; DMT.Audio.play = () => {};
    SV.data.skills = Object.assign({}, o.skills || {}); SV.data.tables = { t1: true, t2: true };
    const strategy = o.strategy || 'balanced', mouseSpeed = o.mouse || 240, dt = 1 / 60;
    const log = { offers: [], firstBuyT: null };
    let rep = null;
    try {
      const run = DMT.Run.create(o.hero || 'kael', o.table || 't1');
      if (o.give) for (const id in o.give) for (let i = 0; i < o.give[id]; i++) DMT.Run.addCard(run, id);
      S.enter({ run }); S.t = 0;
      I.inside = true; I.x = 320; I.y = 250;
      let decide = 0;
      for (let step = 0; step < 60 * 400; step++) {
        // fare: en yakın yerdeki coine sınırlı hızla gider (insan benzeri toplama)
        if (S.phase === 'fight' || S.phase === 'ending') {
          let best = null, bd = 1e9; for (const c of S.coins) { if (c.collected) continue; const d = U.dist2(I.x, I.y, c.x, c.y - c.z); if (d < bd) { bd = d; best = c; } }
          if (best) { const dx = best.x - I.x, dy = best.y - best.z - I.y, d = Math.hypot(dx, dy) || 1, sp = Math.min(d, mouseSpeed * dt); I.x += (dx / d) * sp; I.y += (dy / d) * sp; }
        }
        S.t += dt; S.update(dt);
        const m = S.modal;
        if (S.phase === 'offer' && m && m.ready && m.chosen === -1) {
          if ((decide += dt) < 0.6) continue; decide = 0;
          const coins = S.run.currentRunCoins;
          const aff = m.cards.filter((c) => m.free || c.price <= coins);
          if (!m.free) log.offers.push({ t: Math.round(S.elapsed), coins, affordable: aff.length });
          if (o.noBuy) S.passOffer();
          else if (aff.length) { aff.sort((a, b) => this.score(b.def, S, strategy) - this.score(a.def, S, strategy)); S.chooseOffer(aff[0].i); if (!m.free && log.firstBuyT == null) log.firstBuyT = Math.round(S.elapsed); }
          else S.passOffer();
        } else if (S.phase === 'minigame' && m && m.ready && m.chosen === -1) S.chooseMg(U.randi(0, 2));
        if (S.phase === 'ending' && S.endT > 2.6) break; // sahne geçişinden önce dur
      }
      for (const c of S.coins) if (!c.collected) run.coinsMissed++;
      const b = DMT.Run.breakdown(run); run.breakdown = b;
      rep = DMT.BalanceLog.report(run);
      rep.strategy = strategy; rep.firstBuyT = log.firstBuyT;
      rep.offersAffordable = log.offers.filter((x) => x.affordable > 0).length + '/' + log.offers.length;
      rep.cardIds = run.cardOrder.join(',');
      rep.offerLog = log.offers;
    } catch (e) { console.error('[DMT.Sim]', e); }
    finally {
      if (S.modal) { DMT.UI.remove('modal'); S.modal = null; }
      try { S.exit(); } catch (e) { /* yoksay */ }
      SV.write = bak.write; DMT.BalanceLog.push = bak.push; DMT.Audio.play = bak.play;
      SV.data.skills = bak.skills; SV.data.tables = bak.tables; I.x = bak.ix; I.y = bak.iy; I.inside = bak.inside;
    }
    return rep;
  },
  batch(n = 10, o = {}) {
    const L = []; for (let i = 0; i < n; i++) { const r = this.run(o); if (r) L.push(r); }
    const avg = (k) => +(L.reduce((s, r) => s + (+r[k] || 0), 0) / Math.max(1, L.length)).toFixed(1);
    const summary = { n: L.length, hero: o.hero || 'kael', table: o.table || 't1', strategy: o.strategy || 'balanced', winRate: +(L.filter((r) => r.won).length / Math.max(1, L.length)).toFixed(2),
      time: avg('time'), kills: avg('kills'), collected: avg('collected'), spent: avg('spent'), buys: avg('buys'), passes: avg('passes'), bank: avg('bank'),
      bankMin: Math.min(...L.map((r) => r.bank)), bankMax: Math.max(...L.map((r) => r.bank)), firstBuyT: avg('firstBuyT'), cardDmgPct: +(L.reduce((s, r) => s + r.cardDmg / Math.max(1, r.dmg), 0) / Math.max(1, L.length) * 100).toFixed(0) };
    console.table([summary]);
    return { summary, runs: L };
  },
};

// ============================================================
//  30 MAIN — başlatma + hata ayıklama kancaları
// ============================================================
(function boot() {
  const canvas = document.getElementById('game');
  DMT.Save.load();
  DMT.Audio.init();
  DMT.Renderer.init(canvas);
  DMT.Input.init(canvas);
  DMT.Fullscreen.init();
  // dikey uyarıdaki buton: tam ekran + yatay kilit (Android Chrome'da ekranı kendisi döndürür)
  const rf = document.getElementById('rotateFs');
  if (rf) rf.addEventListener('click', () => { DMT.Audio.unlock(); if (!DMT.Fullscreen.active()) DMT.Fullscreen.toggle(); });
  // ağır arka planları önceden üret (ilk karede takılma olmasın)
  DMT.Art.exteriorBG(); DMT.Art.interiorBG(); DMT.Art.prerunBG();
  DMT.Scenes.start('exterior');
  DMT.Loop.start();
  canvas.focus();

  // Konsol araçları (test / trailer çekimi)
  DMT.debug = {
    go: (name, params) => { DMT.Scenes.locked = false; DMT.Scenes._enter(name, params || {}); DMT.Scenes.fade = 0; DMT.Scenes.fadeDir = 0; },
    grant: (n) => { DMT.Save.addBank(n); },
    // Geliştirici kayıt sıfırlama: yanlışlıkla çağrılmasın diye onay ister → DMT.debug.reset('SIFIRLA')
    reset: (confirm) => { if (confirm !== 'SIFIRLA') { console.warn("Kayıt silinmedi. Gerçekten sıfırlamak için: DMT.debug.reset('SIFIRLA')"); return false; } DMT.Save.reset(); location.reload(); return true; },
    // Balance raporu: son run'lar (localStorage 'dmt_reborn_balance_log'), oyun kaydından ayrı.
    balance: () => { const all = DMT.BalanceLog.all(); if (all.length) console.table(all.map((r) => { const o = Object.assign({}, r); delete o.cardContrib; delete o.skills; return o; })); if (DMT.BalanceLog.last) console.log('Son run kart katkıları:', DMT.BalanceLog.last.cardContrib); return DMT.BalanceLog.last || all[all.length - 1] || null; },
    sim: (o) => DMT.Sim.run(o),
    simBatch: (n, o) => DMT.Sim.batch(n, o),
    speed: (k) => { DMT.Loop.timeScale = k; },
    scene: () => DMT.Scenes.current,
    state: () => ({ scene: DMT.Scenes.currentName, bank: DMT.Save.data.bankCoins, skills: DMT.Save.data.skills, tables: DMT.Save.data.tables, fps: Math.round(DMT.Loop.fps) }),
  };
})();

</script>
