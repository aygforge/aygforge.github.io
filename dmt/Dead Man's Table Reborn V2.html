<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="screen-orientation" content="landscape">
<title>Dead Man's Table — Reborn V2</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #07040a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    box-shadow: 0 0 60px rgba(120, 30, 40, 0.25);
    cursor: none;
    outline: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  /* Mobil dikey ekranda "yatay çevir" uyarısı */
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: rgba(7, 4, 10, 0.94); color: #e0c070;
    font: bold 18px Georgia, 'DejaVu Serif', serif; text-align: center;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px;
  }
  #rotate .ph { width: 46px; height: 80px; border: 4px solid #e0c070; border-radius: 9px; animation: dmtRot 2s ease-in-out infinite; }
  #rotate small { color: #c3b494; font-size: 13px; font-weight: normal; }
  #rotate button { margin-top: 6px; padding: 12px 22px; font: bold 16px Georgia, 'DejaVu Serif', serif; color: #1a0a10;
    background: #e0c070; border: 3px solid #8a6a2e; border-radius: 4px; box-shadow: 0 4px 0 #5e4520; }
  @keyframes dmtRot { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" tabindex="0"></canvas>
<div id="rotate"><div class="ph"></div><div>Telefonu yatay çevir</div><small>Dead Man's Table yatay ekranda oynanır.</small><button id="rotateFs" type="button">TAM EKRAN (YATAY)</button></div>
<script>
"use strict";
// ============================================================
//  DEAD MAN'S TABLE — REBORN  |  Aygforge Studios
//  00 CORE: namespace, utils, save, input, renderer, scenes
// ============================================================
const DMT = (globalThis.DMT = globalThis.DMT || {});

DMT.W = 640;           // dahili pixel-art çözünürlüğü
DMT.H = 360;
DMT.SCALE = 2;         // 1280x720 referans
DMT.VERSION = '0.2.0-v2';

// ---------- PALET ----------
DMT.PAL = {
  ink: '#0b0710', ink2: '#140c16', soot: '#1c121c', soot2: '#261824',
  bord: '#5a1424', bord2: '#7e1f33', bord3: '#a3304a', blood: '#c0263a',
  brown0: '#1e130d', brown1: '#2e1d13', brown2: '#432a1a', brown3: '#5c3a22', brown4: '#7a5030', brown5: '#9a6a3e',
  gold0: '#5e4520', gold1: '#8a6a2e', gold2: '#b8913f', gold3: '#e0c070', gold4: '#fff0b8',
  candle: '#ff9a3c', candle2: '#ffcf6e', ember: '#ff6a2a',
  bone: '#e8dcc0', bone2: '#c3b494', bone3: '#8a7c62', bone4: '#544a3a',
  purp0: '#140f24', purp1: '#231a3a', purp2: '#3a2a58', purp3: '#5e4a8a',
  navy0: '#0a0f1e', navy1: '#141d36', navy2: '#22305a', navy3: '#3b5089',
  stone0: '#1d1a22', stone1: '#2b2731', stone2: '#3d3843', stone3: '#55505c', stone4: '#77717d',
  green0: '#0e1a14', green1: '#173022', green2: '#25503a', green3: '#3f7a55',
  white: '#f4ecdc', red: '#e0383e', cyan: '#7ae0ff', magic: '#b46cff', toxic: '#8ad35a',
};

// ---------- UTIL ----------
const U = (DMT.U = {
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  rand: (a, b) => a + Math.random() * (b - a),
  randi: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  chance: (p) => Math.random() < p,
  pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
  shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; },
  dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
  dist2: (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay),
  ease: { out: (t) => 1 - (1 - t) * (1 - t), in: (t) => t * t, inOut: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2), back: (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); } },
  inRect: (x, y, r) => x >= r.x && y >= r.y && x < r.x + r.w && y < r.y + r.h,
  fmtTime(s) { s = Math.max(0, Math.ceil(s)); const m = Math.floor(s / 60); const r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; },
  // deterministik gürültü (arka plan dokuları için)
  hash(x, y, s = 0) { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; h = h ^ (h >>> 16); return (h >>> 0) / 4294967295; },
});

// ---------- KAYIT (localStorage) ----------
DMT.Save = {
  KEY: 'dmt_reborn_save_v1',
  defaults() {
    // v2: ekonomi sürümü (econ) eklendi. Anahtar aynı kalır → eski kayıtlar korunur.
    return { v: 2, econ: 2, secrets: [], journal: [], tut: {}, heroDeaths: {}, deathSpots: [], lastHeroes: [], bankCoins: 0, skills: {}, tables: { t1: true }, visits: 0, lastHero: 'kael', lastTable: 't1', muted: false,
      stats: { runs: 0, wins: 0, bestKills: 0, totalEarned: 0, bestReward: 0, v2Runs: 0 } };
  },
  data: null,
  load() {
    let d = this.defaults();
    try {
      const raw = localStorage.getItem(this.KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && typeof p === 'object') {
          d.bankCoins = Number.isFinite(p.bankCoins) && p.bankCoins >= 0 ? Math.floor(p.bankCoins) : 0;
          if (p.skills && typeof p.skills === 'object') for (const k in p.skills) { const lv = p.skills[k]; if (Number.isInteger(lv) && lv >= 0 && lv <= 20) d.skills[k] = lv; }
          if (p.tables && typeof p.tables === 'object') for (const k in p.tables) if (p.tables[k] === true) d.tables[k] = true;
          d.tables.t1 = true;
          d.visits = Number.isInteger(p.visits) ? p.visits : 0;
          if (typeof p.lastHero === 'string') d.lastHero = p.lastHero;
          if (typeof p.lastTable === 'string') d.lastTable = p.lastTable;
          d.muted = !!p.muted;
          // V3 alanları (Faro'nun sırları, günlüğü, öğretici izleri, ölüm kayıtları) — yoksa boş başlar
          d.secrets = Array.isArray(p.secrets) ? p.secrets.filter((x) => typeof x === 'string').slice(0, 50) : [];
          d.journal = Array.isArray(p.journal) ? p.journal.filter((x) => typeof x === 'string').slice(-20) : [];
          d.tut = p.tut && typeof p.tut === 'object' ? Object.fromEntries(Object.entries(p.tut).filter(([, v]) => v === true)) : {};
          d.heroDeaths = p.heroDeaths && typeof p.heroDeaths === 'object' ? Object.fromEntries(Object.entries(p.heroDeaths).filter(([, v]) => Number.isInteger(v))) : {};
          d.deathSpots = Array.isArray(p.deathSpots) ? p.deathSpots.filter((x) => x && Number.isFinite(x.x) && Number.isFinite(x.y)).slice(-12) : [];
          d.lastHeroes = Array.isArray(p.lastHeroes) ? p.lastHeroes.filter((x) => typeof x === 'string').slice(-5) : [];
          if (p.stats && typeof p.stats === 'object') for (const k in d.stats) if (Number.isFinite(p.stats[k])) d.stats[k] = p.stats[k];
          // Güvenli migration: v1 kayıtları (econ alanı yok) olduğu gibi taşınır. Kazanılmış coin, skill ve masalar SİLİNMEZ;
          // yeni ekonomi yalnızca bundan sonraki run'lara uygulanır.
          if (!(p.econ >= 2)) { d.migratedFrom = Number.isInteger(p.v) ? p.v : 1; console.info('[DMT] Kayıt v' + d.migratedFrom + ' → v2 ekonomisine taşındı (ilerleme korundu).'); }
        }
      }
    } catch (e) {
      console.warn('[DMT] Kayıt bozuk, varsayılana dönülüyor.', e);
      try { localStorage.setItem(this.KEY + '_corrupt_backup', localStorage.getItem(this.KEY) || ''); } catch (_) {}
    }
    this.data = d;
    return d;
  },
  write() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); return true; }
    catch (e) { console.warn('[DMT] Kayıt yazılamadı', e); return false; }
  },
  reset() { this.data = this.defaults(); this.write(); },
  skillLevel(id) { return this.data.skills[id] || 0; },
  spendBank(n) {
    n = Math.floor(n);
    if (!(n > 0) || this.data.bankCoins < n) return false;
    this.data.bankCoins -= n; this.write(); return true;
  },
  addBank(n) { n = Math.max(0, Math.floor(n)); this.data.bankCoins += n; this.data.stats.totalEarned += n; this.write(); },
};

// ---------- INPUT ----------
// Tek bir global dinleyici seti. Sahneler kendi dinleyicilerini eklemez;
// Input olayları aktif sahneye iletir — böylece sahne geçişlerinde sızıntı olmaz.
DMT.Input = {
  x: -100, y: -100, down: false, inside: false, clicked: false, moved: false,
  init(canvas) {
    const toWorld = (e) => {
      const r = canvas.getBoundingClientRect();
      this.x = ((e.clientX - r.left) / r.width) * DMT.W;
      this.y = ((e.clientY - r.top) / r.height) * DMT.H;
    };
    canvas.addEventListener('mousemove', (e) => { toWorld(e); this.inside = true; this.moved = true; });
    canvas.addEventListener('mouseleave', () => { this.inside = false; this.x = -100; this.y = -100; });
    canvas.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      toWorld(e); this.down = true; DMT.Audio.unlock();
      DMT.Scenes.pointerDown(this.x, this.y);
    });
    window.addEventListener('mouseup', () => { DMT.Fullscreen.release(); if (this.down) { this.down = false; DMT.Scenes.pointerUp(this.x, this.y); } });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    // dokunmatik (bonus)
    canvas.addEventListener('touchstart', (e) => { const t = e.changedTouches[0]; toWorld(t); this.inside = true; this.down = true; DMT.Audio.unlock(); DMT.Scenes.pointerDown(this.x, this.y); e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { const t = e.changedTouches[0]; toWorld(t); e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchend', (e) => { DMT.Fullscreen.release(); this.down = false; DMT.Scenes.pointerUp(this.x, this.y); this.inside = false; e.preventDefault(); }, { passive: false });
    window.addEventListener('keydown', (e) => {
      DMT.Audio.unlock();
      if (e.key === 'm' || e.key === 'M') DMT.Audio.toggleMute();
      if (e.key === 'f' || e.key === 'F') DMT.Fullscreen.toggle();
      DMT.Scenes.keyDown(e);
    });
  },
};

// ---------- TAM EKRAN (mobilde yatay) ----------
// Tarayıcılar tam ekranı yalnızca "kullanıcı etkinleştirmesi" sayılan olaylarda izin verir (touchstart sayılmaz).
// Bu yüzden buton basışta "kurulur" (arm), parmak/fare kalkınca (touchend/mouseup) tam ekrana geçilir.
DMT.Fullscreen = {
  armed: false, armedAt: 0, msg: '', msgT: 0,
  el() { return document.documentElement; },
  supported() { const e = this.el(); return !!(e.requestFullscreen || e.webkitRequestFullscreen); },
  active() { return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  arm() { this.armed = true; this.armedAt = performance.now(); },
  release() { if (this.armed && performance.now() - this.armedAt < 2000) this.toggle(); this.armed = false; },
  toggle() {
    try {
      if (this.active()) {
        try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) { /* yoksay */ }
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        return;
      }
      if (!this.supported()) { this.toast('Bu tarayıcı tam ekranı desteklemiyor. iPhone: Paylaş → Ana Ekrana Ekle, sonra telefonu yan çevir.'); return; }
      const e = this.el();
      const p = (e.requestFullscreen || e.webkitRequestFullscreen).call(e, { navigationUI: 'hide' });
      const lock = () => { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (err) { /* masaüstünde desteklenmez */ } };
      if (p && p.then) p.then(lock).catch(() => this.toast('Tam ekran açılamadı.')); else lock();
    } catch (err) { console.warn('[DMT] tam ekran', err); this.toast('Tam ekran açılamadı.'); }
  },
  toast(m) { this.msg = m; this.msgT = 4; },
  init() {
    const refit = () => setTimeout(() => DMT.Renderer.fit(), 60);
    document.addEventListener('fullscreenchange', refit);
    document.addEventListener('webkitfullscreenchange', refit);
    window.addEventListener('orientationchange', refit);
  },
};

// ---------- RENDERER ----------
// İki katman: düşük çözünürlüklü pixel yüzey (640x360, nearest-neighbor x2)
// ve keskin metin katmanı (1280x720). Sahne, R.px()/R.tx() ile sıralı katmanlar ister.
DMT.Renderer = {
  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
    this.wc = document.createElement('canvas');
    this.wc.width = DMT.W; this.wc.height = DMT.H;
    this.w = this.wc.getContext('2d');
    this.w.imageSmoothingEnabled = false;
    this.dirty = false;
    this.fit();
    window.addEventListener('resize', () => this.fit());
  },
  fit() {
    const ar = 16 / 9;
    let w = window.innerWidth, h = window.innerHeight;
    if (w / h > ar) w = h * ar; else h = w / ar;
    // tam sayı ölçeklere yakınsa keskinlik için yuvarla
    const k = w / 1280;
    if (k >= 1) { const ik = Math.floor(k * 4) / 4; w = 1280 * ik; h = 720 * ik; }
    this.canvas.style.width = Math.floor(w) + 'px';
    this.canvas.style.height = Math.floor(h) + 'px';
  },
  begin() {
    const c = this.ctx;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = '#000'; c.fillRect(0, 0, 1280, 720);
    this.w.setTransform(1, 0, 0, 1, 0, 0);
    this.w.clearRect(0, 0, DMT.W, DMT.H);
    this.dirty = false;
  },
  flush() {
    if (!this.dirty) return;
    const c = this.ctx;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.imageSmoothingEnabled = false;
    c.drawImage(this.wc, 0, 0, 1280, 720);
    this.w.setTransform(1, 0, 0, 1, 0, 0);
    this.w.clearRect(0, 0, DMT.W, DMT.H);
    this.dirty = false;
  },
  px(fn) { this.dirty = true; const g = this.w; g.save(); fn(g); g.restore(); },
  tx(fn) {
    this.flush();
    const c = this.ctx; c.save(); c.setTransform(2, 0, 0, 2, 0, 0); fn(c); c.restore();
  },
  end() { this.flush(); },
};

// ---------- SAHNE YÖNETİCİSİ ----------
DMT.Scenes = {
  registry: {}, current: null, currentName: '', fade: 0, fadeDir: 0, pending: null, locked: false, t: 0,
  register(name, scene) { this.registry[name] = scene; scene.name = name; },
  start(name, params) { this._enter(name, params); this.fade = 1; this.fadeDir = -1; },
  go(name, params, opts = {}) {
    if (this.locked) return false;   // geçiş sırasında ikinci geçiş yok
    this.locked = true;
    this.pending = { name, params };
    this.fadeDir = 1;
    this.fadeSpeed = opts.speed || 2.6;
    return true;
  },
  _enter(name, params) {
    if (this.current && this.current.exit) { try { this.current.exit(); } catch (e) { console.error(e); } }
    DMT.UI.clear();
    const s = this.registry[name];
    if (!s) throw new Error('Sahne yok: ' + name);
    this.current = s; this.currentName = name;
    s.t = 0;
    s.enter(params || {});
  },
  update(dt) {
    this.t += dt;
    if (this.fadeDir > 0) {
      this.fade += dt * (this.fadeSpeed || 2.6);
      if (this.fade >= 1) { this.fade = 1; const p = this.pending; this.pending = null; this._enter(p.name, p.params); this.fadeDir = -1; }
    } else if (this.fadeDir < 0) {
      this.fade -= dt * 2.4;
      if (this.fade <= 0) { this.fade = 0; this.fadeDir = 0; this.locked = false; }
    }
    if (this.current) { this.current.t += dt; this.current.update(dt); }
    DMT.UI.update(dt);
  },
  render(R) {
    if (this.current) this.current.render(R);
    DMT.UI.renderGlobal(R);
    if (this.fade > 0) {
      R.end();
      const c = R.ctx; c.setTransform(1, 0, 0, 1, 0, 0);
      // pixel'li karartma: 8 kademeli
      const a = Math.round(this.fade * 8) / 8;
      c.fillStyle = 'rgba(5,2,6,' + a + ')'; c.fillRect(0, 0, 1280, 720);
    }
  },
  pointerDown(x, y) {
    if (DMT.UI.globalPointer(x, y)) return;
    if (this.locked || !this.current) return;
    if (DMT.UI.pointerDown(x, y)) return;
    if (this.current.pointerDown) this.current.pointerDown(x, y);
  },
  pointerUp(x, y) { if (this.locked || !this.current) return; if (this.current.pointerUp) this.current.pointerUp(x, y); },
  keyDown(e) { if (this.locked || !this.current) return; if (this.current.keyDown) this.current.keyDown(e); },
};

// ---------- ANA DÖNGÜ (sabit adım + biriktirici) ----------
DMT.Loop = {
  STEP: 1 / 60, acc: 0, last: 0, timeScale: 1, running: false, frames: 0, fps: 60, _fpsT: 0, _fpsN: 0,
  start() {
    this.running = true; this.last = performance.now();
    const tick = (now) => {
      if (!this.running) return;
      let dt = (now - this.last) / 1000; this.last = now;
      if (dt > 0.25) dt = 0.25; // sekme geçişi vb.
      this._fpsT += dt; this._fpsN++;
      if (this._fpsT >= 1) { this.fps = this._fpsN / this._fpsT; this._fpsT = 0; this._fpsN = 0; }
      this.acc += dt * this.timeScale;
      let steps = 0;
      while (this.acc >= this.STEP && steps < 8 * Math.max(1, this.timeScale)) { DMT.Scenes.update(this.STEP); this.acc -= this.STEP; steps++; }
      if (steps >= 8 * Math.max(1, this.timeScale)) this.acc = 0;
      const R = DMT.Renderer; R.begin(); DMT.Scenes.render(R); R.end();
      this.frames++;
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  },
};

// ============================================================
//  01 AUDIO — Web Audio ile sentezlenmiş retro SFX (harici dosya yok)
// ============================================================
DMT.Audio = {
  ctx: null, master: null, muted: false, last: {}, voices: 0, MAX_VOICES: 14, noiseBuf: null,
  init() { this.muted = !!DMT.Save.data.muted; },
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      const comp = this.ctx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.15;
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.42;
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 0.6;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.startAmbience();
    } catch (e) { console.warn('[DMT] Ses başlatılamadı', e); this.ctx = null; }
  },
  toggleMute() {
    this.muted = !this.muted;
    const sc = DMT.Scenes && DMT.Scenes.current; if (sc && sc.faro && sc.faro.say) sc.faro.say(this.muted ? 'soundOff' : 'soundOn', { priority: 2 });
    DMT.Save.data.muted = this.muted; DMT.Save.write();
    if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : 0.42, this.ctx.currentTime, 0.03);
  },
  _ok(name, minGap) {
    if (!this.ctx || this.muted) return false;
    const now = this.ctx.currentTime;
    if (this.last[name] && now - this.last[name] < minGap) return false;
    if (this.voices >= this.MAX_VOICES) return false;
    this.last[name] = now; return true;
  },
  _tone(type, f0, f1, dur, vol, delay = 0, attack = 0.004) {
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    this.voices++; o.onended = () => { this.voices--; };
    o.start(t); o.stop(t + dur + 0.02);
  },
  _noise(dur, vol, fType, f0, f1, delay = 0, q = 1) {
    const c = this.ctx, t = c.currentTime + delay;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = fType; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    this.voices++; s.onended = () => { this.voices--; };
    s.start(t); s.stop(t + dur + 0.02);
  },
  play(name) {
    const S = this.SFX[name];
    if (!S) return;
    if (!this._ok(name, S.gap || 0.03)) return;
    try { S.fn.call(this); } catch (e) { /* ses hatası oyunu durdurmasın */ }
  },
  // ortam: çok hafif, düşük bir uğultu + mum çıtırtısı
  startAmbience() {
    if (!this.ctx) return;
    const c = this.ctx;
    const o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = 55; o2.type = 'triangle'; o2.frequency.value = 82.4;
    f.type = 'lowpass'; f.frequency.value = 180; g.gain.value = 0.018;
    o.connect(f); o2.connect(f); f.connect(g); g.connect(this.master);
    o.start(); o2.start();
    this.amb = g;
  },
};

// ============================================================
//  02 GFX — pixel çizim yardımcıları, sprite önbelleği, metin, UI
// ============================================================
const P = DMT.PAL;
const G = (DMT.G = {
  rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); },
  px(g, x, y, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, 1, 1); },
  // Bresenham çizgi (AA yok)
  line(g, x0, y0, x1, y1, c, t = 1) {
    x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
    g.fillStyle = c;
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy, n = 0; const off = Math.floor(t / 2);
    while (n++ < 2000) {
      g.fillRect(x0 - off, y0 - off, t, t);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  },
  // dolu pixel daire (scanline)
  circ(g, cx, cy, r, c) {
    g.fillStyle = c; cx |= 0; cy |= 0; r = Math.max(0, r | 0);
    for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y + r * 0.8)); g.fillRect(cx - w, cy + y, w * 2 + 1, 1); }
  },
  ellipse(g, cx, cy, rx, ry, c) {
    g.fillStyle = c; cx |= 0; cy |= 0; rx = Math.max(1, rx | 0); ry = Math.max(1, ry | 0);
    for (let y = -ry; y <= ry; y++) { const w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry + 0.6)))); g.fillRect(cx - w, cy + y, w * 2 + 1, 1); }
  },
  ring(g, cx, cy, r, c, t = 1) {
    g.fillStyle = c; cx |= 0; cy |= 0; r |= 0;
    let x = r, y = 0, err = 1 - r;
    const plot = (a, b) => { g.fillRect(cx + a, cy + b, t, t); g.fillRect(cx - a - t + 1, cy + b, t, t); g.fillRect(cx + a, cy - b - t + 1, t, t); g.fillRect(cx - a - t + 1, cy - b - t + 1, t, t); };
    while (x >= y) { plot(x, y); plot(y, x); y++; if (err < 0) err += 2 * y + 1; else { x--; err += 2 * (y - x) + 1; } }
  },
  ellRing(g, cx, cy, rx, ry, c) {
    g.fillStyle = c; const n = Math.max(24, (rx + ry) * 3);
    for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2; g.fillRect(Math.round(cx + Math.cos(a) * rx), Math.round(cy + Math.sin(a) * ry), 1, 1); }
  },
  // sıralı (Bayer) dither ile yarı ton dolgu
  BAYER: [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5],
  dither(g, x, y, w, h, c, level) { // level 0..1
    g.fillStyle = c; const th = level * 16;
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const b = G.BAYER[((y + j) & 3) * 4 + ((x + i) & 3)]; if (b < th) g.fillRect(x + i, y + j, 1, 1); }
  },
  ditherCirc(g, cx, cy, r, c, level) {
    g.fillStyle = c; const th = level * 16;
    for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y)); for (let x = -w; x <= w; x++) { const X = cx + x, Y = cy + y; if (G.BAYER[(Y & 3) * 4 + (X & 3)] < th) g.fillRect(X, Y, 1, 1); } }
  },
  // kademeli ışık havuzu (bantlı, pixel art uyumlu)
  glow(g, cx, cy, r, color, alpha = 0.18, bands = 4) {
    g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = alpha;
    for (let i = 0; i < bands; i++) G.circ(g, cx, cy, Math.round(r * (1 - i / bands)), color);
    g.restore();
  },
  // ---------- sprite önbelleği ----------
  cache: new Map(),
  canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return c; },
  cached(key, w, h, drawFn) {
    let c = this.cache.get(key);
    if (!c) { c = this.canvas(w, h); drawFn(c.getContext('2d'), w, h); this.cache.set(key, c); }
    return c;
  },
  // piksel haritası -> canvas.  rows: string[], pal: {char: color}
  fromMap(rows, pal) {
    const h = rows.length, w = rows.reduce((m, r) => Math.max(m, r.length), 0);
    const c = this.canvas(w, h), g = c.getContext('2d');
    for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++) { const ch = rows[y][x]; const col = pal[ch]; if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); } }
    return c;
  },
  // bir sprite'ın tek renkli silüetini üret (hit flash için)
  silhouette(src, color) {
    const c = this.canvas(src.width, src.height), g = c.getContext('2d');
    g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
    return c;
  },
  outline(src, color) { // 1px dış hat ekler (+2 boyut)
    const c = this.canvas(src.width + 2, src.height + 2), g = c.getContext('2d');
    const s = this.silhouette(src, color);
    for (const [dx, dy] of [[0, 1], [2, 1], [1, 0], [1, 2]]) g.drawImage(s, dx, dy);
    g.drawImage(src, 1, 1); return c;
  },
  draw(g, img, x, y, flip = false) {
    if (!flip) { g.drawImage(img, x | 0, y | 0); return; }
    g.save(); g.translate((x | 0) + img.width, y | 0); g.scale(-1, 1); g.drawImage(img, 0, 0); g.restore();
  },

  // ---------- PANELLER ----------
  panel(g, x, y, w, h, style = 'dark') {
    x |= 0; y |= 0; w |= 0; h |= 0;
    const S = {
      dark: [P.ink, P.gold1, P.brown1, '#1a1018'],
      wood: [P.brown1, P.gold1, P.brown3, P.brown2],
      bord: ['#2a0c14', P.gold2, P.bord, '#3a1020'],
      paper: ['#d9c8a0', P.brown2, '#b8a47c', '#cbb88e'],
      glass: ['rgba(10,6,14,0.82)', P.gold1, P.brown1, 'rgba(26,16,24,0.82)'],
    }[style] || [P.ink, P.gold1, P.brown1, P.soot];
    G.rect(g, x + 1, y + 1, w - 2, h - 2, S[0]);
    // iç doku
    G.rect(g, x + 3, y + 3, w - 6, 1, S[3]);
    // dış altın çerçeve
    G.rect(g, x + 2, y, w - 4, 1, S[1]); G.rect(g, x + 2, y + h - 1, w - 4, 1, S[1]);
    G.rect(g, x, y + 2, 1, h - 4, S[1]); G.rect(g, x + w - 1, y + 2, 1, h - 4, S[1]);
    G.px(g, x + 1, y + 1, S[1]); G.px(g, x + w - 2, y + 1, S[1]); G.px(g, x + 1, y + h - 2, S[1]); G.px(g, x + w - 2, y + h - 2, S[1]);
    // iç koyu çerçeve
    G.rect(g, x + 2, y + 1, w - 4, 1, S[2]); G.rect(g, x + 1, y + 2, 1, h - 4, S[2]);
    G.rect(g, x + 2, y + h - 2, w - 4, 1, '#000'); G.rect(g, x + w - 2, y + 2, 1, h - 4, '#000');
    // köşe perçinleri
    if (w > 24 && h > 18) for (const [cx, cy] of [[x + 3, y + 3], [x + w - 5, y + 3], [x + 3, y + h - 5], [x + w - 5, y + h - 5]]) { G.rect(g, cx, cy, 2, 2, P.gold2); G.px(g, cx, cy, P.gold4); }
  },
  ornament(g, cx, y, w, c = P.gold2) { // yatay gotik süs çizgisi
    G.rect(g, cx - w / 2, y, w, 1, P.gold1);
    G.rect(g, cx - 3, y - 2, 7, 5, P.ink); G.rect(g, cx - 2, y - 1, 5, 3, c); G.px(g, cx, y - 3, c); G.px(g, cx, y + 3, c);
    G.px(g, cx - w / 2 - 2, y, c); G.px(g, cx + w / 2 + 1, y, c);
  },
  bar(g, x, y, w, h, frac, fg, bg = P.ink, hi = null) {
    G.rect(g, x - 1, y - 1, w + 2, h + 2, '#000'); G.rect(g, x, y, w, h, bg);
    const fw = Math.round(w * U.clamp(frac, 0, 1));
    if (fw > 0) { G.rect(g, x, y, fw, h, fg); if (hi) G.rect(g, x, y, fw, 1, hi); }
  },
});

// ---------- METİN (keskin katman, dünya birimleri) ----------
DMT.FONT = {
  title: "Georgia, 'DejaVu Serif', 'Times New Roman', serif",
  body: "'Trebuchet MS', 'DejaVu Sans', Verdana, Arial, sans-serif",
  mono: "'Courier New', 'DejaVu Sans Mono', monospace",
};
const T = (DMT.T = {
  font(c, size, kind = 'body', bold = true) { c.font = (bold ? 'bold ' : '') + size + 'px ' + DMT.FONT[kind]; },
  text(c, str, x, y, o = {}) {
    const size = o.size || 8;
    T.font(c, size, o.font || 'body', o.bold !== false);
    c.textAlign = o.align || 'left'; c.textBaseline = o.base || 'top';
    if (o.alpha != null) c.globalAlpha = o.alpha;
    if (o.outline !== false) {
      c.lineJoin = 'round'; c.lineWidth = o.ow || Math.max(1.6, size * 0.28);
      c.strokeStyle = o.oc || 'rgba(8,4,8,0.95)'; c.strokeText(str, x, y);
    }
    if (o.shadow) { c.fillStyle = o.shadow; c.fillText(str, x + 0.5, y + 1); }
    c.fillStyle = o.color || P.white; c.fillText(str, x, y);
    if (o.alpha != null) c.globalAlpha = 1;
  },
  wrap(c, str, maxW, size, kind = 'body') {
    T.font(c, size, kind);
    const out = [];
    for (const para of String(str).split('\n')) {
      const words = para.split(' '); let line = '';
      for (const w of words) { const test = line ? line + ' ' + w : w; if (c.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test; }
      out.push(line);
    }
    return out;
  },
  para(c, str, x, y, maxW, o = {}) {
    const size = o.size || 7, lh = o.lh || size * 1.3;
    const lines = T.wrap(c, str, maxW, size, o.font || 'body');
    lines.forEach((l, i) => T.text(c, l, x, y + i * lh, o));
    return lines.length * lh;
  },
  width(c, str, size, kind = 'body') { T.font(c, size, kind); return c.measureText(str).width; },
});

// ---------- UI SİSTEMİ ----------
// Butonlar sahneye kayıtlı; sahne değişince UI.clear() hepsini siler.
DMT.UI = {
  buttons: [], hover: null, cursorHover: false, cursorMode: 'arrow', tip: null,
  clear() { this.buttons = []; this.hover = null; this.tip = null; },
  button(o) {
    const b = Object.assign({ id: 'b' + this.buttons.length, x: 0, y: 0, w: 60, h: 16, label: '', style: 'bord', group: 'main', size: 8,
      enabled: () => true, visible: () => true, onClick: () => {}, hoverT: 0, pressT: 0, sub: null }, o);
    this.buttons.push(b); return b;
  },
  remove(group) { this.buttons = this.buttons.filter((b) => b.group !== group); },
  update(dt) {
    const I = DMT.Input; let h = null;
    if (!DMT.Scenes.locked) for (let i = this.buttons.length - 1; i >= 0; i--) { const b = this.buttons[i]; if (b.visible() && U.inRect(I.x, I.y, b)) { h = b; break; } }
    if (h !== this.hover) { if (h && h.enabled()) DMT.Audio.play('hover'); this.hover = h; }
    for (const b of this.buttons) { b.hoverT = U.clamp(b.hoverT + (b === h && b.enabled() ? dt * 8 : -dt * 8), 0, 1); b.pressT = Math.max(0, b.pressT - dt * 6); }
    this.cursorHover = !!(h && h.enabled()) || this.sceneHover;
    this.sceneHover = false;
  },
  pointerDown(x, y) {
    for (let i = this.buttons.length - 1; i >= 0; i--) {
      const b = this.buttons[i];
      if (!b.visible() || !U.inRect(x, y, b)) continue;
      if (!b.enabled()) { DMT.Audio.play('deny'); if (b.onDenied) b.onDenied(); return true; }
      b.pressT = 1; if (!b.silent) DMT.Audio.play('click'); b.onClick(b); return true;
    }
    return false;
  },
  drawButton(g, b) {
    if (!b.visible()) return;
    const en = b.enabled(), off = b.pressT > 0.5 ? 1 : 0, hv = b.hoverT;
    const x = b.x, y = b.y + off, w = b.w, h = b.h;
    const base = { bord: [P.bord, P.bord2, P.bord3], wood: [P.brown2, P.brown3, P.brown4], gold: [P.gold0, P.gold1, P.gold2], dark: [P.soot, P.soot2, P.stone1], green: [P.green1, P.green2, P.green3] }[b.style] || [P.bord, P.bord2, P.bord3];
    const c0 = en ? base[0] : P.stone0, c1 = en ? (hv > 0.5 ? base[2] : base[1]) : P.stone1, rim = en ? (hv > 0.5 ? P.gold3 : P.gold1) : P.stone2;
    G.rect(g, x + 1, y + h, w - 2, 1 - off, '#000');
    G.rect(g, x + 1, y, w - 2, h, rim); G.rect(g, x, y + 1, w, h - 2, rim);
    G.rect(g, x + 1, y + 1, w - 2, h - 2, c0);
    G.rect(g, x + 2, y + 2, w - 4, Math.ceil((h - 4) / 2), c1);
    G.rect(g, x + 2, y + 2, w - 4, 1, en ? 'rgba(255,240,200,0.25)' : 'rgba(255,255,255,0.05)');
    if (en && hv > 0) { // köşe kıvılcımları
      const a = Math.floor(DMT.Scenes.t * 6) % 2;
      G.px(g, x - 2 - a, y + h / 2, P.gold3); G.px(g, x + w + 1 + a, y + h / 2, P.gold3);
    }
  },
  drawButtonText(c, b) {
    if (!b.visible()) return;
    const en = b.enabled(), off = b.pressT > 0.5 ? 1 : 0;
    const col = en ? (b.hoverT > 0.5 ? P.gold4 : (b.color || P.gold3)) : '#7a7280';
    T.text(c, b.label, b.x + b.w / 2, b.y + b.h / 2 + off - (b.sub ? 3 : 0), { size: b.size, align: 'center', base: 'middle', color: col, font: b.font || 'title' });

// ---------- PARÇACIK HAVUZU ----------
DMT.Particles = class {
  constructor(max = 400) { this.max = max; this.list = []; this.pool = []; }
  spawn(o) {
    if (this.list.length >= this.max) return null;
    const p = this.pool.pop() || {};
    p.x = o.x; p.y = o.y; p.vx = o.vx || 0; p.vy = o.vy || 0; p.g = o.g || 0; p.life = o.life || 0.5; p.t = 0;
    p.c = o.c || P.white; p.c2 = o.c2 || null; p.s = o.s || 1; p.drag = o.drag || 0; p.z = o.z || 0; p.vz = o.vz || 0; p.kind = o.kind || 'dot';
    this.list.push(p); return p;
  }
  burst(x, y, n, o) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, sp = U.rand(o.min || 20, o.max || 80); this.spawn(Object.assign({}, o, { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * (o.flat || 1), life: U.rand((o.life || 0.5) * 0.6, o.life || 0.5), c: Array.isArray(o.c) ? U.pick(o.c) : o.c })); } }
  update(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i]; p.t += dt;
      if (p.t >= p.life) { L[i] = L[L.length - 1]; L.pop(); this.pool.push(p); continue; }
      p.vy += p.g * dt; if (p.drag) { const d = Math.pow(1 - p.drag, dt * 60); p.vx *= d; p.vy *= d; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.vz || p.z) { p.vz -= 260 * dt; p.z += p.vz * dt; if (p.z < 0) { p.z = 0; p.vz = -p.vz * 0.4; } }
    }
  }
  draw(g) {
    for (const p of this.list) {
      const k = p.t / p.life;
      const c = p.c2 && k > 0.5 ? p.c2 : p.c;
      const s = p.kind === 'shrink' ? Math.max(1, Math.round(p.s * (1 - k))) : p.s;
      if (p.kind === 'blink' && Math.floor(p.t * 20) % 2) continue;
      G.rect(g, Math.round(p.x - s / 2), Math.round(p.y - s / 2 - p.z), s, s, c);
    }
  }
  clear() { while (this.list.length) this.pool.push(this.list.pop()); }
};

  skillCost(s, lv) { return Math.max(1, Math.round(s.cost[lv] * this.skillCostScale)); },
  // savaş coinlerini dilimli olarak Bank Coin'e çevirir (ondalıklı döner)
  convertCoins(n) {
    let rest = Math.max(0, n), prev = 0, out = 0;
    for (const [cap, rate] of this.bankTiers) { const span = Math.min(rest, cap - prev); if (span <= 0) break; out += span * rate; rest -= span; prev = cap; }
    return out;
  },
  // ham coin bonusu (+0.75 gibi) → yumuşak sınırlı çarpan
  coinMult(bonus) {
    const c = this.coinBonusSoftCap;
    return 1 + (bonus <= c ? bonus : c + (bonus - c) * this.coinBonusOverflow);
  },
  cardPrice(def, buys) {
    const infl = 1 + Math.min(this.priceInflationCap, buys * this.priceInflation);
    return Math.max(1, Math.round(U.randi(def.price[0], def.price[1]) * (this.priceScale[def.rarity] || 1) * infl));
  },
};

// ============================================================

DMT.FaroMemory = { hist: {}, lastLine: '', temper: null }; // sahneler arası tekrar önleme

DMT.Faro = class {
  constructor(opts = {}) {
    this.mood = 'neutral'; this.moodT = 0;
    this.action = null; this.actionT = 0; this.actionDur = 0;
    this.t = 0; this.breathT = 0; this.blinkT = U.rand(2, 4); this.blink = 0;
    this.look = 0; this.lookTarget = 0; this.lookTimer = 2; this.lookOverride = null;
    this.hands = { l: { x: -20, y: -2, pose: 'flat', tap: -1 }, r: { x: 20, y: -2, pose: 'flat', tap: -1 } };
    this.handOverride = { l: null, r: null };
    this.tapT = U.rand(2, 5); this.tapHand = 'r'; this.tapPhase = -1;
    this.bubble = null; this.cooldown = 0; this.catCool = {};
    this.globalGap = opts.globalGap || 4.2;
    this.jaw = 0; this.lastEventT = 0; this.quietFor = 0;
    this.small = !!opts.small; this.wave = 0;
    this.shake = 0; this.glow = 1;
  }
  setMood(m, dur = 4) { this.mood = m; this.moodT = dur; }
  act(name, dur = 1.2) {
    const PRI = { deal: 5, celebrate: 4, laugh: 3, surprised: 3, point: 3, annoyed: 2, bored: 1, greet: 2 };
    if (this.action && (PRI[this.action] || 0) > (PRI[name] || 0) && this.actionT < this.actionDur) return false;
    this.action = name; this.actionT = 0; this.actionDur = dur;
    if (name === 'laugh') DMT.Audio.play('laugh');
    if (name === 'surprised') DMT.Audio.play('hmm');
    return true;
  }
  isBusy() { return !!this.action && this.actionT < this.actionDur; }
  // --- diyalog ---
  pickLine(cat) {
    const raw = DMT.Data.LINES[cat];
    if (!raw || !raw.length) return null;
    // V2: { l, m } satırları yalnızca Faro'nun o geceki huyuyla (FaroMemory.temper) eşleşirse
    const temper = DMT.FaroMemory.temper;
    let pool = raw.filter((x) => typeof x === 'string' || !x.m || !temper || x.m === temper).map((x) => (typeof x === 'string' ? x : x.l));
    if (!pool.length) pool = raw.map((x) => (typeof x === 'string' ? x : x.l));
    const mem = DMT.FaroMemory, h = (mem.hist[cat] = mem.hist[cat] || []);
    let cands = pool.filter((l) => !h.includes(l) && l !== mem.lastLine);
    if (!cands.length) { h.length = 0; cands = pool.filter((l) => l !== mem.lastLine); if (!cands.length) cands = pool; }
    const line = U.pick(cands);
    h.push(line); if (h.length > Math.max(1, Math.floor(pool.length / 2))) h.shift();
    mem.lastLine = line;
    return line;
  }
  // priority: 0 düşük (olay yorumu), 1 normal, 2 önemli (kural/olay), 3 zorunlu
  say(cat, o = {}) {
    const pr = o.priority == null ? 1 : o.priority;
    if (pr < 3) {
      if (this.cooldown > 0 && pr < 2) return false;
      if (this.bubble && this.bubble.pr > pr && this.bubble.t < this.bubble.dur) return false;
      if ((this.catCool[cat] || 0) > 0) return false;
    }
    const text = o.text || this.pickLine(cat);
    if (!text) return false;
    this.bubble = { text, shown: 0, t: 0, dur: o.dur || Math.max(2.4, 1.2 + text.length * 0.055), pr };
    this.cooldown = o.gap || this.globalGap;
    this.catCool[cat] = o.catGap == null ? 9 : o.catGap;
    this.quietFor = 0;
    return true;
  }
  update(dt) {
    this.t += dt; this.breathT += dt; this.cooldown -= dt; this.quietFor += dt;
    for (const k in this.catCool) this.catCool[k] -= dt;
    if (this.moodT > 0) { this.moodT -= dt; if (this.moodT <= 0) this.mood = 'neutral'; }
    if (this.action) { this.actionT += dt; if (this.actionT >= this.actionDur) this.action = null; }
    // göz kırpma
    this.blinkT -= dt; if (this.blinkT <= 0) { this.blink = 0.12; this.blinkT = U.rand(2.2, 5.5); }
    if (this.blink > 0) this.blink -= dt;
    // bakış
    this.lookTimer -= dt; if (this.lookTimer <= 0) { this.lookTarget = U.pick([-1, 0, 0, 1]); this.lookTimer = U.rand(1.2, 3.5); }
    const lt = this.lookOverride != null ? this.lookOverride : this.lookTarget;
    this.look += (lt - this.look) * Math.min(1, dt * 6);
    this.glow = 0.85 + Math.sin(this.t * 9) * 0.1 + Math.sin(this.t * 23) * 0.05;
    // parmak ritmi
    this.tapT -= dt;
    if (this.tapT <= 0 && this.tapPhase < 0) { this.tapPhase = 0; this.tapHand = U.pick(['l', 'r']); }
    if (this.tapPhase >= 0) {
      this.tapPhase += dt * (this.mood === 'annoyed' ? 22 : 11);
      if (Math.floor(this.tapPhase) !== Math.floor(this.tapPhase - dt * 11) && !this.small) { /* ses: hafif */ }
      if (this.tapPhase >= 8) { this.tapPhase = -1; this.tapT = this.mood === 'annoyed' ? 0.3 : U.rand(2.5, 6); }
    }
    // konuşma balonu
    const b = this.bubble;
    if (b) {
      b.t += dt;
      const prev = Math.floor(b.shown);
      b.shown = Math.min(b.text.length, b.shown + dt * 42);
      if (Math.floor(b.shown) !== prev && Math.floor(b.shown) % 3 === 0 && b.shown < b.text.length) DMT.Audio.play('blip');
      this.jaw = b.shown < b.text.length ? (Math.floor(this.t * 14) % 3 === 0 ? 2 : Math.floor(this.t * 14) % 3 === 1 ? 1 : 0) : 0;
      if (b.t > b.dur) this.bubble = null;
    } else this.jaw = 0;
    if (this.wave > 0) this.wave = Math.max(0, this.wave - dt * 0.6);
  }
  get talking() { return !!this.bubble && this.bubble.shown < this.bubble.text.length; }
  // dış kontrol: el hedefi (ör. kart dağıtma)
  setHand(side, h) { this.handOverride[side] = h; }

  // ---- büyük poz ----
  pose() {
    const t = this.t, a = this.action, m = this.mood;
    const st = { hx: 0, hy: 0, breath: Math.floor(this.breathT * 0.9) % 2, eyes: m === 'neutral' ? 'neutral' : m, look: this.look, jaw: this.jaw, glow: this.glow, blink: this.blink > 0, hands: null };
    let L = { x: -20, y: -2, pose: 'flat', tap: -1 }, R = { x: 20, y: -2, pose: 'flat', tap: -1 };
    if (this.tapPhase >= 0) { const tp = Math.floor(this.tapPhase) % 4; if (this.tapHand === 'l') L.tap = tp; else R.tap = tp; }
    if (m === 'bored' && !a) { R = { x: 7, y: -44, pose: 'fist' }; st.hx = 2; st.hy = 1; st.look = 1; }
    if (a === 'laugh') {
      const k = Math.floor(t * 9) % 2; st.eyes = 'laugh'; st.jaw = k ? 5 : 3; st.hy = k ? -2 : 0; st.hx = k ? 1 : -1;
      L = { x: -22, y: k ? -7 : -2, pose: 'flat' }; R = { x: 22, y: k ? -2 : -7, pose: 'flat' };
    } else if (a === 'celebrate') {
      const k = Math.floor(t * 6) % 2; st.eyes = 'amused'; st.jaw = 4; st.hy = k ? -2 : 0;
      L = { x: -32, y: -58 - k * 3, pose: 'fist' }; R = { x: 32, y: -58 - (1 - k) * 3, pose: 'fist' };
    } else if (a === 'surprised') {
      st.eyes = 'surprised'; st.jaw = 3; st.hy = -2;
      L = { x: -27, y: -22, pose: 'open' }; R = { x: 27, y: -22, pose: 'open' };
    } else if (a === 'annoyed') {
      st.eyes = 'annoyed'; st.hy = 1; R.tap = Math.floor(t * 22) % 4; L.tap = Math.floor(t * 22 + 2) % 4;
    } else if (a === 'bored') {
      st.eyes = 'bored'; R = { x: 7, y: -44, pose: 'fist' }; st.hx = 2; st.hy = 1;
    } else if (a === 'point') {
      st.eyes = 'amused'; R = { x: 36, y: -10, pose: 'point' }; st.hx = 1;
    } else if (a === 'deal') {
      st.eyes = st.eyes === 'bored' ? 'neutral' : st.eyes;
    }
    if (this.handOverride.l) L = Object.assign({}, L, this.handOverride.l);
    if (this.handOverride.r) R = Object.assign({}, R, this.handOverride.r);
    // yumuşak el geçişi
    this.hands.l = this._ease(this.hands.l, L); this.hands.r = this._ease(this.hands.r, R);
    st.hands = this.hands;
    if (this.talking && st.eyes !== 'laugh') st.jaw = Math.max(st.jaw, this.jaw);
    return st;
  }
  _ease(cur, tgt) {
    const k = 0.35;
    return { x: cur.x + (tgt.x - cur.x) * k, y: cur.y + (tgt.y - cur.y) * k, pose: tgt.pose, tap: tgt.tap };
  }
  // ---- küçük poz (bar) ----
  smallPose() {
    const a = this.action, t = this.t;
    const st = { hy: Math.floor(this.breathT * 0.9) % 2, look: this.look, jaw: this.talking ? (Math.floor(t * 12) % 2) : 0, eyes: 'neutral', blink: this.blink > 0, tap: this.tapPhase >= 0 ? Math.floor(this.tapPhase) % 3 : -1, wave: 0, hx: 0 };
    if (a === 'laugh') { st.eyes = 'laugh'; st.jaw = 1; st.hy = Math.floor(t * 9) % 2 ? -1 : 0; }
    if (a === 'greet') { st.wave = this.actionT / this.actionDur || 0.01; st.eyes = 'laugh'; }
    if (a === 'bored') { st.hx = 1; }
    return st;
  }
  // ---- konuşma balonu çizimi ----
  // anchor: balon kuyruğunun işaret ettiği nokta; side: 'left' balon anchor'ın sağında
  drawBubble(R, x, y, maxW, o = {}) {
    const b = this.bubble;
    if (!b) return;
    const txt = b.text.slice(0, Math.ceil(b.shown));
    let lines = [];
    const size = o.size || 7.5;
    R.tx((c) => { lines = T.wrap(c, b.text, maxW - 14, size); });
    const lh = size * 1.32;
    const h = Math.round(lines.length * lh + 12), w = maxW;
    const pop = Math.min(1, b.t * 8);
    const fade = b.t > b.dur - 0.3 ? Math.max(0, (b.dur - b.t) / 0.3) : 1;
    if (fade <= 0) return;
    let bx = Math.round(x), by = Math.round(y - (1 - pop) * 3);
    if (o.align === 'right') bx = Math.round(x - w);
    if (o.valign === 'bottom') by = Math.round(by - h);
    R.px((g) => {
      g.globalAlpha = fade;
      G.rect(g, bx + 2, by + h, w - 2, 2, 'rgba(0,0,0,0.5)');
      G.panel(g, bx, by, w, h, 'paper');
      // kuyruk
      if (o.tail) {
        const [tx, ty] = o.tail;
        const baseX = U.clamp(tx, bx + 10, bx + w - 10), baseY = ty < by ? by : by + h - 1;
        const dirY = ty < by ? -1 : 1;
        for (let i = 0; i < 6; i++) { const px = Math.round(baseX + (tx - baseX) * (i / 6)); G.rect(g, px - (5 - i), baseY + dirY * i, (5 - i) * 2 + 1, 1, i === 0 ? '#d9c8a0' : '#cbb88e'); G.px(g, px - (5 - i) - 1, baseY + dirY * i, P.brown2); G.px(g, px + (5 - i) + 1, baseY + dirY * i, P.brown2); }
      }
      g.globalAlpha = 1;
    });
    R.tx((c) => {
      c.globalAlpha = fade;
      let shownN = txt.length, acc = 0;
      lines.forEach((l, i) => {
        const part = l.slice(0, Math.max(0, shownN - acc)); acc += l.length + 1;
        T.text(c, part, bx + 7, by + 6 + i * lh, { size, color: '#2a140c', outline: false, font: 'title' });
      });
      c.globalAlpha = 1;
    });
  }
};

      cards: {}, cardOrder: [],
      // V2: başlangıç harçlığı cüzdana girer ama "toplanan coin" sayılmaz → kalıcı ödül üretmez.
      totalCollectedCoins: 0, currentRunCoins: start, spentRunCoins: 0, startCoins: start, refundCoins: 0,
      coinSrc: { drop: 0, minigame: 0, bonus: 0 },
      kills: 0, dmgDealt: 0, dmgTaken: 0, crits: 0, time: 0, won: false, ended: false,
      rewardClaimed: false, reward: 0, breakdown: null, offers: 0, buys: 0, passes: 0, coinsMissed: 0,
      buffs: [], lastBreathUsed: 0, maxCombo: 0,
      cardDmg: {}, cardHeal: {}, healed: 0, tmp: { adr: 0, dance: 0 }, buyLog: [],
      // V3
      mods: { dmg: 1, aspd: 1, crit: 0, priceMul: 1, priceAdd: 0, coinMul: 1, maxHpMul: 1 }, tricks: [], trapsTaken: 0, trapsAvoided: 0, streak: 0, maxStreak: 0, killStack: 0, ilahi: 0,
    };
    this.current = run;

  },
  // kind: 'drop' (düşman/olay coinleri) | 'minigame' | 'bonus' → toplanan coin sayılır; 'refund' → yalnızca cüzdan
  addCoins(run, n, kind = 'drop') {
    n = Math.max(0, Math.floor(n));
    run.currentRunCoins += n;
    if (kind === 'refund') { run.refundCoins += n; return; }
    run.totalCollectedCoins += n;
    run.coinSrc[kind] = (run.coinSrc[kind] || 0) + n;
  },
  spend(run, n) { // kart satın alma
    n = Math.floor(n);
    if (!(n >= 0) || run.currentRunCoins < n) return false;
    run.currentRunCoins -= n; run.spentRunCoins += n; return true;
  },
  addCard(run, id) {
    const def = DMT.Data.cardById(id);
    if (def && (run.cards[id] || 0) >= def.max) return false; // yığın sınırı
    run.cards[id] = (run.cards[id] || 0) + 1;
    run.cardOrder.push(id);
    return true;
  },
  stacks(run, id) { return run.cards[id] || 0; },
  metaRewardBonus() { return 1 + DMT.Save.skillLevel('reward') * DMT.Balance.rewardSkillPer; },
  // V2 kalıcı ödül: (dilimli coin dönüşümü + süre payı + zafer payı) × masa × sonuç × Kasa Payı
  breakdown(run) {
    const B = DMT.Balance, dur = run.table.dur || 90;
    const collected = run.totalCollectedCoins; // başlangıç harçlığı ve iadeler HARİÇ
    const coinPart = B.convertCoins(collected);
    const timePart = B.survivalBank * U.clamp(run.time / dur, 0, 1);
    const winPart = run.won ? B.winBank : 0;
    const base = coinPart + timePart + winPart;
    const tableMult = run.table.mult, outcome = run.won ? B.outcomeMult.win : B.outcomeMult.loss, skill = this.metaRewardBonus();
    const total = Math.max(B.minReward, Math.floor(base * tableMult * outcome * skill));
    return { collected, coinPart, timePart, winPart, base, tableMult, outcome, skill, total, effRate: collected ? coinPart / collected : 0 };
  },
  computeReward(run) { return this.breakdown(run).total; },
  // Ödül yalnızca bir kez bankaya eklenir.
  claimReward(run) {
    if (run.rewardClaimed) return run.reward;
    run.breakdown = this.breakdown(run);
    run.reward = run.breakdown.total;
    run.rewardClaimed = true;
    const S = DMT.Save;
    S.data.stats.runs += 1; if (run.won) S.data.stats.wins += 1;
    S.data.stats.v2Runs = (S.data.stats.v2Runs || 0) + 1;
    S.data.stats.bestKills = Math.max(S.data.stats.bestKills, run.kills);
    S.data.stats.bestReward = Math.max(S.data.stats.bestReward || 0, run.reward);
    this.faroNotes(run); // V3: Faro'nun sırları + günlüğü (write() aşağıda)
    S.addBank(run.reward); // write() içerir
    DMT.BalanceLog.push(DMT.BalanceLog.report(run));
    return run.reward;
  },
  // ---- V3: Faro'nun sırları ve günlüğü (eski tr.js: secret*/journal* metinleri) ----
  faroNotes(run) {
    const d = DMT.Save.data, st = d.stats, hero = run.hero.name;
    d.lastHeroes = (d.lastHeroes || []).concat(run.heroId).slice(-5);
    if (!run.won) { d.heroDeaths = d.heroDeaths || {}; d.heroDeaths[run.heroId] = (d.heroDeaths[run.heroId] || 0) + 1; }
    let sameSpot = false;
    if (run.deathPos) { const L = (d.deathSpots || []).concat(run.deathPos).slice(-12); d.deathSpots = L; sameSpot = L.filter((p) => U.dist(p.x, p.y, run.deathPos.x, run.deathPos.y) < 22).length >= 3; }
    const runNo = st.runs; // claimReward sayacı zaten artırdı
    const hr = new Date().getHours();
    const conds = [
      ['secretNoCardsWin', run.won && run.buys === 0],
      ['secretOneHundredRuns', runNo >= 100],
      ['secretFiftyRuns', runNo >= 50],
      ['secretSameHeroTenDeaths', !run.won && (d.heroDeaths[run.heroId] || 0) >= 10],
      ['secretPerfectRun', run.won && run.buys <= 3 && run.kills >= 110],
      ['secretDiedSameSpotThree', sameSpot],
      ['secretMidnightPlay', hr >= 0 && hr < 4],
    ];
    d.secrets = d.secrets || [];
    for (const [id, ok] of conds) if (ok && !d.secrets.includes(id)) { d.secrets.push(id); run.secret = id; break; }
    const j = run.kills === 0 ? 'Run ' + runNo + '. Sıfır öldürme. Bir rekor bu. Yanlış türde.'
      : run.buys === 0 ? 'Run ' + runNo + '. ' + run.kills + ' öldürme. Hiç kart almadı. İnat mı, strateji mi.'
      : run.won && U.chance(0.5) ? 'Run ' + runNo + '. ' + run.kills + ' öldürme. Kazandı. Bu sefer izlemekten zevk aldım.'
      : run.trapsTaken >= 2 ? 'Run ' + runNo + '. ' + run.trapsTaken + ' tuzağa bastı. Her birinde güldüm.'
      : U.chance(0.5) ? 'Run ' + runNo + '. ' + run.kills + ' öldürme. ' + run.buys + ' kart. Seçimiydi.'
      : 'Run ' + runNo + '. ' + run.kills + ' öldürme. Hep ' + hero + ' ile.';
    d.journal = (d.journal || []).concat(j).slice(-20);
  },
  // ---- run analizi (RunEnd + balance raporu) ----
  synergy(run) {
    const sc = {};
    for (const id in run.cards) { const d = DMT.Data.cardById(id); if (!d) continue; for (const t of d.tags) sc[t] = (sc[t] || 0) + run.cards[id]; }
    // 'sustain' bir build yönü değil; yalnızca başka etiket yoksa baskın sayılır
    let arr = Object.entries(sc).sort((a, b) => b[1] - a[1]);
    if (arr.some((x) => x[0] !== 'sustain')) arr = arr.filter((x) => x[0] !== 'sustain');
    return { scores: sc, top: arr.length ? arr[0][0] : null, second: arr.length > 1 && arr[1][1] >= 2 ? arr[1][0] : null };
  },
  cardImpact(run) {
    const list = [];
    for (const id in run.cards) {
      const d = DMT.Data.cardById(id); if (!d) continue;
      list.push({ id, d, n: run.cards[id], dmg: Math.round(run.cardDmg[id] || 0), heal: Math.round(run.cardHeal[id] || 0) });
    }
    list.sort((a, b) => (b.dmg + b.heal * 2) - (a.dmg + a.heal * 2));
    let cardTotal = 0; for (const x of list) cardTotal += x.dmg;
    return { list, cardTotal };
  },
};

// Balance raporu: her run sonunda kaydedilir (ayrı anahtar, oyun kaydına dokunmaz). Konsol: DMT.debug.balance()
DMT.BalanceLog = {
  KEY: 'dmt_reborn_balance_log',
  report(run) {
    const imp = DMT.Run.cardImpact(run), syn = DMT.Run.synergy(run), b = run.breakdown || DMT.Run.breakdown(run);
    return {
      at: new Date().toISOString(), hero: run.heroId, table: run.tableId, won: run.won, time: Math.round(run.time),
      kills: run.kills, collected: run.totalCollectedCoins, startCoins: run.startCoins, spent: run.spentRunCoins, left: run.currentRunCoins,
      missed: run.coinsMissed, offers: run.offers, buys: run.buys, passes: run.passes, cards: run.cardOrder.length,
      bank: b.total, coinPart: +b.coinPart.toFixed(1), tableMult: b.tableMult, skillMult: +b.skill.toFixed(2),
      dmg: Math.round(run.dmgDealt), cardDmg: imp.cardTotal, synergy: syn.top,
      cardContrib: Object.fromEntries(imp.list.map((x) => [x.id, x.dmg])),
      skills: Object.assign({}, DMT.Save.data.skills),
    };
  },
  push(r) {
    this.last = r;
    try { const arr = JSON.parse(localStorage.getItem(this.KEY) || '[]'); arr.push(r); while (arr.length > 40) arr.shift(); localStorage.setItem(this.KEY, JSON.stringify(arr)); } catch (e) { /* rapor kaydı opsiyonel */ }
  },
  all() { try { return JSON.parse(localStorage.getItem(this.KEY) || '[]'); } catch (e) { return []; } },
};

// Tek yetkili istatistik kaynağı: taban + kalıcı yetenek + kart + geçici etkiler
DMT.Stats = {
  recalc(run) {
    const h = run.hero, sk = (id) => DMT.Save.skillLevel(id), c = (id) => run.cards[id] || 0, D = DMT.Data, B = DMT.Balance;
    const v = (id) => D.cardById(id).v;
    const s = {};
    s.maxHp = h.hp + sk('hp') * 12 + c('ironSkin') * v('ironSkin').hp;
    let dmgMul = 1 + sk('dmg') * 0.08 + c('heavyHand') * v('heavyHand').dmg;
    let aspd = 1 + sk('aspd') * 0.06 + c('bloodlust') * v('bloodlust').aspd;
    s.crit = Math.min(0.75, h.crit + sk('crit') * 0.03 + c('keenEye') * v('keenEye').crit);
    s.critMult = h.critMult + c('keenEye') * v('keenEye').cm + c('executioner') * v('executioner').cm;
    // V2 geçici kart durumları
    const tmp = run.tmp || {};
    if (tmp.adr) aspd += tmp.adr * c('adrenaline') * v('adrenaline').aspd;
    if (tmp.dance > 0) aspd += v('deathDance').aspd;
    aspd += c('spiritFury') * v('spiritFury').aspd;
    s.crit = Math.min(0.75, s.crit + c('serratedEdge') * v('serratedEdge').crit + c('deathDance') * v('deathDance').crit);
    let speedMul = 1;
    for (const b of run.buffs) {
      if (b.id === 'frenzy') aspd += 1.0;
      if (b.id === 'mgBuff') { dmgMul += 0.6; aspd += 0.4; }
      if (b.id === 'curse') { speedMul *= 0.6; aspd *= 0.7; }
      // V3 geçici etkileri (eski kartlar + Faro tuzakları + arka oda)
      if (b.id === 'powerWave') dmgMul *= 2;
      if (b.id === 'swordStorm') dmgMul *= 3;
      if (b.id === 'sigHata') dmgMul *= 1.5;
      if (b.id === 'ozelFiyat') dmgMul *= 0.85;
      if (b.id === 'trapSpeed') aspd *= 2;
      if (b.id === 'trapSlow') { speedMul *= 0.6; aspd *= 0.85; }
      if (b.id === 'heavyHands') aspd *= 0.75;
      if (b.id === 'mgCurse') { speedMul *= 0.75; dmgMul *= 0.8; }
    }
    s.dmg = h.dmg * dmgMul;
    s.atkInt = h.atkInt / aspd;
    s.speed = h.speed * speedMul;
    s.range = h.range;
    // coin çarpanı: Altın Ceset + Altın Diş → yumuşak sınırlı (Balance)
    // V3 kalıcı run değiştiricileri (Kan Paktı, Sahte Cevher, işaretli kartlar…)
    const m = run.mods || {};
    s.dmg *= m.dmg || 1;
    s.atkInt /= m.aspd || 1;
    s.crit = U.clamp(s.crit + (m.crit || 0) - (run.buffs.some((b) => b.id === 'badAim') ? 0.1 : 0), 0, 0.85);
    s.maxHp = Math.max(20, Math.round(s.maxHp * (m.maxHpMul || 1)));
    s.coinMult = B.coinMult(sk('coin') * B.coinSkillPer + c('goldTooth') * v('goldTooth').coin);
    s.magnet = 11 + sk('magnet') * 4;
    s.lifesteal = c('vampire') * (v('vampire')[h.id] || 2);
    // V2 build istatistikleri
    s.blastR = 1 + c('powderKeg') * v('powderKeg').r;
    s.blastD = 1 + c('powderKeg') * v('powderKeg').d;
    s.boltMul = 1 + c('conductor') * v('conductor').bolt + c('stormCrown') * v('stormCrown').bolt;
    s.boltJumps = 3 + c('conductor');
    s.summonDmg = 1 + c('spiritFury') * v('spiritFury').dmg;
    s.summonSpd = 1 + c('spiritFury') * v('spiritFury').spd;
    return s;
  },
};

      if (this.forcedT > 0 && this.forced) return U.pick(this.forced);
      if (this.weakT > 0) return U.pick(['grunt', 'rusher', 'rusher', 'swarm']);
      for (const x of (D.EXTRA_SPAWNS[this.run.tableId] || [])) if (k >= x.from && U.chance(x.w)) return x.type;
      return this.pickBaseType(k);
    },
    pickBaseType(k) {
      const sp = this.sp;
      const wt = k >= sp.tankFrom ? 0.08 + 0.14 * k : 0, wr = sp.rusherW * (k < 0.1 ? 0.5 : 1);
      const r = Math.random();
      return r < wt ? 'tank' : r < wt + wr ? 'rusher' : 'grunt';
    },
    edgePoint() {
      const side = U.pick(['l', 'r', 'b', 'b', 't', 'l', 'r']);
      const h = this.hero;
      for (let tries = 0; tries < 6; tries++) {
        let x, y;
        if (side === 'l') { x = AR.x0 + U.rand(4, 30); y = U.rand(AR.y0 + 10, AR.y1 - 10); }
        else if (side === 'r') { x = AR.x1 - U.rand(4, 30); y = U.rand(AR.y0 + 10, AR.y1 - 10); }
        else if (side === 't') { x = U.rand(AR.x0 + 20, AR.x1 - 20); y = AR.y0 + U.rand(2, 16); }
        else { x = U.rand(AR.x0 + 20, AR.x1 - 20); y = AR.y1 - U.rand(2, 16); }
        if (U.dist(x, y, h.x, h.y) > 90) return { x, y };
      }
      return { x: h.x < 320 ? AR.x1 - 20 : AR.x0 + 20, y: U.rand(AR.y0 + 20, AR.y1 - 20) };
    },
    spawnEnemy(type, o = {}) {
      const def = D.ENEMIES[type], k = U.clamp(this.elapsed / this.tdef.dur, 0, 1), sp = this.sp;
      const pt = o.x != null ? o : this.edgePoint();
      const hp = Math.max(1, Math.round(def.hp * sp.hpMul * (1 + 0.8 * k) * (o.golden ? 1.2 : 1) * this.enemyHpMul()));
      const e = { id: ++this.uid, type, def, x: pt.x, y: pt.y, hp, maxHp: hp, dmg: def.dmg * sp.dmgMul * (1 + 0.4 * k), speed: def.speed * U.rand(0.9, 1.1), atkT: U.rand(0.2, 0.6), atk: 0, atkHit: false,
        r: def.radius, face: pt.x < this.hero.x ? 1 : -1, animT: U.rand(0, 1), flash: 0, kx: 0, ky: 0, dying: false, dieT: 0, spawnT: o.quick ? 0.12 : 0.45, bleed: null, bleedAcc: 0, bleedTick: 0, golden: !!o.golden, moving: false,
        frozenT: 0, phased: false, phaseT: U.rand(1, 2.5), tpT: def.teleport || 0, mirror: !!o.mirror, poison: null };
      this.enemies.push(e);
      this.parts.burst(e.x, e.y, 6, { c: e.mirror ? ['#9ad8ff', '#e8f8ff', '#3b5089'] : [P.purp2, P.purp3, '#1a1028'], min: 8, max: 26, life: 0.5, flat: 0.5, g: -20 });
      this.emit('onEnemySpawn', e);
      // Kırık Ayna: her doğan düşmanın karşı tarafta yansıması belirir
      if (this.special && this.special.mirror && !o.mirror && !o.noMirror && !o.golden && o.x == null) this.spawnEnemy(type, { x: U.clamp(640 - pt.x, AR.x0 + 4, AR.x1 - 4), y: pt.y, mirror: true });
      return e;
    },

    // ================== OLAYLAR (Faro müdahaleleri + masa kuralı) ==================
    updateEvents(dt) {
      const f = this.faro;
      // Masa II: Kırık Kadeh çılgınlığı
      if (this.special) {
        if (this.rageT > 0) this.rageT -= dt;
        if (this.elapsed >= this.rageNext) {
          this.rageNext += this.special.frenzyEvery; this.rageT = this.special.frenzyDur;
          DMT.Audio.play('shatter'); DMT.Audio.play('frenzy');
          this.showBanner('KIRIK KADEH!', 'Düşmanlar ' + this.special.frenzyDur + ' sn çıldırdı', '#ff5a5a', 2.2);
          f.say('frenzyT2', { priority: 1, catGap: 40 });
          for (let i = 0; i < 18; i++) this.parts.spawn({ x: U.rand(AR.x0, AR.x1), y: U.rand(AR.y0, AR.y1), vx: U.rand(-20, 20), vy: U.rand(-40, -10), g: 80, life: 0.8, c: U.pick(['#a8c8d8', '#e8f8ff', '#6a0e24']), s: 1 });
        }
      }
      // Lanetli Bölge
      if (!this.curse && !this.event && this.elapsed >= this.curseNext) this.startCurse();
      if (this.curse) this.updateCurse(dt);
      // Ölümün Eğlencesi
      if (!this.feastDone && !this.event && this.elapsed >= this.feastAt) this.startFeast();
      if (this.feast) {
        const fe = this.feast; fe.t += dt; fe.spawnT -= dt;
        if (fe.toSpawn > 0 && fe.spawnT <= 0) { fe.spawnT = 0.32; fe.toSpawn--; this.spawnEnemy(U.chance(0.6) ? 'grunt' : 'rusher', { golden: true }); }
        if (fe.t >= fe.dur) { this.feast = null; this.event = null; }
      }
    },
    startCurse() {
      const h = this.hero;
      const x = U.clamp(h.x + U.rand(-24, 24), AR.x0 + 40, AR.x1 - 40), y = U.clamp(h.y + U.rand(-16, 16), AR.y0 + 30, AR.y1 - 30);
      this.curse = { x, y, r: 32, state: 'warn', t: 0, warn: 1.9 };
      this.event = 'curse';
      this.faro.act('point', 2.0); this.faro.say('curse', { priority: 2 });
      DMT.Audio.play('curseWarn');
      this.showBanner("FARO'NUN LANETİ", 'Mor halka patlamak üzere', '#c08aff', 1.8);
    },
    updateCurse(dt) {
      const c = this.curse, h = this.hero; c.t += dt;
      if (c.state === 'warn' && c.t >= c.warn) {
        c.state = 'burst'; c.t = 0;
        DMT.Audio.play('curse'); this.shake = Math.max(this.shake, 2.5);
        for (let i = 0; i < 40; i++) { const a = Math.random() * Math.PI * 2, r = Math.random() * c.r; this.parts.spawn({ x: c.x + Math.cos(a) * r, y: c.y + Math.sin(a) * r * 0.6, vx: 0, vy: U.rand(-60, -20), life: U.rand(0.4, 0.9), c: U.pick([P.magic, P.purp3, '#e0b0ff']), s: U.pick([1, 2]) }); }
        const inside = U.dist(h.x, (h.y - c.y) / 0.6 + c.y, c.x, c.y) <= c.r + 2;
        if (inside && !h.dead) {
          this.heroHurt(10, true);
          this.addBuff('curse', 5);
          this.floatText(h.x, h.y - 26, 'LANETLENDİN', P.magic, 8);
          this.faro.say('curseHit', { priority: 2 }); this.faro.act('laugh', 1.2);
        } else { this.faro.say('curseDodge', { priority: 1 }); this.faro.act('annoyed', 1.2); this.floatText(h.x, h.y - 26, 'KAÇTI!', P.toxic, 7); }
      }
      if (c.state === 'burst' && c.t > 0.6) { this.curse = null; this.event = null; this.curseNext = this.elapsed + U.rand(22, 28); }
    },
    startFeast() {
      this.feastDone = true; this.event = 'feast';
      this.feast = { t: 0, dur: 9, toSpawn: 7, spawnT: 0.4 };
      this.faro.act('laugh', 1.6); this.faro.say('feast', { priority: 2 });
      DMT.Audio.play('feast');
      this.showBanner('ÖLÜMÜN EĞLENCESİ', 'Altın misafirler 3 kat coin düşürür', P.gold3, 2.4);
    },
    showBanner(title, sub, color, dur = 2) { this.banner = { title, sub, color, t: 0, dur }; },

    // ================== KART DAVRANIŞLARI ==================
    updateCardBehaviors(dt) {
      const run = this.run, h = this.hero, s = this.stats;
      if (h.dead) return;
      const nT = st(run, 'thunderCloud');
      if (nT) { this.thunderT -= dt; if (this.thunderT <= 0) { this.thunderT = Math.max(1.2, 3 - 0.4 * (nT - 1)); const e = this.randomEnemy(); if (e) this.lightningStrike(e, 'thunderCloud'); } }
      const nR = st(run, 'hauntRing');
      if (nR) { this.ringT -= dt; if (this.ringT <= 0) { this.ringT = Math.max(2, 4 - 0.5 * (nR - 1)); this.hauntRing(46 + 6 * (nR - 1)); } }
      const nF = st(run, 'frenzy');
      if (nF) { this.frenzyT -= dt; if (this.frenzyT <= 0) { this.frenzyT = 12; this.addBuff('frenzy', 4 + (nF - 1)); this.floatText(h.x, h.y - 28, 'KUDURMA!', '#ff6a2a', 8); DMT.Audio.play('frenzy'); } }
      // hayalet yoldaşlar
      const nG = st(run, 'ghost');
      while (this.ghosts.length < nG) this.ghosts.push({ ang: this.ghosts.length * Math.PI, cd: 0.6 + this.ghosts.length * 0.3, x: h.x, y: h.y });
      for (const gh of this.ghosts) {
        gh.ang += dt * 2.2;
        gh.x = h.x + Math.cos(gh.ang) * 20; gh.y = h.y - 12 + Math.sin(gh.ang) * 9;
        gh.cd -= dt;
        if (gh.cd <= 0) {
          const e = this.nearestEnemy(gh.x, gh.y, 170);
          if (e) { gh.cd = 1.1 / s.summonSpd; const a = Math.atan2(e.y - 8 - gh.y, e.x - gh.x); this.proj.push({ kind: 'wisp', x: gh.x, y: gh.y, vx: Math.cos(a) * 170, vy: Math.sin(a) * 170, dmg: s.dmg * 0.6 * s.summonDmg, life: 1.4, depth: 1, target: e, src: 'ghost' }); DMT.Audio.play('ghost'); }
          else gh.cd = 0.3;
        }
      }
      // V2: olay tabanlı kart etkileri (onInterval), yardımcılar ve zemin alanları
      this.emit('onInterval', dt);
      this.updateSummons(dt);
      this.updateZones(dt);
      this.updateV3(dt);
    },
    addBuff(id, dur) {
      const b = this.run.buffs.find((x) => x.id === id);
      if (b) b.t = Math.max(b.t, dur); else this.run.buffs.push({ id, t: dur, max: dur });
      this.recalc();
    },
    updateBuffs(dt) {
      let changed = false;
      for (const b of this.run.buffs) b.t -= dt;
      const before = this.run.buffs.length;
      this.run.buffs = this.run.buffs.filter((b) => b.t > 0);
      if (this.run.buffs.length !== before) changed = true;
      if (changed) this.recalc();
    },
    recalc() {
      const old = this.stats.maxHp;
      this.stats = DMT.Stats.recalc(this.run);
      if (this.stats.maxHp > old) this.hero.hp += this.stats.maxHp - old;
      this.hero.hp = Math.min(this.hero.hp, this.stats.maxHp);
    },

    // ================== KAHRAMAN ==================
    nearestEnemy(x, y, maxD = 1e9) {
      let best = null, bd = maxD * maxD;
      for (const e of this.enemies) { if (e.dying || e.spawnT > 0 || e.phased) continue; const d = U.dist2(x, y, e.x, e.y); if (d < bd) { bd = d; best = e; } }
      return best;
    },
    randomEnemy() { const L = this.enemies.filter((e) => !e.dying && e.spawnT <= 0 && !e.phased); return L.length ? U.pick(L) : null; },
    updateHero(dt) {
      const h = this.hero, s = this.stats, melee = this.run.hero.melee;
      if (h.dead) { h.deathT += dt; return; }
      if (this.heroFrozenT > 0) { h.anim = 'idle'; h.moving = false; h.atk = 0; h.animT += dt; return; } // Faro herkesi durdurdu
      h.inv = Math.max(0, h.inv - dt); h.flash = Math.max(0, h.flash - dt * 6); h.atkT -= dt; h.animT += dt;
      const tgt = this.nearestEnemy(h.x, h.y);
      h.target = tgt;
      let mx = 0, my = 0;
      if (tgt) {
        const dx = tgt.x - h.x, dy = tgt.y - h.y, d = Math.hypot(dx, dy) || 1;
        if (melee) {
          const reach = s.range + tgt.r;
          if (d > reach - 3) { mx += dx / d; my += dy / d; }
        } else {
          // kaçarak savaş: yakın düşmanlardan uzaklaş
          let fx = 0, fy = 0, close = 0;
          for (const e of this.enemies) { if (e.dying || e.spawnT > 0) continue; const ex = h.x - e.x, ey = h.y - e.y, ed = Math.hypot(ex, ey) || 1; if (ed < 64) { const w = (64 - ed) / 64; fx += (ex / ed) * w; fy += (ey / ed) * w; close++; } }
          if (close) { mx += fx * 1.6; my += fy * 1.6; const cx = 320 - h.x, cy = 242 - h.y, cd = Math.hypot(cx, cy) || 1; mx += (cx / cd) * 0.45; my += (cy / cd) * 0.45; }
          else if (d > s.range * 0.85) { mx += dx / d; my += dy / d; }
          else { mx += (-dy / d) * 0.25 * Math.sin(this.elapsed * 0.7); my += (dx / d) * 0.25 * Math.sin(this.elapsed * 0.7); }
        }
        if (Math.abs(dx) > 2) h.face = dx > 0 ? 1 : -1;
      } else {
        const cx = 320 - h.x, cy = 245 - h.y, cd = Math.hypot(cx, cy);
        if (cd > 10) { mx = cx / cd * 0.5; my = cy / cd * 0.5; }
      }
      // lanet bölgesinden kaçınma
      const c = this.curse;
      if (c && c.state === 'warn') { const ex = h.x - c.x, ey = (h.y - c.y) / 0.6, ed = Math.hypot(ex, ey) || 1; if (ed < c.r + 12) { mx += (ex / ed) * 2.2; my += (ey / ed) * 1.4; } }
      const ml = Math.hypot(mx, my);
      h.moving = ml > 0.15;
      if (h.moving) {
        const sp = s.speed * Math.min(1, ml) * this.heroSpeedMul();
        h.x += (mx / ml) * sp * dt; h.y += (my / ml) * sp * dt;
        if (Math.abs(mx) > 0.2 && !tgt) h.face = mx > 0 ? 1 : -1;
        h.stepT += dt; if (h.stepT > 0.3) { h.stepT = 0; this.parts.spawn({ x: h.x + U.rand(-2, 2), y: h.y, vx: U.rand(-6, 6), vy: -4, life: 0.35, c: 'rgba(120,90,60,0.6)', s: 1 }); }
      }
      h.x = U.clamp(h.x, AR.x0 + 6, AR.x1 - 6); h.y = U.clamp(h.y, AR.y0 + 6, AR.y1 - 2);
      // saldırı
      const atkDur = melee ? Math.min(0.3, s.atkInt * 0.85) : Math.min(0.22, s.atkInt * 0.8);
      if (h.atk > 0) {
        h.atk += dt;
        if (!h.atkHit && h.atk >= atkDur * (melee ? 0.4 : 0.5)) { h.atkHit = true; this.heroAttackHit(); }
        if (h.atk >= atkDur) h.atk = 0;
      } else if (tgt && h.atkT <= 0) {
        const d = U.dist(h.x, h.y, tgt.x, tgt.y);
        if (d <= (melee ? s.range + tgt.r + 4 : s.range)) { h.atk = 0.0001; h.atkHit = false; h.atkT = s.atkInt; h.atkTarget = tgt; DMT.Audio.play(melee ? 'swing' : 'bow'); }
      }
      h.anim = h.atk > 0 ? 'atk' : h.moving ? 'walk' : 'idle';
      h.atkDur = atkDur;
    },
    // twin: İkiz Darbe'nin ek saldırısı (sayaçları ilerletmez, kendini tekrar tetiklemez)
    heroAttackHit(twin = false) {
      const h = this.hero, s = this.stats, run = this.run, melee = run.hero.melee;
      const tgt = h.atkTarget && !h.atkTarget.dying ? h.atkTarget : this.nearestEnemy(h.x, h.y);
      if (!twin) h.attacks++;
      const nSeal = st(run, 'seventhSeal'), sealEvery = nSeal > 1 ? 6 : 7, sealMult = nSeal > 1 ? 4 : 3;
      const seal = !twin && nSeal > 0 && h.attacks % sealEvery === 0;
      let mult = twin ? this.cv('twinStrike').mult : 1;
      if (!twin) {
        if (this.critLock > 0) this.critLock--;
        // Büyük Vuruş (Kael): her N. savuruş katlı hasar
        if (st(run, 'buyukVurus') && h.attacks % this.cv('buyukVurus').n === 0) { mult *= this.cv('buyukVurus').mult; this.floatText(h.x, h.y - 34, 'BÜYÜK VURUŞ', '#ffcf6e', 6.5); }
        // Kızıl Kasırga (Kael): her 4. savuruşta kasırga
        if (st(run, 'kizilKasirga') && h.attacks % this.cv('kizilKasirga').every === 0) this.later(0.05, () => this.whirlwind());
        // Keskin Göz kademesi (ÇİFT NAM): %30 ihtimalle çift saldırı
        if (st(run, 'keenEye') >= D.cardById('keenEye').max && U.chance(0.3)) this.later(0.12, () => { if (!this.hero.dead && this.phase === 'fight') this.heroAttackHit(true); });
      }
      if (melee) {
        const ang = tgt ? Math.atan2(tgt.y - h.y, tgt.x - h.x) : (h.face > 0 ? 0 : Math.PI);
        const reach = s.range + 10;
        this.fx.push({ kind: 'slash', x: h.x, y: h.y - 8, ang, t: 0, life: 0.18, r: reach, seal });
        let hits = 0;
        for (const e of this.enemies) {
          if (e.dying || e.spawnT > 0) continue;
          const dx = e.x - h.x, dy = e.y - h.y, d = Math.hypot(dx, dy);
          if (d > reach + e.r) continue;
          let da = Math.abs(Math.atan2(dy, dx) - ang); if (da > Math.PI) da = Math.PI * 2 - da;
          if (da > 1.25 && e !== tgt) continue;
          this.heroHit(e, { seal, sealMult, kb: 70, mult, twin });
          hits++;
        }
        if (hits >= 3) this.shake = Math.max(this.shake, 1.2);
      } else if (tgt) {
        const tt = U.dist(h.x, h.y, tgt.x, tgt.y) / this.run.hero.projSpeed;
        const px = tgt.x + (tgt.moving ? Math.sign(h.x - tgt.x) * -1 * 0 : 0), py = tgt.y - 8;
        const a = Math.atan2(py - (h.y - 10), px - h.x + 0 * tt);
        this.proj.push({ kind: 'arrow', x: h.x + h.face * 6, y: h.y - 10, vx: Math.cos(a) * run.hero.projSpeed, vy: Math.sin(a) * run.hero.projSpeed, life: 0.9, depth: 0, seal, sealMult, magic: seal, mult, twin, pierce: st(run, 'delinme') ? this.cv('delinme').n - 1 : 0 });
      }
      // İkiz Darbe: her (5-n). saldırı ikinci kez vurur
      const nTw = st(run, 'twinStrike');
      if (!twin && nTw && h.attacks % (4 - nTw) === 0) this.later(0.1, () => { if (!this.hero.dead && this.phase === 'fight') { DMT.Audio.play(melee ? 'swing' : 'bow'); this.heroAttackHit(true); } });
      this.emit('onAttack', { twin, tgt });
      if (twin) return;
      // Hayalet Hançer: her 3. saldırı
      const nX = st(run, 'extraShot');
      if (nX && h.attacks % 3 === 0) {
        const others = this.enemies.filter((e) => !e.dying && e.spawnT <= 0 && e !== tgt);
        for (let i = 0; i < nX; i++) {
          const e = others.length ? others.splice(Math.floor(Math.random() * others.length), 1)[0] : tgt;
          if (!e) break;
          const a = Math.atan2(e.y - 8 - (h.y - 10), e.x - h.x);
          this.proj.push({ kind: 'dagger', x: h.x, y: h.y - 10, vx: Math.cos(a) * 240, vy: Math.sin(a) * 240, dmg: s.dmg * 0.6 * s.summonDmg, life: 1, depth: 1, target: e, src: 'extraShot' });
        }
      }
    },
    // kahramanın birincil vuruşu: kritik + kart tetikleyicileri burada (Kael savuruşu ve Lyra okları ortak)
    heroHit(e, o = {}) {
      const s = this.stats, run = this.run;
      if (!e || e.dying) return;
      let dmg = s.dmg * (o.mult || 1) * U.rand(0.9, 1.1);
      // V3: Lyra ODAK — aynı hedefe art arda vuruşlar güçlenir
      if (!o.twin && run.heroId === 'lyra') { if (this.focus.e === e) this.focus.n = Math.min(6, this.focus.n + 1); else this.focus = { e, n: 1 }; }
      dmg *= this.v3DmgMul(e); // seri (Momentum), odak, öldürme birikimleri, Öfke Kalbi, Celladın Mührü, Son Kum
      const bonus = [];
      // Cellat: düşük canlı düşmana ek kritik şansı
      let critCh = s.crit;
      const nEx = st(run, 'executioner'); if (nEx && e.hp / e.maxHp < 0.35) critCh += nEx * this.cv('executioner').low;
      const crit = this.critLock <= 0 && (run.tmp.dance > 0 || U.chance(critCh));
      if (crit) dmg *= s.critMult * (this.em.thickT > 0 ? 0.6 : 1);
      if (crit) { this.critRun++; if (this.critRun >= 3 && U.chance(0.25)) this.intervene('critLock', 'ivCritLock', () => { this.critLock = 3; this.floatText(this.hero.x, this.hero.y - 36, 'ŞANS KİLİTLİ', '#ffcc66', 7); }); } else this.critRun = 0;
      if (o.seal) dmg *= o.sealMult || 3;
      // Tırtıklı Bıçak: kanayan düşmana ek hasar
      const nSe = st(run, 'serratedEdge');
      if (nSe && e.bleed) { const ex = dmg * nSe * this.cv('serratedEdge').dmg; dmg += ex; bonus.push(['serratedEdge', ex]); }
      // Hileli Zar: risk/ödül
      const nLd = st(run, 'luckyDice');
      if (nLd) {
        const r = Math.random(), lv = this.cv('luckyDice');
        if (r < lv.hi * nLd) { bonus.push(['luckyDice', dmg * 2]); dmg *= 3; this.luckFx(e, true); }
        else if (r < lv.hi * nLd + lv.lo) { dmg *= 0.5; this.luckFx(e, false); }
      }
      if (o.twin && st(run, 'twinStrike')) bonus.push(['twinStrike', dmg]); // İkiz Darbe ek vuruşu tamamen karta yazılır
      this.damage(e, dmg, { crit, depth: 0, kb: o.kb || 30, fromX: this.hero.x, fromY: this.hero.y, bonus });
      this.cleave(e, dmg); // Geniş Kesim / Kanlı Yörünge / Güç Taşı kademesi

    // ================== DÜŞMANLAR ==================
    updateEnemies(dt) {

    updateCoins(dt) {
