<title>Kepçe Ustası</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" />
<style>
  /* Single dark look on purpose: a pixel-art game screen. Layout: one fixed portrait game frame. */
  :root { --bg: #1e1a26; --fg: #ffe9b8; --font: 'Pixelify Sans', ui-monospace, monospace; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #frame { position: fixed; inset: 0; box-sizing: border-box; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); display: flex; align-items: center; justify-content: center; }
  #game { width: 100%; height: 100%; }
  #game canvas { image-rendering: pixelated; display: block; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 18px var(--font); pointer-events: none; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: var(--bg); font: 20px var(--font); align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  @media (orientation: landscape) and (pointer: coarse) and (max-height: 600px) { #rotate { display: flex; } }
</style>
<div id="frame"><div id="game"></div></div>
<div id="boot">Kepçe Ustası yükleniyor…</div>
<div id="rotate"><div>Lütfen telefonu <b>dikey</b> tutun.<br />Oyun dikey ekran için tasarlandı.</div></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<script src="game.js"></script>
