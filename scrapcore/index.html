<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#15110e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SCRAPCORE: Mechanical Mayhem</title>
<style>
:root{--bg:#15110e;--panel:#221b16f2;--panel2:#2c231cf2;--line:#6b5340;--acc:#ff9a3c;--acc2:#3cd6ff;--acc3:#86e35a;--txt:#f5ecdf;--dim:#b3a291;--bad:#ff5a4e;--good:#7be35a;--rare:#4aa8ff;--epic:#c96bff;
--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);
--fs:clamp(11px,1.15vw + 0.9vh,17px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;color:var(--txt);font-size:var(--fs)}
#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#safe{position:fixed;left:0;top:0;width:0;height:0;padding:var(--sat) var(--sar) var(--sab) var(--sal);pointer-events:none;visibility:hidden}
#hudBtns{position:fixed;top:calc(var(--sat) + 8px);display:none;gap:6px;z-index:5}
#hudBtns button{width:clamp(34px,4.4vh + 1.6vw,52px);height:clamp(34px,4.4vh + 1.6vw,52px);border-radius:10px;border:2px solid #6b5340;background:#221b16d0;color:var(--txt);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;touch-action:manipulation}
#hudBtns button:active{background:#3a2d22}
#hudBtns svg{width:60%;height:60%;fill:none;stroke:#f5ecdf;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#ov{position:fixed;inset:0;display:none;z-index:10;align-items:center;justify-content:center;padding:calc(var(--sat) + 6px) calc(var(--sar) + 10px) calc(var(--sab) + 6px) calc(var(--sal) + 10px);background:radial-gradient(ellipse at center,#0b0806a0,#0b0806e0);touch-action:manipulation}
#ov.clear{background:transparent;pointer-events:none}
#ov.clear .panel{pointer-events:auto}
#ov.menuBg{background:linear-gradient(90deg,#0d0a08e8 0%,#0d0a08a0 45%,#0d0a0820 100%)}
#toastBox{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 13vh);z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(90vw,640px)}
.toast{background:#221b16ee;border:2px solid var(--line);border-radius:10px;padding:.45em 1em;font-weight:700;text-align:center;animation:tin .25s ease-out;box-shadow:0 4px 18px #0008}
.toast.good{border-color:var(--good)}.toast.bad{border-color:var(--bad)}.toast.epic{border-color:var(--epic);color:#f0d8ff}.toast.info{border-color:var(--acc2)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
#rotate{position:fixed;inset:0;z-index:50;background:#15110e;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px}
#rotate .ph{width:70px;height:120px;border:5px solid var(--acc);border-radius:14px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;box-shadow:0 10px 40px #000a;padding:clamp(10px,2vh,22px) clamp(12px,2vw,26px);max-width:100%;max-height:100%;display:flex;flex-direction:column;gap:clamp(6px,1.2vh,12px);position:relative}
.panel h2{margin:0;font-size:1.45em;letter-spacing:.06em;color:var(--acc);text-align:center}
.panel h3{margin:0;font-size:1.1em;color:var(--acc)}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.btn{font:inherit;font-weight:800;letter-spacing:.05em;color:var(--txt);background:linear-gradient(#4a3828,#33271d);border:2px solid #8a6a4c;border-radius:10px;padding:.62em 1.3em;cursor:pointer;touch-action:manipulation;min-height:2.6em;text-align:center}
.btn:hover{border-color:var(--acc)}
.btn:active{transform:translateY(1px);background:#2a2018}
.btn.pri{background:linear-gradient(#ff9e44,#d8661e);border-color:#ffc480;color:#1d120a}
.btn.blu{background:linear-gradient(#3cc4ee,#1a7fb0);border-color:#9ae6ff;color:#06141c}
.btn.red{background:linear-gradient(#d9483e,#9a2620);border-color:#ff9a90}
.btn.sm{padding:.35em .8em;min-height:2.1em;font-size:.9em}
.btn[disabled]{opacity:.42;cursor:not-allowed;filter:grayscale(.6)}
.row{display:flex;gap:clamp(6px,1vw,12px);align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:clamp(5px,1vh,10px)}
.dim{color:var(--dim)}.good{color:var(--good)}.bad{color:var(--bad)}.acc{color:var(--acc)}.blue{color:var(--acc2)}
.small{font-size:.85em}
.tag{display:inline-block;padding:.08em .5em;border-radius:6px;font-size:.78em;font-weight:800;letter-spacing:.04em;background:#3a2d22;border:1px solid #6b5340}
/* main menu */
.mm{position:absolute;left:calc(var(--sal) + 4vw);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:clamp(6px,1.3vh,12px);width:min(44vw,440px)}
.logo{font-weight:900;line-height:.95;letter-spacing:.02em}
.logo{white-space:nowrap}.logo .a{font-size:clamp(28px,3.4vw + 1.8vh,66px);background:linear-gradient(#ffd08a,#ff8a2a 55%,#a0441a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #2a1408) drop-shadow(0 0 14px #ff8a2a55)}
.logo .b{font-size:clamp(13px,1.5vw + .8vh,24px);color:var(--acc2);letter-spacing:.32em;margin-top:.2em}
.mm .btn{text-align:left;font-size:1.05em}
.alloy{display:inline-flex;align-items:center;gap:.35em;font-weight:800;color:#ffe08a}
.alloy i{width:.95em;height:.95em;display:inline-block;background:linear-gradient(135deg,#fff2b0,#d9a43a);transform:rotate(45deg);border:2px solid #7a5a1a}
/* character select */
.chars{display:flex;gap:clamp(6px,1.2vw,14px);align-items:stretch}
.char{flex:1;min-width:0;background:var(--panel2);border:2px solid #4b3a2c;border-radius:12px;padding:clamp(6px,1vh,12px);display:flex;flex-direction:column;gap:4px;cursor:pointer}
.char.sel{border-color:var(--acc);box-shadow:0 0 0 2px #ff9a3c55,0 0 22px #ff9a3c44}
.char canvas{width:100%;height:clamp(70px,21vh,170px);display:block;background:radial-gradient(circle,#3a2e24,#1a1410);border-radius:8px}
.char .nm{font-weight:900;font-size:1.2em}
.stat{display:flex;justify-content:space-between;font-size:.85em}
.cos{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.cos button{font:inherit;font-size:.75em;padding:.2em .5em;border-radius:6px;border:1px solid #6b5340;background:#2a2018;color:var(--txt);cursor:pointer}
.cos button.on{border-color:var(--acc);background:#4a3220}
.cos button[disabled]{opacity:.35}
/* cards */
.cards{display:flex;gap:clamp(6px,1.3vw,16px);justify-content:center;align-items:stretch}
.card{width:clamp(150px,25vw,290px);background:linear-gradient(#2e251d,#1d1712);border:3px solid #7a6048;border-radius:14px;padding:clamp(7px,1.4vh,14px);display:flex;flex-direction:column;gap:clamp(3px,.8vh,8px);cursor:pointer;position:relative;text-align:left;font:inherit;color:inherit}
.card:hover{transform:translateY(-3px)}
.card.rare{border-color:var(--rare);box-shadow:0 0 18px #4aa8ff55}
.card.epic{border-color:var(--epic);box-shadow:0 0 26px #c96bff77;background:linear-gradient(#33223f,#1d1520)}
.card .q{position:absolute;top:-.8em;right:.7em;font-size:.72em;font-weight:900;padding:.15em .6em;border-radius:6px;background:#5a4636;letter-spacing:.06em}
.card.rare .q{background:var(--rare);color:#06121e}.card.epic .q{background:var(--epic);color:#1c0628}
.card .top{display:flex;gap:.6em;align-items:center}
.card img{width:clamp(34px,6vh,58px);height:clamp(34px,6vh,58px);image-rendering:auto;flex:none}
.card .t{font-weight:900;font-size:1.05em;line-height:1.1}
.card .lv{font-size:.8em;color:var(--acc)}
.card .d{font-size:.86em;line-height:1.25;color:#e8dccd}
.card .k{font-size:.72em;color:var(--dim);letter-spacing:.05em;font-weight:800}
.card .nb{color:#ffe08a;font-size:.82em;font-weight:700}
.pips{display:flex;gap:3px}.pips b{width:.8em;height:.42em;border-radius:2px;background:#4a3a2c}.pips b.on{background:var(--acc)}.pips b.nx{background:#fff;animation:blink .7s infinite alternate}
@keyframes blink{to{opacity:.3}}
/* workshop */
.branches{display:flex;gap:clamp(6px,1.2vw,16px)}
.branch{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.chip{display:flex;align-items:center;gap:8px;padding:.35em .55em;border-radius:9px;border:2px solid #4b3a2c;background:#241c16;position:relative}
.chip.own{border-color:#5a8a3a;background:#1f2a18}
.chip.next{border-color:var(--acc)}
.chip .ic{width:1.9em;height:1.9em;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.8em;background:#3a2d22;border:1px solid #6b5340;clip-path:polygon(15% 0,85% 0,100% 15%,100% 85%,85% 100%,15% 100%,0 85%,0 15%)}
.chip.own .ic{background:#4f7a30;color:#e8ffd8}
.chip .tx{flex:1;font-size:.82em;line-height:1.2}
.chip:not(:last-child)::after{content:'';position:absolute;left:1.35em;bottom:-7px;width:3px;height:7px;background:#4b3a2c}
.chip.own:not(:last-child)::after{background:#7be35a}
/* collection */
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:800;font-size:.85em;padding:.35em .8em;border-radius:8px;border:2px solid #4b3a2c;background:#241c16;color:var(--txt);cursor:pointer}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(180px,26vw,280px),1fr));gap:8px}
.ent{display:flex;gap:8px;background:#241c16;border:1px solid #4b3a2c;border-radius:9px;padding:.45em;align-items:flex-start}
.ent img,.ent canvas{width:clamp(38px,6.5vh,56px);height:clamp(38px,6.5vh,56px);flex:none}
.ent.lock img{filter:grayscale(1) brightness(.45)}
.ent .t{font-weight:800}
.ent .d{font-size:.8em;line-height:1.25;color:#d8ccbd}
.bar{height:.5em;background:#3a2d22;border-radius:3px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--acc)}
/* settings */
.set{display:grid;grid-template-columns:auto 1fr;gap:clamp(5px,1.1vh,10px) 14px;align-items:center}
.set input[type=range]{width:100%;accent-color:#ff9a3c;height:1.6em}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{font:inherit;font-size:.85em;font-weight:700;padding:.3em .7em;border-radius:7px;border:2px solid #4b3a2c;background:#241c16;color:var(--txt);cursor:pointer}
.seg button.on{border-color:var(--acc);background:#4a3220}
table.res{border-collapse:collapse;width:100%;font-size:.85em}
table.res td,table.res th{padding:.22em .45em;border-bottom:1px solid #3a2d22;text-align:left}
table.res th{color:var(--dim);font-weight:700}
table.res td.n{text-align:right;font-variant-numeric:tabular-nums}
.resgrid{display:grid;grid-template-columns:1fr 1.25fr .95fr;gap:clamp(8px,1.4vw,18px);min-height:0;flex:1}.resgrid table.res{font-size:.8em}@media (max-width:700px){.resgrid{grid-template-columns:1fr}}
.formula div{display:flex;justify-content:space-between;gap:12px;font-size:.88em}
.formula .tot{border-top:2px solid var(--line);margin-top:3px;padding-top:3px;font-weight:900;color:#ffe08a}
#dbg{position:fixed;left:calc(var(--sal) + 4px);top:42%;z-index:30;display:none;flex-direction:column;gap:3px;background:#000b;padding:5px;border-radius:8px;font-size:11px;max-height:56vh;overflow:auto}
#dbg button,#dbg select{font:inherit;font-size:11px;padding:2px 5px}
#testRep{position:fixed;inset:5%;z-index:60;background:#0d0a08f4;border:2px solid #6b5340;border-radius:12px;padding:14px;overflow:auto;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;display:none;touch-action:pan-y}
#testRep .p{color:#7be35a}#testRep .f{color:#ff5a4e}
.kbd{display:inline-block;border:1px solid #8a6a4c;border-bottom-width:3px;border-radius:5px;padding:0 .35em;font-size:.85em;font-weight:800;background:#2a2018}
.tut{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tut div{background:#241c16;border:1px solid #4b3a2c;border-radius:9px;padding:.5em;font-size:.84em;line-height:1.3}
.tut b{color:var(--acc);display:block;margin-bottom:2px}
@media (max-height:430px){.panel{padding:8px 12px;gap:5px}.card .d{font-size:.8em}}
</style>
</head>

<canvas id="game" tabindex="0"></canvas>
<div id="safe"></div>
<div id="hudBtns">
 <button id="bSound" aria-label="Ses"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="sndWave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg></button>

</div>
<div id="ov"></div>

<div id="rotate"><div class="ph"></div><div style="font-size:20px;font-weight:900;color:#ff9a3c">CİHAZINI YATAY ÇEVİR</div><div class="dim">SCRAPCORE yatay ekranda oynanır. Koşu otomatik duraklatıldı.</div></div>
<div id="dbg"></div>
<div id="testRep"></div>
<script>
'use strict';
/* ============================== CONSTANTS ============================== */
const SAVE_VERSION = 2;
const SAVE_KEY = 'scrapcore_mm_save';
const OLD_SAVE_KEYS = ['scrapcore_save_v1'];
const REF_W = 1280, REF_H = 720;
const WORLD_W = 3840, WORLD_H = 2560;
const STEP = 1 / 60, MAX_STEPS = 5, MAX_FRAME_DT = 0.1;
const RUN_LEN = 720, ELITE1_T = 240, ELITE2_T = 480, ELITE_LIFE = 90;
const CHECKPOINT_EVERY = 25;
const MAX_WEAPONS = 4, MAX_MODULES = 4, W_MAX_LV = 5, M_MAX_LV = 3;
const BASE_CRIT = 0.05, CRIT_MUL = 1.5, CRIT_CAP = 0.60, CDR_CAP = 0.45, DR_CAP = 0.65, MOVE_CAP = 1.6, MIN_CD = 0.08;
const DASH_CD = 5, DASH_INV = 0.18, DASH_TIME = 0.2, DASH_SPEED = 640, HURT_INV = 0.6;
const BASE_PICKUP = 85;
const OC_MAX = 100, OC_TIME = 6, OC_ATK = 0.25;
const BENCH_CD = 45, MOUNT_TIME = 1.5, REPAIR_COST = 25, REPAIR_CD = 70, SUPPLY_COST = 35, SUPPLY_CD = 60, SUPPLY_TIME = 30, VAULT_COST = 50;
const INTERACT_R = 74;
const SPAWN_RATES = [45, 75, 115, 160, 210, 260]; // per minute, 2-minute brackets
const ENEMY_BUDGET = 120;
const RARITY = [{ id: 'normal', name: 'NORMAL', p: 0.78, b: 0 }, { id: 'rare', name: 'NADİR', p: 0.18, b: 0.03 }, { id: 'epic', name: 'DESTANSI', p: 0.04, b: 0.06 }];
const ALLOY_PER_MIN = 4, ALLOY_ELITE = 8, ALLOY_BOSS = 24;
const MASTERY_MIN = [0, 15, 35, 70, 130];
const URLP = new URLSearchParams(location.search);
const DEBUG = URLP.get('debug') === '1';
const TESTMODE = URLP.get('test') === '1';

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const d2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const fmtTime = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const pc = v => '%' + Math.round(v * 100);
const trNum = v => String(Math.round(v * 100) / 100).replace('.', ',');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ============================== PRNG ============================== */
class RNG {
  constructor(s) { this.s = (s >>> 0) || 0x9e3779b9; }
  next() { let t = this.s = (this.s + 0x6D2B79F5) >>> 0; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  range(a, b) { return a + (b - a) * this.next(); }
  int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
  pick(a) { return a[Math.floor(this.next() * a.length)]; }
  chance(p) { return this.next() < p; }
}
let rng = new RNG(1); // gameplay rng (per run, saved)
const R = () => rng.next();
const hash2 = (x, y, s) => { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 2246822519)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

/* ============================== DATA TABLES ============================== */
const CHARS = {
  rivet: { id: 'rivet', name: 'RIVET', title: 'Paletli Testere Savaşçısı', hp: 150, speed: 160, start: 'saw',
    passive: 'Yakın dövüş silahlarına +%15 hasar ve gelen hasara %8 azaltma.', dash: 'Koçbaşı', dashDesc: 'Kısa hamle; yoldaki normal düşmanlara 16 fiziksel hasar ve geri savurma.',
    colors: [['#ff8a2a', '#7a4524', '#ffd08a'], ['#e7c23c', '#6a5226', '#fff0a0'], ['#d8453a', '#5a2620', '#ffb0a0']] },
  volt: { id: 'volt', name: 'VOLT', title: 'Çevik Enerji Bobini', hp: 95, speed: 190, start: 'tesla',
    passive: 'Elektrik zincirine +1 hedef; şok ve yavaşlatma süresine +0,3 sn.', dash: 'EMP Sıçraması', dashDesc: 'Kısa hamle; bitişte 1 saniyelik küçük yavaşlatma alanı.',
    colors: [['#3cc8ff', '#1d4a78', '#c8f6ff'], ['#9a7bff', '#33266e', '#e2d6ff'], ['#e8f0ff', '#4a5a78', '#ffffff']] },
  gear: { id: 'gear', name: 'GEAR', title: 'Drone Mühendisi', hp: 110, speed: 175, start: 'drone',
    passive: 'Drone ve taret saldırı hızına +%20.', dash: 'İtici Motor', dashDesc: 'Kısa hamle; sonunda dronlar en yakın düşmana yönelir, 1 sn +%15 hız.',
    colors: [['#7fdc4a', '#2f5a24', '#e2ffc8'], ['#3ad6b0', '#1f5248', '#c8fff0'], ['#c8d84a', '#4f5a24', '#f6ffc0']] },
};
const CHAR_ORDER = ['rivet', 'volt', 'gear'];

const WEAPONS = {
  saw: { name: 'Döner Testere', cat: 'Yakın dövüş', desc: 'Robotun koluna takılı, en yakın düşmana savrulan dönen testere.', lv: ['12 hasar, 0,55 sn tarama, 85 px erişim', 'Hasar +%20', 'Erişim +%25', 'Vuruş aralığı -%20', 'İkinci yan testere'], melee: true, evo: 'titan', col: '#ff9a3c' },

/* ============================== PASSIVE STAT CALCULATION ============================== */
function modVal(id, lvl) { return MODULES[id].vals[clamp(lvl, 1, 3) - 1]; }
function applyModule(S, id, lvl, b) {
  const v = modVal(id, lvl);
  switch (id) {
    case 'power': S.dmg += v + b; break;
    case 'servo': S.move += v + b; break;
    case 'trigger': S.cdr += v + b; break;
    case 'piston': S.knock += v + b; break;
    case 'magnet': S.pickupMul += v + b; break;
    case 'titanium': S.hpMul += v + b; break;
    case 'conduct': S.shock += v + b; break;
    case 'multi': S.phys += v + b; if (lvl >= 2) S.extraProj = 1; break;
    case 'cooling': S.droneSpd += v + b; S.shieldRegen += v + b; break;
    case 'signal': S.droneDmg += v + b; break;
    case 'shield': S.shieldMax += v + Math.round(b * 100); break;
    case 'targeting': S.crit += v + b; break;
    case 'recycle': S.scrap += v + b; break;
    case 'nanobot': S.regen += v + b * 20; break;
    case 'blast': S.blast += v + b; break;
    case 'sensor': S.range += v + b; break;
  }
}
function computeStats(char, modules, rb) {
  const C = CHARS[char];
  const S = { hpMul: 1 + rb.hp, move: 0, dmg: rb.dmg, cdr: 0, atk: rb.atk, crit: BASE_CRIT + rb.crit, critMul: CRIT_MUL, dr: rb.dr, pickupMul: 1 + rb.pickup,
    scrap: rb.scrap, xp: rb.xp, knock: 0, shock: 0, phys: 0, extraProj: 0, droneSpd: 0, droneDmg: 0, shieldMax: 0, shieldRegen: 0, regen: 0, blast: 0, range: 0,
    projSpd: 1 + rb.projSpd, melee: 0, chain: 0, shockDur: 0, dashCd: Math.max(1, DASH_CD - rb.dashCd) };
  if (char === 'rivet') { S.melee = 0.15; S.dr += 0.08; }
  if (char === 'volt') { S.chain = 1; S.shockDur = 0.3; }
  if (char === 'gear') { S.droneSpd += 0.20; }
  for (const m of modules) applyModule(S, m.id, m.lvl, m.bonus || 0);
  S.crit = Math.min(CRIT_CAP, S.crit);
  S.dr = Math.min(DR_CAP, S.dr);
  S.move = Math.min(MOVE_CAP - 1, S.move);
  S.maxHp = Math.round(C.hp * S.hpMul);
  S.speed = C.speed * (1 + S.move);
  S.pickup = BASE_PICKUP * S.pickupMul;
  return S;
}
// global attack cooldown multiplier (capped 45% reduction); overclock applies on top as a temporary boost
function cdMultiplier(S, supply, oc) {
  const m = Math.max(1 - CDR_CAP, (1 - S.cdr) / (1 + S.atk + (supply ? 0.15 : 0)));
  return oc ? m / (1 + OC_ATK) : m;
}

/* ============================== SAVE SERVICE ============================== */
const Save = {
  data: null, failed: false, lastWarn: 0, memoryOnly: false,
  defaults() {
    const cm = {}, co = {};
    for (const c of CHAR_ORDER) { cm[c] = { time: 0, kills: 0, runs: 0, wins: 0 }; co[c] = { color: 0, detail: 0, oc: 0, badge: 0 }; }
    const un = {}; for (const u of UNLOCKS) un[u.id] = false;
    return {
      version: SAVE_VERSION, currency: 0, research: { S: 0, W: 0, R: 0 }, unlocks: un,
      cumulativeAchievements: { kills: 0, chests: 0, repairs: 0, missileKills: 0, evolutions: 0, elite1Kills: 0, bestRunKills: 0, bestTime: 0, bestZones: 0 },
      characterMastery: cm, cosmetics: co,
      settings: { music: 0.5, sfx: 0.8, muted: false, shake: true, dmgNums: true, quality: 'auto', vibration: true, tutorialSeen: false },
      globalStats: { runs: 0, wins: 0, deaths: 0, kills: 0, bestTime: 0, mounts: 0, scrapTotal: 0, alloyTotal: 0, elites: 0, chests: 0, bossKills: 0 },
      rewardedRuns: [], runResume: null,
    };
  },
  // merge raw into defaults with type checks (corrupt fields fall back to defaults)
  merge(def, raw) {
    if (raw === null || typeof raw !== 'object' || Array.isArray(raw)) return def;
    for (const k in def) {
      const dv = def[k], rv = raw[k];
      if (rv === undefined) continue;
      if (typeof dv === 'number') { if (typeof rv === 'number' && isFinite(rv)) def[k] = Math.max(0, rv); }
      else if (typeof dv === 'boolean') { if (typeof rv === 'boolean') def[k] = rv; }
      else if (typeof dv === 'string') { if (typeof rv === 'string') def[k] = rv; }
      else if (Array.isArray(dv)) { if (Array.isArray(rv)) def[k] = rv.filter(x => typeof x === 'string').slice(-40); }
      else if (dv === null) { def[k] = rv; }
      else if (typeof dv === 'object') def[k] = this.merge(dv, rv);
    }
    return def;
  },
  validate(raw) {
    const d = this.merge(this.defaults(), raw);
    for (const b of ['S', 'W', 'R']) d.research[b] = clamp(Math.floor(d.research[b]), 0, 6);
    d.currency = Math.floor(d.currency);
    if (!['auto', 'low', 'high'].includes(d.settings.quality)) d.settings.quality = 'auto';
    d.settings.music = clamp(d.settings.music, 0, 1); d.settings.sfx = clamp(d.settings.sfx, 0, 1);
    for (const c of CHAR_ORDER) { const co = d.cosmetics[c]; co.color = clamp(co.color | 0, 0, 2); co.detail = clamp(co.detail | 0, 0, 3); co.oc = co.oc ? 1 : 0; co.badge = co.badge ? 1 : 0; }
    const rr = d.runResume;
    if (rr && !(typeof rr === 'object' && rr.v === 1 && CHARS[rr.char] && typeof rr.time === 'number' && Array.isArray(rr.weapons) && !rr.ended)) d.runResume = null;
    d.version = SAVE_VERSION;
    return d;
  },
  load() {
    let raw = null;
    try {
      let s = localStorage.getItem(SAVE_KEY);
      if (!s) for (const k of OLD_SAVE_KEYS) { s = localStorage.getItem(k); if (s) break; }
      if (s) raw = JSON.parse(s);
    } catch (e) { raw = null; this.memoryOnly = true; }
    if (raw && typeof raw.version === 'number' && raw.version < SAVE_VERSION) raw = this.migrate(raw);
    this.data = this.validate(raw);
    return this.data;
  },
  migrate(raw) { // v1 -> v2: v1 stored stats under "stats" and alloy under "alloy"
    if (raw.alloy !== undefined && raw.currency === undefined) raw.currency = raw.alloy;
    if (raw.stats && !raw.globalStats) raw.globalStats = raw.stats;
    raw.runResume = null;
    return raw;
  },
  save() {
    if (TESTMODE) return true;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); this.failed = false; return true; }
    catch (e) {
      this.failed = true;
      const n = performance.now();
      if (n - this.lastWarn > 15000) { this.lastWarn = n; toast('Kayıt yapılamadı (depolama dolu veya engelli). İlerleme bu oturumda tutuluyor.', 'bad'); }
      return false;
    }
  },

function dropXp(x, y, v) {

  const put = (val) => { const g = POOL.gm.pop() || {}; Object.assign(g, { x: x + (Math.random() - 0.5) * 16, y: y + (Math.random() - 0.5) * 16, v: val, mag: null, fly: false, sc: 0, kind: 'xp' }); G.gems.push(g); };
  for (let i = 0; i < pur; i++) put(20); for (let i = 0; i < blu; i++) put(5); for (let i = 0; i < grn; i++) put(1);
}
function dropScrap(x, y, v) { G.scraps.push({ x: x + (Math.random() - 0.5) * 10, y: y + (Math.random() - 0.5) * 10, v, fly: false, a: Math.random() * TAU }); }
function mergeGems() { // keeps exact XP totals; merges far-away small gems into bigger packets
  if (G.gems.length < 280) return;
  const p = G.p, buckets = new Map(), keep = [];
  for (const g of G.gems) {
    if (g.mag || g.fly || d2(g.x, g.y, p.x, p.y) < 700 * 700 || g.v >= 20) { keep.push(g); continue; }
    const k = Math.floor(g.x / 220) * 100 + Math.floor(g.y / 220);
    let b = buckets.get(k); if (!b) { b = { x: 0, y: 0, v: 0, n: 0 }; buckets.set(k, b); }
    b.x += g.x; b.y += g.y; b.v += g.v; b.n++; POOL.gm.push(g);
  }

}
function updatePickups(dt) {

      if (l < p.r + 8) { gainXp(g.v); POOL.gm.push(g); G.gems[i] = G.gems[G.gems.length - 1]; G.gems.pop(); Sfx.play('pick'); }

}

/* ============================== SIMULATION STEP ============================== */
function step(dt) {
  const run = G.run, p = G.p;
  G.simT += dt;
  updateParts(dt); updateFloatsBanners(dt);
  if (p.dead) {
    p.deadT += dt; updateFx(dt);
    if (p.deadT > 1.7 && !run.ended) endRun(false);
    return;
  }
  const boss = G.bossActive ? G.enemies.find(e => e.T.boss && !e.dead) : null;
  if (boss && boss.dying) { updateBossDeath(boss, dt); updateFx(dt); updatePickups(dt); return; }
  Save.data.characterMastery[run.char].time += dt;
  if (run.supplyT > 0) run.supplyT = Math.max(0, run.supplyT - dt);
  updateDirector(dt);
  updatePlayer(dt);
  rebuildHash();
  updateWeapons(dt);
  updateEnemies(dt);
  rebuildHash();
  updateProjs(dt);
  updateHazards(dt);
  updatePickups(dt);
  updateOverclock(dt);
  updateStations(dt);
  if (G.mount) updateMount(dt);
  updateFx(dt);
  // remove dead enemies into pool
  const E = G.enemies;
  for (let i = E.length - 1; i >= 0; i--) if (E[i].dead) { const e = E[i]; e.burnW = null; E[i] = E[E.length - 1]; E.pop(); POOL.e.push(e); }
  run.mergeT = (run.mergeT || 0) + dt; if (run.mergeT > 2) { run.mergeT = 0; mergeGems(); }
  run.cpT += dt; if (run.cpT >= CHECKPOINT_EVERY) checkpoint();
  if (!p.dead && SIM_STATES.has(G.state) && !run.ended) {
    if (run.cardPend) openCardScreen(run.cardPend.mode, W.stations[run.cardPend.src] || null, run.cardPend.offers);
    else if (run.pendingLv > 0) openCardScreen('level');
  }
}
function updateFloatsBanners(dt) {
  for (let i = G.floats.length - 1; i >= 0; i--) { G.floats[i].t -= dt; if (G.floats[i].t <= 0) G.floats.splice(i, 1); }
  for (let i = G.banners.length - 1; i >= 0; i--) { G.banners[i].t -= dt; if (G.banners[i].t <= 0) G.banners.splice(i, 1); }
}
function updateCamera(dt, sim) {
  const cam = G.cam;
  const base = viewScale();
  if (G.run && G.p) {
    const p = G.p, tz = G.bossActive ? 0.88 : 1;
    if (sim) cam.zoom += (tz - cam.zoom) * Math.min(1, dt * 1.5);
    cam.scale = base * cam.zoom;
    const la = 0.22, lx = clamp(p.vx * la, -90, 90), ly = clamp(p.vy * la, -70, 70);
    if (sim) { cam.lx += (lx - cam.lx) * Math.min(1, dt * 3); cam.ly += (ly - cam.ly) * Math.min(1, dt * 3); const k = 1 - Math.exp(-dt * 7); cam.x += (p.x + cam.lx - cam.x) * k; cam.y += (p.y + cam.ly - cam.y) * k; }

    cam.x = hw * 2 >= WORLD_W ? WORLD_W / 2 : clamp(cam.x, hw, WORLD_W - hw); cam.y = hh * 2 >= WORLD_H ? WORLD_H / 2 : clamp(cam.y, hh, WORLD_H - hh);

    pauseGame(); UI.act('toMenu'); ok('14. Ses/UI', 'Koşu → menü (kayıtla)', G.state === 'MENU' && !G.run && !!Save.data.runResume && !!ov.querySelector('[data-a="resume"]'));
    for (const s of ['WORKSHOP', 'COLLECTION', 'SETTINGS']) { if (s === 'SETTINGS') UI.act('settings'); else setState(s); ok('14. Ses/UI', s + ' ekranı açılır', ov.style.display === 'flex' && ov.innerHTML.length > 200); }
    for (const tb of ['robots', 'weapons', 'modules', 'evos', 'enemies', 'stats']) { UI.colTab = tb; setState('COLLECTION'); }
    ok('14. Ses/UI', 'Koleksiyon: 10 silah, 16 modül, 8 evrim, 3 robot, 11 düşman kaydı', WEAPON_ORDER.length === 10 && MODULE_ORDER.length === 16 && EVO_ORDER.length === 8 && CHAR_ORDER.length === 3 && ENEMY_ORDER.length === 11);
    setState('MENU');
  });
  // 15. stability / pooling
  guard('15. Kararlılık', () => {
    const r = fresh('rivet'); G.testNoDirector = false; G.god = true;
    r.poolW = WEAPON_ORDER.slice(); for (const id of ['missile', 'laser', 'orbit']) { const w = addWeapon(id); w.lvl = 5; }
    r.time = 600; sim(40);
    const normals = G.enemies.filter(isNormal).length;
    ok('15. Kararlılık', 'Normal düşman sayısı bütçeyle sınırlı', normals <= normalCap(), normals + ' / ' + normalCap());
    const far = G.enemies.filter(e => isNormal(e) && d2(e.x, e.y, G.p.x, G.p.y) > 3000 * 3000).length;
    ok('15. Kararlılık', 'Ekran dışında sınırsız birikme yok', far === 0);
    const poolBefore = POOL.e.length + G.enemies.length; for (const e of G.enemies) if (isNormal(e)) killEnemy(e, 'other'); step(STEP);
    ok('15. Kararlılık', 'Nesne havuzu: ölen düşmanlar havuza döner', POOL.e.length + G.enemies.length === poolBefore);
    ok('15. Kararlılık', 'Parçacık havuzu sınırlı', PT.n <= PMAX);
    { G.gems.length = 0; let xp = 0; for (let i = 0; i < 30; i++) { const e = spawnEnemy('nut', G.p.x + 900, G.p.y); killEnemy(e, 'other'); step(STEP); } xp = G.gems.reduce((a, g) => a + g.v, 0) + G.enemies.reduce((a, e) => a + (e.heldXp || 0), 0); ok('15. Kararlılık', 'Havuzdan yeniden kullanılan düşmanlar XP bırakır (30/30)', xp >= 30, xp); }
    ok('15. Kararlılık', 'Konsol hatası yok', testErrors === 0, testErrors);
    G.speed = 1;
  });
  // ---- report
  G.god = false; G.testNoDirector = false; leaveRun(); Save.data = keep; setState('MENU');
  const pass = res.filter(r => r.ok).length, fail = res.length - pass;
  const el = document.getElementById('testRep'); el.style.display = 'block';
  el.innerHTML = '<div style="font-size:16px;font-weight:bold;margin-bottom:8px">SCRAPCORE QA RAPORU — ' + pass + ' geçti, ' + fail + ' kaldı (' + Math.round(performance.now() - t0) + ' ms)</div>' +
    res.map(r => '<div class="' + (r.ok ? 'p' : 'f') + '">' + (r.ok ? '✔' : '✘') + ' [' + r.sec + '] ' + esc(r.name) + (r.info ? ' <span style="color:#aaa">(' + esc(r.info) + ')</span>' : '') + '</div>').join('') +
    '<div style="margin-top:10px"><button onclick="this.parentNode.parentNode.style.display=\'none\'">Kapat</button></div>';
  window.__TEST_RESULT = { pass, fail, res };
  console.log('QA', pass, 'pass', fail, 'fail');
}

boot();
</script>
