/* Blades of Fortune — Tides of Fortune'un ahşap/parşömen pixel arayüz dilinden uyarlanmıştır. Mantıksal sahne: 1280×720. */
:root { --ink: #1a1423; --wood0: #1e120b; --wood1: #3a2416; --wood2: #5c3a1e; --wood3: #8b5a2b; --wood4: #b07a42; --parch: #ecdcb2; --parch2: #d6bf8a; --gold: #f2c14e; --light: #f4ead5; --good: #6fd36a; --bad: #ff6b5e; --warn: #f2c14e; --steel: #9aa4b8; --royal: #2a4a9a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #08060c; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
body { font-family: 'Jersey 10', 'Trebuchet MS', system-ui, sans-serif; color: var(--light); -webkit-user-select: none; user-select: none; }
#app { position: fixed; inset: 0; }
#stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 50% 50%; overflow: hidden; background: #120c18; font-size: 24px; line-height: 1.2; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
#ui, #overlay, #bubbles { position: absolute; inset: 0; }
#bubbles { pointer-events: none; z-index: 2; }
#ui { z-index: 3; pointer-events: none; }
#ui > * { pointer-events: auto; }
#overlay { z-index: 10; pointer-events: none; }
#overlay > * { pointer-events: auto; }
#overlay > .toasts, #overlay > .banner { pointer-events: none; }
#loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #120c18; color: var(--gold); font-size: 40px; z-index: 100; transition: opacity .5s; }
#loading small { color: var(--light); font-size: 20px; }
#loading.hide { opacity: 0; pointer-events: none; }
#rotate { position: fixed; inset: 0; z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; background: radial-gradient(circle at 50% 40%, #3a5a2a, #0b1008 70%); color: var(--light); }
#rotate.show { display: flex; }
#rotate h2 { font-size: 26px; margin: 18px 0 6px; color: var(--gold); }
.rotIcon { width: 64px; height: 104px; border: 6px solid var(--light); border-radius: 10px; animation: rot 2.4s infinite ease-in-out; }
@keyframes rot { 0%, 25% { transform: rotate(0); } 55%, 85%, 100% { transform: rotate(-90deg); } }

.panel { background: rgba(26, 15, 10, 0.93); border: 4px solid var(--wood3); box-shadow: 0 0 0 4px var(--wood0), inset 0 0 0 3px rgba(240, 190, 120, .12), 0 8px 0 4px rgba(0, 0, 0, .35); }
.card { background: var(--parch); color: var(--ink); border: 3px solid var(--wood2); box-shadow: inset 0 -4px 0 rgba(120, 80, 40, .25), 0 3px 0 rgba(0, 0, 0, .35); }
.btn { font-family: inherit; color: var(--light); cursor: pointer; border: 3px solid var(--wood0); background: linear-gradient(180deg, #a06a34, #7a4a22); box-shadow: inset -3px -4px 0 rgba(0, 0, 0, .3), inset 3px 3px 0 rgba(255, 230, 170, .25), 0 3px 0 rgba(0, 0, 0, .4); font-size: 24px; min-height: 56px; padding: 4px 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-shadow: 2px 2px 0 rgba(0, 0, 0, .45); }
.btn:active, .opt:active, .slot:active { transform: translateY(2px); }
.btn.sm { min-height: 44px; font-size: 20px; padding: 2px 10px; }
.btn.big { min-height: 72px; font-size: 32px; padding: 8px 26px; }
.btn.primary { background: linear-gradient(180deg, #e8a63a, #b8742a); color: #2a1406; text-shadow: 1px 1px 0 rgba(255, 230, 170, .5); }
.btn.danger { background: linear-gradient(180deg, #c8463a, #8e2a22); }
.btn.royal { background: linear-gradient(180deg, #4a6ac8, #2a3a8a); }
.btn.ghost { background: rgba(0, 0, 0, .25); border-color: var(--wood3); box-shadow: none; }
.btn[disabled], .btn.off { filter: grayscale(.85) brightness(.7); cursor: default; }
.ic { width: 30px; height: 30px; image-rendering: pixelated; flex: none; vertical-align: middle; }
.ic.big { width: 44px; height: 44px; }
.ic.sm { width: 22px; height: 22px; }

/* HUD */
.hud { position: absolute; left: 12px; right: 12px; top: 10px; display: flex; gap: 10px; align-items: flex-start; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hbox { background: rgba(20, 12, 8, .9); border: 3px solid var(--wood3); box-shadow: 0 0 0 3px var(--wood0); padding: 4px 10px; display: flex; align-items: center; gap: 10px; }
.hpbar { position: relative; width: 210px; height: 26px; background: #2a1810; border: 3px solid var(--wood0); }
.hpbar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#6fd36a, #3a9a3a); transition: width .35s; }
.hpbar.low .fill { background: linear-gradient(#ff6b5e, #a02a22); }
.hpbar.mid .fill { background: linear-gradient(#f2c14e, #b8842a); }
.hpbar .lbl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; text-shadow: 2px 2px 0 #000; }
.stat { display: flex; align-items: center; gap: 4px; font-size: 24px; white-space: nowrap; }
.stat b { color: var(--gold); font-weight: normal; }
.stat small { font-size: 17px; opacity: .8; }
.statline { display: flex; gap: 10px; font-size: 19px; opacity: .92; }
.route { flex: 1; min-width: 0; flex-direction: column; align-items: stretch; gap: 2px; }
.route .names { display: flex; justify-content: space-between; font-size: 19px; }
.route .bar { position: relative; height: 14px; background: #2a1810; border: 2px solid var(--wood0); }
.route .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--parch2); }
.route .bar .pip { position: absolute; top: -3px; width: 8px; height: 16px; margin-left: -4px; background: #c83a3a; border: 2px solid #1a0a0a; }
.route .bar .pip.done { background: #6a6a6a; }
.hudBtns { display: flex; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 18px; padding: 1px 8px; background: rgba(0, 0, 0, .35); border: 2px solid rgba(0, 0, 0, .4); color: var(--light); }
.card .chip { color: var(--ink); background: rgba(90, 58, 30, .15); }
.chip.gold { background: var(--gold); color: var(--ink); }
.chip.bad { background: #8a2a1a; color: #ffe0c0; }
.chip.good { background: #2f6a2f; }
.chip.royal { background: var(--royal); }
.chip.chain { background: #5a2a6a; }
.chip.r-uncommon { background: #4a8ab8; } .chip.r-rare { background: #8a5ac8; } .chip.r-legendary { background: #c8842a; color: #1a0a00; }

/* Alt paneller */
.bottomPanel { position: absolute; left: 12px; right: 12px; bottom: 10px; padding: 12px 16px; animation: up .25s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.evHead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
.evHead h2 { margin: 0; font-size: 34px; color: var(--gold); font-weight: normal; text-shadow: 2px 2px 0 #000; }
.evText { font-size: 22px; line-height: 1.18; color: #efe4cc; margin-bottom: 10px; max-height: 80px; overflow: hidden; }
.opts { display: flex; gap: 10px; }
.opt { flex: 1; min-width: 0; text-align: left; font-family: inherit; cursor: pointer; padding: 8px 10px; display: flex; gap: 8px; align-items: flex-start; min-height: 86px; background: var(--parch); color: var(--ink); border: 4px solid var(--wood2); box-shadow: inset 0 -5px 0 rgba(120, 80, 40, .25), 0 4px 0 rgba(0, 0, 0, .4); }
.opt .t { font-size: 25px; line-height: 1; }
.opt .m { font-size: 17px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
.opt.locked { filter: grayscale(.9); opacity: .65; cursor: default; }
.opt.fight { border-color: #8a2a1a; }
.opt:not(.locked):hover { border-color: var(--gold); }
.outTitle { font-size: 38px; margin: 0 0 4px; font-weight: normal; }
.outTitle.win { color: var(--good); } .outTitle.lose { color: var(--bad); } .outTitle.flee { color: #9ad8ff; } .outTitle.dead { color: #ff3a3a; }
.lines { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 8px; max-height: 70px; overflow: auto; }
.lines .chip { font-size: 18px; }
.row { display: flex; gap: 10px; align-items: center; }
.spacer { flex: 1; }
.skipBtn { position: absolute; right: 16px; bottom: 16px; z-index: 4; }

/* Savaş */
.combat { display: flex; gap: 12px; align-items: stretch; }
.combat .me { width: 300px; display: flex; flex-direction: column; gap: 6px; }
.focus { display: flex; gap: 6px; align-items: center; font-size: 20px; }
.focus i { width: 22px; height: 22px; border: 3px solid #1a0a0a; background: #3a2a1a; display: inline-block; transform: rotate(45deg); }
.focus i.on { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.acts { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.act { flex-direction: column; min-height: 100px; font-size: 24px; line-height: 1; gap: 4px; }
.act small { font-size: 16px; opacity: .85; }
.quickPop { position: absolute; bottom: 132px; display: flex; gap: 8px; padding: 8px; }
.foeBar { position: absolute; width: 160px; margin-left: -80px; padding: 3px 6px; background: rgba(20, 10, 10, .88); border: 3px solid #5a1a1a; box-shadow: 0 0 0 2px #000; pointer-events: auto; cursor: pointer; font-size: 17px; line-height: 1; }
.foeBar.sel { border-color: var(--gold); box-shadow: 0 0 0 2px #000, 0 0 12px var(--gold); }
.foeBar .nm { display: flex; justify-content: space-between; gap: 4px; white-space: nowrap; overflow: hidden; }
.foeBar .b { height: 9px; background: #2a1010; margin: 3px 0; border: 1px solid #000; }
.foeBar .b i { display: block; height: 100%; background: linear-gradient(#ff6b5e, #a02a22); transition: width .3s; }
.foeBar .in { color: #ffd76a; white-space: nowrap; }

/* Konuşma balonları ve yüzen yazılar */
.bubble { position: absolute; left: 0; top: 0; max-width: 300px; width: max-content; background: #fffaf0; color: #2a1a10; border: 3px solid #2a1a10; padding: 5px 10px; font-size: 21px; line-height: 1.1; box-shadow: 3px 3px 0 rgba(0, 0, 0, .35); transform: translate(-50%, -100%); animation: pop .15s ease-out; }
.bubble::after { content: ''; position: absolute; left: 50%; bottom: -12px; margin-left: -6px; border: 6px solid transparent; border-top-color: #2a1a10; }
.bubble.think { border-style: dashed; font-style: italic; background: #eef4ff; }
@keyframes pop { from { transform: translate(-50%, -80%) scale(.7); opacity: 0; } }
.float { position: absolute; font-size: 26px; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; white-space: nowrap; transform: translate(-50%, -100%); animation: floatUp 1.3s ease-out forwards; }
@keyframes floatUp { to { margin-top: -60px; opacity: 0; } }
.banner { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); padding: 14px 40px; font-size: 40px; color: var(--gold); background: rgba(20, 10, 4, .9); border: 4px solid var(--gold); box-shadow: 0 0 0 4px #000; text-align: center; animation: bann 2.4s ease-out forwards; z-index: 20; pointer-events: none; }
@keyframes bann { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } 80% { opacity: 1; } 100% { opacity: 0; } }
.toasts { position: absolute; top: 84px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 30; }
.toast { padding: 6px 16px; font-size: 21px; background: rgba(20, 12, 8, .95); border: 3px solid var(--wood3); animation: toast 3.2s forwards; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-10px); } 10%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* Modallar */
.modalBg { position: absolute; inset: 0; background: rgba(5, 3, 8, .62); display: flex; align-items: center; justify-content: center; }
.modal { width: 1100px; max-height: 660px; display: flex; flex-direction: column; padding: 14px 18px; }
.modal.narrow { width: 760px; }
.modal h2 { margin: 0; font-size: 36px; color: var(--gold); font-weight: normal; }
.modal .mhead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.modal .mbody { overflow: auto; flex: 1; padding-right: 6px; }
.grid { display: grid; gap: 8px; }
.g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); }
.item { display: flex; gap: 8px; align-items: center; padding: 6px 8px; min-height: 64px; }
.item .nm { font-size: 23px; line-height: 1; }
.item .ds { font-size: 16px; opacity: .85; line-height: 1.05; margin-top: 2px; }
.item .pr { margin-left: auto; text-align: right; white-space: nowrap; }
.slot { width: 76px; height: 76px; display: flex; align-items: center; justify-content: center; position: relative; background: #2a1810; border: 3px solid var(--wood2); cursor: pointer; }
.slot.empty { border-style: dashed; opacity: .5; }
.slot.sel { border-color: var(--gold); box-shadow: 0 0 10px var(--gold); }
.slot .n { position: absolute; right: 3px; bottom: 0; font-size: 18px; color: var(--gold); text-shadow: 1px 1px 0 #000; }
.slot .q { position: absolute; left: 3px; top: 0; font-size: 15px; color: #9ad8ff; }
.slot.r-uncommon { border-color: #4a8ab8; } .slot.r-rare { border-color: #8a5ac8; } .slot.r-legendary { border-color: #e8942a; }
.lane { padding: 10px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-height: 230px; }
.lane h3 { margin: 0; font-size: 30px; font-weight: normal; }
.lane .dg { color: #a02a1a; letter-spacing: 2px; }
.townSide { position: absolute; right: 14px; top: 90px; width: 330px; display: flex; flex-direction: column; gap: 8px; padding: 10px; }
.townSide .btn { justify-content: flex-start; width: 100%; }
.townInfo { position: absolute; left: 14px; top: 90px; width: 380px; padding: 10px 14px; }
.townInfo h2 { margin: 0; font-size: 38px; color: var(--gold); font-weight: normal; }
.upg { padding: 8px; display: flex; flex-direction: column; gap: 3px; min-height: 104px; cursor: pointer; }
.upg.own { background: #c8e0a8; }
.upg.lock { filter: grayscale(.8); opacity: .7; }
.menu { position: absolute; inset: 0; }
.logo { position: absolute; left: 70px; top: 60px; font-size: 96px; margin: 0; color: var(--gold); text-shadow: 5px 5px 0 #6a2a10, 9px 9px 0 rgba(0, 0, 0, .5); line-height: .9; font-weight: normal; }
.logo span { display: block; font-size: 30px; color: var(--light); text-shadow: 3px 3px 0 #000; margin-top: 14px; }
.menuBtns { position: absolute; right: 70px; top: 110px; width: 440px; display: flex; flex-direction: column; gap: 12px; }
.menuBtns .btn { width: 100%; }
.menuFoot { position: absolute; left: 70px; bottom: 30px; font-size: 20px; opacity: .85; text-shadow: 2px 2px 0 #000; }
.summary { width: 820px; padding: 20px 26px; }
.statsGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; font-size: 24px; margin: 10px 0; }
.statsGrid b { color: var(--gold); font-weight: normal; float: right; }
textarea { width: 100%; height: 160px; font-family: monospace; font-size: 14px; background: #120c08; color: var(--light); border: 3px solid var(--wood2); }
.tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.tabs .btn.on { background: linear-gradient(180deg, #e8a63a, #b8742a); color: #2a1406; }
.dim { opacity: .75; }
.good { color: var(--good); } .bad { color: var(--bad); } .goldc { color: var(--gold); }
