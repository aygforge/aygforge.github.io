    const potF = g.pot > g.ovr ? clamp((g.pot - g.ovr) / 8, 0.04, 1) : 0;
    const pts = g.xp * 0.068 * g.grow * this.growthMult(club) * this.ageFactor(g) * potF;
    g.xp = 0;
    if (pts <= 0) return;
    const w = CLASSES[g.cls].w;
    const keys = ['str', 'end', 'agi', 'tec', 'dis'];
    for (let k = 0; k < 3; k++) {
      const key = R.weighted(keys, x => w[x] + 0.05);
      g[key] = r1(Math.min(98, g[key] + pts / 3));
    }
    g.ovr = r1(ovrOf(g));
    if (g.ovr > g.pot) g.pot = g.ovr;
    if (g.ovr > num(g.peak)) g.peak = g.ovr;
  },
  weeklyAll(matchWeek) {
    const wk = S.season * 100 + S.week;
    for (const id in S.glads) {
      const g = S.glads[id];
      const club = g.club >= 0 ? S.clubs[g.club] : null;
      // bench / free agents train a little on their own
      if (club) { if (g.pw !== wk) g.xp = num(g.xp) + 2.5; }
      else g.xp = num(g.xp) + 1;
      this.convertXP(g, club);
      // condition recovery
      const rec = club ? Staff.condRecovery(club) : 15;
      g.cond = clamp(Math.round(g.cond + rec * (g.age > 32 ? 0.85 : 1)), 0, 100);
      // injuries heal
      if (g.injury) {
        g.injury.w--;
        if (g.injury.w > 0 && club && R.next() < Staff.healChance(club)) g.injury.w--;
        if (g.injury.w <= 0) { g.injury = null; if (g.club === S.player) GameState.news(`${g.n} sakatlığını atlattı ve maçlara hazır.`, { p: 1, k: 'inj' }); }
      }
      // morale
      g.mor = g.mor + (62 - g.mor) * 0.1;
      if (club) {
        if (matchWeek && matchWeek.has(club.id) && g.pw !== wk && !g.injury) g.mor -= g.ovr > Squad.avgOvr(club) ? 2.5 : 1.5;
        if (club.arrears > 0) g.mor -= 6;
      } else g.fw = num(g.fw) + 1;
      g.mor = Math.round(clamp(g.mor, 0, 100));
      if (S.week % 5 === 0) g.ppot = r1(clamp(lerp(g.ppot, Math.max(g.pot, g.ovr), 0.08), g.ovr, 99));
      g.val = TransferMath.value(g);
    }
  },
  // season end: ageing, decline, retirement decision. Returns true if retiring
  ageAndRetire(g) {
    g.age++;
    const over = g.age - g.pk - 2;
    if (over > 0) {
      const d = over * 0.8 + R.range(0, 1.5);
      g.agi = r1(Math.max(5, g.agi - d * 1.0));
      g.end = r1(Math.max(5, g.end - d * 0.7));
      g.str = r1(Math.max(5, g.str - d * 0.5));
      g.tec = r1(Math.max(5, g.tec - d * 0.15));
      g.dis = r1(Math.max(5, g.dis - d * 0.1));
      g.ovr = r1(ovrOf(g));
      g.pot = r1(Math.max(g.ovr, g.pot - d));
      g.ppot = r1(Math.max(g.ovr, Math.min(g.ppot, g.pot + 3)));
    }
    const a = g.age;
    let p = a < 33 ? 0 : a === 33 ? 0.05 : a === 34 ? 0.1 : a === 35 ? 0.18 : a === 36 ? 0.3 : a === 37 ? 0.45 : a === 38 ? 0.62 : 0.85;
    if (a >= 31 && g.ovr < 30) p += 0.15;
    if (g.club < 0 && a >= 30) p += Math.min(0.4, num(g.fw) * 0.01);
    return R.next() < p;
  }
};

// ---------------------------------------------------------------- economy
const FIN_INC = { sponsor: 'Hami', tickets: 'Bilet', prizes: 'Ödüller', transfers: 'Transfer satışı', loan: 'Yeniden finansman' };
const FIN_EXP = { wages: 'Maaşlar', staff: 'Personel', ops: 'İşletme', transfers: 'Bonservis', signing: 'İmza parası', bonuses: 'Bonuslar', facilities: 'Tesisler', equipment: 'Ekipman', loanpay: 'Borç taksidi', release: 'Fesih', scout: 'Keşif' };

const Economy = {
  blankFin() {
    const inc = {}, exp = {};
    for (const k in FIN_INC) inc[k] = 0;
    for (const k in FIN_EXP) exp[k] = 0;
    return { inc, exp };
  },
  staffWage(q) { return Math.round(8 * Math.pow(1.045, q)); },
  wageBill(club) { return GameState.rosterGlads(club).reduce((a, g) => a + (g.con ? g.con.wage : 0), 0); },
  staffBill(club) { return STAFF_IDS.reduce((a, s) => a + club.staff[s].w, 0); },
  upkeep(club) { return FAC_IDS.reduce((a, f) => a + FAC.upkeep[club.fac[f]] * (f === 'arena' ? 1.3 : 1), 0); },
  opsCost(club) { return Math.round(ECON.opsBase * tierEco(club.tier) + this.upkeep(club)); },
  weeklyCost(club) { return this.wageBill(club) + this.staffBill(club) + this.opsCost(club) + (club.loan ? club.loan.wk : 0); },
  credit(club, cat, amt) {
    amt = Math.round(num(amt));
    if (amt <= 0) return;
    club.budget += amt;
    club.weekFin.inc[cat] = (club.weekFin.inc[cat] || 0) + amt;
    club.seasonFin.inc[cat] = (club.seasonFin.inc[cat] || 0) + amt;
  },
  // pay an expense. Discretionary spending (force=false) fails if unaffordable; obligations (force=true) create arrears
  debit(club, cat, amt, force) {
    amt = Math.round(num(amt));
    if (amt <= 0) return true;
    if (!force && (club.budget < amt || club.arrears > 0)) return false;
    let paid = amt;
    if (club.budget < amt) { paid = Math.max(0, club.budget); club.arrears += amt - paid; }
    club.budget -= paid;
    club.weekFin.exp[cat] = (club.weekFin.exp[cat] || 0) + amt;
    club.seasonFin.exp[cat] = (club.seasonFin.exp[cat] || 0) + amt;
    return true;
  },
  canSpend(club, amt) { return club.arrears <= 0 && club.budget >= amt; },
  gateEstimate(H, A, comp) {
    const cap = FAC.capacity[H.fac.arena];
    const tbl = Leagues.table(S.leagues[H.lg]).find(r => r.cid === H.id);
    const form = tbl ? tbl.form.filter(x => x === 'G').length - tbl.form.filter(x => x === 'M').length : 0;
    const star = GameState.rosterGlads(H).reduce((a, g) => Math.max(a, g.cha), 0);
    let fill = 0.55 + H.rep / 250 + form * 0.025 + (star - 50) * 0.003 + Rivalry.get(H.id, A.id) / 400 + (A.rep - H.rep) / 600 + (comp && comp.type !== 'league' ? 0.06 : 0);
    fill = clamp(fill, 0.2, 1);
    const att = Math.min(cap, Math.round(H.fans * fill));
    const price = ECON.ticketPrice * (1 + FAC.ticketBonus[H.fac.arena]) * (1 + (H.rep - 50) / 400);
    return { att, cap, rev: Math.round(att * price), fill };
  },
  matchday(H, A, comp) {
    const g = this.gateEstimate(H, A, comp);
    this.credit(H, 'tickets', g.rev);
    H.lastGate = { att: g.att, cap: g.cap, rev: g.rev, s: S.season, w: S.week };
  },
  weekly(club) {
    // income
    const spon = club.isPlayer && !club.autoManage ? (club.sponsor ? club.sponsor.wk : 0) : Sponsors.aiWeekly(club);
    this.credit(club, 'sponsor', spon);
    // settle old arrears first
    if (club.arrears > 0 && club.budget > 0) {
      const p = Math.min(club.budget, club.arrears);
      club.budget -= p; club.arrears -= p;
    }
    this.debit(club, 'wages', this.wageBill(club), true);
    this.debit(club, 'staff', this.staffBill(club), true);
    this.debit(club, 'ops', this.opsCost(club), true);
    if (club.loan) {
      this.debit(club, 'loanpay', club.loan.wk, true);
      club.loan.left--;
      if (club.loan.left <= 0) { club.loan = null; if (club.isPlayer) GameState.news('Yeniden finansman borcu tamamen ödendi.', { p: 1, k: 'fin' }); }
    }
    club.arrears = Math.round(club.arrears);
    if (club.arrears > 0) {
      club.rep = clamp(club.rep - 0.4, 1, 99);
      if (club.isPlayer && !club.autoManage) GameState.news(`Maaş borcu: ${fmtGold(club.arrears)}. Gladyatörlerin morali düşüyor, harcamalar durduruldu.`, { p: 1, k: 'fin' });
      // unbounded debt is not allowed: unpaid gladiators walk out once arrears exceed ~6 weeks of wages
      const wb = this.wageBill(club);
      if (club.arrears > Math.max(600, wb * 6)) {
        const gl = GameState.rosterGlads(club).sort((a, b) => (b.con.wage * (100 - b.loy)) - (a.con.wage * (100 - a.loy)))[0];
        if (gl) {
          const forgiven = Math.min(club.arrears, gl.con.wage * 6);
          club.arrears -= forgiven;
          GameState.news(`${gl.n}, ödenmeyen maaşları nedeniyle ${club.n} ile sözleşmesini feshetti.`, { p: club.isPlayer ? 1 : 0, k: 'fin' });
          Transfer.detach(gl, { reason: 'Maaş alamadı' });
        }
      }
      if (!club.isPlayer || club.autoManage) this.aiRefinance(club);
    }
  },
  refinanceOffer(club) {
    if (club.loan || club.loanSeason === S.season) return null;
    const wc = this.weeklyCost(club);
    if (!(club.arrears > 0 || club.budget < wc * 3)) return null;
    const amount = Math.round((wc * 10 + club.arrears) / 10) * 10;
    return { amount, weeks: 20, wk: Math.round(amount * 1.2 / 20), total: Math.round(amount * 1.2) };
  },
  refinance(club) {
    const o = this.refinanceOffer(club);
    if (!o) return false;
    club.loan = { left: o.weeks, wk: o.wk, total: o.total, amount: o.amount };
    club.loanSeason = S.season;
    this.credit(club, 'loan', o.amount);
    const p = Math.min(club.budget, club.arrears); club.budget -= p; club.arrears -= p;
    club.rep = clamp(club.rep - 3, 1, 99);
    GameState.news(`${club.n} Sarraflar Loncası'ndan ${fmtGold(o.amount)} yeniden finansman aldı.`, { p: club.isPlayer ? 1 : 0, k: 'fin' });
    return true;
  },
  aiRefinance(club) { if (this.refinanceOffer(club)) this.refinance(club); },
  closeWeek(club) {
    if (club.isPlayer) {
      club.weekHist = club.weekHist || [];
      const inc = Object.values(club.weekFin.inc).reduce((a, b) => a + b, 0);
      const exp = Object.values(club.weekFin.exp).reduce((a, b) => a + b, 0);
      club.weekHist.push({ w: S.week, inc, exp, b: club.budget });
      if (club.weekHist.length > 32) club.weekHist.shift();
    }
    club.lastFin = club.weekFin;
    club.weekFin = this.blankFin();
  }
};

const Reputation = {
  afterMatch(c, won, opp) {
    const d = won ? 0.15 + Math.max(0, opp.rep - c.rep) * 0.02 : -0.1 - Math.max(0, c.rep - opp.rep) * 0.01;
    c.rep = r1(clamp(c.rep + d, 1, 99));
  },
  seasonEnd(c, rank, promoted, relegated) {
    let d = 0;
    if (rank === 1) d += 6; else if (rank <= 4) d += 1.5; else if (rank >= 7) d -= 2;
    if (promoted) d += 4; if (relegated) d -= 4;
    d += (TIERS[c.tier].rep - c.rep) * 0.1;
    c.rep = r1(clamp(c.rep + d, 1, 99));
    const played = Math.max(1, c.st.w + c.st.l);
    const T = TIERS[c.tier];
    let f = c.fans * (1 + (c.st.w / played - 0.5) * 0.25 + (promoted ? 0.15 : 0) - (relegated ? 0.12 : 0) + (rank === 1 ? 0.1 : 0));
    f = lerp(f, (T.fans[0] + T.fans[1]) / 2, 0.08);
    c.fans = Math.max(200, Math.round(f));
  }
};

// ---------------------------------------------------------------- sponsors
const Sponsors = {
  aiWeekly(club) { return Math.round(ECON.sponsorBase * tierEco(club.tier) * (0.8 + club.rep / 250) * 1.12); },
  expectedRank(club) {
    const lg = S.leagues[club.lg];
    const mine = Squad.top3(club);
    let better = 0;
    for (const cid of lg.clubs) if (cid !== club.id && Squad.top3(S.clubs[cid]) > mine) better++;
    return better + 1;
  },
  makeGoal(kind, club, e) {
    const pick = arr => R.pick(arr);
    let N, d, txt;
    switch (kind) {
      case 'rank': N = clamp(e + pick([-1, 0, 1]), 1, 7); d = clamp(0.5 + (e - N) * 0.15, 0.1, 0.95); txt = `Ligi ilk ${N} sırada bitir`; if (N === 1) txt = 'Lig şampiyonu ol'; break;
      case 'title': N = 1; d = clamp(0.4 + (e - 1) * 0.12, 0.3, 0.97); txt = 'Lig şampiyonu ol'; break;
      case 'promo': N = 2; d = clamp(0.45 + (e - 2) * 0.12, 0.2, 0.95); txt = 'Üst lige yüksel (ilk 2)'; break;
      case 'wins': { const ew = Math.round(14 * (8.5 - e) / 8); N = clamp(ew + pick([-1, 0, 1, 2]), 3, 13); d = clamp(0.5 + (N - ew) * 0.1, 0.1, 0.95); txt = `En az ${N} lig maçı kazan`; break; }
      case 'kos': { const ek = Math.round(14 * (1.2 + 1.4 * (8.5 - e) / 8)); N = clamp(ek + pick([-3, 0, 3, 5]), 8, 40); d = clamp(0.5 + (N - ek) * 0.04, 0.1, 0.95); txt = `Ligde en az ${N} rakip ele`; break; }
      case 'cup': {
        const bye = club.tier <= 2;
        N = bye ? pick([2, 3, 4]) : pick([1, 2, 3]);
        d = clamp(0.3 + (N - (bye ? 2 : 1)) * 0.2 + (club.tier - 3) * 0.05, 0.1, 0.95);
        txt = `Bölgesel kupada ${RCUP_ROUNDS[N]} turuna ulaş`; break;
      }
      case 'homewins': { const eh = Math.round(7 * (8.5 - e) / 8 + 0.5); N = clamp(eh + pick([-1, 0, 1]), 2, 7); d = clamp(0.5 + (N - eh) * 0.15, 0.1, 0.95); txt = `Ev sahibi olarak en az ${N} lig maçı kazan`; break; }
    }
    return { kind, N, d: r1(d), txt };
  },
  generateOffers() {
    const club = GameState.player();
    if (!club) return;
    const e = this.expectedRank(club);
    const types = R.shuffle(Object.keys(SPONSOR_TYPES).slice()).slice(0, 3);
    S.sponsorOffers = types.map(t => {
      const T = SPONSOR_TYPES[t];
      let kinds = T.goals.filter(k => !(k === 'promo' && club.tier === 1));
      const goal = this.makeGoal(R.pick(kinds), club, e);
      const wk = Math.round(ECON.sponsorBase * tierEco(club.tier) * (0.8 + club.rep / 250) * T.wk * R.range(0.95, 1.05));
      const bonus = Math.round(wk * 30 * (0.15 + goal.d * 0.7) * T.bonus / 10) * 10;
      return { t, n: T.n, wk, bonus, dur: R.int(T.dur[0], T.dur[1]), goal };
    });
  },
  accept(i) {
    const club = GameState.player();
    if (club.sponsor || !S.sponsorOffers[i]) return false;
    const o = S.sponsorOffers[i];
    club.sponsor = { ...o, left: o.dur, since: S.season, hits: 0 };
    S.sponsorOffers = [];
    GameState.news(`${o.n} ile ${o.dur} sezonluk hami anlaşması imzalandı (haftalık ${fmtGold(o.wk)}).`, { p: 1, k: 'spon' });
    return true;
  },
  progress(club) {
    const sp = club.sponsor; if (!sp) return null;
    const g = sp.goal;
    const row = Leagues.table(S.leagues[club.lg]).find(r => r.cid === club.id) || { rank: 8, w: 0, kf: 0 };
    let cur, ok;
    switch (g.kind) {
      case 'rank': case 'title': case 'promo': cur = row.rank + '. sıra'; ok = row.rank <= g.N; break;
      case 'wins': cur = row.w + ' galibiyet'; ok = row.w >= g.N; break;
      case 'kos': cur = row.kf + ' eleme'; ok = row.kf >= g.N; break;
      case 'homewins': cur = club.st.homeW + ' ev galibiyeti'; ok = club.st.homeW >= g.N; break;
      case 'cup': { const rr = Cups.roundReached(S.rcups[club.reg], club.id); cur = rr >= 0 ? (rr >= RCUP_ROUNDS.length ? 'Şampiyon' : RCUP_ROUNDS[rr]) : '-'; ok = rr >= g.N; break; }
    }
    return { cur, ok };
  },
  seasonEnd(club) {
    const sp = club.sponsor; if (!sp) return;
    const p = this.progress(club);
    if (p && p.ok) {
      this.credit(club, sp.bonus);
      sp.hits++;
      club.rep = clamp(club.rep + 1, 1, 99);
      GameState.news(`${sp.n} hedefi tutturuldu: "${sp.goal.txt}". Ödül: ${fmtGold(sp.bonus)}.`, { p: 1, k: 'spon' });
    } else GameState.news(`${sp.n} sezon hedefi gerçekleşmedi: "${sp.goal.txt}".`, { p: 1, k: 'spon' });
    sp.left--;
  },
  credit(club, amt) { Economy.credit(club, 'sponsor', amt); },
  seasonStart(club) {
    if (club.sponsor && club.sponsor.left <= 0) {
      GameState.news(`${club.sponsor.n} ile hami anlaşması sona erdi. Yeni teklifler sizi bekliyor.`, { p: 1, k: 'spon' });
      club.sponsor = null;
    }
    if (club.sponsor) {
      // multi-season deals: refresh the goal against the new league situation
      const e = this.expectedRank(club);
      let kind = club.sponsor.goal.kind;
      if (kind === 'promo' && club.tier === 1) kind = 'rank';
      club.sponsor.goal = this.makeGoal(kind, club, e);
      club.sponsor.bonus = Math.round(club.sponsor.wk * 30 * (0.15 + club.sponsor.goal.d * 0.7) * SPONSOR_TYPES[club.sponsor.t].bonus / 10) * 10;
      S.sponsorOffers = [];
    } else this.generateOffers();
  }
};

// ---------------------------------------------------------------- staff & facilities
const Staff = {
  condRecovery(club) { return club ? 14 + FAC.medCond[club.fac.med] + club.staff.healer.q * 0.06 : 15; },
  healChance(club) { return club ? Math.min(0.75, FAC.medHeal[club.fac.med] + club.staff.healer.q * 0.003) : 0; },
  injReduce(club) { return club ? Math.min(0.3, FAC.medInj[club.fac.med] + club.staff.healer.q * 0.0012) : 0; },
  scoutAcc(club) { return club ? Math.min(0.75, FAC.scoutAcc[club.fac.scout] + club.staff.scout.q * 0.004) : 0; },
  hireCost(c) { return c.w * 6; },
  generateCandidates() {
    const club = GameState.player(); if (!club) return;
    const T = TIERS[club.tier];
    S.staffCands = {};
    for (const s of STAFF_IDS) {
      S.staffCands[s] = [0, 1, 2].map(k => WorldGenerator.staffMember(R.pick(REGIONS).id, R.range(T.staff[0] - 10 + k * 6, T.staff[1] + 4 + k * 5)));
    }
  },
  hire(type, idx) {
    const club = GameState.player();
    const c = S.staffCands && S.staffCands[type] && S.staffCands[type][idx];
    if (!c) return { ok: false, msg: 'Aday bulunamadı.' };
    const cost = this.hireCost(c);
    if (!Economy.debit(club, 'staff', cost, false)) return { ok: false, msg: 'Yetersiz bütçe (işe alım bedeli ' + fmtGold(cost) + ').' };
    const old = club.staff[type];
    club.staff[type] = { n: c.n, q: c.q, w: c.w };
    S.staffCands[type].splice(idx, 1, old);
    GameState.news(`${STAFF[type].name} olarak ${c.n} (kalite ${c.q}) göreve başladı.`, { p: 1, k: 'club' });
    return { ok: true };
  }
};

const Facilities = {
  cost(club, fid) {
    const lv = club.fac[fid];
    if (lv >= 5) return 0;
    return Math.round(FAC.cost[lv + 1] * (fid === 'arena' ? 1.4 : 1));
  },
  effect(fid, lv, club) {
    switch (fid) {
      case 'train': return `Gelişim çarpanı ×${FAC.trainMult[lv].toFixed(2)}`;
      case 'med': return `Kondisyon +${FAC.medCond[lv]}/hafta · ek iyileşme %${Math.round(FAC.medHeal[lv] * 100)} · sakatlık riski -%${Math.round(FAC.medInj[lv] * 100)}`;
      case 'scout': return `${FAC.scoutRegions[lv]} bölge · haftada ${FAC.scoutReports[lv]} rapor · doğruluk +%${Math.round(FAC.scoutAcc[lv] * 100)}`;
      case 'arena': return `Kapasite ${fmtInt(FAC.capacity[lv])} · bilet fiyatı +%${Math.round(FAC.ticketBonus[lv] * 100)}`;
    }
    return '';
  },
  upgrade(club, fid) {
    const lv = club.fac[fid];
    if (lv >= 5) return { ok: false, msg: 'Tesis en üst seviyede.' };
    const cost = this.cost(club, fid);
    if (club.arrears > 0) return { ok: false, msg: 'Maaş borcu varken yatırım yapılamaz.' };
    if (!Economy.debit(club, 'facilities', cost, false)) return { ok: false, msg: 'Yetersiz bütçe.' };
    club.fac[fid] = lv + 1;
    if (club.isPlayer) GameState.news(`${FACILITIES[fid].name} ${lv + 1}. seviyeye yükseltildi.`, { p: 1, k: 'club' });
    return { ok: true };
  }
};

// ---------------------------------------------------------------- equipment
const Equipment = {
  bonuses(g) {
    const b = { dmg: 0, armor: 0, hp: 0, block: 0, eva: 0, acc: 0, crit: 0, spd: 0, special: 0 };
    if (!g || !g.eq || !S) return b;
    for (const slot of ['w', 'a', 'x']) {
      const it = S.items[g.eq[slot]];
      if (!it) continue;
      const T = ITEM_TYPES[it.t]; if (!T) continue;
      const q = it.q + 1, p = it.p;
      b.dmg += (T.dmg || 0) * (q * 0.45 + p * 0.2);
      b.armor += (T.armor || 0) * (q * 1.2 + p * 0.4);
      b.hp += (T.hp || 0) * (q * 0.6 + p * 0.3);
      b.block += (T.block || 0) * (q + p * 0.3);
      b.eva += (T.eva || 0) * (q + p * 0.3);
      b.acc += (T.acc || 0) * (q + p * 0.3);
      b.crit += (T.crit || 0) * (q + p * 0.3);
      b.spd += (T.spd || 0);
      b.special += (T.special || 0) * (q * 0.5 + p * 0.2);
    }
    return b;
  },
  statLine(it) {
    const T = ITEM_TYPES[it.t], q = it.q + 1, p = it.p, out = [];
    if (T.dmg) out.push('Hasar +' + r1(T.dmg * (q * 0.45 + p * 0.2)));
    if (T.armor) out.push('Zırh +' + r1(T.armor * (q * 1.2 + p * 0.4)));
    if (T.hp) out.push('Can +' + r1(T.hp * (q * 0.6 + p * 0.3)));
    if (T.block) out.push('Blok +%' + r1(T.block * (q + p * 0.3) * 100));
    if (T.eva) out.push('Kaçınma +%' + r1(T.eva * (q + p * 0.3) * 100));
    if (T.acc) out.push('İsabet +%' + r1(T.acc * (q + p * 0.3) * 100));
    if (T.crit) out.push('Kritik +%' + r1(T.crit * (q + p * 0.3) * 100));
    if (T.special) out.push('Teknik etkisi +%' + r1(T.special * (q * 0.5 + p * 0.2) * 100));
    if (T.spd) out.push('Hız %' + r1(T.spd * 100));
    return out.join(' · ');
  },
  price(type, q) { const T = ITEM_TYPES[type]; return Math.round(QUALITIES[q].price * (T.slot === 'a' ? 1.1 : T.slot === 'x' ? 0.9 : 1)); },
  upgradeCost(it) { return Math.round(this.price(it.t, it.q) * 0.3 * Math.pow(it.p + 1, 1.5) / 10) * 10; },
  sellValue(it) { return Math.round((this.price(it.t, it.q) + it.p * this.upgradeCost({ ...it, p: Math.max(0, it.p - 1) }) * 0.5) * 0.35 / 10) * 10; },
  repNeeded(q) { return [0, 0, 15, 35, 55][q]; },
  name(it) { return QUALITIES[it.q].n + ' ' + ITEM_TYPES[it.t].n + (it.p ? ' +' + it.p : ''); },
  fits(it, g) { const T = ITEM_TYPES[it.t]; return T && T.cls.includes(g.cls); },
  equip(itemId, gid, silent) {
    const it = S.items[itemId], g = S.glads[gid];
    if (!it || !g) return { ok: false, msg: 'Geçersiz seçim.' };
    if (it.club !== g.club) return { ok: false, msg: 'Ekipman bu kulübe ait değil.' };
    if (!this.fits(it, g)) return { ok: false, msg: `${CLASSES[g.cls].name} bu ekipmanı kullanamaz.` };
    const slot = ITEM_TYPES[it.t].slot;
    if (it.g && S.glads[it.g]) S.glads[it.g].eq[slot] = 0;
    const prev = S.items[g.eq[slot]]; if (prev) prev.g = 0;
    g.eq[slot] = it.id; it.g = g.id;
    return { ok: true };
  },
  unequip(itemId) {
    const it = S.items[itemId]; if (!it) return;
    const g = S.glads[it.g];
    if (g) { const slot = ITEM_TYPES[it.t].slot; if (g.eq[slot] === it.id) g.eq[slot] = 0; }
    it.g = 0;
  },
  unequipAll(g) { for (const slot of ['w', 'a', 'x']) { const it = S.items[g.eq[slot]]; if (it) it.g = 0; g.eq[slot] = 0; } },
  buy(club, type, q) {
    if (club.rep < this.repNeeded(q)) return { ok: false, msg: `${QUALITIES[q].n} ekipman için en az ${this.repNeeded(q)} itibar gerekir.` };
    const cost = this.price(type, q);
    if (club.arrears > 0) return { ok: false, msg: 'Maaş borcu varken harcama yapılamaz.' };
    if (!Economy.debit(club, 'equipment', cost, false)) return { ok: false, msg: 'Yetersiz bütçe.' };
    const it = WorldGenerator.addItem(club, type, q, 0);
    return { ok: true, item: it };
  },
  upgrade(club, itemId) {
    const it = S.items[itemId];
    if (!it || it.club !== club.id) return { ok: false, msg: 'Geçersiz ekipman.' };
    if (it.p >= 5) return { ok: false, msg: 'Ekipman en üst seviyede (+5).' };
    const cost = this.upgradeCost(it);
    if (club.arrears > 0) return { ok: false, msg: 'Maaş borcu varken harcama yapılamaz.' };
    if (!Economy.debit(club, 'equipment', cost, false)) return { ok: false, msg: 'Yetersiz bütçe.' };
    it.p++;
    return { ok: true };
  },
  sell(club, itemId) {
    const it = S.items[itemId];
    if (!it || it.club !== club.id) return { ok: false };
    const v = this.sellValue(it);
    this.unequip(itemId);
    delete S.items[itemId];
    Economy.credit(club, 'transfers', v);
    return { ok: true, v };
  },
  clubItems(club) { return Object.values(S.items).filter(it => it.club === club.id); },
  // AI: equip best compatible unequipped items onto roster
  autoEquip(club) {
    const items = this.clubItems(club);
    if (!items.length) return;
    const score = it => it.q * 10 + it.p * 3;
    for (const g of GameState.rosterGlads(club)) {
      for (const slot of ['w', 'a', 'x']) {
        const cur = S.items[g.eq[slot]];
        let best = cur || null;
        for (const it of items) {
          if (ITEM_TYPES[it.t].slot !== slot || !this.fits(it, g)) continue;
          if (it.g && it.g !== g.id) continue;
          if (!best || score(it) > score(best)) best = it;
        }
        if (best && best !== cur) this.equip(best.id, g.id);
      }
    }
  }
};

// ---------------------------------------------------------------- scouting
const Scouting = {
  level(g) {
    if (!g) return 0;
    let l = S.scout[g.id] || 0;
    if (g.club === S.player) {
      l = Math.max(l, 2);
      if (g.joined && (S.season - g.joined.s) * 30 + (S.week - g.joined.w) >= 10) l = 3;
    }
    return l;
  },
  regions() {
    const c = GameState.player(); if (!c) return REGIONS.map(r => r.id);
    const n = FAC.scoutRegions[c.fac.scout];
    const ids = [c.reg].concat(REGIONS.map(r => r.id).filter(r => r !== c.reg));
    return ids.slice(0, n);
  },
  canSee(g) {
    if (!g) return false;
    if (g.club < 0 || g.club === S.player) return true;
    return this.regions().includes(S.clubs[g.club].reg);
  },
  potRange(g) {
    const lvl = this.level(g);
    const acc = Staff.scoutAcc(GameState.player());
    const err = [16, 10, 6, 2.5][lvl] * (1 - acc);
    const base = lvl === 0 ? g.ppot : g.pot;
    const off = (hash01(g.id, lvl * 13 + 7) - 0.5) * err;
    const c = base + off;
    let lo = Math.round(Math.max(g.ovr, c - err / 2)), hi = Math.round(Math.min(99, Math.max(g.ovr, c + err / 2)));
    if (hi < lo) hi = lo;
    return [lo, hi];
  },
  potMid(g) { const r = this.potRange(g); return (r[0] + r[1]) / 2; },
  trait(g, key) {
    const lvl = this.level(g);
    if (lvl < 2) return '?';
    const raw = { inj: (g.inj - 0.5) / 1.4 * 100, loy: g.loy, clu: g.clu, grow: (g.grow - 0.6) / 0.85 * 100 }[key];
    const noise = lvl === 2 ? (hash01(g.id, key.length * 31) - 0.5) * 30 : 0;
    const v = raw + noise;
    if (key === 'inj') return v < 33 ? 'Düşük' : v < 66 ? 'Orta' : 'Yüksek';
    return v < 33 ? 'Düşük' : v < 66 ? 'Orta' : 'Yüksek';
  },
  reportCost() { const c = GameState.player(); return Math.round(40 * Math.pow(tierEco(c.tier), 0.6) / 5) * 5; },
  reportsLeft() { const c = GameState.player(); return Math.max(0, FAC.scoutReports[c.fac.scout] - num(S.scoutUsed)); },
  report(g) {
    const c = GameState.player();
    if (this.level(g) >= 3) return { ok: false, msg: 'Bu gladyatör hakkında bilgiler zaten çok net.' };
    if (this.reportsLeft() <= 0) return { ok: false, msg: 'Bu haftaki keşif raporu hakkınız doldu.' };
    if (!this.canSee(g)) return { ok: false, msg: 'Keşif ağınız bu bölgeyi kapsamıyor.' };
    const cost = this.reportCost();
    if (!Economy.debit(c, 'scout', cost, false)) return { ok: false, msg: 'Yetersiz bütçe.' };
    S.scout[g.id] = Math.min(3, this.level(g) + 1);
    S.scoutUsed = num(S.scoutUsed) + 1;
    return { ok: true };
  }
};

// ---------------------------------------------------------------- news (generated only from real events)
const News = {
  onMatch(m, comp, res, H, A, ovrH, ovrA) {
    const W = res.w === 0 ? H : A, L = res.w === 0 ? A : H;
    const sc = `${Math.max(res.surv[0], res.surv[1])}-${Math.min(res.surv[0], res.surv[1])}`;
    if (H.isPlayer || A.isPlayer) {
      const me = H.isPlayer ? H : A;
      const opp = H.isPlayer ? A : H;
      const riv = Rivalry.get(H.id, A.id) >= 35 ? ' (rekabet maçı)' : '';
      GameState.news(`${Calendar.compName(comp)}: ${me.n} ${W === me ? 'kazandı' : 'kaybetti'} — ${opp.n} karşısında ${sc}${riv}.`, { p: 1, k: 'match' });
    }
    if (comp.type !== 'league' && W.tier - L.tier >= 2) {
      GameState.news(`${S.rcups[W.reg] && comp.type === 'rcup' ? S.rcups[W.reg].name : 'İmparatorluk Kupası'}'nda sürpriz: ${TIERS[W.tier].s} ekibi ${W.n}, ${TIERS[L.tier].s} ekibi ${L.n}'yi eledi!`, { k: 'cup', p: W.isPlayer || L.isPlayer });
    }
  }
};

// ---- 06_transfer.js
/* =========================================================================
   TransferManager (Transfer) + ClubAI
   ========================================================================= */

const Transfer = {
  windowId() { return S.season * 10 + (S.week <= 1 ? 0 : 1); },
  attach(g, club, con, silent) {
    g.club = club.id;
    g.con = { wage: Math.max(1, Math.round(num(con.wage, 20))), yrs: clamp(con.yrs | 0, 1, 5), sign: Math.round(num(con.sign)), winB: Math.round(num(con.winB, Math.round(con.wage * 0.25))), titleB: Math.round(num(con.titleB, Math.round(con.wage * 4))) };
    if (!club.roster.includes(g.id)) club.roster.push(g.id);
    g.joined = { s: S.season, w: S.week };
    g.fw = 0;
    g.hist.push({ s: S.season, w: S.week, c: club.id });
    if (g.hist.length > 20) g.hist.shift();
  },
  detach(g, opts = {}) {
    const club = g.club >= 0 ? S.clubs[g.club] : null;
    if (club) {
      club.roster = club.roster.filter(id => id !== g.id);
      club.lineup = club.lineup.filter(id => id !== g.id);
      Equipment.unequipAll(g);
      if (!club.isPlayer || club.autoManage) ClubAI.pickLineup(club); else Squad.fixLineup(club);
    }
    g.club = -1; g.con = null; g.fw = 0;
    delete S.nego[g.id];
  },
  record(g, from, to, fee, type) {
    const rec = { s: S.season, w: S.week, g: g.id, n: g.n, f: from, t: to, fee: Math.round(fee), ty: type, ovr: Math.round(g.ovr) };
    S.transfers.unshift(rec);
    if (S.transfers.length > 400) S.transfers.length = 400;
    const r = S.hist.records;
    if (fee > 0 && (!r.bigTransfer || fee > r.bigTransfer.fee)) r.bigTransfer = rec;
  },
  // full move from seller (may be -1 for free agent) to buyer
  execute(g, buyer, fee, con, type) {
    const fromId = g.club;
    const seller = fromId >= 0 ? S.clubs[fromId] : null;
    if (buyer.roster.length >= 5) return { ok: false, msg: 'Kadro dolu (en fazla 5 gladyatör).' };
    if (fee > 0) {
      if (!Economy.debit(buyer, 'transfers', fee, false)) return { ok: false, msg: 'Bonservis için yeterli bütçe yok.' };
      if (seller) Economy.credit(seller, 'transfers', fee);
    }
    if (con.sign > 0) {
      if (!Economy.debit(buyer, 'signing', con.sign, false)) {
        if (fee > 0) { buyer.budget += fee; if (seller) seller.budget -= fee; }
        return { ok: false, msg: 'İmza parası için yeterli bütçe yok.' };
      }
    }
    this.detach(g, { reason: 'transfer' });
    this.attach(g, buyer, con);
    if (!buyer.isPlayer || buyer.autoManage) { ClubAI.pickLineup(buyer); Equipment.autoEquip(buyer); } else Squad.fixLineup(buyer);
    this.record(g, fromId, buyer.id, fee, type);
    if (seller) Rivalry.add(seller.id, buyer.id, fee > TransferMath.value(g) * 0.8 && g.ovr > TIERS[buyer.tier].ovr + 3 ? 5 : 1);
    const big = fee >= 12000 || g.ovr >= 75;
    if (buyer.isPlayer || (seller && seller.isPlayer)) {
      GameState.news(fromId >= 0
        ? `${g.n} (${CLASSES[g.cls].name}, ${Math.round(g.ovr)}) ${seller.n} → ${buyer.n} transferi tamamlandı. Bonservis: ${fmtGold(fee)}.`
        : `Serbest gladyatör ${g.n} (${CLASSES[g.cls].name}, ${Math.round(g.ovr)}) ${buyer.n} ile sözleşme imzaladı.`, { p: 1, k: 'transfer' });
    } else if (big) {
      GameState.news(`${REGION_BY_ID[buyer.reg].name}: ${seller ? seller.n + ' kulübünün yıldızı ' : ''}${g.n}, ${buyer.n}'e ${fee ? fmtGold(fee) + ' bedelle ' : ''}transfer oldu.`, { k: 'transfer' });
    }
    if (buyer.isPlayer) S.scout[g.id] = Math.max(S.scout[g.id] || 0, 2);
    return { ok: true };
  },

  // ---------- club side (bonservis)
  askingPrice(seller, g) {
    let f = 1.15;
    if (seller.lineup.includes(g.id)) f *= 1.3;
    if (seller.roster.length <= 3) f *= 1.5;
    if (g.con && g.con.yrs <= 1) f *= 0.8;
    if (seller.arrears > 0 || seller.budget < Economy.weeklyCost(seller) * 3) f *= 0.85;
    if (seller.pol === 'econ') f *= 0.95;
    if (seller.pol === 'rich') f *= 1.25;
    f *= 0.97 + hash01(g.id, this.windowId()) * 0.08;
    return Math.round(TransferMath.value(g) * f / 50) * 50;
  },
  evaluateBid(seller, g, fee) {
    const ask = this.askingPrice(seller, g);
    const ratio = fee / ask;
    if (ratio >= 1) return { res: 'accept', ask };
    if (ratio >= 0.75) return { res: 'counter', ask, counter: ask };
    return { res: 'reject', ask };
  },

  // ---------- gladiator side (contract)
  prefYears(g) { return g.age <= 24 ? 2 : g.age <= 31 ? 3 : 2; },
  demand(g, club, renewal) {
    let m = 1;
    const cur = g.club >= 0 ? S.clubs[g.club] : null;
    if (cur && !renewal) {
      const diff = club.tier - cur.tier;
      if (diff > 0) m *= 1 + 0.14 * diff; else if (diff < 0) m *= Math.max(0.82, 1 + 0.05 * diff);
      m *= 1 + (g.loy - 50) / 400;
    }
    m *= 1 + (45 - club.rep) * 0.0025;
    if (renewal) { m *= 1 - (g.loy - 50) / 300; m *= 1 + (60 - g.mor) / 300; }
    if (!cur) m *= 1 - Math.min(0.3, num(g.fw) * 0.012);
    if (club.arrears > 0) m *= 1.15;
    // ambition: a fighter far above the club's league level wants a premium to join (or stay)
    const gap = g.ovr - TIERS[club.tier].ovr - 12;
    if (gap > 0) m *= 1 + gap * (renewal ? 0.015 : 0.035);
    const wage = Math.max(10, Math.round(TransferMath.expectedWage(g) * m));
    const free = !cur;
    return { wage, yrs: this.prefYears(g), sign: Math.round(wage * (free ? 8 : renewal ? 3 : 4)), winB: Math.round(wage * 0.25), titleB: Math.round(wage * 4) };
  },
  offerValue(o, pref) {
    return (o.wage + o.sign / (30 * clamp(o.yrs, 1, 3)) * 0.9 + o.winB * 0.35 + o.titleB * 0.04) * (1 - 0.04 * Math.abs(o.yrs - pref));
  },
  evaluateContract(g, club, offer, nego, renewal) {
    const d = this.demand(g, club, renewal);
    const pref = d.yrs;
    const need = this.offerValue({ ...d, winB: d.winB, titleB: d.titleB }, pref);
    const got = this.offerValue(offer, pref);
    const ratio = got / need;
    const tol = (hash01(g.id, this.windowId() + 3) - 0.5) * 0.06;
    if (ratio >= 1 + tol) return { res: 'accept', d };
    if (nego) nego.pat -= ratio >= 0.8 ? 1 : 2;
    if (nego && nego.pat <= 0) return { res: 'walk', d };
    // the wage that would satisfy him with the other terms unchanged
    const otherParts = got / (1 - 0.04 * Math.abs(offer.yrs - pref)) - offer.wage;
    const needWage = Math.ceil((need * (1 + tol) / (1 - 0.04 * Math.abs(offer.yrs - pref)) - otherParts) / 5) * 5;
    return { res: 'counter', d, needWage: Math.max(offer.wage + 5, needWage), insult: ratio < 0.8 };
  },
  // ---------- player-facing negotiation flow
  nego(gid) {
    let n = S.nego[gid];
    if (n && n.win !== this.windowId() && !n.renew) { delete S.nego[gid]; n = null; }
    return n;
  },
  startNego(g, renew) {
    const n = { gid: g.id, win: this.windowId(), stage: renew || g.club < 0 ? 'contract' : 'fee', fee: 0, tries: 0, pat: 2 + Math.round(g.loy / 40), blocked: false, renew: !!renew, counter: 0, msg: '' };
    S.nego[g.id] = n;
    return n;
  },
  canBuy(g) {
    const me = GameState.player();
    if (!g) return 'Gladyatör bulunamadı.';
    if (g.club === me.id) return 'Bu gladyatör zaten kulübünüzde.';
    if (!Calendar.isWindow()) return 'Transfer dönemi kapalı. ' + Calendar.windowLabel() + '.';
    if (me.roster.length >= 5) return 'Kadronuz dolu (5/5). Önce kadroda yer açmalısınız.';
    if (!Scouting.canSee(g)) return 'Keşif ağınız bu bölgeyi kapsamıyor. Keşif Merkezi\'ni geliştirin.';
    if (me.arrears > 0) return 'Maaş borcu varken transfer yapılamaz.';
    const n = this.nego(g.id);
    if (n && n.blocked) return 'Bu gladyatörle ilgili görüşmeler bu transfer döneminde sona erdi.';
    return null;
  },
  bidFee(g, fee) {
    const me = GameState.player();
    const err = this.canBuy(g); if (err) return { ok: false, msg: err };
    const n = this.nego(g.id) || this.startNego(g);
    fee = Math.max(0, Math.round(num(fee)));
    if (fee > me.budget) return { ok: false, msg: 'Teklif bütçenizi aşıyor.' };
    const seller = S.clubs[g.club];
    const r = this.evaluateBid(seller, g, fee);
    n.tries++;
    if (r.res === 'accept') { n.stage = 'contract'; n.fee = fee; n.msg = `${seller.n} ${fmtGold(fee)} bonservis teklifini kabul etti. Şimdi gladyatörle sözleşme görüşmesi yapın.`; }
    else if (r.res === 'counter') { n.counter = r.counter; n.msg = `${seller.n} karşı teklif verdi: ${fmtGold(r.counter)}.`; }
    else { n.msg = `${seller.n} teklifi reddetti. Bu gladyatörü bu fiyata satmayı düşünmüyorlar.`; if (fee < r.ask * 0.5) n.tries++; }
    if (r.res !== 'accept' && n.tries >= 4) { n.blocked = true; n.msg += ' Kulüp görüşmeleri kesti.'; }
    return { ok: true, res: r.res, n };
  },
  acceptCounter(g) {
    const n = this.nego(g.id);
    if (!n || !n.counter) return { ok: false, msg: 'Karşı teklif yok.' };
    if (n.counter > GameState.player().budget) return { ok: false, msg: 'Bütçeniz yetersiz.' };
    n.fee = n.counter; n.stage = 'contract'; n.msg = 'Bonservis anlaşması sağlandı. Şimdi sözleşmeyi görüşün.';
    return { ok: true };
  },
  offerContract(g, offer) {
    const me = GameState.player();
    const n = this.nego(g.id) || this.startNego(g, g.club === me.id);
    const renew = g.club === me.id;
    if (!renew) { const err = this.canBuy(g); if (err) return { ok: false, msg: err }; }
    if (n.blocked) return { ok: false, msg: 'Görüşmeler sona erdi.' };
    if (n.stage !== 'contract') return { ok: false, msg: 'Önce kulüple bonservis konusunda anlaşmalısınız.' };
    offer = { wage: Math.max(1, Math.round(num(offer.wage))), yrs: clamp(Math.round(num(offer.yrs, 1)), 1, 4), sign: Math.max(0, Math.round(num(offer.sign))), winB: Math.max(0, Math.round(num(offer.winB))), titleB: Math.max(0, Math.round(num(offer.titleB))) };
    if (offer.sign + n.fee > me.budget) return { ok: false, msg: 'Bonservis + imza parası bütçenizi aşıyor.' };
    const r = this.evaluateContract(g, me, offer, n, renew);
    if (r.res === 'accept') {
      if (renew) {
        if (offer.sign > 0 && !Economy.debit(me, 'signing', offer.sign, false)) return { ok: false, msg: 'İmza parası için bütçe yetersiz.' };
        g.con = { ...offer };
        g.mor = clamp(g.mor + 5, 0, 100);
        delete S.nego[g.id];
        GameState.news(`${g.n} sözleşmesini ${offer.yrs} sezon uzattı (haftalık ${fmtGold(offer.wage)}).`, { p: 1, k: 'transfer' });
        return { ok: true, res: 'accept', done: true };
      }
      const ex = this.execute(g, me, n.fee, offer, g.club < 0 ? 'free' : 'transfer');
      if (!ex.ok) return ex;
      delete S.nego[g.id];
      return { ok: true, res: 'accept', done: true };
    }
    if (r.res === 'walk') { n.blocked = true; n.msg = `${g.n} görüşme masasından kalktı. Bu dönemde yeniden görüşmeyecek.`; return { ok: true, res: 'walk', n }; }
    n.msg = (r.insult ? 'Bu teklif gladyatörü gücendirdi. ' : '') + `${g.n}'in beklentisi: haftalık en az ~${fmtGold(r.needWage)} (diğer şartlar aynı kalırsa). Tercih ettiği süre: ${r.d.yrs} sezon.`;
    n.lastDemand = r.needWage;
    return { ok: true, res: 'counter', n };
  },
  releaseCost(g) {
    if (!g.con) return 0;
    const weeks = (g.con.yrs - 1) * SEASON_WEEKS + Math.max(0, SEASON_WEEKS - S.week);
    return Math.round(g.con.wage * weeks * 0.6 / 10) * 10;
  },
  release(club, g) {
    const cost = this.releaseCost(g);
    if (!Economy.debit(club, 'release', cost, false)) return { ok: false, msg: 'Fesih bedeli için bütçe yetersiz (' + fmtGold(cost) + ').' };
    this.record(g, club.id, -1, 0, 'release');
    if (club.isPlayer) GameState.news(`${g.n} ile sözleşme feshedildi (bedel ${fmtGold(cost)}).`, { p: 1, k: 'transfer' });
    this.detach(g);
    return { ok: true };
  },
  // incoming offers for player's gladiators
  respondOffer(oid, action) {
    const i = S.offers.findIndex(o => o.id === oid);
    if (i < 0) return { ok: false, msg: 'Teklif bulunamadı.' };
    const o = S.offers[i];
    const g = S.glads[o.gid], buyer = S.clubs[o.from], me = GameState.player();
    if (!g || g.club !== me.id || !buyer) { S.offers.splice(i, 1); return { ok: false, msg: 'Teklif artık geçerli değil.' }; }
    if (action === 'reject') { S.offers.splice(i, 1); g.mor = clamp(g.mor - (g.loy < 40 ? 4 : 0), 0, 100); return { ok: true, msg: 'Teklif reddedildi.' }; }
    if (action === 'counter') {
      const ask = Math.round(o.fee * 1.2 / 50) * 50;
      if (o.countered) return { ok: false, msg: 'Bu teklif için zaten pazarlık yapıldı.' };
      o.countered = true;
      if (ask <= o.max && buyer.budget >= ask) { o.fee = ask; return { ok: true, msg: `${buyer.n} yeni bedeli kabul etti: ${fmtGold(ask)}. Teklifi onaylayabilirsiniz.` }; }
      S.offers.splice(i, 1);
      return { ok: true, msg: `${buyer.n} karşı teklifi kabul etmedi ve geri çekildi.` };
    }
    if (action === 'accept') {
      if (!Calendar.isWindow()) return { ok: false, msg: 'Transfer dönemi kapandı.' };
      if (buyer.roster.length >= 5 || buyer.budget < o.fee) { S.offers.splice(i, 1); return { ok: false, msg: `${buyer.n} artık bu transferi yapamıyor.` }; }
      const d = this.demand(g, buyer, false);
      const ex = this.execute(g, buyer, o.fee, { ...d, sign: 0 }, 'transfer');
      S.offers.splice(i, 1);
      S.offers = S.offers.filter(x => x.gid !== g.id);
      return ex.ok ? { ok: true, msg: `${g.n} ${fmtGold(o.fee)} karşılığında ${buyer.n}'e satıldı.` } : ex;
    }
    return { ok: false };
  },
  closeWindow() {
    S.offers = [];
    for (const k in S.nego) if (!S.nego[k].renew) delete S.nego[k];
  }
};

// ---------------------------------------------------------------- ClubAI
const ClubAI = {
  utility(g, club) {
    let u = g.ovr;
    const p = club.pol;
    if (p === 'talent' && g.age <= 24) u += (g.ppot - g.ovr) * 0.4;
    if (p === 'def' && (g.cls === 'murmillo' || g.cls === 'secutor' || g.cls === 'hoplomachus')) u += 3;
    if (p === 'agg' && (g.cls === 'dimachaerus' || g.cls === 'thraex' || g.cls === 'secutor')) u += 3;
    if (g.age > 31) u -= (g.age - 31) * 1.5;
    if (g.injury) u -= g.injury.w * 1.5;
    return u;
  },
  pickLineup(club) {
    const gl = GameState.rosterGlads(club).filter(g => !g.injury).sort((a, b) => Squad.readiness(b) - Squad.readiness(a));
    let pick = gl.slice(0, 3);
    // composition: avoid three of the same class when an alternative is close
    if (pick.length === 3 && pick[0].cls === pick[1].cls && pick[1].cls === pick[2].cls) {
      const alt = gl.slice(3).find(g => g.cls !== pick[0].cls && Squad.readiness(g) > Squad.readiness(pick[2]) - 4);
      if (alt) pick[2] = alt;
    }
    // front line: the sturdiest class
    const front = c => (CLASSES[c.cls].armor + CLASSES[c.cls].block * 30);
    pick.sort((a, b) => front(b) - front(a));
    if (pick.length === 3) pick = [pick[0], pick[1], pick[2]];
    club.lineup = pick.map(g => g.id);
    Squad.fixLineup(club);
  },
  chooseTactic(club, opp) {
    const diff = Squad.top3(club) - Squad.top3(opp);
    const hasTank = club.lineup.some(id => S.glads[id] && S.glads[id].cls === 'murmillo');
    const h = hash01(club.id, S.week + S.season * 31);
    if (diff < -5) return hasTank && h < 0.5 ? 'guard' : 'defensive';
    if (diff > 5) return h < 0.5 ? 'aggressive' : 'focus';
    switch (club.pol) {
      case 'def': return hasTank && h < 0.6 ? 'guard' : 'defensive';
      case 'agg': return h < 0.6 ? 'aggressive' : 'focus';
      case 'rich': return h < 0.5 ? 'focus' : 'balanced';
      default: return h < 0.7 ? 'balanced' : 'focus';
    }
  },
  seasonGoal(club) {
    const e = Sponsors.expectedRank(club);
    return e <= 1 ? 'Şampiyonluk' : e <= 3 ? 'Üst sıralar' : e <= 5 ? 'Orta sıra' : 'Ligde kalmak';
  },
  expectedIncome(club) {
    return Sponsors.aiWeekly(club) + ECON.ticketPrice * Math.min(FAC.capacity[club.fac.arena], club.fans * 0.75) * 7 / 30 + ECON.winPrize * tierEco(club.tier) * 0.25 + ECON.rankPrize[4] * tierEco(club.tier) / 30;
  },
  wageRoom(club) {
    const inc = this.expectedIncome(club);
    const cost = Economy.weeklyCost(club);
    return inc * 1.02 - cost + Math.max(0, club.budget - cost * 8) / 90;
  },
  transferBudget(club) { return Math.max(0, club.budget - Economy.weeklyCost(club) * 8); },
  aiClubs() { return S.clubs.filter(c => !c.isPlayer || c.autoManage); },
  // sign a free agent to fill a slot (always possible: a local recruit is generated if pool is empty)
  fillSlot(club, pool) {
    const room = this.wageRoom(club);
    const cands = pool.filter(g => g.club < 0);
    let best = null, bs = -1e9;
    const target = TIERS[club.tier].ovr;
    for (let k = 0; k < Math.min(40, cands.length); k++) {
      const g = cands[(k * 7 + club.id * 13 + S.week) % cands.length];
      const d = Transfer.demand(g, club, false);
      const afford = d.wage <= Math.max(room, TIERS[club.tier].eco * 30) && d.sign <= club.budget * 0.5;
      if (!afford) continue;
      const s = this.utility(g, club) - Math.max(0, g.ovr - target - 10) * 0.5 - d.wage / (tierEco(club.tier) * 40);
      if (s > bs) { bs = s; best = { g, d }; }
    }
    if (!best) {
      // local recruit — a modest fighter from the club's own region who joins on minimum terms
      const g = GladiatorGenerator.create({ reg: club.reg, ovr: TIERS[club.tier].ovr - 8 + R.normal(0, 3), age: R.int(18, 24) });
      S.glads[g.id] = g;
      best = { g, d: { ...Transfer.demand(g, club, false), sign: 0 } };
      best.d.wage = Math.max(10, Math.round(best.d.wage * 0.8));
    }
    const ex = Transfer.execute(best.g, club, 0, best.d, 'free');
    if (!ex.ok && club.budget < best.d.sign) {
      best.d.sign = 0;
      Transfer.execute(best.g, club, 0, best.d, 'free');
    }
    const i = pool.indexOf(best.g); if (i >= 0) pool.splice(i, 1);
  },
  tryUpgrade(club, freePool, allPool, playerBids) {
    const roster = GameState.rosterGlads(club);
    if (roster.length < 5) return;
    const weakest = roster.slice().sort((a, b) => this.utility(a, club) - this.utility(b, club))[0];
    const wu = this.utility(weakest, club);
    const tb = this.transferBudget(club);
    const room = this.wageRoom(club) + weakest.con.wage;
    let best = null, bs = 0;
    // allPool is sorted by OVR (desc): only consider gladiators clearly better than the weakest
    let lo = 0, hi = allPool.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (allPool[mid].ovr >= weakest.ovr + 3) lo = mid + 1; else hi = mid; }
    const nCand = lo;
    if (!nCand) return;
    const tries = Math.min(50, nCand);
    for (let k = 0; k < tries; k++) {
      const g = allPool[nCand <= 50 ? k : (R.next() * nCand) | 0];
      if (!g || g.club === club.id || g.injury) continue;
      const seller = g.club >= 0 ? S.clubs[g.club] : null;
      if (seller && seller.tier < club.tier - 1) continue; // stars from far higher leagues won't come
      const gain = this.utility(g, club) - wu;
      if (gain < 4) continue;
      const fee = seller ? Transfer.askingPrice(seller, g) : 0;
      const d = Transfer.demand(g, club, false);
      const relCost = Transfer.releaseCost(weakest);
      if (fee + d.sign + relCost * 0.3 > tb || d.wage > room) continue;
      const s = gain / Math.pow(1 + fee + d.wage * 30, 0.25);
      if (s > bs) { bs = s; best = { g, seller, fee, d }; }
    }
    if (!best) return;
    if (best.seller && best.seller.isPlayer && !best.seller.autoManage) {
      if (playerBids.n < 2 && !S.offers.some(o => o.gid === best.g.id || o.from === club.id)) {
        const fee = Math.round(best.fee * R.range(0.85, 1.12) / 50) * 50;
        const max = Math.round(TransferMath.value(best.g) * (club.pol === 'rich' ? 1.65 : 1.45) / 50) * 50;
        S.offers.push({ id: GameState.newId('o'), gid: best.g.id, from: club.id, fee, max, s: S.season, w: S.week });
        GameState.news(`Transfer teklifi: ${club.n}, ${best.g.n} için ${fmtGold(fee)} teklif etti.`, { p: 1, k: 'offer' });
        playerBids.n++;
      }
      return;
    }
    // make room: sell weakest to the free market if it is cheaper than keeping, else release
    const rc = Transfer.releaseCost(weakest);
    if (rc > club.budget * 0.25) return;
    if (!Transfer.release(club, weakest).ok) return;
    const ex = Transfer.execute(best.g, club, best.fee, best.d, best.seller ? 'transfer' : 'free');
    if (!ex.ok) this.fillSlot(club, freePool);
  },
  // AI bids for player's gladiators from clubs that need/want them
  playerTargets(playerBids) {
    const me = GameState.player();
    if (!me || me.autoManage) return;
    for (const g of GameState.rosterGlads(me)) {
      if (playerBids.n >= 2) break;
      if (S.offers.some(o => o.gid === g.id)) continue;
      const attract = clamp((g.ovr - TIERS[me.tier].ovr) / 20 + (g.age <= 23 ? 0.15 : 0), 0, 0.8);
      if (R.next() > 0.08 + attract * 0.25) continue;
      const cands = S.clubs.filter(c => !c.isPlayer && c.tier <= me.tier && c.tier >= me.tier - 2 && c.roster.length < 5 + 1 && this.transferBudget(c) > Transfer.askingPrice(me, g) * 0.9);
      if (!cands.length) continue;
      const buyer = R.pick(cands);
      const fee = Math.round(Transfer.askingPrice(me, g) * R.range(0.8, 1.15) / 50) * 50;
      const max = Math.round(TransferMath.value(g) * (buyer.pol === 'rich' ? 1.65 : 1.45) / 50) * 50;
      S.offers.push({ id: GameState.newId('o'), gid: g.id, from: buyer.id, fee, max, s: S.season, w: S.week });
      GameState.news(`Büyük transfer teklifi kulübümüze ulaştı: ${buyer.n}, ${g.n} için ${fmtGold(fee)} önerdi.`, { p: 1, k: 'offer' });
      playerBids.n++;
    }
  },
  windowPass(week) {
    const clubs = R.shuffle(this.aiClubs());
    const freePool = GameState.freeAgents().sort((a, b) => b.ovr - a.ovr);
    const allPool = Object.values(S.glads).filter(g => !g.temp).sort((a, b) => b.ovr - a.ovr);
    const playerBids = { n: S.offers.filter(o => o.w === S.week).length };
    // offers on the player's roster expire at window close; new ones may be created now
    for (const club of clubs) {
      if (club.arrears > 0) Economy.aiRefinance(club);
      // clubs in trouble shed their most expensive bench gladiator
      if (club.arrears > 0 && club.roster.length >= 4) {
        const bench = GameState.rosterGlads(club).filter(g => !club.lineup.includes(g.id)).sort((a, b) => b.con.wage - a.con.wage)[0];
        if (bench && Transfer.releaseCost(bench) <= club.budget) Transfer.release(club, bench);
      }
      if (club.roster.length < 5) { this.fillSlot(club, freePool); continue; }
      const pUp = { rich: 0.45, talent: 0.35, agg: 0.25, def: 0.25, econ: 0.15 }[club.pol] || 0.2;
      if (R.next() < pUp && club.arrears <= 0) this.tryUpgrade(club, freePool, allPool, playerBids);
    }
    this.playerTargets(playerBids);
    // fill pass: no AI club leaves the window short
    for (const club of this.aiClubs()) {
      let guard = 0;
      while (club.roster.length < 5 && guard++ < 5) this.fillSlot(club, freePool);
      this.equipmentPass(club);
      this.pickLineup(club);
    }
  },
  equipmentPass(club) {
    Equipment.autoEquip(club);
    const wc = Economy.weeklyCost(club);
    if (club.budget < wc * 15 || club.arrears > 0 || R.next() > 0.35) return;
    const aces = club.lineup.map(id => S.glads[id]).filter(Boolean);
    const g = R.pick(aces); if (!g) return;
    const slot = R.pick(['w', 'a', 'x']);
    const cur = S.items[g.eq[slot]];
    const q = clamp(Math.round((6 - club.tier) * 0.72 + R.normal(0, 0.6)), 0, 4);
    if (cur && cur.q >= q) {
      if (cur.p < 5 && Equipment.upgradeCost(cur) < club.budget * 0.08) Equipment.upgrade(club, cur.id);
      return;
    }
    const types = Object.keys(ITEM_TYPES).filter(t => ITEM_TYPES[t].slot === slot && ITEM_TYPES[t].cls.includes(g.cls));
    if (!types.length) return;
    const t = R.pick(types);
    if (Equipment.price(t, q) > club.budget * 0.12) return;
    if (club.rep < Equipment.repNeeded(q)) return;
    const r = Equipment.buy(club, t, q);
    if (r.ok) Equipment.equip(r.item.id, g.id);
    // clubs sell surplus old items
    const items = Equipment.clubItems(club).filter(it => !it.g);
    if (items.length > 6) Equipment.sell(club, items.sort((a, b) => a.q - b.q)[0].id);
  },
  weeklyLineups() { for (const c of this.aiClubs()) this.pickLineup(c); },
  // season-end contract decisions (before contracts tick down)
  renewals(club) {
    const avg = Squad.avgOvr(club);
    for (const g of GameState.rosterGlads(club)) {
      if (!g.con || g.con.yrs > 1) continue;
      if (g.age >= 34 || g.ovr < avg - 7) continue;
      const d = Transfer.demand(g, club, true);
      if (d.wage > g.con.wage * 1.6 && this.wageRoom(club) < d.wage - g.con.wage) continue;
      g.con = { wage: d.wage, yrs: g.con.yrs + R.int(1, 3), sign: 0, winB: d.winB, titleB: d.titleB };
    }
  },
  seasonStart(club) {
    // facilities investment
    const wc = Economy.weeklyCost(club);
    const maxLv = clamp(7 - club.tier, 1, 5);
    const order = R.shuffle(FAC_IDS.slice());
    for (const f of order) {
      if (club.fac[f] >= Math.max(maxLv, f === 'arena' && club.fans > FAC.capacity[club.fac.arena] ? 5 : 0)) continue;
      const cost = Facilities.cost(club, f);
      if (cost > 0 && club.budget - cost > wc * 14 && club.budget > cost * 2.5) { Facilities.upgrade(club, f); break; }
    }
    // staff improvement for low-quality staff
    const T = TIERS[club.tier];
    for (const s of STAFF_IDS) {
      if (club.staff[s].q < T.staff[0] - 6 && club.budget > wc * 12) club.staff[s] = WorldGenerator.staffMember(club.reg, R.range(T.staff[0], T.staff[1]));
    }
    club.goal = this.seasonGoal(club);
  }
};

// ---- 07_season.js
/* =========================================================================
   Season lifecycle, awards, history, weekly processing (Game) and sanity guards
   ========================================================================= */

const Season = {
  onCupChampion(cup) {
    const C = S.clubs[cup.champ], RU = S.clubs[cup.runner];
    if (!C) return;
    const imp = cup.key === 'imp';
    if (RU) Economy.credit(RU, 'prizes', imp ? ECON.icupFinalLoser : ECON.rcupFinalLoser * Math.pow(tierEco(RU.tier), 0.7));
    C.trophies.push({ s: S.season, t: cup.name });
    C.rep = r1(clamp(C.rep + (imp ? 8 : 5), 1, 99));
    C.fans = Math.round(C.fans * (imp ? 1.08 : 1.05));
    if (RU) Rivalry.add(C.id, RU.id, 10);
    this.payTitleBonus(C);
    for (const gid of C.roster) { const g = S.glads[gid]; if (g) g.aw.push({ s: S.season, t: cup.name + ' Şampiyonu' }); }
    GameState.news(`${cup.name} şampiyonu ${C.n} oldu! Finalde ${RU ? RU.n : '-'} yenildi.`, { p: C.isPlayer || (RU && RU.isPlayer), k: 'cup' });
    S.hist.champs.push({ s: S.season, k: cup.key, n: cup.name, c: C.id, cn: C.n, r: RU ? RU.id : -1, rn: RU ? RU.n : '' });
  },
  payTitleBonus(club) {
    for (const g of GameState.rosterGlads(club)) if (g.con && g.con.titleB > 0) Economy.debit(club, 'bonuses', g.con.titleB, true);
  },
  // runs once when week 29 is processed → week 30 (season evaluation)
  endOfSeason() {
    if (S.seasonEval === S.season) return;
    S.seasonEval = S.season;
    Leagues.invalidate();
    const rec = { s: S.season, leagues: [], cups: [], awards: {}, player: null };
    const qual = [];
    for (const lg of S.leagues) {
      const t = Leagues.table(lg);
      t.forEach(r => {
        const c = S.clubs[r.cid];
        Economy.credit(c, 'prizes', ECON.rankPrize[r.rank] * tierEco(lg.tier));
      });
      const champ = S.clubs[t[0].cid];
      champ.trophies.push({ s: S.season, t: TIERS[lg.tier].n + ' (' + REGION_BY_ID[lg.reg].name + ')' });
      this.payTitleBonus(champ);
      for (const gid of champ.roster) { const g = S.glads[gid]; if (g) g.aw.push({ s: S.season, t: TIERS[lg.tier].s + ' Şampiyonu' }); }
      if (t[1]) Rivalry.add(t[0].cid, t[1].cid, 8);
      rec.leagues.push({ id: lg.id, c: t[0].cid, cn: champ.n, r: t[1].cid, rn: S.clubs[t[1].cid].n });
      rec.awards[lg.id] = this.awards(lg, t[0].cid);
      if (lg.tier === 1) {
        GameState.news(`${REGION_BY_ID[lg.reg].name} Altın Kolezyum şampiyonu belli oldu: ${champ.n}!`, { k: 'league', p: champ.isPlayer });
        qual.push({ cid: t[0].cid, rank: 1, pts: t[0].pts, kd: t[0].kf - t[0].ka }, { cid: t[1].cid, rank: 2, pts: t[1].pts, kd: t[1].kf - t[1].ka });
      }
      for (const r of t) {
        const c = S.clubs[r.cid];
        c.hist.push({ s: S.season, tier: lg.tier, rank: r.rank, pts: r.pts, w: r.w, l: r.l });
        if (c.hist.length > 40) c.hist.shift();
        const promoted = lg.tier > 1 && r.rank <= 2, relegated = lg.tier < 6 && r.rank >= 7;
        Reputation.seasonEnd(c, r.rank, promoted, relegated);
        c.endRank = r.rank;
      }
    }
    S.icupQual = qual;
    for (const cup of Cups.all()) rec.cups.push({ k: cup.key, n: cup.name, c: cup.champ, cn: cup.champ >= 0 ? S.clubs[cup.champ].n : '-' });
    const me = GameState.player();
    if (me) {
      const lg = S.leagues[me.lg];
      const row = Leagues.table(lg).find(r => r.cid === me.id);
      const rr = Cups.roundReached(S.rcups[me.reg], me.id);
      rec.player = {
        c: me.id, n: me.n, tier: me.tier, reg: me.reg, rank: row.rank, pts: row.pts, w: row.w, l: row.l,
        cup: rr >= RCUP_ROUNDS.length ? 'Şampiyon' : rr >= 0 ? RCUP_ROUNDS[rr] : '-',
        imp: S.icup && S.icup.part.includes(me.id) ? (S.icup.champ === me.id ? 'Şampiyon' : (ICUP_ROUNDS[Math.min(ICUP_ROUNDS.length - 1, Cups.roundReached(S.icup, me.id))] || '-')) : null,
        fin: Math.round(me.budget)
      };
      if (!me.autoManage) Sponsors.seasonEnd(me);
      const myAw = rec.awards[me.lg];
      for (const k of ['mvp', 'ko', 'def', 'star']) if (myAw[k] && myAw[k].cid === me.id) GameState.news(`${myAw[k].n} ${AWARD_NAMES[k]} ödülünü kazandı!`, { p: 1, k: 'award' });
    }
    // records
    const R0 = S.hist.records;
    for (const id in S.glads) {
      const g = S.glads[id];
      if (g.ss.ko > 0 && (!R0.koSeason || g.ss.ko > R0.koSeason.v)) R0.koSeason = { v: g.ss.ko, n: g.n, g: g.id, s: S.season };
      if (!R0.topOvr || g.ovr > R0.topOvr.v) R0.topOvr = { v: Math.round(g.ovr), n: g.n, g: g.id, s: S.season };
    }
    S.hist.seasons.push(rec);
    if (S.hist.seasons.length > 60) S.hist.seasons.shift();
    GameState.news(`${S.season}. sezon sona erdi. Sezon değerlendirmesini inceleyin; ilerlediğinizde yeni sezon başlayacak.`, { p: 1, k: 'season' });
  },
  awards(lg, champCid) {
    const pool = [];
    for (const cid of lg.clubs) for (const gid of S.clubs[cid].roster) { const g = S.glads[gid]; if (g && g.ss.m >= 4) pool.push({ g, cid }); }
    const score = g => g.ss.w * 3 + g.ss.ko * 4 + g.ss.dmg / 40 + g.ss.sv * 2 + g.ss.blk * 0.3;
    const pickMax = (arr, f) => arr.reduce((b, x) => (b == null || f(x) > f(b)) ? x : b, null);
    const out = { champ: champCid };
    const mk = (x, v) => x ? { gid: x.g.id, n: x.g.n, cid: x.cid, v } : null;
    const mvp = pickMax(pool, x => score(x.g) + x.g.id * 1e-9);
    out.mvp = mk(mvp, mvp && Math.round(score(mvp.g)));
    const ko = pickMax(pool, x => x.g.ss.ko * 1000 + x.g.ss.dmg / 100);
    out.ko = mk(ko, ko && ko.g.ss.ko);
    const defPool = pool.filter(x => x.g.ss.m >= 6);
    const df = pickMax(defPool, x => -(x.g.ss.tk / x.g.ss.m) + x.g.ss.sv * 0.01);
    out.def = mk(df, df && Math.round(df.g.ss.tk / df.g.ss.m));
    const star = pickMax(pool.filter(x => x.g.age <= 22), x => score(x.g));
    out.star = mk(star, star && Math.round(score(star.g)));
    const tierN = TIERS[lg.tier].s;
    for (const k of ['mvp', 'ko', 'def', 'star']) if (out[k]) S.glads[out[k].gid].aw.push({ s: S.season, t: AWARD_NAMES[k] + ' (' + tierN + ')' });
    return out;
  },
  // runs when the player advances from week 30: the new season is generated
  async transition(onProgress) {
    const prog = (p, t) => onProgress && onProgress(p, t);
    prog(0.05, 'Yükselen ve düşen kulüpler belirleniyor');
    // promotion / relegation (all regions, same calendar)
    for (let ri = 0; ri < REGIONS.length; ri++) {
      const tables = [];
      for (let t = 1; t <= 6; t++) tables[t] = Leagues.table(S.leagues[GameState.leagueIndex(ri, t)]).map(r => r.cid);
      for (let t = 1; t <= 5; t++) {
        const upper = S.leagues[GameState.leagueIndex(ri, t)], lower = S.leagues[GameState.leagueIndex(ri, t + 1)];
        const down = tables[t].slice(6), up = tables[t + 1].slice(0, 2);
        upper.clubs = upper.clubs.filter(c => !down.includes(c)).concat(up);
        lower.clubs = lower.clubs.filter(c => !up.includes(c)).concat(down);
        for (const c of up) { const C = S.clubs[c]; C.tier = t; C.lg = upper.id; GameState.news(`${C.n} ${TIERS[t].n}'ne yükseldi!`, { p: C.isPlayer, k: 'league' }); }
        for (const c of down) { const C = S.clubs[c]; C.tier = t + 1; C.lg = lower.id; if (C.isPlayer) GameState.news(`${C.n} ${TIERS[t + 1].n}'ne düştü.`, { p: 1, k: 'league' }); }
      }
    }
    await nextTick();
    prog(0.25, 'Sözleşmeler güncelleniyor');
    for (const c of ClubAI.aiClubs()) ClubAI.renewals(c);
    const me = GameState.player();
    for (const id in S.glads) {
      const g = S.glads[id];
      if (!g.con) continue;
      g.con.yrs--;
      if (g.con.yrs <= 0) {
        const club = S.clubs[g.club];
        if (club.isPlayer && !club.autoManage) GameState.news(`${g.n}'in sözleşmesi sona erdi; serbest gladyatör oldu.`, { p: 1, k: 'transfer' });
        Transfer.record(g, club.id, -1, 0, 'expire');
        Transfer.detach(g);
      }
    }
    await nextTick();
    prog(0.4, 'Gladyatörler yaşlanıyor, emeklilikler');
    // career stats & ageing
    const retirees = [];
    for (const id in S.glads) {
      const g = S.glads[id];
      g.ss = GladiatorGenerator.blankStats();
      if (Progression.ageAndRetire(g)) retirees.push(g);
    }
    for (const g of retirees) {
      const club = g.club >= 0 ? S.clubs[g.club] : null;
      S.hist.retired.push({ id: g.id, n: g.n, cls: g.cls, reg: g.reg, age: g.age, s: S.season, c: club ? club.id : -1, cn: club ? club.n : 'Serbest', peak: Math.round(num(g.peak, g.ovr)), cs: g.cs, aw: g.aw.length, mine: club && club.isPlayer ? 1 : 0 });
      if ((club && club.isPlayer) || g.cs.m > 120 || num(g.peak) >= 78) GameState.news(`Tecrübeli gladyatör ${g.n} (${g.age}) emekliliğini açıkladı${club ? ' — ' + club.n : ''}.`, { p: club && club.isPlayer, k: 'retire' });
      if (club) Transfer.detach(g);
      delete S.glads[g.id];
      delete S.scout[g.id];
    }
    if (S.hist.retired.length > 3000) S.hist.retired.splice(0, S.hist.retired.length - 3000);
    await nextTick();
    prog(0.55, 'Yeni gladyatörler piyasaya çıkıyor');
    // new free gladiators: replace retirees and keep the free pool healthy
    const nNew = Math.max(25, 1430 - Object.keys(S.glads).length);
    for (let i = 0; i < nNew; i++) {
      // ceilings are spread across the whole pyramid so every tier keeps being replenished
      const t = R.weighted([1, 2, 3, 4, 5, 6], x => [0.9, 0.95, 1, 1.05, 1.1, 1.15][x - 1]);
      const young = R.next() < 0.7;
      const pot = TIERS[t].ovr + R.normal(0, 4) + (R.next() < 0.05 ? 5 : 0);
      const gap = young ? R.range(9, 19) : R.range(1, 7);
      const g = GladiatorGenerator.create({ ovr: pot - gap, pot, age: young ? R.int(18, 21) : R.int(22, 28) });
      S.glads[g.id] = g;
    }
    // stale free agents disappear from the circuit (counted as retired)
    for (const g of GameState.freeAgents()) {
      if (g.fw > 60 && g.age > 26) { S.hist.retired.push({ id: g.id, n: g.n, cls: g.cls, reg: g.reg, age: g.age, s: S.season, c: -1, cn: 'Serbest', peak: Math.round(num(g.peak, g.ovr)), cs: g.cs, aw: g.aw.length, mine: 0 }); delete S.glads[g.id]; }
    }
    await nextTick();
    prog(0.7, 'Fikstür ve kupalar hazırlanıyor');
    Rivalry.decay();
    for (const c of S.clubs) {
      c.finHist.push({ s: S.season, inc: c.seasonFin.inc, exp: c.seasonFin.exp, end: Math.round(c.budget) });
      if (c.finHist.length > (c.isPlayer ? 40 : 3)) c.finHist.shift();
      c.seasonFin = Economy.blankFin();
      c.st = { w: 0, l: 0, ko: 0, homeW: 0 };
      c.weekHist = [];
      if (c.loanSeason && c.loanSeason < S.season - 0) { /* one loan per season */ }
    }
    S.season++;
    S.week = 0;
    S.seasonEval = 0;
    S.offers = [];
    S.nego = {};
    S.scoutUsed = 0;
    Leagues.createAllFixtures();
    Cups.createRegionalAll();
    const imp = Cups.createImperial(S.icupQual);
    if (imp) GameState.news(`İmparatorluk Kupası başlıyor! Beş bölgenin şampiyonları ve ikincileri ${S.season}. sezonda Büyük Kolezyum için yarışacak.`, { k: 'cup', p: imp.part.includes(S.player) });
    for (const c of ClubAI.aiClubs()) ClubAI.seasonStart(c);
    if (me && !me.autoManage) { Sponsors.seasonStart(me); Staff.generateCandidates(); me.goal = ClubAI.seasonGoal(me); Squad.fixLineup(me); }
    for (const c of ClubAI.aiClubs()) ClubAI.pickLineup(c);
    Leagues.invalidate();
    GameState.news(`${S.season}. sezon başladı! Sezon öncesi transfer dönemi açık.`, { p: 1, k: 'season' });
    prog(1, 'Hazır');
  }
};
const AWARD_NAMES = { mvp: 'Sezonun Gladyatörü', ko: 'En Çok Eleyen', def: 'En İyi Savunmacı', star: 'Yükselen Yıldız' };

// ---------------------------------------------------------------- weekly flow
const Game = {
  busy: false,
  playerFixture(week = S.week) {
    if (!S || S.player < 0) return null;
    return Calendar.clubFixture(S.player, week);
  },
  pendingPlayerMatch() {
    const f = this.playerFixture();
    return f && !f.m.r ? f : null;
  },
  // processes the current week. The player's own match (if any) must already be recorded.
  async processWeek(onProgress) {
    if (this.busy) return false;
    this.busy = true;
    try {
      const prog = (p, t) => onProgress && onProgress(p, t);
      if (S.week >= SEASON_WEEKS) {
        await Season.transition(onProgress);
        Sanity.check();
        return true;
      }
      const w = S.week;
      const pend = this.pendingPlayerMatch();
      if (pend) MatchSystem.playHeadless(pend.m, pend.comp); // safety net; UI always asks first
      const fx = Calendar.fixturesForWeek(w);
      const matchClubs = new Set();
      for (const f of fx) { matchClubs.add(f.m.h); matchClubs.add(f.m.a); }
      const todo = fx.filter(f => !f.m.r);
      for (let i = 0; i < todo.length; i++) {
        MatchSystem.playHeadless(todo[i].m, todo[i].comp);
        if (i % 10 === 9) { prog(0.05 + 0.6 * i / todo.length, 'Maçlar oynanıyor'); await nextTick(); }
      }
      prog(0.68, 'Kupalar ve puan tabloları');
      for (const cup of Cups.all()) {
        const wk = cup.rounds[cup.cur] && cup.rounds[cup.cur].wk;
        if (wk === w) Cups.advance(cup);
      }
      Leagues.invalidate();
      prog(0.74, 'Haftalık finans');
      const key = S.season * 100 + w;
      if (S.finKey !== key) {
        for (const c of S.clubs) Economy.weekly(c);
        S.finKey = key;
      }
      prog(0.8, 'Kondisyon, sakatlık ve gelişim');
      Progression.weeklyAll(matchClubs);
      await nextTick();
      if (Calendar.isWindow(w)) { prog(0.88, 'Transfer piyasası hareketli'); ClubAI.windowPass(w); }
      else ClubAI.weeklyLineups();
      if (w === 1 || w === 16) Transfer.closeWindow();
      this.contractWarnings(w);
      for (const c of S.clubs) Economy.closeWeek(c);
      S.week = w + 1;
      S.scoutUsed = 0;
      if (S.week === 15) GameState.news('Ara transfer dönemi açıldı (15. ve 16. haftalar).', { p: 1, k: 'transfer' });
      if (S.week === SEASON_WEEKS) Season.endOfSeason();
      const me = GameState.player();
      if (me && !me.autoManage) Squad.fixLineup(me);
      Sanity.check();
      prog(1, 'Hazır');
      return true;
    } finally {
      this.busy = false;
    }
  },
  contractWarnings(w) {
    const me = GameState.player();
    if (!me || me.autoManage || (w !== 20 && w !== 27)) return;
    const exp = GameState.rosterGlads(me).filter(g => g.con && g.con.yrs <= 1);
    if (exp.length) GameState.news(`Sözleşmesi sezon sonunda bitecek gladyatörler: ${exp.map(g => g.n).join(', ')}. Profil ekranından uzatabilirsiniz.`, { p: 1, k: 'transfer' });
  }
};

// ---------------------------------------------------------------- sanity / repair
const Sanity = {
  issues: [],
  check(repair = true) {
    const issues = [];
    const seen = new Set();
    for (const c of S.clubs) {
      c.roster = c.roster.filter(id => {
        const g = S.glads[id];
        const ok = g && g.club === c.id && !seen.has(id);
        if (!ok) issues.push('roster ' + c.id + ' bad ' + id);
        seen.add(id);
        return ok || !repair;
      });
      if (c.roster.length > 5) {
        issues.push('roster>5 ' + c.id);
        if (repair) while (c.roster.length > 5) Transfer.detach(S.glads[c.roster[c.roster.length - 1]]);
      }
      if (!isFinite(c.budget)) { issues.push('budget NaN ' + c.id); c.budget = 0; }
      if (!isFinite(c.rep)) c.rep = 20;
      if (!isFinite(c.arrears) || c.arrears < 0) c.arrears = 0;
      if (!isFinite(c.fans)) c.fans = 300;
      Squad.fixLineup(c);
    }
    for (const id in S.glads) {
      const g = S.glads[id];
      if (g.club >= 0 && (!S.clubs[g.club] || !S.clubs[g.club].roster.includes(g.id))) {
        issues.push('orphan ' + id);
        if (repair) { g.club = -1; g.con = null; }
      }
      for (const k of ['str', 'end', 'agi', 'tec', 'dis', 'cha', 'cond', 'mor', 'ovr', 'pot', 'ppot', 'xp']) {
        if (!isFinite(g[k])) { issues.push('nan ' + k + ' ' + id); g[k] = k === 'xp' ? 0 : 40; }
      }
      if (g.club >= 0 && !g.con) { g.con = { wage: TransferMath.expectedWage(g), yrs: 1, sign: 0, winB: 0, titleB: 0 }; issues.push('nocon ' + id); }
      for (const slot of ['w', 'a', 'x']) {
        const it = S.items[g.eq[slot]];
        if (g.eq[slot] && (!it || it.club !== g.club || it.g !== g.id)) { g.eq[slot] = 0; issues.push('eq ' + id); }
      }
    }
    for (const iid in S.items) {
      const it = S.items[iid];
      if (!S.clubs[it.club]) { delete S.items[iid]; continue; }
      if (it.g && (!S.glads[it.g] || S.glads[it.g].eq[ITEM_TYPES[it.t].slot] !== it.id)) it.g = 0;
    }
    for (const lg of S.leagues) for (const rd of lg.rounds) for (const m of rd) if (!S.clubs[m.h] || !S.clubs[m.a]) issues.push('fixture club missing');
    this.issues = issues;
    return issues;
  }
};

// ---- 08_save.js
/* =========================================================================
   SaveManager — IndexedDB primary, localStorage fallback, JSON import/export
   ========================================================================= */

const SaveManager = {
  DB: 'arena-dominus', STORE: 'saves', db: null, mode: 'none', lastSave: 0, saving: null,
  async init() {
    if (this.mode !== 'none') return this.mode;
    try {
      if (typeof indexedDB === 'undefined') throw new Error('no idb');
      this.db = await new Promise((res, rej) => {
        const rq = indexedDB.open(this.DB, 1);
        rq.onupgradeneeded = () => { rq.result.createObjectStore(this.STORE); };
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
        setTimeout(() => rej(new Error('idb timeout')), 4000);
      });
      this.mode = 'idb';
    } catch (e) {
      try { localStorage.setItem('ad_test', '1'); localStorage.removeItem('ad_test'); this.mode = 'ls'; }
      catch (e2) { this.mode = 'mem'; }
    }
    return this.mode;
  },
  idbGet(key) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(this.STORE, 'readonly');
      const rq = tx.objectStore(this.STORE).get(key);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  },
  idbPutMany(pairs) {
    // single transaction → both records commit atomically
    return new Promise((res, rej) => {
      const tx = this.db.transaction(this.STORE, 'readwrite');
      const st = tx.objectStore(this.STORE);
      for (const [k, v] of pairs) st.put(v, k);
      tx.oncomplete = () => res(true);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  },
  mem: {},
  serialize() {
    GameState.syncRng();
    S.savedAt = Date.now();
    S.gv = GAME_VERSION;
    // caches are not persisted
    return JSON.stringify(S, (k, v) => (k === 'tableCache' ? undefined : v));
  },
  async save() {
    if (!S) return false;
    await this.init();
    const json = this.serialize();
    const meta = JSON.stringify({ v: SAVE_VERSION, s: S.season, w: S.week, club: GameState.player() ? GameState.player().n : '-', at: S.savedAt });
    try {
      if (this.mode === 'idb') {
        const prev = await this.idbGet('main').catch(() => null);
        const pairs = [['main', json], ['meta', meta]];
        if (prev) pairs.push(['backup', prev]);
        await this.idbPutMany(pairs);
      } else if (this.mode === 'ls') {
        try { const prev = localStorage.getItem('ad_main'); if (prev) localStorage.setItem('ad_backup', prev); } catch (e) { try { localStorage.removeItem('ad_backup'); } catch (_) { } }
        localStorage.setItem('ad_main', json);
        localStorage.setItem('ad_meta', meta);
      } else { this.mem.main = json; this.mem.meta = meta; }
      this.lastSave = Date.now();
      return true;
    } catch (e) {
      console.error('save failed', e);
      return false;
    }
  },
  async meta() {
    await this.init();
    try {
      let m = null;
      if (this.mode === 'idb') m = await this.idbGet('meta');
      else if (this.mode === 'ls') m = localStorage.getItem('ad_meta');
      else m = this.mem.meta;
      return m ? JSON.parse(m) : null;
    } catch (e) { return null; }
  },
  async loadRaw(key = 'main') {
    await this.init();
    if (this.mode === 'idb') return await this.idbGet(key);
    if (this.mode === 'ls') return localStorage.getItem('ad_' + key);
    return this.mem[key];
  },
  async load() {
    for (const key of ['main', 'backup']) {
      try {
        const raw = await this.loadRaw(key);
        if (!raw) continue;
        const r = this.apply(raw);
        if (r.ok) return { ok: true, from: key };
      } catch (e) { console.warn('load failed', key, e); }
    }
    return { ok: false };
  },
  validate(obj) {
    if (!obj || typeof obj !== 'object') return 'Dosya geçerli bir kayıt değil.';
    if (obj.v == null || obj.v > SAVE_VERSION) return 'Kayıt sürümü desteklenmiyor.';
    if (!Array.isArray(obj.clubs) || obj.clubs.length !== 240) return 'Kulüp verisi eksik ya da bozuk.';
    if (!obj.glads || typeof obj.glads !== 'object') return 'Gladyatör verisi eksik.';
    if (!Array.isArray(obj.leagues) || obj.leagues.length !== 30) return 'Lig verisi eksik ya da bozuk.';
    if (!(obj.season >= 1) || !(obj.week >= 0 && obj.week <= SEASON_WEEKS)) return 'Sezon bilgisi bozuk.';
    if (!(obj.player >= 0 && obj.player < 240)) return 'Oyuncu kulübü bulunamadı.';
    if (!Array.isArray(obj.rng) || obj.rng.length !== 4) return 'Rastgelelik durumu bozuk.';
    const ids = new Set();
    for (const c of obj.clubs) {
      if (!c || typeof c.id !== 'number' || ids.has(c.id) || !Array.isArray(c.roster) || !c.fac || !c.staff) return 'Kulüp kaydı bozuk.';
      ids.add(c.id);
      if (c.roster.length > 5) return 'Kadro sınırı aşılmış bir kulüp var.';
    }
    for (const lg of obj.leagues) {
      if (!lg || !Array.isArray(lg.clubs) || lg.clubs.length !== 8 || !Array.isArray(lg.rounds) || lg.rounds.length !== 14) return 'Lig fikstürü bozuk.';
    }
    for (const id in obj.glads) { const g = obj.glads[id]; if (!g || !CLASSES[g.cls] || typeof g.id !== 'number') return 'Gladyatör kaydı bozuk.'; }
    return null;
  },
  apply(raw) {
    let obj;
    try { obj = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { return { ok: false, msg: 'JSON okunamadı.' }; }
    const err = this.validate(obj);
    if (err) return { ok: false, msg: err };
    const prevS = S, prevR = R;
    try {
      S = obj;
      R = new RNG(S.rng);
      this.migrate(S);
      Leagues.invalidate();
      Sanity.check(true);
      return { ok: true };
    } catch (e) {
      S = prevS; R = prevR;
      return { ok: false, msg: 'Kayıt yüklenirken hata: ' + e.message };
    }
  },
  migrate(s) {
    s.flags = s.flags || { tut: 0, done: {} };
    s.settings = s.settings || { sound: true };
    s.hist = s.hist || { seasons: [], retired: [], records: {}, champs: [] };
    s.hist.champs = s.hist.champs || [];
    s.offers = s.offers || []; s.nego = s.nego || {}; s.scout = s.scout || {};
    s.nid = s.nid || { g: 1, i: 1, o: 1 };
    for (const c of s.clubs) { c.weekFin = c.weekFin || Economy.blankFin(); c.seasonFin = c.seasonFin || Economy.blankFin(); c.finHist = c.finHist || []; c.riv = c.riv || {}; c.trophies = c.trophies || []; c.hist = c.hist || []; c.st = c.st || { w: 0, l: 0, ko: 0, homeW: 0 }; }
  },
  exportFile() {
    const json = this.serialize();
    const me = GameState.player();
    const name = 'arena-dominus-' + (me ? me.n.replace(/[^a-z0-9]+/gi, '-').toLowerCase() : 'kayit') + '-s' + S.season + 'h' + S.week + '.json';
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    return name;
  },
  async importText(text) {
    const r = this.apply(text);
    if (r.ok) await this.save();
    return r;
  },
  async wipe() {
    await this.init();
    try {
      if (this.mode === 'idb') await this.idbPutMany([['main', null], ['meta', null]]);
      else if (this.mode === 'ls') { localStorage.removeItem('ad_main'); localStorage.removeItem('ad_meta'); }
      else this.mem = {};
    } catch (e) { }
  }
};

// ---- 09_art.js
/* =========================================================================
   Renderer (art): procedural gladiators (arena + portrait from the same
   definition), crests, region symbols, icons, facility illustrations.
   ========================================================================= */

const Art = {
  SKIN: ['#f0cfae', '#e1b38c', '#c88e64', '#a66c45', '#7b4a2d', '#54321f'],
  HAIR: ['#1c1511', '#3a2517', '#6a4224', '#8b3c1c', '#c6a05a', '#a39f98'],
  PLUME: ['#b3261e', '#e3c15f', '#2d5f8e', '#ece6da', '#2b7a4f'],
  METAL: [
    { m: '#8f8a82', l: '#c9c4ba', d: '#57534d' },   // iron (default / common)
    { m: '#a3a7ab', l: '#e1e4e6', d: '#5f6367' },   // steel (quality)
    { m: '#8aa0b8', l: '#d4e1ee', d: '#4c5d70' },   // blued steel (masterwork)
    { m: '#9c8ab4', l: '#ddd2ea', d: '#5c4c70' },   // rare alloy
    { m: '#c9a43c', l: '#f6e39a', d: '#7d6218' }    // gilded (legendary)
  ],
  BRONZE: { m: '#b07a3a', l: '#e2b56f', d: '#6b4520' },
  shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    if (f < 0) { r *= 1 + f; g *= 1 + f; b *= 1 + f; } else { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
    return '#' + ((1 << 24) | (Math.round(r) << 16) | (Math.round(g) << 8) | Math.round(b)).toString(16).slice(1);
  },
  kitOf(g, colors) {
    const it = slot => { const i = S && g.eq ? S.items[g.eq[slot]] : null; return i || null; };
    const w = it('w'), a = it('a'), x = it('x');
    const club = S && g.club >= 0 ? S.clubs[g.club] : null;
    const cols = colors || (club ? [club.crest.c1, club.crest.c2] : ['#6b5a45', '#a8956f']);
    return {
      c1: cols[0], c2: cols[1],
      wq: w ? w.q : 0, wt: w ? w.t : null,
      aq: a ? a.q : -1, at: a ? a.t : null,
      xq: x ? x.q : 0, xt: x ? x.t : null
    };
  },

  // ------------------------------------------------------------ arena figure
  limb(ctx, x1, y1, x2, y2, w, col, out) {
    ctx.lineCap = 'round';
    ctx.strokeStyle = out; ctx.lineWidth = w + 2.2;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  },
  ik(hx, hy, fx, fy, L, face) {
    // two-bone IK, knee bends forward
    let dx = fx - hx, dy = fy - hy;
    let d = Math.sqrt(dx * dx + dy * dy);
    const max = L * 2 - 0.01;
    if (d > max) { fx = hx + dx / d * max; fy = hy + dy / d * max; dx = fx - hx; dy = fy - hy; d = max; }
    const a = Math.atan2(dy, dx);
    const b = Math.acos(clamp(d / (2 * L), -1, 1));
    const ang = a - b * face;
    return { kx: hx + Math.cos(ang) * L, ky: hy + Math.sin(ang) * L, fx, fy };
  },
  armPts(sx, sy, up, fore, L1, L2) {
    const ex = sx + Math.sin(up) * L1, ey = sy + Math.cos(up) * L1;
    const hx = ex + Math.sin(fore) * L2, hy = ey + Math.cos(fore) * L2;
    return { ex, ey, hx, hy };
  },
  // draws a figure with feet at (0,0), height ~100 units, facing +x. pose: see Battle.pose
  figure(ctx, look, cls, kit, P) {
    const skin = this.SKIN[look.sk] || this.SKIN[2];
    const skinD = this.shade(skin, -0.32), skinL = this.shade(skin, 0.15);
    const out = 'rgba(25,16,10,0.85)';
    const bw = look.bw || 1;
    const met = this.METAL[clamp(kit.wq, 0, 4)];
    const amet = this.METAL[clamp(kit.xq, 0, 4)];
    ctx.save();
    if (P.fall > 0) { ctx.rotate(-P.fall * 1.45); ctx.translate(-P.fall * 8, 0); }
    const crouch = P.crouch || 0;
    const hipX = P.hipX || 0, hipY = -47 + crouch * 9 + (P.bob || 0);
    const lean = P.lean || 0;
    const neckX = hipX + Math.sin(lean) * 29, neckY = hipY - Math.cos(lean) * 29;
    const headX = neckX + Math.sin(lean + (P.head || 0)) * 9, headY = neckY - Math.cos(lean + (P.head || 0)) * 9;
    const shF = { x: neckX + 2.5 * bw, y: neckY + 3 }, shB = { x: neckX - 3.5 * bw, y: neckY + 2.5 };
