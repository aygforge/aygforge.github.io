/* =========================================================================
   Season lifecycle, awards, history, weekly processing (Game) and sanity guards
   ========================================================================= */

const Season = {
  onCupChampion(cup) {
    const C = S.clubs[cup.champ], RU = S.clubs[cup.runner];
    if (!C) return;
    const imp = cup.key === 'imp';
    if (RU) Economy.credit(RU, 'prizes', imp ? ECON.icupFinalLoser : ECON.rcupFinalLoser * Math.pow(tierEco(RU.tier), 0.7));
    C.trophies.push({ s: S.season, t: bi(() => Cups.nameOf(cup)) });
    C.rep = r1(clamp(C.rep + (imp ? 8 : 5), 1, 99));
    C.fans = Math.round(C.fans * (imp ? 1.08 : 1.05));
    if (RU) Rivalry.add(C.id, RU.id, 10);
    this.payTitleBonus(C);
    for (const gid of C.roster) { const g = S.glads[gid]; if (g) g.aw.push({ s: S.season, t: bi(() => tx(Cups.nameOf(cup) + ' Şampiyonu', Cups.nameOf(cup) + ' Champion')) }); }
    GameState.news(() => tx(`${Cups.nameOf(cup)} şampiyonu ${cn(C)} oldu! Finalde ${RU ? cn(RU) : '-'} yenildi.`, `${cn(C)} won the ${Cups.nameOf(cup)}! ${RU ? cn(RU) : '-'} were beaten in the final.`), { p: C.isPlayer || (RU && RU.isPlayer), k: 'cup' });
    S.hist.champs.push({ s: S.season, k: cup.key, c: C.id, cn: C.n, r: RU ? RU.id : -1, rn: RU ? RU.n : '' });
  },
  payTitleBonus(club) {
    for (const g of GameState.rosterGlads(club)) if (g.con && g.con.titleB > 0) Economy.debit(club, 'bonuses', g.con.titleB, true);
  },
  // runs once when week 29 is processed → week 30 (season evaluation)
  endOfSeason() {
    if (S.seasonEval === S.season) return;
    S.seasonEval = S.season;
    Leagues.invalidate();
    const rec = { s: S.season, leagues: [], cups: [], awards: {}, player: null };
    const qual = [];
    for (const lg of S.leagues) {
      const t = Leagues.table(lg);
      t.forEach(r => {
        const c = S.clubs[r.cid];
        Economy.credit(c, 'prizes', ECON.rankPrize[r.rank] * tierEco(lg.tier));
      });
      const champ = S.clubs[t[0].cid];
      champ.trophies.push({ s: S.season, t: bi(() => TIERS[lg.tier].n + ' (' + REGION_BY_ID[lg.reg].name + ')') });
      this.payTitleBonus(champ);
      for (const gid of champ.roster) { const g = S.glads[gid]; if (g) g.aw.push({ s: S.season, t: bi(() => tx(TIERS[lg.tier].s + ' Şampiyonu', TIERS[lg.tier].s + ' Champion')) }); }
      if (t[1]) Rivalry.add(t[0].cid, t[1].cid, 8);
      rec.leagues.push({ id: lg.id, c: t[0].cid, cn: champ.n, r: t[1].cid, rn: S.clubs[t[1].cid].n });
      rec.awards[lg.id] = this.awards(lg, t[0].cid);
      if (lg.tier === 1) {
        GameState.news(() => tx(`${REGION_BY_ID[lg.reg].name} Altın Kolezyum şampiyonu belli oldu: ${cn(champ)}!`, `${cn(champ)} are the ${REGION_BY_ID[lg.reg].name} Golden Colosseum champions!`), { k: 'league', p: champ.isPlayer });
        qual.push({ cid: t[0].cid, rank: 1, pts: t[0].pts, kd: t[0].kf - t[0].ka }, { cid: t[1].cid, rank: 2, pts: t[1].pts, kd: t[1].kf - t[1].ka });
      }
      for (const r of t) {
        const c = S.clubs[r.cid];
        c.hist.push({ s: S.season, tier: lg.tier, rank: r.rank, pts: r.pts, w: r.w, l: r.l });
        if (c.hist.length > 40) c.hist.shift();
        const promoted = lg.tier > 1 && r.rank <= 2, relegated = lg.tier < 6 && r.rank >= 7;
        Reputation.seasonEnd(c, r.rank, promoted, relegated);
        c.endRank = r.rank;
      }
    }
    S.icupQual = qual;
    for (const cup of Cups.all()) rec.cups.push({ k: cup.key, c: cup.champ, cn: cup.champ >= 0 ? S.clubs[cup.champ].n : '-' });
    const me = GameState.player();
    if (me) {
      const lg = S.leagues[me.lg];
      const row = Leagues.table(lg).find(r => r.cid === me.id);
      const rr = Cups.roundReached(S.rcups[me.reg], me.id);
      rec.player = {
        c: me.id, n: me.n, tier: me.tier, reg: me.reg, rank: row.rank, pts: row.pts, w: row.w, l: row.l,
        cup: bi(() => rr >= RCUP_ROUNDS.length ? tx('Şampiyon', 'Champions') : rr >= 0 ? RCUP_ROUNDS[rr] : '-'),
        imp: S.icup && S.icup.part.includes(me.id) ? bi(() => S.icup.champ === me.id ? tx('Şampiyon', 'Champions') : (ICUP_ROUNDS[Math.min(ICUP_ROUNDS.length - 1, Cups.roundReached(S.icup, me.id))] || '-')) : null,
        fin: Math.round(me.budget)
      };
      if (!me.autoManage) Sponsors.seasonEnd(me);
      const myAw = rec.awards[me.lg];
      for (const k of ['mvp', 'ko', 'def', 'star']) if (myAw[k] && myAw[k].cid === me.id) GameState.news(() => tx(`${cn(myAw[k])} ${AWARD_NAMES[k]} ödülünü kazandı!`, `${cn(myAw[k])} won the ${AWARD_NAMES[k]} award!`), { p: 1, k: 'award' });
    }
    // records
    const R0 = S.hist.records;
    for (const id in S.glads) {
      const g = S.glads[id];
      if (g.ss.ko > 0 && (!R0.koSeason || g.ss.ko > R0.koSeason.v)) R0.koSeason = { v: g.ss.ko, n: g.n, g: g.id, s: S.season };
      if (!R0.topOvr || g.ovr > R0.topOvr.v) R0.topOvr = { v: Math.round(g.ovr), n: g.n, g: g.id, s: S.season };
    }
    S.hist.seasons.push(rec);
    if (S.hist.seasons.length > 60) S.hist.seasons.shift();
    GameState.news(() => tx(`${S.season}. sezon sona erdi. Sezon değerlendirmesini inceleyin; ilerlediğinizde yeni sezon başlayacak.`, `Season ${S.season} is over. Review the season summary; when you advance, the new season begins.`), { p: 1, k: 'season' });
  },
  awards(lg, champCid) {
    const pool = [];
    for (const cid of lg.clubs) for (const gid of S.clubs[cid].roster) { const g = S.glads[gid]; if (g && g.ss.m >= 4) pool.push({ g, cid }); }
    const score = g => g.ss.w * 3 + g.ss.ko * 4 + g.ss.dmg / 40 + g.ss.sv * 2 + g.ss.blk * 0.3;
    const pickMax = (arr, f) => arr.reduce((b, x) => (b == null || f(x) > f(b)) ? x : b, null);
    const out = { champ: champCid };
    const mk = (x, v) => x ? { gid: x.g.id, n: x.g.n, cid: x.cid, v } : null;
    const mvp = pickMax(pool, x => score(x.g) + x.g.id * 1e-9);
    out.mvp = mk(mvp, mvp && Math.round(score(mvp.g)));
    const ko = pickMax(pool, x => x.g.ss.ko * 1000 + x.g.ss.dmg / 100);
    out.ko = mk(ko, ko && ko.g.ss.ko);
    const defPool = pool.filter(x => x.g.ss.m >= 6);
    const df = pickMax(defPool, x => -(x.g.ss.tk / x.g.ss.m) + x.g.ss.sv * 0.01);
    out.def = mk(df, df && Math.round(df.g.ss.tk / df.g.ss.m));
    const star = pickMax(pool.filter(x => x.g.age <= 22), x => score(x.g));
    out.star = mk(star, star && Math.round(score(star.g)));
    for (const k of ['mvp', 'ko', 'def', 'star']) if (out[k]) S.glads[out[k].gid].aw.push({ s: S.season, t: bi(() => AWARD_NAMES[k] + ' (' + TIERS[lg.tier].s + ')') });
    return out;
  },
  // runs when the player advances from week 30: the new season is generated
  async transition(onProgress) {
    const prog = (p, t) => onProgress && onProgress(p, t);
    prog(0.05, tx('Yükselen ve düşen kulüpler belirleniyor', 'Settling promotion and relegation'));
    // promotion / relegation (all regions, same calendar)
    for (let ri = 0; ri < REGIONS.length; ri++) {
      const tables = [];
      for (let t = 1; t <= 6; t++) tables[t] = Leagues.table(S.leagues[GameState.leagueIndex(ri, t)]).map(r => r.cid);
      for (let t = 1; t <= 5; t++) {
        const upper = S.leagues[GameState.leagueIndex(ri, t)], lower = S.leagues[GameState.leagueIndex(ri, t + 1)];
        const down = tables[t].slice(6), up = tables[t + 1].slice(0, 2);
        upper.clubs = upper.clubs.filter(c => !down.includes(c)).concat(up);
        lower.clubs = lower.clubs.filter(c => !up.includes(c)).concat(down);
        for (const c of up) { const C = S.clubs[c]; C.tier = t; C.lg = upper.id; GameState.news(() => tx(`${cn(C)} ${TIERS[t].n}'ne yükseldi!`, `${cn(C)} have been promoted to the ${TIERS[t].n}!`), { p: C.isPlayer, k: 'league' }); }
        for (const c of down) { const C = S.clubs[c]; C.tier = t + 1; C.lg = lower.id; if (C.isPlayer) GameState.news(() => tx(`${cn(C)} ${TIERS[t + 1].n}'ne düştü.`, `${cn(C)} have been relegated to the ${TIERS[t + 1].n}.`), { p: 1, k: 'league' }); }
      }
    }
    await nextTick();
    prog(0.25, tx('Sözleşmeler güncelleniyor', 'Updating contracts'));
    for (const c of ClubAI.aiClubs()) ClubAI.renewals(c);
    const me = GameState.player();
    for (const id in S.glads) {
      const g = S.glads[id];
      if (!g.con) continue;
      g.con.yrs--;
      if (g.con.yrs <= 0) {
        const club = S.clubs[g.club];
        if (club.isPlayer && !club.autoManage) GameState.news(() => tx(`${cn(g)}'in sözleşmesi sona erdi; serbest gladyatör oldu.`, `${cn(g)}'s contract expired; he is now a free agent.`), { p: 1, k: 'transfer' });
        Transfer.record(g, club.id, -1, 0, 'expire');
        Transfer.detach(g);
      }
    }
    await nextTick();
    prog(0.4, tx('Gladyatörler yaşlanıyor, emeklilikler', 'Ageing and retirements'));
    // career stats & ageing
    const retirees = [];
    for (const id in S.glads) {
      const g = S.glads[id];
      g.ss = GladiatorGenerator.blankStats();
      if (Progression.ageAndRetire(g)) retirees.push(g);
    }
    for (const g of retirees) {
      const club = g.club >= 0 ? S.clubs[g.club] : null;
      S.hist.retired.push({ id: g.id, n: g.n, cls: g.cls, reg: g.reg, age: g.age, s: S.season, c: club ? club.id : -1, cn: club ? club.n : 'Serbest', peak: Math.round(num(g.peak, g.ovr)), cs: g.cs, aw: g.aw.length, mine: club && club.isPlayer ? 1 : 0 });
      if ((club && club.isPlayer) || g.cs.m > 120 || num(g.peak) >= 78) GameState.news(() => tx(`Tecrübeli gladyatör ${cn(g)} (${g.age}) emekliliğini açıkladı${club ? ' — ' + cn(club) : ''}.`, `Veteran gladiator ${cn(g)} (${g.age}) has announced his retirement${club ? ' — ' + cn(club) : ''}.`), { p: club && club.isPlayer, k: 'retire' });
      if (club) Transfer.detach(g);
      delete S.glads[g.id];
      delete S.scout[g.id];
    }
    if (S.hist.retired.length > 3000) S.hist.retired.splice(0, S.hist.retired.length - 3000);
    await nextTick();
    prog(0.55, tx('Yeni gladyatörler piyasaya çıkıyor', 'New gladiators enter the market'));
    // new free gladiators: replace retirees and keep the free pool healthy
    const nNew = Math.max(25, 1430 - Object.keys(S.glads).length);
    for (let i = 0; i < nNew; i++) {
      // ceilings are spread across the whole pyramid so every tier keeps being replenished
      const t = R.weighted([1, 2, 3, 4, 5, 6], x => [0.9, 0.95, 1, 1.05, 1.1, 1.15][x - 1]);
      const young = R.next() < 0.7;
      const pot = TIERS[t].ovr + R.normal(0, 4) + (R.next() < 0.05 ? 5 : 0);
      const gap = young ? R.range(9, 19) : R.range(1, 7);
      const g = GladiatorGenerator.create({ ovr: pot - gap, pot, age: young ? R.int(18, 21) : R.int(22, 28) });
      S.glads[g.id] = g;
    }
    // stale free agents disappear from the circuit (counted as retired)
    for (const g of GameState.freeAgents()) {
      if (g.fw > 60 && g.age > 26) { S.hist.retired.push({ id: g.id, n: g.n, cls: g.cls, reg: g.reg, age: g.age, s: S.season, c: -1, cn: 'Serbest', peak: Math.round(num(g.peak, g.ovr)), cs: g.cs, aw: g.aw.length, mine: 0 }); delete S.glads[g.id]; }
    }
    await nextTick();
    prog(0.7, tx('Fikstür ve kupalar hazırlanıyor', 'Preparing fixtures and cups'));
    Rivalry.decay();
    for (const c of S.clubs) {
      c.finHist.push({ s: S.season, inc: c.seasonFin.inc, exp: c.seasonFin.exp, end: Math.round(c.budget) });
      if (c.finHist.length > (c.isPlayer ? 40 : 3)) c.finHist.shift();
      c.seasonFin = Economy.blankFin();
      c.st = { w: 0, l: 0, ko: 0, homeW: 0 };
      c.weekHist = [];
      if (c.loanSeason && c.loanSeason < S.season - 0) { /* one loan per season */ }
    }
    S.season++;
    S.week = 0;
    S.seasonEval = 0;
    S.offers = [];
    S.nego = {};
    S.scoutUsed = 0;
    Leagues.createAllFixtures();
    Cups.createRegionalAll();
    const imp = Cups.createImperial(S.icupQual);
    if (imp) GameState.news(() => tx(`İmparatorluk Kupası başlıyor! Beş bölgenin şampiyonları ve ikincileri ${S.season}. sezonda Büyük Kolezyum için yarışacak.`, `The Imperial Cup begins! The champions and runners-up of the five regions will fight for the Grand Colosseum in season ${S.season}.`), { k: 'cup', p: imp.part.includes(S.player) });
    for (const c of ClubAI.aiClubs()) ClubAI.seasonStart(c);
    if (me && !me.autoManage) { Sponsors.seasonStart(me); Staff.generateCandidates(); me.goal = ClubAI.seasonGoal(me); Squad.fixLineup(me); }
    for (const c of ClubAI.aiClubs()) ClubAI.pickLineup(c);
    Leagues.invalidate();
    GameState.news(() => tx(`${S.season}. sezon başladı! Sezon öncesi transfer dönemi açık.`, `Season ${S.season} has begun! The pre-season transfer window is open.`), { p: 1, k: 'season' });
    prog(1, tx('Hazır', 'Ready'));
  }
};
const AWARD_NAMES = { get mvp() { return tx('Sezonun Gladyatörü', 'Gladiator of the Season'); }, get ko() { return tx('En Çok Eleyen', 'Top Eliminator'); }, get def() { return tx('En İyi Savunmacı', 'Best Defender'); }, get star() { return tx('Yükselen Yıldız', 'Rising Star'); } };

// ---------------------------------------------------------------- weekly flow
const Game = {
  busy: false,
  playerFixture(week = S.week) {
    if (!S || S.player < 0) return null;
    return Calendar.clubFixture(S.player, week);
  },
  pendingPlayerMatch() {
    const f = this.playerFixture();
    return f && !f.m.r ? f : null;
  },
  // processes the current week. The player's own match (if any) must already be recorded.
  async processWeek(onProgress) {
    if (this.busy) return false;
    this.busy = true;
    try {
      const prog = (p, t) => onProgress && onProgress(p, t);
      if (S.week >= SEASON_WEEKS) {
        await Season.transition(onProgress);
        Sanity.check();
        return true;
      }
      const w = S.week;
      const pend = this.pendingPlayerMatch();
      if (pend) MatchSystem.playHeadless(pend.m, pend.comp); // safety net; UI always asks first
      const fx = Calendar.fixturesForWeek(w);
      const matchClubs = new Set();
      for (const f of fx) { matchClubs.add(f.m.h); matchClubs.add(f.m.a); }
      const todo = fx.filter(f => !f.m.r);
      for (let i = 0; i < todo.length; i++) {
        MatchSystem.playHeadless(todo[i].m, todo[i].comp);
        if (i % 10 === 9) { prog(0.05 + 0.6 * i / todo.length, tx('Maçlar oynanıyor', 'Playing matches')); await nextTick(); }
      }
      prog(0.68, tx('Kupalar ve puan tabloları', 'Cups and league tables'));
      for (const cup of Cups.all()) {
        const wk = cup.rounds[cup.cur] && cup.rounds[cup.cur].wk;
        if (wk === w) Cups.advance(cup);
      }
      Leagues.invalidate();
      prog(0.74, tx('Haftalık finans', 'Weekly finances'));
      const key = S.season * 100 + w;
      if (S.finKey !== key) {
        for (const c of S.clubs) Economy.weekly(c);
        S.finKey = key;
      }
      prog(0.8, tx('Kondisyon, sakatlık ve gelişim', 'Condition, injuries and development'));
      Progression.weeklyAll(matchClubs);
      await nextTick();
      if (Calendar.isWindow(w)) { prog(0.88, tx('Transfer piyasası hareketli', 'The transfer market is busy')); ClubAI.windowPass(w); }
      else ClubAI.weeklyLineups();
      if (w === 1 || w === 16) Transfer.closeWindow();
      this.contractWarnings(w);
      for (const c of S.clubs) Economy.closeWeek(c);
      S.week = w + 1;
      S.scoutUsed = 0;
      if (S.week === 15) GameState.news(() => tx('Ara transfer dönemi açıldı (15. ve 16. haftalar).', 'The mid-season transfer window is open (weeks 15 and 16).'), { p: 1, k: 'transfer' });
      if (S.week === SEASON_WEEKS) Season.endOfSeason();
      const me = GameState.player();
      if (me && !me.autoManage) Squad.fixLineup(me);
      Sanity.check();
      prog(1, tx('Hazır', 'Ready'));
      return true;
    } finally {
      this.busy = false;
    }
  },
  contractWarnings(w) {
    const me = GameState.player();
    if (!me || me.autoManage || (w !== 20 && w !== 27)) return;
    const exp = GameState.rosterGlads(me).filter(g => g.con && g.con.yrs <= 1);
    if (exp.length) GameState.news(() => tx(`Sözleşmesi sezon sonunda bitecek gladyatörler: ${exp.map(g => cn(g)).join(', ')}. Profil ekranından uzatabilirsiniz.`, `Contracts expiring at the end of the season: ${exp.map(g => cn(g)).join(', ')}. Extend them from the profile screen.`), { p: 1, k: 'transfer' });
  }
};

// ---------------------------------------------------------------- sanity / repair
const Sanity = {
  issues: [],
  check(repair = true) {
    const issues = [];
    const seen = new Set();
    for (const c of S.clubs) {
      c.roster = c.roster.filter(id => {
        const g = S.glads[id];
        const ok = g && g.club === c.id && !seen.has(id);
        if (!ok) issues.push('roster ' + c.id + ' bad ' + id);
        seen.add(id);
        return ok || !repair;
      });
      if (c.roster.length > 5) {
        issues.push('roster>5 ' + c.id);
        if (repair) while (c.roster.length > 5) Transfer.detach(S.glads[c.roster[c.roster.length - 1]]);
      }
      if (!isFinite(c.budget)) { issues.push('budget NaN ' + c.id); c.budget = 0; }
      if (!isFinite(c.rep)) c.rep = 20;
      if (!isFinite(c.arrears) || c.arrears < 0) c.arrears = 0;
      if (!isFinite(c.fans)) c.fans = 300;
      Squad.fixLineup(c);
    }
    for (const id in S.glads) {
      const g = S.glads[id];
      if (g.club >= 0 && (!S.clubs[g.club] || !S.clubs[g.club].roster.includes(g.id))) {
        issues.push('orphan ' + id);
        if (repair) { g.club = -1; g.con = null; }
      }
      for (const k of ['str', 'end', 'agi', 'tec', 'dis', 'cha', 'cond', 'mor', 'ovr', 'pot', 'ppot', 'xp']) {
        if (!isFinite(g[k])) { issues.push('nan ' + k + ' ' + id); g[k] = k === 'xp' ? 0 : 40; }
      }
      if (g.club >= 0 && !g.con) { g.con = { wage: TransferMath.expectedWage(g), yrs: 1, sign: 0, winB: 0, titleB: 0 }; issues.push('nocon ' + id); }
      for (const slot of ['w', 'a', 'x']) {
        const it = S.items[g.eq[slot]];
        if (g.eq[slot] && (!it || it.club !== g.club || it.g !== g.id)) { g.eq[slot] = 0; issues.push('eq ' + id); }
      }
    }
    for (const iid in S.items) {
      const it = S.items[iid];
      if (!S.clubs[it.club]) { delete S.items[iid]; continue; }
      if (it.g && (!S.glads[it.g] || S.glads[it.g].eq[ITEM_TYPES[it.t].slot] !== it.id)) it.g = 0;
    }
    for (const lg of S.leagues) for (const rd of lg.rounds) for (const m of rd) if (!S.clubs[m.h] || !S.clubs[m.a]) issues.push('fixture club missing');
    this.issues = issues;
    return issues;
  }
};

// ---- 08_save.js
/* =========================================================================
   SaveManager — IndexedDB primary, localStorage fallback, JSON import/export
   ========================================================================= */

const SaveManager = {
  DB: 'arena-dominus', STORE: 'saves', db: null, mode: 'none', lastSave: 0, saving: null,
  async init() {
    if (this.mode !== 'none') return this.mode;
    try {
      if (typeof indexedDB === 'undefined') throw new Error('no idb');
      this.db = await new Promise((res, rej) => {
        const rq = indexedDB.open(this.DB, 1);
        rq.onupgradeneeded = () => { rq.result.createObjectStore(this.STORE); };
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
        setTimeout(() => rej(new Error('idb timeout')), 4000);
      });
      this.mode = 'idb';
    } catch (e) {
      try { localStorage.setItem('ad_test', '1'); localStorage.removeItem('ad_test'); this.mode = 'ls'; }
      catch (e2) { this.mode = 'mem'; }
    }
    return this.mode;
  },
  idbGet(key) {
    return new Promise((res, rej) => {
      const trn = this.db.transaction(this.STORE, 'readonly');
      const rq = trn.objectStore(this.STORE).get(key);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
  },
  idbPutMany(pairs) {
    // single transaction → both records commit atomically
    return new Promise((res, rej) => {
      const trn = this.db.transaction(this.STORE, 'readwrite');
      const st = trn.objectStore(this.STORE);
      for (const [k, v] of pairs) st.put(v, k);
      trn.oncomplete = () => res(true);
      trn.onerror = () => rej(trn.error);
      trn.onabort = () => rej(trn.error);
    });
  },
  mem: {},
  serialize() {
    GameState.syncRng();
    S.savedAt = Date.now();
    S.gv = GAME_VERSION;
    // caches are not persisted
    return JSON.stringify(S, (k, v) => (k === 'tableCache' ? undefined : v));
  },
  async save() {
    if (!S) return false;
    await this.init();
    const json = this.serialize();
    const meta = JSON.stringify({ v: SAVE_VERSION, s: S.season, w: S.week, club: GameState.player() ? GameState.player().n : '-', at: S.savedAt });
    try {
      if (this.mode === 'idb') {
        const prev = await this.idbGet('main').catch(() => null);
        const pairs = [['main', json], ['meta', meta]];
        if (prev) pairs.push(['backup', prev]);
        await this.idbPutMany(pairs);
      } else if (this.mode === 'ls') {
        try { const prev = localStorage.getItem('ad_main'); if (prev) localStorage.setItem('ad_backup', prev); } catch (e) { try { localStorage.removeItem('ad_backup'); } catch (_) { } }
        localStorage.setItem('ad_main', json);
        localStorage.setItem('ad_meta', meta);
      } else { this.mem.main = json; this.mem.meta = meta; }
      this.lastSave = Date.now();
      return true;
    } catch (e) {
      console.error('save failed', e);
      return false;
    }
  },
  async meta() {
    await this.init();
    try {
      let m = null;
      if (this.mode === 'idb') m = await this.idbGet('meta');
      else if (this.mode === 'ls') m = localStorage.getItem('ad_meta');
      else m = this.mem.meta;
      return m ? JSON.parse(m) : null;
    } catch (e) { return null; }
  },
  async loadRaw(key = 'main') {
    await this.init();
    if (this.mode === 'idb') return await this.idbGet(key);
    if (this.mode === 'ls') return localStorage.getItem('ad_' + key);
    return this.mem[key];
  },
  async load() {
    for (const key of ['main', 'backup']) {
      try {
        const raw = await this.loadRaw(key);
        if (!raw) continue;
        const r = this.apply(raw);
        if (r.ok) return { ok: true, from: key };
      } catch (e) { console.warn('load failed', key, e); }
    }
    return { ok: false };
  },
  validate(obj) {
    if (!obj || typeof obj !== 'object') return tx('Dosya geçerli bir kayıt değil.', 'The file is not a valid save.');
    if (obj.v == null || obj.v > SAVE_VERSION) return tx('Kayıt sürümü desteklenmiyor.', 'Save version not supported.');
    if (!Array.isArray(obj.clubs) || obj.clubs.length !== 240) return tx('Kulüp verisi eksik ya da bozuk.', 'Club data is missing or corrupt.');
    if (!obj.glads || typeof obj.glads !== 'object') return tx('Gladyatör verisi eksik.', 'Gladiator data is missing.');
    if (!Array.isArray(obj.leagues) || obj.leagues.length !== 30) return tx('Lig verisi eksik ya da bozuk.', 'League data is missing or corrupt.');
    if (!(obj.season >= 1) || !(obj.week >= 0 && obj.week <= SEASON_WEEKS)) return tx('Sezon bilgisi bozuk.', 'Season data is corrupt.');
    if (!(obj.player >= 0 && obj.player < 240)) return tx('Oyuncu kulübü bulunamadı.', 'Player club not found.');
    if (!Array.isArray(obj.rng) || obj.rng.length !== 4) return tx('Rastgelelik durumu bozuk.', 'Random state is corrupt.');
    const ids = new Set();
    for (const c of obj.clubs) {
      if (!c || typeof c.id !== 'number' || ids.has(c.id) || !Array.isArray(c.roster) || !c.fac || !c.staff) return tx('Kulüp kaydı bozuk.', 'A club record is corrupt.');
      ids.add(c.id);
      if (c.roster.length > 5) return tx('Kadro sınırı aşılmış bir kulüp var.', 'A club exceeds the squad limit.');
    }
    for (const lg of obj.leagues) {
      if (!lg || !Array.isArray(lg.clubs) || lg.clubs.length !== 8 || !Array.isArray(lg.rounds) || lg.rounds.length !== 14) return tx('Lig fikstürü bozuk.', 'League fixtures are corrupt.');
    }
    for (const id in obj.glads) { const g = obj.glads[id]; if (!g || !CLASSES[g.cls] || typeof g.id !== 'number') return tx('Gladyatör kaydı bozuk.', 'A gladiator record is corrupt.'); }
    return null;
  },
  apply(raw) {
    let obj;
    try { obj = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { return { ok: false, msg: tx('JSON okunamadı.', 'Could not read JSON.') }; }
    const err = this.validate(obj);
    if (err) return { ok: false, msg: err };
    const prevS = S, prevR = R;
    try {
      S = obj;
      R = new RNG(S.rng);
      this.migrate(S);
      Leagues.invalidate();
      Sanity.check(true);
      GameState.applyLang();
      return { ok: true };
    } catch (e) {
      S = prevS; R = prevR;
      return { ok: false, msg: tx('Kayıt yüklenirken hata: ', 'Error while loading save: ') + e.message };
    }
  },
  migrate(s) {
    s.flags = s.flags || { tut: 0, done: {} };
    s.settings = s.settings || { sound: true };
    s.hist = s.hist || { seasons: [], retired: [], records: {}, champs: [] };
    s.hist.champs = s.hist.champs || [];
    s.offers = s.offers || []; s.nego = s.nego || {}; s.scout = s.scout || {};
    s.nid = s.nid || { g: 1, i: 1, o: 1 };
    for (const c of s.clubs) { c.weekFin = c.weekFin || Economy.blankFin(); c.seasonFin = c.seasonFin || Economy.blankFin(); c.finHist = c.finHist || []; c.riv = c.riv || {}; c.trophies = c.trophies || []; c.hist = c.hist || []; c.st = c.st || { w: 0, l: 0, ko: 0, homeW: 0 }; }
  },
  exportFile() {
    const json = this.serialize();
    const me = GameState.player();
    const name = 'arena-dominus-' + (me ? me.n.replace(/[^a-z0-9]+/gi, '-').toLowerCase() : 'save') + '-s' + S.season + 'w' + S.week + '.json';
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    return name;
  },
  async importText(text) {
    const r = this.apply(text);
    if (r.ok) await this.save();
    return r;
  },
  async wipe() {
    await this.init();
    try {
      if (this.mode === 'idb') await this.idbPutMany([['main', null], ['meta', null]]);
      else if (this.mode === 'ls') { localStorage.removeItem('ad_main'); localStorage.removeItem('ad_meta'); }
      else this.mem = {};
    } catch (e) { }
  }
};

// ---- 09_art.js
/* =========================================================================
   Renderer (art): procedural gladiators (arena + portrait from the same
   definition), crests, region symbols, icons, facility illustrations.
   ========================================================================= */

const Art = {
  SKIN: ['#f0cfae', '#e1b38c', '#c88e64', '#a66c45', '#7b4a2d', '#54321f'],
  HAIR: ['#1c1511', '#3a2517', '#6a4224', '#8b3c1c', '#c6a05a', '#a39f98'],
  PLUME: ['#b3261e', '#e3c15f', '#2d5f8e', '#ece6da', '#2b7a4f'],
  METAL: [
    { m: '#8f8a82', l: '#c9c4ba', d: '#57534d' },   // iron (default / common)
    { m: '#a3a7ab', l: '#e1e4e6', d: '#5f6367' },   // steel (quality)
    { m: '#8aa0b8', l: '#d4e1ee', d: '#4c5d70' },   // blued steel (masterwork)
    { m: '#9c8ab4', l: '#ddd2ea', d: '#5c4c70' },   // rare alloy
    { m: '#c9a43c', l: '#f6e39a', d: '#7d6218' }    // gilded (legendary)
  ],
  BRONZE: { m: '#b07a3a', l: '#e2b56f', d: '#6b4520' },
  shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    if (f < 0) { r *= 1 + f; g *= 1 + f; b *= 1 + f; } else { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
    return '#' + ((1 << 24) | (Math.round(r) << 16) | (Math.round(g) << 8) | Math.round(b)).toString(16).slice(1);
  },
  kitOf(g, colors) {
    const it = slot => { const i = S && g.eq ? S.items[g.eq[slot]] : null; return i || null; };
    const w = it('w'), a = it('a'), x = it('x');
    const club = S && g.club >= 0 ? S.clubs[g.club] : null;
    const cols = colors || (club ? [club.crest.c1, club.crest.c2] : ['#6b5a45', '#a8956f']);
    return {
      c1: cols[0], c2: cols[1],
      wq: w ? w.q : 0, wt: w ? w.t : null,
      aq: a ? a.q : -1, at: a ? a.t : null,
      xq: x ? x.q : 0, xt: x ? x.t : null
    };
  },

  // ------------------------------------------------------------ arena figure
  limb(ctx, x1, y1, x2, y2, w, col, out) {
    ctx.lineCap = 'round';
    ctx.strokeStyle = out; ctx.lineWidth = w + 2.2;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  },
  ik(hx, hy, fx, fy, L, face) {
    // two-bone IK, knee bends forward
    let dx = fx - hx, dy = fy - hy;
    let d = Math.sqrt(dx * dx + dy * dy);
    const max = L * 2 - 0.01;
    if (d > max) { fx = hx + dx / d * max; fy = hy + dy / d * max; dx = fx - hx; dy = fy - hy; d = max; }
    const a = Math.atan2(dy, dx);
    const b = Math.acos(clamp(d / (2 * L), -1, 1));
    const ang = a - b * face;
    return { kx: hx + Math.cos(ang) * L, ky: hy + Math.sin(ang) * L, fx, fy };
  },
  armPts(sx, sy, up, fore, L1, L2) {
    const ex = sx + Math.sin(up) * L1, ey = sy + Math.cos(up) * L1;
    const hx = ex + Math.sin(fore) * L2, hy = ey + Math.cos(fore) * L2;
    return { ex, ey, hx, hy };
  },
  // draws a figure with feet at (0,0), height ~100 units, facing +x. pose: see Battle.pose
  figure(ctx, look, cls, kit, P) {
    const skin = this.SKIN[look.sk] || this.SKIN[2];
    const skinD = this.shade(skin, -0.32), skinL = this.shade(skin, 0.15);
    const out = 'rgba(25,16,10,0.85)';
    const bw = look.bw || 1;
    const met = this.METAL[clamp(kit.wq, 0, 4)];
    const amet = this.METAL[clamp(kit.xq, 0, 4)];
    ctx.save();
    if (P.fall > 0) { ctx.rotate(-P.fall * 1.45); ctx.translate(-P.fall * 8, 0); }
    const crouch = P.crouch || 0;
    const hipX = P.hipX || 0, hipY = -47 + crouch * 9 + (P.bob || 0);
    const lean = P.lean || 0;
    const neckX = hipX + Math.sin(lean) * 29, neckY = hipY - Math.cos(lean) * 29;
    const headX = neckX + Math.sin(lean + (P.head || 0)) * 9, headY = neckY - Math.cos(lean + (P.head || 0)) * 9;
    const shF = { x: neckX + 2.5 * bw, y: neckY + 3 }, shB = { x: neckX - 3.5 * bw, y: neckY + 2.5 };
    const legW = 7.2 * bw, armW = 5.6 * bw;
    const legF = this.ik(hipX + 2, hipY, P.footF.x, P.footF.y, 24.5, 1);
    const legB = this.ik(hipX - 2, hipY, P.footB.x, P.footB.y, 24.5, 1);
    const aB = this.armPts(shB.x, shB.y, P.armB[0], P.armB[1], 15.5, 14.5);
    const aF = this.armPts(shF.x, shF.y, P.armF[0], P.armF[1], 15.5, 14.5);
    const dark = this.shade(skin, -0.18);

    // --- far arm + main weapon
    this.limb(ctx, shB.x, shB.y, aB.ex, aB.ey, armW, dark, out);
    this.limb(ctx, aB.ex, aB.ey, aB.hx, aB.hy, armW * 0.92, dark, out);
    if (cls === 'murmillo' || cls === 'secutor' || cls === 'thraex' || cls === 'hoplomachus') this.manica(ctx, aB, armW, amet);
    if (cls === 'dimachaerus') this.wraps(ctx, aB.ex, aB.ey, aB.hx, aB.hy, armW, '#b59a73');
    this.weapon(ctx, cls, aB.hx, aB.hy, P.wB, met, kit, false);

    // --- legs (far, then near)
    const legCol = this.shade(skin, -0.12);
    const drawLeg = (L, hx, near) => {
      this.limb(ctx, hx, hipY, L.kx, L.ky, legW, near ? skin : legCol, out);
      this.limb(ctx, L.kx, L.ky, L.fx, L.fy - 1.5, legW * 0.86, near ? skin : legCol, out);
      // greaves / wraps by class
      const greave = near ? (cls !== 'retiarius') : (cls === 'thraex' || cls === 'hoplomachus' || cls === 'dimachaerus');
      if (cls === 'thraex' || cls === 'hoplomachus') this.wraps(ctx, hx, hipY + 2, L.kx, L.ky, legW, '#d8cdb5');
      if (cls === 'retiarius' && near) this.wraps(ctx, L.kx, L.ky, L.fx, L.fy - 2, legW * 0.8, '#b59a73');
      if (greave) this.greave(ctx, L.kx, L.ky, L.fx, L.fy - 2, legW, cls === 'thraex' || cls === 'hoplomachus' ? amet : this.BRONZE);
      // sandal
      ctx.fillStyle = '#4a3020';
      ctx.beginPath(); ctx.ellipse(L.fx + 3, L.fy - 1, 5.5, 2.3, 0, 0, Math.PI * 2); ctx.fill();
    };
    drawLeg(legB, hipX - 2, false);
    drawLeg(legF, hipX + 2, true);

    // --- torso
    ctx.save();
    ctx.translate(hipX, hipY); ctx.rotate(lean);
    const tw = 11 * bw, ww = 8 * bw;
    const grad = ctx.createLinearGradient(-tw, 0, tw, 0);
    grad.addColorStop(0, skinD); grad.addColorStop(0.55, skin); grad.addColorStop(1, skinL);
    ctx.fillStyle = grad; ctx.strokeStyle = out; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-ww, 0); ctx.quadraticCurveTo(-tw - 1, -16, -tw + 1, -28);
    ctx.quadraticCurveTo(0, -31.5, tw - 1, -28); ctx.quadraticCurveTo(tw + 1, -16, ww, 0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // musculature
    ctx.strokeStyle = this.shade(skin, -0.3); ctx.lineWidth = 0.8; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.moveTo(-1, -26); ctx.quadraticCurveTo(4, -19, tw - 2, -22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(1, -16); ctx.lineTo(1, -4); ctx.moveTo(-2, -12); ctx.lineTo(5, -12); ctx.moveTo(-2, -7); ctx.lineTo(5, -7); ctx.stroke();
    ctx.globalAlpha = 1;
    // body armour (armour slot) or class garment
    this.bodyArmour(ctx, cls, kit, tw, ww);
    // belt + loincloth (subligaculum) in club colours
    ctx.fillStyle = kit.c1; ctx.strokeStyle = out; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-ww - 1.5, -1); ctx.lineTo(ww + 1.5, -1); ctx.lineTo(ww + 0.5, 9); ctx.lineTo(3, 12); ctx.lineTo(-ww - 0.5, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = cls === 'murmillo' || cls === 'secutor' ? this.BRONZE.m : kit.c2;
    ctx.fillRect(-ww - 2, -4.5, ww * 2 + 4, 5);
    ctx.strokeRect(-ww - 2, -4.5, ww * 2 + 4, 5);
    if (cls === 'murmillo' || cls === 'secutor') { ctx.fillStyle = this.BRONZE.l; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(i * 5, -2, 1, 0, 7); ctx.fill(); } }
    ctx.restore();

    // --- head
    this.headSide(ctx, headX, headY, lean + (P.head || 0), look, cls, kit, amet);

    // --- near arm + off-hand gear
    const nearCol = skin;
    if (cls === 'retiarius') this.galerus(ctx, shF.x, shF.y, lean, amet);
    this.limb(ctx, shF.x, shF.y, aF.ex, aF.ey, armW, nearCol, out);
    this.limb(ctx, aF.ex, aF.ey, aF.hx, aF.hy, armW * 0.92, nearCol, out);
    if (cls === 'retiarius') this.manica(ctx, aF, armW, amet);
    if (cls === 'dimachaerus') this.wraps(ctx, aF.ex, aF.ey, aF.hx, aF.hy, armW, '#b59a73');
    this.offhand(ctx, cls, aF, P, kit, amet, met);
    ctx.restore();
    // hit flash overlay is done by caller via composite
  },
  wraps(ctx, x1, y1, x2, y2, w, col) {
    ctx.strokeStyle = col; ctx.lineWidth = 1.1;
    const n = 4;
    for (let i = 1; i <= n; i++) {
      const t = i / (n + 1), x = lerp(x1, x2, t), y = lerp(y1, y2, t);
      const ang = Math.atan2(y2 - y1, x2 - x1) + Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(x - Math.cos(ang) * w * 0.55, y - Math.sin(ang) * w * 0.55 - 0.8); ctx.lineTo(x + Math.cos(ang) * w * 0.55, y + Math.sin(ang) * w * 0.55 + 0.8); ctx.stroke();
    }
  },
  manica(ctx, a, w, M) {
    ctx.lineCap = 'round';
    ctx.strokeStyle = M.d; ctx.lineWidth = w + 2.6;
    ctx.beginPath(); ctx.moveTo(a.ex, a.ey); ctx.lineTo(a.hx, a.hy); ctx.stroke();
    ctx.strokeStyle = M.m; ctx.lineWidth = w + 0.6;
    ctx.beginPath(); ctx.moveTo(a.ex, a.ey); ctx.lineTo(a.hx, a.hy); ctx.stroke();
    ctx.strokeStyle = M.l; ctx.lineWidth = 0.9;
    for (let i = 1; i < 4; i++) {
      const t = i / 4, x = lerp(a.ex, a.hx, t), y = lerp(a.ey, a.hy, t);
      const ang = Math.atan2(a.hy - a.ey, a.hx - a.ex) + Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(x - Math.cos(ang) * w * 0.6, y - Math.sin(ang) * w * 0.6); ctx.lineTo(x + Math.cos(ang) * w * 0.6, y + Math.sin(ang) * w * 0.6); ctx.stroke();
    }
  },
  greave(ctx, x1, y1, x2, y2, w, M) {
    ctx.lineCap = 'round';
    ctx.strokeStyle = M.d; ctx.lineWidth = w + 1.8;
    ctx.beginPath(); ctx.moveTo(lerp(x1, x2, 0.1), lerp(y1, y2, 0.1)); ctx.lineTo(lerp(x1, x2, 0.85), lerp(y1, y2, 0.85)); ctx.stroke();
    ctx.strokeStyle = M.m; ctx.lineWidth = w * 0.95;
    ctx.beginPath(); ctx.moveTo(lerp(x1, x2, 0.1), lerp(y1, y2, 0.1)); ctx.lineTo(lerp(x1, x2, 0.85), lerp(y1, y2, 0.85)); ctx.stroke();
    ctx.strokeStyle = M.l; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(lerp(x1, x2, 0.15) + 1.5, lerp(y1, y2, 0.15)); ctx.lineTo(lerp(x1, x2, 0.8) + 1.5, lerp(y1, y2, 0.8)); ctx.stroke();
  },
  galerus(ctx, x, y, lean, M) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(lean);
    ctx.fillStyle = M.m; ctx.strokeStyle = M.d; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-3, 4); ctx.lineTo(-2, -9); ctx.quadraticCurveTo(4, -12, 7, -7); ctx.lineTo(6, 6); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = M.l; ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(1, 3); ctx.stroke();
    ctx.restore();
  },
  bodyArmour(ctx, cls, kit, tw, ww) {
    const at = kit.at;
    if (!at) {
      if (cls === 'dimachaerus') { // leather cross-strap
        ctx.strokeStyle = '#5a3b22'; ctx.lineWidth = 2.6;
        ctx.beginPath(); ctx.moveTo(-tw + 2, -27); ctx.lineTo(ww, -3); ctx.stroke();
      }
      if (cls === 'hoplomachus') { // quilted tunic top
        ctx.fillStyle = 'rgba(225,214,190,0.9)';
        ctx.beginPath(); ctx.moveTo(-ww, 0); ctx.lineTo(-tw + 1, -14); ctx.lineTo(tw - 1, -14); ctx.lineTo(ww, 0); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(120,100,70,0.6)'; ctx.lineWidth = 0.7;
        for (let i = -8; i <= 8; i += 3) { ctx.beginPath(); ctx.moveTo(i, -13); ctx.lineTo(i * 0.8, -1); ctx.stroke(); }
      }
      return;
    }
    const M = this.METAL[clamp(kit.aq, 0, 4)];
    if (at === 'leather') {
      ctx.fillStyle = '#6b4526'; ctx.strokeStyle = '#3a2412'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-ww, -2); ctx.lineTo(-tw + 1, -22); ctx.lineTo(tw - 1, -22); ctx.lineTo(ww, -2); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = kit.aq >= 2 ? M.l : '#8a6440'; ctx.beginPath(); ctx.moveTo(-ww, -12); ctx.lineTo(ww, -12); ctx.stroke();
    } else if (at === 'scale') {
      ctx.fillStyle = M.m; ctx.strokeStyle = M.d; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-ww, -2); ctx.lineTo(-tw + 0.5, -25); ctx.quadraticCurveTo(0, -28, tw - 0.5, -25); ctx.lineTo(ww, -2); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = M.l; ctx.lineWidth = 0.6;
      for (let r = -24; r < -3; r += 3.2) for (let c = -tw + 3; c < tw - 2; c += 3.2) { ctx.beginPath(); ctx.arc(c + ((r | 0) % 2 ? 1.6 : 0), r, 1.5, 0, Math.PI); ctx.stroke(); }
    } else if (at === 'heavy') {
      const B = kit.aq >= 3 ? M : this.BRONZE;
      const g = ctx.createLinearGradient(-tw, 0, tw, 0); g.addColorStop(0, B.d); g.addColorStop(0.5, B.m); g.addColorStop(1, B.l);
      ctx.fillStyle = g; ctx.strokeStyle = B.d; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-ww - 0.5, -1); ctx.lineTo(-tw, -26); ctx.quadraticCurveTo(0, -30, tw, -26); ctx.lineTo(ww + 0.5, -1); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = B.d; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(-1, -26); ctx.quadraticCurveTo(4, -18, tw - 2, -21); ctx.moveTo(1, -15); ctx.lineTo(1, -3); ctx.stroke();
    } else if (at === 'galerus') {
      ctx.strokeStyle = M.m; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(tw - 1, -27); ctx.lineTo(-ww + 1, -2); ctx.stroke();
    }
  },
  weapon(ctx, cls, x, y, ang, M, kit) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(-ang + Math.PI);
    // local: blade along -y (up) from grip
    const gold = kit.wq >= 4;
    const blade = (len, wid, curve) => {
      const g = ctx.createLinearGradient(-wid, 0, wid, 0); g.addColorStop(0, M.d); g.addColorStop(0.5, M.l); g.addColorStop(1, M.m);
      ctx.fillStyle = g; ctx.strokeStyle = 'rgba(20,15,10,0.8)'; ctx.lineWidth = 0.9;
      ctx.beginPath(); ctx.moveTo(-wid, -3);
      if (curve) { ctx.quadraticCurveTo(-wid - curve, -len * 0.6, curve * 1.6, -len); ctx.quadraticCurveTo(wid - curve * 0.6, -len * 0.55, wid, -3); }
      else { ctx.lineTo(-wid * 0.8, -len + 3); ctx.lineTo(0, -len); ctx.lineTo(wid * 0.8, -len + 3); ctx.lineTo(wid, -3); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = gold ? '#e7c55a' : '#6b4a2a'; ctx.fillRect(-1.2, -1, 2.4, 6);
      ctx.fillStyle = gold ? '#f3dc8a' : M.m; ctx.fillRect(-wid - 2, -4, wid * 2 + 4, 2.2);
    };
    const shaft = (len, headLen, tri) => {
      ctx.strokeStyle = '#5c3d22'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(0, -len); ctx.stroke();
      ctx.strokeStyle = '#7e5733'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0.6, 13); ctx.lineTo(0.6, -len); ctx.stroke();
      ctx.fillStyle = M.l; ctx.strokeStyle = M.d; ctx.lineWidth = 0.9;
      if (tri) {
        ctx.beginPath();
        ctx.moveTo(-6, -len); ctx.lineTo(6, -len); ctx.lineTo(6, -len - 2); ctx.lineTo(-6, -len - 2); ctx.closePath(); ctx.fill(); ctx.stroke();
        for (const px of [-5.5, 0, 5.5]) { ctx.beginPath(); ctx.moveTo(px - 1.1, -len - 2); ctx.lineTo(px, -len - headLen); ctx.lineTo(px + 1.1, -len - 2); ctx.closePath(); ctx.fill(); ctx.stroke(); }
      } else {
        ctx.beginPath(); ctx.moveTo(-2.6, -len); ctx.lineTo(0, -len - headLen); ctx.lineTo(2.6, -len); ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    };
    switch (cls) {
      case 'murmillo': blade(kit.wt === 'spatha' ? 24 : 19, 2.4); break;
      case 'secutor': blade(kit.wt === 'spatha' ? 25 : 20, 2.4); break;
      case 'thraex': blade(21, 2.1, 5); break;
      case 'dimachaerus': blade(20, 2.0); break;
      case 'retiarius': shaft(46, 9, true); break;
      case 'hoplomachus': shaft(52, 10, false); break;
    }
    ctx.restore();
  },
  offhand(ctx, cls, a, P, kit, amet, met) {
    const x = a.hx, y = a.hy;
    const c1 = kit.c1, c2 = kit.c2;
    const rim = kit.xq >= 1 ? amet.m : this.BRONZE.m;
    if (cls === 'murmillo' || cls === 'secutor') {
      const h = cls === 'murmillo' ? 44 : 40, w = cls === 'murmillo' ? 19 : 16;
      ctx.save(); ctx.translate(x + 2, y - 6); ctx.rotate((P.shieldTilt || 0));
      ctx.fillStyle = this.shade(c1, -0.35);
      const shape = () => {
        ctx.beginPath();
        if (cls === 'murmillo') { ctx.moveTo(-w / 2, -h / 2); ctx.quadraticCurveTo(0, -h / 2 - 3, w / 2, -h / 2); ctx.lineTo(w / 2, h / 2); ctx.quadraticCurveTo(0, h / 2 + 3, -w / 2, h / 2); ctx.closePath(); }
        else ctx.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2);
      };
      ctx.save(); ctx.translate(-2.5, 0); shape(); ctx.fill(); ctx.restore();
      const g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0); g.addColorStop(0, this.shade(c1, -0.2)); g.addColorStop(0.6, c1); g.addColorStop(1, this.shade(c1, 0.15));
      ctx.fillStyle = g; ctx.strokeStyle = rim; ctx.lineWidth = 2.2; shape(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = c2; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(0, -h / 2 + 4); ctx.lineTo(0, h / 2 - 4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-w / 2 + 3, -h / 4); ctx.lineTo(w / 2 - 3, -h / 4); ctx.moveTo(-w / 2 + 3, h / 4); ctx.lineTo(w / 2 - 3, h / 4); ctx.stroke();
      ctx.fillStyle = rim; ctx.strokeStyle = this.BRONZE.d; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, 3.6, 0, 7); ctx.fill(); ctx.stroke();
      ctx.restore();
    } else if (cls === 'thraex') {
      ctx.save(); ctx.translate(x + 2, y - 3); ctx.rotate(P.shieldTilt || 0);
      ctx.fillStyle = c1; ctx.strokeStyle = rim; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.rect(-8, -9, 16, 18); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = c2; ctx.lineWidth = 1.2; ctx.strokeRect(-5, -6, 10, 12);
      ctx.restore();
    } else if (cls === 'hoplomachus') {
      ctx.save(); ctx.translate(x + 2, y - 3);
      const g = ctx.createRadialGradient(-2, -2, 1, 0, 0, 10); g.addColorStop(0, this.shade(c1, 0.25)); g.addColorStop(1, c1);
      ctx.fillStyle = g; ctx.strokeStyle = rim; ctx.lineWidth = 2.2;

/* =========================================================================
   Sfx (WebAudio, synthesized) + Battle (live renderer, HUD, commands).
   Battle only READS the CombatEngine state; it never changes outcomes
   except through the player's legal commands (CombatAI.command).
   ========================================================================= */

const Sfx = {
  ctx: null, on: true, crowdNode: null, noiseBuf: null,
  init() {
    if (this.ctx || typeof window === 'undefined') return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      const len = this.ctx.sampleRate * 1.5;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },
  resume() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => { }); },
  env(g, t, a, d, peak) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); },
  noise(dur, freq, q, peak, type = 'bandpass') {
    const c = this.ctx, t = c.currentTime;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); this.env(g, t, 0.005, dur, peak);
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  },
  tone(freq, dur, type, peak, slide) {
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    const g = c.createGain(); this.env(g, t, 0.01, dur, peak);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  },
  play(kind) {
    if (!this.on || !this.ctx || this.ctx.state !== 'running') return;
    try {
      switch (kind) {
        case 'clash': this.noise(0.12, 2800 + Math.random() * 900, 6, 0.22); this.tone(1900 + Math.random() * 400, 0.18, 'triangle', 0.05); break;
        case 'hit': this.noise(0.09, 500, 1.2, 0.3, 'lowpass'); this.tone(110, 0.1, 'sine', 0.12, 60); break;
        case 'block': this.noise(0.16, 1300, 3, 0.28); this.tone(320, 0.2, 'square', 0.03, 200); break;
        case 'swing': this.noise(0.12, 900, 0.8, 0.06, 'highpass'); break;
        case 'net': this.noise(0.25, 700, 0.6, 0.08, 'lowpass'); break;
        case 'fall': this.noise(0.35, 220, 0.8, 0.35, 'lowpass'); break;
        case 'horn': this.tone(196, 0.9, 'sawtooth', 0.06); this.tone(294, 0.9, 'sawtooth', 0.04); break;
        case 'cheer': this.noise(1.4, 1100, 0.5, 0.12); break;
        case 'click': this.tone(660, 0.05, 'triangle', 0.04); break;
        case 'coin': this.tone(1320, 0.08, 'triangle', 0.05); setTimeout(() => this.on && this.tone(1760, 0.12, 'triangle', 0.05), 70); break;
      }
    } catch (e) { }
  },
  crowd(on) {
    if (!this.ctx) return;
    try {
      if (on && !this.crowdNode && this.on) {
        const c = this.ctx;
        const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
        const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 800; f.Q.value = 0.4;
        const g = c.createGain(); g.gain.value = 0.035;
        const lfo = c.createOscillator(); lfo.frequency.value = 0.23; const lg = c.createGain(); lg.gain.value = 0.015;
        lfo.connect(lg); lg.connect(g.gain);
        src.connect(f); f.connect(g); g.connect(c.destination); src.start(); lfo.start();
        this.crowdNode = { src, lfo, g };
      } else if (!on && this.crowdNode) {
        this.crowdNode.src.stop(); this.crowdNode.lfo.stop(); this.crowdNode = null;
      }
    } catch (e) { this.crowdNode = null; }
  },
  setOn(v) { this.on = v; if (!v) this.crowd(false); }
};

const Battle = {
  m: null, setup: null, fx: null, comp: null, onDone: null, raf: 0,
  speed: 1, acc: 0, last: 0, rv: [], parts: [], shake: 0, bg: null, W: 0, H: 0, dpr: 1,
  targeting: false, endT: -1, recorded: false, kits: [],
  open(fx, comp, onDone) {
    this.fx = fx; this.comp = comp; this.onDone = onDone;
    this.setup = MatchSystem.build(fx.m, comp, { live: true });
    this.fixColors(this.setup);
    this.m = CombatEngine.create(this.setup);
    this.pside = this.setup.sides[0].cid === S.player ? 0 : 1;
    this.speed = 1; this.acc = 0; this.parts = []; this.shake = 0; this.endT = -1; this.targeting = false; this.recorded = false;
    this.rv = this.m.units.map(u => ({ hitT: -9, blkT: -9, evT: -9, spT: -9, sp: null, elimT: -9, netT: -9, dustT: 0, critT: -9 }));
    this.kits = this.m.units.map(u => {
      const sd = this.setup.sides[u.side];
      const g = sd.glads[u.slot];
      return Art.kitOf(g, sd.colors);
    });
    const H = S.clubs[fx.m.h];
    this.theme = comp.type === 'icup' && fx.m.nt ? { floor: '#dcc79c', wall: '#efe6d6', a: '#7a1f1a', b: '#d4ad52', grand: true } : { ...REGION_BY_ID[H.reg].pal };
    UI.showBattle();
    this.resize();
    this.last = performance.now();
    Sfx.play('horn'); Sfx.crowd(true);
    cancelAnimationFrame(this.raf);
    this.raf = requestAnimationFrame(t => this.frame(t));
  },
  // purely cosmetic: make sure both teams wear clearly different colours
  fixColors(setup) {
    const rgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const dist = (a, b) => { const A = rgb(a), B = rgb(b); return Math.hypot(A[0] - B[0], A[1] - B[1], A[2] - B[2]); };
    const h = setup.sides[0].colors, a = setup.sides[1].colors;
    if (dist(h[0], a[0]) >= 110) return;
    const alts = [a[1], '#e9e1cf', '#25507a', '#2a9d8f', '#d4ad52', '#1f1a17'];
    const pick = alts.find(c => dist(c, h[0]) >= 110 && dist(c, h[1]) >= 60) || '#e9e1cf';
    setup.sides[1].colors = [pick, a[0]];
  },
  close() { cancelAnimationFrame(this.raf); this.raf = 0; Sfx.crowd(false); this.m = null; },
  resize() {
    const cv = document.getElementById('bcanvas'); if (!cv) return;
    const r = cv.parentElement.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(2400000 / Math.max(1, r.width * r.height)));
    this.dpr = dpr; this.W = Math.max(320, r.width); this.H = Math.max(180, r.height);
    cv.width = Math.round(this.W * dpr); cv.height = Math.round(this.H * dpr);
    cv.style.width = this.W + 'px'; cv.style.height = this.H + 'px';
    this.bg = this.renderBG();
  },
  // world → screen
  proj(x, y) {
    const cx = this.W / 2, cy = this.H * 0.63, rx = this.W * 0.44, ry = this.H * 0.29;
    return { x: cx + x / ARENA_RX * rx, y: cy + y / ARENA_RY * ry, s: Math.min(this.H / 540, this.W / 960) * (0.88 + 0.12 * (y + ARENA_RY) / (2 * ARENA_RY)) };
  },
  renderBG() {
    const c = document.createElement('canvas');
    c.width = Math.round(this.W * this.dpr); c.height = Math.round(this.H * this.dpr);
    const x = c.getContext('2d'); x.scale(this.dpr, this.dpr);
    const W = this.W, H = this.H, T = this.theme;
    const rng = new RNG(this.m.seed);
    // sky & stands
    const sky = x.createLinearGradient(0, 0, 0, H * 0.4); sky.addColorStop(0, '#2a1d14'); sky.addColorStop(1, '#4a3626');
    x.fillStyle = sky; x.fillRect(0, 0, W, H);
    // upper arcade
    x.fillStyle = Art.shade(T.wall, -0.35); x.fillRect(0, 0, W, H * 0.07);
    for (let i = 0; i < W / 26 + 1; i++) { x.fillStyle = '#1b130d'; x.beginPath(); x.moveTo(i * 26 + 5, H * 0.07); x.lineTo(i * 26 + 5, H * 0.03); x.arc(i * 26 + 13, H * 0.03, 8, Math.PI, 0); x.lineTo(i * 26 + 21, H * 0.07); x.fill(); }
    // seating tiers with crowd
    const tiers = 7;
    for (let t = 0; t < tiers; t++) {
      const y0 = H * 0.07 + t * H * 0.034;
      x.fillStyle = t % 2 ? Art.shade(T.wall, -0.25) : Art.shade(T.wall, -0.15);
      x.fillRect(0, y0, W, H * 0.034);
      const sp = Math.max(7, H * 0.02), hw = sp * 0.36, hr = sp * 0.24;
      const n = Math.floor(W / sp);
      for (let i = 0; i < n; i++) {
        if (rng.next() < 0.14) continue;
        const px = i * sp + rng.range(0, sp * 0.35), py = y0 + H * 0.017 + rng.range(-1, 1);
        const tone = Art.SKIN[rng.int(0, 5)];
        x.fillStyle = rng.pick(['#7b2d26', '#2f4a6b', '#e6dccb', '#6b5a2a', T.a, T.b, '#3e5c3a', '#8c6d46']);
        x.beginPath(); x.moveTo(px - hw, py + H * 0.017); x.lineTo(px - hw * 0.8, py + hr * 0.6); x.quadraticCurveTo(px, py, px + hw * 0.8, py + hr * 0.6); x.lineTo(px + hw, py + H * 0.017); x.fill();
        x.fillStyle = tone; x.beginPath(); x.arc(px, py - hr * 0.3, hr, 0, 7); x.fill();
        if (rng.next() < 0.3) { x.fillStyle = Art.HAIR[rng.int(0, 5)]; x.beginPath(); x.arc(px, py - hr * 0.6, hr * 0.9, Math.PI, 0); x.fill(); }
      }
    }
    // podium wall with banners
    const wy = H * 0.07 + tiers * H * 0.034;
    const wallG = x.createLinearGradient(0, wy, 0, wy + H * 0.08); wallG.addColorStop(0, T.wall); wallG.addColorStop(1, Art.shade(T.wall, -0.3));
    x.fillStyle = wallG; x.fillRect(0, wy, W, H * 0.08);
    x.strokeStyle = 'rgba(0,0,0,0.25)'; x.lineWidth = 1;
    for (let i = 0; i < W; i += 38) { x.beginPath(); x.moveTo(i, wy); x.lineTo(i, wy + H * 0.08); x.stroke(); }
    const sides = this.setup.sides;
    for (let i = 0; i < 8; i++) {
      const bx = W * (0.08 + i * 0.12), col = sides[i % 2].colors;
      x.fillStyle = col[0]; x.beginPath(); x.moveTo(bx - 9, wy + 2); x.lineTo(bx + 9, wy + 2); x.lineTo(bx + 9, wy + H * 0.075); x.lineTo(bx, wy + H * 0.06); x.lineTo(bx - 9, wy + H * 0.075); x.closePath(); x.fill();
      x.fillStyle = col[1]; x.fillRect(bx - 9, wy + 6, 18, 3);
    }
    if (T.grand) { x.fillStyle = '#d4ad52'; x.font = `bold ${Math.round(H * 0.03)}px serif`; x.textAlign = 'center'; x.fillText(tx('✦ BÜYÜK KOLEZYUM ✦', '✦ GRAND COLOSSEUM ✦'), W / 2, wy + H * 0.05); }
    // arena floor
    const cx = W / 2, cy = H * 0.63, rx = W * 0.5, ry = H * 0.36;
    x.save(); x.beginPath(); x.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); x.clip();
    const fl = x.createRadialGradient(cx, cy - ry * 0.2, 10, cx, cy, rx);
    fl.addColorStop(0, Art.shade(T.floor, 0.12)); fl.addColorStop(0.7, T.floor); fl.addColorStop(1, Art.shade(T.floor, -0.25));
    x.fillStyle = fl; x.fillRect(0, 0, W, H);
    for (let i = 0; i < W * H / 260; i++) { x.fillStyle = rng.next() < 0.5 ? 'rgba(90,60,30,0.12)' : 'rgba(255,240,210,0.14)'; x.fillRect(rng.range(0, W), rng.range(cy - ry, H), 1.5, 1.5); }
    x.strokeStyle = 'rgba(120,85,45,0.12)'; x.lineWidth = 2;
    for (let k = 1; k < 7; k++) { x.beginPath(); x.ellipse(cx, cy, rx * k / 7, ry * k / 7, 0, 0, Math.PI * 2); x.stroke(); }
    x.restore();
    x.strokeStyle = Art.shade(T.wall, -0.45); x.lineWidth = 3;
    x.beginPath(); x.ellipse(cx, cy, rx, ry, 0, Math.PI * 1.04, Math.PI * 1.96); x.stroke();
    // vignette
    const vg = x.createRadialGradient(cx, cy, H * 0.3, cx, cy, W * 0.75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.45)');
    x.fillStyle = vg; x.fillRect(0, 0, W, H);
    return c;
  },
  frame(ts) {
    if (!this.m) return;
    const dt = Math.min(0.1, (ts - this.last) / 1000);
    this.last = ts;
    const m = this.m;
    if (!m.over) {
      this.acc += dt * this.speed;
      let n = 0;
      while (this.acc >= COMBAT_DT && !m.over && n++ < 12) {
        CombatEngine.step(m);
        this.acc -= COMBAT_DT;
        this.consumeEvents();
      }
    } else {
      if (this.endT < 0) { this.endT = ts; this.consumeEvents(); Sfx.play('cheer'); this.petals(); }
      if (ts - this.endT > 2600 && !this.recorded) this.finish();
    }
    const alpha = m.over ? 1 : clamp(this.acc / COMBAT_DT, 0, 1);
    this.draw(dt, alpha);
    this.updateHUD();
    this.raf = requestAnimationFrame(t => this.frame(t));
  },
  consumeEvents() {
    const m = this.m;
    for (const e of m.events) this.onEvent(e);
    m.events.length = 0;
  },
  head(u) { const p = this.proj(u.x, u.y); return { x: p.x, y: p.y - 72 * p.s, s: p.s }; },
  chest(u) { const p = this.proj(u.x, u.y); return { x: p.x, y: p.y - 58 * p.s, s: p.s }; },
  text(x, y, t, col, size = 14, life = 0.9) {
    // stack labels instead of drawing them on top of each other
    x += (Math.random() - 0.5) * 16;
    const step = size * Math.max(0.8, this.H / 470) + 3;
    for (let k = 0; k < 6; k++) { if (!this.parts.some(q => q.k === 'txt' && q.life > q.max * 0.45 && Math.abs(q.x - x) < 46 && Math.abs(q.y - y) < step)) break; y -= step; }
    let n = 0; for (const q of this.parts) if (q.k === 'txt') n++;
    if (n > 7) { const i = this.parts.findIndex(q => q.k === 'txt'); if (i >= 0) this.parts.splice(i, 1); }
    this.parts.push({ k: 'txt', x, y, vx: 0, vy: -38, t, col, size, life, max: life });
  },
  sparks(x, y, n, col) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 140; this.parts.push({ k: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, col, life: 0.25 + Math.random() * 0.15, max: 0.35 }); } },
  dust(x, y, n, big) { for (let i = 0; i < n; i++) this.parts.push({ k: 'dust', x: x + (Math.random() - 0.5) * 14, y: y - Math.random() * 4, vx: (Math.random() - 0.5) * 30, vy: -10 - Math.random() * 15, r: big ? 6 : 3, life: 0.6 + Math.random() * 0.4, max: 1 }); },
  petals() { for (let i = 0; i < 60; i++) this.parts.push({ k: 'petal', x: Math.random() * this.W, y: -Math.random() * this.H * 0.5, vx: (Math.random() - 0.5) * 30, vy: 40 + Math.random() * 40, rot: Math.random() * 6, col: Math.random() < 0.6 ? '#b3261e' : '#efe6d6', life: 4, max: 4 }); },
  onEvent(e) {
    const m = this.m, U = m.units;
    const now = m.t;
    switch (e.type) {
      case 'swing': if (Math.random() < 0.5) Sfx.play('swing'); break;
      case 'hit': {
        const T = U[e.tg], A = U[e.u], c = this.chest(T);
        const rv = this.rv[e.tg];
        if (e.blocked) { rv.blkT = now; this.sparks(lerp(c.x, this.chest(A).x, 0.3), c.y, 10, '#ffe7a0'); Sfx.play('block'); this.text(c.x, c.y - 18 * c.s, tx('BLOK ', 'BLOCK ') + Math.round(e.dmg), '#e6d8b0', 12); }
        else { rv.hitT = now; this.sparks(c.x, c.y, e.crit ? 14 : 6, e.crit ? '#ffd27a' : '#f5f0e0'); Sfx.play(e.crit ? 'clash' : 'hit'); this.text(c.x, c.y - 18 * c.s, String(Math.round(e.dmg)), e.crit ? '#ffcc4d' : '#fff', e.crit ? 18 : 14); }
        if (e.crit) { this.text(c.x, c.y - 40 * c.s, tx('KRİTİK!', 'CRITICAL!'), '#ffb02e', 15, 1.1); this.shake = Math.max(this.shake, 5); this.rv[e.tg].critT = now; }
        if (e.sp) this.dust(this.proj(T.x, T.y).x, this.proj(T.x, T.y).y, 4);
        break;
      }
      case 'miss': case 'whiff': { if (Math.random() < 0.4) { const c = this.chest(U[e.tg]); this.text(c.x, c.y - 18 * c.s, tx('ıska', 'miss'), '#bfb6a2', 10, 0.5); } break; }
      case 'evade': { this.rv[e.tg].evT = now; const c = this.chest(U[e.tg]); this.text(c.x, c.y - 18 * c.s, tx('KAÇTI', 'DODGED'), '#9fd3ff', 12, 0.7); break; }
      case 'special': {
        const u = U[e.u], rv = this.rv[e.u];
        rv.spT = now; rv.sp = e.sp;
        const h = this.head(u);
        this.text(h.x, h.y - 14, CLASSES[u.cls].sp.name, '#ffd27a', 13, 1.2);
        if (e.sp === 'agile' || e.sp === 'pursuit' || e.sp === 'lunge') { const p = this.proj(u.x, u.y); this.dust(p.x, p.y, 6, true); }
        if (e.sp === 'shieldwall') { const c = this.chest(u); this.sparks(c.x, c.y, 8, '#fff2c0'); Sfx.play('block'); }
        if (e.sp === 'net') { rv.netT = now; Sfx.play('net'); }
        break;
      }
      case 'net': {
        const T = U[e.tg], c = this.chest(T);
        this.parts.push({ k: 'netfly', from: e.u, to: e.tg, life: 0.25, max: 0.25 });
        if (e.ok) this.text(c.x, c.y - 26 * c.s, tx('AĞA DÜŞTÜ!', 'NETTED!'), '#cde7ff', 13, 1.1); else this.text(c.x, c.y - 26 * c.s, tx('AĞ BOŞA GİTTİ', 'NET MISSED'), '#bfb6a2', 11, 0.8);
        break;
      }
      case 'stumble': { const c = this.chest(U[e.u]); this.text(c.x, c.y - 20 * c.s, tx('Sendeledi', 'Stumbled'), '#d9b38c', 11, 0.8); break; }
      case 'elim': {
        const u = U[e.u]; this.rv[e.u].elimT = now;
        const p = this.proj(u.x, u.y); this.dust(p.x, p.y, 14, true); this.shake = Math.max(this.shake, 8);
        this.text(p.x, p.y - 90 * p.s, tx('ELENDİ', 'ELIMINATED'), '#ff7a6b', 16, 1.6);
        Sfx.play('fall'); setTimeout(() => Sfx.play('cheer'), 200);
        UI.battleLog(tx(`${u.name} elendi`, `${u.name} eliminated`) + (e.by >= 0 ? ' — ' + U[e.by].name : ''));
        break;
      }
      case 'cmd': UI.battleLog(e.side === this.pside ? tx('Emir: ', 'Order: ') + (e.cmd === 'attack' ? tx('Hücum!', 'Attack!') : e.cmd === 'defend' ? tx('Savunma!', 'Defend!') : tx('Odaklan: ', 'Focus: ') + (U[e.tg] ? U[e.tg].name : '')) : tx('Rakip taktik değiştirdi', 'The opponent changed tactics')); break;
    }
  },
  // pose derived from engine state + event timings (visual only)
  pose(u, i, vt, alpha) {
    const rv = this.rv[i];
    const cls = u.cls;
    const shieldCls = cls === 'murmillo' || cls === 'secutor' || cls === 'thraex' || cls === 'hoplomachus';
    const P = { footF: { x: 7, y: 0 }, footB: { x: -7, y: 0 }, lean: 0.05, bob: 0, crouch: 0.18, hipX: 0, armF: [0.55, 1.25], armB: [-0.25, 0.85], wB: 2.0, wF: 2.2, head: 0, fall: 0, shieldTilt: 0, noNet: false };
    if (shieldCls) P.armF = [0.85, 1.5];
    if (cls === 'retiarius') { P.armB = [0.5, 1.45]; P.wB = 1.72; P.armF = [0.25, 0.45]; }
    if (cls === 'hoplomachus') { P.armB = [0.25, 1.55]; P.wB = 1.66; }
    if (cls === 'dimachaerus') { P.armB = [-0.1, 1.15]; P.wB = 2.2; P.armF = [0.5, 1.3]; P.wF = 2.3; }
    P.bob = Math.sin(vt * 2.4 + i * 1.7) * 0.8;
    const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    // elimination
    if (!u.alive) {
      const k = clamp((vt - rv.elimT) / 1.2, 0, 1);
      const k1 = clamp(k / 0.45, 0, 1), k2 = clamp((k - 0.45) / 0.55, 0, 1);
      P.crouch = 0.18 + k1 * 0.75; P.lean = 0.05 + k1 * 0.35; P.footF.x = 7 + k1 * 6; P.armB = [0.2, 0.3]; P.armF = [0.3, 0.4];
      P.fall = ease(k2); P.dropped = k1 >= 1; P.head = 0.3 * k1;
      return P;
    }
    // movement
    const speed = Math.hypot(u.x - u.px, u.y - u.py) / COMBAT_DT;
    if (speed > 0.25) {
      const ph = (u.walk + speed * COMBAT_DT * alpha) * 2.1 + i;
      const amp = Math.min(1.3, speed / 2.2);
      const sw = Math.sin(ph);
      P.footF.x = 7 + sw * 10 * amp; P.footF.y = -Math.max(0, Math.cos(ph)) * 5 * amp;
      P.footB.x = -7 - sw * 10 * amp; P.footB.y = -Math.max(0, -Math.cos(ph)) * 5 * amp;
      P.bob -= Math.abs(Math.cos(ph)) * 1.8 * amp;
      P.lean += 0.06 + (u.st.sprint > 0 ? 0.3 : 0);
      if (!shieldCls) P.armF[0] += sw * 0.25;
      // backpedalling (kiting) leans back
      const dirx = (u.x - u.px) * u.face;
      if (dirx < -0.05) P.lean -= 0.18;
    }
    // actions
    const a = u.act;
    if (a) {
      const t = Math.min(a.dur, a.t + COMBAT_DT * alpha);
      const p = t / a.dur;
      const thrustCls = cls === 'retiarius' || cls === 'hoplomachus';
      if (a.k === 'atk') {
        const imp = 0.28 / 0.55;
        const wind = ease(clamp(p / imp, 0, 1)), strike = ease(clamp((p - imp) / 0.2, 0, 1)), rec = clamp((p - imp - 0.2) / (1 - imp - 0.2), 0, 1);
        if (thrustCls || a.v === 2) {
          const up0 = P.armB[0], f0 = P.armB[1];
          P.armB[0] = lerp(lerp(up0, 0.7, wind), 1.45, strike * (1 - rec)) + (rec > 0 ? (up0 - 1.45) * 0 : 0);
          P.armB[1] = lerp(lerp(f0, 0.35, wind), 1.6, strike * (1 - rec));
          if (rec > 0) { P.armB[0] = lerp(1.45, up0, rec); P.armB[1] = lerp(1.6, f0, rec); }
          P.wB = thrustCls ? lerp(P.wB, 1.6, strike) : 1.6;
          P.lean += -0.05 * wind + 0.3 * strike * (1 - rec);
          P.footF.x += 5 * strike * (1 - rec);
        } else {
          const up0 = P.armB[0], f0 = P.armB[1], w0 = P.wB;
          const hi = a.v === 1 ? -1.6 : -2.5;
          let up = lerp(up0, hi, wind), fo = lerp(f0, hi + 0.4, wind), wv = lerp(w0, hi - 0.4, wind);
          if (p > imp) { up = lerp(hi, 1.35, strike); fo = lerp(hi + 0.4, 1.45, strike); wv = lerp(hi - 0.4, 1.25, strike); }
          if (rec > 0) { up = lerp(1.35, up0, rec); fo = lerp(1.45, f0, rec); wv = lerp(1.25, w0, rec); }
          P.armB = [up, fo]; P.wB = wv;
          P.lean += -0.06 * wind * (1 - strike) + 0.25 * strike * (1 - rec);
          P.footF.x += 5 * strike * (1 - rec);
        }
      } else if (a.k === 'stumble') {
        const s = Math.sin(p * Math.PI);
        P.lean += 0.4 * s; P.head = 0.4 * s; P.footF.x += 8 * s; P.armB[0] -= 0.6 * s;
      } else if (a.k === 'sp') {
        switch (a.sp) {
          case 'shieldwall': break; // guard pose handled below
          case 'net': {
            const w = ease(clamp(p / 0.6, 0, 1)), th = ease(clamp((p - 0.6) / 0.25, 0, 1));
            P.armF = [lerp(lerp(0.25, -2.5, w), 2.3, th), lerp(lerp(0.45, -2.2, w), 2.1, th)];
            P.lean += -0.1 * w + 0.3 * th; P.footF.x += 6 * th;
            if (p > 0.6) P.noNet = true;
            break;
          }
          case 'agile': {
            const d = clamp(p / 0.32, 0, 1), s = ease(clamp((p - 0.32) / 0.15, 0, 1)), b = clamp((p - 0.56) / 0.44, 0, 1);
            P.lean += 0.45 * d * (1 - b) - 0.25 * b; P.crouch += 0.25 * d * (1 - b);
            P.footF.x += 10 * d * (1 - b); P.footB.x -= 6 * d * (1 - b);
            P.armB = [lerp(-2.4, 1.4, s), lerp(-2.0, 1.5, s)]; P.wB = lerp(-2.8, 1.3, s);
            if (b > 0) { P.footF.y = -6 * Math.sin(b * Math.PI); P.footB.y = -6 * Math.sin(b * Math.PI); P.armB = [lerp(1.4, -0.25, b), lerp(1.5, 0.85, b)]; P.wB = lerp(1.3, 2.0, b); }
            break;
          }
          case 'pursuit': P.lean += 0.25; P.crouch += 0.1; break;
          case 'combo': {
            const s1 = ease(clamp(p / 0.27, 0, 1)), r1 = clamp((p - 0.3) / 0.2, 0, 1);
            const s2 = ease(clamp((p - 0.4) / 0.22, 0, 1)), r2 = clamp((p - 0.7) / 0.3, 0, 1);
            P.armB = [lerp(lerp(-2.3, 1.35, s1), -0.1, r1), lerp(lerp(-1.9, 1.45, s1), 1.15, r1)]; P.wB = lerp(lerp(-2.7, 1.25, s1), 2.2, r1);
            P.armF = [lerp(lerp(0.5, 1.5, s2), 0.5, r2), lerp(lerp(-1.5, 1.6, s2), 1.3, r2)]; P.wF = lerp(lerp(-2.4, 1.3, s2), 2.3, r2);
            P.lean += 0.2 * Math.max(s1 * (1 - r1), s2 * (1 - r2)); P.footF.x += 5 * s2;
            break;
          }
          case 'lunge': {
            const w = ease(clamp(p / 0.4, 0, 1)), s = ease(clamp((p - 0.4) / 0.15, 0, 1)), r = clamp((p - 0.65) / 0.35, 0, 1);
            P.armB = [lerp(lerp(0.25, 0.5, w), 1.55, s * (1 - r)), lerp(lerp(1.55, 0.2, w), 1.6, s * (1 - r))];
            P.wB = 1.6; P.lean += 0.42 * s * (1 - r) - 0.08 * w; P.crouch += 0.3 * s * (1 - r);
            P.footF.x += 14 * s * (1 - r); P.footB.x -= 8 * s * (1 - r);
            break;
          }
        }
      }
    }
    // shield wall / guard stance
    if (u.st.guard > 0) { P.crouch += 0.3; P.armF = [1.3, 1.7]; P.shieldTilt = -0.12; P.lean += 0.1; }
    // reactions
    const dh = vt - rv.hitT;
    if (dh >= 0 && dh < 0.3) { const k = 1 - dh / 0.3; P.lean -= 0.32 * k; P.hipX -= 3 * k; P.head -= 0.25 * k; P.flash = k; }
    const db = vt - rv.blkT;
    if (db >= 0 && db < 0.35 && shieldCls) { const k = 1 - db / 0.35; P.armF = [lerp(P.armF[0], 1.35, k), lerp(P.armF[1], 1.75, k)]; P.lean -= 0.1 * k; }
    const de = vt - rv.evT;
    if (de >= 0 && de < 0.42) { const k = Math.sin(Math.PI * de / 0.42); P.hipX -= 8 * k; P.lean -= 0.3 * k; P.footB.x -= 5 * k; P.crouch += 0.15 * k; }
    if (u.st.root > 0) { P.lean += Math.sin(vt * 22) * 0.06; P.armB[0] -= 0.4; P.armF[0] -= 0.4; }
    if (u.st.stag > 0) { P.lean -= 0.2; P.head += 0.25; }
    if (cls === 'retiarius' && vt - rv.netT < 3 && vt - rv.netT > 0.4) P.noNet = true;
    // victory celebration
    if (this.m.over && this.m.result && this.m.result.w === u.side) {
      const k = clamp((performance.now() - this.endT) / 400, 0, 1);
      P.armB = [lerp(P.armB[0], 2.75, k), lerp(P.armB[1], 2.95, k)]; P.wB = lerp(P.wB, 3.05, k);
      if (!shieldCls) P.armF = [lerp(P.armF[0], 2.5, k), lerp(P.armF[1], 2.8, k)];
      P.bob -= Math.abs(Math.sin(vt * 5 + i)) * 4 * k; P.lean = lerp(P.lean, -0.05, k);
    }
    return P;
  },
  draw(dt, alpha) {
    const cv = document.getElementById('bcanvas'); if (!cv) return;
    const ctx = cv.getContext('2d');
    const m = this.m;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.shake *= Math.pow(0.02, dt);
    const sx = (Math.random() - 0.5) * this.shake, sy = (Math.random() - 0.5) * this.shake;
    ctx.save(); ctx.translate(sx, sy);
    ctx.drawImage(this.bg, 0, 0, this.W, this.H);
    const vt = m.over ? m.t : m.t - COMBAT_DT * (1 - alpha);
    // order by depth
    const order = m.units.map((u, i) => i).sort((a, b) => {
      const A = m.units[a], B = m.units[b];
      if (A.alive !== B.alive) return A.alive ? 1 : -1;
      return lerp(A.py, A.y, alpha) - lerp(B.py, B.y, alpha);
    });
    for (const i of order) {
      const u = m.units[i];
      const x = lerp(u.px, u.x, alpha), y = lerp(u.py, u.y, alpha);
      const p = this.proj(x, y);
      const team = m.teams[u.side];
      // shadow + team ring
      ctx.fillStyle = 'rgba(30,20,10,0.32)';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 22 * p.s * (u.alive ? 1 : 1.9), 6.5 * p.s, 0, 0, Math.PI * 2); ctx.fill();
      if (u.alive) {
        ctx.strokeStyle = team.colors[0]; ctx.lineWidth = 2.4 * p.s;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, 19 * p.s, 5.5 * p.s, 0, 0, Math.PI * 2); ctx.stroke();
        if (u.side === this.pside) { ctx.strokeStyle = 'rgba(255,230,160,0.7)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(p.x, p.y, 22 * p.s, 7 * p.s, 0, 0, Math.PI * 2); ctx.stroke(); }
      }
      const P = this.pose(u, i, vt, alpha);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.scale(p.s * u.face, p.s);
      const kit = this.kits[i];
      Art.figure(ctx, u.look, u.cls, kit, P);
      ctx.restore();
      if (P.flash > 0) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = P.flash * 0.55;
        const g = ctx.createRadialGradient(p.x, p.y - 55 * p.s, 2, p.x, p.y - 55 * p.s, 32 * p.s);
        g.addColorStop(0, '#fff3d6'); g.addColorStop(1, 'rgba(255,240,200,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y - 55 * p.s, 32 * p.s, 0, 7); ctx.fill(); ctx.restore();
      }
      if (u.st.root > 0) this.drawNetOver(ctx, p);
      if (u.st.guard > 0) { ctx.strokeStyle = 'rgba(255,230,150,0.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x + 12 * p.s * u.face, p.y - 50 * p.s, 30 * p.s, -1.2, 1.2); ctx.stroke(); }
      // overhead bar
      if (u.alive) {
        const bw = 34 * p.s, by = p.y - 112 * p.s;
        ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(p.x - bw / 2 - 1, by - 1, bw + 2, 5);
        ctx.fillStyle = u.hp / u.hpMax > 0.35 ? team.colors[0] === '#1f1a17' ? '#8a8a8a' : this.hpCol(u.side) : '#d24b3a';
        ctx.fillRect(p.x - bw / 2, by, bw * u.hp / u.hpMax, 3);
        if (team.focus >= 0) { }
      }
      // focus marker on enemy targeted by the player's team
      const myTeam = m.teams[this.pside];
      if (u.alive && myTeam.focus === i) {
        const hy = p.y - 122 * p.s;
        ctx.fillStyle = '#ff5a3c'; ctx.beginPath(); ctx.moveTo(p.x - 7, hy - 9); ctx.lineTo(p.x + 7, hy - 9); ctx.lineTo(p.x, hy); ctx.closePath(); ctx.fill();
      }
      if (this.targeting && u.alive && u.side !== this.pside) {
        ctx.strokeStyle = 'rgba(255,90,60,' + (0.5 + 0.4 * Math.sin(performance.now() / 150)) + ')'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(p.x, p.y - 45 * p.s, 28 * p.s, 62 * p.s, 0, 0, Math.PI * 2); ctx.stroke();
      }
    }
    this.drawParts(ctx, dt);
    ctx.restore();
  },
  hpCol(side) { return side === this.pside ? '#6fcf6a' : '#e8b34a'; },
  drawNetOver(ctx, p) {
    ctx.save(); ctx.translate(p.x, p.y - 50 * p.s); ctx.strokeStyle = 'rgba(225,212,170,0.9)'; ctx.lineWidth = 1;
    const r = 30 * p.s;
    ctx.beginPath();
    for (let i = -3; i <= 3; i++) { ctx.moveTo(i * r / 3.2, -r); ctx.quadraticCurveTo(i * r / 2.6, 0, i * r / 3.2, r); ctx.moveTo(-r, i * r / 3.2); ctx.quadraticCurveTo(0, i * r / 2.6, r, i * r / 3.2); }
    ctx.stroke(); ctx.restore();
  },
  drawParts(ctx, dt) {
    const U = this.m.units;
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const q = this.parts[i];
      q.life -= dt;
      if (q.life <= 0) { this.parts.splice(i, 1); continue; }
      const k = q.life / q.max;
      if (q.k === 'spark') {
        q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 300 * dt;
        ctx.strokeStyle = q.col; ctx.globalAlpha = k; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - q.vx * 0.03, q.y - q.vy * 0.03); ctx.stroke();
      } else if (q.k === 'dust') {
        q.x += q.vx * dt; q.y += q.vy * dt;
        ctx.globalAlpha = k * 0.4; ctx.fillStyle = '#c8ad80';
        ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (2 - k) * (this.H / 470), 0, 7); ctx.fill();
      } else if (q.k === 'txt') {
        q.y += q.vy * dt; q.vy *= 0.96;
        ctx.globalAlpha = Math.min(1, k * 2);
        ctx.font = `bold ${Math.round(q.size * Math.max(0.8, this.H / 470))}px "Trebuchet MS", sans-serif`;
        ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(20,10,5,0.85)';
        ctx.strokeText(q.t, q.x, q.y); ctx.fillStyle = q.col; ctx.fillText(q.t, q.x, q.y);
      } else if (q.k === 'petal') {
        q.x += q.vx * dt + Math.sin(q.life * 3) * 0.5; q.y += q.vy * dt; q.rot += dt * 3;
        ctx.globalAlpha = Math.min(1, k * 2); ctx.fillStyle = q.col;
        ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.beginPath(); ctx.ellipse(0, 0, 4, 2, 0, 0, 7); ctx.fill(); ctx.restore();
      } else if (q.k === 'netfly') {
        const A = this.chest(U[q.from]), B = this.chest(U[q.to]);
        const t = 1 - k;
        const x = lerp(A.x, B.x, t), y = lerp(A.y, B.y, t) - Math.sin(t * Math.PI) * 30;
        const r = 8 + t * 18;
        ctx.globalAlpha = 0.9; ctx.strokeStyle = '#e6dcb8'; ctx.lineWidth = 1;
        ctx.beginPath(); for (let j = -2; j <= 2; j++) { ctx.moveTo(x + j * r / 2.5, y - r); ctx.lineTo(x + j * r / 2.5, y + r); ctx.moveTo(x - r, y + j * r / 2.5); ctx.lineTo(x + r, y + j * r / 2.5); } ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  },
  // ---------------------------------------------------------------- HUD & controls
  setSpeed(s) {
    if (s === 'sim') { this.simulateRest(); return; }
    this.speed = s;
    UI.battleSpeedUI(s);
  },
  simulateRest() {
    // same engine, run to the end without visual waiting
    const m = this.m; if (!m) return;
    m.headless = true; m.events.length = 0;
    let guard = 0;
    while (!m.over && guard++ < 2000) CombatEngine.step(m);
    m.headless = false;
    this.endT = performance.now() - 2000;
    for (const u of m.units) { u.px = u.x; u.py = u.y; if (!u.alive && this.rv[u.i].elimT < 0) this.rv[u.i].elimT = m.t - 2; }
  },
  command(cmd) {
    const m = this.m; if (!m || m.over) return;
    if (cmd === 'focus') { this.targeting = !this.targeting; UI.battleTargeting(this.targeting); return; }
    const ok = CombatAI.command(m, this.pside, cmd);
    if (!ok) UI.toast(tx('Komut bekleme süresinde (', 'Command on cooldown (') + Math.ceil(m.teams[this.pside].cmdCd) + tx(' sn).', 's).'));
    this.consumeEvents();
  },
  pickTarget(idx) {
    const m = this.m; if (!m) return;
    this.targeting = false; UI.battleTargeting(false);
    const ok = CombatAI.command(m, this.pside, 'focus', idx);
    if (!ok) UI.toast(m.teams[this.pside].cmdCd > 0 ? tx('Komut bekleme süresinde.', 'Command on cooldown.') : tx('Geçersiz hedef.', 'Invalid target.'));
    this.consumeEvents();
  },
  canvasTap(ev) {
    if (!this.targeting || !this.m) return;
    const r = ev.currentTarget.getBoundingClientRect();
    const x = ev.clientX - r.left, y = ev.clientY - r.top;
    let best = -1, bd = 1e9;
    for (const u of this.m.units) {
      if (!u.alive || u.side === this.pside) continue;
      const p = this.proj(u.x, u.y);
      const d = Math.hypot(p.x - x, (p.y - 45 * p.s) - y);
      if (d < bd) { bd = d; best = u.i; }
    }
    if (best >= 0 && bd < 120) this.pickTarget(best);
  },
  updateHUD() {
    const m = this.m; if (!m) return;
    UI.battleHUD(m, this.pside);
  },
  finish() {
    if (this.recorded) return;
    this.recorded = true;
    const res = this.m.result;
    const setup = this.setup;
    const fx = this.fx, comp = this.comp;
    const done = this.onDone;
    const m = this.m;
    this.close();
    done && done(res, setup, m);
  }
};
