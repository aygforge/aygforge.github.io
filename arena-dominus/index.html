/* =========================================================================
   LeagueManager (Leagues) + CupManager (Cups) + CalendarManager (Calendar)
   + MatchSystem (team building, headless play, result recording)
   ========================================================================= */

const Leagues = {
  createFixtures(lg) {
    const arr = R.shuffle(lg.clubs.slice());
    const n = arr.length; // 8
    const rounds = [];
    let rot = arr.slice(1);
    for (let r = 0; r < n - 1; r++) {
      const cur = [arr[0], ...rot];
      const ms = [];
      for (let i = 0; i < n / 2; i++) {
        const a = cur[i], b = cur[n - 1 - i];
        const flip = i === 0 ? (r % 2 === 1) : ((r + i) % 2 === 1);
        ms.push(flip ? { h: b, a, r: null } : { h: a, a: b, r: null });
      }
      rounds.push(ms);
      rot = [rot[rot.length - 1], ...rot.slice(0, -1)];
    }
    for (let r = 0; r < n - 1; r++) rounds.push(rounds[r].map(m => ({ h: m.a, a: m.h, r: null })));
    lg.rounds = rounds;
    lg.tableCache = null;
  },
  createAllFixtures() { for (const lg of S.leagues) this.createFixtures(lg); },
  rows(lg) {
    const rows = {};
    for (const cid of lg.clubs) rows[cid] = { cid, p: 0, w: 0, l: 0, pts: 0, kf: 0, ka: 0, hp: 0, form: [] };
    for (const rd of lg.rounds) for (const m of rd) {
      if (!m.r) continue;
      const H = rows[m.h], A = rows[m.a];
      if (!H || !A) continue;
      H.p++; A.p++;
      H.kf += m.r.hk; H.ka += m.r.ak; A.kf += m.r.ak; A.ka += m.r.hk;
      H.hp += m.r.hh; A.hp += m.r.ah;
      if (m.r.w === 0) { H.w++; H.pts += 3; A.l++; H.form.push('G'); A.form.push('M'); }
      else { A.w++; A.pts += 3; H.l++; A.form.push('G'); H.form.push('M'); }
    }
    return rows;
  },
  table(lg) {
    if (lg.tableCache) return lg.tableCache;
    const rows = this.rows(lg);
    const list = Object.values(rows);
    list.sort((a, b) => b.pts - a.pts || b.w - a.w);
    // resolve ties group-wise: head-to-head, elimination diff, remaining hp, deterministic (rep, id)
    const out = [];
    let i = 0;
    while (i < list.length) {
      let j = i; while (j + 1 < list.length && list[j + 1].pts === list[i].pts && list[j + 1].w === list[i].w) j++;
      const grp = list.slice(i, j + 1);
      if (grp.length > 1) {
        const ids = new Set(grp.map(r => r.cid));
        const h2h = {}; for (const r of grp) h2h[r.cid] = 0;
        for (const rd of lg.rounds) for (const m of rd) {
          if (!m.r || !ids.has(m.h) || !ids.has(m.a)) continue;
          h2h[m.r.w === 0 ? m.h : m.a] += 3;
        }
        grp.sort((a, b) => (h2h[b.cid] - h2h[a.cid]) || ((b.kf - b.ka) - (a.kf - a.ka)) || (b.hp - a.hp) ||
          (S.clubs[b.cid].rep - S.clubs[a.cid].rep) || (a.cid - b.cid));
      }
      out.push(...grp);
      i = j + 1;
    }
    out.forEach((r, k) => { r.rank = k + 1; r.form = r.form.slice(-5); });
    lg.tableCache = out;
    return out;
  },
  rankOf(cid) {
    const c = S.clubs[cid]; if (!c) return 0;
    const t = this.table(S.leagues[c.lg]);
    const r = t.find(x => x.cid === cid);
    return r ? r.rank : 0;
  },
  invalidate() { for (const lg of S.leagues) lg.tableCache = null; },
  played(lg) { let n = 0; for (const rd of lg.rounds) for (const m of rd) if (m.r) n++; return n; }
};

const Cups = {
  // display name from the cup key (works for old saves too)
  nameOf(c) {
    const key = typeof c === 'string' ? c : c && c.key;
    if (!key) return '';
    if (key === 'imp') return tx('İmparatorluk Kupası', 'Imperial Cup');
    const r = REGION_BY_ID[key.slice(2)];
    return r ? tx(r.name + ' Kupası', r.name + ' Cup') : key;
  },
  draw(list, neutral) {
    const arr = R.shuffle(list.slice());
    const out = [];
    for (let i = 0; i + 1 < arr.length; i += 2) {
      let h = arr[i], a = arr[i + 1];
      const H = S.clubs[h], A = S.clubs[a];
      if (!neutral && H && A && A.tier > H.tier) { const t = h; h = a; a = t; } // lower-league club hosts
      out.push({ h, a, r: null, nt: neutral ? 1 : 0 });
    }
    return out;
  },
  createRegional(regId) {
    const ri = GameState.regIdx(regId);
    const clubs = [];
    for (let t = 1; t <= 6; t++) clubs.push(...S.leagues[GameState.leagueIndex(ri, t)].clubs);
    const byes = clubs.filter(c => S.clubs[c].tier <= 2);
    const r1 = clubs.filter(c => S.clubs[c].tier >= 3);
    const cup = {
      key: 'r_' + regId, name: REGION_BY_ID[regId].name + ' Kupası', reg: regId, season: S.season,
      byes, part: clubs.slice(), cur: 0, champ: -1, runner: -1,
      rounds: RCUP_ROUNDS.map((n, k) => ({ n, wk: RCUP_WEEKS[k], m: [] }))
    };
    cup.rounds[0].m = this.draw(r1, false);
    S.rcups[regId] = cup;
    return cup;
  },
  createRegionalAll() { S.rcups = {}; for (const r of REGIONS) this.createRegional(r.id); },
  createImperial(qual) {
    // qual: [{cid, rank, pts}] — 5 champions + 5 runners-up of last season's tier-1 leagues
    if (!qual || qual.length !== 10) { S.icup = null; return null; }
    const champs = qual.filter(q => q.rank === 1);
    const runners = qual.filter(q => q.rank === 2).sort((a, b) => b.pts - a.pts || (b.kd - a.kd) || a.cid - b.cid);
    const seeds = champs.map(q => q.cid).concat(runners[0].cid);
    const pre = runners.slice(1).map(q => q.cid);
    const cup = {
      key: 'imp', name: 'İmparatorluk Kupası', reg: null, season: S.season, seeds, part: qual.map(q => q.cid),
      cur: 0, champ: -1, runner: -1, rounds: ICUP_ROUNDS.map((n, k) => ({ n, wk: ICUP_WEEKS[k], m: [] }))
    };
    cup.rounds[0].m = this.draw(pre, true).map(m => ({ ...m, nt: 0 }));
    S.icup = cup;
    return cup;
  },
  all() { const out = Object.values(S.rcups); if (S.icup) out.push(S.icup); return out; },
  winnerOf(m) { return m.r ? (m.r.w === 0 ? m.h : m.a) : -1; },
  loserOf(m) { return m.r ? (m.r.w === 0 ? m.a : m.h) : -1; },
  // after a round has been fully played, draw the next round or crown champion
  advance(cup) {
    const rd = cup.rounds[cup.cur];
    if (!rd || !rd.m.length || rd.m.some(m => !m.r)) return false;
    const winners = rd.m.map(m => this.winnerOf(m));
    const last = cup.cur === cup.rounds.length - 1;
    if (last) {
      const f = rd.m[0];
      cup.champ = this.winnerOf(f); cup.runner = this.loserOf(f);
      cup.cur = cup.rounds.length;
      Season.onCupChampion(cup);
      return true;
    }
    let next = winners;
    if (cup.key !== 'imp' && cup.cur === 0) next = winners.concat(cup.byes);
    if (cup.key === 'imp' && cup.cur === 0) next = winners.concat(cup.seeds);
    cup.cur++;
    const isFinal = cup.cur === cup.rounds.length - 1;
    cup.rounds[cup.cur].m = this.draw(next, isFinal);
    return true;
  },
  // is the club still alive in this cup (not eliminated)?
  alive(cup, cid) {
    if (!cup.part.includes(cid)) return false;
    for (let k = 0; k < cup.rounds.length; k++) {
      for (const m of cup.rounds[k].m) if (m.r && this.loserOf(m) === cid) return false;
    }
    return cup.champ < 0 || cup.champ === cid;
  },
  roundReached(cup, cid) {
    // index of the furthest round the club appeared in (byes count as reaching round 2)
    let best = -1;
    cup.rounds.forEach((rd, k) => { if (rd.m.some(m => m.h === cid || m.a === cid)) best = k; });
    if (cup.champ === cid) best = cup.rounds.length;
    if (best < 0 && cup.byes && cup.byes.includes(cid)) best = 1;
    return best;
  }
};

const Calendar = {
  isWindow(week = S.week) { return WINDOW_WEEKS.includes(week); },
  windowLabel() {
    if (S.week <= 1) return tx('Sezon başı transfer dönemi açık', 'Pre-season transfer window open');
    if (S.week === 15 || S.week === 16) return tx('Ara transfer dönemi açık', 'Mid-season transfer window open');
    if (S.week < 15) return tx('Transfer dönemi 15. haftada açılacak', 'Transfer window opens in week 15');
    return tx('Transfer dönemi gelecek sezon başında açılacak', 'Transfer window opens next pre-season');
  },
  fixturesForWeek(week) {
    const out = [];
    const li = LEAGUE_WEEKS.indexOf(week);
    if (li >= 0) for (const lg of S.leagues) for (const m of lg.rounds[li]) out.push({ m, comp: { type: 'league', lg: lg.id, round: li } });
    const ci = RCUP_WEEKS.indexOf(week);
    if (ci >= 0) for (const cup of Object.values(S.rcups)) if (cup.rounds[ci]) for (const m of cup.rounds[ci].m) out.push({ m, comp: { type: 'rcup', key: cup.key, round: ci } });
    const ii = ICUP_WEEKS.indexOf(week);
    if (ii >= 0 && S.icup && S.icup.rounds[ii]) for (const m of S.icup.rounds[ii].m) out.push({ m, comp: { type: 'icup', key: 'imp', round: ii } });
    return out;
  },
  clubFixture(cid, week) {
    return this.fixturesForWeek(week).find(f => f.m.h === cid || f.m.a === cid) || null;
  },
  // upcoming fixtures for a club (known ones), including future cup placeholders
  upcoming(cid, n = 5) {
    const out = [];
    for (let w = S.week; w < SEASON_WEEKS && out.length < n; w++) {
      const f = this.clubFixture(cid, w);
      if (f) out.push({ w, ...f });
      else {
        const ci = RCUP_WEEKS.indexOf(w);
        const cup = S.rcups[S.clubs[cid].reg];
        if (ci >= 0 && cup && cup.cur < ci && Cups.alive(cup, cid)) out.push({ w, tbd: Cups.nameOf(cup) + ' — ' + RCUP_ROUNDS[ci] + tx(' (kura bekleniyor)', ' (awaiting draw)') });
        const ii = ICUP_WEEKS.indexOf(w);
        if (ii >= 0 && S.icup && S.icup.cur < ii && Cups.alive(S.icup, cid)) out.push({ w, tbd: Cups.nameOf('imp') + ' — ' + ICUP_ROUNDS[ii] + tx(' (kura bekleniyor)', ' (awaiting draw)') });
      }
    }
    return out;
  },
  compName(comp) {
    if (comp.type === 'league') { const lg = S.leagues[comp.lg]; return TIERS[lg.tier].s + ' · ' + tx((comp.round + 1) + '. Maç', 'Match ' + (comp.round + 1)); }
    if (comp.type === 'rcup') return Cups.nameOf(comp.key) + ' · ' + RCUP_ROUNDS[comp.round];
    return Cups.nameOf('imp') + ' · ' + ICUP_ROUNDS[comp.round];
  },
  pressure(comp) {
    if (comp.type === 'league') return 0.3;
    const rounds = comp.type === 'rcup' ? RCUP_ROUNDS.length : ICUP_ROUNDS.length;
    if (comp.round === rounds - 1) return 1;
    if (comp.round === rounds - 2) return 0.75;
    return 0.5;
  }
};

// ---------------------------------------------------------------- matches
const MatchSystem = {
  seedFor(m, comp) {
    return hashStr(S.seed + ':' + S.season + ':' + S.week + ':' + comp.type + ':' + m.h + '-' + m.a);
  },
  // returns 3 fighters (real healthy gladiators first, then temporary arena fighters)
  lineupGlads(club, seed) {
    const healthy = g => g && !g.injury;
    let ids = club.lineup.filter(id => club.roster.includes(id) && healthy(S.glads[id]));
    if (ids.length < 3) {
      const bench = club.roster.filter(id => !ids.includes(id) && healthy(S.glads[id]))
        .sort((a, b) => Squad.readiness(S.glads[b]) - Squad.readiness(S.glads[a]));
      while (ids.length < 3 && bench.length) ids.push(bench.shift());
    }
    const glads = ids.map(id => S.glads[id]);
    let k = 0;
    while (glads.length < 3) glads.push(GladiatorGenerator.tempFighter(club.tier, seed, k++));
    return glads;
  },
  sideSetup(club, opp, seed, auto) {
    let tactic = club.tactic;
    if (!club.isPlayer || club.autoManage) tactic = ClubAI.chooseTactic(club, opp);
    return {
      cid: club.id, name: club.n, tactic, auto, colors: [club.crest.c1, club.crest.c2],
      glads: this.lineupGlads(club, seed)
    };
  },
  build(m, comp, opts = {}) {
    const seed = this.seedFor(m, comp);
    const H = S.clubs[m.h], A = S.clubs[m.a];
    const live = opts.live && (H.isPlayer || A.isPlayer);
    const setup = {
      seed, pressure: Calendar.pressure(comp), headless: !live,
      sides: [
        this.sideSetup(H, A, seed, !(live && H.isPlayer)),
        this.sideSetup(A, H, seed, !(live && A.isPlayer))
      ]
    };
    return setup;
  },
  playHeadless(m, comp) {
    const setup = this.build(m, comp, { live: false });
    const match = CombatEngine.create(setup);
    const res = CombatEngine.run(match);
    this.record(m, comp, res, setup);
    return res;
  },
  // store the result and apply all post-match consequences exactly once
  record(m, comp, res, setup) {
    if (m.r) return; // idempotent: never double-record
    m.r = {
      w: res.w, hs: res.surv[0], as: res.surv[1], hk: res.ko[0], ak: res.ko[1],
      hh: Math.round(res.hpp[0] * 100), ah: Math.round(res.hpp[1] * 100), t: Math.round(res.t), y: res.why
    };
    const H = S.clubs[m.h], A = S.clubs[m.a];
    const winC = res.w === 0 ? H : A, loseC = res.w === 0 ? A : H;
    const ovrH = Squad.teamOvr(setup.sides[0].glads), ovrA = Squad.teamOvr(setup.sides[1].glads);
    const isLeague = comp.type === 'league';
    // gladiator consequences
    for (const u of res.units) {
      if (u.temp) continue;
      const g = S.glads[u.gid]; if (!g) continue;
      const won = u.side === res.w;
      const oppOvr = u.side === 0 ? ovrA : ovrH;
      Progression.afterMatch(g, u, won, oppOvr, isLeague);
    }
    // club consequences
    for (const [c, side] of [[H, 0], [A, 1]]) {
      const won = res.w === side;
      if (won) c.st.w++; else c.st.l++;
      c.st.ko += res.ko[side];
      if (won && side === 0 && isLeague) c.st.homeW++;
      if (isLeague) Economy.credit(c, 'prizes', (won ? ECON.winPrize : ECON.lossPrize) * tierEco(c.tier));
      Reputation.afterMatch(c, won, side === 0 ? A : H);
      // win bonuses from contracts
      if (won) {
        const ids = setup.sides[side].glads.filter(g => !g.temp).map(g => g.id);
        for (const id of ids) { const g = S.glads[id]; if (g && g.con && g.con.winB > 0 && g.club === c.id) Economy.debit(c, 'bonuses', g.con.winB, true); }
      }
    }
    if (!m.nt) Economy.matchday(H, A, comp);
    // cup prize money for round winner
    if (comp.type === 'rcup') Economy.credit(winC, 'prizes', ECON.rcupPrize[comp.round] * Math.pow(tierEco(winC.tier), 0.7));
    if (comp.type === 'icup') Economy.credit(winC, 'prizes', ECON.icupPrize[comp.round]);
    Rivalry.add(H.id, A.id, comp.type === 'league' ? 1 : (comp.round >= 3 ? 6 : 3));
    Leagues.invalidate();
    News.onMatch(m, comp, res, H, A, ovrH, ovrA);
  }
};

// ---- 05_mgmt.js
/* =========================================================================
   Management systems: Squad, ProgressionManager, EconomyManager, Reputation,
   Sponsors, Staff, Facilities, EquipmentManager, Scouting, News
   ========================================================================= */

const Squad = {
  readiness(g) { return g ? g.ovr * (0.7 + 0.3 * num(g.cond, 100) / 100) * (g.injury ? 0 : 1) : 0; },
  teamOvr(glads) { return glads.length ? glads.reduce((a, g) => a + num(g.ovr), 0) / glads.length : 0; },
  avgOvr(club) { return this.teamOvr(GameState.rosterGlads(club)); },
  top3(club) {
    const gl = GameState.rosterGlads(club).sort((a, b) => b.ovr - a.ovr).slice(0, 3);
    return this.teamOvr(gl);
  },
  healthyCount(club) { return GameState.rosterGlads(club).filter(g => !g.injury).length; },
  fixLineup(club) {
    club.lineup = club.lineup.filter((id, i, arr) => club.roster.includes(id) && arr.indexOf(id) === i).slice(0, 3);
    if (club.lineup.length < 3) {
      const rest = club.roster.filter(id => !club.lineup.includes(id))
        .sort((a, b) => this.readiness(S.glads[b]) - this.readiness(S.glads[a]));
      while (club.lineup.length < 3 && rest.length) club.lineup.push(rest.shift());
    }
  },
  // swap two roster entries in the player's arrangement. slots 0..2 are aces, 3..4 bench
  arrangement(club) {
    const ids = club.lineup.slice(0, 3);
    while (ids.length < 3) ids.push(null);
    const bench = club.roster.filter(id => !ids.includes(id));
    return ids.concat(bench);
  },
  setArrangement(club, arr) {
    const valid = arr.filter(id => id != null && club.roster.includes(id));
    club.lineup = arr.slice(0, 3).filter(id => id != null && club.roster.includes(id));
    // roster order mirrors arrangement for readability
    club.roster = valid.concat(club.roster.filter(id => !valid.includes(id)));
  }
};

// ---------------------------------------------------------------- progression
const Progression = {
  growthMult(club) { return club ? Math.min(1.8, FAC.trainMult[club.fac.train] * (1 + club.staff.coach.q / 100 * 0.3)) : 0.9; },
  ageFactor(g) {
    const a = g.age - g.pk;
    return a <= -8 ? 1.35 : a <= -4 ? 1.2 : a <= -1 ? 1.0 : a <= 1 ? 0.6 : a <= 3 ? 0.3 : 0.1;
  },
  afterMatch(g, u, won, oppOvr, isLeague) {
    const rec = u.rec;
    const add = st => { st.m++; if (won) st.w++; st.ko += rec.ko; st.dmg += Math.round(rec.dmg); st.tk += Math.round(rec.tk); if (u.alive) st.sv++; st.blk += rec.blk; };
    if (isLeague) add(g.ss);
    add(g.cs);
    g.xp = num(g.xp) + 8 + (won ? 5 : 0) + rec.ko * 4 + clamp((oppOvr - g.ovr) * 0.4, -4, 8) + (u.alive ? 2 : 0);
    g.cond = clamp(Math.round(g.cond - (11 + (1 - u.hpf) * 11 + (1 - u.enf) * 6) * (g.age > 32 ? 1.1 : 1)), 0, 100);
    g.mor = clamp(Math.round(g.mor + (won ? 4 : -3) + rec.ko), 0, 100);
    if (won) g.cha = r1(Math.min(99, g.cha + 0.1 + rec.ko * 0.06));
    g.pw = S.season * 100 + S.week;
    if (g.ovr > num(g.peak)) g.peak = g.ovr;
    // injury roll — not automatic on elimination, depends on proneness, condition and damage taken
    const club = S.clubs[g.club];
    const p = 0.024 * g.inj * (1 + (1 - u.hpf) * 1.5) * (g.cond < 45 ? 1.5 : 1) * (u.alive ? 1 : 1.35) * (1 - Staff.injReduce(club));
    if (R.next() < p) {
      const r = R.next();
      const l = r < 0.72 ? 1 : r < 0.95 ? 2 : 3;
      const w = l === 1 ? 1 : l === 2 ? R.int(2, 3) : R.int(4, 6);
      g.injury = { l, w };
      if (g.club === S.player) GameState.news(() => tx(`${cn(g)} ${['', 'hafif', 'orta', 'ağır'][l]} sakatlık geçirdi (${w} hafta).`, `${cn(g)} suffered a ${['', 'minor', 'moderate', 'serious'][l]} injury (${w} week${w > 1 ? 's' : ''}).`), { p: 1, k: 'inj' });
    }
  },
  convertXP(g, club) {
    if (!(g.xp > 0)) { g.xp = 0; return; }
    const potF = g.pot > g.ovr ? clamp((g.pot - g.ovr) / 8, 0.04, 1) : 0;
    const pts = g.xp * 0.068 * g.grow * this.growthMult(club) * this.ageFactor(g) * potF;
    g.xp = 0;
    if (pts <= 0) return;
    const w = CLASSES[g.cls].w;
    const keys = ['str', 'end', 'agi', 'tec', 'dis'];
    for (let k = 0; k < 3; k++) {
      const key = R.weighted(keys, x => w[x] + 0.05);
      g[key] = r1(Math.min(98, g[key] + pts / 3));
    }
    g.ovr = r1(ovrOf(g));
    if (g.ovr > g.pot) g.pot = g.ovr;
    if (g.ovr > num(g.peak)) g.peak = g.ovr;
  },
  weeklyAll(matchWeek) {
    const wk = S.season * 100 + S.week;
    for (const id in S.glads) {
      const g = S.glads[id];
      const club = g.club >= 0 ? S.clubs[g.club] : null;
      // bench / free agents train a little on their own
      if (club) { if (g.pw !== wk) g.xp = num(g.xp) + 2.5; }
      else g.xp = num(g.xp) + 1;
      this.convertXP(g, club);
      // condition recovery
      const rec = club ? Staff.condRecovery(club) : 15;
      g.cond = clamp(Math.round(g.cond + rec * (g.age > 32 ? 0.85 : 1)), 0, 100);
      // injuries heal
      if (g.injury) {
        g.injury.w--;
        if (g.injury.w > 0 && club && R.next() < Staff.healChance(club)) g.injury.w--;
        if (g.injury.w <= 0) { g.injury = null; if (g.club === S.player) GameState.news(() => tx(`${cn(g)} sakatlığını atlattı ve maçlara hazır.`, `${cn(g)} has recovered from injury and is ready to fight.`), { p: 1, k: 'inj' }); }
      }
      // morale
      g.mor = g.mor + (62 - g.mor) * 0.1;
      if (club) {
        if (matchWeek && matchWeek.has(club.id) && g.pw !== wk && !g.injury) g.mor -= g.ovr > Squad.avgOvr(club) ? 2.5 : 1.5;
        if (club.arrears > 0) g.mor -= 6;
      } else g.fw = num(g.fw) + 1;
      g.mor = Math.round(clamp(g.mor, 0, 100));
      if (S.week % 5 === 0) g.ppot = r1(clamp(lerp(g.ppot, Math.max(g.pot, g.ovr), 0.08), g.ovr, 99));
      g.val = TransferMath.value(g);
    }
  },
  // season end: ageing, decline, retirement decision. Returns true if retiring
  ageAndRetire(g) {
    g.age++;
    const over = g.age - g.pk - 2;
    if (over > 0) {
      const d = over * 0.8 + R.range(0, 1.5);
      g.agi = r1(Math.max(5, g.agi - d * 1.0));
      g.end = r1(Math.max(5, g.end - d * 0.7));
      g.str = r1(Math.max(5, g.str - d * 0.5));
      g.tec = r1(Math.max(5, g.tec - d * 0.15));
      g.dis = r1(Math.max(5, g.dis - d * 0.1));
      g.ovr = r1(ovrOf(g));
      g.pot = r1(Math.max(g.ovr, g.pot - d));
      g.ppot = r1(Math.max(g.ovr, Math.min(g.ppot, g.pot + 3)));
    }
    const a = g.age;
    let p = a < 33 ? 0 : a === 33 ? 0.05 : a === 34 ? 0.1 : a === 35 ? 0.18 : a === 36 ? 0.3 : a === 37 ? 0.45 : a === 38 ? 0.62 : 0.85;
    if (a >= 31 && g.ovr < 30) p += 0.15;
    if (g.club < 0 && a >= 30) p += Math.min(0.4, num(g.fw) * 0.01);
    return R.next() < p;
  }
};

// ---------------------------------------------------------------- economy
const FIN_INC = { get sponsor() { return tx('Hami', 'Patron'); }, get tickets() { return tx('Bilet', 'Tickets'); }, get prizes() { return tx('Ödüller', 'Prize money'); }, get transfers() { return tx('Transfer satışı', 'Transfer sales'); }, get loan() { return tx('Yeniden finansman', 'Refinancing'); } };
const FIN_EXP = { get wages() { return tx('Maaşlar', 'Wages'); }, get staff() { return tx('Personel', 'Staff'); }, get ops() { return tx('İşletme', 'Operations'); }, get transfers() { return tx('Bonservis', 'Transfer fees'); }, get signing() { return tx('İmza parası', 'Signing fees'); }, get bonuses() { return tx('Bonuslar', 'Bonuses'); }, get facilities() { return tx('Tesisler', 'Facilities'); }, get equipment() { return tx('Ekipman', 'Equipment'); }, get loanpay() { return tx('Borç taksidi', 'Loan repayment'); }, get release() { return tx('Fesih', 'Contract terminations'); }, get scout() { return tx('Keşif', 'Scouting'); } };

const Economy = {
  blankFin() {
    const inc = {}, exp = {};
    for (const k in FIN_INC) inc[k] = 0;
    for (const k in FIN_EXP) exp[k] = 0;
    return { inc, exp };
  },
  staffWage(q) { return Math.round(8 * Math.pow(1.045, q)); },
  wageBill(club) { return GameState.rosterGlads(club).reduce((a, g) => a + (g.con ? g.con.wage : 0), 0); },
  staffBill(club) { return STAFF_IDS.reduce((a, s) => a + club.staff[s].w, 0); },
  upkeep(club) { return FAC_IDS.reduce((a, f) => a + FAC.upkeep[club.fac[f]] * (f === 'arena' ? 1.3 : 1), 0); },
  opsCost(club) { return Math.round(ECON.opsBase * tierEco(club.tier) + this.upkeep(club)); },
  weeklyCost(club) { return this.wageBill(club) + this.staffBill(club) + this.opsCost(club) + (club.loan ? club.loan.wk : 0); },
  credit(club, cat, amt) {
    amt = Math.round(num(amt));
    if (amt <= 0) return;
    club.budget += amt;
    club.weekFin.inc[cat] = (club.weekFin.inc[cat] || 0) + amt;
    club.seasonFin.inc[cat] = (club.seasonFin.inc[cat] || 0) + amt;
  },
  // pay an expense. Discretionary spending (force=false) fails if unaffordable; obligations (force=true) create arrears
  debit(club, cat, amt, force) {
    amt = Math.round(num(amt));
    if (amt <= 0) return true;
    if (!force && (club.budget < amt || (club.arrears > 0 && cat !== 'signing'))) return false;
    let paid = amt;
    if (club.budget < amt) { paid = Math.max(0, club.budget); club.arrears += amt - paid; }
    club.budget -= paid;
    club.weekFin.exp[cat] = (club.weekFin.exp[cat] || 0) + amt;
    club.seasonFin.exp[cat] = (club.seasonFin.exp[cat] || 0) + amt;
    return true;
  },
  canSpend(club, amt) { return club.arrears <= 0 && club.budget >= amt; },
  gateEstimate(H, A, comp) {
    const cap = FAC.capacity[H.fac.arena];
    const tbl = Leagues.table(S.leagues[H.lg]).find(r => r.cid === H.id);
    const form = tbl ? tbl.form.filter(x => x === 'G').length - tbl.form.filter(x => x === 'M').length : 0;
    const star = GameState.rosterGlads(H).reduce((a, g) => Math.max(a, g.cha), 0);
    let fill = 0.55 + H.rep / 250 + form * 0.025 + (star - 50) * 0.003 + Rivalry.get(H.id, A.id) / 400 + (A.rep - H.rep) / 600 + (comp && comp.type !== 'league' ? 0.06 : 0);
    fill = clamp(fill, 0.2, 1);
    const att = Math.min(cap, Math.round(H.fans * fill));
    const price = ECON.ticketPrice * (1 + FAC.ticketBonus[H.fac.arena]) * (1 + (H.rep - 50) / 400);
    return { att, cap, rev: Math.round(att * price), fill };
  },
  matchday(H, A, comp) {
    const g = this.gateEstimate(H, A, comp);
    this.credit(H, 'tickets', g.rev);
    H.lastGate = { att: g.att, cap: g.cap, rev: g.rev, s: S.season, w: S.week };
  },
  weekly(club) {
    // income
    const spon = club.isPlayer && !club.autoManage ? (club.sponsor ? club.sponsor.wk : 0) : Sponsors.aiWeekly(club);
    this.credit(club, 'sponsor', spon);
    // settle old arrears first
    if (club.arrears > 0 && club.budget > 0) {
      const p = Math.min(club.budget, club.arrears);
      club.budget -= p; club.arrears -= p;
    }
    this.debit(club, 'wages', this.wageBill(club), true);
    this.debit(club, 'staff', this.staffBill(club), true);
    this.debit(club, 'ops', this.opsCost(club), true);
    if (club.loan) {
      this.debit(club, 'loanpay', club.loan.wk, true);
      club.loan.left--;
      if (club.loan.left <= 0) { club.loan = null; if (club.isPlayer) GameState.news(() => tx('Yeniden finansman borcu tamamen ödendi.', 'The refinancing loan has been fully repaid.'), { p: 1, k: 'fin' }); }
    }
    club.arrears = Math.round(club.arrears);
    if (club.arrears > 0) {
      club.rep = clamp(club.rep - 0.4, 1, 99);
      if (club.isPlayer && !club.autoManage) GameState.news(() => tx(`Maaş borcu: ${fmtGold(club.arrears)}. Gladyatörlerin morali düşüyor, harcamalar durduruldu.`, `Wage arrears: ${fmtGold(club.arrears)}. Gladiator morale is falling and spending is frozen.`), { p: 1, k: 'fin' });
      // unbounded debt is not allowed: unpaid gladiators walk out once arrears exceed ~6 weeks of wages
      const wb = this.wageBill(club);
      if (club.arrears > Math.max(600, wb * 6)) {
        const gl = GameState.rosterGlads(club).sort((a, b) => (b.con.wage * (100 - b.loy)) - (a.con.wage * (100 - a.loy)))[0];
        if (gl) {
          const forgiven = Math.min(club.arrears, gl.con.wage * 6);
          club.arrears -= forgiven;
          GameState.news(() => tx(`${cn(gl)}, ödenmeyen maaşları nedeniyle ${cn(club)} ile sözleşmesini feshetti.`, `${cn(gl)} terminated his contract with ${cn(club)} over unpaid wages.`), { p: club.isPlayer ? 1 : 0, k: 'fin' });
          Transfer.detach(gl);
        }
      }
      if (!club.isPlayer || club.autoManage) this.aiRefinance(club);
    }
  },
  refinanceOffer(club) {
    if (club.loan || club.loanSeason === S.season) return null;
    const wc = this.weeklyCost(club);
    if (!(club.arrears > 0 || club.budget < wc * 3)) return null;
    const amount = Math.round((wc * 10 + club.arrears) / 10) * 10;
    return { amount, weeks: 20, wk: Math.round(amount * 1.2 / 20), total: Math.round(amount * 1.2) };
  },
  refinance(club) {
    const o = this.refinanceOffer(club);
    if (!o) return false;
    club.loan = { left: o.weeks, wk: o.wk, total: o.total, amount: o.amount };
    club.loanSeason = S.season;
    this.credit(club, 'loan', o.amount);
    const p = Math.min(club.budget, club.arrears); club.budget -= p; club.arrears -= p;
    club.rep = clamp(club.rep - 3, 1, 99);
    GameState.news(() => tx(`${cn(club)} Sarraflar Loncası'ndan ${fmtGold(o.amount)} yeniden finansman aldı.`, `${cn(club)} took ${fmtGold(o.amount)} of refinancing from the Moneylenders' Guild.`), { p: club.isPlayer ? 1 : 0, k: 'fin' });
    return true;
  },
  aiRefinance(club) { if (this.refinanceOffer(club)) this.refinance(club); },
  closeWeek(club) {
    if (club.isPlayer) {
      club.weekHist = club.weekHist || [];
      const inc = Object.values(club.weekFin.inc).reduce((a, b) => a + b, 0);
      const exp = Object.values(club.weekFin.exp).reduce((a, b) => a + b, 0);
      club.weekHist.push({ w: S.week, inc, exp, b: club.budget });
      if (club.weekHist.length > 32) club.weekHist.shift();
    }
    club.lastFin = club.weekFin;
    club.weekFin = this.blankFin();
  }
};

const Reputation = {
  afterMatch(c, won, opp) {
    const d = won ? 0.15 + Math.max(0, opp.rep - c.rep) * 0.02 : -0.1 - Math.max(0, c.rep - opp.rep) * 0.01;
    c.rep = r1(clamp(c.rep + d, 1, 99));
  },
  seasonEnd(c, rank, promoted, relegated) {
    let d = 0;
    if (rank === 1) d += 6; else if (rank <= 4) d += 1.5; else if (rank >= 7) d -= 2;
    if (promoted) d += 4; if (relegated) d -= 4;
    d += (TIERS[c.tier].rep - c.rep) * 0.1;
    c.rep = r1(clamp(c.rep + d, 1, 99));
    const played = Math.max(1, c.st.w + c.st.l);
    const T = TIERS[c.tier];
    let f = c.fans * (1 + (c.st.w / played - 0.5) * 0.25 + (promoted ? 0.15 : 0) - (relegated ? 0.12 : 0) + (rank === 1 ? 0.1 : 0));
    f = lerp(f, (T.fans[0] + T.fans[1]) / 2, 0.08);
    c.fans = Math.max(200, Math.round(f));
  }
};

// ---------------------------------------------------------------- sponsors
const Sponsors = {
  aiWeekly(club) { return Math.round(ECON.sponsorBase * tierEco(club.tier) * (0.8 + club.rep / 250) * 1.12); },
  expectedRank(club) {
    const lg = S.leagues[club.lg];
    const mine = Squad.top3(club);
    let better = 0;
    for (const cid of lg.clubs) if (cid !== club.id && Squad.top3(S.clubs[cid]) > mine) better++;
    return better + 1;
  },
  makeGoal(kind, club, e) {
    const pick = arr => R.pick(arr);
    let N, d;
    switch (kind) {
      case 'rank': N = clamp(e + pick([-1, 0, 1]), 1, 7); d = clamp(0.5 + (e - N) * 0.15, 0.1, 0.95); break;
      case 'title': N = 1; d = clamp(0.4 + (e - 1) * 0.12, 0.3, 0.97); break;
      case 'promo': N = 2; d = clamp(0.45 + (e - 2) * 0.12, 0.2, 0.95); break;
      case 'wins': { const ew = Math.round(14 * (8.5 - e) / 8); N = clamp(ew + pick([-1, 0, 1, 2]), 3, 13); d = clamp(0.5 + (N - ew) * 0.1, 0.1, 0.95); break; }
      case 'kos': { const ek = Math.round(14 * (1.2 + 1.4 * (8.5 - e) / 8)); N = clamp(ek + pick([-3, 0, 3, 5]), 8, 40); d = clamp(0.5 + (N - ek) * 0.04, 0.1, 0.95); break; }
      case 'cup': {
        const bye = club.tier <= 2;
        N = bye ? pick([2, 3, 4]) : pick([1, 2, 3]);
        d = clamp(0.3 + (N - (bye ? 2 : 1)) * 0.2 + (club.tier - 3) * 0.05, 0.1, 0.95);
        break;
      }
      case 'homewins': { const eh = Math.round(7 * (8.5 - e) / 8 + 0.5); N = clamp(eh + pick([-1, 0, 1]), 2, 7); d = clamp(0.5 + (N - eh) * 0.15, 0.1, 0.95); break; }
    }
    return { kind, N, d: r1(d) };
  },
  // goal text is rendered from kind/N so it follows the active language
  goalText(g) {
    if (!g) return '';
    const N = g.N;
    switch (g.kind) {
      case 'rank': return N === 1 ? tx('Lig şampiyonu ol', 'Win the league') : tx(`Ligi ilk ${N} sırada bitir`, `Finish in the top ${N}`);
      case 'title': return tx('Lig şampiyonu ol', 'Win the league');
      case 'promo': return tx('Üst lige yüksel (ilk 2)', 'Win promotion (top 2)');
      case 'wins': return tx(`En az ${N} lig maçı kazan`, `Win at least ${N} league matches`);
      case 'kos': return tx(`Ligde en az ${N} rakip ele`, `Eliminate at least ${N} opponents in the league`);
      case 'cup': return tx(`Bölgesel kupada ${RCUP_ROUNDS[N]} turuna ulaş`, `Reach the ${RCUP_ROUNDS[N]} of the regional cup`);
      case 'homewins': return tx(`Ev sahibi olarak en az ${N} lig maçı kazan`, `Win at least ${N} league matches at home`);
    }
    return txt(g.txt);
  },
  generateOffers() {
    const club = GameState.player();
    if (!club) return;
    const e = this.expectedRank(club);
    const types = R.shuffle(Object.keys(SPONSOR_TYPES).slice()).slice(0, 3);
    S.sponsorOffers = types.map(t => {
      const T = SPONSOR_TYPES[t];
      let kinds = T.goals.filter(k => !(k === 'promo' && club.tier === 1));
      const goal = this.makeGoal(R.pick(kinds), club, e);
      const wk = Math.round(ECON.sponsorBase * tierEco(club.tier) * (0.8 + club.rep / 250) * T.wk * R.range(0.95, 1.05));
      const bonus = Math.round(wk * 30 * (0.15 + goal.d * 0.7) * T.bonus / 10) * 10;
      return { t, n: T.n, wk, bonus, dur: R.int(T.dur[0], T.dur[1]), goal };
    });
  },
  accept(i) {
    const club = GameState.player();
    if (club.sponsor || !S.sponsorOffers[i]) return false;
    const o = S.sponsorOffers[i];
    club.sponsor = { ...o, left: o.dur, since: S.season, hits: 0 };
    S.sponsorOffers = [];
    GameState.news(() => tx(`${SPONSOR_TYPES[o.t].n} ile ${o.dur} sezonluk hami anlaşması imzalandı (haftalık ${fmtGold(o.wk)}).`, `Signed a ${o.dur}-season patron deal with the ${SPONSOR_TYPES[o.t].n} (${fmtGold(o.wk)} per week).`), { p: 1, k: 'spon' });
    return true;
  },
  progress(club) {
    const sp = club.sponsor; if (!sp) return null;
    const g = sp.goal;
    const row = Leagues.table(S.leagues[club.lg]).find(r => r.cid === club.id) || { rank: 8, w: 0, kf: 0 };
    let cur, ok;
    switch (g.kind) {
      case 'rank': case 'title': case 'promo': cur = tx(row.rank + '. sıra', 'position ' + row.rank); ok = row.rank <= g.N; break;
      case 'wins': cur = tx(row.w + ' galibiyet', row.w + ' wins'); ok = row.w >= g.N; break;
      case 'kos': cur = tx(row.kf + ' eleme', row.kf + ' eliminations'); ok = row.kf >= g.N; break;
      case 'homewins': cur = tx(club.st.homeW + ' ev galibiyeti', club.st.homeW + ' home wins'); ok = club.st.homeW >= g.N; break;
      case 'cup': { const rr = Cups.roundReached(S.rcups[club.reg], club.id); cur = rr >= 0 ? (rr >= RCUP_ROUNDS.length ? tx('Şampiyon', 'Champions') : RCUP_ROUNDS[rr]) : '-'; ok = rr >= g.N; break; }
    }
    return { cur, ok };
  },
  seasonEnd(club) {
    const sp = club.sponsor; if (!sp) return;
    const p = this.progress(club);
    if (p && p.ok) {
      this.credit(club, sp.bonus);
      sp.hits++;
      club.rep = clamp(club.rep + 1, 1, 99);
      GameState.news(() => tx(`${SPONSOR_TYPES[sp.t].n} hedefi tutturuldu: "${Sponsors.goalText(sp.goal)}". Ödül: ${fmtGold(sp.bonus)}.`, `${SPONSOR_TYPES[sp.t].n} target met: "${Sponsors.goalText(sp.goal)}". Reward: ${fmtGold(sp.bonus)}.`), { p: 1, k: 'spon' });
    } else GameState.news(() => tx(`${SPONSOR_TYPES[sp.t].n} sezon hedefi gerçekleşmedi: "${Sponsors.goalText(sp.goal)}".`, `${SPONSOR_TYPES[sp.t].n} season target missed: "${Sponsors.goalText(sp.goal)}".`), { p: 1, k: 'spon' });
    sp.left--;
  },
  credit(club, amt) { Economy.credit(club, 'sponsor', amt); },
  seasonStart(club) {
    if (club.sponsor && club.sponsor.left <= 0) {
      { const t = club.sponsor.t; GameState.news(() => tx(`${SPONSOR_TYPES[t].n} ile hami anlaşması sona erdi. Yeni teklifler sizi bekliyor.`, `The patron deal with the ${SPONSOR_TYPES[t].n} has ended. New offers await.`), { p: 1, k: 'spon' }); }
      club.sponsor = null;
    }
    if (club.sponsor) {
      // multi-season deals: refresh the goal against the new league situation
      const e = this.expectedRank(club);
      let kind = club.sponsor.goal.kind;
      if (kind === 'promo' && club.tier === 1) kind = 'rank';
      club.sponsor.goal = this.makeGoal(kind, club, e);
      club.sponsor.bonus = Math.round(club.sponsor.wk * 30 * (0.15 + club.sponsor.goal.d * 0.7) * SPONSOR_TYPES[club.sponsor.t].bonus / 10) * 10;
      S.sponsorOffers = [];
    } else this.generateOffers();
  }
};

// ---------------------------------------------------------------- staff & facilities
const Staff = {
  condRecovery(club) { return club ? 14 + FAC.medCond[club.fac.med] + club.staff.healer.q * 0.06 : 15; },
  healChance(club) { return club ? Math.min(0.75, FAC.medHeal[club.fac.med] + club.staff.healer.q * 0.003) : 0; },
  injReduce(club) { return club ? Math.min(0.3, FAC.medInj[club.fac.med] + club.staff.healer.q * 0.0012) : 0; },
  scoutAcc(club) { return club ? Math.min(0.75, FAC.scoutAcc[club.fac.scout] + club.staff.scout.q * 0.004) : 0; },
  hireCost(c) { return c.w * 6; },
  generateCandidates() {
    const club = GameState.player(); if (!club) return;
    const T = TIERS[club.tier];
    S.staffCands = {};
    for (const s of STAFF_IDS) {
      S.staffCands[s] = [0, 1, 2].map(k => WorldGenerator.staffMember(R.pick(REGIONS).id, R.range(T.staff[0] - 10 + k * 6, T.staff[1] + 4 + k * 5)));
    }
  },
  hire(type, idx) {
    const club = GameState.player();
    const c = S.staffCands && S.staffCands[type] && S.staffCands[type][idx];
    if (!c) return { ok: false, msg: tx('Aday bulunamadı.', 'Candidate not found.') };
    const cost = this.hireCost(c);
    if (!Economy.debit(club, 'staff', cost, false)) return { ok: false, msg: tx('Yetersiz bütçe (işe alım bedeli ', 'Not enough money (hiring fee ') + fmtGold(cost) + ').' };
    const old = club.staff[type];
    club.staff[type] = { n: c.n, q: c.q, w: c.w };
    S.staffCands[type].splice(idx, 1, old);
    GameState.news(() => tx(`${STAFF[type].name} olarak ${cn(c)} (kalite ${c.q}) göreve başladı.`, `${cn(c)} (quality ${c.q}) joined as ${STAFF[type].name}.`), { p: 1, k: 'club' });
    return { ok: true };
  }
};

const Facilities = {
  cost(club, fid) {
    const lv = club.fac[fid];
    if (lv >= 5) return 0;
    return Math.round(FAC.cost[lv + 1] * (fid === 'arena' ? 1.4 : 1));
  },
  effect(fid, lv, club) {
    switch (fid) {
      case 'train': return tx(`Gelişim çarpanı ×${FAC.trainMult[lv].toFixed(2)}`, `Development ×${FAC.trainMult[lv].toFixed(2)}`);
      case 'med': return tx(`Kondisyon +${FAC.medCond[lv]}/hafta · ek iyileşme %${Math.round(FAC.medHeal[lv] * 100)} · sakatlık riski -%${Math.round(FAC.medInj[lv] * 100)}`, `Condition +${FAC.medCond[lv]}/week · extra healing ${Math.round(FAC.medHeal[lv] * 100)}% · injury risk -${Math.round(FAC.medInj[lv] * 100)}%`);
      case 'scout': return tx(`${FAC.scoutRegions[lv]} bölge · haftada ${FAC.scoutReports[lv]} rapor · doğruluk +%${Math.round(FAC.scoutAcc[lv] * 100)}`, `${FAC.scoutRegions[lv]} region(s) · ${FAC.scoutReports[lv]} report(s)/week · accuracy +${Math.round(FAC.scoutAcc[lv] * 100)}%`);
      case 'arena': return tx(`Kapasite ${fmtInt(FAC.capacity[lv])} · bilet fiyatı +%${Math.round(FAC.ticketBonus[lv] * 100)}`, `Capacity ${fmtInt(FAC.capacity[lv])} · ticket price +${Math.round(FAC.ticketBonus[lv] * 100)}%`);
    }
    return '';
  },
  upgrade(club, fid) {
    const lv = club.fac[fid];
    if (lv >= 5) return { ok: false, msg: tx('Tesis en üst seviyede.', 'Facility is already at maximum level.') };
    const cost = this.cost(club, fid);
    if (club.arrears > 0) return { ok: false, msg: tx('Maaş borcu varken yatırım yapılamaz.', 'No investments while wages are in arrears.') };
    if (!Economy.debit(club, 'facilities', cost, false)) return { ok: false, msg: tx('Yetersiz bütçe.', 'Not enough money.') };
    club.fac[fid] = lv + 1;
    if (club.isPlayer) GameState.news(() => tx(`${FACILITIES[fid].name} ${lv + 1}. seviyeye yükseltildi.`, `${FACILITIES[fid].name} upgraded to level ${lv + 1}.`), { p: 1, k: 'club' });
    return { ok: true };
  }
};

// ---------------------------------------------------------------- equipment
const Equipment = {
  bonuses(g) {
    const b = { dmg: 0, armor: 0, hp: 0, block: 0, eva: 0, acc: 0, crit: 0, spd: 0, special: 0 };
    if (!g || !g.eq || !S) return b;
    for (const slot of ['w', 'a', 'x']) {
      const it = S.items[g.eq[slot]];
      if (!it) continue;
      const T = ITEM_TYPES[it.t]; if (!T) continue;
      const q = it.q + 1, p = it.p;
      b.dmg += (T.dmg || 0) * (q * 0.45 + p * 0.2);
      b.armor += (T.armor || 0) * (q * 1.2 + p * 0.4);
      b.hp += (T.hp || 0) * (q * 0.6 + p * 0.3);
      b.block += (T.block || 0) * (q + p * 0.3);
      b.eva += (T.eva || 0) * (q + p * 0.3);
      b.acc += (T.acc || 0) * (q + p * 0.3);
      b.crit += (T.crit || 0) * (q + p * 0.3);
      b.spd += (T.spd || 0);
      b.special += (T.special || 0) * (q * 0.5 + p * 0.2);
    }
    return b;
  },
  statLine(it) {
    const T = ITEM_TYPES[it.t], q = it.q + 1, p = it.p, out = [];
    const pct = (tr, en, v) => tx(tr + ' +%' + v, en + ' +' + v + '%');
    if (T.dmg) out.push(tx('Hasar +', 'Damage +') + r1(T.dmg * (q * 0.45 + p * 0.2)));
    if (T.armor) out.push(tx('Zırh +', 'Armour +') + r1(T.armor * (q * 1.2 + p * 0.4)));
    if (T.hp) out.push(tx('Can +', 'Health +') + r1(T.hp * (q * 0.6 + p * 0.3)));
    if (T.block) out.push(pct('Blok', 'Block', r1(T.block * (q + p * 0.3) * 100)));
    if (T.eva) out.push(pct('Kaçınma', 'Evasion', r1(T.eva * (q + p * 0.3) * 100)));
    if (T.acc) out.push(pct('İsabet', 'Accuracy', r1(T.acc * (q + p * 0.3) * 100)));
    if (T.crit) out.push(pct('Kritik', 'Critical', r1(T.crit * (q + p * 0.3) * 100)));
    if (T.special) out.push(pct('Teknik etkisi', 'Technique effect', r1(T.special * (q * 0.5 + p * 0.2) * 100)));
    if (T.spd) out.push(tx('Hız %', 'Speed ') + r1(T.spd * 100) + tx('', '%'));
    return out.join(' · ');
  },
  price(type, q) { const T = ITEM_TYPES[type]; return Math.round(QUALITIES[q].price * (T.slot === 'a' ? 1.1 : T.slot === 'x' ? 0.9 : 1)); },
  upgradeCost(it) { return Math.round(this.price(it.t, it.q) * 0.3 * Math.pow(it.p + 1, 1.5) / 10) * 10; },
  sellValue(it) { return Math.round((this.price(it.t, it.q) + it.p * this.upgradeCost({ ...it, p: Math.max(0, it.p - 1) }) * 0.5) * 0.35 / 10) * 10; },
  repNeeded(q) { return [0, 0, 15, 35, 55][q]; },
  name(it) { return QUALITIES[it.q].n + ' ' + ITEM_TYPES[it.t].n + (it.p ? ' +' + it.p : ''); },
  fits(it, g) { const T = ITEM_TYPES[it.t]; return T && T.cls.includes(g.cls); },
  equip(itemId, gid, silent) {
    const it = S.items[itemId], g = S.glads[gid];
    if (!it || !g) return { ok: false, msg: tx('Geçersiz seçim.', 'Invalid selection.') };
    if (it.club !== g.club) return { ok: false, msg: tx('Ekipman bu kulübe ait değil.', 'This equipment does not belong to the club.') };
    if (!this.fits(it, g)) return { ok: false, msg: tx(`${CLASSES[g.cls].name} bu ekipmanı kullanamaz.`, `A ${CLASSES[g.cls].name} cannot use this equipment.`) };
    const slot = ITEM_TYPES[it.t].slot;
    if (it.g && S.glads[it.g]) S.glads[it.g].eq[slot] = 0;
    const prev = S.items[g.eq[slot]]; if (prev) prev.g = 0;
    g.eq[slot] = it.id; it.g = g.id;
    return { ok: true };
  },
  unequip(itemId) {
    const it = S.items[itemId]; if (!it) return;
    const g = S.glads[it.g];
    if (g) { const slot = ITEM_TYPES[it.t].slot; if (g.eq[slot] === it.id) g.eq[slot] = 0; }
    it.g = 0;
  },
  unequipAll(g) { for (const slot of ['w', 'a', 'x']) { const it = S.items[g.eq[slot]]; if (it) it.g = 0; g.eq[slot] = 0; } },
  buy(club, type, q) {
    if (club.rep < this.repNeeded(q)) return { ok: false, msg: tx(`${QUALITIES[q].n} ekipman için en az ${this.repNeeded(q)} itibar gerekir.`, `${QUALITIES[q].n} equipment requires at least ${this.repNeeded(q)} reputation.`) };
    const cost = this.price(type, q);
    if (club.arrears > 0) return { ok: false, msg: tx('Maaş borcu varken harcama yapılamaz.', 'No spending while wages are in arrears.') };
    if (!Economy.debit(club, 'equipment', cost, false)) return { ok: false, msg: tx('Yetersiz bütçe.', 'Not enough money.') };
    const it = WorldGenerator.addItem(club, type, q, 0);
    return { ok: true, item: it };
  },
  upgrade(club, itemId) {
    const it = S.items[itemId];
    if (!it || it.club !== club.id) return { ok: false, msg: tx('Geçersiz ekipman.', 'Invalid equipment.') };
    if (it.p >= 5) return { ok: false, msg: tx('Ekipman en üst seviyede (+5).', 'Equipment is already at maximum (+5).') };
    const cost = this.upgradeCost(it);
    if (club.arrears > 0) return { ok: false, msg: tx('Maaş borcu varken harcama yapılamaz.', 'No spending while wages are in arrears.') };
    if (!Economy.debit(club, 'equipment', cost, false)) return { ok: false, msg: tx('Yetersiz bütçe.', 'Not enough money.') };
    it.p++;
    return { ok: true };
  },
  sell(club, itemId) {
    const it = S.items[itemId];
    if (!it || it.club !== club.id) return { ok: false };
    const v = this.sellValue(it);
    this.unequip(itemId);
    delete S.items[itemId];
    Economy.credit(club, 'transfers', v);
    return { ok: true, v };
  },
  clubItems(club) { return Object.values(S.items).filter(it => it.club === club.id); },
  // AI: equip best compatible unequipped items onto roster
  autoEquip(club) {
    const items = this.clubItems(club);
    if (!items.length) return;
    const score = it => it.q * 10 + it.p * 3;
    for (const g of GameState.rosterGlads(club)) {
      for (const slot of ['w', 'a', 'x']) {
        const cur = S.items[g.eq[slot]];
        let best = cur || null;
        for (const it of items) {
          if (ITEM_TYPES[it.t].slot !== slot || !this.fits(it, g)) continue;
          if (it.g && it.g !== g.id) continue;
          if (!best || score(it) > score(best)) best = it;
        }
        if (best && best !== cur) this.equip(best.id, g.id);
      }
    }
  }
};

// ---------------------------------------------------------------- scouting
const Scouting = {
  level(g) {
    if (!g) return 0;
    let l = S.scout[g.id] || 0;
    if (g.club === S.player) {
      l = Math.max(l, 2);
      if (g.joined && (S.season - g.joined.s) * 30 + (S.week - g.joined.w) >= 10) l = 3;
    }
    return l;
  },
  regions() {
    const c = GameState.player(); if (!c) return REGIONS.map(r => r.id);
    const n = FAC.scoutRegions[c.fac.scout];
    const ids = [c.reg].concat(REGIONS.map(r => r.id).filter(r => r !== c.reg));
    return ids.slice(0, n);
  },
  canSee(g) {
    if (!g) return false;
    if (g.club < 0 || g.club === S.player) return true;
    return this.regions().includes(S.clubs[g.club].reg);
  },
  potRange(g) {
    const lvl = this.level(g);
    const acc = Staff.scoutAcc(GameState.player());
    const err = [16, 10, 6, 2.5][lvl] * (1 - acc);
    const base = lvl === 0 ? g.ppot : g.pot;
    const off = (hash01(g.id, lvl * 13 + 7) - 0.5) * err;
    const c = base + off;
    let lo = Math.round(Math.max(g.ovr, c - err / 2)), hi = Math.round(Math.min(99, Math.max(g.ovr, c + err / 2)));
    if (hi < lo) hi = lo;
    return [lo, hi];
  },
  potMid(g) { const r = this.potRange(g); return (r[0] + r[1]) / 2; },
  trait(g, key) {
    const lvl = this.level(g);
    if (lvl < 2) return '?';
    const raw = { inj: (g.inj - 0.5) / 1.4 * 100, loy: g.loy, clu: g.clu, grow: (g.grow - 0.6) / 0.85 * 100 }[key];
    const noise = lvl === 2 ? (hash01(g.id, key.length * 31) - 0.5) * 30 : 0;
    const v = raw + noise;
    return v < 33 ? tx('Düşük', 'Low') : v < 66 ? tx('Orta', 'Medium') : tx('Yüksek', 'High');
  },
  reportCost() { const c = GameState.player(); return Math.round(40 * Math.pow(tierEco(c.tier), 0.6) / 5) * 5; },
  reportsLeft() { const c = GameState.player(); return Math.max(0, FAC.scoutReports[c.fac.scout] - num(S.scoutUsed)); },
  report(g) {
    const c = GameState.player();
    if (this.level(g) >= 3) return { ok: false, msg: tx('Bu gladyatör hakkında bilgiler zaten çok net.', 'Information on this gladiator is already very precise.') };
    if (this.reportsLeft() <= 0) return { ok: false, msg: tx('Bu haftaki keşif raporu hakkınız doldu.', 'No scouting reports left this week.') };
    if (!this.canSee(g)) return { ok: false, msg: tx('Keşif ağınız bu bölgeyi kapsamıyor.', 'Your scouting network does not cover this region.') };
    const cost = this.reportCost();
    if (!Economy.debit(c, 'scout', cost, false)) return { ok: false, msg: tx('Yetersiz bütçe.', 'Not enough money.') };
    S.scout[g.id] = Math.min(3, this.level(g) + 1);
    S.scoutUsed = num(S.scoutUsed) + 1;
    return { ok: true };
  }
};

// ---------------------------------------------------------------- news (generated only from real events)
const News = {
  onMatch(m, comp, res, H, A, ovrH, ovrA) {
    const W = res.w === 0 ? H : A, L = res.w === 0 ? A : H;
    const sc = `${Math.max(res.surv[0], res.surv[1])}-${Math.min(res.surv[0], res.surv[1])}`;
    if (H.isPlayer || A.isPlayer) {
      const me = H.isPlayer ? H : A;
      const opp = H.isPlayer ? A : H;
      const rivalry = Rivalry.get(H.id, A.id) >= 35;
      GameState.news(() => tx(`${Calendar.compName(comp)}: ${cn(me)} ${W === me ? 'kazandı' : 'kaybetti'} — ${cn(opp)} karşısında ${sc}${rivalry ? ' (rekabet maçı)' : ''}.`, `${Calendar.compName(comp)}: ${cn(me)} ${W === me ? 'won' : 'lost'} ${sc} against ${cn(opp)}${rivalry ? ' (rivalry match)' : ''}.`), { p: 1, k: 'match' });
    }
    if (comp.type !== 'league' && W.tier - L.tier >= 2) {
      GameState.news(() => tx(`${Cups.nameOf(comp.key)}'nda sürpriz: ${TIERS[W.tier].s} ekibi ${cn(W)}, ${TIERS[L.tier].s} ekibi ${cn(L)}'yi eledi!`, `Upset in the ${Cups.nameOf(comp.key)}: ${TIERS[W.tier].s} side ${cn(W)} knocked out ${TIERS[L.tier].s} side ${cn(L)}!`), { k: 'cup', p: W.isPlayer || L.isPlayer });
    }
  }
};

// ---- 06_transfer.js
/* =========================================================================
   TransferManager (Transfer) + ClubAI
   ========================================================================= */

const Transfer = {
  windowId() { return S.season * 10 + (S.week <= 1 ? 0 : 1); },
  attach(g, club, con, silent) {
    g.club = club.id;
    g.con = { wage: Math.max(1, Math.round(num(con.wage, 20))), yrs: clamp(con.yrs | 0, 1, 5), sign: Math.round(num(con.sign)), winB: Math.round(num(con.winB, Math.round(con.wage * 0.25))), titleB: Math.round(num(con.titleB, Math.round(con.wage * 4))) };
    if (!club.roster.includes(g.id)) club.roster.push(g.id);
    g.joined = { s: S.season, w: S.week };
    g.fw = 0;
    g.hist.push({ s: S.season, w: S.week, c: club.id });
    if (g.hist.length > 20) g.hist.shift();
  },
  detach(g, opts = {}) {
    const club = g.club >= 0 ? S.clubs[g.club] : null;
    if (club) {
      club.roster = club.roster.filter(id => id !== g.id);
      club.lineup = club.lineup.filter(id => id !== g.id);
      Equipment.unequipAll(g);
      if (!club.isPlayer || club.autoManage) ClubAI.pickLineup(club); else Squad.fixLineup(club);
    }
    g.club = -1; g.con = null; g.fw = 0;
    delete S.nego[g.id];
  },
  record(g, from, to, fee, type) {
    const rec = { s: S.season, w: S.week, g: g.id, n: g.n, f: from, t: to, fee: Math.round(fee), ty: type, ovr: Math.round(g.ovr) };
    S.transfers.unshift(rec);
    if (S.transfers.length > 400) S.transfers.length = 400;
    const r = S.hist.records;
    if (fee > 0 && (!r.bigTransfer || fee > r.bigTransfer.fee)) r.bigTransfer = rec;
  },
  // full move from seller (may be -1 for free agent) to buyer
  execute(g, buyer, fee, con, type) {
    const fromId = g.club;
    const seller = fromId >= 0 ? S.clubs[fromId] : null;
    if (buyer.roster.length >= 5) return { ok: false, msg: tx('Kadro dolu (en fazla 5 gladyatör).', 'Squad is full (maximum 5 gladiators).') };
    if (fee > 0) {
      if (!Economy.debit(buyer, 'transfers', fee, false)) return { ok: false, msg: tx('Bonservis için yeterli bütçe yok.', 'Not enough money for the transfer fee.') };
      if (seller) Economy.credit(seller, 'transfers', fee);
    }
    if (con.sign > 0) {
      if (!Economy.debit(buyer, 'signing', con.sign, false)) {
        if (fee > 0) { buyer.budget += fee; if (seller) seller.budget -= fee; }
        return { ok: false, msg: tx('İmza parası için yeterli bütçe yok.', 'Not enough money for the signing fee.') };
      }
    }
    this.detach(g, { reason: 'transfer' });
    this.attach(g, buyer, con);
    if (!buyer.isPlayer || buyer.autoManage) { ClubAI.pickLineup(buyer); Equipment.autoEquip(buyer); } else Squad.fixLineup(buyer);
    this.record(g, fromId, buyer.id, fee, type);
    if (seller) Rivalry.add(seller.id, buyer.id, fee > TransferMath.value(g) * 0.8 && g.ovr > TIERS[buyer.tier].ovr + 3 ? 5 : 1);
    const big = fee >= 12000 || g.ovr >= 75;
    if (buyer.isPlayer || (seller && seller.isPlayer)) {
      GameState.news(() => fromId >= 0
        ? tx(`${cn(g)} (${CLASSES[g.cls].name}, ${Math.round(g.ovr)}) ${cn(seller)} → ${cn(buyer)} transferi tamamlandı. Bonservis: ${fmtGold(fee)}.`, `${cn(g)} (${CLASSES[g.cls].name}, ${Math.round(g.ovr)}) completed the move ${cn(seller)} → ${cn(buyer)}. Fee: ${fmtGold(fee)}.`)
        : tx(`Serbest gladyatör ${cn(g)} (${CLASSES[g.cls].name}, ${Math.round(g.ovr)}) ${cn(buyer)} ile sözleşme imzaladı.`, `Free agent ${cn(g)} (${CLASSES[g.cls].name}, ${Math.round(g.ovr)}) signed for ${cn(buyer)}.`), { p: 1, k: 'transfer' });
    } else if (big) {
      GameState.news(() => tx(`${REGION_BY_ID[buyer.reg].name}: ${seller ? cn(seller) + ' kulübünün yıldızı ' : ''}${cn(g)}, ${cn(buyer)}'e ${fee ? fmtGold(fee) + ' bedelle ' : ''}transfer oldu.`, `${REGION_BY_ID[buyer.reg].name}: ${seller ? cn(seller) + '\'s star ' : ''}${cn(g)} moved to ${cn(buyer)}${fee ? ' for ' + fmtGold(fee) : ''}.`), { k: 'transfer' });
    }
    if (buyer.isPlayer) S.scout[g.id] = Math.max(S.scout[g.id] || 0, 2);
    return { ok: true };
  },

  // ---------- club side (bonservis)
  askingPrice(seller, g) {
    let f = 1.15;
    if (seller.lineup.includes(g.id)) f *= 1.3;
    if (seller.roster.length <= 3) f *= 1.5;
    if (g.con && g.con.yrs <= 1) f *= 0.8;
    if (seller.arrears > 0 || seller.budget < Economy.weeklyCost(seller) * 3) f *= 0.85;
    if (seller.pol === 'econ') f *= 0.95;
    if (seller.pol === 'rich') f *= 1.25;
    f *= 0.97 + hash01(g.id, this.windowId()) * 0.08;
    return Math.round(TransferMath.value(g) * f / 50) * 50;
  },
  evaluateBid(seller, g, fee) {
    const ask = this.askingPrice(seller, g);
    const ratio = fee / ask;
    if (ratio >= 1) return { res: 'accept', ask };
    if (ratio >= 0.75) return { res: 'counter', ask, counter: ask };
    return { res: 'reject', ask };
  },

  // ---------- gladiator side (contract)
  prefYears(g) { return g.age <= 24 ? 2 : g.age <= 31 ? 3 : 2; },
  demand(g, club, renewal) {
    let m = 1;
    const cur = g.club >= 0 ? S.clubs[g.club] : null;
    if (cur && !renewal) {
      const diff = club.tier - cur.tier;
      if (diff > 0) m *= 1 + 0.14 * diff; else if (diff < 0) m *= Math.max(0.82, 1 + 0.05 * diff);
      m *= 1 + (g.loy - 50) / 400;
    }
    m *= 1 + (45 - club.rep) * 0.0025;
    if (renewal) { m *= 1 - (g.loy - 50) / 300; m *= 1 + (60 - g.mor) / 300; }
    if (!cur) m *= 1 - Math.min(0.3, num(g.fw) * 0.012);
    if (club.arrears > 0) m *= 1.15;
    // ambition: a fighter far above the club's league level wants a premium to join (or stay)
    const gap = g.ovr - TIERS[club.tier].ovr - 12;
    if (gap > 0) m *= 1 + gap * (renewal ? 0.015 : 0.035);
    const wage = Math.max(10, Math.round(TransferMath.expectedWage(g) * m));
    const free = !cur;
    return { wage, yrs: this.prefYears(g), sign: Math.round(wage * (free ? 8 : renewal ? 3 : 4)), winB: Math.round(wage * 0.25), titleB: Math.round(wage * 4) };
  },
  offerValue(o, pref) {
    return (o.wage + o.sign / (30 * clamp(o.yrs, 1, 3)) * 0.9 + o.winB * 0.35 + o.titleB * 0.04) * (1 - 0.04 * Math.abs(o.yrs - pref));
  },
  evaluateContract(g, club, offer, nego, renewal) {
    const d = this.demand(g, club, renewal);
    const pref = d.yrs;
    const need = this.offerValue({ ...d, winB: d.winB, titleB: d.titleB }, pref);
    const got = this.offerValue(offer, pref);
    const ratio = got / need;
    const tol = (hash01(g.id, this.windowId() + 3) - 0.5) * 0.06;
    if (ratio >= 1 + tol) return { res: 'accept', d };
    if (nego) nego.pat -= ratio >= 0.8 ? 1 : 2;
    if (nego && nego.pat <= 0) return { res: 'walk', d };
    // the wage that would satisfy him with the other terms unchanged
    const otherParts = got / (1 - 0.04 * Math.abs(offer.yrs - pref)) - offer.wage;
    const needWage = Math.ceil((need * (1 + tol) / (1 - 0.04 * Math.abs(offer.yrs - pref)) - otherParts) / 5) * 5;
    return { res: 'counter', d, needWage: Math.max(offer.wage + 5, needWage), insult: ratio < 0.8 };
  },
  // ---------- player-facing negotiation flow
  nego(gid) {
    let n = S.nego[gid];
    if (n && n.win !== this.windowId() && !n.renew) { delete S.nego[gid]; n = null; }
    return n;
  },
  startNego(g, renew) {
    const n = { gid: g.id, win: this.windowId(), stage: renew || g.club < 0 ? 'contract' : 'fee', fee: 0, tries: 0, pat: 2 + Math.round(g.loy / 40), blocked: false, renew: !!renew, counter: 0, msg: '' };
    S.nego[g.id] = n;
    return n;
  },
  canBuy(g) {
    const me = GameState.player();
    if (!g) return tx('Gladyatör bulunamadı.', 'Gladiator not found.');
    if (g.club === me.id) return tx('Bu gladyatör zaten kulübünüzde.', 'This gladiator is already at your club.');
    if (!Calendar.isWindow()) return tx('Transfer dönemi kapalı. ', 'The transfer window is closed. ') + Calendar.windowLabel() + '.';
    if (me.roster.length >= 5) return tx('Kadronuz dolu (5/5). Önce kadroda yer açmalısınız.', 'Your squad is full (5/5). Free up a place first.');
    if (!Scouting.canSee(g)) return tx('Keşif ağınız bu bölgeyi kapsamıyor. Keşif Merkezi\'ni geliştirin.', 'Your scouting network does not cover this region. Upgrade the Scouting Centre.');
    if (me.arrears > 0 && g.club >= 0) return tx('Maaş borcu varken bonservisli transfer yapılamaz (serbest gladyatörlerle görüşebilirsiniz).', 'No fee-paying transfers while wages are in arrears (you can still talk to free agents).');
    const n = this.nego(g.id);
    if (n && n.blocked) return tx('Bu gladyatörle ilgili görüşmeler bu transfer döneminde sona erdi.', 'Talks with this gladiator are over for this transfer window.');
    return null;
  },
  bidFee(g, fee) {
    const me = GameState.player();
    const err = this.canBuy(g); if (err) return { ok: false, msg: err };
    const n = this.nego(g.id) || this.startNego(g);
    fee = Math.max(0, Math.round(num(fee)));
    if (fee > me.budget) return { ok: false, msg: tx('Teklif bütçenizi aşıyor.', 'The offer exceeds your budget.') };
    const seller = S.clubs[g.club];
    const r = this.evaluateBid(seller, g, fee);
    n.tries++;
    if (r.res === 'accept') { n.stage = 'contract'; n.fee = fee; n.msg = bi(() => tx(`${cn(seller)} ${fmtGold(fee)} bonservis teklifini kabul etti. Şimdi gladyatörle sözleşme görüşmesi yapın.`, `${cn(seller)} accepted the ${fmtGold(fee)} fee. Now negotiate a contract with the gladiator.`)); }
    else if (r.res === 'counter') { n.counter = r.counter; n.msg = bi(() => tx(`${cn(seller)} karşı teklif verdi: ${fmtGold(r.counter)}.`, `${cn(seller)} made a counter-offer: ${fmtGold(r.counter)}.`)); }
    else { if (fee < r.ask * 0.5) n.tries++; }
    const cut = r.res !== 'accept' && n.tries >= 4;
    if (r.res === 'reject' || cut) n.msg = bi(() => (r.res === 'reject' ? tx(`${cn(seller)} teklifi reddetti. Bu gladyatörü bu fiyata satmayı düşünmüyorlar.`, `${cn(seller)} rejected the offer. They won't sell at that price.`) : txt(n.msg)) + (cut ? tx(' Kulüp görüşmeleri kesti.', ' The club has ended talks.') : ''));
    if (cut) n.blocked = true;
    return { ok: true, res: r.res, n };
  },
  acceptCounter(g) {
    const n = this.nego(g.id);
    if (!n || !n.counter) return { ok: false, msg: tx('Karşı teklif yok.', 'There is no counter-offer.') };
    if (n.counter > GameState.player().budget) return { ok: false, msg: tx('Bütçeniz yetersiz.', 'Your budget is insufficient.') };
    n.fee = n.counter; n.stage = 'contract'; n.msg = bi(() => tx('Bonservis anlaşması sağlandı. Şimdi sözleşmeyi görüşün.', 'Fee agreed. Now negotiate the contract.'));
    return { ok: true };
  },
  offerContract(g, offer) {
    const me = GameState.player();
    const n = this.nego(g.id) || this.startNego(g, g.club === me.id);
    const renew = g.club === me.id;
    if (!renew) { const err = this.canBuy(g); if (err) return { ok: false, msg: err }; }
    if (n.blocked) return { ok: false, msg: tx('Görüşmeler sona erdi.', 'Talks are over.') };
    if (n.stage !== 'contract') return { ok: false, msg: tx('Önce kulüple bonservis konusunda anlaşmalısınız.', 'First agree a transfer fee with the club.') };
    offer = { wage: Math.max(1, Math.round(num(offer.wage))), yrs: clamp(Math.round(num(offer.yrs, 1)), 1, 4), sign: Math.max(0, Math.round(num(offer.sign))), winB: Math.max(0, Math.round(num(offer.winB))), titleB: Math.max(0, Math.round(num(offer.titleB))) };
    if (offer.sign + n.fee > me.budget) return { ok: false, msg: tx('Bonservis + imza parası bütçenizi aşıyor.', 'Fee + signing bonus exceed your budget.') };
    const r = this.evaluateContract(g, me, offer, n, renew);
    if (r.res === 'accept') {
      if (renew) {
        if (offer.sign > 0 && !Economy.debit(me, 'signing', offer.sign, false)) return { ok: false, msg: tx('İmza parası için bütçe yetersiz.', 'Not enough money for the signing bonus.') };
        g.con = { ...offer };
        g.mor = clamp(g.mor + 5, 0, 100);
        delete S.nego[g.id];
        GameState.news(() => tx(`${cn(g)} sözleşmesini ${offer.yrs} sezon uzattı (haftalık ${fmtGold(offer.wage)}).`, `${cn(g)} extended his contract by ${offer.yrs} season(s) (${fmtGold(offer.wage)} per week).`), { p: 1, k: 'transfer' });
        return { ok: true, res: 'accept', done: true };
      }
      const ex = this.execute(g, me, n.fee, offer, g.club < 0 ? 'free' : 'transfer');
      if (!ex.ok) return ex;
      delete S.nego[g.id];
      return { ok: true, res: 'accept', done: true };
    }
    if (r.res === 'walk') { n.blocked = true; n.msg = bi(() => tx(`${cn(g)} görüşme masasından kalktı. Bu dönemde yeniden görüşmeyecek.`, `${cn(g)} walked away from the table and won't talk again this window.`)); return { ok: true, res: 'walk', n }; }
    n.msg = bi(() => (r.insult ? tx('Bu teklif gladyatörü gücendirdi. ', 'This offer insulted the gladiator. ') : '') + tx(`${cn(g)}'in beklentisi: haftalık en az ~${fmtGold(r.needWage)} (diğer şartlar aynı kalırsa). Tercih ettiği süre: ${r.d.yrs} sezon.`, `${cn(g)} expects at least ~${fmtGold(r.needWage)} per week (other terms unchanged). Preferred length: ${r.d.yrs} season(s).`));
    n.lastDemand = r.needWage;
    return { ok: true, res: 'counter', n };
  },
  releaseCost(g) {
    if (!g.con) return 0;
    const weeks = (g.con.yrs - 1) * SEASON_WEEKS + Math.max(0, SEASON_WEEKS - S.week);
    return Math.round(g.con.wage * weeks * 0.6 / 10) * 10;
  },
  release(club, g) {
    const cost = this.releaseCost(g);
    if (!Economy.debit(club, 'release', cost, false)) return { ok: false, msg: tx('Fesih bedeli için bütçe yetersiz (', 'Not enough money for the termination fee (') + fmtGold(cost) + ').' };
    this.record(g, club.id, -1, 0, 'release');
    if (club.isPlayer) GameState.news(() => tx(`${cn(g)} ile sözleşme feshedildi (bedel ${fmtGold(cost)}).`, `${cn(g)}'s contract was terminated (cost ${fmtGold(cost)}).`), { p: 1, k: 'transfer' });
    this.detach(g);
    return { ok: true };
  },
  // incoming offers for player's gladiators
  respondOffer(oid, action) {
    const i = S.offers.findIndex(o => o.id === oid);
    if (i < 0) return { ok: false, msg: tx('Teklif bulunamadı.', 'Offer not found.') };
    const o = S.offers[i];
    const g = S.glads[o.gid], buyer = S.clubs[o.from], me = GameState.player();
    if (!g || g.club !== me.id || !buyer) { S.offers.splice(i, 1); return { ok: false, msg: tx('Teklif artık geçerli değil.', 'The offer is no longer valid.') }; }
    if (action === 'reject') { S.offers.splice(i, 1); g.mor = clamp(g.mor - (g.loy < 40 ? 4 : 0), 0, 100); return { ok: true, msg: tx('Teklif reddedildi.', 'Offer rejected.') }; }
    if (action === 'counter') {
      const ask = Math.round(o.fee * 1.2 / 50) * 50;
      if (o.countered) return { ok: false, msg: tx('Bu teklif için zaten pazarlık yapıldı.', 'You have already negotiated this offer.') };
      o.countered = true;
      if (ask <= o.max && buyer.budget >= ask) { o.fee = ask; return { ok: true, msg: tx(`${buyer.n} yeni bedeli kabul etti: ${fmtGold(ask)}. Teklifi onaylayabilirsiniz.`, `${buyer.n} accepted the new fee: ${fmtGold(ask)}. You can now accept the offer.`) }; }
      S.offers.splice(i, 1);
      return { ok: true, msg: tx(`${buyer.n} karşı teklifi kabul etmedi ve geri çekildi.`, `${buyer.n} refused the counter-offer and withdrew.`) };
    }
    if (action === 'accept') {
      if (!Calendar.isWindow()) return { ok: false, msg: tx('Transfer dönemi kapandı.', 'The transfer window has closed.') };
      if (buyer.roster.length >= 5 || buyer.budget < o.fee) { S.offers.splice(i, 1); return { ok: false, msg: tx(`${buyer.n} artık bu transferi yapamıyor.`, `${buyer.n} can no longer complete this transfer.`) }; }
      const d = this.demand(g, buyer, false);
      const ex = this.execute(g, buyer, o.fee, { ...d, sign: 0 }, 'transfer');
      S.offers.splice(i, 1);
      S.offers = S.offers.filter(x => x.gid !== g.id);
      return ex.ok ? { ok: true, msg: tx(`${g.n} ${fmtGold(o.fee)} karşılığında ${buyer.n}'e satıldı.`, `${g.n} was sold to ${buyer.n} for ${fmtGold(o.fee)}.`) } : ex;
    }
    return { ok: false };
  },
  closeWindow() {
    S.offers = [];
    for (const k in S.nego) if (!S.nego[k].renew) delete S.nego[k];
  }
};

// ---------------------------------------------------------------- ClubAI
// season goal keys → text (older saves stored the Turkish text directly)
function goalName(g) {
  return { title: tx('Şampiyonluk', 'Title challenge'), top: tx('Üst sıralar', 'Top of the table'), mid: tx('Orta sıra', 'Mid-table'), stay: tx('Ligde kalmak', 'Avoid relegation') }[g] || (g || '-');
}

const ClubAI = {
  utility(g, club) {
    let u = g.ovr;
    const p = club.pol;
    if (p === 'talent' && g.age <= 24) u += (g.ppot - g.ovr) * 0.4;
    if (p === 'def' && (g.cls === 'murmillo' || g.cls === 'secutor' || g.cls === 'hoplomachus')) u += 3;
    if (p === 'agg' && (g.cls === 'dimachaerus' || g.cls === 'thraex' || g.cls === 'secutor')) u += 3;
    if (g.age > 31) u -= (g.age - 31) * 1.5;
    if (g.injury) u -= g.injury.w * 1.5;
    return u;
  },
  pickLineup(club) {
    const gl = GameState.rosterGlads(club).filter(g => !g.injury).sort((a, b) => Squad.readiness(b) - Squad.readiness(a));
    let pick = gl.slice(0, 3);
    // composition: avoid three of the same class when an alternative is close
    if (pick.length === 3 && pick[0].cls === pick[1].cls && pick[1].cls === pick[2].cls) {
      const alt = gl.slice(3).find(g => g.cls !== pick[0].cls && Squad.readiness(g) > Squad.readiness(pick[2]) - 4);
      if (alt) pick[2] = alt;
    }
    // front line: the sturdiest class
    const front = c => (CLASSES[c.cls].armor + CLASSES[c.cls].block * 30);
    pick.sort((a, b) => front(b) - front(a));
    if (pick.length === 3) pick = [pick[0], pick[1], pick[2]];
    club.lineup = pick.map(g => g.id);
    Squad.fixLineup(club);
  },
  chooseTactic(club, opp) {
    const diff = Squad.top3(club) - Squad.top3(opp);
    const hasTank = club.lineup.some(id => S.glads[id] && S.glads[id].cls === 'murmillo');
    const h = hash01(club.id, S.week + S.season * 31);
    if (diff < -5) return hasTank && h < 0.5 ? 'guard' : 'defensive';
    if (diff > 5) return h < 0.5 ? 'aggressive' : 'focus';
    switch (club.pol) {
      case 'def': return hasTank && h < 0.6 ? 'guard' : 'defensive';
      case 'agg': return h < 0.6 ? 'aggressive' : 'focus';
      case 'rich': return h < 0.5 ? 'focus' : 'balanced';
      default: return h < 0.7 ? 'balanced' : 'focus';
    }
  },
  seasonGoal(club) {
    const e = Sponsors.expectedRank(club);
    return e <= 1 ? 'title' : e <= 3 ? 'top' : e <= 5 ? 'mid' : 'stay';
  },
  expectedIncome(club) {
    return Sponsors.aiWeekly(club) + ECON.ticketPrice * Math.min(FAC.capacity[club.fac.arena], club.fans * 0.75) * 7 / 30 + ECON.winPrize * tierEco(club.tier) * 0.25 + ECON.rankPrize[4] * tierEco(club.tier) / 30;
  },
  wageRoom(club) {
    const inc = this.expectedIncome(club);
    const cost = Economy.weeklyCost(club);
    return inc * 1.02 - cost + Math.max(0, club.budget - cost * 8) / 90;
  },
  transferBudget(club) { return Math.max(0, club.budget - Economy.weeklyCost(club) * 8); },
  aiClubs() { return S.clubs.filter(c => !c.isPlayer || c.autoManage); },
  // sign a free agent to fill a slot (always possible: a local recruit is generated if pool is empty)
  fillSlot(club, pool) {
    const room = this.wageRoom(club);
    const cands = pool.filter(g => g.club < 0);
    let best = null, bs = -1e9;
    const target = TIERS[club.tier].ovr;
    for (let k = 0; k < Math.min(40, cands.length); k++) {
      const g = cands[(k * 7 + club.id * 13 + S.week) % cands.length];
      const d = Transfer.demand(g, club, false);
      const afford = d.wage <= Math.max(room, TIERS[club.tier].eco * 30) && d.sign <= club.budget * 0.5;
      if (!afford) continue;
      const s = this.utility(g, club) - Math.max(0, g.ovr - target - 10) * 0.5 - d.wage / (tierEco(club.tier) * 40);
      if (s > bs) { bs = s; best = { g, d }; }
    }
    if (!best) {
      // local recruit — a modest fighter from the club's own region who joins on minimum terms
      const g = GladiatorGenerator.create({ reg: club.reg, ovr: TIERS[club.tier].ovr - 8 + R.normal(0, 3), age: R.int(18, 24) });
      S.glads[g.id] = g;
      best = { g, d: { ...Transfer.demand(g, club, false), sign: 0 } };
      best.d.wage = Math.max(10, Math.round(best.d.wage * 0.8));
    }
    const ex = Transfer.execute(best.g, club, 0, best.d, 'free');
    if (!ex.ok && club.budget < best.d.sign) {
      best.d.sign = 0;
      Transfer.execute(best.g, club, 0, best.d, 'free');
    }
    const i = pool.indexOf(best.g); if (i >= 0) pool.splice(i, 1);
  },
  tryUpgrade(club, freePool, allPool, playerBids) {
    const roster = GameState.rosterGlads(club);
    if (roster.length < 5) return;
    const weakest = roster.slice().sort((a, b) => this.utility(a, club) - this.utility(b, club))[0];
    const wu = this.utility(weakest, club);
    const tb = this.transferBudget(club);
    const room = this.wageRoom(club) + weakest.con.wage;
    let best = null, bs = 0;
    // allPool is sorted by OVR (desc): only consider gladiators clearly better than the weakest
    let lo = 0, hi = allPool.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (allPool[mid].ovr >= weakest.ovr + 3) lo = mid + 1; else hi = mid; }
    const nCand = lo;
    if (!nCand) return;
    const tries = Math.min(50, nCand);
    for (let k = 0; k < tries; k++) {
      const g = allPool[nCand <= 50 ? k : (R.next() * nCand) | 0];
      if (!g || g.club === club.id || g.injury) continue;
      const seller = g.club >= 0 ? S.clubs[g.club] : null;
      if (seller && seller.tier < club.tier - 1) continue; // stars from far higher leagues won't come
      const gain = this.utility(g, club) - wu;
      if (gain < 4) continue;
      const fee = seller ? Transfer.askingPrice(seller, g) : 0;
      const d = Transfer.demand(g, club, false);
      const relCost = Transfer.releaseCost(weakest);
      if (fee + d.sign + relCost * 0.3 > tb || d.wage > room) continue;
      const s = gain / Math.pow(1 + fee + d.wage * 30, 0.25);
      if (s > bs) { bs = s; best = { g, seller, fee, d }; }
    }
    if (!best) return;
    if (best.seller && best.seller.isPlayer && !best.seller.autoManage) {
      if (playerBids.n < 2 && !S.offers.some(o => o.gid === best.g.id || o.from === club.id)) {
        const fee = Math.round(best.fee * R.range(0.85, 1.12) / 50) * 50;
        const max = Math.round(TransferMath.value(best.g) * (club.pol === 'rich' ? 1.65 : 1.45) / 50) * 50;
        S.offers.push({ id: GameState.newId('o'), gid: best.g.id, from: club.id, fee, max, s: S.season, w: S.week });
        GameState.news(() => tx(`Transfer teklifi: ${cn(club)}, ${best.cn(g)} için ${fmtGold(fee)} teklif etti.`, `Transfer offer: ${cn(club)} bid ${fmtGold(fee)} for ${best.cn(g)}.`), { p: 1, k: 'offer' });
        playerBids.n++;
      }
      return;
    }
    // make room: sell weakest to the free market if it is cheaper than keeping, else release
    const rc = Transfer.releaseCost(weakest);
    if (rc > club.budget * 0.25) return;
    if (!Transfer.release(club, weakest).ok) return;
    const ex = Transfer.execute(best.g, club, best.fee, best.d, best.seller ? 'transfer' : 'free');
    if (!ex.ok) this.fillSlot(club, freePool);
  },
  // AI bids for player's gladiators from clubs that need/want them
  playerTargets(playerBids) {
    const me = GameState.player();
    if (!me || me.autoManage) return;
    for (const g of GameState.rosterGlads(me)) {
      if (playerBids.n >= 2) break;
      if (S.offers.some(o => o.gid === g.id)) continue;
      const attract = clamp((g.ovr - TIERS[me.tier].ovr) / 20 + (g.age <= 23 ? 0.15 : 0), 0, 0.8);
      if (R.next() > 0.08 + attract * 0.25) continue;
      const cands = S.clubs.filter(c => !c.isPlayer && c.tier <= me.tier && c.tier >= me.tier - 2 && c.roster.length < 5 + 1 && this.transferBudget(c) > Transfer.askingPrice(me, g) * 0.9);
      if (!cands.length) continue;
      const buyer = R.pick(cands);
      const fee = Math.round(Transfer.askingPrice(me, g) * R.range(0.8, 1.15) / 50) * 50;
      const max = Math.round(TransferMath.value(g) * (buyer.pol === 'rich' ? 1.65 : 1.45) / 50) * 50;
      S.offers.push({ id: GameState.newId('o'), gid: g.id, from: buyer.id, fee, max, s: S.season, w: S.week });
      GameState.news(() => tx(`Büyük transfer teklifi kulübümüze ulaştı: ${cn(buyer)}, ${cn(g)} için ${fmtGold(fee)} önerdi.`, `A big transfer offer has arrived: ${cn(buyer)} offered ${fmtGold(fee)} for ${cn(g)}.`), { p: 1, k: 'offer' });
      playerBids.n++;
    }
  },
  windowPass(week) {
    const clubs = R.shuffle(this.aiClubs());
    const freePool = GameState.freeAgents().sort((a, b) => b.ovr - a.ovr);
    const allPool = Object.values(S.glads).filter(g => !g.temp).sort((a, b) => b.ovr - a.ovr);
    const playerBids = { n: S.offers.filter(o => o.w === S.week).length };
    // offers on the player's roster expire at window close; new ones may be created now
    for (const club of clubs) {
      if (club.arrears > 0) Economy.aiRefinance(club);
      // clubs in trouble shed their most expensive bench gladiator
      if (club.arrears > 0 && club.roster.length >= 4) {
        const bench = GameState.rosterGlads(club).filter(g => !club.lineup.includes(g.id)).sort((a, b) => b.con.wage - a.con.wage)[0];
        if (bench && Transfer.releaseCost(bench) <= club.budget) Transfer.release(club, bench);
      }
      if (club.roster.length < 5) { this.fillSlot(club, freePool); continue; }
      const pUp = { rich: 0.45, talent: 0.35, agg: 0.25, def: 0.25, econ: 0.15 }[club.pol] || 0.2;
      if (R.next() < pUp && club.arrears <= 0) this.tryUpgrade(club, freePool, allPool, playerBids);
    }
    this.playerTargets(playerBids);
    // fill pass: no AI club leaves the window short
    for (const club of this.aiClubs()) {
      let guard = 0;
      while (club.roster.length < 5 && guard++ < 5) this.fillSlot(club, freePool);
      this.equipmentPass(club);
      this.pickLineup(club);
    }
  },
  equipmentPass(club) {
    Equipment.autoEquip(club);
    const wc = Economy.weeklyCost(club);
    if (club.budget < wc * 15 || club.arrears > 0 || R.next() > 0.35) return;
    const aces = club.lineup.map(id => S.glads[id]).filter(Boolean);
    const g = R.pick(aces); if (!g) return;
    const slot = R.pick(['w', 'a', 'x']);
    const cur = S.items[g.eq[slot]];
    const q = clamp(Math.round((6 - club.tier) * 0.72 + R.normal(0, 0.6)), 0, 4);
    if (cur && cur.q >= q) {
      if (cur.p < 5 && Equipment.upgradeCost(cur) < club.budget * 0.08) Equipment.upgrade(club, cur.id);
      return;
    }
    const types = Object.keys(ITEM_TYPES).filter(t => ITEM_TYPES[t].slot === slot && ITEM_TYPES[t].cls.includes(g.cls));
    if (!types.length) return;
    const t = R.pick(types);
    if (Equipment.price(t, q) > club.budget * 0.12) return;
    if (club.rep < Equipment.repNeeded(q)) return;
    const r = Equipment.buy(club, t, q);
    if (r.ok) Equipment.equip(r.item.id, g.id);
    // clubs sell surplus old items
    const items = Equipment.clubItems(club).filter(it => !it.g);
    if (items.length > 6) Equipment.sell(club, items.sort((a, b) => a.q - b.q)[0].id);
  },
  weeklyLineups() { for (const c of this.aiClubs()) this.pickLineup(c); },
  // season-end contract decisions (before contracts tick down)
  renewals(club) {
    const avg = Squad.avgOvr(club);
    for (const g of GameState.rosterGlads(club)) {
      if (!g.con || g.con.yrs > 1) continue;
      if (g.age >= 34 || g.ovr < avg - 7) continue;
      const d = Transfer.demand(g, club, true);
      if (d.wage > g.con.wage * 1.6 && this.wageRoom(club) < d.wage - g.con.wage) continue;
      g.con = { wage: d.wage, yrs: g.con.yrs + R.int(1, 3), sign: 0, winB: d.winB, titleB: d.titleB };
    }
  },
  seasonStart(club) {
    // facilities investment
    const wc = Economy.weeklyCost(club);
    const maxLv = clamp(7 - club.tier, 1, 5);
    const order = R.shuffle(FAC_IDS.slice());
    for (const f of order) {
      if (club.fac[f] >= Math.max(maxLv, f === 'arena' && club.fans > FAC.capacity[club.fac.arena] ? 5 : 0)) continue;
      const cost = Facilities.cost(club, f);
      if (cost > 0 && club.budget - cost > wc * 14 && club.budget > cost * 2.5) { Facilities.upgrade(club, f); break; }
    }
    // staff improvement for low-quality staff
    const T = TIERS[club.tier];
    for (const s of STAFF_IDS) {
      if (club.staff[s].q < T.staff[0] - 6 && club.budget > wc * 12) club.staff[s] = WorldGenerator.staffMember(club.reg, R.range(T.staff[0], T.staff[1]));
    }
    club.goal = this.seasonGoal(club);
  }
};
