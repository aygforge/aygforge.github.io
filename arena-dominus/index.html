<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17110c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Arena Dominus — gladyatör okulu menajerlik oyunu">
<title>Arena Dominus</title>
<style>
:root {
  --bg: #17110c; --bg2: #21170f; --panel: #2a1e15; --panel2: #231910; --line: #4c3828; --line2: #6a4f35;
  --text: #f0e5d0; --muted: #b9a68a; --dim: #8a7660; --bronze: #c48a45; --bronze2: #8f5f2c; --gold: #e0b95c;
  --red: #a8302a; --red2: #6e1a15; --green: #73b45f; --blue: #6a9bd0; --warn: #e3a340; --bad: #d9564a;
  --r: .55rem; --nav: 4.7rem; --top: 3.1rem;
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { font-size: clamp(12px, min(3.3vh, 1.7vw), 16px); }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; overscroll-behavior: none; }
body { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif; line-height: 1.35; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
input, select, button, textarea { font: inherit; color: inherit; }
h1, h2, h3, .serif { font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif; letter-spacing: .02em; }
h2 { font-size: 1.25rem; margin: 0 0 .5rem; color: var(--gold); }
h3 { font-size: 1.02rem; margin: 0 0 .4rem; color: var(--gold); }
.ico { vertical-align: middle; flex: none; }
.muted { color: var(--muted); } .dim { color: var(--dim); } .good { color: var(--green); } .bad { color: var(--bad); } .warn { color: var(--warn); } .gold { color: var(--gold); }
.small { font-size: .82rem; } .tiny { font-size: .72rem; } .big { font-size: 1.3rem; } .b { font-weight: 700; }
.row { display: flex; align-items: center; gap: .5rem; } .col { display: flex; flex-direction: column; gap: .4rem; }
.wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; } .right { margin-left: auto; } .center { text-align: center; justify-content: center; }
.gap0 { gap: .2rem; } .mt { margin-top: .6rem; } .mb { margin-bottom: .6rem; }
.ellip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#app { position: fixed; inset: 0; padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l); background:
  radial-gradient(ellipse at 30% 0%, rgba(160,90,40,.12), transparent 60%), radial-gradient(ellipse at 100% 100%, rgba(120,30,20,.18), transparent 55%), var(--bg); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .35rem; min-height: 2.3rem; padding: .35rem .85rem; border-radius: .45rem; border: 1px solid #6c4c2c;
  background: linear-gradient(#5a3f25, #3d2a19); color: var(--text); cursor: pointer; font-weight: 600; white-space: nowrap; box-shadow: inset 0 1px 0 rgba(255,220,170,.15), 0 1px 2px rgba(0,0,0,.4); }
.btn:hover { filter: brightness(1.12); } .btn:active { transform: translateY(1px); filter: brightness(.95); }
.btn.primary { background: linear-gradient(#b8452f, #7a1f17); border-color: #d06a45; }
.btn.gold { background: linear-gradient(#d9ab4f, #9a6a24); border-color: #f0cc7a; color: #24170a; }
.btn.ghost { background: transparent; border-color: var(--line2); }
.btn.sm { min-height: 1.9rem; padding: .2rem .6rem; font-size: .85rem; }
.btn.xs { min-height: 1.6rem; padding: .1rem .45rem; font-size: .78rem; }
.btn[disabled], .btn.disabled { opacity: .45; pointer-events: none; }
.btn.on { background: linear-gradient(#d9ab4f, #9a6a24); color: #24170a; border-color: #f0cc7a; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: .45rem; overflow: hidden; }
.seg > button { border: 0; background: #2d2016; padding: .35rem .7rem; min-height: 2.1rem; cursor: pointer; color: var(--muted); font-weight: 600; }
.seg > button + button { border-left: 1px solid var(--line); }
.seg > button.on { background: linear-gradient(#d9ab4f, #9a6a24); color: #24170a; }
input[type=text], input[type=number], select { background: #1b130d; border: 1px solid var(--line2); border-radius: .4rem; padding: .35rem .5rem; min-height: 2.1rem; min-width: 0; }
input[type=number] { width: 6.5rem; }
input:focus, select:focus { outline: 2px solid var(--bronze); outline-offset: 0; }

/* ---------- layout ---------- */
#game { position: absolute; inset: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l); display: flex; }
#nav { width: var(--nav); flex: none; background: linear-gradient(90deg, #120c08, #1d140d); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: none; }
#nav::-webkit-scrollbar { display: none; }
#nav button { border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: .1rem; padding: .42rem .1rem; font-size: .66rem; cursor: pointer; position: relative; min-height: 3rem; }
#nav button.on { color: var(--gold); background: linear-gradient(90deg, rgba(196,138,69,.22), transparent); }
#nav button.on::before { content: ''; position: absolute; left: 0; top: 18%; bottom: 18%; width: 3px; background: var(--gold); border-radius: 2px; }
#nav .badge { position: absolute; top: .25rem; right: .7rem; background: var(--red); color: #fff; border-radius: 1rem; font-size: .6rem; padding: 0 .3rem; min-width: 1rem; }
#maincol { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#topbar { height: var(--top); flex: none; display: flex; align-items: center; gap: .6rem; padding: 0 .6rem; border-bottom: 1px solid var(--line); background: linear-gradient(#2a1d13, #1c140d); }
#topbar .club { display: flex; align-items: center; gap: .45rem; min-width: 0; }
#topbar .club b { font-family: "Palatino Linotype", Georgia, serif; font-size: 1.02rem; }
.chip { display: inline-flex; align-items: center; gap: .25rem; padding: .15rem .5rem; border-radius: 1rem; background: rgba(0,0,0,.3); border: 1px solid var(--line); font-size: .8rem; white-space: nowrap; }
.chip.win { border-color: #3f7a3a; color: #a8e39a; } .chip.closed { color: var(--dim); }
#view { flex: 1; overflow: auto; padding: .7rem; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
#view::-webkit-scrollbar, .scroll::-webkit-scrollbar { width: 6px; height: 6px; } #view::-webkit-scrollbar-thumb, .scroll::-webkit-scrollbar-thumb { background: #4c3828; border-radius: 3px; }
.scroll { overflow: auto; -webkit-overflow-scrolling: touch; }

.card { background: linear-gradient(var(--panel), var(--panel2)); border: 1px solid var(--line); border-radius: var(--r); padding: .65rem; box-shadow: 0 2px 6px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,220,170,.05); min-width: 0; }
.card.tight { padding: .45rem; }
.card h3 .ico { margin-right: .2rem; }
.grid { display: grid; gap: .6rem; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.hubgrid { grid-template-columns: 1.15fr 1fr 1fr; }
.tabs { display: flex; gap: .3rem; margin-bottom: .6rem; overflow-x: auto; scrollbar-width: none; flex-wrap: nowrap; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 1px solid var(--line); background: #24190f; color: var(--muted); padding: .3rem .7rem; border-radius: 2rem; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: .3rem; min-height: 2rem; font-weight: 600; }
.tab.on { color: #24170a; background: linear-gradient(#d9ab4f, #9a6a24); border-color: #f0cc7a; }
.tab .n { background: var(--red); color: #fff; border-radius: 1rem; padding: 0 .35rem; font-size: .7rem; }
.sep { height: 1px; background: var(--line); margin: .5rem 0; }

/* stats & bars */
.bar { height: .45rem; background: rgba(0,0,0,.45); border-radius: .3rem; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #8f5f2c, var(--gold)); border-radius: .3rem; }
.bar.g > i { background: linear-gradient(90deg, #3f7a3a, #8fd47a); } .bar.r > i { background: linear-gradient(90deg, #7a1f17, #e0634f); } .bar.b > i { background: linear-gradient(90deg, #2f5a85, #8bbbe8); }
.ovr { display: inline-flex; align-items: center; justify-content: center; min-width: 2.1rem; height: 1.7rem; padding: 0 .3rem; border-radius: .35rem; font-weight: 800; background: #3b2a1a; border: 1px solid #7a5530; color: var(--gold); font-family: Georgia, serif; }
.ovr.hi { background: #4d3a12; border-color: #d9ab4f; color: #ffe39a; } .ovr.lo { color: var(--muted); }
.attr { display: grid; grid-template-columns: 6.4rem 1fr 2rem; align-items: center; gap: .4rem; font-size: .85rem; margin: .18rem 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: .15rem .7rem; font-size: .85rem; }
.kv > :nth-child(odd) { color: var(--muted); }
table.t { width: 100%; border-collapse: collapse; font-size: .85rem; }
table.t th { text-align: left; color: var(--muted); font-weight: 600; font-size: .75rem; padding: .3rem .35rem; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #241910; z-index: 1; }
table.t td { padding: .32rem .35rem; border-bottom: 1px solid rgba(76,56,40,.5); }
table.t tr.me td { background: rgba(217,171,79,.12); }
table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: rgba(255,255,255,.04); }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; }
.zone-up td:first-child { box-shadow: inset 3px 0 0 var(--green); } .zone-down td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
.form { display: inline-flex; gap: 2px; } .form i { width: .85rem; height: .85rem; border-radius: 2px; display: inline-block; font-style: normal; font-size: .55rem; text-align: center; line-height: .85rem; font-weight: 700; }
.form i.G { background: #3f7a3a; } .form i.M { background: #7a2a1f; }
.pill { display: inline-block; padding: .05rem .4rem; border-radius: .3rem; font-size: .72rem; background: rgba(0,0,0,.35); border: 1px solid var(--line); white-space: nowrap; }
.pill.inj { background: #5e1a14; border-color: #a8302a; color: #ffd0c8; } .pill.ok { color: #a8e39a; border-color: #3f7a3a; } .pill.gold { color: #ffe39a; border-color: #9a6a24; }
.crest { flex: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
.portrait { border-radius: .4rem; display: block; flex: none; background: #2a1e15; border: 1px solid #5a4130; }
.empty { color: var(--dim); text-align: center; padding: 1.2rem; }

/* gladiator cards (squad) */
.squad-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) .3rem repeat(2, minmax(0, 1fr)); gap: .5rem; align-items: stretch; }
.squad-grid .divider { background: linear-gradient(transparent, var(--line2), transparent); width: 2px; justify-self: center; }
.slotlbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--gold); text-align: center; margin-bottom: .25rem; font-weight: 700; }
.slotlbl.bench { color: var(--muted); }
.gcard { position: relative; background: linear-gradient(#33251a, #241910); border: 1px solid var(--line2); border-radius: .55rem; padding: .45rem; cursor: grab; touch-action: none; transition: transform .12s, box-shadow .12s; }
.gcard.ace { border-color: #9a6a24; box-shadow: inset 0 0 0 1px rgba(217,171,79,.25); }
.gcard.sel { outline: 2px solid var(--gold); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(0,0,0,.5); }
.gcard.drop { outline: 2px dashed var(--green); }
.gcard.injured { filter: saturate(.55); }
.gcard .top { display: flex; gap: .4rem; align-items: flex-start; }
.gcard .nm { font-weight: 700; font-size: .9rem; line-height: 1.15; }
.gcard .lines { font-size: .74rem; display: grid; grid-template-columns: auto 1fr; gap: .05rem .4rem; margin-top: .35rem; }
.gcard .lines > :nth-child(odd) { color: var(--dim); }
.gcard .lines > :nth-child(even) { text-align: right; }
.gcard .acts { display: flex; gap: .3rem; margin-top: .4rem; }
.gcard .acts .btn { flex: 1; }
.gcard.emptyslot { display: flex; align-items: center; justify-content: center; color: var(--dim); min-height: 12rem; border-style: dashed; cursor: default; }
.ghost-card { position: fixed; pointer-events: none; z-index: 900; opacity: .9; transform: rotate(-3deg) scale(1.03); }

/* list rows (market) */
.grow-list { display: flex; flex-direction: column; gap: .3rem; }
.grow-row { display: grid; grid-template-columns: 2.6rem minmax(7rem, 1.6fr) 5.2rem 2.3rem 3.3rem 4.2rem 5.2rem 4.4rem 3.2rem; align-items: center; gap: .45rem; padding: .3rem .45rem; border-radius: .45rem; background: rgba(0,0,0,.2); border: 1px solid rgba(76,56,40,.6); cursor: pointer; font-size: .82rem; }
.grow-row:hover { background: rgba(255,255,255,.04); }
.grow-row.head { background: transparent; border: 0; cursor: default; color: var(--muted); font-size: .72rem; position: sticky; top: -.7rem; z-index: 2; background: #1d140d; }
.grow-row .nm { font-weight: 700; } .grow-row .sub { font-size: .72rem; color: var(--dim); }
.filters { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .4rem; align-items: end; }
.filters label { display: flex; flex-direction: column; gap: .15rem; font-size: .72rem; color: var(--muted); min-width: 0; }
.filters label > * { width: 100%; }

/* modal */
#modal-root { position: fixed; inset: 0; z-index: 500; pointer-events: none; }
.modal-bg { position: absolute; inset: 0; background: rgba(8,5,3,.72); display: flex; align-items: center; justify-content: center; padding: calc(.6rem + var(--safe-t)) calc(.6rem + var(--safe-r)) calc(.6rem + var(--safe-b)) calc(.6rem + var(--safe-l)); pointer-events: auto; animation: fadein .15s; }
.modal { background: linear-gradient(#2e2117, #1f160f); border: 1px solid var(--line2); border-radius: .7rem; max-width: min(64rem, 100%); width: 100%; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.modal.narrow { max-width: 30rem; } .modal.mid { max-width: 46rem; }
.modal .mh { display: flex; align-items: center; gap: .5rem; padding: .55rem .7rem; border-bottom: 1px solid var(--line); }
.modal .mh h2 { margin: 0; font-size: 1.12rem; }
.modal .mb { padding: .7rem; overflow: auto; -webkit-overflow-scrolling: touch; }
.modal .mf { display: flex; gap: .45rem; justify-content: flex-end; padding: .55rem .7rem; border-top: 1px solid var(--line); flex-wrap: wrap; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
#toast-root { position: fixed; left: 50%; bottom: calc(.8rem + var(--safe-b)); transform: translateX(-50%); z-index: 950; display: flex; flex-direction: column; gap: .3rem; align-items: center; pointer-events: none; }
.toast { background: #3b2a1a; border: 1px solid var(--bronze); padding: .45rem .9rem; border-radius: .5rem; box-shadow: 0 4px 14px rgba(0,0,0,.5); animation: fadein .2s; max-width: 80vw; text-align: center; }
#busy { position: fixed; inset: 0; z-index: 800; background: rgba(8,5,3,.78); display: flex; align-items: center; justify-content: center; }
#busy .box { width: min(26rem, 80vw); text-align: center; }
#busy .bar { height: .7rem; margin-top: .6rem; }

/* battle */
#battle { position: fixed; inset: 0; z-index: 400; background: #000; display: flex; flex-direction: column; }
#battle .stage { position: relative; flex: 1; min-height: 0; }
#bcanvas { position: absolute; inset: 0; display: block; touch-action: none; }
.bhud-top { position: absolute; left: var(--safe-l); right: var(--safe-r); top: var(--safe-t); display: flex; justify-content: space-between; align-items: flex-start; padding: .35rem .5rem; pointer-events: none; gap: .5rem; }
.bteam { background: rgba(20,13,8,.78); border: 1px solid rgba(196,138,69,.4); border-radius: .5rem; padding: .3rem .4rem; width: min(17.5rem, 36vw); pointer-events: auto; }
.bteam .tn { display: flex; align-items: center; gap: .3rem; font-weight: 700; font-size: .82rem; margin-bottom: .2rem; }
.bf { display: grid; grid-template-columns: 1.8rem 1fr; gap: .3rem; align-items: center; margin-top: .18rem; font-size: .72rem; border-radius: .3rem; padding: .05rem .1rem; }
.bf.tg { outline: 2px solid #ff5a3c; cursor: pointer; animation: pulse 1s infinite; }
.bf.out { opacity: .42; }
.bf .bars { display: flex; flex-direction: column; gap: 2px; }
.bf .bar { height: .36rem; }
.bf .bar.en > i { background: linear-gradient(90deg, #2f5a85, #8bbbe8); }
.bf .st { color: var(--warn); font-size: .62rem; margin-left: .2rem; }
@keyframes pulse { 50% { outline-color: rgba(255,90,60,.3); } }
.bclock { background: rgba(20,13,8,.85); border: 1px solid var(--bronze); border-radius: .5rem; padding: .2rem .7rem; text-align: center; font-family: Georgia, serif; pointer-events: auto; }
.bclock .t { font-size: 1.4rem; font-weight: 700; color: var(--gold); }
.bhud-bot { position: absolute; left: var(--safe-l); right: var(--safe-r); bottom: var(--safe-b); display: flex; justify-content: space-between; align-items: flex-end; padding: .4rem .5rem; gap: .5rem; pointer-events: none; }
.bhud-bot > * { pointer-events: auto; }
.bcmds { display: flex; gap: .35rem; background: rgba(20,13,8,.78); padding: .3rem; border-radius: .55rem; border: 1px solid rgba(196,138,69,.4); }
.bcmds .btn { position: relative; overflow: hidden; min-width: 5.2rem; }
.bcmds .cd { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--gold); }
.blog { position: absolute; left: 50%; bottom: 4rem; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: .15rem; pointer-events: none; }
.blog div { background: rgba(20,13,8,.7); padding: .1rem .55rem; border-radius: .4rem; font-size: .78rem; animation: fadein .2s; }
.stance { font-size: .66rem; color: var(--muted); }

/* title & setup */
.title-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8rem; padding: 1rem; }
#titlecanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.logo { position: relative; text-align: center; }
.logo h1 { font-size: 3.4rem; margin: 0; color: var(--gold); text-shadow: 0 3px 0 #5a3511, 0 6px 18px rgba(0,0,0,.8); letter-spacing: .12em; }
.logo .sub { color: var(--text); letter-spacing: .3em; font-size: .85rem; opacity: .85; }
.menu { position: relative; display: flex; flex-direction: column; gap: .5rem; width: min(20rem, 80vw); }
.menu .btn { min-height: 2.8rem; font-size: 1.05rem; }
.setup { position: absolute; inset: 0; overflow: auto; padding: .8rem; }
.choice { cursor: pointer; transition: transform .12s; } .choice:hover { transform: translateY(-2px); } .choice.on { outline: 2px solid var(--gold); }
.swatch { width: 2rem; height: 2rem; border-radius: .4rem; border: 2px solid rgba(0,0,0,.4); cursor: pointer; }
.swatch.on { border-color: #fff; box-shadow: 0 0 0 2px var(--gold); }
.pick { border: 1px solid var(--line); border-radius: .45rem; padding: .2rem; cursor: pointer; background: #1b130d; display: inline-flex; }
.pick.on { border-color: var(--gold); background: #3b2a1a; }

/* bracket */
.bracket { display: flex; gap: .7rem; overflow-x: auto; padding-bottom: .4rem; align-items: flex-start; }
.bround { min-width: 13rem; display: flex; flex-direction: column; gap: .3rem; }
.bround h4 { margin: 0 0 .2rem; color: var(--gold); font-size: .82rem; text-align: center; }
.bm { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: .4rem; padding: .2rem .35rem; font-size: .76rem; }
.bm .s { display: flex; align-items: center; gap: .3rem; padding: .08rem 0; }
.bm .s.w { color: #f6e6b8; font-weight: 700; } .bm .s.l { color: var(--dim); }
.bm.me { border-color: var(--gold); }
.facart { width: 100%; height: auto; border-radius: .4rem; display: block; }
.news-item { padding: .35rem .2rem; border-bottom: 1px solid rgba(76,56,40,.5); font-size: .84rem; }
.news-item.p { border-left: 3px solid var(--gold); padding-left: .45rem; }
.news-item .w { color: var(--dim); font-size: .7rem; }
.tactic { border: 1px solid var(--line); border-radius: .5rem; padding: .45rem; cursor: pointer; background: rgba(0,0,0,.2); }
.tactic.on { border-color: var(--gold); background: rgba(217,171,79,.12); }
.tactic b { color: var(--gold); }
.offer-card { border: 1px solid var(--line); border-radius: .5rem; padding: .55rem; background: rgba(0,0,0,.2); }
.stars { color: var(--gold); letter-spacing: .1em; }

/* tutorial */
#tut { position: fixed; inset: 0; z-index: 700; pointer-events: none; }
#tut .hl { position: absolute; border: 2px solid var(--gold); border-radius: .5rem; box-shadow: 0 0 0 9999px rgba(8,5,3,.55); transition: all .25s; pointer-events: none; }

/* rotate notice */

const num = (v, d = 0) => (typeof v === 'number' && isFinite(v) ? v : d);
const r1 = v => Math.round(v * 10) / 10;
const fmtInt = v => {
  v = Math.round(num(v));
  const s = Math.abs(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (v < 0 ? '-' : '') + s;
};
const fmtGold = v => fmtInt(v) + ' ₳';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
// deterministic 0..1 from integer seed values (does not touch RNG state)
function hash01(a, b = 0) {
  let h = Math.imul((a | 0) ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul((b | 0) + 0x632be5ab, 0xc2b2ae35);
  h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; h = Math.imul(h, 0x297a2d39); h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}

// ---------- seeded RNG (sfc32), state is serialisable ----------
class RNG {
  constructor(seed) {
    if (Array.isArray(seed) && seed.length === 4) this.s = seed.map(x => x >>> 0);
    else {
      const n = (typeof seed === 'number' ? seed : hashStr(String(seed))) >>> 0;
      this.s = [0x9e3779b9, 0x243f6a88, 0xb7e15162, n];
      for (let i = 0; i < 16; i++) this.next();
    }
  }
  next() {
    const s = this.s;
    let a = s[0], b = s[1], c = s[2], d = s[3];
    const t = (((a + b) | 0) + d) | 0;
    d = (d + 1) | 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11);
    c = (c + t) | 0;
    s[0] = a >>> 0; s[1] = b >>> 0; s[2] = c >>> 0; s[3] = d >>> 0;
    return (t >>> 0) / 4294967296;
  }
  range(a, b) { return a + (b - a) * this.next(); }
  int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
  chance(p) { return this.next() < p; }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  normal(m = 0, sd = 1) {
    let u = this.next(); if (u < 1e-9) u = 1e-9;
    const v = this.next();
    return m + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  weighted(items, wfn) {
    let tot = 0; for (const it of items) tot += Math.max(0, wfn(it));
    if (tot <= 0) return items[0];
    let r = this.next() * tot;
    for (const it of items) { r -= Math.max(0, wfn(it)); if (r <= 0) return it; }
    return items[items.length - 1];
  }
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(this.next() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    return arr;
  }
  seed32() { return Math.floor(this.next() * 4294967296) >>> 0; }
  state() { return this.s.slice(); }
}

function tierEco(t) { return TIERS[clamp(t | 0, 1, 6)].eco; }
function ovrOf(g) {
  const w = CLASSES[g.cls].w;
  return clamp(g.str * w.str + g.end * w.end + g.agi * w.agi + g.tec * w.tec + g.dis * w.dis, 1, 99);
}

// Global live state. S = serialisable game state, R = world RNG (state mirrored into S.rng on save)
let S = null;
let R = null;

const GameState = {
  glad(id) { return S && S.glads[id] || null; },
  club(id) { return S && S.clubs[id] || null; },
  player() { return S ? S.clubs[S.player] : null; },
  league(i) { return S.leagues[i]; },
  leagueOf(club) { return S.leagues[club.lg]; },
  leagueIndex(regIdx, tier) { return regIdx * 6 + (tier - 1); },
  regIdx(regId) { return REGIONS.findIndex(r => r.id === regId); },
  item(id) { return S.items[id] || null; },
  newId(kind) { const v = S.nid[kind]++; return v; },
  isPlayerClub(cid) { return cid === S.player; },
  rosterGlads(club) { return club.roster.map(id => S.glads[id]).filter(Boolean); },
  freeAgents() { const out = []; for (const id in S.glads) { const g = S.glads[id]; if (g.club < 0) out.push(g); } return out; },
  news(text, opt = {}) {
    S.news.unshift({ s: S.season, w: S.week, t: text, p: opt.p ? 1 : 0, k: opt.k || 'gen' });
    if (S.news.length > 120) S.news.length = 120;
  },
  syncRng() { if (S && R) S.rng = R.state(); }
};

// ---------------------------------------------------------------- gladiators
const GladiatorGenerator = {
  pickClass(reg) {
    const prefs = REGION_BY_ID[reg].cls;
    return R.weighted(CLASS_IDS, c => prefs[c]);
  },
  pickName(reg) {
    // 12% chance of a name from another region (migration / mixed heritage)
    const src = R.chance(0.12) ? R.pick(REGIONS).id : reg;
    const N = NAMES[src];
    return R.pick(N.f) + ' ' + R.pick(N.l);
  },
  makeLook(reg, age) {
    const skinByReg = { valeria: [1, 2, 3], theskara: [0, 1, 2], nemeris: [3, 4, 5], aegion: [1, 2, 3], dravok: [0, 1, 2] };
    let sk = R.chance(0.15) ? R.int(0, 5) : R.pick(skinByReg[reg]);
    let hc = R.weighted([0, 1, 2, 3, 4], i => [3, 3, 2, 1, reg === 'dravok' || reg === 'theskara' ? 1.6 : 0.5][i]);
    if (age > 31 && R.chance((age - 31) * 0.09)) hc = 5; // greying
    return {
      sk, hc,
      hs: R.int(0, 6), bd: R.weighted([0, 1, 2, 3, 4, 5], i => [2.2, 1.5, 1.4, 1.2, 0.6, 0.7][i]),
      jw: r1(R.range(0.86, 1.14)), ns: R.int(0, 2), br: r1(R.range(0, 1)), ey: R.int(0, 2),
      bw: r1(R.range(0.92, 1.12)), ht: r1(R.range(0.95, 1.05)), sc: R.chance(0.18) ? 1 : 0,
      ac: R.int(0, 5), pl: R.int(0, 4)
    };
  },
  create(opts) {
    const reg = opts.reg || R.pick(REGIONS).id;
    const cls = opts.cls || this.pickClass(reg);
    const age = opts.age != null ? opts.age : clamp(Math.round(R.normal(26.5, 4)), 18, 36);
    const target = clamp(opts.ovr != null ? opts.ovr : 45, 12, 94);
    const C = CLASSES[cls], B = REGION_BY_ID[reg].bias;
    const g = {
      id: GameState.newId('g'), n: this.pickName(reg), age, reg, cls,
      str: 0, end: 0, agi: 0, tec: 0, dis: 0, cha: 0, ovr: 0, pot: 0, ppot: 0,
      grow: r1(clamp(R.normal(1, 0.18), 0.6, 1.45)),
      inj: Math.round(clamp(Math.exp(R.normal(0, 0.3)), 0.5, 1.9) * 100) / 100,
      loy: R.int(10, 95), clu: Math.round(clamp(R.normal(50, 18), 1, 99)),
      pk: r1(clamp(R.normal(28.5, 1.6), 25, 32)),
      cond: 100, mor: 65, injury: null, club: -1, con: null, xp: 0,
      look: this.makeLook(reg, age), eq: { w: 0, a: 0, x: 0 },
      ss: this.blankStats(), cs: this.blankStats(), aw: [], hist: [], joined: null, fw: 0, val: 0
    };
    const keys = ['str', 'end', 'agi', 'tec', 'dis'];
    for (const k of keys) g[k] = target + (C.w[k] - 0.2) * 70 + B[k] + R.normal(0, 6);
    let o = ovrOf(g);
    const shift = target - o;
    for (const k of keys) g[k] = r1(clamp(g[k] + shift, 6, 98));
    g.cha = Math.round(clamp(R.normal(40 + (target - 45) * 0.45, 14), 5, 95));
    g.ovr = r1(ovrOf(g));
    const gapMean = age <= 19 ? 11 : age <= 21 ? 8.5 : age <= 23 ? 6 : age <= 25 ? 4 : age <= 27 ? 2.2 : age <= 29 ? 1 : 0.3;
    let gap = Math.max(0, R.normal(gapMean, gapMean * 0.55 + 1));
    if (age <= 23 && R.next() < 0.06) gap += R.range(8, 14); // rare hidden gem
    if (opts.potBoost) gap += opts.potBoost;
    g.pot = r1(clamp(opts.pot != null ? opts.pot : g.ovr + gap, g.ovr, 97));
    g.ppot = r1(clamp(g.pot + R.normal(0, 6), g.ovr, 99));
    g.val = TransferMath.value(g);
    return g;
  },
  blankStats() { return { m: 0, w: 0, ko: 0, dmg: 0, tk: 0, sv: 0, blk: 0 }; },
  // temporary arena fighter for matches where a club has <3 healthy gladiators. Never stored.
  tempFighter(tier, seed, slot) {
    const rng = new RNG(seed ^ (slot * 7919));
    const cls = CLASS_IDS[rng.int(0, 5)];
    const base = clamp(TIERS[tier].ovr - 22 + rng.normal(0, 2), 14, 55);
    const g = {
      id: -1 - slot, temp: true, n: 'Arena Dövüşçüsü', age: rng.int(19, 34), reg: REGIONS[rng.int(0, 4)].id, cls,
      str: base + rng.normal(0, 3), end: base + rng.normal(0, 3), agi: base + rng.normal(0, 3), tec: base + rng.normal(0, 3), dis: base - 4, cha: 20,
      clu: 40, cond: 90, mor: 50, injury: null, eq: { w: 0, a: 0, x: 0 },
      look: { sk: rng.int(0, 5), hc: rng.int(0, 4), hs: rng.int(0, 6), bd: rng.int(0, 5), jw: 1, ns: rng.int(0, 2), br: 0.5, ey: 1, bw: 1, ht: 1, sc: 0, ac: 5, pl: 0 }
    };
    g.ovr = r1(ovrOf(g));
    return g;
  }
};

// ---------------------------------------------------------------- transfer maths (used by generator too)
const TransferMath = {
  value(g) {
    const base = ECON.valueBase * Math.pow(ECON.valueGrowth, num(g.ovr, 30));
    const a = g.age;
    const ageM = a <= 20 ? 1.35 : a <= 23 ? 1.22 : a <= 27 ? 1.0 : a <= 30 ? 0.82 : a <= 32 ? 0.62 : a <= 34 ? 0.45 : 0.3;
    const potM = 1 + clamp(num(g.ppot) - num(g.ovr), 0, 30) * 0.022 * (a <= 25 ? 1 : 0.4);
    const chaM = 1 + (num(g.cha, 40) - 50) * 0.003;
    const injM = g.injury && g.injury.l === 3 ? 0.88 : 1;
    return Math.max(100, Math.round(base * ageM * potM * chaM * injM / 10) * 10);
  },
  expectedWage(g) {
    return Math.max(12, Math.round(this.value(g) * ECON.wageRate));
  }
};

// ---------------------------------------------------------------- world
const WorldGenerator = {
  clubNames(reg) {
    const out = new Set();
    const cities = CITIES[reg];
    let guard = 0;
    while (out.size < 48 && guard++ < 5000) {
      const r = R.next();
      let n;
      if (r < 0.38) n = 'Ludus ' + R.pick(LUDUS_STEMS);
      else if (r < 0.86) n = R.pick(cities) + ' ' + R.pick(CLUB_SUFFIX);
      else n = R.pick(cities) + ' Ludusu';
      out.add(n);
    }
    return [...out];
  },
  crest(reg) {
    const pal = REGION_BY_ID[reg].pal;
    const regCols = [pal.a, pal.b, pal.d];
    const c1 = R.chance(0.6) ? R.pick(regCols) : R.pick(CREST_COLORS);
    let c2 = R.pick(CREST_COLORS); let guard = 0;
    while (c2 === c1 && guard++ < 10) c2 = R.pick(CREST_COLORS);
    return { sh: R.int(0, CREST_SHAPES.length - 1), sy: R.int(0, CREST_SYMBOLS.length - 1), c1, c2 };
  },
  staffMember(reg, q) {
    const N = NAMES[reg];
    q = Math.round(clamp(q, 5, 95));
    return { n: R.pick(N.f) + ' ' + R.pick(N.l), q, w: Economy.staffWage(q) };
  },
  pickPolicy(tier) {
    const w = { rich: tier <= 2 ? 2.2 : tier <= 4 ? 0.8 : 0.3, talent: 1.2, econ: tier >= 4 ? 1.6 : 0.7, def: 1, agg: 1 };
    return R.weighted(Object.keys(w), k => w[k]);
  },
  addItem(club, type, q, plus = 0) {
    const id = GameState.newId('i');
    S.items[id] = { id, t: type, q, p: plus, club: club.id, g: 0 };
    return S.items[id];
  },
  randomItemFor(club, g, slot, q) {
    const types = Object.keys(ITEM_TYPES).filter(t => ITEM_TYPES[t].slot === slot && ITEM_TYPES[t].cls.includes(g.cls));
    if (!types.length) return null;
    const it = this.addItem(club, R.pick(types), q, 0);
    Equipment.equip(it.id, g.id, true);
    return it;
  },
  makeClub(id, reg, tier, name) {
    const T = TIERS[tier];
    const pol = this.pickPolicy(tier);
    const off = R.normal(0, 2.4);
    const club = {
      id, n: name, reg, tier, lg: GameState.leagueIndex(GameState.regIdx(reg), tier),
      crest: this.crest(reg),
      rep: Math.round(clamp(T.rep + R.normal(0, 5) + off * 1.5, 3, 99)),
      fans: Math.round(R.range(T.fans[0], T.fans[1])),
      budget: Math.round(T.eco * R.range(5500, 13000) * (pol === 'rich' ? 1.5 : pol === 'econ' ? 0.95 : 1)),
      pol,
      fac: { train: R.int(T.fac[0], T.fac[1]), med: R.int(T.fac[0], T.fac[1]), scout: R.int(T.fac[0], T.fac[1]), arena: R.int(T.fac[0], T.fac[1]) },
      staff: {},
      roster: [], lineup: [], tactic: 'balanced',
      riv: {}, arrears: 0, loan: null, loanSeason: 0,
      sponsor: null,
      seasonFin: Economy.blankFin(), weekFin: Economy.blankFin(), finHist: [],
      st: { w: 0, l: 0, ko: 0, homeW: 0 },
      hist: [], trophies: [], off, isPlayer: false
    };
    if (tier === 1 && club.fac.arena < 4) club.fac.arena = R.chance(0.6) ? 4 : club.fac.arena;
    if (tier === 2 && club.fac.arena < 3) club.fac.arena = 3;
    if (tier === 3 && club.fac.arena < 2) club.fac.arena = 2;
    for (const s of STAFF_IDS) club.staff[s] = this.staffMember(reg, R.range(T.staff[0], T.staff[1]));
    return club;
  },
  fillRoster(club, baseOvr, opts = {}) {
    const offs = [3.2, 2, 1, -2.2, -4];
    const tier = club.tier;
    for (let i = 0; i < 5; i++) {
      const reg = R.chance(0.75) ? club.reg : R.pick(REGIONS).id;
      const target = baseOvr + offs[i] + club.off + R.normal(0, 2.6);
      const g = GladiatorGenerator.create({ reg, ovr: target, age: opts.age ? opts.age() : undefined });
      S.glads[g.id] = g;
      Transfer.attach(g, club, {
        wage: Math.round(TransferMath.expectedWage(g) * R.range(0.85, 1.12)),
        yrs: R.int(1, 4), sign: 0
      }, true);
      // starting equipment
      if (!opts.noItems) {
        const qMean = (6 - tier) * 0.72;
        for (const slot of ['w', 'a', 'x']) {
          if (R.chance(0.22 + (6 - tier) * 0.15)) {
            const q = clamp(Math.round(R.normal(qMean, 0.75)), 0, 4);
            this.randomItemFor(club, g, slot, q);
          }
        }
      }
    }
    ClubAI.pickLineup(club);
  },
  generate(seed) {
    R = new RNG(seed);
    S = {
      v: SAVE_VERSION, gv: GAME_VERSION, seed, rng: null, season: 1, week: 0, player: -1,
      clubs: [], glads: {}, items: {}, nid: { g: 1, i: 1, o: 1 },
      leagues: [], rcups: {}, icup: null, icupQual: [],
      news: [], hist: { seasons: [], retired: [], records: {}, champs: [] },
      transfers: [], offers: [], nego: {}, scout: {}, scoutUsed: 0,
      sponsorOffers: [], staffCands: null,
      flags: { tut: 0, done: {} }, settings: { sound: true }, created: Date.now()
    };
    let cid = 0;
    REGIONS.forEach((reg, ri) => {
      const names = R.shuffle(this.clubNames(reg.id));
      for (let tier = 1; tier <= 6; tier++) {
        const lgClubs = [];
        for (let k = 0; k < 8; k++) {
          const club = this.makeClub(cid, reg.id, tier, names[(tier - 1) * 8 + k]);
          S.clubs.push(club);
          lgClubs.push(cid);
          cid++;
        }
        S.leagues.push({ id: ri * 6 + tier - 1, reg: reg.id, tier, clubs: lgClubs, rounds: [] });
      }
    });
    for (const club of S.clubs) this.fillRoster(club, TIERS[club.tier].ovr);
    // free agent pool
    for (let i = 0; i < 200; i++) {
      const t = R.weighted([1, 2, 3, 4, 5, 6], x => [0.04, 0.08, 0.14, 0.2, 0.26, 0.28][x - 1]);
      const g = GladiatorGenerator.create({ ovr: TIERS[t].ovr - 4 + R.normal(0, 4) });
      g.fw = R.int(0, 6);
      S.glads[g.id] = g;
    }
    // historical rivalries
    for (const lg of S.leagues) {
      for (let k = 0; k < 2; k++) {
        const a = R.pick(lg.clubs), b = R.pick(lg.clubs);
        if (a !== b) Rivalry.add(a, b, R.int(18, 42));
      }
    }
    for (const club of S.clubs) club.goal = ClubAI.seasonGoal(club);
    Leagues.createAllFixtures();
    Cups.createRegionalAll();
    GameState.news('İmparatorluk Kupası ilk sezonda düzenlenmez; katılımcılar bu sezon Altın Kolezyum liglerini ilk iki sırada bitiren kulüplerden belirlenecek.', { k: 'cup' });
    GameState.syncRng();
    return S;
  },

  // --- career start A: build a new ludus replacing a tier-6 club in region
  createNewLudus(regId, name, crest) {
    const ri = GameState.regIdx(regId);
    const lg = S.leagues[GameState.leagueIndex(ri, 6)];
    const replaceId = R.pick(lg.clubs);
    const old = S.clubs[replaceId];
    // release the old club's gladiators into the free market (nobody is deleted)
    for (const gid of old.roster.slice()) Transfer.detach(S.glads[gid], { reason: 'Kulüp el değiştirdi' });
    for (const iid in S.items) if (S.items[iid].club === old.id) delete S.items[iid];
    for (const c of S.clubs) if (c.riv[old.id]) delete c.riv[old.id];
    const club = this.makeClub(replaceId, regId, 6, name);
    club.crest = crest;
    club.rep = 14; club.fans = 380; club.budget = ECON.startCash; club.pol = 'econ'; club.off = 0;
    club.fac = { train: 1, med: 1, scout: 1, arena: 1 };
    for (const s of STAFF_IDS) club.staff[s] = this.staffMember(regId, R.range(18, 28));
    club.roster = []; club.riv = {};
    S.clubs[replaceId] = club;
    // five low level gladiators, varied classes
    const classes = R.shuffle(CLASS_IDS.slice()).slice(0, 5);
    for (let i = 0; i < 5; i++) {
      const g = GladiatorGenerator.create({ reg: R.chance(0.8) ? regId : R.pick(REGIONS).id, cls: classes[i], ovr: R.range(36, 41), age: R.int(19, 29) });
      S.glads[g.id] = g;
      Transfer.attach(g, club, { wage: TransferMath.expectedWage(g), yrs: R.int(2, 3), sign: 0 }, true);
    }
    ClubAI.pickLineup(club);
    club.goal = ClubAI.seasonGoal(club);
    return club;
  },
  setPlayer(clubId, isNew) {
    S.player = clubId;
    const c = S.clubs[clubId];
    c.isPlayer = true;
    c.newLudus = !!isNew;
    // player club starts with a few basic items in inventory so the equipment screen is meaningful
    if (isNew) {
      const g0 = GameState.rosterGlads(c)[0];
      if (g0) this.randomItemFor(c, g0, 'a', 0);
    }
    for (const gid of c.roster) S.scout[gid] = 2;
    Sponsors.generateOffers();
    Staff.generateCandidates();
    GameState.news(`${c.n} yönetimini devraldınız. ${TIERS[c.tier].n} (${REGION_BY_ID[c.reg].name}) sizi bekliyor!`, { p: 1, k: 'club' });
    GameState.syncRng();
  }
};

const Rivalry = {
  add(a, b, v) {
    if (a === b) return;
    const A = S.clubs[a], B = S.clubs[b];
    if (!A || !B) return;
    A.riv[b] = Math.round(clamp((A.riv[b] || 0) + v, 0, 100));
    B.riv[a] = Math.round(clamp((B.riv[a] || 0) + v, 0, 100));
  },
  get(a, b) { const A = S.clubs[a]; return A ? (A.riv[b] || 0) : 0; },
  decay() {
    for (const c of S.clubs) for (const k in c.riv) { c.riv[k] = Math.round(c.riv[k] * 0.88); if (c.riv[k] < 3) delete c.riv[k]; }
  }
};

// ---- 03_combat.js
/* =========================================================================
   CombatEngine + CombatAI — deterministic fixed-step 3v3 simulation.
   Rendering never touches this; the renderer only reads unit state + events.
   ========================================================================= */

const ARENA_RX = 10.4, ARENA_RY = 5.9;
const COMBAT_DT = 0.1;
const COMBAT_MAX_T = 120;
const DMG_SCALE = 0.86;

const STANCE = {
  balanced: { out: 1, inn: 1, en: 1, atk: 1 },
  aggr: { out: 1.15, inn: 1.10, en: 1.25, atk: 0.92 },
  def: { out: 0.88, inn: 0.90, en: 0.80, atk: 1.08 }
};

const CombatEngine = {
  // ------------------------------------------------------------ setup
  makeUnit(g, side, slot, pressure) {
    const C = CLASSES[g.cls];
    const it = Equipment.bonuses(g);
    const cond = num(g.cond, 100), mor = num(g.mor, 60);
    const condF = 0.72 + 0.28 * Math.min(1, cond / 80);
    const morF = clamp(1 + (mor - 60) / 40 * 0.04, 0.95, 1.05);
    const clutchF = 1 + (num(g.clu, 50) - 50) / 50 * 0.06 * pressure;
    const str = num(g.str, 30), end = num(g.end, 30), agi = num(g.agi, 30), tec = num(g.tec, 30), dis = num(g.dis, 30);
    const enMax = 70 + end * 0.8;
    const sgn = side === 0 ? -1 : 1;
    const pos = [[4.2, 0], [5.8, -2.5], [5.8, 2.5]][slot];
    const u = {
      i: side * 3 + slot, side, slot, gid: g.id, temp: !!g.temp, name: g.n, cls: g.cls, look: g.look,
      x: sgn * pos[0], y: (side === 0 ? 1 : -1) * pos[1], px: 0, py: 0, face: -sgn,
      hpMax: 120 + end * 1.2 + C.hp + it.hp, hp: 0, enMax, en: enMax * (0.55 + 0.45 * cond / 100),
      alive: true, elimT: -1, lastHit: -1, tgt: -1, retgt: 0,
      atkCd: 0.4 + slot * 0.25, spCd: 3 + slot * 0.8, act: null,
      st: { slow: 0, slowF: 1, root: 0, stag: 0, guard: 0, pur: 0, sprint: 0, evb: 0, kb: 0, kbx: 0, kby: 0, ret: 0, retCd: 0 },
      perf: condF * morF * clutchF,
      dmg: (C.dmg + 2.6 + str * 0.055 + it.dmg) * (1 + (tec - 50) * 0.001),
      armor: C.armor + end * 0.05 + it.armor,
      block: C.block > 0 ? C.block + it.block + tec * 0.0012 : it.block,
      eva: C.eva + 0.035 + agi * 0.0012 + it.eva,
      accMod: it.acc,
      crit: 0.035 + agi * 0.0006 + C.crit + it.crit,
      speed: (1.75 + agi * 0.021) * C.spd * (0.85 + 0.15 * condF) * (1 + it.spd),
      atkInt: C.atk * (1.1 - agi * 0.002),
      range: C.range, tec, agi, dis, eff: 0.8 + tec / 250 + it.special,
      comp: 0.55 + dis / 220,
      rec: { dmg: 0, tk: 0, ko: 0, blk: 0, hit: 0, miss: 0, sp: 0, ev: 0, att: 0 },
      walk: 0
    };
    u.hp = u.hpMax; u.px = u.x; u.py = u.y;
    return u;
  },
  /** setup = { seed, pressure, headless, sides:[{cid,name,tactic,glads:[3],auto,colors}, ...] } */
  create(setup) {
    const m = {
      t: 0, tick: 0, over: false, result: null, seed: setup.seed >>> 0,
      rng: new RNG(setup.seed >>> 0), headless: !!setup.headless,
      pressure: num(setup.pressure, 0.3), events: [], units: [], teams: []
    };
    setup.sides.forEach((sd, side) => {
      const tac = TACTICS[sd.tactic] ? sd.tactic : 'balanced';
      m.teams.push({
        side, cid: sd.cid, name: sd.name, tactic: tac, auto: sd.auto !== false,
        stance: tac === 'aggressive' ? 'aggr' : tac === 'defensive' ? 'def' : 'balanced',
        guardMode: tac === 'guard', focusTac: tac === 'focus', focus: -1, cmdCd: 0, coachT: 1,
        colors: sd.colors || ['#888', '#444']
      });
      sd.glads.slice(0, 3).forEach((g, slot) => m.units.push(this.makeUnit(g, side, slot, m.pressure)));
    });
    for (const t of m.teams) if (t.focusTac) CombatAI.autoFocus(m, t);
    return m;
  },

  // ------------------------------------------------------------ helpers
  enemiesOf(m, u) { return u.side === 0 ? [3, 4, 5] : [0, 1, 2]; },
  alliesOf(m, u) { return u.side === 0 ? [0, 1, 2] : [3, 4, 5]; },
  dist(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy); },
  stanceOf(m, u) { return STANCE[m.teams[u.side].stance]; },
  modS(base, comp) { return 1 + (base - 1) * comp; },
  ev(m, e) { if (!m.headless) m.events.push(e); },

  // ------------------------------------------------------------ main loop
  step(m) {
    if (m.over) return;
    m.t = Math.round((m.t + COMBAT_DT) * 1000) / 1000;
    m.tick++;
    for (const t of m.teams) {
      if (t.cmdCd > 0) t.cmdCd = Math.max(0, t.cmdCd - COMBAT_DT);
      if (t.auto) CombatAI.coach(m, t);
      if (t.focus >= 0 && !m.units[t.focus].alive) { t.focus = -1; if (t.focusTac) CombatAI.autoFocus(m, t); }
    }
    const order = (m.tick & 1) ? [0, 3, 1, 4, 2, 5] : [3, 0, 4, 1, 5, 2];
    for (const i of order) { const u = m.units[i]; if (u) this.updateUnit(m, u); }
    this.separate(m);
    this.checkEnd(m);
  },
  run(m) { let guard = 0; while (!m.over && guard++ < 2000) this.step(m); if (!m.over) this.finish(m, 'time'); return m.result; },

  updateUnit(m, u) {
    u.px = u.x; u.py = u.y;
    if (!u.alive) return;
    const s = u.st;
    for (const k of ['slow', 'root', 'stag', 'guard', 'pur', 'sprint', 'evb', 'ret', 'retCd']) if (s[k] > 0) s[k] = Math.max(0, s[k] - COMBAT_DT);
    if (s.slow <= 0) s.slowF = 1;
    const stance = this.stanceOf(m, u);
    u.atkCd -= COMBAT_DT * (s.pur > 0 ? 1.18 : 1);
    u.spCd -= COMBAT_DT;
    const regen = 1.7 * (m.teams[u.side].stance === 'def' ? 1.2 : m.teams[u.side].stance === 'aggr' ? 0.85 : 1);
    u.en = Math.min(u.enMax, u.en + regen * COMBAT_DT);
    // knockback displacement
    if (s.kb > 0) {
      const k = Math.min(COMBAT_DT, s.kb);
      u.x += s.kbx * k; u.y += s.kby * k; s.kb -= k;
      this.bound(u);
      return;
    }
    if (s.stag > 0) return;
    if (u.act) { this.processAct(m, u); return; }

    // target selection
    u.retgt -= COMBAT_DT;
    let T = u.tgt >= 0 ? m.units[u.tgt] : null;
    if (!T || !T.alive || u.retgt <= 0) {
      u.tgt = CombatAI.chooseTarget(m, u);
      u.retgt = (u.cls === 'thraex' ? 0.4 : 0.7) + m.rng.next() * 0.4;
      T = u.tgt >= 0 ? m.units[u.tgt] : null;
    }
    if (!T) return;
    const d = this.dist(u, T);
    if (Math.abs(T.x - u.x) > 0.05) u.face = T.x > u.x ? 1 : -1;

    // special technique
    const C = CLASSES[u.cls];
    if (u.spCd <= 0 && u.en >= C.sp.en * stance.en && s.root <= 0 && CombatAI.wantSpecial(m, u, T, d)) {
      this.startSpecial(m, u, T, d);
      return;
    }
    // movement
    const mv = CombatAI.desiredMove(m, u, T, d);
    if (mv) this.moveToward(m, u, mv.x, mv.y, mv.sp);
    // basic attack
    const d2 = this.dist(u, T);
    if (d2 <= u.range + 0.12 && u.atkCd <= 0) this.startAttack(m, u, T, stance);
  },

  moveToward(m, u, tx, ty, spMul) {
    const s = u.st;
    if (s.root > 0) return;
    let dx = tx - u.x, dy = ty - u.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < 0.05) return;
    let sp = u.speed * spMul * s.slowF;
    if (s.guard > 0) sp *= 0.55;
    if (s.sprint > 0) sp *= 2.0;
    if (u.en < u.enMax * 0.2) sp *= 0.85;
    const step = Math.min(d, sp * COMBAT_DT);
    u.x += dx / d * step; u.y += dy / d * step;
    u.walk += step;
    u.en = Math.max(0, u.en - step * 0.18 * this.stanceOf(m, u).en);
    this.bound(u);
  },
  bound(u) {
    const ex = u.x / ARENA_RX, ey = u.y / ARENA_RY;
    const e = ex * ex + ey * ey;
    if (e > 0.94) { const k = Math.sqrt(0.94 / e); u.x *= k; u.y *= k; }
  },
  separate(m) {
    const U = m.units;
    for (let a = 0; a < U.length; a++) {
      const A = U[a]; if (!A.alive) continue;
      for (let b = a + 1; b < U.length; b++) {
        const B = U[b]; if (!B.alive) continue;
        let dx = B.x - A.x, dy = B.y - A.y;
        let d = Math.sqrt(dx * dx + dy * dy);
        const min = 0.9;
        if (d < min) {
          if (d < 1e-4) { dx = (a % 2 ? 1 : -1) * 0.01; dy = 0.01; d = 0.014; }
          const push = (min - d);
          const nx = dx / d, ny = dy / d;
          const aFix = A.st.root > 0 || (A.act && A.act.k === 'sp'), bFix = B.st.root > 0 || (B.act && B.act.k === 'sp');
          const wa = aFix && !bFix ? 0 : bFix && !aFix ? 1 : 0.5;
          A.x -= nx * push * wa; A.y -= ny * push * wa;
          B.x += nx * push * (1 - wa); B.y += ny * push * (1 - wa);
          this.bound(A); this.bound(B);
        }
      }
    }
  },

  // ------------------------------------------------------------ actions
  startAttack(m, u, T, stance) {
    const comp = u.comp;
    let int = u.atkInt * this.modS(stance.atk, comp) + (m.rng.next() - 0.5) * 0.16;
    if (u.en < u.enMax * 0.2) int *= 1.3;
    if (u.st.guard > 0) int *= 1.25;
    u.atkCd = int;
    u.en = Math.max(0, u.en - 3.5 * this.modS(stance.en, comp));
    // discipline errors: badly-timed swing / stumble
    if (m.rng.next() < (100 - u.dis) * 0.0006) {
      u.act = { k: 'stumble', t: 0, dur: 0.6, hits: [] };
      this.ev(m, { type: 'stumble', u: u.i });
      return;
    }
    u.act = { k: 'atk', t: 0, dur: 0.55, tg: T.i, reach: u.range + 0.4, hits: [{ t: 0.28, m: 1, acc: 0, crit: 0 }], v: m.tick % 3 };
    this.ev(m, { type: 'swing', u: u.i, tg: T.i });
  },
  startSpecial(m, u, T, d) {
    const C = CLASSES[u.cls];
    u.spCd = C.sp.cd * (1.05 - (u.eff - 0.8) * 0.25);
    u.en = Math.max(0, u.en - C.sp.en * this.stanceOf(m, u).en);
    u.rec.sp++;
    const id = C.sp.id;
    let a;
    if (id === 'shieldwall') {
      u.st.guard = 3.5 * u.eff;
      a = { k: 'sp', sp: id, t: 0, dur: 0.35, hits: [] };
    } else if (id === 'net') {
      a = { k: 'sp', sp: id, t: 0, dur: 0.75, tg: T.i, reach: 5.6, hits: [{ t: 0.45, net: true }] };
    } else if (id === 'agile') {
      a = { k: 'sp', sp: id, t: 0, dur: 0.75, tg: T.i, reach: u.range + 0.5, dash: 0.24, back: 0.42, hits: [{ t: 0.3, m: 1.45, acc: 0.15, crit: 0.1 }] };
    } else if (id === 'pursuit') {
      u.st.pur = 4.5 * u.eff; u.st.sprint = 2.0;
      a = { k: 'sp', sp: id, t: 0, dur: 0.3, hits: [] };
    } else if (id === 'combo') {
      a = { k: 'sp', sp: id, t: 0, dur: 0.82, tg: T.i, reach: u.range + 0.35, hits: [{ t: 0.22, m: 0.95, acc: 0.02, crit: 0 }, { t: 0.5, m: 0.95, acc: 0.02, crit: 0.08 }] };
    } else if (id === 'lunge') {
      a = { k: 'sp', sp: id, t: 0, dur: 0.7, tg: T.i, reach: 3.1, hits: [{ t: 0.33, m: 1.35, acc: 0.1, crit: 0, kb: 1.6 }] };
    }
    u.act = a;
    this.ev(m, { type: 'special', u: u.i, sp: id, tg: T.i });
  },
  processAct(m, u) {
    const a = u.act;
    a.t = Math.round((a.t + COMBAT_DT) * 1000) / 1000;
    const T = a.tg != null ? m.units[a.tg] : null;
    // special movement
    if (a.sp === 'agile' && T) {
      if (a.t <= a.dash + 0.001 && T.alive) {
        const d = this.dist(u, T);
        if (d > 0.85) { const k = Math.min(d - 0.8, 9 * COMBAT_DT); u.x += (T.x - u.x) / d * k; u.y += (T.y - u.y) / d * k; this.bound(u); }
      } else if (a.t > a.back && T.alive) {
        const d = Math.max(0.01, this.dist(u, T));
        const k = 4.8 * COMBAT_DT;
        u.x -= (T.x - u.x) / d * k; u.y -= (T.y - u.y) / d * k; this.bound(u);
      }
    }
    for (const h of a.hits) {
      if (!h.done && a.t >= h.t - 1e-6) {
        h.done = true;
        if (T && T.alive) {
          if (h.net) this.resolveNet(m, u, T);
          else this.resolveHit(m, u, T, h, a.reach);
        }
      }
    }
    if (a.sp === 'agile' && a.t >= a.dur - 1e-6) u.st.evb = 1.5;
    if (a.t >= a.dur - 1e-6) u.act = null;
  },
  guardAura(m, T) {
    // allied Murmillo holding Kalkan Siperliği protects nearby teammates
    for (const i of this.alliesOf(m, T)) {
      const A = m.units[i];
      if (A !== T && A.alive && A.st.guard > 0 && this.dist(A, T) < 2.5) return 0.8;
    }
    return 1;
  },
  resolveHit(m, u, T, h, reach) {
    const rng = m.rng;
    const d = this.dist(u, T);
    u.rec.att++;
    if (d > reach) { u.rec.miss++; this.ev(m, { type: 'whiff', u: u.i, tg: T.i }); return; }
    const so = this.modS(this.stanceOf(m, u).out, u.comp);
    const si = this.modS(this.stanceOf(m, T).inn, T.comp);
    let acc = 0.8 + (u.tec - T.tec) * 0.0025 + u.accMod + h.acc + (u.st.pur > 0 ? 0.12 : 0);
    acc = clamp(acc, 0.45, 0.97);
    if (rng.next() >= acc) { u.rec.miss++; this.ev(m, { type: 'miss', u: u.i, tg: T.i }); return; }
    let eva = T.eva + (T.st.evb > 0 ? 0.2 : 0);
    if (T.st.root > 0 || T.st.stag > 0) eva *= 0.25;
    if (T.act && T.act.k === 'atk') eva *= 0.6;
    eva = clamp(eva, 0, 0.35);
    if (rng.next() < eva) { T.rec.ev++; this.ev(m, { type: 'evade', u: u.i, tg: T.i }); return; }
    const crit = rng.next() < u.crit + h.crit;
    let dmg = u.dmg * h.m * (crit ? 1.7 : 1) * rng.range(0.8, 1.2) * so * u.perf;
    if (u.st.pur > 0) dmg *= 1.22;
    if (u.en < u.enMax * 0.2) dmg *= 0.85;
    // shield block
    let blockCh = T.block * (T.st.guard > 0 ? 1.5 : 1) * (m.teams[T.side].stance === 'def' ? 1.08 : 1);
    if (T.st.root > 0 || T.st.stag > 0) blockCh = 0;
    if ((u.x - T.x) * T.face < 0) blockCh *= 0.3; // attacked from behind
    const blocked = rng.next() < blockCh;
    if (blocked) { dmg *= 0.42; T.rec.blk++; T.en = Math.max(0, T.en - 2); }
    const mit = clamp(T.armor / (T.armor + 45), 0, 0.55);
    dmg *= (1 - mit);
    dmg *= si * (T.st.guard > 0 ? 0.5 : 1) * this.guardAura(m, T);
    dmg = Math.max(1, dmg * DMG_SCALE);
    dmg = Math.round(dmg * 10) / 10;
    T.hp -= dmg; u.rec.dmg += dmg; u.rec.hit++; T.rec.tk += dmg; T.lastHit = u.i;
    if (h.kb && T.hp > 0) {
      const dd = Math.max(0.01, d);
      const kbd = h.kb * (T.st.guard > 0 ? 0.5 : 1);
      T.st.kb = 0.25; T.st.kbx = (T.x - u.x) / dd * kbd / 0.25; T.st.kby = (T.y - u.y) / dd * kbd / 0.25;
      T.st.stag = 0.6 + 0.25; T.act = null;
    }
    this.ev(m, { type: 'hit', u: u.i, tg: T.i, dmg, crit, blocked, sp: u.act && u.act.sp || null });
    if (T.hp <= 0) this.eliminate(m, T, u);
  },
  resolveNet(m, u, T) {
    const d = this.dist(u, T);
    u.rec.att++;
    let p = clamp(0.62 + (u.tec - T.agi) * 0.006 + (u.eff - 1), 0.3, 0.92);
    if (d > 5.6) p = 0;
    if (T.st.evb > 0) p *= 0.6;
    const ok = m.rng.next() < p;
    if (ok) {
      T.st.root = 1.3 * u.eff; T.st.slow = 3.3; T.st.slowF = 0.5;
      if (T.act && T.act.k !== 'sp') T.act = null;
      u.rec.hit++;
    } else u.rec.miss++;
    this.ev(m, { type: 'net', u: u.i, tg: T.i, ok });
  },
  eliminate(m, T, by) {
    T.hp = 0; T.alive = false; T.elimT = m.t; T.act = null;
    if (by) by.rec.ko++;
    for (const t of m.teams) if (t.focus === T.i) t.focus = -1;
    this.ev(m, { type: 'elim', u: T.i, by: by ? by.i : -1 });
  },

  // ------------------------------------------------------------ result
  checkEnd(m) {
    const a0 = m.units.filter(u => u.side === 0 && u.alive).length;
    const a1 = m.units.filter(u => u.side === 1 && u.alive).length;
    if (a0 === 0 || a1 === 0) this.finish(m, 'ko', a0 === 0 ? 1 : 0);
    else if (m.t >= COMBAT_MAX_T - 1e-6) this.finish(m, 'time');
  },
  finish(m, reason, winner) {
    if (m.over) return;
    const side = s => m.units.filter(u => u.side === s);
    const surv = [0, 1].map(s => side(s).filter(u => u.alive).length);
    const hpp = [0, 1].map(s => { const U = side(s); return U.reduce((a, u) => a + Math.max(0, u.hp), 0) / Math.max(1, U.reduce((a, u) => a + u.hpMax, 0)); });
    const dmg = [0, 1].map(s => side(s).reduce((a, u) => a + u.rec.dmg, 0));
    const ko = [0, 1].map(s => side(s).reduce((a, u) => a + u.rec.ko, 0));
    let w = winner, why = reason;
    if (reason !== 'ko') {
      if (surv[0] !== surv[1]) { w = surv[0] > surv[1] ? 0 : 1; why = 'surv'; }
      else if (Math.abs(hpp[0] - hpp[1]) > 1e-6) { w = hpp[0] > hpp[1] ? 0 : 1; why = 'hp'; }
      else if (Math.abs(dmg[0] - dmg[1]) > 1e-6) { w = dmg[0] > dmg[1] ? 0 : 1; why = 'dmg'; }
      else { w = (m.seed & 1); why = 'coin'; } // neutral, pre-determined by match seed
    }
    m.over = true;
    m.result = {
      w, why, t: m.t, surv, hpp: hpp.map(v => Math.round(v * 1000) / 1000), dmg: dmg.map(v => Math.round(v)), ko,
      units: m.units.map(u => ({ gid: u.gid, temp: u.temp, side: u.side, alive: u.alive, hpf: Math.max(0, u.hp) / u.hpMax, enf: u.en / u.enMax, rec: u.rec }))
    };
    this.ev(m, { type: 'end', w });
  }
};

// ---------------------------------------------------------------- CombatAI
const CombatAI = {
  chooseTarget(m, u) {
    const team = m.teams[u.side];
    let best = -1, bs = -1e9;
    const noiseAmp = (100 - u.dis) * 0.05;
    for (const i of CombatEngine.enemiesOf(m, u)) {
      const e = m.units[i];
      if (!e.alive) continue;
      const d = CombatEngine.dist(u, e);
      let s = -d * 0.9 + (1 - e.hp / e.hpMax) * 3.0;
      if (i === u.tgt) s += u.cls === 'secutor' ? 3 : u.cls === 'thraex' ? 0.6 : 1.5;
      if (team.focus === i) s += 4 * u.comp;
      switch (u.cls) {
        case 'thraex': s += (20 - e.armor) * 0.08 + (e.block < 0.1 ? 0.8 : 0); break;
        case 'dimachaerus': if (e.cls === 'murmillo') s -= 2; if (e.st.guard > 0) s -= 3; s += (15 - e.armor) * 0.06; break;
        case 'retiarius': if (e.cls === 'thraex' || e.cls === 'dimachaerus' || e.cls === 'secutor') s += 1; break;
        case 'secutor': if (e.cls === 'retiarius' || e.cls === 'thraex' || e.cls === 'dimachaerus') s += 1.2; break;
        case 'murmillo': {
          // protect: prefer enemies currently attacking a weakened ally
          if (e.tgt >= 0) { const A = m.units[e.tgt]; if (A && A.side === u.side && A !== u && A.hp / A.hpMax < 0.6) s += 2.5; }
          s += e.dmg * 0.04; break;
        }
        case 'hoplomachus': s -= Math.abs(d - 1.8) * 0.5; break;
      }
      s += (m.rng.next() - 0.5) * noiseAmp;
      if (s > bs) { bs = s; best = i; }
    }
    return best;
  },
  wantSpecial(m, u, T, d) {
    const id = CLASSES[u.cls].sp.id;
    const hpF = u.hp / u.hpMax;
    const rng = m.rng;
    switch (id) {
      case 'shieldwall': {
        const guardTeam = m.teams[u.side].guardMode;
        let threats = 0;
        for (const i of CombatEngine.enemiesOf(m, u)) { const e = m.units[i]; if (e.alive && CombatEngine.dist(u, e) < 2.4) threats++; }
        if (threats >= 2) return true;
        if (hpF < (guardTeam ? 0.85 : 0.7) && threats >= 1) return true;
        for (const i of CombatEngine.alliesOf(m, u)) {
          const A = m.units[i];
          if (A === u || !A.alive || A.hp / A.hpMax > (guardTeam ? 0.7 : 0.55) || CombatEngine.dist(u, A) > 2.4) continue;
          for (const j of CombatEngine.enemiesOf(m, u)) { const e = m.units[j]; if (e.alive && CombatEngine.dist(e, A) < 2.4) return true; }
        }
        return false;
      }
      case 'net':
        if (d < 1.0 || d > 5.0 || T.st.root > 0 || T.st.slow > 0.5) return false;
        return (T.cls === 'thraex' || T.cls === 'dimachaerus' || T.cls === 'secutor' || T.hp / T.hpMax > 0.4) && rng.next() < 0.35;
      case 'agile': return (d > 0.9 && d < 3.4 && rng.next() < 0.45) || (d <= u.range + 0.1 && T.hp / T.hpMax < 0.5);
      case 'pursuit': return (d > 2.4 && d < 9) || ((T.cls === 'retiarius' || T.cls === 'hoplomachus' || T.cls === 'thraex') && d > 1.6 && rng.next() < 0.5);
      case 'combo': return d <= u.range + 0.1;
      case 'lunge': return d > 0.9 && d < 2.9 && rng.next() < 0.6;
    }
    return false;
  },
  desiredMove(m, u, T, d) {
    const team = m.teams[u.side];
    const dx = T.x - u.x, dy = T.y - u.y;
    const nd = Math.max(0.01, d);
    const nx = dx / nd, ny = dy / nd;
    const aggr = team.stance === 'aggr';
    const hpF = u.hp / u.hpMax;
    // retreat (defensive stance / guard order): weakened fighter backs off towards a healthier ally
    if (u.st.ret > 0 || ((team.stance === 'def' || team.guardMode) && hpF < 0.3 && u.st.retCd <= 0 && d < 2.5 && m.rng.next() < u.comp * 0.25)) {
      if (u.st.ret <= 0) { u.st.ret = 2.5; u.st.retCd = 7; }
      let best = null, bh = -1;
      for (const i of CombatEngine.alliesOf(m, u)) { const A = m.units[i]; if (A !== u && A.alive && A.hp / A.hpMax > bh) { bh = A.hp / A.hpMax; best = A; } }
      if (best && bh > hpF) return { x: best.x - nx * 1.2, y: best.y - ny * 1.2, sp: 1 };
      u.st.ret = 0;
    }
    // Murmillo guard behaviour (always tends to shield allies, strongly in Koruma Düzeni)
    if (u.cls === 'murmillo' || (team.guardMode && u.cls === 'secutor')) {
      let prot = null, worst = 2;
      for (const i of CombatEngine.alliesOf(m, u)) {
        const A = m.units[i];
        if (A === u || !A.alive) continue;
        const fr = A.hp / A.hpMax + (CLASSES[A.cls].tank ? 0.5 : 0);
        if (fr < worst) { worst = fr; prot = A; }
      }
      const threshold = team.guardMode ? 0.95 : 0.55;
      if (prot && worst < threshold) {
        let thr = null, td = 1e9;
        for (const i of CombatEngine.enemiesOf(m, u)) { const e = m.units[i]; if (e.alive) { const dd = CombatEngine.dist(e, prot); if (dd < td) { td = dd; thr = e; } } }
        if (thr && td < 3.5) {
          u.tgt = thr.i;
          const ddx = thr.x - prot.x, ddy = thr.y - prot.y, dl = Math.max(0.01, Math.sqrt(ddx * ddx + ddy * ddy));
          return { x: prot.x + ddx / dl * Math.min(1.1, dl * 0.6), y: prot.y + ddy / dl * Math.min(1.1, dl * 0.6), sp: 1.05 };
        }
      }
    }
    // cohesion in Koruma Düzeni: fragile fighters stay near the tank
    if (team.guardMode && !CLASSES[u.cls].tank) {
      for (const i of CombatEngine.alliesOf(m, u)) {
        const A = m.units[i];
        if (A.alive && A !== u && CLASSES[A.cls].tank && CombatEngine.dist(u, A) > 4 && d > u.range) return { x: lerp(T.x, A.x, 0.5), y: lerp(T.y, A.y, 0.5), sp: 1 };
      }
    }
    const ai = CLASSES[u.cls].ai;
    if (ai === 'kite' || ai === 'spacing') {
      const pref = ai === 'kite' ? 1.95 : 1.7;
      const tooClose = ai === 'kite' ? 1.35 : 1.1;
      if (d < tooClose && u.st.root <= 0) return { x: u.x - nx * 1.5, y: u.y - ny * 1.5 + (u.slot - 1) * 0.3, sp: 0.75 };
      if (d > pref + 0.25) return { x: T.x - nx * pref, y: T.y - ny * pref, sp: aggr ? 1.08 : 1 };
      return null;
    }
    const want = u.range * 0.8;
    if (d > want) {
      // approach from slightly different angles so attackers surround rather than stack
      const ang = [0, -0.7, 0.7][u.slot] + (ai === 'skirmish' && d > 2 ? 0.5 * (u.slot === 1 ? -1 : 1) : 0);
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const ax = nx * ca - ny * sa, ay = nx * sa + ny * ca;
      return { x: T.x - ax * want, y: T.y - ay * want, sp: aggr ? 1.08 : 1 };
    }
    return null;
  },
  autoFocus(m, team) {
    // pick the most fragile enemy (hp * armour weighting)
    let best = -1, bs = 1e9;
    for (const u of m.units) {
      if (u.side === team.side || !u.alive) continue;
      const s = u.hp * (1 + u.armor / 30) * (1 + u.block);
      if (s < bs) { bs = s; best = u.i; }
    }
    team.focus = best;
  },
  // assistant coach used for AI clubs (and for the player's team in simulated matches)
  coach(m, team) {
    team.coachT -= COMBAT_DT;
    if (team.coachT > 0) return;
    team.coachT = 1;
    if (team.cmdCd > 0) return;
    const mine = m.units.filter(u => u.side === team.side), theirs = m.units.filter(u => u.side !== team.side);
    const hp = U => U.reduce((a, u) => a + Math.max(0, u.hp), 0) / U.reduce((a, u) => a + u.hpMax, 0);
    const alive = U => U.filter(u => u.alive).length;
    const adv = (alive(mine) - alive(theirs)) * 0.25 + (hp(mine) - hp(theirs));
    const base = team.tactic === 'aggressive' ? 'aggr' : team.tactic === 'defensive' ? 'def' : 'balanced';
    let want = base;
    if (m.t > 25 && adv < -0.2) want = 'aggr';
    else if (m.t > 55 && adv > 0.35 && base !== 'aggr') want = 'def';
    else if (m.t > 85 && adv < -0.05) want = 'aggr';
    if (want !== team.stance) { team.stance = want; team.cmdCd = 9; return; }
    // focus finishing blows on a badly wounded enemy
    let tgt = -1;
    for (const e of theirs) if (e.alive && e.hp / e.hpMax < 0.28) tgt = e.i;
    if (tgt >= 0 && team.focus !== tgt && m.rng.next() < 0.5) { team.focus = tgt; team.cmdCd = 9; }
  },
  // player live commands. returns false while on cooldown
  command(m, side, cmd, target) {
    const team = m.teams[side];
    if (m.over || team.cmdCd > 0) return false;
    if (cmd === 'attack') team.stance = 'aggr';
    else if (cmd === 'defend') team.stance = 'def';
    else if (cmd === 'focus') { if (target == null || !m.units[target] || !m.units[target].alive || m.units[target].side === side) return false; team.focus = target; }
    team.cmdCd = 8;
    CombatEngine.ev(m, { type: 'cmd', side, cmd, tg: target });
    return true;
  }
};

/* =========================================================================
   LeagueManager (Leagues) + CupManager (Cups) + CalendarManager (Calendar)
   + MatchSystem (team building, headless play, result recording)
   ========================================================================= */

const Leagues = {
  createFixtures(lg) {
    const arr = R.shuffle(lg.clubs.slice());
    const n = arr.length; // 8
    const rounds = [];
    let rot = arr.slice(1);
    for (let r = 0; r < n - 1; r++) {
      const cur = [arr[0], ...rot];
      const ms = [];
      for (let i = 0; i < n / 2; i++) {
        const a = cur[i], b = cur[n - 1 - i];
        const flip = i === 0 ? (r % 2 === 1) : ((r + i) % 2 === 1);
        ms.push(flip ? { h: b, a, r: null } : { h: a, a: b, r: null });
      }
      rounds.push(ms);
      rot = [rot[rot.length - 1], ...rot.slice(0, -1)];
    }
    for (let r = 0; r < n - 1; r++) rounds.push(rounds[r].map(m => ({ h: m.a, a: m.h, r: null })));
    lg.rounds = rounds;
    lg.tableCache = null;
  },
  createAllFixtures() { for (const lg of S.leagues) this.createFixtures(lg); },
  rows(lg) {
    const rows = {};
    for (const cid of lg.clubs) rows[cid] = { cid, p: 0, w: 0, l: 0, pts: 0, kf: 0, ka: 0, hp: 0, form: [] };
    for (const rd of lg.rounds) for (const m of rd) {
      if (!m.r) continue;
      const H = rows[m.h], A = rows[m.a];
      if (!H || !A) continue;
      H.p++; A.p++;
      H.kf += m.r.hk; H.ka += m.r.ak; A.kf += m.r.ak; A.ka += m.r.hk;
      H.hp += m.r.hh; A.hp += m.r.ah;
      if (m.r.w === 0) { H.w++; H.pts += 3; A.l++; H.form.push('G'); A.form.push('M'); }
      else { A.w++; A.pts += 3; H.l++; A.form.push('G'); H.form.push('M'); }
    }
    return rows;
  },
  table(lg) {
    if (lg.tableCache) return lg.tableCache;
    const rows = this.rows(lg);
    const list = Object.values(rows);
    list.sort((a, b) => b.pts - a.pts || b.w - a.w);
    // resolve ties group-wise: head-to-head, elimination diff, remaining hp, deterministic (rep, id)
    const out = [];
    let i = 0;
    while (i < list.length) {
      let j = i; while (j + 1 < list.length && list[j + 1].pts === list[i].pts && list[j + 1].w === list[i].w) j++;
      const grp = list.slice(i, j + 1);
      if (grp.length > 1) {
        const ids = new Set(grp.map(r => r.cid));
        const h2h = {}; for (const r of grp) h2h[r.cid] = 0;
        for (const rd of lg.rounds) for (const m of rd) {
          if (!m.r || !ids.has(m.h) || !ids.has(m.a)) continue;
          h2h[m.r.w === 0 ? m.h : m.a] += 3;
        }
        grp.sort((a, b) => (h2h[b.cid] - h2h[a.cid]) || ((b.kf - b.ka) - (a.kf - a.ka)) || (b.hp - a.hp) ||
          (S.clubs[b.cid].rep - S.clubs[a.cid].rep) || (a.cid - b.cid));
      }
      out.push(...grp);
      i = j + 1;
    }
    out.forEach((r, k) => { r.rank = k + 1; r.form = r.form.slice(-5); });
    lg.tableCache = out;
    return out;
  },
  rankOf(cid) {
    const c = S.clubs[cid]; if (!c) return 0;
    const t = this.table(S.leagues[c.lg]);
    const r = t.find(x => x.cid === cid);
    return r ? r.rank : 0;
  },
  invalidate() { for (const lg of S.leagues) lg.tableCache = null; },
  played(lg) { let n = 0; for (const rd of lg.rounds) for (const m of rd) if (m.r) n++; return n; }
};

const Cups = {
  draw(list, neutral) {
    const arr = R.shuffle(list.slice());
    const out = [];
    for (let i = 0; i + 1 < arr.length; i += 2) {
      let h = arr[i], a = arr[i + 1];
      const H = S.clubs[h], A = S.clubs[a];
      if (!neutral && H && A && A.tier > H.tier) { const t = h; h = a; a = t; } // lower-league club hosts
      out.push({ h, a, r: null, nt: neutral ? 1 : 0 });
    }
    return out;
  },
  createRegional(regId) {
    const ri = GameState.regIdx(regId);
    const clubs = [];
    for (let t = 1; t <= 6; t++) clubs.push(...S.leagues[GameState.leagueIndex(ri, t)].clubs);
    const byes = clubs.filter(c => S.clubs[c].tier <= 2);
    const r1 = clubs.filter(c => S.clubs[c].tier >= 3);
    const cup = {
      key: 'r_' + regId, name: REGION_BY_ID[regId].name + ' Kupası', reg: regId, season: S.season,
      byes, part: clubs.slice(), cur: 0, champ: -1, runner: -1,
      rounds: RCUP_ROUNDS.map((n, k) => ({ n, wk: RCUP_WEEKS[k], m: [] }))
    };
    cup.rounds[0].m = this.draw(r1, false);
    S.rcups[regId] = cup;
    return cup;
  },
  createRegionalAll() { S.rcups = {}; for (const r of REGIONS) this.createRegional(r.id); },
  createImperial(qual) {
    // qual: [{cid, rank, pts}] — 5 champions + 5 runners-up of last season's tier-1 leagues
    if (!qual || qual.length !== 10) { S.icup = null; return null; }
    const champs = qual.filter(q => q.rank === 1);
    const runners = qual.filter(q => q.rank === 2).sort((a, b) => b.pts - a.pts || (b.kd - a.kd) || a.cid - b.cid);
    const seeds = champs.map(q => q.cid).concat(runners[0].cid);
    const pre = runners.slice(1).map(q => q.cid);
    const cup = {
      key: 'imp', name: 'İmparatorluk Kupası', reg: null, season: S.season, seeds, part: qual.map(q => q.cid),
      cur: 0, champ: -1, runner: -1, rounds: ICUP_ROUNDS.map((n, k) => ({ n, wk: ICUP_WEEKS[k], m: [] }))
    };
    cup.rounds[0].m = this.draw(pre, true).map(m => ({ ...m, nt: 0 }));
    S.icup = cup;
    return cup;
  },
  all() { const out = Object.values(S.rcups); if (S.icup) out.push(S.icup); return out; },
  winnerOf(m) { return m.r ? (m.r.w === 0 ? m.h : m.a) : -1; },
  loserOf(m) { return m.r ? (m.r.w === 0 ? m.a : m.h) : -1; },
  // after a round has been fully played, draw the next round or crown champion
  advance(cup) {
    const rd = cup.rounds[cup.cur];
    if (!rd || !rd.m.length || rd.m.some(m => !m.r)) return false;
    const winners = rd.m.map(m => this.winnerOf(m));
    const last = cup.cur === cup.rounds.length - 1;
    if (last) {
      const f = rd.m[0];
      cup.champ = this.winnerOf(f); cup.runner = this.loserOf(f);
      cup.cur = cup.rounds.length;
      Season.onCupChampion(cup);
      return true;
    }
    let next = winners;
    if (cup.key !== 'imp' && cup.cur === 0) next = winners.concat(cup.byes);
    if (cup.key === 'imp' && cup.cur === 0) next = winners.concat(cup.seeds);
    cup.cur++;
    const isFinal = cup.cur === cup.rounds.length - 1;
    cup.rounds[cup.cur].m = this.draw(next, isFinal);
    return true;
  },
  // is the club still alive in this cup (not eliminated)?
  alive(cup, cid) {
    if (!cup.part.includes(cid)) return false;
    for (let k = 0; k < cup.rounds.length; k++) {
      for (const m of cup.rounds[k].m) if (m.r && this.loserOf(m) === cid) return false;
    }
    return cup.champ < 0 || cup.champ === cid;
  },
  roundReached(cup, cid) {
    // index of the furthest round the club appeared in (byes count as reaching round 2)
    let best = -1;
    cup.rounds.forEach((rd, k) => { if (rd.m.some(m => m.h === cid || m.a === cid)) best = k; });
    if (cup.champ === cid) best = cup.rounds.length;
    if (best < 0 && cup.byes && cup.byes.includes(cid)) best = 1;
    return best;
  }
};

const Calendar = {
  isWindow(week = S.week) { return WINDOW_WEEKS.includes(week); },
  windowLabel() {
    if (S.week <= 1) return 'Sezon başı transfer dönemi açık';
    if (S.week === 15 || S.week === 16) return 'Ara transfer dönemi açık';
    if (S.week < 15) return 'Transfer dönemi 15. haftada açılacak';
    return 'Transfer dönemi gelecek sezon başında açılacak';
  },
  fixturesForWeek(week) {
    const out = [];
    const li = LEAGUE_WEEKS.indexOf(week);
    if (li >= 0) for (const lg of S.leagues) for (const m of lg.rounds[li]) out.push({ m, comp: { type: 'league', lg: lg.id, round: li } });
    const ci = RCUP_WEEKS.indexOf(week);
    if (ci >= 0) for (const cup of Object.values(S.rcups)) if (cup.rounds[ci]) for (const m of cup.rounds[ci].m) out.push({ m, comp: { type: 'rcup', key: cup.key, round: ci } });
    const ii = ICUP_WEEKS.indexOf(week);
    if (ii >= 0 && S.icup && S.icup.rounds[ii]) for (const m of S.icup.rounds[ii].m) out.push({ m, comp: { type: 'icup', key: 'imp', round: ii } });
    return out;
  },
  clubFixture(cid, week) {
    return this.fixturesForWeek(week).find(f => f.m.h === cid || f.m.a === cid) || null;
  },
  // upcoming fixtures for a club (known ones), including future cup placeholders
  upcoming(cid, n = 5) {
    const out = [];
    for (let w = S.week; w < SEASON_WEEKS && out.length < n; w++) {
      const f = this.clubFixture(cid, w);
      if (f) out.push({ w, ...f });
      else {
        const ci = RCUP_WEEKS.indexOf(w);
        const cup = S.rcups[S.clubs[cid].reg];
        if (ci >= 0 && cup && cup.cur < ci && Cups.alive(cup, cid)) out.push({ w, tbd: cup.name + ' — ' + RCUP_ROUNDS[ci] + ' (kura bekleniyor)' });
        const ii = ICUP_WEEKS.indexOf(w);
        if (ii >= 0 && S.icup && S.icup.cur < ii && Cups.alive(S.icup, cid)) out.push({ w, tbd: 'İmparatorluk Kupası — ' + ICUP_ROUNDS[ii] + ' (kura bekleniyor)' });
      }
    }
    return out;
  },
  compName(comp) {
    if (comp.type === 'league') { const lg = S.leagues[comp.lg]; return TIERS[lg.tier].s + ' · ' + (comp.round + 1) + '. Maç'; }
    if (comp.type === 'rcup') return S.rcups[comp.key.slice(2)].name + ' · ' + RCUP_ROUNDS[comp.round];
    return 'İmparatorluk Kupası · ' + ICUP_ROUNDS[comp.round];
  },
  pressure(comp) {
    if (comp.type === 'league') return 0.3;
    const rounds = comp.type === 'rcup' ? RCUP_ROUNDS.length : ICUP_ROUNDS.length;
    if (comp.round === rounds - 1) return 1;
    if (comp.round === rounds - 2) return 0.75;
    return 0.5;
  }
};

// ---------------------------------------------------------------- matches
const MatchSystem = {
  seedFor(m, comp) {
    return hashStr(S.seed + ':' + S.season + ':' + S.week + ':' + comp.type + ':' + m.h + '-' + m.a);
  },
  // returns 3 fighters (real healthy gladiators first, then temporary arena fighters)
  lineupGlads(club, seed) {
    const healthy = g => g && !g.injury;
    let ids = club.lineup.filter(id => club.roster.includes(id) && healthy(S.glads[id]));
    if (ids.length < 3) {
      const bench = club.roster.filter(id => !ids.includes(id) && healthy(S.glads[id]))
        .sort((a, b) => Squad.readiness(S.glads[b]) - Squad.readiness(S.glads[a]));
      while (ids.length < 3 && bench.length) ids.push(bench.shift());
    }
    const glads = ids.map(id => S.glads[id]);
    let k = 0;
    while (glads.length < 3) glads.push(GladiatorGenerator.tempFighter(club.tier, seed, k++));
    return glads;
  },
  sideSetup(club, opp, seed, auto) {
    let tactic = club.tactic;
    if (!club.isPlayer || club.autoManage) tactic = ClubAI.chooseTactic(club, opp);
    return {
      cid: club.id, name: club.n, tactic, auto, colors: [club.crest.c1, club.crest.c2],
      glads: this.lineupGlads(club, seed)
    };
  },
  build(m, comp, opts = {}) {
    const seed = this.seedFor(m, comp);
    const H = S.clubs[m.h], A = S.clubs[m.a];
    const live = opts.live && (H.isPlayer || A.isPlayer);
    const setup = {
      seed, pressure: Calendar.pressure(comp), headless: !live,
      sides: [
        this.sideSetup(H, A, seed, !(live && H.isPlayer)),
        this.sideSetup(A, H, seed, !(live && A.isPlayer))
      ]
    };
    return setup;
  },
  playHeadless(m, comp) {
    const setup = this.build(m, comp, { live: false });
    const match = CombatEngine.create(setup);
    const res = CombatEngine.run(match);
    this.record(m, comp, res, setup);
    return res;
  },
  // store the result and apply all post-match consequences exactly once
  record(m, comp, res, setup) {
    if (m.r) return; // idempotent: never double-record
    m.r = {
      w: res.w, hs: res.surv[0], as: res.surv[1], hk: res.ko[0], ak: res.ko[1],
      hh: Math.round(res.hpp[0] * 100), ah: Math.round(res.hpp[1] * 100), t: Math.round(res.t), y: res.why
    };
    const H = S.clubs[m.h], A = S.clubs[m.a];
    const winC = res.w === 0 ? H : A, loseC = res.w === 0 ? A : H;
    const ovrH = Squad.teamOvr(setup.sides[0].glads), ovrA = Squad.teamOvr(setup.sides[1].glads);
    const isLeague = comp.type === 'league';
    // gladiator consequences
    for (const u of res.units) {
      if (u.temp) continue;
      const g = S.glads[u.gid]; if (!g) continue;
      const won = u.side === res.w;
      const oppOvr = u.side === 0 ? ovrA : ovrH;
      Progression.afterMatch(g, u, won, oppOvr, isLeague);
    }
    // club consequences
    for (const [c, side] of [[H, 0], [A, 1]]) {
      const won = res.w === side;
      if (won) c.st.w++; else c.st.l++;
      c.st.ko += res.ko[side];
      if (won && side === 0 && isLeague) c.st.homeW++;
      if (isLeague) Economy.credit(c, 'prizes', (won ? ECON.winPrize : ECON.lossPrize) * tierEco(c.tier));
      Reputation.afterMatch(c, won, side === 0 ? A : H);
      // win bonuses from contracts
      if (won) {
        const ids = setup.sides[side].glads.filter(g => !g.temp).map(g => g.id);
        for (const id of ids) { const g = S.glads[id]; if (g && g.con && g.con.winB > 0 && g.club === c.id) Economy.debit(c, 'bonuses', g.con.winB, true); }
      }
    }
    if (!m.nt) Economy.matchday(H, A, comp);
    // cup prize money for round winner
    if (comp.type === 'rcup') Economy.credit(winC, 'prizes', ECON.rcupPrize[comp.round] * Math.pow(tierEco(winC.tier), 0.7));
    if (comp.type === 'icup') Economy.credit(winC, 'prizes', ECON.icupPrize[comp.round]);
    Rivalry.add(H.id, A.id, comp.type === 'league' ? 1 : (comp.round >= 3 ? 6 : 3));
    Leagues.invalidate();
    News.onMatch(m, comp, res, H, A, ovrH, ovrA);
  }
};

// ---- 05_mgmt.js
/* =========================================================================
   Management systems: Squad, ProgressionManager, EconomyManager, Reputation,
   Sponsors, Staff, Facilities, EquipmentManager, Scouting, News
   ========================================================================= */

const Squad = {
  readiness(g) { return g ? g.ovr * (0.7 + 0.3 * num(g.cond, 100) / 100) * (g.injury ? 0 : 1) : 0; },
  teamOvr(glads) { return glads.length ? glads.reduce((a, g) => a + num(g.ovr), 0) / glads.length : 0; },
  avgOvr(club) { return this.teamOvr(GameState.rosterGlads(club)); },
  top3(club) {
    const gl = GameState.rosterGlads(club).sort((a, b) => b.ovr - a.ovr).slice(0, 3);
    return this.teamOvr(gl);
  },
  healthyCount(club) { return GameState.rosterGlads(club).filter(g => !g.injury).length; },
  fixLineup(club) {
    club.lineup = club.lineup.filter((id, i, arr) => club.roster.includes(id) && arr.indexOf(id) === i).slice(0, 3);
    if (club.lineup.length < 3) {
      const rest = club.roster.filter(id => !club.lineup.includes(id))
        .sort((a, b) => this.readiness(S.glads[b]) - this.readiness(S.glads[a]));
      while (club.lineup.length < 3 && rest.length) club.lineup.push(rest.shift());
    }
  },
  // swap two roster entries in the player's arrangement. slots 0..2 are aces, 3..4 bench
  arrangement(club) {
    const ids = club.lineup.slice(0, 3);
    while (ids.length < 3) ids.push(null);
    const bench = club.roster.filter(id => !ids.includes(id));
    return ids.concat(bench);
  },
  setArrangement(club, arr) {
    const valid = arr.filter(id => id != null && club.roster.includes(id));
    club.lineup = arr.slice(0, 3).filter(id => id != null && club.roster.includes(id));
    // roster order mirrors arrangement for readability
    club.roster = valid.concat(club.roster.filter(id => !valid.includes(id)));
  }
};

// ---------------------------------------------------------------- progression
const Progression = {
  growthMult(club) { return club ? Math.min(1.8, FAC.trainMult[club.fac.train] * (1 + club.staff.coach.q / 100 * 0.3)) : 0.9; },
  ageFactor(g) {
    const a = g.age - g.pk;
    return a <= -8 ? 1.35 : a <= -4 ? 1.2 : a <= -1 ? 1.0 : a <= 1 ? 0.6 : a <= 3 ? 0.3 : 0.1;
  },
  afterMatch(g, u, won, oppOvr, isLeague) {
    const rec = u.rec;
    const add = st => { st.m++; if (won) st.w++; st.ko += rec.ko; st.dmg += Math.round(rec.dmg); st.tk += Math.round(rec.tk); if (u.alive) st.sv++; st.blk += rec.blk; };
    if (isLeague) add(g.ss);
    add(g.cs);
    g.xp = num(g.xp) + 8 + (won ? 5 : 0) + rec.ko * 4 + clamp((oppOvr - g.ovr) * 0.4, -4, 8) + (u.alive ? 2 : 0);
    g.cond = clamp(Math.round(g.cond - (11 + (1 - u.hpf) * 11 + (1 - u.enf) * 6) * (g.age > 32 ? 1.1 : 1)), 0, 100);
    g.mor = clamp(Math.round(g.mor + (won ? 4 : -3) + rec.ko), 0, 100);
    if (won) g.cha = r1(Math.min(99, g.cha + 0.1 + rec.ko * 0.06));
    g.pw = S.season * 100 + S.week;
    if (g.ovr > num(g.peak)) g.peak = g.ovr;
    // injury roll — not automatic on elimination, depends on proneness, condition and damage taken
    const club = S.clubs[g.club];
    const p = 0.024 * g.inj * (1 + (1 - u.hpf) * 1.5) * (g.cond < 45 ? 1.5 : 1) * (u.alive ? 1 : 1.35) * (1 - Staff.injReduce(club));
    if (R.next() < p) {
      const r = R.next();
      const l = r < 0.72 ? 1 : r < 0.95 ? 2 : 3;
      const w = l === 1 ? 1 : l === 2 ? R.int(2, 3) : R.int(4, 6);
      g.injury = { l, w };
      if (g.club === S.player) GameState.news(`${g.n} ${['', 'hafif', 'orta', 'ağır'][l]} sakatlık geçirdi (${w} hafta).`, { p: 1, k: 'inj' });
    }
  },
  convertXP(g, club) {
    if (!(g.xp > 0)) { g.xp = 0; return; }
