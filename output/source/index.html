<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Caveat;font-weight:400;src:url(fonts/caveat400.ttf)}
@font-face{font-family:Caveat;font-weight:700;src:url(fonts/caveat700.ttf)}
html,body{margin:0;background:#000}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="lib.js"></script><script src="scenes.js"></script>
<script>
let ARCH;
window.ready = (async () => {
  await document.fonts.load('700 50px Caveat'); await document.fonts.load('400 50px Caveat');
  ARCH = new Image(); ARCH.src = 'archive/Whiskey_Fire_Dublin.png'; await ARCH.decode();
  makeTextures();
  const cv = document.getElementById('c'); MAINCTX = cv.getContext('2d');
  GRAINPAT = MAINCTX.createPattern(GRAIN, 'repeat');
  BUFS = [makeBuf(), makeBuf()];
  return true;
})();
window.renderAt = (t, q) => { renderFrame(t); return document.getElementById('c').toDataURL('image/jpeg', q || 0.93); };
</script></body></html>
