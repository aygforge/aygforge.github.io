function finProf(p, s) {
  switch (p) {
    case 'tri': return s < 0.3 ? s / 0.3 : 1 - (s - 0.3) / 0.7 * 0.85;
    case 'spiny': return (s < 0.15 ? s / 0.15 : 1 - (s - 0.15) * 0.75);
    case 'round': return Math.pow(Math.sin(Math.PI * s), 0.6);
    case 'low': return Math.min(1, s * 6, (1 - s) * 6);
    case 'sickle': return s < 0.2 ? s / 0.2 : Math.pow(Math.max(0.04, 1 - (s - 0.2) / 0.8), 2.2);
    case 'sail': return s < 0.08 ? s / 0.08 : 1 - 0.55 * Math.pow((s - 0.08) / 0.92, 1.5);
    case 'fringe': return Math.min(1, s * 10, (1 - s) * 10) * (0.8 + 0.2 * Math.sin(s * 50));
  }
  return Math.sin(Math.PI * s);
}

/* ---------- UI kenarlık (9-dilim) görselleri ---------- */
function frameSkin(kind) {
  const pb = new PB(24, 24);
  if (kind === 'wood') {
    for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) { const pl = Math.floor(y / 4); pb.set(x, y, (y % 4 === 0) ? '#6a4628' : (ihash(x, pl, 3) < 0.08 ? '#8a5e36' : (pl % 2 ? '#a8743e' : '#9e6c38'))); }
    for (let i = 0; i < 24; i++) { pb.set(i, 0, '#3a2414'); pb.set(i, 23, '#3a2414'); pb.set(0, i, '#3a2414'); pb.set(23, i, '#3a2414'); pb.set(i, 1, '#c8925a'); pb.set(1, i, '#c8925a'); pb.set(i, 22, '#5a3a1e'); pb.set(22, i, '#5a3a1e'); }
    for (const [x, y] of [[3, 3], [20, 3], [3, 20], [20, 20]]) { pb.set(x, y, '#e8d8a0'); pb.set(x + 1, y + 1, '#6a5a3a'); }
  } else if (kind === 'paper') {
    for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) pb.set(x, y, ihash(x, y, 1) < 0.06 ? '#eadcb8' : '#f6ecd2');
    for (let i = 0; i < 24; i++) { pb.set(i, 0, '#8a6a42'); pb.set(i, 23, '#8a6a42'); pb.set(0, i, '#8a6a42'); pb.set(23, i, '#8a6a42'); pb.set(i, 1, '#fffaf0'); pb.set(1, i, '#fffaf0'); pb.set(i, 22, '#d8c49a'); pb.set(22, i, '#d8c49a'); }
    pb.set(0, 0, null); pb.d[0] = 0; pb.d[23] = 0; pb.d[23 * 24] = 0; pb.d[23 * 24 + 23] = 0;
  } else if (kind === 'btn' || kind === 'btnP' || kind === 'btnG' || kind === 'btnR' || kind === 'btnB') {
    const base = { btn: '#c89a5e', btnP: '#a87a46', btnG: '#5aa86a', btnR: '#c8604a', btnB: '#4f86c6' }[kind];
    for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) pb.set(x, y, y < 3 && kind !== 'btnP' ? light(base, 0.25) : (y > 19 ? dark(base, 0.25) : base));
    for (let i = 0; i < 24; i++) { pb.set(i, 0, '#3a2414'); pb.set(i, 23, '#3a2414'); pb.set(0, i, '#3a2414'); pb.set(23, i, '#3a2414'); }
    pb.d[0] = 0; pb.d[23] = 0; pb.d[23 * 24] = 0; pb.d[23 * 24 + 23] = 0;
  } else if (kind === 'slot') {
    for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) pb.set(x, y, '#e4d4ae');
    for (let i = 0; i < 24; i++) { pb.set(i, 0, '#8a6a42'); pb.set(0, i, '#8a6a42'); pb.set(i, 1, '#c8b48a'); pb.set(1, i, '#c8b48a'); pb.set(i, 23, '#fff6e0'); pb.set(23, i, '#fff6e0'); }
  } else if (kind === 'dark') {
    for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) pb.set(x, y, '#2a2238e6');
    for (let i = 0; i < 24; i++) { pb.set(i, 0, '#120c1a'); pb.set(i, 23, '#120c1a'); pb.set(0, i, '#120c1a'); pb.set(23, i, '#120c1a'); pb.set(i, 1, '#4a3e5e'); pb.set(1, i, '#4a3e5e'); }
    pb.d[0] = 0; pb.d[23] = 0; pb.d[23 * 24] = 0; pb.d[23 * 24 + 23] = 0;
  }
  return pb;
}
function installSkins() {
  const kinds = ['wood', 'paper', 'btn', 'btnP', 'btnG', 'btnR', 'btnB', 'slot', 'dark'];
  let css = '';
  for (const k of kinds) { const u = Atlas.url('skin:' + k, () => frameSkin(k), 1); css += `--skin-${k}:url(${u});`; }
  const st = document.createElement('style'); st.textContent = `:root{${css}}`; document.head.appendChild(st);
}

/* boatParts(id, cfg) => {back, front, w, h, deck, stand, mounts[], motor:[x,y], water} */
function boatParts(id, cfg) {
  const col = (BOAT_COLORS.find(c => c.id === cfg.color) || BOAT_COLORS[0]).c;
  const [HC, HD, HL] = col;
  const WOOD = '#a8743e', WOODD = '#7a5228', WOODL = '#c8925a', WHITE = '#f4f0e4', WHD = '#c8c4b8', STEEL = '#8a94a0', STD = '#5a6470', GLASS = '#8ac8e8', GLD = '#4a7a9a';
  const T = { coastal_skiff: [84, 52], motorboat: [116, 74], cabin: [140, 98], offshore: [176, 126] }[id];
  const [W, H] = T; const back = new PB(W, H), front = new PB(W, H);
  const hullPoly = (pts, deck) => {
    let minY = 1e9, maxY = -1e9; pts.forEach(p => { minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); });
    front.poly(pts, HC, (x, y) => {
      const t = (y - minY) / (maxY - minY);
      let c = t < 0.12 ? HL : (t > 0.78 ? HD : HC);
      if ((y - minY) % 4 === 3 && t > 0.15 && t < 0.78) c = mix(c, HD, 0.5);
      if (t > 0.86) c = cfg.hull >= 1 ? '#8a2e2a' : '#a8463a';
      if (dith(x, y, (t - 0.7) / 0.1) && t > 0.7 && t < 0.8) c = HD;
      return c;
    });
    return { minY, maxY };
  };
  const gunwale = (x0, x1, y, rise) => { for (let x = x0; x <= x1; x++) { const yy = y - Math.round(rise(x)); front.set(x, yy, WOODD); front.set(x, yy + 1, WOOD); front.set(x, yy + 2, cfg.hull >= 2 ? '#e8c050' : WHITE); } };
  const window = (pb, x, y, w, h) => { pb.rect(x - 1, y - 1, w + 2, h + 2, WHD); pb.rect(x, y, w, h, GLASS); pb.rect(x, y + h - 2, w, 2, GLD); pb.set(x + 1, y + 1, '#e8f8ff'); pb.set(x + 2, y + 1, '#e8f8ff'); };
  const outboard = (pb, x, y, big, twin) => {
    const n = twin ? 2 : 1;
    for (let k = 0; k < n; k++) {
      const ox = x - k * 7; const w = big ? 9 : 6, h = big ? 12 : 8;
      pb.rect(ox - w, y - h, w, h, big ? '#c4473f' : '#4a5462'); pb.rect(ox - w + 1, y - h + 1, w - 2, 2, big ? '#e86a5a' : '#6a7482');
      pb.rect(ox - w + 1, y - 2, w - 2, 1, '#2a2a30');
      pb.rect(ox - Math.ceil(w / 2) - 1, y, 2, big ? 12 : 9, STD); pb.rect(ox - Math.ceil(w / 2) - 3, y + (big ? 10 : 7), 6, 2, STEEL);
    }
  };
  let res = {};
  if (id === 'coastal_skiff') {
    const deck = 32;
    // iç taraf (arka katman)

function skyCanvas(key, pal, wx, h) {

function cloudPB(v, c1, c2) {
  const r = mulberry(v * 77 + 3); const w = 46 + v * 10, h = 18; const pb = new PB(w, h + 2);
  for (let i = 0; i < 6; i++) { const cx = 8 + r() * (w - 16), cy = 9 + r() * 4, rx = 6 + r() * 8, ry = 4 + r() * 4; pb.ellipse(cx, cy, rx, ry, c1, (x, y) => y > cy + ry * 0.3 ? c2 : c1); }

  return pb;
}
const cloudSprite = (v, wx) => Atlas.get('cloud:' + v + wx, () => wx === 'rain' ? cloudPB(v, '#9aa2ae', '#7a8290') : (wx === 'cloudy' || wx === 'fog') ? cloudPB(v, '#dfe3e8', '#bcc4cc') : cloudPB(v, '#ffffff', '#dfe8ef'));

function waveFrame(seaKey, sea, f) {
  return Atlas.get('wave:' + seaKey + ':' + f, () => {
    const pb = new PB(128, 12); const top = light(sea[0], 0.45), body = sea[0], foam = '#f4fbff';
    for (let x = 0; x < 128; x++) {
      const a = (x / 128) * Math.PI * 2;
      const h = Math.round(1.4 * Math.sin(a * 2 + f / 8 * Math.PI * 2) + 0.8 * Math.sin(a * 5 - f / 8 * Math.PI * 4));
      const y0 = 4 + h;
      for (let y = y0; y < 12; y++) pb.set(x, y, y === y0 ? foam : (y === y0 + 1 ? top : body));
      if (h <= -1 && (x + f) % 7 === 0) pb.set(x, y0 + 2, light(body, 0.2));
    }
    return pb;
  });
}

/* ---------- doğa yardımcıları ---------- */
function ridge(pb, x0, x1, base, top, amp, freq, seed, c, cTop, snowAt) {
  for (let x = x0; x < x1; x++) {
    const h = top + amp * fbm(x * freq, seed, 4); const yr = Math.round(base - h);
    for (let y = yr; y < base; y++) {
      let col = c;
      if (y < yr + 2) col = cTop;
      else if (snowAt != null && h > snowAt && y < yr + (h - snowAt) * 0.6 + 2) col = (ihash(x, y, 3) < 0.15) ? '#dfe8f0' : '#f4f8fb';
      else if (dith(x, y, (y - yr) / Math.max(1, base - yr) * 0.6)) col = dark(c, 0.08);
      pb.set(x, y, col);
    }
  }
}
function treeRound(pb, x, y, r, c1, c2, trunk) {
  pb.rect(x - 1, y - r, 2, r + 1, trunk || '#6a4a2a');
  const rr = mulberry(x * 13 + y);
  for (let i = 0; i < 5; i++) { const ox = (rr() - 0.5) * r * 1.2, oy = -r - rr() * r * 0.8; pb.ellipse(x + ox, y + oy, r * 0.6 + 1, r * 0.5 + 1, c1, (px, py) => py > y + oy + 1 ? c2 : (ihash(px, py, 1) < 0.12 ? light(c1, 0.2) : c1)); }
}
function pine(pb, x, y, h, c1, c2, snow) {
  pb.rect(x, y - 3, 1, 3, '#4a3020');
  for (let k = 0; k < 4; k++) { const ty = y - 3 - k * h / 4.5, w = (h / 3) * (1 - k / 5); pb.poly([[x - w, ty], [x + 0.5, ty - h / 3], [x + w + 1, ty]], c1, (px, py) => px > x ? c2 : c1); if (snow) for (let px = Math.round(x - w * 0.5); px <= x + w * 0.5; px++) pb.set(px, Math.round(ty - h / 6) + 1, '#f4f8fb'); }
}
function cypress(pb, x, y, h, c1, c2) { pb.ellipse(x, y - h / 2, 2.5, h / 2, c1, (px) => px > x ? c2 : c1); pb.rect(x, y - 1, 1, 2, '#4a3020'); }
function palm(pb, x, y, h, lean) {
  let px = x, py = y;
  for (let i = 0; i < h; i++) { const t = i / h; px = x + lean * t * t * h * 0.35; py = y - i; pb.set(Math.round(px), py, i % 3 ? '#9a7040' : '#7a5228'); pb.set(Math.round(px) + 1, py, '#b08850'); }
  const cx = Math.round(px), cy = py;
  for (const [dx, dy] of [[-9, 3], [-7, 6], [8, 3], [7, 6], [-3, -4], [4, -4], [0, 7]]) { for (let k = 0; k <= 10; k++) { const t = k / 10; const xx = cx + dx * t, yy = cy + dy * t + Math.sin(t * Math.PI) * -2 + t * t * 3; pb.set(Math.round(xx), Math.round(yy), k % 2 ? '#3a9a3a' : '#5ab84a'); pb.set(Math.round(xx), Math.round(yy) + 1, '#2a7a2a'); } }
  pb.ellipse(cx, cy + 1, 1.5, 1.5, '#7a5228'); pb.set(cx + 2, cy + 2, '#8a6030');
}
function rocks(pb, x, base, w, h, c, seed) {
  const r = mulberry(seed || x);
  const n = 3 + Math.floor(r() * 3);
  for (let i = 0; i < n; i++) {
    const rx = w * (0.2 + r() * 0.3), ry = h * (0.4 + r() * 0.6), cx = x + (i + 0.5) / n * w + (r() - 0.5) * 6, cy = base - ry * 0.5;
    pb.ellipse(cx, cy, rx, ry, c, (px, py) => { const t = (py - (cy - ry)) / (2 * ry); if (t < 0.18) return light(c, 0.3); if (px < cx - rx * 0.4) return dark(c, 0.12); if (t > 0.75) return dark(c, 0.25); return ihash(px, py, 5) < 0.08 ? dark(c, 0.15) : c; });
  }
}
function cliff(pb, x0, x1, top, base, c, seed, cap) {
  const W = Math.max(1, x1 - x0), H = base - top;
  for (let x = x0; x < x1; x++) {
    const u = (x - x0) / W, ed = Math.min(u, 1 - u);
    const sh = ed < 0.3 ? Math.pow(1 - ed / 0.3, 1.7) * H * 0.6 : 0;
    const e = Math.round(top + sh + 14 * (fbm(x * 0.04, seed) - 0.5) + 4 * (vnoise(x * 0.35, seed + 7) - 0.5));
    for (let y = e; y < base; y++) {
      const d = y - e; let col = ((y + Math.round(fbm(x * 0.08, seed + 2) * 6)) % 9 === 0) ? dark(c, 0.16) : c;
      if (d < 2) col = light(c, 0.3); else if (cap && d < 4 + Math.round(vnoise(x * 0.5, seed) * 3)) col = (ihash(x, y, seed) < 0.2) ? dark(cap, 0.15) : cap;
      if (ihash(x, y, seed) < 0.05) col = dark(c, 0.22);
      if (u < 0.5 && dith(x, y, (0.5 - u) * 0.9)) col = mix(col, dark(c, 0.3), 0.35);
      pb.set(x, y, col);
    }
  }
}
function house(pb, x, y, w, h, wall, roof) {
  pb.rect(x, y - h, w, h, wall); pb.rect(x, y - h, 1, h, dark(wall, 0.15));
  pb.poly([[x - 2, y - h], [x + w / 2, y - h - h * 0.6], [x + w + 2, y - h]], roof);
  for (let wx = x + 2; wx < x + w - 2; wx += 4) pb.rect(wx, y - h + 3, 2, 2, '#4a6a8a');
  pb.rect(x + w / 2 - 1, y - 3, 2, 3, dark(roof, 0.2));
}
function lighthouse(pb, x, y, h, c1, c2) {
  for (let i = 0; i < h; i++) { const w = Math.round(lerp(5, 3, i / h)); pb.rect(x - w, y - i, w * 2, 1, Math.floor(i / 5) % 2 ? c1 : c2); pb.set(x - w, y - i, dark(Math.floor(i / 5) % 2 ? c1 : c2, 0.2)); }
  pb.rect(x - 4, y - h - 2, 8, 2, '#3a3a42'); pb.rect(x - 3, y - h - 6, 6, 4, '#f6e27a'); pb.rect(x - 3, y - h - 8, 6, 2, '#3a3a42'); pb.set(x, y - h - 9, '#3a3a42');
}
function island(pb, cx, base, w, h, land, sand, trees) {
  pb.ellipse(cx, base, w / 2, h, land, (x, y) => y > base - 2 ? sand : (y < base - h * 0.7 ? light(land, 0.15) : land));

/* tekne süsü: bölgeye özgü amblem (pirinç çapa, zeytin dalı, kabuk, flama, fener, çiçek, marlin) */
function ornamentPB(p, rid, ox, oy) {
  const P = (x, y, c) => p.set(ox + x, oy + y, c);
  switch (rid) {
    case 'sakin_liman': for (const [x, y] of [[6, 1], [6, 2], [6, 3], [6, 4], [6, 5], [6, 6], [6, 7], [4, 3], [5, 3], [7, 3], [8, 3], [3, 7], [4, 8], [5, 9], [7, 9], [8, 8], [9, 7], [6, 9]]) P(x, y, '#e8b830'); P(6, 0, '#f6d468'); break;
    case 'yesil_koy': for (let i = 0; i < 6; i++) { P(2 + i * 2, 8 - Math.round(Math.sin(i / 5 * Math.PI) * 5), '#5a8a3a'); P(3 + i * 2, 7 - Math.round(Math.sin(i / 5 * Math.PI) * 5), '#7ab04a'); } P(7, 4, '#4a3a5a'); P(9, 5, '#4a3a5a'); break;
    case 'kayalik_adalar': for (let y = 2; y < 10; y++) for (let x = 6 - (y >> 1); x <= 6 + (y >> 1); x++) P(x, y, (x - 6) % 2 ? '#f2c8b0' : '#e8a890'); break;
    case 'serin_akintilar': for (let y = 0; y < 10; y++) P(2, y, '#5a6470'); for (let y = 0; y < 5; y++) for (let x = 3; x < 12 - y * 1.6; x++) P(x, y, y % 2 ? '#4f86c6' : '#f4f0e4'); break;
    case 'sisli_kuzey': P(6, 0, '#3a3a42'); for (let y = 1; y < 3; y++) for (let x = 4; x < 9; x++) P(x, y, '#3a3a42'); for (let y = 3; y < 8; y++) for (let x = 4; x < 9; x++) P(x, y, y % 2 ? '#f6d838' : '#fff4a0'); for (let x = 3; x < 10; x++) P(x, 8, '#3a3a42'); break;
    case 'gunes_adalari': { const cs = ['#f26a8a', '#f2d030', '#f4f0f8', '#c87af0', '#f2a030']; for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI; P(6 + Math.round(Math.cos(a) * 5), 2 + Math.round(Math.sin(a) * 5), cs[i % 5]); } break; }
    case 'derin_mavi': for (let x = 0; x < 12; x++) P(x, 5, '#e8b830'); for (let x = 3; x < 10; x++) { P(x, 4, '#e8b830'); P(x, 6, '#c8922a'); } P(5, 2, '#e8b830'); P(6, 3, '#e8b830'); P(11, 3, '#e8b830'); P(11, 7, '#e8b830'); P(4, 4, '#1a1426'); break;
  }
}

function drawCelebration(g, t) {
  if (Game.celebrate == null) return; const k = t - Game.celebrate; if (k > 4.5 || k < 0) { if (k > 4.5) Game.celebrate = null; return; }

  for (let f = 0; f < 3; f++) { const fk = (k - f * 0.9); if (fk < 0 || fk > 1.4) continue; const cx = 160 + f * 160, cy = 80 + (f % 2) * 30; for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2; const r = fk * 40; g.fillStyle = ['#ffe070', '#ff8a7a', '#8ac8ff'][f]; g.globalAlpha = Math.max(0, 1 - fk / 1.4); g.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r + fk * fk * 10), 2, 2); } g.globalAlpha = 1; }

}

/* ---------- gün ışığı paletleri ---------- */
const DP_SKY = { morning: ['#7c86cc', '#f2a8b8', '#ffd890'], evening: ['#3e3478', '#d8648a', '#ffa858'] };
const DP_SEA = { morning: ['#f0a888', 0.16], evening: ['#c8587a', 0.24] };
const DP_GRADE = { morning: 'rgba(255,190,150,0.10)', evening: 'rgba(255,120,70,0.13)' };
const dpSun = dp => Atlas.get('dpsun:' + dp, () => { const pb = new PB(34, 34); const [a, b, c] = dp === 'morning' ? ['#ffe4b0', '#ffc870', '#fff0d0'] : ['#ffb070', '#ff7a3a', '#ffd0a0']; pb.ellipse(17, 17, 16, 16, a); pb.ellipse(17, 17, 12, 12, b); pb.ellipse(15, 15, 5, 5, c); return pb; });
const dpCloud = (v, wx, dp) => Atlas.get('dpcloud:' + v + wx + dp, () => { const base = wx === 'rain' ? ['#9a8aa0', '#7a6a88'] : dp === 'morning' ? ['#ffe0e4', '#f2b8c4'] : ['#ffc8b0', '#d8889a']; return cloudPB(v, base[0], base[1]); });
const DP_PAL_CACHE = new Map();
function dpPal(pal, dp) {
  const k = pal.sea.join() + dp; let v = DP_PAL_CACHE.get(k); if (v) return v;
  v = Object.assign({}, pal, { sea: pal.sea.map(c => mix(c, DP_SEA[dp][0], DP_SEA[dp][1])) }); DP_PAL_CACHE.set(k, v); return v;
}

/* ---------- yenilenmiş fener ---------- */
function lighthouseV3(pb, x, y, h, glow) {
  pb.rect(x - 9, y - 4, 18, 6, '#8a8478'); for (let i = 0; i < 18; i += 4) pb.rect(x - 9 + i, y - 4 + (i % 8 ? 0 : 3), 3, 2, '#a8a294'); pb.rect(x - 9, y - 5, 18, 1, '#c8c2b4');
  for (let i = 0; i < h; i++) { const w = Math.round(lerp(6, 3, i / h)); const band = Math.floor(i / 6) % 2; pb.rect(x - w, y - 5 - i, w * 2, 1, band ? '#fbf8f0' : '#d8383a'); pb.set(x - w, y - 5 - i, band ? '#d8d4c8' : '#a82a2c'); pb.set(x + w - 1, y - 5 - i, band ? '#ffffff' : '#f05050'); }
  const ty = y - 5 - h; pb.rect(x - 6, ty - 2, 12, 2, '#2a2a32'); for (let i = -5; i <= 5; i += 2) pb.set(x + i, ty - 3, '#5a5a62'); pb.rect(x - 4, ty - 8, 8, 6, '#fff8c0'); pb.rect(x - 1, ty - 8, 2, 6, '#ffffff'); pb.rect(x - 4, ty - 10, 8, 2, '#2a2a32'); pb.rect(x - 2, ty - 12, 4, 2, '#3a3a42'); pb.set(x, ty - 13, '#c8a040');
  if (glow) for (let a = 0; a < 24; a++) { const an = a / 24 * Math.PI * 2; for (let r = 7; r < 10; r++) if ((a + r) % 2) pb.set(x + Math.cos(an) * r, ty - 5 + Math.sin(an) * r * 0.8, r === 7 ? '#fff4b0' : '#ffeaa0'); }
}
/* ---------- iskele sahnesi süslemeleri ---------- */
function decoratePier(pb, i, season, pm) {
  if (pm[0] === '1' && i === 1) {
    const S0 = PIER_SURF;
    for (let x = 0; x < 190; x++) { for (let y = S0 - 32; y < S0 - 24; y++) pb.set(x, y, (x % 14 === 0) ? '#8a6038' : (y === S0 - 32 ? '#e8b878' : (y > S0 - 27 ? '#b8844a' : '#c8945a'))); pb.set(x, S0 - 33, '#6a4426'); }
    for (const lx of [24, 148]) { pb.rect(lx, S0 - 58, 2, 26, '#3a3a42'); pb.rect(lx - 2, S0 - 64, 6, 6, '#3a3a42'); pb.rect(lx - 1, S0 - 63, 4, 4, '#ffe890'); pb.set(lx, S0 - 62, '#ffffff'); }
    pb.rect(96, S0 - 40, 26, 2, '#8a5a2a'); pb.rect(96, S0 - 47, 26, 2, '#a8743e'); for (const bx of [98, 118]) pb.rect(bx, S0 - 45, 2, 12, '#6a4628');
    pb.ellipse(178, S0 - 44, 5, 5, '#e8483a', (x, y) => (Math.abs(x - 178) < 2 || Math.abs(y - (S0 - 44)) < 2) ? '#f4f0e4' : '#e8483a'); for (let y = S0 - 46; y <= S0 - 42; y++) for (let x = 176; x <= 180; x++) if (Math.hypot(x - 178, y - (S0 - 44)) < 2.2) pb.d[y * pb.w + x] = 0;
    for (let x = 4; x < 190; x += 30) { pb.rect(x, S0 - 24, 6, 3, '#8a6038'); }
  }
  if (pm[2] === '1' && i === 2) { const S0 = PIER_SURF; for (let y = S0 - 104; y < S0 - 30; y++) for (let x = 66; x < 96; x++) pb.d[y * pb.w + x] = 0; lighthouseV3(pb, 80, S0 - 25, 62, true); }
}
/* ---------- kasaba proje görselleri (townArt önbelleği proje maskesiyle anahtarlanır) ---------- */
function decorateTown(v, season, pm) {
  const g = TOWN_GROUND; const put = (cv, pb, x, y) => { const c = pb.canvas(); cv.getContext('2d').drawImage(c, x, y); };
  const main = v.main, mid = v.mid;
  if (pm[0] === '1') { /* İskele Yenilemesi */
    const x0 = TOWN_WATER_X - 40, x1 = TOWN_W - 30, pb = new PB(x1 - x0, 48);
    for (let x = 0; x < x1 - x0; x++) { pb.set(x, 40, '#6a4426'); for (let y = 41; y < 48; y++) pb.set(x, y, (x % 16 === 0) ? '#8a6038' : (y === 41 ? '#f0c088' : (y > 45 ? '#b8844a' : '#d0a064'))); }
    for (const lx of [90, 250, 410]) { pb.rect(lx, 12, 2, 29, '#3a3a42'); pb.rect(lx - 3, 5, 8, 7, '#3a3a42'); pb.rect(lx - 2, 6, 6, 5, '#ffe890'); pb.set(lx, 7, '#ffffff'); pb.rect(lx - 4, 4, 10, 1, '#2a2a32'); }
    for (const bx of [150, 330]) { pb.rect(bx, 31, 28, 2, '#8a5a2a'); pb.rect(bx, 24, 28, 2, '#a8743e'); pb.rect(bx + 2, 26, 2, 15, '#6a4628'); pb.rect(bx + 24, 26, 2, 15, '#6a4628'); pb.rect(bx + 2, 33, 2, 8, '#6a4628'); pb.rect(bx + 24, 33, 2, 8, '#6a4628'); }
    for (let x = 92; x < 410; x++) { const k = ((x - 90) % 160) / 160; pb.set(x, 18 + Math.round(Math.sin(k * Math.PI) * 6), '#c8b080'); }
    pb.ellipse(52, 30, 6, 6, '#e8483a', (x, y) => (Math.abs(x - 52) < 2 || Math.abs(y - 30) < 2) ? '#f4f0e4' : '#e8483a'); for (let y = 28; y < 33; y++) for (let x = 50; x < 55; x++) if (Math.hypot(x - 52, y - 30) < 2.5) pb.d[y * pb.w + x] = 0;
    pb.rect(230, 34, 10, 7, '#a8743e'); pb.rect(230, 34, 10, 1, '#c8925a'); pb.rect(232, 32, 6, 2, '#9ab8d0'); pb.rect(470, 36, 7, 5, '#3a6a9a'); pb.rect(469, 35, 9, 1, '#5a8aba');
    put(main, pb, x0, g - 44);
  }
  if (pm[1] === '1') { /* Balık Pazarı Düzenlemesi */
    const x0 = 596, pb = new PB(300, 160);
    for (let x = 34; x < 270; x++) { const yy = 14 + Math.round(Math.sin((x - 34) / 236 * Math.PI) * 6); pb.set(x, yy, '#5a3a1e'); if ((x - 34) % 10 === 0) { const c = ['#5fc46a', '#f2c230', '#4f86c6', '#f26a8a'][((x - 34) / 10) % 4]; for (let k = 0; k < 5; k++) pb.rect(x - 2 + Math.ceil(k / 2), yy + 1 + k, 5 - k, 1, c); } }

const Tx = {
  busy: false, lastAt: {},

    finally { this.busy = false; }

};
function spend(amount, cat) { S.cash -= amount; S.stats.spent += amount; S.today.expenses += amount; S.today.expBy[cat] = (S.today.expBy[cat] || 0) + amount; }

/* ---------- Envanter ---------- */
const Inv = {
  arr(key) { if (key === 'bag') return S.bag; if (key === 'chest') return S.chest; if (key && key.startsWith('boat:')) { const b = S.boats.byId[key.slice(5)]; return b ? b.storage : null; } return null; },
  cap(key) { if (key === 'bag') return INVC.bag[S.bagLevel][1]; if (key === 'chest') return INVC.home_chest[S.chestLevel][1]; if (key && key.startsWith('boat:')) return Boats.stats(key.slice(5)).storage; return 0; },
  label(key) { if (key === 'bag') return 'Sırt Çantası'; if (key === 'chest') return 'Ev Sandığı'; const id = key.slice(5); const b = S.boats.byId[id]; return BOAT[id].name + (b && b.name ? ' «' + b.name + '»' : '') + ' deposu'; },
  used(key) { const a = this.arr(key); return a ? a.length : 0; },
  total(key) { const a = this.arr(key); return a ? sum(a.map(s => s.q)) : 0; },
  space(key, f) { const a = this.arr(key); if (!a) return 0; let n = Math.max(0, this.cap(key) - a.length) * STACK; for (const s of a) if (s.f === f) n += STACK - s.q; return n; },
  hasRoomAny(key) { const a = this.arr(key); return !!a && a.length < this.cap(key); },
  add(key, f, n) {
    const a = this.arr(key); if (!a || !FISH[f]) return 0; let left = n;
    for (const s of a) if (s.f === f && s.q < STACK && left > 0) { const k = Math.min(STACK - s.q, left); s.q += k; left -= k; }
    while (left > 0 && a.length < this.cap(key)) { const k = Math.min(STACK, left); a.push({ f, q: k }); left -= k; }
    return n - left;
  },
  count(keys, f) { let n = 0; for (const k of keys) { const a = this.arr(k); if (a) for (const s of a) if (s.f === f) n += s.q; } return n; },
  remove(keys, f, n) {
    let left = n;
    for (const key of keys) { const a = this.arr(key); if (!a) continue; for (let i = a.length - 1; i >= 0 && left > 0; i--) { if (a[i].f !== f) continue; const k = Math.min(a[i].q, left); a[i].q -= k; left -= k; } this.normalize(key); if (left <= 0) break; }
    return n - left;
  },
  normalize(key) {
    const a = this.arr(key); if (!a) return; const order = [], tot = {};
    for (const s of a) { if (!s || s.q <= 0 || !FISH[s.f]) continue; if (!(s.f in tot)) { order.push(s.f); tot[s.f] = 0; } tot[s.f] += s.q; }
    a.length = 0; for (const f of order) { let q = tot[f]; while (q > 0) { const k = Math.min(STACK, q); a.push({ f, q: k }); q -= k; } }
  },
  species(keys) { const m = {}; for (const k of keys) { const a = this.arr(k); if (a) for (const s of a) m[s.f] = (m[s.f] || 0) + s.q; } return m; },
  activeBoatKey() { return S.boats.active ? 'boat:' + S.boats.active : null; },
  manualOrder() { const b = this.activeBoatKey(); return b ? ['bag', b] : ['bag']; },
  autoOrder() { const b = this.activeBoatKey(); return b ? [b, 'bag'] : ['bag']; },
  place(keys, f) { for (const k of keys) if (this.space(k, f) > 0) { this.add(k, f, 1); return k; } return null; },
  canPlace(keys, f) { return keys.some(k => this.space(k, f) > 0); },
  /* sahneye göre erişilebilir depolar */
  accessible() {
    if (Game.sceneName === 'Home') return ['bag', 'chest'];
    if (Game.sceneName === 'BoatFishing') return ['bag'].concat(S.boats.active ? ['boat:' + S.boats.active] : []);
    return ['bag'].concat(S.boats.owned.map(id => 'boat:' + id));
  },
  transfer(from, to, f, n) {
    return Tx.run('transfer', () => {
      const have = this.count([from], f); const k = Math.min(n, have, this.space(to, f));
      if (k <= 0) return { ok: false, msg: 'Hedef depoda yer yok.' };
      const rem = this.remove([from], f, k); const added = this.add(to, f, rem);
      if (added !== rem) throw new Error('transfer tutarsız');
      return { ok: true, n: added };
    });
  },
  transferAll(from, to) {
    return Tx.run('transferAll', () => {
      let moved = 0; const sp = this.species([from]);
      for (const f in sp) { const k = Math.min(sp[f], this.space(to, f)); if (k > 0) { const rem = this.remove([from], f, k); const added = this.add(to, f, rem); if (added !== rem) throw new Error('tutarsız'); moved += added; } }
      if (!moved) return { ok: false, msg: 'Aktarılabilecek balık veya yer yok.' };
      return { ok: true, n: moved };
    });
  },
  releaseStack(key, idx) {
    return Tx.run('release', () => { const a = this.arr(key); if (!a || !a[idx]) return { ok: false }; const s = a.splice(idx, 1)[0]; S.stats.released += s.q; S.today.released += s.q; return { ok: true, s }; });
  },
  validate(st) {
    const s = st || S; const errs = [];
    const chk = (name, arr, cap) => { if (!Array.isArray(arr)) { errs.push(name + ' dizi değil'); return; } if (arr.length > cap) errs.push(name + ' kapasite aşımı ' + arr.length + '>' + cap); arr.forEach(x => { if (!x || !FISH[x.f] || !(x.q >= 1 && x.q <= STACK) || x.q !== (x.q | 0)) errs.push(name + ' bozuk stack ' + JSON.stringify(x)); }); };
    chk('bag', s.bag, INVC.bag[s.bagLevel][1]); chk('chest', s.chest, INVC.home_chest[s.chestLevel][1]);
    for (const id of s.boats.owned) { const b = s.boats.byId[id]; if (!b) { errs.push('tekne yok ' + id); continue; } const info = BOAT_INFO[id]; let st2 = BOAT[id].initial_storage; for (const u of info.ups) if (b.ups[u.key] && u.type === 'storage') st2 = Math.max(st2, u.val); chk(id, b.storage, st2); }
    if (s.cash < 0 || s.energy < 0) errs.push('negatif değer');
    for (const k in s.baitStock) if (s.baitStock[k] < 0) errs.push('negatif yem');
    return errs;
  }
};

/* ---------- Tür seçici ---------- */
const BAND_MATCH = 1.25, BAND_MISS = 0.85;
const Selector = {
  weights(spotId, o) {
    const sp = SPOTS[spotId]; const rid = sp.region_id; const wx = S.world.weather[rid] || 'sunny';
    const season = World.season(); const ev = World.event(); const list = [];
    for (const fid in sp.weights) {
      const f = FISH[fid]; if (!f) continue; const base = sp.weights[fid];
      if (o.auto) { if (f.power > o.maxPower || f.power >= RC.hard_fish_only_manual_power) continue; }
      else if (f.power > o.rodPower + 1) continue;
      const fac = {};
      fac.bait = (!o.bait || o.bait === 'basic') ? K.basic_bait_multiplier : (f.favored_baits.includes(o.bait) ? K.bait_favorable_multiplier : K.bait_unfavorable_multiplier);
      fac.season = f.season_boost === season ? f.season_modifier : 1;
      fac.weather = f.weather_boost ? (f.weather_boost === wx ? K.weather_favorable_multiplier : (WX_BAD[f.weather_boost] === wx ? K.weather_unfavorable_multiplier : 1)) : 1;
      fac.band = !o.band ? 1 : (f.preferred_cast_band === o.band ? BAND_MATCH : ((f.preferred_cast_band === 'mid' || o.band === 'mid') ? 1 : BAND_MISS));
      fac.event = (ev && ev.species === fid && ev.region === rid) ? ev.modifier : 1;
      list.push({ id: fid, base, fac, w: base * fac.bait * fac.season * fac.weather * fac.band * fac.event });
    }
    const total = sum(list.map(x => x.w)); list.forEach(x => x.p = total > 0 ? x.w / total : 0);
    return { list, total, baseTotal: sum(Object.values(sp.weights)) };
  },
  pick(list) { const r = rand(); let acc = 0; for (const x of list) { acc += x.p; if (r < acc) return x.id; } return list[list.length - 1].id; },
  rollSize(fid) {
    const f = FISH[fid], sd = K.size_distribution; const r = rand(); let cls = 'normal';
    if (r >= sd.normal.prob) cls = r < sd.normal.prob + sd.large.prob ? 'large' : 'exceptional';
    const tr = sd[cls].t_range; const t = lerp(tr[0], tr[1], rand());
    const [l0, l1] = f.size_game_range.length_cm, [w0, w1] = f.size_game_range.weight_kg;
    return { cls, t, cm: Math.round(l0 + t * (l1 - l0)), kg: round2(w0 + Math.pow(t, 3) * (w1 - w0)) };
  }
};
const discovered = () => Object.keys(S.ency).filter(k => S.ency[k].caught > 0).length;

const Catch = {
  record(fid, size, auto) {
    const e = S.ency[fid] || (S.ency[fid] = { caught: 0, maxLen: 0, maxKg: 0, firstDay: S.day });
    const isNew = e.caught === 0; const isRecord = !isNew && size.cm > e.maxLen;
    e.caught++; if (size.cm > e.maxLen) e.maxLen = size.cm; if (size.kg > e.maxKg) e.maxKg = size.kg;
    if (isRecord) { S.stats.records++; S.today.records.push(fid); }
    if (isNew) S.today.newSpecies.push(fid);
    if (auto) { S.stats.autoCatches++; S.today.autoCatches++; } else { S.stats.manualCatches++; S.today.manualCatches++; }
    const p = FISH[fid].power; if (p === 4) S.stats.power4++; if (p === 5) S.stats.power5++;

/* ---------- Balık hali ---------- */
const Market = {
  sources(withChest) { const s = ['bag']; if (S.boats.active) s.push('boat:' + S.boats.active); if (withChest) s.push('chest'); return s; },
  betterOffer(fid) { const base = FISH[fid].base_price; let best = null; for (const o of Orders.active()) if (o.fishId === fid && Orders.remaining(o) > 0 && o.unitPrice > base && (!best || o.unitPrice > best.unitPrice)) best = o; return best; },
  sell(fid, n, src) {
    return Tx.run('marketSell', () => {
      const have = Inv.count(src, fid); const k = Math.min(n | 0, have); if (k <= 0) return { ok: false, msg: 'Satılacak balık yok.' };
      const rem = Inv.remove(src, fid, k); const inc = rem * FISH[fid].base_price;
      S.cash += inc; S.stats.totalSales += inc; S.stats.marketSales += inc; S.stats.fishSoldMarket += rem; S.today.marketIncome += inc;
      Sound.sfx('coin'); return { ok: true, n: rem, income: inc };
    });
  },
  sellAllPlan(src, includeFav) { const sp = Inv.species(src); const out = []; for (const f in sp) { if (!includeFav && S.favorites[f]) continue; out.push({ f, n: sp[f], income: sp[f] * FISH[f].base_price, better: this.betterOffer(f) }); } return out; },
  sellAll(src, includeFav) {
    return Tx.run('marketSellAll', () => {
      const plan = this.sellAllPlan(src, includeFav); if (!plan.length) return { ok: false, msg: 'Satılacak uygun balık yok.' };
      let inc = 0, cnt = 0; for (const p of plan) { const rem = Inv.remove(src, p.f, p.n); inc += rem * FISH[p.f].base_price; cnt += rem; }
      S.cash += inc; S.stats.totalSales += inc; S.stats.marketSales += inc; S.stats.fishSoldMarket += cnt; S.today.marketIncome += inc;
      Sound.sfx('coin'); return { ok: true, n: cnt, income: inc };

};

/* ---------- Sipariş panosu ---------- */
const Orders = {
  slots() { const n = Object.keys(S.world.unlocked).filter(k => S.world.unlocked[k]).length; return n >= 5 ? CFG.orders.board_slots_after_five_regions : n >= 3 ? CFG.orders.board_slots_after_three_regions : CFG.orders.starting_board_slots; },
  active() { return S.orders.filter(o => S.day < o.expiresAtDayExclusive); },
  remaining(o) { return Math.max(0, o.requestedTotal - o.delivered); },
  daysLeft(o) { return o.expiresAtDayExclusive - S.day; },
  relDelivered(cid) { return (S.customers[cid] && S.customers[cid].delivered) || 0; },
  relLevel(cid) { const d = this.relDelivered(cid); const th = CFG.orders.relationship_threshold_fish_delivered; let l = 0; th.forEach(t => { if (d >= t) l++; }); return l; },
  gen(day, opts) {
    opts = opts || {};
    const r = mulberry(hash32(S.seed, 'order', day, S.orderSeq));
    const unlocked = REGIONS.filter(x => S.world.unlocked[x.id]).map(x => x.id);
    const fut = opts.future || null; let cust;
    if (opts.customerId) cust = CUST[opts.customerId];
    else { const c = CUSTOMERS.filter(c => fut ? c.focus.includes(fut) : c.focus.some(f => unlocked.includes(f))); cust = c.length ? c[Math.floor(r() * c.length)] : CUST.bahar; }
    const regs = fut ? [fut] : cust.focus.filter(f => unlocked.includes(f));
    let pool = []; (regs.length ? regs : ['sakin_liman']).forEach(rg => REGION[rg].fish_ids.forEach(fid => pool.push(fid)));
    if (!fut) { const rp = maxRodPower(); const ok = pool.filter(fid => FISH[fid].power <= rp + 1); if (ok.length && r() < 0.88) pool = ok; }
    const existing = new Set(S.orders.map(o => o.fishId)); const p2 = pool.filter(f => !existing.has(f)); if (p2.length) pool = p2;
    const fid = pool[Math.floor(r() * pool.length)]; const f = FISH[fid];
    const lvl = this.relLevel(cust.id);
    const t = opts.fair ? 0.82 + r() * 0.18 : Math.pow(r(), 1 / (1 + 0.6 * lvl));
    const bonus = clamp(lerp(cust.bonus_range[0], cust.bonus_range[1], t), CFG.orders.bonus_min, CFG.orders.bonus_max);
    const unitPrice = roundHalfUp(f.base_price * (1 + bonus));
    let qty = Math.max(2, Math.round(lerp(0.5, 2.6, r()) * 520 / (f.base_price + 22)));
    if (r() < 0.12) qty = Math.max(qty * 4, 50);
    qty = Math.min(qty, 120);
    const dur = opts.duration || CFG.orders.durations_days[Math.floor(r() * CFG.orders.durations_days.length)];
    const o = { id: 'o' + S.orderSeq, customerId: cust.id, fishId: fid, requestedTotal: qty, delivered: 0, unitPrice, bonus: round2(bonus), createdDay: day, expiresAtDayExclusive: day + dur, future: !!fut, tag: opts.tag || null };
    S.orderSeq++; return o;
  },
  refresh(day, ev) {
    S.orders = S.orders.filter(o => o.expiresAtDayExclusive > day && o.delivered < o.requestedTotal);
    const slots = this.slots(); let fc = S.orders.filter(o => o.future).length; let guard = 0;
    while (S.orders.filter(o => !o.tag).length < slots && guard++ < 20) {
      let fut = null;
      if (fc === 0 && hrand('fut', day, S.orderSeq) < 0.22) { const nx = REGIONS.find(x => !S.world.unlocked[x.id]); if (nx) fut = nx.id; }

const Auto = {
  DEV: ['auto1', 'auto2', 'auto3'], GLB: ['auto_reel', 'sensing', 'deep_sea_gear'], anim: [],

  mountedOn(bid) { return this.DEV.filter(d => S.auto.devices[d] && S.auto.devices[d].boat === bid); },
  slotsFree(bid) { return BOAT[bid].slots - this.mountedOn(bid).length; },
  buy(id) {

      const st = this.state(id); if (st === 'owned') return { ok: false, msg: 'Zaten sahipsin.' }; if (st === 'locked') return { ok: false, msg: 'Önce ' + AUTO[AUTO[id].requires].name + ' gerekli.' };
      if (S.cash < AUTO[id].price) return { ok: false, msg: 'Paran yetmiyor.' };

  },
  mount(dev, bid) {

      if (d.boat === bid) return { ok: false, msg: 'Zaten bu teknede.' };

    });
  },
  unmount(dev) { return Tx.run('unmountDevice', () => { const d = S.auto.devices[dev]; if (!d || !d.boat) return { ok: false }; d.boat = null; return { ok: true }; }); },
  every() { return S.auto.globals.auto_reel ? AUTO.auto_reel.attempt_every_casts : AUTO.auto1.attempt_every_casts; },
  success() { return S.auto.globals.sensing ? AUTO.sensing.success : S.auto.globals.auto_reel ? AUTO.auto_reel.success : AUTO.auto1.success; },
  maxPower(bid) { let p = AUTO.auto1.max_power; if (S.auto.globals.auto_reel) p = AUTO.auto_reel.max_power; if (S.auto.globals.deep_sea_gear && bid === AUTO.deep_sea_gear.only_boat) p = AUTO.deep_sea_gear.max_power; return Math.min(p, RC.hard_fish_only_manual_power - 1); },
  pickBait() { const cur = S.gear.bait; if (cur !== 'basic' && S.baitStock[cur] > 0) return cur; for (const b of PAID_BAITS) if (S.baitStock[b] > 0) return b; return null; },
  /* tamamlanan her geçerli manuel atışta çağrılır */
  onCastComplete(spotId, mode) {
    const ev = [];
    if (mode !== 'boat' || !S.boats.active) return ev;
    if (S.auto.dailyDay !== S.day) { S.auto.dailyDay = S.day; S.auto.dailyCaught = 0; }
    const bid = S.boats.active, every = this.every();
    for (const dev of this.mountedOn(bid)) {
      const d = S.auto.devices[dev]; d.counter = Math.min(every, d.counter + 1);
      if (d.counter < every) { ev.push({ dev, type: 'tick' }); continue; }
      const reason = this.blocker(spotId, bid, dev);
      if (reason) { d.paused = reason; ev.push({ dev, type: 'paused', reason }); continue; }
      d.paused = null;
      const bait = this.pickBaitFor(dev, spotId, bid); if (!bait || !(S.baitStock[bait] > 0)) throw new Error('auto bait'); S.baitStock[bait]--; S.stats.baitUsed++; d.baitUsed = (d.baitUsed || 0) + 1; d.baitBy = d.baitBy || {}; d.baitBy[bait] = (d.baitBy[bait] || 0) + 1; d.counter = 0; S.auto.attempts++; S.stats.autoAttempts++;
      if (rand() < this.success()) {
        const sel = Selector.weights(spotId, { auto: true, maxPower: this.maxPower(bid), bait });
        let list = sel.list.filter(x => Inv.canPlace(Inv.autoOrder(), x.id));
        const tot = sum(list.map(x => x.w)); list.forEach(x => x.p = x.w / tot);
        const fid = Selector.pick(list); const size = Selector.rollSize(fid);
        const where = Inv.place(Inv.autoOrder(), fid); if (!where) throw new Error('auto place fail');
        const rec = Catch.record(fid, size, true, { bait, spot: spotId, dev }); S.auto.dailyCaught++; S.auto.total++;
        ev.push({ dev, type: 'catch', fid, size, where, rec });
      } else { S.stats.autoFails++; ev.push({ dev, type: 'miss' }); }
    }
    return ev;
  },
  blocker(spotId, bid, dev) {
    if (S.auto.dailyCaught >= CORE.auto_daily_catch_cap) return 'cap';
    const sel = Selector.weights(spotId, { auto: true, maxPower: this.maxPower(bid), bait: 'worm' }); if (!sel.list.length) return 'power';
    if (!(dev ? this.pickBaitFor(dev, spotId, bid) : this.pickBait())) return 'bait';
    const keys = Inv.autoOrder(); if (!keys.some(k => Inv.hasRoomAny(k)) && !sel.list.some(x => Inv.canPlace(keys, x.id))) return 'full';
    return null;
  },
  reasonTr: { cap: 'Günlük 6 otomatik av sınırı doldu', power: 'Bu noktadaki türler cihaz gücünü aşıyor', bait: 'Ücretli yem yok (temel yem kullanılamaz)', full: 'Depo ve çanta dolu' }

/* =====================================================================
   07_town_festivals.js : mevsim şenlikleri, balık tutma yarışması ve rakipler,
   fırın atıştırmalıkları, çay bahçesinin "günün balığı" alımı, yeni başarımlar/tetikleyiciler
   ===================================================================== */
World.festival = function (d) { d = d || S.day; const se = this.season(d), sd = this.seasonDay(d); return FESTIVALS.find(f => f.season === se && f.days.includes(sd)) || null; };
World.nextFestival = function () { for (let k = 0; k < 120; k++) { const f = this.festival(S.day + k); if (f) return { f, inDays: k }; } return null; };
const festKey = (f, d) => f.id + ':' + World.year(d || S.day);
const RIVAL = Object.fromEntries(RIVALS.map(r => [r.id, r]));

const Comp = {
  active() { return S.comp && !S.comp.done ? S.comp : null; },
  entered(f) { return !!(f && S.fest[festKey(f)]); },
  prizes(year) { return COMP.prizes.map(p => roundHalfUp(p * (1 + COMP.prize_growth_per_year * (year - 1)))); },
  start() {
    return Tx.run('compStart', () => {
      const f = World.festival(); if (!f) return { ok: false, msg: 'Bugün şenlik yok.' };
      if (this.entered(f)) return { ok: false, msg: 'Bu şenliğin yarışmasına zaten katıldın.' };
      if (this.active()) return { ok: false, msg: 'Zaten bir yarışmadasın.' };
      S.comp = { fest: f.id, year: World.year(), day: S.day, castsLeft: COMP.casts, n: 0, catches: [], rivals: RIVALS.map(r => ({ id: r.id, catches: [] })), done: false, result: null };
      S.fest[festKey(f)] = { entered: true }; S.stats.comps++; S.stats.festSeasons[f.season] = true;
      return { ok: true };
    });
  },
  score(type, cs) {
    if (!cs.length) return 0;
    if (type === 'weight') return round2(sum(cs.map(c => c.kg)));
    if (type === 'species') return new Set(cs.map(c => c.f)).size + Math.min(0.999, sum(cs.map(c => c.kg)) / 1000);
    if (type === 'biggest') return Math.max(...cs.map(c => c.kg));
    return sum(cs.map(c => FISH[c.f].base_price));
  },
  fmt(type, v) {
    if (type === 'species') return Math.floor(v) + ' tür';
    if (type === 'value') return fmt(v) + ' değer';
    return fmtKg(v) + ' kg';
  },
  standings() {
    const c = S.comp; if (!c) return []; const t = FEST[c.fest].comp;
    const rows = c.rivals.map(r => ({ id: r.id, name: RIVAL[r.id].name, score: this.score(t, r.catches), n: r.catches.length }));
    rows.push({ id: 'player', name: S.player.name + ' (sen)', score: this.score(t, c.catches), n: c.catches.length, player: true });
    return rows.sort((a, b) => b.score - a.score || (a.player ? -1 : 1));
  },
  /* her tamamlanan yarışma atışında (Tx içinde) çağrılır */
  onCast(spotId, fid, size) {
    const c = this.active(); if (!c) return;
    c.castsLeft--; if (fid) c.catches.push({ f: fid, kg: size.kg, cm: size.cm });
    const yearK = Math.min(0.12, 0.04 * (c.year - 1));
    for (const r of c.rivals) {
      const rv = RIVAL[r.id]; const rng = mulberry(hash32(S.seed, 'rival', c.fest, c.year, r.id, c.n));
      if (rng() < Math.min(0.95, 0.5 + 0.38 * rv.skill + yearK)) {
        const sel = Selector.weights(spotId, { rodPower: 2, bait: 'basic' }); let x = rng(), pick = sel.list[0];
        for (const it of sel.list) { x -= it.p; if (x < 0) { pick = it; break; } }
        const f = FISH[pick.id]; let t = rng(); for (let k = 0; k < Math.round(rv.skill * 2); k++) t = Math.max(t, rng() * (0.85 + yearK));
        const [l0, l1] = f.size_game_range.length_cm, [w0, w1] = f.size_game_range.weight_kg;
        r.catches.push({ f: f.id, kg: round2(w0 + Math.pow(t, 3) * (w1 - w0)), cm: Math.round(l0 + t * (l1 - l0)) });
      }
    }
    c.n++;
    if (c.castsLeft <= 0) this.finishIn();
  },
  finishIn() {
    const c = S.comp; const f = FEST[c.fest]; const st = this.standings(); const place = st.findIndex(r => r.player) + 1;
    const prize = place <= 3 ? this.prizes(c.year)[place - 1] : 0;
    if (prize) { S.cash += prize; S.stats.prizes += prize; S.today.prizeIncome = (S.today.prizeIncome || 0) + prize; }
    if (place <= 3) S.trophies.push({ fest: f.id, year: c.year, place, score: st[place - 1].score, day: S.day });
    S.fest[festKey(f, c.day)] = { entered: true, place, score: st.find(r => r.player).score };
    c.done = true; c.result = { fest: f.id, place, prize, standings: st };
    Sound.sfx(place === 1 ? 'fanfare' : place <= 3 ? 'ach' : 'sleep');
  },
  leave() { return Tx.run('compLeave', () => { const c = this.active(); if (!c) return { ok: false }; c.castsLeft = 0; this.finishIn(); return { ok: true }; }); },
  clearDone() { if (S.comp && S.comp.done) { S.comp = null; Save.soon(); } }
};

const Tea = {
  cfg: EXP.teahouse,
  special() {
    const rp = maxRodPower(); const regs = REGIONS.filter(r => S.world.unlocked[r.id]);

  left() { return S.tea.day === S.day ? Math.max(0, this.cfg.daily_special_qty - S.tea.n) : this.cfg.daily_special_qty; },
  sell(n, src) {

      const fid = this.special(); const k = Math.min(n | 0, this.left(), Inv.count(src, fid)); if (k <= 0) return { ok: false, msg: 'Satılacak balık yok ya da günlük alım doldu.' };

};

/* ---------------- Balıkçı Defteri ---------------- */
const Journal = {
  log(fid, size, auto, meta) {
    const L = S.journal.log[fid] || (S.journal.log[fid] = { first: S.day, last: S.day, n: 0, manual: 0, auto: 0, baits: {}, spots: {}, baitSpot: {} });
    L.n++; L.last = S.day; if (auto) L.auto++; else L.manual++;
    if (meta.bait) L.baits[meta.bait] = (L.baits[meta.bait] || 0) + 1;
    if (meta.spot) { L.spots[meta.spot] = (L.spots[meta.spot] || 0) + 1; if (meta.bait) { const k = meta.spot + '|' + meta.bait; L.baitSpot[k] = (L.baitSpot[k] || 0) + 1; } }
  },
  tier(fid) { const n = (S.ency[fid] && S.ency[fid].caught) || 0; return n >= 12 ? 3 : n >= 5 ? 2 : n >= 1 ? 1 : 0; },
  spotsOf(fid) { return SPOT_LIST.filter(s => s.weights[fid]); },
  toggleFav(fid) { if (S.journal.fav[fid]) delete S.journal.fav[fid]; else S.journal.fav[fid] = S.day; Save.soon(); },
  /* gerçek seçim formülüyle (ağırlık × yem × mevsim × hava × mesafe × olay, olta filtresi) en iyi plan */
  bestPlan(fid) {
    const rp = rodOf().power; let best = null;
    for (const sp of this.spotsOf(fid)) {
      if (!S.world.unlocked[sp.region_id]) continue;
      for (const b of BAITS) for (const band of ['near', 'mid', 'far']) {
        const w = Selector.weights(sp.id, { rodPower: rp, bait: b.id, band }); const x = w.list.find(i => i.id === fid);
        if (x && (!best || x.p > best.p + 1e-9)) best = { fid, spot: sp.id, rid: sp.region_id, bait: b.id, band, p: x.p, fac: x.fac };
      }
    }
    return best;
  },
  today(limit) {
    const out = [];
    for (const f of FISH_LIST) { if (!(S.ency[f.id] && S.ency[f.id].caught)) continue; const b = this.bestPlan(f.id); if (b) out.push(b); }
    out.sort((a, b) => b.p - a.p || FISH[b.fid].base_price - FISH[a.fid].base_price);
    return out.slice(0, limit || 10);
  },
  level(p) { return p >= 0.2 ? 'Yüksek' : p >= 0.1 ? 'Orta' : 'Düşük'; }
};

/* ---------------- Sefer Planı ---------------- */
const Plan = {
  MAX: 3,
  add(fid, target) {
    return Tx.run('planAdd', () => {
      if (!FISH[fid]) return { ok: false, msg: 'Geçersiz tür.' };
      const t = clamp(Math.round(+target || 1), 1, 99); const g = S.plan.goals.find(x => x.fid === fid);
      if (g) { g.target = t; return { ok: true, updated: true }; }
      if (S.plan.goals.length >= this.MAX) return { ok: false, msg: 'En fazla ' + this.MAX + ' hedef seçebilirsin.' };
      S.plan.goals.push({ fid, target: t, got: 0, since: S.day }); return { ok: true };
    });
  },
  setTarget(i, t) { return Tx.run('planSet', () => { const g = S.plan.goals[i]; if (!g) return { ok: false }; g.target = clamp(Math.round(+t || 1), 1, 99); g.got = Math.min(g.got, g.target); return { ok: true }; }); },
  remove(i) { return Tx.run('planDel', () => { if (!S.plan.goals[i]) return { ok: false }; S.plan.goals.splice(i, 1); return { ok: true }; }); },
  setKeep(v) { S.plan.keep = !!v; Save.soon(); },
  onCatch(fid) { for (const g of S.plan.goals) if (g.fid === fid && g.got < g.target) { g.got++; if (g.got === g.target) Bus.toast('Sefer hedefi tamam: ' + FISH[fid].name_tr + ' ' + g.got + '/' + g.target, 'good', 'map'); } },
  newDay() { if (!S.plan.keep) for (const g of S.plan.goals) { g.got = 0; g.since = S.day; } }
};

const Rivals = {
  record(c) {
    const key = c.fest + ':' + c.year; if (S.rivalLog[key]) return false; S.rivalLog[key] = S.day;
    const f = FEST[c.fest]; const st = c.result.standings;

      const place = i + 1; r.comps++; if (place === 1) r.wins++; if (place <= 3) r.podiums++; if (r.best == null || place < r.best) r.best = place;

/* ---------------- Kişisel Av Rekorları ---------------- */
const Records = {
  MAX: 10,
  consider(fid, size, auto, meta) {
    const spot = meta.spot && SPOTS[meta.spot] ? meta.spot : null; const rec = { id: ++S.recSeq, fid, cm: size.cm, kg: size.kg, rid: spot ? SPOTS[spot].region_id : null, spot, day: S.day, rod: auto ? null : (meta.rod || S.gear.rod), dev: auto ? (meta.dev || null) : null, auto: !!auto };
    S.records.push(rec); this.prune();
    return S.records.includes(rec);
  },
  prune() {
    const keep = new Set(S.recWall);
    const sorted = S.records.slice().sort((a, b) => b.kg - a.kg || b.cm - a.cm);
    const top = new Set(sorted.slice(0, this.MAX).map(r => r.id));
    S.records = sorted.filter(r => top.has(r.id) || keep.has(r.id));
  },
  top() { return S.records.slice().sort((a, b) => b.kg - a.kg || b.cm - a.cm).slice(0, this.MAX); },
  toggleWall(id) { const i = S.recWall.indexOf(id); if (i >= 0) S.recWall.splice(i, 1); else { if (S.recWall.length >= 5) return { ok: false, msg: 'Duvarda en fazla 5 rekor sergilenebilir.' }; if (!S.records.find(r => r.id === id)) return { ok: false }; S.recWall.push(id); } this.prune(); Save.soon(); return { ok: true }; },
  /* eski kayıtlar: yalnızca ansiklopedideki ağırlık rekoru bilinir; boy rekoru ayrı tutulduğundan birleştirilmez */
  legacyFill(st) {
    if (st.records && st.records.length) return;
    st.records = []; let seq = st.recSeq || 0;
    for (const fid in st.ency) { const e = st.ency[fid]; if (e && e.caught && e.maxKg > 0 && FISH[fid]) st.records.push({ id: ++seq, fid, cm: null, kg: e.maxKg, rid: FISH[fid].home_region, spot: null, day: null, rod: null, dev: null, auto: null, legacy: true }); }
    st.records.sort((a, b) => b.kg - a.kg); st.records = st.records.slice(0, 10); st.recSeq = seq;
  }
};
{

/* ---------------- İç satış adımları (Tx içinde kullanılır) ---------------- */
const SellIn = {
  market(fid, n, src) { const rem = Inv.remove(src, fid, n); const inc = rem * FISH[fid].base_price; S.cash += inc; S.stats.totalSales += inc; S.stats.marketSales += inc; S.stats.fishSoldMarket += rem; S.today.marketIncome += inc; return { n: rem, inc }; },
  order(o, n, src) {
    const k = Math.min(n, Orders.remaining(o)); const got = Inv.remove(src, o.fishId, k); const inc = got * o.unitPrice; o.delivered += got; S.cash += inc;
    const c = S.customers[o.customerId] || (S.customers[o.customerId] = { delivered: 0 }); c.delivered += got;
    S.stats.ordersDelivered += got; S.stats.orderSales += inc; S.stats.totalSales += inc; S.stats.buyers[o.customerId] = true; S.today.orderIncome += inc; return { n: got, inc };
  },
  tea(fid, n, src) { if (S.tea.day !== S.day) S.tea = { day: S.day, n: 0 }; const k = Math.min(n, Tea.left()); const got = Inv.remove(src, fid, k); const inc = got * Tea.price(fid); S.tea.n += got; S.cash += inc; S.stats.totalSales += inc; S.stats.teaSales = (S.stats.teaSales || 0) + inc; S.stats.fishSoldMarket += got; S.stats.teaSold += got; S.today.teaIncome += inc; return { n: got, inc }; }
};

/* ---------------- Akıllı Satış Karşılaştırması ---------------- */
const SmartSell = {
  /* her tür için alıcıları birim fiyata göre sırala ve eldeki miktarı dağıt (yalnızca öneri) */
  planFor(fid, have) {
    const ch = [];
    for (const o of Orders.active()) if (o.fishId === fid && Orders.remaining(o) > 0) ch.push({ kind: 'order', id: o.id, name: CUST[o.customerId].name, unit: o.unitPrice, limit: Orders.remaining(o) });
    if (Tea.special() === fid && Tea.left() > 0) ch.push({ kind: 'tea', id: 'tea', name: 'Halil Usta (günün balığı)', unit: Tea.price(fid), limit: Tea.left() });
    ch.push({ kind: 'market', id: 'market', name: 'Balık Hali', unit: FISH[fid].base_price, limit: Infinity });
    ch.sort((a, b) => b.unit - a.unit || (a.kind === 'market' ? 1 : -1));
    let left = have; const alloc = [];
    for (const c of ch) { if (left <= 0) break; const k = Math.min(left, c.limit); if (k > 0) { alloc.push(Object.assign({}, c, { n: k, total: k * c.unit })); left -= k; } }
    return { fid, have, channels: ch, alloc, total: sum(alloc.map(a => a.total)), marketOnly: have * FISH[fid].base_price };
  },
  plans(src, includeFav) { const sp = Inv.species(src); const out = []; for (const f in sp) { if (!includeFav && S.favorites[f]) continue; out.push(this.planFor(f, sp[f])); } out.sort((a, b) => (b.total - b.marketOnly) - (a.total - a.marketOnly) || b.total - a.total); return out; },
  /* oyuncunun onayıyla: önerilen dağılımı tek atomik işlemde uygula */
  execute(fid, src) {
    return Tx.run('smartSell', () => {
      const have = Inv.count(src, fid); if (!have) return { ok: false, msg: 'Bu türden balığın yok.' };
      const p = this.planFor(fid, have); let inc = 0, n = 0;
      for (const a of p.alloc) {
        let r;
        if (a.kind === 'order') { const o = S.orders.find(x => x.id === a.id); if (!o || S.day >= o.expiresAtDayExclusive) throw new Error('ilan yok'); r = SellIn.order(o, a.n, src); }
        else if (a.kind === 'tea') r = SellIn.tea(fid, a.n, src); else r = SellIn.market(fid, a.n, src);
        if (r.n !== a.n) throw new Error('dağılım tutarsız'); inc += r.inc; n += r.n;
      }
      Sound.sfx('coin'); return { ok: true, n, income: inc };
    });
  }
};

const GearSets = {
  KINDS: ['rod', 'line', 'reel', 'hook'],
  save(i) { return Tx.run('gearSetSave', () => { const g = S.gearSets[i]; if (!g) return { ok: false }; for (const k of this.KINDS) g[k] = S.gear[k]; g.bait = S.gear.bait; return { ok: true }; }); },
  rename(i, name) { const g = S.gearSets[i]; if (!g) return; const v = String(name || '').trim().slice(0, 16); if (v) g.name = v; Save.soon(); },
  apply(i) {
    if (Fishing.ctx && !['READY', 'OUTCOME'].includes(Fishing.phase)) return { ok: false, msg: 'Mücadele sırasında ekipman değiştirilemez.' };
    const notes = [];
    const r = Tx.run('gearSetApply', () => {
      const g = S.gearSets[i]; if (!g || !g.rod) return { ok: false, msg: 'Bu set henüz kaydedilmedi.' };
      for (const k of this.KINDS) { if (g[k] && S.gear.owned[k].includes(g[k])) S.gear[k] = g[k]; else if (g[k]) notes.push(GEAR_TR[k] + ' (sahip değilsin)'); }
      if (g.bait === 'basic' || !g.bait) S.gear.bait = 'basic'; else if (S.baitStock[g.bait] > 0) S.gear.bait = g.bait; else { S.gear.bait = 'basic'; notes.push(BAIT[g.bait].name + ' stokta yok → temel yem'); }
      return { ok: true };
    });
    if (r.ok) r.notes = notes; return r;
  }
};

/* ---------------- Otomatik Olta Yem Politikaları ---------------- */
const POLICY_TR = { econ: 'Ekonomik', fixed: 'Sabit yem', target: 'Hedef balık', backup: 'Yedek yemli' };
Object.assign(Auto, {
  policy(dev) { const d = S.auto.devices[dev]; if (!d) return null; if (!d.policy) d.policy = { mode: 'econ', bait: null, backup: null, target: null }; return d.policy; },
  setPolicy(dev, p) { return Tx.run('autoPolicy', () => { const d = S.auto.devices[dev]; if (!d) return { ok: false }; const cur = this.policy(dev); const nx = Object.assign({}, cur, p); if (!POLICY_TR[nx.mode]) return { ok: false }; for (const k of ['bait', 'backup']) if (nx[k] && !PAID_BAITS.includes(nx[k])) return { ok: false, msg: 'Temel yem otomatikte kullanılamaz.' }; if (nx.target && !FISH[nx.target]) return { ok: false }; d.policy = nx; return { ok: true }; }); },
  pickBaitFor(dev, spotId, bid) {
    const pol = this.policy(dev) || { mode: 'econ' }; const has = b => b && b !== 'basic' && S.baitStock[b] > 0;
    const econ = () => PAID_BAITS.slice().sort((a, b) => BAIT[a].purchase_price - BAIT[b].purchase_price).find(has) || null;
    if (pol.mode === 'fixed') return has(pol.bait) ? pol.bait : null;
    if (pol.mode === 'backup') return has(pol.bait) ? pol.bait : (has(pol.backup) ? pol.backup : null);
    if (pol.mode === 'target' && pol.target) {
      const d = S.auto.devices[dev]; const pool = spotId ? Selector.weights(spotId, { auto: true, maxPower: this.maxPower(bid) }).list : [];
      if (spotId && !pool.some(x => x.id === pol.target)) { if (d.targetMissDay !== S.day) { d.targetMissDay = S.day; Bus.toast(AUTO[dev].name + ': hedef ' + FISH[pol.target].name_tr + ' bu noktada otomatik avlanamıyor; ekonomik yem kullanılıyor.', 'warn', dev); } return econ(); }
      return FISH[pol.target].favored_baits.find(has) || econ();
    }
    return econ();
  }
});

/* ---------------- Mali Günlük (son 30 gün) ---------------- */
const Finance = {
  close(rep) {
    const by = rep.expBy || {}; const gearC = (by.gear || 0) + (by.boat || 0) + (by.automation || 0);
    const income = (rep.marketIncome || 0) + (rep.orderIncome || 0) + (rep.teaIncome || 0) + (rep.prizeIncome || 0);
    const expense = rep.expenses || 0;
    const e = { day: rep.prevDay || rep.day, manual: rep.manualCatches, auto: rep.autoCatches, market: rep.marketIncome || 0, orders: rep.orderIncome || 0, tea: rep.teaIncome || 0, prize: rep.prizeIncome || 0, bait: by.bait || 0, fuel: by.fuel || 0, gear: gearC, other: expense - (by.bait || 0) - (by.fuel || 0) - gearC, income, expense, net: rep.endCash - rep.startCash, startCash: rep.startCash, endCash: rep.endCash };
    e.consistent = e.net === income - expense;
    S.fin.push(e); while (S.fin.length > 30) S.fin.shift();
    return e;
  }
};

/* ---------------- Akvaryum ---------------- */
const Aq = {
  tank(id) { return S.aq.tanks[id]; },
  owns(id) { return !!S.aq.owned[id]; },
  total(id) { const t = this.tank(id); return t ? sum(Object.values(t.fish)) : 0; },
  speciesN(id) { const t = this.tank(id); return t ? Object.keys(t.fish).length : 0; },
  allFish() { const m = {}; for (const id in S.aq.tanks) for (const f in S.aq.tanks[id].fish) m[f] = (m[f] || 0) + S.aq.tanks[id].fish[f]; return m; },
  room(id, fid) { const t = this.tank(id), M = AQM[id]; if (!t) return 0; if (!t.fish[fid] && this.speciesN(id) >= M.species) return 0; return Math.max(0, M.cap - this.total(id)); },
  sources() { const s = ['bag', 'chest']; if (S.boats.active) s.push('boat:' + S.boats.active); return s; },
  buyModel(id) {
    return Tx.run('aqBuy', () => {
      const M = AQM[id]; if (!M) return { ok: false }; if (this.owns(id)) return { ok: false, msg: 'Bu akvaryuma zaten sahipsin.' };
      if (S.cash < M.price) return { ok: false, msg: 'Paran yetmiyor.' };
      spend(M.price, 'home'); S.aq.owned[id] = S.day; S.aq.tanks[id] = { fish: {}, decor: 'sand', bg: 'plain' }; Sound.sfx('fanfare'); return { ok: true };
    });
  },
  buyDecor(did) {
    return Tx.run('aqDecor', () => { const D = V2.aqDecor.find(x => x.id === did); if (!D) return { ok: false }; if (S.aq.decor.includes(did)) return { ok: false, msg: 'Zaten sahipsin.' }; if (S.cash < D.price) return { ok: false, msg: 'Paran yetmiyor.' }; spend(D.price, 'home'); S.aq.decor.push(did); Sound.sfx('buy'); return { ok: true }; });
  },
  setDecor(id, did) { const t = this.tank(id); if (!t || !S.aq.decor.includes(did)) return; t.decor = did; Save.soon(); },
  setBg(id, bg) { const t = this.tank(id); if (!t) return; if (bg === 'ocean' && !S.ach.aq10) return; t.bg = bg; Save.soon(); },
  put(id, fid, n, src) {
    return Tx.run('aqPut', () => {
      if (!this.owns(id)) return { ok: false, msg: 'Akvaryum yok.' }; if (!AQ_OK.has(fid)) return { ok: false, msg: FISH[fid].name_tr + ' akvaryuma uygun değil.' };
      const have = Inv.count([src], fid); const room = this.room(id, fid); const k = Math.min(n | 0, have, room);
      if (k <= 0) return { ok: false, msg: have ? (this.room(id, fid) === 0 && !this.tank(id).fish[fid] && this.speciesN(id) >= AQM[id].species ? 'Tür sınırı dolu (' + AQM[id].species + ' tür).' : 'Akvaryum dolu.') : 'Bu depoda bu türden balık yok.' };
      const got = Inv.remove([src], fid, k); if (got !== k) throw new Error('aq put');
      const t = this.tank(id); t.fish[fid] = (t.fish[fid] || 0) + k; if (!S.aq.seen[fid]) S.aq.seen[fid] = S.day; Sound.sfx('splash');
      return { ok: true, n: k };
    });
  },
  take(id, fid, n, dst) {
    return Tx.run('aqTake', () => {
      const t = this.tank(id); if (!t || !t.fish[fid]) return { ok: false, msg: 'Akvaryumda bu tür yok.' };
      const k = Math.min(n | 0, t.fish[fid], Inv.space(dst, fid)); if (k <= 0) return { ok: false, msg: 'Hedef depoda yer yok.' };
      const added = Inv.add(dst, fid, k); if (added !== k) throw new Error('aq take');
      t.fish[fid] -= k; if (!t.fish[fid]) delete t.fish[fid]; return { ok: true, n: k };
    });
  },
  move(a, b, fid, n) {
    return Tx.run('aqMove', () => {
      const A = this.tank(a); if (!A || !A.fish[fid] || !this.owns(b) || a === b) return { ok: false, msg: 'Taşıma yapılamaz.' };
      const k = Math.min(n | 0, A.fish[fid], this.room(b, fid)); if (k <= 0) return { ok: false, msg: 'Hedef akvaryumda yer yok.' };
      A.fish[fid] -= k; if (!A.fish[fid]) delete A.fish[fid]; const B = this.tank(b); B.fish[fid] = (B.fish[fid] || 0) + k; return { ok: true, n: k };
    });
  },
  validate(st) {
    const e = []; const aq = st.aq; if (!aq || typeof aq !== 'object') return ['akvaryum verisi'];
    for (const id in aq.tanks) {
      const M = AQM[id], t = aq.tanks[id]; if (!M) { e.push('akvaryum modeli ' + id); continue; } if (!aq.owned[id]) e.push('sahipsiz akvaryum ' + id);
      let tot = 0, sp = 0; for (const f in t.fish) { const q = t.fish[f]; if (!AQ_OK.has(f) || !(q >= 1) || q !== (q | 0)) e.push('akvaryum balığı ' + f); tot += q; sp++; }
      if (tot > M.cap) e.push('akvaryum kapasitesi ' + id); if (sp > M.species) e.push('akvaryum tür sınırı ' + id);
    }
    return e;
  }
};

/* ---------------- NPC günlük rutinleri (oyun gününe göre deterministik) ---------------- */
const Routine = {
  cache: { day: -1, fest: null, map: {} },
  place(npc) {
    const fest = World.festival(); const key = S.day + ':' + (fest ? fest.id : '') + ':' + S.world.weather.sakin_liman + ':' + S.seed;
    if (this.cache.day !== key) {
      const map = {}, used = new Set(); const wx = S.world.weather.sakin_liman;
      for (const n of Object.keys(V2.routines)) {
        let opts = V2.routines[n].slice();
        if (fest && ['efe', 'ali', 'mert', 'elif'].includes(n)) opts = [['square', 3], ['square2', 3], ['tea', 1]];
        if (wx === 'rain') opts = opts.map(([s, w]) => [s, s.startsWith('tea') ? w * 3 : w]);
        let r = hrand('routine', S.day, n); let pick = opts[0][0]; const tot = sum(opts.map(o => o[1]));
        for (const [s, w] of opts) { r -= w / tot; if (r < 0) { pick = s; break; } }
        if (used.has(pick)) { const alt = { tea: 'tea2', square: 'square2', tea2: 'tea', square2: 'square' }[pick]; pick = alt && !used.has(alt) ? alt : V2.routines[n][0][0]; }
        used.add(pick); map[n] = pick;
      }
      this.cache = { day: key, map };
    }
    return this.cache.map[npc];
  },
  x(npc) { const p = this.place(npc); return V2.slots[p]; },
  atPier(npc) { return (this.place(npc) || '').startsWith('pier'); },
  where(npc) {
    const p = this.place(npc); if (!p) return 'Dükkânında';
    return { pier_efe: 'İskelede', pier_a: 'İskelede', pier_b: 'İskelede', pier_c: 'İskele ucunda', tea: 'Çay bahçesinde', tea2: 'Çay bahçesinde', square: 'Meydanda', square2: 'Meydanda', market: 'Balık halinin önünde', bakery: 'Fırının önünde', board: 'İlan panosunda', boutique: 'Butiğin önünde', home_hasan: 'Muhtarlıkta', home_bahar: 'Lokantasında' }[p];

};

/* ---------------- Mali Günlük: filo ve proje kalemleri ---------------- */
Finance.close = function (rep) {
  const by = rep.expBy || {}; const gearC = (by.gear || 0) + (by.boat || 0) + (by.automation || 0);
  const fw = by.fleet_wage || 0, ff = by.fleet_fuel || 0, pj = by.project || 0;
  const income = (rep.marketIncome || 0) + (rep.orderIncome || 0) + (rep.teaIncome || 0) + (rep.prizeIncome || 0);
  const expense = rep.expenses || 0;
  const e = { day: rep.prevDay || rep.day, manual: rep.manualCatches, auto: rep.autoCatches, fleetFish: rep.fleetFish || 0, market: rep.marketIncome || 0, orders: rep.orderIncome || 0, tea: rep.teaIncome || 0, prize: rep.prizeIncome || 0,
    bait: by.bait || 0, fuel: by.fuel || 0, gear: gearC, fleetWage: fw, fleetFuel: ff, project: pj, other: expense - (by.bait || 0) - (by.fuel || 0) - gearC - fw - ff - pj, income, expense, net: rep.endCash - rep.startCash, startCash: rep.startCash, endCash: rep.endCash };
  e.consistent = e.net === income - expense;
  S.fin.push(e); while (S.fin.length > 30) S.fin.shift();
  return e;
};

/* ---------------- kayıt doğrulama (şema 4 alanları) ---------------- */
V3.validate = function (st) {
  const e = [];
  if (!METHOD_IDS.includes(st.method)) e.push('av yöntemi'); if (!DAYPART_IDS.includes(st.daypart)) e.push('gün ışığı');
  if (!st.projects || typeof st.projects !== 'object') e.push('projeler');
  else for (const p of V3.projects) { const x = st.projects[p.id]; if (!x || !(x.paid >= 0) || x.paid > p.cost || (x.done && x.paid !== p.cost)) e.push('proje ' + p.id); }
  if (!st.fleet || !Array.isArray(st.fleet.missions) || !Array.isArray(st.fleet.log)) e.push('filo');
  else {
    const boats = new Set(), npcs = new Set();
    for (const m of st.fleet.missions) {
      if (!st.boats.owned.includes(m.boat) || !FLEETNPC[m.npc] || !REGION[m.rid] || boats.has(m.boat) || npcs.has(m.npc) || m.boat === st.boats.active) e.push('filo görevi ' + m.id);
      boats.add(m.boat); npcs.add(m.npc);
      if (m.left) for (const x of m.left) if (!FISH[x.f] || !(x.q >= 1) || x.q !== (x.q | 0)) e.push('teslim kasası');
    }
    if (st.fleet.missions.length > Math.min(3, Math.max(0, st.boats.owned.length - 1))) e.push('filo kapasitesi');
  }
  if (!Array.isArray(st.tripLog) || st.tripLog.length > 10) e.push('sefer raporları');
  if (st.trip && (!Array.isArray(st.trip.stops) || st.trip.stops.length > 2 || !st.boats.owned.includes(st.trip.boat))) e.push('aktif sefer');
  if (!st.wild || typeof st.wild.seen !== 'object') e.push('gözlemler'); else for (const k in st.wild.seen) if (!WILD[k]) e.push('gözlem ' + k);
  return e;
};

/* ---------- Özel av fırsatları ---------- */
const Opp = {
  CHANCE: 0.12, PER_SESSION: 2, CASTS: 2, MUL: 1.3,
  key() { return S.trip ? 't' + S.trip.id : 'p' + S.day; },
  sess() { const k = this.key(); const p = S.opp.per[k] || (S.opp.per[k] = { casts: 0, n: 0 }); const ks = Object.keys(S.opp.per); while (ks.length > 12) delete S.opp.per[ks.shift()]; return p; },
  active() { const a = S.opp.active; return a && a.status === 'active' ? a : null; },
  /* tür havuzu: yalnız bu noktada gerçekten bulunan türler */
  set(type, spotId) {
    const ws = Object.keys(SPOTS[spotId].weights);
    if (type === 'school') return ws.filter(f => V4.schoolFish.includes(f));
    if (type === 'bottom') return ws.filter(f => Methods.of(f).includes('bottom'));
    if (type === 'predator') return ws.filter(f => Methods.of(f).includes('spin'));
    return ws;
  },
  endIfMoved(rid) { const a = this.active(); if (a && a.rid !== rid) { a.status = 'ended'; } },
  /* tamamlanan her geçerli manuel atıştan sonra (Tx içinde) */
  roll(pc) {
    if (!pc || pc.comp || pc.mode === 'auto') return null; const rid = SPOTS[pc.spotId].region_id; this.endIfMoved(rid);
    const ss = this.sess(); ss.casts++;
    if (ss.casts < this.CASTS || ss.n >= this.PER_SESSION || this.active()) return null;
    if (hr('opp', S.stats.manualCasts) >= this.CHANCE) return null;
    const types = Object.keys(V4.oppTypes).filter(t => t === 'big' || this.set(t, pc.spotId).length);
    const type = types[Math.floor(hr('oppT', S.stats.manualCasts) * types.length)];
    const band = ['near', 'mid', 'far'][Math.floor(hr('oppB', S.stats.manualCasts) * 3)];
    S.opp.seq = (S.opp.seq || 0) + 1;
    const ev = { id: 'op' + S.opp.seq, type, day: S.day, trip: S.trip ? S.trip.id : null, rid, spot: pc.spotId, band, left: 2, status: 'active' };
    S.opp.active = ev; ss.n++; S.opp.log.push({ id: ev.id, type, day: S.day, rid }); while (S.opp.log.length > 20) S.opp.log.shift();
    return ev;
  },
  /* iniş anında (Tx içinde): hakkı tüketir, şartı sağlayan atışa etki döndürür */
  consume(pc, blocked) {
    const a = this.active(); if (!a) return null; const rid = SPOTS[pc.spotId].region_id; if (a.rid !== rid) { a.status = 'ended'; return null; }
    a.left--; if (a.left <= 0) a.status = 'used';
    let matched = false;
    if (a.type === 'school' || a.type === 'big') matched = pc.band === a.band;
    else if (a.type === 'bottom') matched = pc.method === 'bottom';
    else if (a.type === 'predator') matched = pc.method === 'spin';
    if (blocked) matched = false;
    return { id: a.id, type: a.type, matched, set: matched && a.type !== 'big' && a.type !== 'predator' ? this.set(a.type, pc.spotId) : null };
  }
};

const Trophy = {
  unlocked(id) { const t = TROPHY[id]; return !!(t && S.ency[t.fid] && S.ency[t.fid].caught > 0); },
  chance(id) { return Math.min(0.85, 0.08 + 0.06 * (S.trophy.miss[id] || 0)); },
  setTarget(id) { if (id && !this.unlocked(id)) return { ok: false, msg: 'Önce bu türü kendin keşfetmelisin.' }; S.trophy.target = id || null; Save.soon(); return { ok: true }; },
  eligible(pc) {
    const id = S.trophy.target; if (!id || !this.unlocked(id) || pc.comp) return null; const t = TROPHY[id]; const sp = SPOTS[pc.spotId];
    if (sp.region_id !== t.rid || !sp.weights[t.fid]) return null; if (FISH[t.fid].power > rodOf().power + 1) return null; return t;
  },
  /* iniş anında (Tx içinde) — deterministik, 4–6 atışta bir anlamlı fırsat hedefi */
  roll(pc) {
    const t = this.eligible(pc); if (!t) return null;
    if (hr('tro', S.stats.manualCasts, t.id) < this.chance(t.id)) { S.trophy.miss[t.id] = 0; S.trophy.enc = (S.trophy.enc || 0) + 1; Guild.ev('trophyEnc', {}); return t; }
    S.trophy.miss[t.id] = (S.trophy.miss[t.id] || 0) + 1; return null;
  },
  size(t) { const f = FISH[t.fid]; const k = 0.75 + hr('trs', S.stats.manualCasts) * 0.25; const [l0, l1] = f.size_game_range.length_cm, [w0, w1] = f.size_game_range.weight_kg; return { cls: k >= 0.9 ? 'exceptional' : 'large', t: k, cm: Math.round(l0 + k * (l1 - l0)), kg: round2(w0 + Math.pow(k, 3) * (w1 - w0)), trophy: t.id }; },
  /* Tx içinde: trofe yakalandı → ilk ödül bir kez */
  onCatch(id, size) {
    const t = TROPHY[id]; const b = S.trophy.best[id]; if (!b || size.kg > b.kg) S.trophy.best[id] = { cm: size.cm, kg: size.kg };
    if (S.trophy.done[id]) return false;
    S.trophy.done[id] = { day: S.day, cm: size.cm, kg: size.kg }; this.grant(t.reward); if (!S.album.some(a => a.id === id)) S.album.push({ id, day: S.day });
    return true;
  },
  grant(r) {
    if (r.kind === 'decor' && !S.home.owned.includes(r.id)) S.home.owned.push(r.id);
    if (r.kind === 'ornament') { S.cosmetics.ornaments = S.cosmetics.ornaments || []; if (!S.cosmetics.ornaments.includes(r.id)) S.cosmetics.ornaments.push(r.id); }
    if (r.kind === 'charm') { S.cosmetics.charms = S.cosmetics.charms || []; if (!S.cosmetics.charms.includes(r.id)) S.cosmetics.charms.push(r.id); if (!S.cosmetics.charm) S.cosmetics.charm = r.id; }
    if (r.kind === 'color' && !S.cosmetics.boatColors.includes(r.id)) S.cosmetics.boatColors.push(r.id);
  }
};

/* ---------- Balıkçı Birliği ---------- */
const Guild = {
  week(d) { return Math.floor(((d || S.day) - 1) / 7) + 1; },
  open() { return S.day >= 3; },
  stage() { return S.boats.owned.length >= 3 || S.day >= 45 ? 'late' : S.boats.owned.length ? 'mid' : 'early'; },
  reward(stage) { return stage === 'late' ? { cash: 69, bait: 'lure', n: 3 } : stage === 'mid' ? { cash: 28, bait: 'shrimp', n: 3 } : { cash: 12, bait: 'worm', n: 2 }; },
  value(r) { return r.cash + r.n * BAIT[r.bait].purchase_price; },
  ok(id) {
    const boat = S.boats.owned.length > 0;
    switch (id) {
      case 'A06': return SPOT_LIST.some(sp => S.world.unlocked[sp.region_id] && Object.keys(sp.weights).some(f => FISH[f].power >= 3 && FISH[f].power <= maxRodPower() + 1));
      case 'B02': return S.boats.owned.some(b => Trips.maxStops(b) > 1) && REGIONS.filter(r => r.id !== 'sakin_liman' && S.boats.owned.some(b => Boats.reach(r.id, b).ok)).length >= 2;
      case 'B05': case 'C05': case 'D06': return boat;
      case 'B06': return V4.trophies.some(t => Trophy.unlocked(t.id) && S.boats.owned.concat([null]).some(b => Boats.reach(t.rid, b).ok) && FISH[t.fid].power <= maxRodPower() + 1);
      case 'C06': return V3.projects.some(p => !Projects.done(p.id));
      case 'D01': return Object.keys(S.aq.owned).length > 0;
      case 'D02': return S.stats.manualCatches >= 1;
      case 'D04': return S.boats.owned.length >= 2;
      case 'D05': return S.gearSets.some(g => g.rod);
    }
    return true;
  },
  /* her hafta 3 görev: kayıtlı, deterministik; yeniden yükleme değiştirmez */
  ensure() {
    if (!this.open()) return null; const w = this.week();
    if (S.guild && S.guild.week === w) return S.guild;
    const prev = S.guild ? S.guild.tasks.map(t => t.id) : [];
    S.guild = { week: w, tasks: this.pick(w, prev, []), rerolled: false, prev, gen: S.day, sets: {} };
    return S.guild;
  },
  pick(w, prev, keep) {
    const out = keep.slice(); const used = new Set(out.map(t => t.id)); const stg = this.stage();
    for (const slot of [1, 2, 3]) {
      if (out.some(t => GUILDT[t.id].slot === slot)) continue;
      let pool = V4.guild.filter(g => g.slot === slot && !used.has(g.id) && this.ok(g.id));
      const fresh = pool.filter(g => !prev.includes(g.id)); if (fresh.length) pool = fresh;
      if (!pool.length) pool = V4.guild.filter(g => !used.has(g.id) && this.ok(g.id) && g.nonFish);
      const g = pool[Math.floor(hr('guild', w, slot, keep.length) * pool.length)]; used.add(g.id);
      out.push({ id: g.id, prog: 0, done: false, claimed: false, reward: this.reward(stg) });
    }
    if (!out.some(t => GUILDT[t.id].nonFish)) { const alt = V4.guild.filter(g => g.slot === 3 && g.nonFish && !used.has(g.id) && this.ok(g.id)); out[2] = { id: alt[0].id, prog: 0, done: false, claimed: false, reward: this.reward(stg) }; }
    return out.sort((a, b) => GUILDT[a.id].slot - GUILDT[b.id].slot);
  },
  reroll(id) {
    return Tx.run('guildReroll', () => {
      const G = this.ensure(); if (!G) return { ok: false }; if (G.rerolled) return { ok: false, msg: 'Bu hafta görev değiştirme hakkını kullandın.' };
      const i = G.tasks.findIndex(t => t.id === id); if (i < 0 || G.tasks[i].claimed || G.tasks[i].done) return { ok: false, msg: 'Tamamlanan görev değiştirilemez.' };
      const slot = GUILDT[id].slot; const used = new Set(G.tasks.map(t => t.id)); let pool = V4.guild.filter(g => g.slot === slot && !used.has(g.id) && this.ok(g.id) && !G.prev.includes(g.id));
      if (!pool.length) pool = V4.guild.filter(g => g.slot === slot && !used.has(g.id) && this.ok(g.id)); if (!pool.length) return { ok: false, msg: 'Uygun başka görev yok.' };
      const others = G.tasks.filter((t, k) => k !== i); let g = pool[Math.floor(hr('guildR', G.week) * pool.length)];
      if (!others.some(t => GUILDT[t.id].nonFish) && !g.nonFish) { const nf = pool.filter(x => x.nonFish); if (!nf.length) return { ok: false, msg: 'Bu görev haftanın tek balıkçılık dışı görevi; değiştirilemez.' }; g = nf[0]; }
      G.tasks[i] = { id: g.id, prog: 0, done: false, claimed: false, reward: G.tasks[i].reward }; G.rerolled = true; delete G.sets[id];
      return { ok: true, id: g.id };
    });
  },
  claim(id) {
    return Tx.run('guildClaim', () => {
      const G = this.ensure(); const t = G && G.tasks.find(x => x.id === id); if (!t || !t.done) return { ok: false, msg: 'Görev henüz tamamlanmadı.' }; if (t.claimed) return { ok: false, msg: 'Ödül zaten alındı.' };
      t.claimed = true; const r = t.reward; S.cash += r.cash; S.today.guildIncome = (S.today.guildIncome || 0) + r.cash; S.stats.guildIncome = (S.stats.guildIncome || 0) + r.cash; S.baitStock[r.bait] += r.n; S.stats.guildDone = (S.stats.guildDone || 0) + 1;
      Sound.sfx('coin'); return { ok: true, r };
    });
  },
  /* olay tabanlı ilerleme: yalnız görevin seçildiği haftada yapılan gerçek faaliyetler (çağrı Tx içinde de dışında da olabilir) */
  ev(type, d) {
    if (!S || !S.guild || S.guild.week !== this.week() || QA.noGuild) return; d = d || {}; const G = S.guild; let ch = false;
    for (const t of G.tasks) {
      if (t.done) continue; const before = t.prog; const set = k => { const s = G.sets[t.id] || (G.sets[t.id] = []); if (!s.includes(k)) s.push(k); t.prog = s.length; };
      switch (t.id) {
        case 'A01': if (type === 'catch' && d.method === 'float') t.prog++; break;
        case 'A02': if (type === 'catch' && d.method === 'bottom') t.prog++; break;
        case 'A03': if (type === 'catch' && d.method === 'spin') t.prog++; break;
        case 'A04': if (type === 'catch' && d.method) set(d.method); break;
        case 'A05': if (type === 'perfect') t.prog++; break;
        case 'A06': if (type === 'catch' && d.power >= 3) t.prog++; break;
        case 'B01': if (type === 'spots2') t.prog = Math.max(t.prog, d.n); break;
        case 'B02': if (type === 'stops2') t.prog++; break;
        case 'B03': if (type === 'catch' && d.daypart === 'morning') t.prog++; break;
        case 'B04': if (type === 'catch' && d.daypart === 'evening') t.prog++; break;
        case 'B05': if (type === 'binoc') t.prog++; break;
        case 'B06': if (type === 'trophyEnc') t.prog++; break;
        case 'C01': if (type === 'market') t.prog += d.n; break;
        case 'C02': if (type === 'order' && d.n > 0) t.prog++; break;
        case 'C03': if (type === 'tea' && d.n > 0) t.prog++; break;
        case 'C04': if (type === 'talk') set(d.npc); break;
        case 'C05': if (type === 'guestTrip') t.prog++; break;
        case 'C06': if (type === 'donate') t.prog += d.n; break;
        case 'D01': if (type === 'aq') t.prog++; break;
        case 'D02': if (type === 'shore') t.prog++; break;
        case 'D03': if (type === 'photo') t.prog++; break;
        case 'D04': if (type === 'fleet') t.prog++; break;
        case 'D05': if (type === 'catch' && G.gsReady) t.prog++; break;
        case 'D06': if (type === 'report2') t.prog++; break;
      }
      t.prog = Math.min(t.prog, GUILDT[t.id].need);
      if (t.prog !== before) ch = true;
      if (t.prog >= GUILDT[t.id].need && !t.done) { t.done = S.day; Bus.toast('Birlik görevi tamamlandı: ' + GUILDT[t.id].name, 'good', 'guild'); }
    }
    if (ch) Save.soon();
  }
};

/* ---------- Kasaba hikâyeleri ---------- */
const Stories = {
  st(npc) { return S.stories[npc] || (S.stories[npc] = { stage: 0, data: {} }); },
  /* 0 kilitli · 1..3 aktif aşama · 4 tamamlandı */
  cond(npc) { if (npc === 'efe') return S.stats.manualCatches >= 1; if (npc === 'kerem') return (S.shore.runs || 0) >= 1; return S.boats.owned.length > 0; },
  check() { for (const n of STORY_NPCS) { const s = this.st(n); if (s.stage === 0 && this.cond(n)) { s.stage = 1; s.unlocked = S.day; if (S.storyTrack.length < 2 && !S.storyTrack.includes(n)) S.storyTrack.push(n); } } this.auto(); },
  auto() {
    const k = S.stories.kerem; if (k && k.stage === 2 && Object.keys(S.shore.items).length >= 3) k.stage = 3;
  },
  goal(npc) { const s = this.st(npc); if (s.stage === 0) return 'Açılma: ' + V4.stories[npc].unlock; if (s.stage >= 4) return 'Tamamlandı'; let g = V4.stories[npc].stages[s.stage - 1].goal; if (npc === 'elif' && s.stage === 2 && s.data.spots) g += ' (' + s.data.spots.map(x => SPOTS[x].name + (s.data.seen && s.data.seen.includes(x) ? ' ✓' : '')).join(', ') + ')'; if (npc === 'bora' && s.stage === 2) g += ' (' + ((s.data.spots || []).length) + '/2)'; if (npc === 'kerem' && s.stage === 2) g += ' (' + Math.min(3, Object.keys(S.shore.items).length) + '/3)'; return g; },
  canTalk(npc) { const s = this.st(npc); return s.stage === 1 || s.stage === 3; },
  talk(npc) {
    let line = null;
    const r = Tx.run('storyTalk', () => {
      const s = this.st(npc); if (!this.canTalk(npc)) return { ok: false };
      line = V4.stories[npc].stages[s.stage - 1].talk;
      if (s.stage === 1) {
        if (npc === 'mert') { if (!S.boats.active) return { ok: false, msg: 'Aktif bir tekne gerekli.' }; if (Guests.valid() && S.guest.npc !== 'mert') return { ok: false, msg: 'Bugün zaten başka bir misafirin var.' }; S.guest = { npc: 'mert', day: S.day }; }
        if (npc === 'elif') s.data.spots = this.elifSpots();
        if (npc === 'bora') s.data.spots = [];
        s.stage = 2; s.start = S.day; this.auto();
      } else if (s.stage === 3) { s.stage = 4; s.done = S.day; this.reward(npc); }
      return { ok: true };
    });
    return r.ok ? { ok: true, line, done: this.st(npc).stage === 4 } : r;
  },
  elifSpots() {
    const regs = REGIONS.filter(r => r.id !== 'sakin_liman' && S.boats.owned.some(b => Boats.reach(r.id, b).ok)).map(r => r.id); if (!regs.length) regs.push('sakin_liman');
    const spots = []; regs.forEach(r => REGION[r].spot_ids.forEach(sp => spots.push(sp)));
    const a = spots[Math.floor(hr('elif', 1) * spots.length)]; const rest = spots.filter(x => x !== a); const b = rest[Math.floor(hr('elif', 2) * rest.length)];
    return [a, b];
  },
  /* özel inceleme noktası (Efe: Dalgakıran; Elif: iki manzara noktası) */
  inspectable(spotId) {
    const out = []; const e = S.stories.efe; if (e && e.stage === 2 && spotId === V4.stories.efe.stages[1].inspect && Game.sceneName === 'PierFishing') out.push('efe');
    const l = S.stories.elif; if (l && l.stage === 2 && l.data.spots && l.data.spots.includes(spotId) && !(l.data.seen || []).includes(spotId) && Game.sceneName === 'BoatFishing') out.push('elif');
    return out;
  },
  inspect(npc, spotId) {
    let text = null;
    const r = Tx.run('storyInspect', () => {
      const s = this.st(npc); if (!this.inspectable(spotId).includes(npc)) return { ok: false };
      if (npc === 'efe') { s.stage = 3; text = V4.stories.efe.stages[1].found; }
      if (npc === 'elif') { s.data.seen = (s.data.seen || []).concat([spotId]); text = 'Elif\'in çizdiği manzara: ' + SPOTS[spotId].name + '. Işığı ve kıyı çizgisini aklına kazıdın.'; if (s.data.spots.every(x => s.data.seen.includes(x))) s.stage = 3; }
      return { ok: true };
    });
    return r.ok ? { ok: true, text } : r;
  },
  onSpot(spotId) { const b = S.stories.bora; if (b && b.stage === 2 && Game.sceneName === 'BoatFishing') { b.data.spots = b.data.spots || []; if (!b.data.spots.includes(spotId)) b.data.spots.push(spotId); if (b.data.spots.length >= 2) b.stage = 3; } },
