  biteWin() { return RC.reaction_window_sec * (SETTINGS.comfort ? 1.5 : 1) + Shop.buffVal('bite_window_bonus_sec', 0); },
  setTilt(d) { this.tilt = d; },
  burst(x, y, c, n) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = 30 + Math.random() * 60; this.fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, t: 0, life: 0.5 + Math.random() * 0.4, c }); } },
  /* davranışa özgü ipuçları (tür adı açık edilmez) */

    Help() {
      const html = `<h4>Temel döngü</h4><p>Her gün 100 enerjin var. Her geçerli olta atışı oltanın enerji maliyeti kadar harcar (Eski Bambu: 8 → 12 atış). Gün içinde saat yoktur; evde uyuyunca yeni gün başlar ve enerji yenilenir.</p>

        <h4>Ticaret</h4><p>Balık fiyatı türe göre sabittir; boy fiyatı değiştirmez. Nihat'ın hali her balığı alır. Panodaki ilanlar daha iyi fiyat verir ve kısmi teslim kabul eder: 100 isteyen alıcıya 3 balık satabilirsin.</p>

        <h4>Otomatik oltalar</h4><p>Teknede, manuel atışların eşliğinde deneme yapar, ücretli yem harcar ve günde toplam en çok 6 balık yakalar. Güç 5 balıklar hep manueldir.</p>
        <h4>Balıkla mücadele</h4><p><b>Mükemmel tasma:</b> şamandıra dalar dalmaz (ilk 0,45 sn) dokunursan avantajlı başlarsın. <b>Yön:</b> balık sola/sağa çekerken ◀ ▶ ile oltayı ters yöne yatır; doğru yön hızlandırır, yanlış yön yavaşlatır. <b>Zıplama:</b> zıplayan türler sudan fırlarken düğmeyi bırak, “Usta Hamle” kazan. <b>Ustalık:</b> ideal bölgede sararken kombo yıldızları dolar ve çekiş hızlanır. <b>Yorgunluk:</b> dayanıklılık çubuğu bitince balık yorulur; hızla sar! Küçük balıkları art arda dokunarak hızlıca sarabilirsin.</p><h4>Şenlikler</h4><p>Her mevsimin 14–15. günleri kasabada şenlik olur. Şenlik Meydanı'nda Muhtar Hasan'a kaydolup iskelede 8 atışlık yarışmaya katıl (enerji harcamaz). İlk üçe girersen kupa ve para ödülü kazanırsın; kupaların evindeki Kupa Dolabı'nda sergilenir.</p><h4>Kontroller</h4><p>Dokunmatik: düğmeler, binalara dokunarak yürüme. Klavye: ←/→ veya A/D yürü/sür, Boşluk olta at/çek, E veya Enter etkileşim, I envanter, Esc kapat/iptal, 1/2/3 teknede av noktası.</p><h4>İpuçları</h4><p>Şamandıralara dokunarak tekneyi o noktaya sürebilirsin. Navigasyon yükseltmesi av noktasındaki en olası türleri (II. seviyede yüzdeleriyle) gösterir. Ücretli yem bitince oyun otomatik olarak ücretsiz temel yeme geçer.</p>`;

    },

    // kayıt
    exportOpen() { const j = Save.pack(S); this.showModal(`<h3>Kaydı Dışa Aktar</h3><p class="dim small">Dosya indirilmezse aşağıdaki metni kopyalayıp güvenli bir yerde sakla.</p><textarea readonly class="ta">${esc(j)}</textarea><div class="btns"><button class="btn" data-a="mCancel">Kapat</button><button class="btn" data-a="copyExport">Kopyala</button><button class="btn g" data-a="download">İndir (.json)</button></div>`, 'wide'); },

    exportRaw() { const raw = this._rawSave || ''; const b = new Blob([raw], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'cozyfishing_bozuk_kayit.json'; a.click(); },
    importOpen() { this.showModal(`<h3>Kaydı İçe Aktar</h3><p class="dim small">Bir .json dosyası seç ya da metni yapıştır. Mevcut kayıt, onayın olmadan ezilmez.</p><input type="file" accept=".json,application/json" id="impFile"><textarea class="ta" id="impText" placeholder="JSON kaydını buraya yapıştır"></textarea><div class="btns"><button class="btn" data-a="mCancel">Vazgeç</button><button class="btn g" data-a="importGo">İçe Aktar</button></div>`, 'wide'); },
    importGo() {
      const fi = $('impFile'), ta = $('impText');
      const handle = (txt) => { const u = Save.unpack(txt); if (!u.ok) { this.toastNow('İçe aktarma reddedildi: ' + u.msg, 'warn'); Sound.sfx('error'); return; } const st = u.state; this.confirm({ title: 'Kaydı yükle?', danger: true, html: `<p>Gün <b>${st.day}</b> · Para <b>${fmt(st.cash)}</b> · ${esc(st.player.name)} · ${Object.keys(st.ency).length} tür · ${st.boats.owned.length} tekne</p><p class="warn">Mevcut oyunun bu kayıtla değiştirilecek (önceki kayıt bir kez yedeklenir).</p>`, ok: 'Yükle', onOk: () => { Save.keepPrevious(); S = st; Save.now(); startFromState(); this.toastNow('Kayıt yüklendi.', 'good'); } }); };
      if (fi && fi.files && fi.files[0]) { const r = new FileReader(); r.onload = () => handle(String(r.result)); r.readAsText(fi.files[0]); }
      else if (ta && ta.value.trim()) handle(ta.value.trim());
      else this.toastNow('Önce bir dosya seç ya da metin yapıştır.', 'warn');
    },

/* Journal: tek geçişte (nokta × yem × mesafe × yöntem) hesap, her tür için en iyi plan */
Journal.today3 = function (mode, limit) {
  const known = new Set(FISH_LIST.filter(f => S.ency[f.id] && S.ency[f.id].caught).map(f => f.id)); if (!known.size) return [];
  const rp = rodOf().power; const dp = Dayparts.cur(); const casts = Math.max(1, Math.floor(CORE.daily_energy / rodOf().energy)); const best = {};
  const baits = BAITS.filter(b => b.id === 'basic' || (mode === 'chance' ? true : S.baitStock[b.id] > 0));
  const offer = fid => { let u = FISH[fid].base_price, via = 'Balık Hali'; for (const o of Orders.active()) if (o.fishId === fid && Orders.remaining(o) > 0 && o.unitPrice > u) { u = o.unitPrice; via = 'İlan · ' + CUST[o.customerId].name; } if (Tea.special() === fid && Tea.left() > 0 && Tea.price(fid) > u) { u = Tea.price(fid); via = 'Çay Bahçesi'; } return { u, via }; };
  const offers = {}; for (const f of known) offers[f] = offer(f);
  for (const sp of SPOT_LIST) {
    if (!S.world.unlocked[sp.region_id]) continue; if (!Object.keys(sp.weights).some(f => known.has(f))) continue;
    const fuelC = sp.region_id === 'sakin_liman' ? 0 : REGION[sp.region_id].trip_fuel_cost / casts;
    for (const b of baits) for (const band of ['near', 'mid', 'far']) for (const m of METHOD_IDS) {
      const w = Selector.weights(sp.id, { rodPower: rp, bait: b.id, band, method: m, daypart: dp });
      const baitC = b.id === 'basic' ? 0 : BAIT[b.id].purchase_price;
      for (const x of w.list) {
        if (!known.has(x.id)) continue; const of = offers[x.id];
        const ev = sp.base_bite_chance * x.p * of.u - baitC - fuelC; const score = mode === 'profit' ? ev : x.p;
        const cur = best[x.id]; if (!cur || score > cur.score + 1e-9) best[x.id] = { fid: x.id, spot: sp.id, rid: sp.region_id, bait: b.id, band, method: m, p: x.p, fac: x.fac, unit: of.u, via: of.via, baitC, fuelC, ev, score };
      }
    }
  }
  return Object.values(best).sort((a, b) => b.score - a.score).slice(0, limit || 10);
};

QA.v4Tests = function (T, H) {
  const { fresh } = H;
  const boats = n => { S.cash = 1e7; ['coastal_skiff', 'motorboat', 'cabin', 'offshore'].slice(0, n).forEach(b => Boats.buy(b)); for (const b of S.boats.owned) for (const u of BOAT_INFO[b].ups) S.boats.byId[b].ups[u.key] = true; Boats.updateUnlocked(); S.boats.active = S.boats.owned[0]; };
  const know = rids => rids.forEach(r => REGION[r].fish_ids.forEach(f => S.ency[f] = { caught: 1, maxLen: 10, maxKg: 0.1, firstDay: 1 }));
  const gearFor = p => { for (const kind in GEAR) for (const it of GEAR[kind]) if (!S.gear.owned[kind].includes(it.id)) S.gear.owned[kind].push(it.id); const rod = RODS.find(r => r.power === clamp(p, 1, 5)) || RODS[0]; S.gear.rod = rod.id; S.gear.line = GEAR.line[Math.min(GEAR.line.length - 1, 2)].id; S.gear.reel = GEAR.reel[Math.min(GEAR.reel.length - 1, 2)].id; };
  const mkCtx = spot => ({ mode: SPOTS[spot].region_id === 'sakin_liman' && PIER_SPOTS.includes(spot) ? 'pier' : 'boat', surf: 214, minCast: 40, maxCast: 300, spotId: () => spot, tip: () => [200, 180], moving: () => false });
  /* atış yap ve iniş anını işlet (gerçek releaseCast + startWait) */
  const land = (spot, o) => { o = o || {}; Fishing.attach(mkCtx(spot)); if (o.method) S.method = o.method; Fishing.press(); if (Fishing.phase !== 'CHARGING') return null; Fishing.t = 0.6; Fishing.power = o.power != null ? o.power : 50; Fishing.releaseCast(); if (Fishing.phase !== 'CAST_FLYING') return null; Fishing.startWait(); return S.pendingCast; };
  const endCast = () => { if (S.pendingCast) Fishing.finish('NO_BITE', ''); Fishing.phase = 'READY'; Fishing.detach(); };
  /* iyi bir oyuncunun kontrolü: idealde yön karşılar, kaçışta bırakır, kaldırmada tutar */
  const ctrl = () => { const F = Fishing; if (F.phase !== 'REELING') return false; F.tilt = F.dir ? -F.dir : 0; if (F.jumpS && F.jumpS.st === 'air') return false; if (F.surge && F.surge.st === 'pull') return false; const sm = F.v4 && F.v4.sm; if (sm && sm.st === 'act') { if (sm.type === 'run' || sm.type === 'jump') return false; if (sm.type === 'lift') return F.tension < 86; } return F.tension < 62; };
  const fight = (fid, o) => { o = o || {}; const spot = SPOT_LIST.find(s => s.weights[fid]).id; Fishing.attach(mkCtx(spot)); S.pendingCast = { id: 1, spotId: spot, mode: 'boat', band: 'mid', bait: 'basic', fish: fid, size: o.size || { cm: 40, kg: 1, t: 0.4, cls: 'normal' }, bite: true, wait: 2, method: 'float', trophy: o.trophy || null };
    Fishing.bob = { x0: 200, y0: 200, x: 400, y: 214, tx: 400, ty: 214, dip: 0 }; Fishing.phase = 'BITE_WINDOW'; Fishing.t = 0.6; Fishing.hook(); let n = 0, presses = 0, dirs = 0, ld = 0, sms = 0; const hold = o.hold || ctrl;
    while (['REELING', 'QUICK_PULL'].includes(Fishing.phase) && n++ < 60 * 120) { const h = hold(); if (h && !Fishing.holding) presses++; Fishing.holding = h; if (Fishing.v4 && Fishing.v4.sm && !Fishing.v4._c) { Fishing.v4._c = 1; sms++; } if (Fishing.v4 && !Fishing.v4.sm) Fishing.v4._c = 0; Fishing.update(1 / 60); if (Fishing.dir && Fishing.dir !== ld) dirs++; ld = Fishing.dir; }
    const ph = Fishing.phase; const r = { ph, sec: n / 60, presses, dirs, sms, out: Fishing.lastOutcome }; Fishing.phase = 'READY'; Fishing.detach(); S.pendingCast = null; S.pendingCatch = null; return r; };
  const med = a => { const b = a.slice().sort((x, y) => x - y); return b[b.length >> 1]; };
  const durs = (fid, k, o) => { const d = []; let fails = 0; for (let i = 0; i < k; i++) { fresh(); gearFor(FISH[fid].power); const r = fight(fid, o); if (r.ph === 'CATCH_RESULT' || r.ph === 'STORAGE_DECISION') d.push(r.sec); else fails++; } return { med: d.length ? med(d) : null, min: Math.min(...d), max: Math.max(...d), fails }; };
  const succ = (fid, size) => { const spot = SPOT_LIST.find(s => s.weights[fid]).id; Fishing.attach(mkCtx(spot)); S.pendingCast = { id: 9, spotId: spot, mode: 'boat', band: 'mid', bait: 'basic', fish: fid, size, bite: true, method: 'float', daypart: 'day', tempo: Tempo.cur() }; Fishing.fishPos = { x: 300, y: 230, vx: 1 }; Fishing.phase = 'REELING'; Fishing.success(); const q = Fishing.resQ; Fishing.update(0.7); const r = { q, ph: Fishing.phase }; Fishing.phase = 'READY'; Fishing.detach(); return r; };

  /* ---------------- Akıcı Av ---------------- */
  T('v4-01. Güç 1 balık başarılı tasmadan sonra ek dokunuş gerektirmeden ~0,5–1,5 sn\'de alınır', () => { fresh(); gearFor(1); const r = fight('sardalya', { hold: () => false }); return { ok: r.ph === 'CATCH_RESULT' && r.presses === 0 && r.sec >= 0.5 && r.sec <= 1.5, info: r.sec.toFixed(2) + ' sn, ' + r.presses + ' dokunuş' }; });
  T('v4-02. Güç 1 avının enerji ve yem maliyeti değişmez; balık gerçekten envantere eklenir', () => { fresh(); S.baitStock.worm = 5; S.gear.bait = 'worm'; const sp = PIER_SPOTS.find(s => SPOTS[s].weights.sardalya) || 'liman_kiyi'; const e0 = S.energy; const pc = land(sp, { method: 'float' }); pc.bite = true; pc.fish = 'sardalya'; pc.size = { cm: 12, kg: 0.05, t: .2, cls: 'normal' }; const e1 = S.energy; Fishing.phase = 'BITE_WINDOW'; Fishing.t = 0.6; Fishing.hook(); let n = 0; while (Fishing.phase === 'QUICK_PULL' && n++ < 300) Fishing.update(1 / 60); const got = Inv.count(['bag'], 'sardalya'); const ok = e0 - e1 === rodOf().energy && S.energy === e1 && S.baitStock.worm === 4 && got === 1 && Fishing.phase === 'CATCH_RESULT'; Fishing.phase = 'READY'; Fishing.detach(); return { ok, info: 'enerji ' + e0 + '→' + S.energy + ' · yem ' + S.baitStock.worm + ' · çanta ' + got }; });
  T('v4-03. Güç 2 mücadelesi kısa (2–4 sn) ve en fazla bir belirgin yön değişimi', () => { const res = []; let maxDir = 0; for (const fid of ['kefal', 'karagoz', 'tekir', 'uskumru', 'zargana']) { for (let i = 0; i < 4; i++) { fresh(); gearFor(2); const r = fight(fid); if (r.ph !== 'CATCH_RESULT') return { ok: false, info: fid + ' ' + r.ph }; res.push(r.sec); maxDir = Math.max(maxDir, r.dirs); } } return { ok: med(res) >= 2 && med(res) <= 4 && maxDir <= 1, info: 'medyan ' + med(res).toFixed(1) + ' sn · en çok ' + maxDir + ' yön değişimi' }; });
  T('v4-04. Güç 3–5: mevcut gerilim/ekipman kuralları geçerli; hedef süreler (3: 5–9, 4: 9–15, 5: 15–25 sn)', () => {
    const d3 = durs('lufer', 6), d4 = durs('wahoo', 6), d5 = durs('kilic_baligi', 6);
    fresh(); gearFor(4); S.gear.line = GEAR.line[0].id; const brk = fight('akya', { hold: () => true }).out; fresh(); gearFor(5); const esc0 = fight('kilic_baligi', { hold: () => false }).out;
    fresh(); gearFor(3); S.gear.reel = GEAR.reel[0].id; const slow = fight('lufer').sec; fresh(); gearFor(3); S.gear.reel = GEAR.reel[GEAR.reel.length - 1].id; const fast = fight('lufer').sec;
    return { ok: d3.med >= 5 && d3.med <= 9 && d4.med >= 9 && d4.med <= 15 && d5.med >= 15 && d5.med <= 25 && brk === 'LINE_BREAK' && esc0 === 'FISH_ESCAPED' && fast < slow, info: brk + '/' + esc0 + ' · güç3 ' + d3.med.toFixed(1) + ' · güç4 ' + d4.med.toFixed(1) + ' · güç5 ' + d5.med.toFixed(1) + ' sn · kötü makara ' + slow.toFixed(1) + ' > iyi ' + fast.toFixed(1) };
  });
  T('v4-04b. Güç 4 en çok 2 özel hamle (uyarıyla); güç 5 üç aşama; tek küçük hata anında koparmaz', () => { let m4 = 0, m5 = 0; for (let i = 0; i < 6; i++) { fresh(); gearFor(4); m4 = Math.max(m4, fight('wahoo').sms); fresh(); gearFor(5); m5 = Math.max(m5, fight('kilic_baligi').sms); } fresh(); gearFor(4); let phases = new Set(); fresh(); gearFor(5); const spot = SPOT_LIST.find(s => s.weights.kilic_baligi).id; Fishing.attach(mkCtx(spot)); S.pendingCast = { id: 1, spotId: spot, mode: 'boat', band: 'mid', bait: 'basic', fish: 'kilic_baligi', size: { cm: 200, kg: 80, t: .5, cls: 'normal' }, bite: true, method: 'float' }; Fishing.bob = { x0: 200, y0: 200, x: 400, y: 214, tx: 400, ty: 214, dip: 0 }; Fishing.phase = 'BITE_WINDOW'; Fishing.t = 0.6; Fishing.hook(); let n = 0, wrongOnce = false, alive = true; while (Fishing.phase === 'REELING' && n++ < 7200) { const sm = Fishing.v4 && Fishing.v4.sm; let h = ctrl(); if (sm && sm.st === 'act' && sm.type !== 'lift' && !wrongOnce) { h = true; if (sm.t > V4F.dur[sm.type] - 0.05) wrongOnce = true; } Fishing.holding = h; phases.add(Fishing.v4 ? Fishing.v4.phase : -1); Fishing.update(1 / 60); } alive = Fishing.lastOutcome === 'catch' || Fishing.phase === 'CATCH_RESULT'; Fishing.phase = 'READY'; Fishing.detach(); return { ok: m4 >= 1 && m4 <= 2 && m5 >= 2 && phases.has(0) && phases.has(1) && phases.has(2) && wrongOnce && alive, info: 'güç4 hamle ' + m4 + ' · güç5 hamle ' + m5 + ' · aşamalar ' + [...phases].filter(x => x >= 0).join(',') + ' · bir yanlış hamleye rağmen ' + (alive ? 'yakalandı' : 'kaçtı') }; });
  T('v4-05/06. Akıcı Av bekleme 1,5–3,5 sn; Klasik Av mevcut 2–6 sn', () => { fresh(); const sp = 'liman_iskele'; const wf = [], wc = []; for (let i = 0; i < 25; i++) { S.tempo = 'flow'; const a = land(sp); wf.push(a.wait); endCast(); S.energy = 100; S.tempo = 'classic'; const b = land(sp); wc.push(b.wait); endCast(); S.energy = 100; } return { ok: Math.min(...wf) >= 1.5 && Math.max(...wf) <= 3.5 && Math.min(...wc) >= 2 && Math.max(...wc) <= 6 && Math.max(...wc) > 3.5, info: 'akıcı ' + Math.min(...wf).toFixed(1) + '–' + Math.max(...wf).toFixed(1) + ' · klasik ' + Math.min(...wc).toFixed(1) + '–' + Math.max(...wc).toFixed(1) }; });
  T('v4-07. Av temposu tür seçimini, vurmayı, boyu, enerjiyi ve tasma penceresini değiştirmez', () => { fresh(); const sp = 'liman_iskele'; const st0 = deepClone(S); const out = ['flow', 'classic'].map(t => { S = deepClone(st0); S.tempo = t; const pc = land(sp); const r = [pc.bite, pc.fish, pc.size && pc.size.cm, S.energy, Fishing.biteWin()].join(); endCast(); return r; }); let same = 0; for (let k = 0; k < 30; k++) { S = deepClone(st0); S.rng = 777 + k; S.tempo = 'flow'; const a = land(sp); const ra = [a.bite, a.fish].join(); endCast(); S = deepClone(st0); S.rng = 777 + k; S.tempo = 'classic'; const b = land(sp); const rb = [b.bite, b.fish].join(); endCast(); if (ra === rb) same++; } return { ok: out[0] === out[1] && same === 30, info: out[0] + ' · 30/' + same + ' aynı' }; });
  T('v4-08. Akıcı Av: normal av kompakt sonuç gösterir (büyük kart açılmaz), balık depodadır', () => { fresh(); S.ency.kefal = { caught: 3, maxLen: 60, maxKg: 3, firstDay: 1 }; const r = succ('kefal', { cm: 30, kg: 0.4, t: .3, cls: 'normal' }); return { ok: r.q && !r.q.big && r.ph === 'READY' && Inv.count(['bag'], 'kefal') === 1, info: 'büyük kart ' + r.q.big + ' · faz ' + r.ph }; });
  T('v4-09/10/11. İlk keşif, kişisel rekor ve olağanüstü boy ayrıntılı kart gösterir', () => { fresh(); const a = succ('kefal', { cm: 30, kg: .4, t: .3, cls: 'normal' }); const b = succ('kefal', { cm: 50, kg: .9, t: .6, cls: 'normal' }); const c = succ('kefal', { cm: 40, kg: .6, t: .95, cls: 'exceptional' }); const d = succ('kefal', { cm: 30, kg: .4, t: .3, cls: 'normal' }); return { ok: a.q.big && a.q.c.rec.isNew && b.q.big && b.q.c.rec.isRecord && c.q.big && !d.q.big, info: [a.q.big, b.q.big, c.q.big, d.q.big].join('/') }; });
  T('v4-12. Depo doluyken zorunlu karar ekranı korunur, balık kaybolmaz/satılmaz/bırakılmaz', () => { fresh(); for (let i = 0; i < Inv.cap('bag'); i++) S.bag.push({ f: 'hamsi', q: STACK }); const cash = S.cash; const r = succ('kefal', { cm: 30, kg: .4, t: .3, cls: 'normal' }); return { ok: r.q.big && r.q.storage && S.pendingCatch && S.pendingCatch.fid === 'kefal' && S.cash === cash && Inv.total('bag') === Inv.cap('bag') * STACK, info: 'karar ' + r.q.storage }; });
  T('v4-13. Hızlı Tekrar: bir etkileşim bir atış, normal enerji ve yem', () => { fresh(); S.baitStock.worm = 5; S.gear.bait = 'worm'; land('liman_iskele'); endCast(); Fishing.attach(mkCtx('liman_iskele')); const e0 = S.energy, c0 = S.stats.manualCasts, w0 = S.baitStock.worm; Fishing._qcAt = 0; const r = Fishing.quickCast(); const r2 = Fishing.quickCast(); const ok = r.ok && !r2.ok && S.stats.manualCasts === c0 + 1 && S.energy === e0 - rodOf().energy && S.baitStock.worm === w0 - 1; endCast(); return { ok, info: 'atış +' + (S.stats.manualCasts - c0) }; });
  T('v4-14. Eski sonuç ekranı yeni mücadele sırasında açılmaz; sahne değişimi bekleyen sonucu iptal eder', () => { fresh(); S.tempo = 'classic'; const spot = 'koy_derin'; Fishing.attach(mkCtx(spot)); S.pendingCast = { id: 5, spotId: spot, mode: 'boat', band: 'mid', bait: 'basic', fish: 'levrek', size: { cm: 50, kg: 1, t: .4, cls: 'normal' }, bite: true, method: 'float' }; Fishing.fishPos = { x: 300, y: 230 }; Fishing.success(); const q = Fishing.resQ; Fishing.phase = 'CHARGING'; Fishing.update(1.0); const notShown = !q.shown; Fishing.phase = 'CATCH_RESULT'; Fishing.detach(); Fishing.attach(mkCtx(spot)); const cleared = Fishing.resQ === null; Fishing.phase = 'READY'; Fishing.detach(); const src = Fishing.success.toString(); return { ok: notShown && cleared && !/setTimeout/.test(src), info: 'gösterilmedi ' + notShown + ' · temizlendi ' + cleared }; });

  /* ---------------- Üç yöntem ---------------- */
  T('v4-15. Şamandıra yöntemi normal çalışır (v3 ile aynı ağırlıklar, vuruş ve tasma)', () => { fresh(); const w1 = Selector.weights('liman_iskele', { rodPower: 1, bait: 'basic', band: 'mid' }).list.map(x => x.p.toFixed(10)).join(); const w2 = Selector.weights('liman_iskele', { rodPower: 1, bait: 'basic', band: 'mid', method: 'float', daypart: 'day' }).list.map(x => x.p.toFixed(10)).join(); const pc = land('liman_iskele', { method: 'float' }); const ok = typeof pc.bite === 'boolean' && (!pc.bite || FISH[pc.fish]) && !pc.fake && pc.method === 'float'; endCast(); return { ok: ok && w1 === w2, info: 'vuruş ' + pc.bite }; });
  T('v4-16/17. Dip oltası: sahte titreşim gerçek vuruştan ayrılır (bükülme/metin), erken tasma başarısız; atışta en fazla 1 sahte', () => { fresh(); S.day = 10; let fakePc = null, nFake = 0, nNo = 0, k = 0; for (; k < 120 && !fakePc; k++) { const pc = land('liman_iskele', { method: 'bottom' }); if (pc.fake) { nFake++; fakePc = pc; break; } nNo++; endCast(); S.energy = 100; } if (!fakePc) return { ok: false, info: 'sahte bulunamadı' }; Fishing.t = fakePc.fake.at + 0.1; const bf = Fishing.rodBend(), fa = Fishing.fakeActive(); const wasObj = fakePc.fake && typeof fakePc.fake.at === 'number' && !Array.isArray(fakePc.fake); Fishing.press(); const early = Fishing.lastOutcome; Fishing.phase = 'READY'; Fishing.detach(); fresh(); const pc2 = land('liman_iskele', { method: 'bottom' }); pc2.bite = true; pc2.fish = 'kefal'; pc2.size = { cm: 30, kg: .4, t: .3, cls: 'normal' }; Fishing.phase = 'BITE_WINDOW'; Fishing.t = 0.2; const br = Fishing.rodBend(); endCast(); let many = 0; for (let i = 0; i < 80; i++) { fresh(); S.day = 10; S.stats.manualCasts = i * 3; const p = land('liman_iskele', { method: 'bottom' }); if (p && p.fake && Array.isArray(p.fake)) many++; if (p && !p.fake) nNo++; endCast(); } return { ok: fa && bf > 10 && bf < 36 && br >= 40 && early === 'MISSED_BITE' && wasObj && many === 0 && nNo > 0, info: 'sahte bükülme ' + bf.toFixed(0) + ' · gerçek ' + br.toFixed(0) + ' · erken tasma ' + early }; });
  T('v4-18/19. Spin: ritimli hareketler sayılır, çok hızlı dokunuş ek avantaj sağlamaz, takip gölgesi RNG ile tutarlı', () => { fresh(); const pc = land('liman_iskele', { method: 'spin' }); Fishing.t = 1.0; Fishing.twitch(); Fishing.t = 2.3; Fishing.twitch(); Fishing.t = 3.6; Fishing.twitch(); const good = pc.spin.good; const spam = Object.assign({}, pc, { spin: { good: 3, bad: 12 } }); const effSpam = Fishing.spinEff(spam), effGood = Fishing.spinEff(pc); pc.u = 0.99; delete pc.bite; Fishing.spinResolve(); const noFollowNoBite = pc.bite === false; endCast(); return { ok: good === 3 && effGood === 3 && effSpam === 0 && noFollowNoBite, info: 'iyi ' + good + ' · spam etkisi ' + effSpam }; });
  T('v4-20/21. Tür ağırlıkları her birleşimde normalize; yöntem/fırsat güç sınırını aşmaz', () => { fresh(); let worst = 0, over = 0; for (const sp of SPOT_LIST) for (const m of METHOD_IDS) for (const set of [null, Opp.set('school', sp.id), Opp.set('bottom', sp.id)]) { const w = Selector.weights(sp.id, { rodPower: 1, bait: 'lure', band: 'mid', method: m, daypart: 'evening', boost: set ? { set, mul: 1.3 } : null }); if (w.list.length) worst = Math.max(worst, Math.abs(sum(w.list.map(x => x.p)) - 1)); over += w.list.filter(x => FISH[x.id].power > 2).length; } return { ok: worst < 1e-9 && over === 0, info: 'sapma ' + worst.toExponential(1) + ' · güç aşımı ' + over }; });

  /* ---------------- Özel av fırsatları ---------------- */
  const rollMany = (spot, n, keep) => { const seen = {}; for (let k = 0; k < n; k++) { S.stats.manualCasts = k; if (!keep) { S.opp.active = null; S.opp.per = {}; S.opp.per[Opp.key()] = { casts: 5, n: 0 }; } const ev = Opp.roll({ spotId: spot, mode: 'boat' }); if (ev) seen[ev.type] = (seen[ev.type] || 0) + 1; } return seen; };
  T('v4-22/23. Dört fırsat türü oluşur ve yalnız noktadaki gerçek tür havuzunu kullanır', () => { fresh(); const all = {}; for (const sp of SPOT_LIST) { const s = rollMany(sp.id, 400); for (const k in s) all[k] = (all[k] || 0) + s[k]; } const okSets = SPOT_LIST.every(sp => ['school', 'bottom', 'predator'].every(t => Opp.set(t, sp.id).every(f => sp.weights[f]))); return { ok: Object.keys(V4.oppTypes).every(t => all[t] > 0) && okSets, info: JSON.stringify(all) }; });
  T('v4-24/25. Bir seferde en fazla 2 olay; aynı anda yalnız bir aktif olay; ilk 2 atıştan önce olay yok', () => { fresh(); boats(1); Trips.begin('yesil_koy', 12); let created = 0, maxActive = 0, early = 0; for (let k = 0; k < 600; k++) { S.stats.manualCasts = k; const before = Opp.sess().casts; const ev = Opp.roll({ spotId: 'koy_derin', mode: 'boat' }); if (ev) { created++; if (before < 1) early++; } maxActive = Math.max(maxActive, S.opp.active && S.opp.active.status === 'active' ? 1 : 0); if (S.opp.active && k % 3 === 0) { Opp.consume({ spotId: 'koy_derin', band: 'mid', method: 'float' }); } } return { ok: created <= 2 && created >= 1 && maxActive <= 1 && early === 0, info: created + ' olay' }; });
  T('v4-26/27. Fırsat iki geçerli atış sonunda biter; enerji maliyeti normal', () => { fresh(); S.opp.active = { id: 'opX', type: 'school', day: 1, trip: null, rid: 'sakin_liman', spot: 'liman_iskele', band: 'mid', left: 2, status: 'active' }; const ev = S.opp.active; const e0 = S.energy; land('liman_iskele'); endCast(); const l1 = ev.left; land('liman_iskele'); endCast(); return { ok: l1 === 1 && ev.left === 0 && ev.status === 'used' && (!Opp.active() || Opp.active().id !== ev.id) && S.energy === e0 - 2 * rodOf().energy, info: 'kalan ' + l1 + ' → ' + ev.status }; });
  T('v4-28/29. Fırsatlar otomatik oltada ve NPC filosunda kullanılmaz', () => { fresh(); boats(2); know(['yesil_koy']); S.baitStock.worm = 100; Auto.buy('auto1'); S.boats.active = 'coastal_skiff'; S.auto.devices.auto1.boat = 'coastal_skiff'; S.opp.active = { id: 'opA', type: 'school', day: 1, trip: null, rid: 'yesil_koy', spot: 'koy_derin', band: 'mid', left: 2, status: 'active' }; for (let i = 0; i < 20; i++) Auto.onCastComplete('koy_derin', 'boat'); const leftAuto = S.opp.active.left; const m = { id: 'mX', npc: 'tuna', rid: 'yesil_koy', boat: 'motorboat' }; const a = JSON.stringify(Fleet.resolve(m)); S.opp.active = null; const b = JSON.stringify(Fleet.resolve(m)); return { ok: leftAuto === 2 && a === b, info: 'oto sonrası hak ' + leftAuto }; });
  T('v4-30. Festival yarışmasında özel olay oluşmaz ve kullanılmaz', () => { fresh(); S.day = 14; World.startDay(); Comp.start(); Game.sceneName = 'PierFishing'; S.opp.active = { id: 'opF', type: 'school', day: 14, trip: null, rid: 'sakin_liman', spot: 'liman_iskele', band: 'mid', left: 2, status: 'active' }; let made = 0; for (let i = 0; i < 8; i++) { const pc = land('liman_iskele'); if (!pc) break; if (pc.opp) made++; endCast(); } const ev = Opp.roll({ spotId: 'liman_iskele', comp: true }); return { ok: made === 0 && S.opp.active.left === 2 && !ev && S.energy === 100, info: 'yarışmada fırsat ' + made }; });

  T('v4-77/78/79/80. Günlük 4 gözlem sınırı ortak; yalnız bölge havuzu; aynı canlı ikinci kayıt oluşturmaz; av sayılmaz', () => { const BF = binocSetup(); Binoc.start(); const tg = S.trip.binoc.targets; const regional = tg.every(t => WILD[t.id].rid === 'yesil_koy'); const m0 = S.stats.manualCatches, a0 = S.stats.autoCatches; S.wild.day = S.day; S.wild.n = 4; const r = Binoc.finish('caretta'); const capped = r.capped && !S.wild.seen.caretta; S.trip.binoc = null; S.wild.n = 0; Binoc.start(); Binoc.finish('caretta'); S.trip.binoc = null; Binoc.start(); Binoc.finish('caretta'); const one = Object.keys(S.wild.seen).filter(k => k === 'caretta').length === 1 && S.wild.seen.caretta.n === 2; let allReg = true; for (let k = 0; k < 40; k++) { S.trip.binoc = null; S.trip.id = 100 + k; S.energy = 100; Binoc.start(); for (const t of S.trip.binoc.targets) if (WILD[t.id].rid !== 'yesil_koy') allReg = false; } return { ok: regional && allReg && capped && one && S.stats.manualCatches === m0 && S.stats.autoCatches === a0 && !S.ency.caretta, info: 'sınır ' + capped + ' · tek kayıt ' + one }; });
  T('v4-81/82. Hareket eden teknede başlamaz; kayıt yükleyerek ücretsiz yeniden başlatılamaz', () => { const BF = binocSetup(); BF.v = 30; const mv = Binoc.start(); BF.v = 0; Binoc.start(); const u = Save.unpack(Save.pack(S)); S = u.state; const again = Binoc.start(); return { ok: !mv.ok && /dur/.test(mv.msg) && !again.ok && u.state.trip.binoc, info: mv.msg }; });

  /* ---------------- Genel uyumluluk ---------------- */
  T('v4-83/84/85/86. Şema 4 → 5 göçü: tekneler, filo görevleri, teslim kasası, akvaryum, rekorlar, başarımlar korunur; geçmiş uydurulmaz', () => { fresh(); boats(3); know(['yesil_koy']); S.boats.active = 'coastal_skiff'; Fleet.start('motorboat', Fleet.candidates()[0], 'yesil_koy'); S.fleet.missions.push({ id: 'mOld', boat: 'cabin', npc: Fleet.candidates().find(n => !Fleet.busyNpc(n)), rid: 'yesil_koy', start: 1, ret: 2, days: 1, wage: 1, fuel: 1, status: 'back', result: { fish: { cipura: 2 }, n: 2, value: 80 }, left: [{ f: 'cipura', q: 2 }] }); Aq.buyModel('small'); Inv.add('chest', 'sardalya', 2); Aq.put('small', 'sardalya', 2, 'chest'); Tx.run('t', () => { Catch.record('levrek', { cm: 70, kg: 4, t: .8 }, false, { spot: 'koy_derin' }); return { ok: true }; }); S.ach.first_catch = 1; S.trophies.push({ fest: FESTIVALS[0].id, year: 1, place: 1, score: 1, day: 14 }); S.ency.zargana = { caught: 2, maxLen: 90, maxKg: 1, firstDay: 1 }; S.cash = 5555; S.energy = 61;
    const old = deepClone(S); for (const k of ['tempo', 'opp', 'trophy', 'guild', 'stories', 'storyTrack', 'album', 'shore', 'unlocks', 'v4']) delete old[k]; delete old.today.guildIncome; old.schemaVersion = 4; const body = JSON.stringify(old); const u = Save.unpack(JSON.stringify({ format: 'cozyfishing-save', schemaVersion: 4, revision: 1, savedAt: 1, checksum: hash32(body), state: old })); const st = u.state;
    return { ok: u.ok && st.schemaVersion === 5 && st.cash === 5555 && st.energy === 61 && st.boats.owned.length === 3 && st.fleet.missions.length === 2 && st.fleet.missions[1].left[0].q === 2 && st.aq.tanks.small.fish.sardalya === 2 && st.records.length === 1 && st.ach.first_catch && st.trophies.length === 1 && st.tempo === 'flow' && Object.keys(st.trophy.done).length === 0 && Object.keys(st.shore.items).length === 0 && Object.values(st.stories).length === 0 && st.guild === null, info: u.msg || 'şema ' + st.schemaVersion + ' · zargana keşfi var, trofe zaferi uydurulmadı' }; });
  T('v4-87/88/89. Festival 8 atış kuralı, günlük 100 enerji ve 6 otomatik av sınırı değişmedi', () => { fresh(); S.day = 14; World.startDay(); Comp.start(); Game.sceneName = 'PierFishing'; let n = 0; while (Comp.active() && n < 20) { const pc = land('liman_iskele'); if (!pc) break; endCast(); n++; } const e = S.energy; fresh(); boats(1); S.baitStock.worm = 300; Auto.buy('auto1'); Auto.buy('auto_reel'); Auto.buy('sensing'); S.auto.devices.auto1.boat = S.boats.active; S.bagLevel = INVC.bag.length - 1; for (let i = 0; i < 300; i++) Auto.onCastComplete('koy_derin', 'boat'); return { ok: n === 8 && e === 100 && CORE.daily_energy === 100 && CORE.auto_daily_catch_cap === 6 && S.auto.dailyCaught === 6, info: n + ' atış · enerji ' + e + ' · oto ' + S.auto.dailyCaught }; });
  T('v4-90. Yeni paneller hatasız oluşur (mobil düzen ayrıca tarayıcıda test edilir)', () => { fresh(); boats(2); S.day = 5; Guild.ensure(); S.stats.manualCatches = 1; Stories.check(); const ps = ['Guild', 'Stories']; for (const p of ps) { const r = UI.P[p].call(UI, {}); if (!r || !r.html) return { ok: false, info: p }; } UI.tab.jr = 'trophy'; UI.P.Journal.call(UI); UI.tab.jr = 'shore'; UI.P.Journal.call(UI); UI.tab.st = 'album'; UI.P.Stories.call(UI, {}); UI.tab.jr = 'guide'; UI.tab.st = 'stories'; return { ok: !!UI.trophyHtml() && !!UI.shoreHtml(), info: ps.join(',') + ',Trofe,Kıyı,Albüm' }; });
  T('v4-91. Tek HTML: harici script/stil/görsel kaynağı yok', () => { const ext = [...document.querySelectorAll('script[src],link[rel=stylesheet],img[src^=http]')].length; return { ok: ext === 0, info: 'harici ' + ext }; });
};
