<style>

function finProf(p, s) {
  switch (p) {
    case 'tri': return s < 0.3 ? s / 0.3 : 1 - (s - 0.3) / 0.7 * 0.85;
    case 'spiny': return (s < 0.15 ? s / 0.15 : 1 - (s - 0.15) * 0.75);
    case 'round': return Math.pow(Math.sin(Math.PI * s), 0.6);
    case 'low': return Math.min(1, s * 6, (1 - s) * 6);
    case 'sickle': return s < 0.2 ? s / 0.2 : Math.pow(Math.max(0.04, 1 - (s - 0.2) / 0.8), 2.2);
    case 'sail': return s < 0.08 ? s / 0.08 : 1 - 0.55 * Math.pow((s - 0.08) / 0.92, 1.5);
    case 'fringe': return Math.min(1, s * 10, (1 - s) * 10) * (0.8 + 0.2 * Math.sin(s * 50));
  }
  return Math.sin(Math.PI * s);
}

function portraitPB(look) {

  if (of.pat === 'vest') { pb.rect(6, 33, 7, 7, of.shirt2); pb.rect(27, 33, 7, 7, of.shirt2); }
  if (of.pat === 'buttons') { for (let y = 33; y < 40; y += 2) pb.set(20, y, '#e8c050'); }
  if (of.pat === 'nordic') { for (let x = 6; x < 34; x++) pb.set(x, 35, (x % 2) ? of.shirt2 : of.shirt); pb.rect(6, 34, 28, 1, of.shirt2); pb.rect(6, 36, 28, 1, of.shirt2); }
  if (of.pat === 'rain') { pb.rect(19, 32, 2, 8, of.shirt2); }
  if (look.scarf) { pb.rect(13, 30, 14, 3, look.scarf); pb.rect(13, 33, 3, 4, dark(look.scarf, .2)); }
  /* boyun & kafa */
  pb.rect(16, 26, 8, 6, SD);
  pb.ellipse(20, 17, 10.5, 11.5, SK, (x, y) => x < 13 ? SD : (x > 25 && y > 18 && y < 24 ? mix(SK, '#f08a7a', 0.12) : SK));
  pb.ellipse(10, 19, 2, 3, SD);
  /* saç kapağı */
  const hairTop = (x, y) => (ihash(x, y, 5) < 0.12 ? HL : (x < 14 ? HD : H));
  const st = look.hair | 0;
  if (st === 6) pb.ellipse(20, 11, 14, 10, H, hairTop); else pb.ellipse(20, 11, 11.5, 7.5, H, hairTop);
  if (st === 3 || st === 7) { pb.rect(8, 10, 5, st === 3 ? 22 : 16, H); pb.rect(27, 10, 4, st === 3 ? 12 : 12, HD); }
  if (st === 4) { pb.ellipse(6, 18, 3, 8, H); pb.rect(7, 10, 3, 4, '#c84a6a'); }
  if (st === 5) pb.ellipse(14, 4, 5, 4, H, hairTop);

  if (st === 2) { for (let x = 16; x <= 30; x++) for (let y = 9; y <= 12 - Math.floor((x - 16) / 5); y++) pb.set(x, y, H); }
  if (st === 0 || st === 7) for (let x = 20; x <= 29; x++) pb.set(x, 11, H);
  /* yüz */
  const E = '#241a26';
  for (const ex of [16, 24]) { pb.rect(ex - 1, 17, 4, 3, '#fbf8f2'); pb.rect(ex + 1, 17, 2, 3, E); pb.set(ex + 1, 17, '#5a4a6a'); pb.rect(ex - 1, 16, 4, 1, E); pb.set(ex + 2, 18, '#ffffff'); }
  pb.rect(14, 14, 4, 1, HD); pb.rect(23, 14, 4, 1, HD);
  pb.set(22, 21, SD); pb.set(22, 22, SD); pb.set(21, 23, SD);
  pb.rect(18, 25, 5, 1, '#8a3a3a'); pb.set(17, 24, '#8a3a3a'); pb.set(23, 24, '#8a3a3a'); pb.rect(19, 26, 3, 1, '#c86868');
  pb.rect(12, 22, 2, 1, mix(SK, '#f06a6a', 0.4)); pb.rect(27, 22, 2, 1, mix(SK, '#f06a6a', 0.4));
  if (look.beard) { const bc = look.beardColor || H; pb.ellipse(20, 26, 9.5, 6, bc, (x, y) => (y < 25 && x > 16 && x < 24) ? null : ((x + y) % 3 ? bc : dark(bc, 0.15))); for (let y = 24; y <= 26; y++) for (let x = 17; x <= 23; x++) if (y === 25 || y === 26) pb.set(x, y, y === 25 ? '#8a3a3a' : bc); pb.rect(16, 23, 9, 1, bc); }

function catPB(f) {
  const pb = new PB(14, 10); const c = '#d88a4a', d = '#a8642e', l = '#f0b070';
  pb.rect(2, 4, 8, 4, c); pb.rect(3, 3, 6, 1, l); pb.rect(9, 1, 4, 4, c); pb.set(9, 0, d); pb.set(12, 0, d); pb.set(11, 2, '#2a2020'); pb.set(12, 3, '#e87a7a');
  for (let i = 0; i < 4; i += 1) pb.set(3 + i * 2, 4, d);
  const lg = f ? [2, 5, 7, 9] : [3, 4, 8, 9]; lg.forEach(x => { pb.set(x, 8, d); pb.set(x, 9, d); });
  pb.set(1, 3 - (f ? 1 : 0), c); pb.set(0, 2 - (f ? 1 : 0), c); pb.set(1, 4, c);
  pb.outline(null, 0.5); return pb;
}

}

/* ---------- UI kenarlık (9-dilim) görselleri ---------- */
function frameSkin(kind) {
  const pb = new PB(24, 24);
  if (kind === 'wood') {
    for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) { const pl = Math.floor(y / 4); pb.set(x, y, (y % 4 === 0) ? '#6a4628' : (ihash(x, pl, 3) < 0.08 ? '#8a5e36' : (pl % 2 ? '#a8743e' : '#9e6c38'))); }
    for (let i = 0; i < 24; i++) { pb.set(i, 0, '#3a2414'); pb.set(i, 23, '#3a2414'); pb.set(0, i, '#3a2414'); pb.set(23, i, '#3a2414'); pb.set(i, 1, '#c8925a'); pb.set(1, i, '#c8925a'); pb.set(i, 22, '#5a3a1e'); pb.set(22, i, '#5a3a1e'); }
    for (const [x, y] of [[3, 3], [20, 3], [3, 20], [20, 20]]) { pb.set(x, y, '#e8d8a0'); pb.set(x + 1, y + 1, '#6a5a3a'); }
  } else if (kind === 'paper') {
    for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) pb.set(x, y, ihash(x, y, 1) < 0.06 ? '#eadcb8' : '#f6ecd2');
    for (let i = 0; i < 24; i++) { pb.set(i, 0, '#8a6a42'); pb.set(i, 23, '#8a6a42'); pb.set(0, i, '#8a6a42'); pb.set(23, i, '#8a6a42'); pb.set(i, 1, '#fffaf0'); pb.set(1, i, '#fffaf0'); pb.set(i, 22, '#d8c49a'); pb.set(22, i, '#d8c49a'); }
    pb.set(0, 0, null); pb.d[0] = 0; pb.d[23] = 0; pb.d[23 * 24] = 0; pb.d[23 * 24 + 23] = 0;
  } else if (kind === 'btn' || kind === 'btnP' || kind === 'btnG' || kind === 'btnR' || kind === 'btnB') {
    const base = { btn: '#c89a5e', btnP: '#a87a46', btnG: '#5aa86a', btnR: '#c8604a', btnB: '#4f86c6' }[kind];
    for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) pb.set(x, y, y < 3 && kind !== 'btnP' ? light(base, 0.25) : (y > 19 ? dark(base, 0.25) : base));
    for (let i = 0; i < 24; i++) { pb.set(i, 0, '#3a2414'); pb.set(i, 23, '#3a2414'); pb.set(0, i, '#3a2414'); pb.set(23, i, '#3a2414'); }
    pb.d[0] = 0; pb.d[23] = 0; pb.d[23 * 24] = 0; pb.d[23 * 24 + 23] = 0;
  } else if (kind === 'slot') {
    for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) pb.set(x, y, '#e4d4ae');
    for (let i = 0; i < 24; i++) { pb.set(i, 0, '#8a6a42'); pb.set(0, i, '#8a6a42'); pb.set(i, 1, '#c8b48a'); pb.set(1, i, '#c8b48a'); pb.set(i, 23, '#fff6e0'); pb.set(23, i, '#fff6e0'); }
  } else if (kind === 'dark') {
    for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) pb.set(x, y, '#2a2238e6');
    for (let i = 0; i < 24; i++) { pb.set(i, 0, '#120c1a'); pb.set(i, 23, '#120c1a'); pb.set(0, i, '#120c1a'); pb.set(23, i, '#120c1a'); pb.set(i, 1, '#4a3e5e'); pb.set(1, i, '#4a3e5e'); }
    pb.d[0] = 0; pb.d[23] = 0; pb.d[23 * 24] = 0; pb.d[23 * 24 + 23] = 0;
  }
  return pb;
}
function installSkins() {
  const kinds = ['wood', 'paper', 'btn', 'btnP', 'btnG', 'btnR', 'btnB', 'slot', 'dark'];
  let css = '';
  for (const k of kinds) { const u = Atlas.url('skin:' + k, () => frameSkin(k), 1); css += `--skin-${k}:url(${u});`; }
  const st = document.createElement('style'); st.textContent = `:root{${css}}`; document.head.appendChild(st);
}

      if (t > 0.86) c = cfg.hull >= 1 ? '#8a2e2a' : '#a8463a';

    const chk = (name, arr, cap) => { if (!Array.isArray(arr)) { errs.push(name + ' dizi değil'); return; } if (arr.length > cap) errs.push(name + ' kapasite aşımı ' + arr.length + '>' + cap); arr.forEach(x => { if (!x || !FISH[x.f] || !(x.q >= 1 && x.q <= STACK) || x.q !== (x.q | 0)) errs.push(name + ' bozuk stack ' + JSON.stringify(x)); }); };
    chk('bag', s.bag, INVC.bag[s.bagLevel][1]); chk('chest', s.chest, INVC.home_chest[s.chestLevel][1]);
    for (const id of s.boats.owned) { const b = s.boats.byId[id]; if (!b) { errs.push('tekne yok ' + id); continue; } const info = BOAT_INFO[id]; let st2 = BOAT[id].initial_storage; for (const u of info.ups) if (b.ups[u.key] && u.type === 'storage') st2 = Math.max(st2, u.val); chk(id, b.storage, st2); }
    if (s.cash < 0 || s.energy < 0) errs.push('negatif değer');
    for (const k in s.baitStock) if (s.baitStock[k] < 0) errs.push('negatif yem');
    return errs;
  }
};

/* ---------- Tür seçici ---------- */
const BAND_MATCH = 1.25, BAND_MISS = 0.85;
const Selector = {
  weights(spotId, o) {
    const sp = SPOTS[spotId]; const rid = sp.region_id; const wx = S.world.weather[rid] || 'sunny';
    const season = World.season(); const ev = World.event(); const list = [];
    for (const fid in sp.weights) {
      const f = FISH[fid]; if (!f) continue; const base = sp.weights[fid];
      if (o.auto) { if (f.power > o.maxPower || f.power >= RC.hard_fish_only_manual_power) continue; }
      else if (f.power > o.rodPower + 1) continue;
      const fac = {};
      fac.bait = (!o.bait || o.bait === 'basic') ? K.basic_bait_multiplier : (f.favored_baits.includes(o.bait) ? K.bait_favorable_multiplier : K.bait_unfavorable_multiplier);
      fac.season = f.season_boost === season ? f.season_modifier : 1;
      fac.weather = f.weather_boost ? (f.weather_boost === wx ? K.weather_favorable_multiplier : (WX_BAD[f.weather_boost] === wx ? K.weather_unfavorable_multiplier : 1)) : 1;
      fac.band = !o.band ? 1 : (f.preferred_cast_band === o.band ? BAND_MATCH : ((f.preferred_cast_band === 'mid' || o.band === 'mid') ? 1 : BAND_MISS));
      fac.event = (ev && ev.species === fid && ev.region === rid) ? ev.modifier : 1;
      list.push({ id: fid, base, fac, w: base * fac.bait * fac.season * fac.weather * fac.band * fac.event });
    }
    const total = sum(list.map(x => x.w)); list.forEach(x => x.p = total > 0 ? x.w / total : 0);
    return { list, total, baseTotal: sum(Object.values(sp.weights)) };
  },
  pick(list) { const r = rand(); let acc = 0; for (const x of list) { acc += x.p; if (r < acc) return x.id; } return list[list.length - 1].id; },
  rollSize(fid) {
    const f = FISH[fid], sd = K.size_distribution; const r = rand(); let cls = 'normal';
    if (r >= sd.normal.prob) cls = r < sd.normal.prob + sd.large.prob ? 'large' : 'exceptional';
    const tr = sd[cls].t_range; const t = lerp(tr[0], tr[1], rand());
    const [l0, l1] = f.size_game_range.length_cm, [w0, w1] = f.size_game_range.weight_kg;
    return { cls, t, cm: Math.round(l0 + t * (l1 - l0)), kg: round2(w0 + Math.pow(t, 3) * (w1 - w0)) };
  }
};
const discovered = () => Object.keys(S.ency).filter(k => S.ency[k].caught > 0).length;
const totalCatches = () => S.stats.manualCatches + S.stats.autoCatches;
const rodOf = () => RODS.find(r => r.id === S.gear.rod);
const maxRodPower = () => Math.max(...S.gear.owned.rod.map(id => RODS.find(r => r.id === id).power));

/* ---------- Yakalama kaydı ---------- */
const Catch = {
  record(fid, size, auto) {
    const e = S.ency[fid] || (S.ency[fid] = { caught: 0, maxLen: 0, maxKg: 0, firstDay: S.day });
    const isNew = e.caught === 0; const isRecord = !isNew && size.cm > e.maxLen;
    e.caught++; if (size.cm > e.maxLen) e.maxLen = size.cm; if (size.kg > e.maxKg) e.maxKg = size.kg;
    if (isRecord) { S.stats.records++; S.today.records.push(fid); }
    if (isNew) S.today.newSpecies.push(fid);
    if (auto) { S.stats.autoCatches++; S.today.autoCatches++; } else { S.stats.manualCatches++; S.today.manualCatches++; }
    const p = FISH[fid].power; if (p === 4) S.stats.power4++; if (p === 5) S.stats.power5++;
    if (size.cm > S.stats.biggestCm) { S.stats.biggestCm = size.cm; S.stats.biggestId = fid; }
    return { isNew, isRecord };
  }
};

/* ---------- Balık hali ---------- */
const Market = {
  sources(withChest) { const s = ['bag']; if (S.boats.active) s.push('boat:' + S.boats.active); if (withChest) s.push('chest'); return s; },
  betterOffer(fid) { const base = FISH[fid].base_price; let best = null; for (const o of Orders.active()) if (o.fishId === fid && Orders.remaining(o) > 0 && o.unitPrice > base && (!best || o.unitPrice > best.unitPrice)) best = o; return best; },
  sell(fid, n, src) {
    return Tx.run('marketSell', () => {
      const have = Inv.count(src, fid); const k = Math.min(n | 0, have); if (k <= 0) return { ok: false, msg: 'Satılacak balık yok.' };
      const rem = Inv.remove(src, fid, k); const inc = rem * FISH[fid].base_price;
      S.cash += inc; S.stats.totalSales += inc; S.stats.marketSales += inc; S.stats.fishSoldMarket += rem; S.today.marketIncome += inc;
      Sound.sfx('coin'); return { ok: true, n: rem, income: inc };
    });
  },
  sellAllPlan(src, includeFav) { const sp = Inv.species(src); const out = []; for (const f in sp) { if (!includeFav && S.favorites[f]) continue; out.push({ f, n: sp[f], income: sp[f] * FISH[f].base_price, better: this.betterOffer(f) }); } return out; },
  sellAll(src, includeFav) {

      const plan = this.sellAllPlan(src, includeFav); if (!plan.length) return { ok: false, msg: 'Satılacak uygun balık yok.' };
      let inc = 0, cnt = 0; for (const p of plan) { const rem = Inv.remove(src, p.f, p.n); inc += rem * FISH[p.f].base_price; cnt += rem; }
      S.cash += inc; S.stats.totalSales += inc; S.stats.marketSales += inc; S.stats.fishSoldMarket += cnt; S.today.marketIncome += inc;
      Sound.sfx('coin'); return { ok: true, n: cnt, income: inc };
    });
  }
};

/* ---------- Sipariş panosu ---------- */
const Orders = {
  slots() { const n = Object.keys(S.world.unlocked).filter(k => S.world.unlocked[k]).length; return n >= 5 ? CFG.orders.board_slots_after_five_regions : n >= 3 ? CFG.orders.board_slots_after_three_regions : CFG.orders.starting_board_slots; },
  active() { return S.orders.filter(o => S.day < o.expiresAtDayExclusive); },
  remaining(o) { return Math.max(0, o.requestedTotal - o.delivered); },
  daysLeft(o) { return o.expiresAtDayExclusive - S.day; },
  relDelivered(cid) { return (S.customers[cid] && S.customers[cid].delivered) || 0; },
  relLevel(cid) { const d = this.relDelivered(cid); const th = CFG.orders.relationship_threshold_fish_delivered; let l = 0; th.forEach(t => { if (d >= t) l++; }); return l; },
  gen(day, opts) {
    opts = opts || {};
    const r = mulberry(hash32(S.seed, 'order', day, S.orderSeq));
    const unlocked = REGIONS.filter(x => S.world.unlocked[x.id]).map(x => x.id);
    const fut = opts.future || null; let cust;
    if (opts.customerId) cust = CUST[opts.customerId];
    else { const c = CUSTOMERS.filter(c => fut ? c.focus.includes(fut) : c.focus.some(f => unlocked.includes(f))); cust = c.length ? c[Math.floor(r() * c.length)] : CUST.bahar; }
    const regs = fut ? [fut] : cust.focus.filter(f => unlocked.includes(f));
    let pool = []; (regs.length ? regs : ['sakin_liman']).forEach(rg => REGION[rg].fish_ids.forEach(fid => pool.push(fid)));
    if (!fut) { const rp = maxRodPower(); const ok = pool.filter(fid => FISH[fid].power <= rp + 1); if (ok.length && r() < 0.88) pool = ok; }
    const existing = new Set(S.orders.map(o => o.fishId)); const p2 = pool.filter(f => !existing.has(f)); if (p2.length) pool = p2;
    const fid = pool[Math.floor(r() * pool.length)]; const f = FISH[fid];
    const lvl = this.relLevel(cust.id);
    const t = opts.fair ? 0.82 + r() * 0.18 : Math.pow(r(), 1 / (1 + 0.6 * lvl));
    const bonus = clamp(lerp(cust.bonus_range[0], cust.bonus_range[1], t), CFG.orders.bonus_min, CFG.orders.bonus_max);
    const unitPrice = roundHalfUp(f.base_price * (1 + bonus));
    let qty = Math.max(2, Math.round(lerp(0.5, 2.6, r()) * 520 / (f.base_price + 22)));
    if (r() < 0.12) qty = Math.max(qty * 4, 50);
    qty = Math.min(qty, 120);
    const dur = opts.duration || CFG.orders.durations_days[Math.floor(r() * CFG.orders.durations_days.length)];
    const o = { id: 'o' + S.orderSeq, customerId: cust.id, fishId: fid, requestedTotal: qty, delivered: 0, unitPrice, bonus: round2(bonus), createdDay: day, expiresAtDayExclusive: day + dur, future: !!fut, tag: opts.tag || null };
    S.orderSeq++; return o;
  },
  refresh(day, ev) {
    S.orders = S.orders.filter(o => o.expiresAtDayExclusive > day && o.delivered < o.requestedTotal);
    const slots = this.slots(); let fc = S.orders.filter(o => o.future).length; let guard = 0;
    while (S.orders.filter(o => !o.tag).length < slots && guard++ < 20) {
      let fut = null;
      if (fc === 0 && hrand('fut', day, S.orderSeq) < 0.22) { const nx = REGIONS.find(x => !S.world.unlocked[x.id]); if (nx) fut = nx.id; }
      S.orders.push(this.gen(day, { future: fut })); if (fut) fc++;
    }
    if (ev && ev.effect === 'extra_fair_order') S.orders.push(this.gen(day, { customerId: 'bahar', fair: true, duration: 1, tag: 'event' }));
    if (ev && ev.effect === 'one_extra_order') S.orders.push(this.gen(day, { duration: 1, tag: 'event' }));
  },
  deliver(oid, n, src) {
    return Tx.run('orderDeliver', () => {
      const o = S.orders.find(x => x.id === oid); if (!o || S.day >= o.expiresAtDayExclusive) return { ok: false, msg: 'İlan geçerli değil.' };
      const rem = this.remaining(o); const have = Inv.count(src, o.fishId); const k = Math.min(n | 0, rem, have);
      if (k <= 0) return { ok: false, msg: have ? 'İlan doldu.' : 'Elinde bu türden balık yok.' };
      const got = Inv.remove(src, o.fishId, k); const inc = got * o.unitPrice;
      o.delivered += got; S.cash += inc;
      const c = S.customers[o.customerId] || (S.customers[o.customerId] = { delivered: 0 }); const before = this.relLevel(o.customerId); c.delivered += got;
      S.stats.ordersDelivered += got; S.stats.orderSales += inc; S.stats.totalSales += inc; S.stats.buyers[o.customerId] = true; S.today.orderIncome += inc;
      if (this.relLevel(o.customerId) > before) Bus.toast(CUST[o.customerId].name + ' ile ilişki seviyesi ' + this.relLevel(o.customerId) + ' oldu!', 'good', 'cust_' + o.customerId);
      Sound.sfx('coin'); return { ok: true, n: got, income: inc };
    });
  }
};

  /* tamamlanan her geçerli manuel atışta çağrılır */
  onCastComplete(spotId, mode) {
    const ev = [];
    if (mode !== 'boat' || !S.boats.active) return ev;
    if (S.auto.dailyDay !== S.day) { S.auto.dailyDay = S.day; S.auto.dailyCaught = 0; }
    const bid = S.boats.active, every = this.every();
    for (const dev of this.mountedOn(bid)) {
      const d = S.auto.devices[dev]; d.counter = Math.min(every, d.counter + 1);
      if (d.counter < every) { ev.push({ dev, type: 'tick' }); continue; }
      const reason = this.blocker(spotId, bid);
      if (reason) { d.paused = reason; ev.push({ dev, type: 'paused', reason }); continue; }
      d.paused = null;
      const bait = this.pickBait(); S.baitStock[bait]--; S.stats.baitUsed++; d.counter = 0; S.auto.attempts++; S.stats.autoAttempts++;
      if (rand() < this.success()) {
        const sel = Selector.weights(spotId, { auto: true, maxPower: this.maxPower(bid), bait });
        let list = sel.list.filter(x => Inv.canPlace(Inv.autoOrder(), x.id));
        const tot = sum(list.map(x => x.w)); list.forEach(x => x.p = x.w / tot);
        const fid = Selector.pick(list); const size = Selector.rollSize(fid);
        const where = Inv.place(Inv.autoOrder(), fid); if (!where) throw new Error('auto place fail');
        const rec = Catch.record(fid, size, true); S.auto.dailyCaught++; S.auto.total++;
        ev.push({ dev, type: 'catch', fid, size, where, rec });
      } else { S.stats.autoFails++; ev.push({ dev, type: 'miss' }); }
    }
    return ev;
  },
  blocker(spotId, bid) {
    if (S.auto.dailyCaught >= CORE.auto_daily_catch_cap) return 'cap';
    const sel = Selector.weights(spotId, { auto: true, maxPower: this.maxPower(bid), bait: 'worm' }); if (!sel.list.length) return 'power';
    if (!this.pickBait()) return 'bait';
    const keys = Inv.autoOrder(); if (!keys.some(k => Inv.hasRoomAny(k)) && !sel.list.some(x => Inv.canPlace(keys, x.id))) return 'full';
    return null;
  },
  reasonTr: { cap: 'Günlük 6 otomatik av sınırı doldu', power: 'Bu noktadaki türler cihaz gücünü aşıyor', bait: 'Ücretli yem yok (temel yem kullanılamaz)', full: 'Depo ve çanta dolu' }

/* =====================================================================
   08_save_audio.js : SaveManager (IndexedDB + localStorage yedeği, şema, sağlama) ve Sound (WebAudio)
   ===================================================================== */
const Save = {
  DBN: 'cozyfishing', ST: 'saves', LS: 'cozyfishing_save_v1', LSB: 'cozyfishing_backup_v1', LSP: 'cozyfishing_prev_v1', SET: 'cozyfishing_settings_v1',
  db: null, suspended: false, timer: 0, lastError: null, storageOk: true,
  init() {
    return new Promise(res => {
      try {
        if (!window.indexedDB) return res(false);
        const rq = indexedDB.open(this.DBN, 1);
        rq.onupgradeneeded = () => { try { rq.result.createObjectStore(this.ST); } catch (e) { } };
        rq.onsuccess = () => { this.db = rq.result; res(true); };
        rq.onerror = () => res(false); rq.onblocked = () => res(false);
        setTimeout(() => res(!!this.db), 1500);
      } catch (e) { res(false); }
    });
  },
  idbGet(key) { return new Promise(res => { if (!this.db) return res(null); try { const t = this.db.transaction(this.ST, 'readonly').objectStore(this.ST).get(key); t.onsuccess = () => res(t.result || null); t.onerror = () => res(null); } catch (e) { res(null); } }); },
  idbPut(key, v) { if (!this.db) return; try { this.db.transaction(this.ST, 'readwrite').objectStore(this.ST).put(v, key); } catch (e) { } },
  lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { this.storageOk = false; return false; } },
  pack(s) { const st = deepClone(s); st.savedAt = Date.now(); const body = JSON.stringify(st); return JSON.stringify({ format: 'cozyfishing-save', schemaVersion: SCHEMA, revision: st.revision, savedAt: st.savedAt, checksum: hash32(body), state: st }); },
  unpack(str) {
    let o; try { o = JSON.parse(str); } catch (e) { return { ok: false, msg: 'Dosya geçerli JSON değil.' }; }
    if (!o || o.format !== 'cozyfishing-save' || !o.state) return { ok: false, msg: 'Bu bir Cozy Fishing kaydı değil.' };
    if (o.schemaVersion > SCHEMA) return { ok: false, msg: 'Kayıt daha yeni bir oyun sürümüne ait.' };
    if (hash32(JSON.stringify(o.state)) !== o.checksum) return { ok: false, msg: 'Kayıt sağlaması tutmuyor (bozuk veya elle değiştirilmiş).', raw: o.state };
    const st = this.migrate(o.state); const errs = this.validate(st);
    if (errs.length) return { ok: false, msg: 'Kayıt doğrulanamadı: ' + errs.slice(0, 3).join('; '), raw: st };
    return { ok: true, state: st };
  },
  migrate(st) {
    const base = newState(st.player);
    const fill = (dst, src) => { for (const k in src) { if (dst[k] === undefined) dst[k] = deepClone(src[k]); else if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && dst[k] && typeof dst[k] === 'object' && !Array.isArray(dst[k])) fill(dst[k], src[k]); } };
    fill(st, base); st.schemaVersion = SCHEMA;
    for (const id of st.boats.owned) { const b = st.boats.byId[id]; if (b) { b.ups = b.ups || {}; b.storage = b.storage || []; b.color = b.color || 'sea_green'; b.name = b.name || ''; } }
    return st;
  },
  validate(st) {
    const e = [];
    const num = (v, n) => { if (typeof v !== 'number' || !isFinite(v)) e.push(n + ' sayı değil'); };
    num(st.day, 'gün'); num(st.cash, 'para'); num(st.energy, 'enerji');
    if (st.day < 1) e.push('gün < 1'); if (st.energy > CORE.daily_energy) e.push('enerji fazla');
    if (!RODS.find(r => r.id === st.gear.rod) || !st.gear.owned.rod.includes(st.gear.rod)) e.push('olta geçersiz');
    if (!(st.bagLevel >= 0 && st.bagLevel < INVC.bag.length)) e.push('çanta seviyesi'); if (!(st.chestLevel >= 0 && st.chestLevel < INVC.home_chest.length)) e.push('sandık seviyesi');
    if (!Array.isArray(st.orders)) e.push('ilanlar');
    for (const id of st.boats.owned) if (!BOAT[id] || !st.boats.byId[id]) e.push('tekne ' + id);
    for (const d in st.auto.devices) { const b = st.auto.devices[d].boat; if (b && !st.boats.owned.includes(b)) e.push('cihaz teknesi'); }
    if (!e.length) { const prev = S; S = st; try { e.push(...Inv.validate(st)); const per = {}; for (const d in st.auto.devices) { const b = st.auto.devices[d].boat; if (b) per[b] = (per[b] || 0) + 1; } for (const b in per) if (per[b] > BOAT[b].slots) e.push('yuva aşımı'); } catch (x) { e.push('iç hata'); } S = prev; }
    return e;
  },
  now() {
    if (this.suspended || !S) return;
    clearTimeout(this.timer); this.timer = 0;
    const json = this.pack(S); this.lsSet(this.LS, json); this.idbPut('main', json);
  },
  soon() { if (this.suspended) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.now(), 400); },
  backup() { if (this.suspended || !S) return; const j = this.pack(S); this.lsSet(this.LSB, j); this.idbPut('backup', j); },
  async readAll() {
    const cands = []; const add = (src, str) => { if (!str) return; const u = this.unpack(str); cands.push(Object.assign({ src, str }, u)); };
    add('idb', await this.idbGet('main')); add('local', this.lsGet(this.LS));
    return cands;
  },
  async loadBest() {
    const c = await this.readAll(); const ok = c.filter(x => x.ok).sort((a, b) => (b.state.revision - a.state.revision) || (b.state.savedAt - a.state.savedAt));
    if (ok.length) return { state: ok[0].state };
    if (c.length) return { error: c[0].msg, raw: c[0].str };
    return { none: true };
  },
  async loadBackup() { const s = (await this.idbGet('backup')) || this.lsGet(this.LSB); if (!s) return null; const u = this.unpack(s); return u.ok ? u.state : null; },
  keepPrevious() { const cur = this.lsGet(this.LS); if (cur) this.lsSet(this.LSP, cur); },
  settings() { const def = { music: 0.5, sfx: 0.8, amb: 0.6, mute: false, comfort: false, reduced: false }; try { return Object.assign(def, JSON.parse(this.lsGet(this.SET) || '{}')); } catch (e) { return def; } },
  saveSettings(o) { this.lsSet(this.SET, JSON.stringify(o)); }
};
let SETTINGS = null;

/* ---------- Sound: tamamen sentezlenmiş özgün sesler ---------- */
const Sound = {
  ctx: null, out: null, gMusic: null, gSfx: null, gAmb: null, noiseBuf: null, mode: 'menu', wx: 'sunny', started: false, nextNote: 0, step: 0, timer: 0, amb: {}, engineOn: false, engine: null,
  start() {
    if (this.started) return; this.started = true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); const c = this.ctx;
      this.out = c.createGain(); this.out.connect(c.destination);
      this.gMusic = c.createGain(); this.gSfx = c.createGain(); this.gAmb = c.createGain();
      [this.gMusic, this.gSfx, this.gAmb].forEach(g => g.connect(this.out));
      const len = c.sampleRate * 2; this.noiseBuf = c.createBuffer(1, len, c.sampleRate); const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.apply(); this.startAmbient(); this.nextNote = c.currentTime + 0.3;
      this.timer = setInterval(() => this.schedule(), 120);
    } catch (e) { this.ctx = null; }
  },
  apply() { if (!this.ctx) return; const s = SETTINGS; const t = this.ctx.currentTime; this.out.gain.setTargetAtTime(s.mute ? 0 : 1, t, 0.05); this.gMusic.gain.setTargetAtTime(s.music * 0.35, t, 0.1); this.gSfx.gain.setTargetAtTime(s.sfx * 0.6, t, 0.05); this.gAmb.gain.setTargetAtTime(s.amb * 0.5, t, 0.2); },
  suspend(v) { if (!this.ctx) return; try { v ? this.ctx.suspend() : this.ctx.resume(); } catch (e) { } },
  tone(f, dur, type, vol, when, slide, dest) {
    const c = this.ctx; if (!c) return; const t = when || c.currentTime; const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.gSfx); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, freq, type, vol, when, q, slide, dest) {
    const c = this.ctx; if (!c) return; const t = when || c.currentTime; const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.setValueAtTime(freq, t); if (slide) f.frequency.exponentialRampToValueAtTime(slide, t + dur); f.Q.value = q || 1;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.gSfx); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  },
  sfx(n) {

/* =====================================================================
   09_fishing.js : FishingController — açık durum makinesi
   READY → CHARGING → CAST_FLYING → WAITING → BITE_WINDOW → QUICK_PULL/REELING → CATCH_RESULT → READY

  phase: 'READY', ctx: null, t: 0, power: 0, holding: false, band: null,
  bob: null, fx: [], rip: [], fishPos: null, msg: null, msgT: 0, autoQ: [], params: null, jump: null, lastOutcome: null,
  attach(ctx) {

  },
  detach() { this.ctx = null; this.holding = false; if (this.phase !== 'STORAGE_DECISION') this.phase = 'READY'; this.bob = null; this.fishPos = null; this.jump = null; },
  busy() { return !['READY'].includes(this.phase); },
  locked() { return ['CHARGING', 'CAST_FLYING', 'WAITING', 'BITE_WINDOW', 'QUICK_PULL', 'REELING', 'CATCH_RESULT', 'STORAGE_DECISION'].includes(this.phase); },
  say(m, d) { this.msg = m; this.msgT = d || 2.2; },
  canCast(atRelease) {

    const rod = rodOf();
    if (S.energy < rod.energy) return { ok: false, code: 'energy', msg: 'Enerjin yetmiyor (' + S.energy + '/' + rod.energy + '). Eve dönüp uyuyarak yeni güne başlayabilirsin.' };
    if (S.gear.bait !== 'basic' && !(S.baitStock[S.gear.bait] > 0)) return { ok: false, code: 'bait', msg: BAIT[S.gear.bait].name + ' bitti. Ücretsiz temel yeme geçebilirsin.' };
    if (this.ctx && this.ctx.moving && this.ctx.moving()) return { ok: false, code: 'moving', msg: 'Tekne hareket halindeyken olta atılamaz.' };
    if (this.ctx && this.ctx.atSpot && !this.ctx.atSpot()) return { ok: false, code: 'spot', msg: 'Bir av noktasında dur (şamandıralı alan).' };

    if (!sel.list.length) { const need = Math.min(...Object.keys(SPOTS[this.ctx.spotId()].weights).map(f => FISH[f].power)) - 1; return { ok: false, code: 'power', msg: 'Oltan bu noktadaki balıklar için çok zayıf. En az güç ' + need + ' olta gerekli.' }; }

  },
  /* ---- giriş ---- */
  press() {

      }
      case 'BITE_WINDOW': this.hook(); break;
      case 'QUICK_PULL': case 'REELING': this.holding = true; break;

    }
  },
  release() {
    if (this.phase === 'CHARGING') this.releaseCast();

  },
  cancel() {
    if (this.phase === 'CHARGING') { this.phase = 'READY'; S.stats.cancels++; this.say('Atış iptal edildi (ücretsiz).', 1.5); }

  },
  giveUp() { if (this.phase === 'WAITING') this.finish('NO_BITE', 'Misinayı topladın.'); },
  releaseCast() {

    const spotId = this.ctx.spotId(), mode = this.ctx.mode;
    const r = Tx.run('cast', () => {

    });

  },
  hook() {
    const f = FISH[S.pendingCast.fish];

    this.surge = { st: 'none', t: 0, next: 1.6 + Math.random() * 2 };
    this.fishPos = { x: this.bob.tx, y: this.ctx.surf + 16, vx: 0 };
    if (f.power <= 1) { this.phase = 'QUICK_PULL'; return; }
    const rod = rodOf(), line = LINES.find(l => l.id === S.gear.line), reel = REELS.find(l => l.id === S.gear.reel), hook = HOOKS.find(l => l.id === S.gear.hook);
    const sz = S.pendingCast.size; const weak = f.power === rod.power + 1; const rid = SPOTS[S.pendingCast.spotId].region_id;
    const wx = S.world.weather[rid]; const ev = World.event(); const hull = this.ctx.mode === 'boat' && S.boats.active ? Boats.stats(S.boats.active).hull : 0;
    const comfort = SETTINGS.comfort ? 1.3 : 1;
    let gain = RC.tension_hold_gain_per_second * (weak ? 1.2 : 1) * (1 + 0.1 * (f.power - 2)) * (1 + 0.15 * sz.t * sz.t) / (1 + line.durability_bonus_pct / 100 * 0.6);

      speed: REEL_SPEED[f.power] * (1 + reel.reel_speed_bonus_pct / 100) * (weak ? 0.8 : 1) / (1 + 0.12 * sz.t),
      breakT: RC.break_after_seconds * (1 + line.durability_bonus_pct / 100 * 0.5) * comfort,

  /* ---- güncelleme ---- */
  update(dt) {

    const b = this.bob;
    switch (this.phase) {
      case 'CHARGING': this.power = clamp(this.t / RC.charge_seconds * 100, 0, 100); break;
      case 'CAST_FLYING': {

        b.x = lerp(b.x0, b.tx, k); b.y = lerp(b.y0, b.ty, k) - Math.sin(k * Math.PI) * (40 + (b.tx - b.x0) * 0.25);

      case 'WAITING': {

        <h4>Kontroller</h4><p>Dokunmatik: düğmeler, binalara dokunarak yürüme. Klavye: ←/→ veya A/D yürü/sür, Boşluk olta at/çek, E veya Enter etkileşim, I envanter, Esc kapat/iptal, 1/2/3 teknede av noktası.</p><h4>İpuçları</h4><p>Şamandıralara dokunarak tekneyi o noktaya sürebilirsin. Navigasyon yükseltmesi av noktasındaki en olası türleri (II. seviyede yüzdeleriyle) gösterir. Ücretli yem bitince oyun otomatik olarak ücretsiz temel yeme geçer.</p>`;

    baitPick() {
      if (Fishing.phase !== 'READY') return;
      this.showModal(`<h3>${img('bait_' + S.gear.bait, 2)} Yem seç</h3><div class="grid3">${BAITS.map(b => `<button class="kv btnlike ${S.gear.bait === b.id ? 'on' : ''}" data-a="baitSet" data-id="${b.id}" ${b.id === 'basic' || S.baitStock[b.id] ? '' : 'disabled'}>${img('bait_' + b.id, 2)}<span>${esc(b.name)}<small class="dim"> ${esc(BAIT_HINT[b.id])}</small></span><b>${b.id === 'basic' ? '∞' : S.baitStock[b.id]}</b></button>`).join('')}</div><p class="dim small">Yem satın almak için Zeynep'in dükkânına uğra.</p><div class="btns"><button class="btn" data-a="mCancel">Kapat</button></div>`);

/* =====================================================================
   12_main.js : Renderer döngüsü, InputManager, ölçekleme/letterbox, görünürlük, tam ekran, açılış, QA paneli
   ===================================================================== */
const cvs = $('screen'); const sctx = cvs.getContext('2d');
const [BUF, G] = mkCanvas(LW, LH);
let SCALE = 1;
function safeInsets() {
  const p = document.getElementById('safeprobe'); if (!p) return { t: 0, r: 0, b: 0, l: 0 };
  const cs = getComputedStyle(p); return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
}
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight; const ins = safeInsets();
  const portrait = vh > vw * 1.08 && Math.min(vw, vh) < 900;
  document.body.classList.toggle('portrait', portrait); Game.portrait = portrait;
  const aw = Math.max(100, vw - ins.l - ins.r), ah = Math.max(100, vh - ins.t - ins.b);
  SCALE = Math.min(aw / LW, ah / LH); const W = Math.floor(LW * SCALE), H = Math.floor(LH * SCALE);
  const fr = $('frame'); fr.style.width = W + 'px'; fr.style.height = H + 'px'; fr.style.left = Math.round(ins.l + (aw - W) / 2) + 'px'; fr.style.top = Math.round(ins.t + (ah - H) / 2) + 'px';
  fr.style.setProperty('--u', SCALE.toFixed(4));
  const dpr = Math.min(3, window.devicePixelRatio || 1); cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr);
  sctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

/* ---- döngü ---- */
let lastTs = performance.now(), lastPhase = null;
function frame(ts) {
  let dt = (ts - lastTs) / 1000; lastTs = ts; if (!(dt > 0)) dt = 0; dt = Math.min(dt, 0.05);
  const paused = Game.paused || Game.portrait || document.hidden;
  try {
    if (!paused && Game.scene) { Game.t += dt; Game.scene.update(dt); }
    G.setTransform(1, 0, 0, 1, 0, 0); G.globalAlpha = 1; G.imageSmoothingEnabled = false; G.fillStyle = '#100c18'; G.fillRect(0, 0, LW, LH);
    if (Game.scene) Game.scene.render(G, paused ? 0 : dt);
    if (Game.fade > 0) { G.globalAlpha = Game.fade; G.fillStyle = '#100c18'; G.fillRect(0, 0, LW, LH); G.globalAlpha = 1; Game.fade = Math.max(0, Game.fade - dt * 3.5); }
    sctx.imageSmoothingEnabled = false; sctx.drawImage(BUF, 0, 0, cvs.width, cvs.height);
  } catch (e) { console.error(e); if (!Game._errShown) { Game._errShown = true; UI.toastNow('Bir çizim hatası oluştu: ' + e.message, 'warn'); } }
  UI.pump();
  if (Fishing.phase !== lastPhase) { lastPhase = Fishing.phase; UI.fishBarUpdate(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Game.paused = true; Fishing.holding = false; if (S) Save.now(); Sound.suspend(true); }
  else { Game.paused = false; lastTs = performance.now(); Sound.suspend(false); }
});
window.addEventListener('pagehide', () => { if (S) Save.now(); });
window.addEventListener('blur', () => { Fishing.holding = false; if (Fishing.phase === 'CHARGING') Fishing.cancel(); });

/* ---- giriş ---- */
const Input = {
  ptr: null,
  toLogical(e) { const r = cvs.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * LW, (e.clientY - r.top) / r.height * LH]; },
  init() {
    cvs.addEventListener('pointerdown', e => {
      e.preventDefault(); Sound.start(); if (UI.modalOpen()) return;
      const [x, y] = this.toLogical(e);
      if (['BITE_WINDOW', 'REELING', 'QUICK_PULL'].includes(Fishing.phase) && Fishing.ctx) { this.ptr = e.pointerId; Fishing.press(); try { cvs.setPointerCapture(e.pointerId); } catch (x2) { } return; }
      const sc = Game.scene; if (!sc || !sc.tap) return;
      if (Game.sceneName === 'Town') sc.tap(x + sc.cam, y); else sc.tap(x, y);
    }, { passive: false });
    const up = e => { if (this.ptr === e.pointerId) { this.ptr = null; Fishing.release(); } };
    cvs.addEventListener('pointerup', up); cvs.addEventListener('pointercancel', up); cvs.addEventListener('lostpointercapture', up);
    document.addEventListener('contextmenu', e => { if (e.target.closest('#frame')) e.preventDefault(); });
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
    document.addEventListener('touchmove', e => { if (!e.target.closest('.scroll') && !e.target.closest('textarea')) e.preventDefault(); }, { passive: false });
    const keyMove = { ArrowLeft: -1, KeyA: -1, ArrowRight: 1, KeyD: 1 };
    window.addEventListener('keydown', e => {
      if (e.target.matches && e.target.matches('input,textarea')) return;
      Sound.start();
      if (e.code === 'F3' || (e.code === 'Backquote' && e.shiftKey)) { e.preventDefault(); QA.enable(); UI.openPanel('Debug'); return; }
      if (e.code === 'Escape') { if (UI.modal) { if (Fishing.phase === 'CATCH_RESULT') UI.A.catchClose.call(UI); else if (Fishing.phase !== 'STORAGE_DECISION') UI.closeModal(); } else if (UI.panel) UI.closePanel(); else if (Fishing.phase === 'CHARGING') Fishing.cancel(); return; }
      if (UI.modalOpen()) return;
      if (e.code === 'Space') { e.preventDefault(); if (!e.repeat && Fishing.ctx) { Fishing.press(); UI.fishBarUpdate(); } return; }
      if (keyMove[e.code] != null && !e.repeat) { const sc = Game.scene; if (Game.sceneName === 'PierFishing') sc.switchSpot(keyMove[e.code]); else if (sc && sc.input) sc.input(keyMove[e.code]); return; }
      if ((e.code === 'KeyE' || e.code === 'Enter') && !e.repeat) { if (Game.sceneName === 'Town') Game.scene.interact(); else if (Game.sceneName === 'Home' && Game.scene.near) Game.scene.act(Game.scene.near); }
      if (e.code === 'KeyI' && S && Game.sceneName !== 'MainMenu') UI.openPanel('Inventory');
      if (e.code === 'Digit1' && Game.sceneName === 'BoatFishing') Game.scene.goSpot(0);
      if (e.code === 'Digit2' && Game.sceneName === 'BoatFishing') Game.scene.goSpot(1);
      if (e.code === 'Digit3' && Game.sceneName === 'BoatFishing') Game.scene.goSpot(2);
    });
    window.addEventListener('keyup', e => {
      if (e.code === 'Space') { if (Fishing.ctx) { Fishing.release(); UI.fishBarUpdate(); } }
      if (keyMove[e.code] != null) { const sc = Game.scene; if (sc && sc.input) sc.input(0); }
    });
  }
};
/* ---- tam ekran ---- */
async function toggleFullscreen() {
  const d = document, el = d.documentElement; const isFs = d.fullscreenElement || d.webkitFullscreenElement;
  try {
    if (!isFs) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen; if (!req) throw new Error('yok');
      await req.call(el); try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch (e) { }
    } else { const ex = d.exitFullscreen || d.webkitExitFullscreen; if (ex) await ex.call(d); }
  } catch (e) {
    UI.confirm({ title: 'Tam ekran açılamadı', icon: 'fullscreen', text: 'Bu tarayıcı ya da gömülü sayfa tam ekrana izin vermiyor. iPhone/iPad Safari\'de Paylaş → "Ana Ekrana Ekle" ile tam ekran oynayabilir ya da telefonu yatay tutarak devam edebilirsin. Masaüstünde F11 de kullanılabilir.', ok: 'Tamam', cancel: 'Kapat' });
  }
  setTimeout(resize, 200);
}

        S.home.decor = { wall: 'tablo_deniz', shelf: 'fener_maket', table: 'cicek', window: null, board: null };
        Ach.check(); const n = Object.keys(S.ach).length; return { ok: n === 36, info: n + '/36' };
      });
      T('13b. 5 NPC × 15 = 75 diyalog; tüm tetikleyiciler tanımlı', () => { let n = 0, bad = []; for (const npc in CFG.npc_dialogues) for (const d of CFG.npc_dialogues[npc]) { n++; if (!NPC_TRIG[d.trigger] && !CFG.weather.types.includes(d.trigger) && !d.trigger.startsWith('day_generic') && d.trigger !== 'generic_after') bad.push(d.trigger); } fresh(); const l = NPCDialog.line('zeynep'); return { ok: n === 75 && !bad.length && Object.keys(CFG.npc_dialogues).length === 5 && l.trigger === 'first_meet', info: n + ' ' + bad.join() }; });
      T('13c. 7 müşterinin ilanı üretilebilir; en fazla 1 gelecek bölge ilanı', () => { fresh(); REGIONS.forEach(r => S.world.unlocked[r.id] = true); const ok = CUSTOMERS.every(c => { const o = Orders.gen(S.day, { customerId: c.id }); return o.customerId === c.id && o.unitPrice >= Math.floor(FISH[o.fishId].base_price * 1.1) && o.bonus <= 0.4; }); fresh(); let maxF = 0; for (let d = 1; d < 60; d++) { S.day = d; Orders.refresh(d, null); maxF = Math.max(maxF, S.orders.filter(o => o.future).length); } return { ok: ok && maxF <= 1, info: 'gelecek ilan ' + maxF }; });
      T('14. Kayıt paketle/aç: para, balık, gün, kıyafet, tekne, ilan, ilişki, rekor, sayaç korunur; bozuk kayıt reddedilir', () => {
        fresh(); S.cash = 1234; S.day = 7; S.player.outfit = 'ekose'; Inv.add('bag', 'kefal', 3); S.boats.owned.push('coastal_skiff'); S.boats.byId.coastal_skiff = { ups: { motor_II: true }, storage: [{ f: 'levrek', q: 2 }], color: 'navy', name: 'MARTI' }; S.boats.active = 'coastal_skiff'; S.customers.bahar = { delivered: 60 }; S.ency.kefal = { caught: 3, maxLen: 44, maxKg: 1.2 }; S.auto.devices.auto1 = { boat: 'coastal_skiff', counter: 2 };
        const j = Save.pack(S); const u = Save.unpack(j); const st = u.state; const ok = u.ok && st.cash === 1234 && st.day === 7 && st.player.outfit === 'ekose' && st.bag[0].q === 3 && st.boats.byId.coastal_skiff.name === 'MARTI' && st.customers.bahar.delivered === 60 && st.ency.kefal.maxLen === 44 && st.auto.devices.auto1.counter === 2 && st.orders.length === S.orders.length;
        const bad = Save.unpack(j.replace('"cash":1234', '"cash":99999')); const bad2 = Save.unpack('{oops'); return { ok: ok && !bad.ok && !bad2.ok, info: bad.msg };
      });
      T('14b. Atomik işlem: çift dokunmada çifte para yok', () => { fresh(); Inv.add('bag', 'kefal', 1); const c = S.cash; Market.sell('kefal', 1, ['bag']); Market.sell('kefal', 1, ['bag']); return S.cash === c + FISH.kefal.base_price; });
      T('15. Ölçekleme: 640×360 oranı korunur', () => { const fr = $('frame'); const w = parseFloat(fr.style.width), h = parseFloat(fr.style.height); return { ok: Math.abs(w / h - 16 / 9) < 0.02, info: w + '×' + h }; });
      T('17. Dış kaynak yok (ağ isteği / uzak URL kullanılmıyor)', () => { const re = new RegExp(['\\bfet' + 'ch\\(', 'XMLHttp' + 'Request', 'htt' + 'ps?:/' + '/', 'Web' + 'Socket', 'import' + 'Scripts'].join('|')); const src = [...document.scripts].map(s => s.textContent).join('\n') + [...document.styleSheets].map(s => { try { return [...s.cssRules].map(r => r.cssText).join(''); } catch (e) { return ''; } }).join(''); return { ok: !re.test(src.replace(/url\(data:[^)]*\)/g, '')) && ![...document.querySelectorAll('[src]')].some(e => !/^(data:|blob:|$)/.test(e.getAttribute('src'))), info: src.length + ' karakter tarandı' }; });
    } finally {
      S = real; Save.suspended = realSusp; this.silent = false; Fishing.autoQ = realQ; Bus.take(); Tx.busy = false;
      if (realCtx) { Fishing.ctx = realCtx; Fishing.phase = realPhase === 'READY' ? 'READY' : 'READY'; } else Fishing.detach();
    }
    return out;
  },
  simFight(fid, holdFn) {
    const ctx = { mode: 'pier', surf: 236, minCast: 40, maxCast: 300, spotId: () => 'koy_derin', tip: () => [200, 200], moving: () => false };
    Fishing.attach(ctx); S.pendingCast = { id: 1, spotId: 'koy_derin', mode: 'pier', band: 'far', bait: 'basic', fish: fid, size: { cm: 40, kg: 1, t: 0.3, cls: 'normal' }, bite: true, wait: 2 };
    Fishing.bob = { x0: 200, y0: 200, x: 400, y: 236, tx: 400, ty: 236, dip: 0 }; Fishing.phase = 'BITE_WINDOW'; Fishing.hook();
    Fishing.surge.next = 1e9; let n = 0;
    while ((Fishing.phase === 'REELING' || Fishing.phase === 'QUICK_PULL') && n++ < 20000) { Fishing.holding = holdFn(); Fishing.update(1 / 60); }
    const ph = Fishing.phase; Fishing.detach(); return ph === 'OUTCOME' ? Fishing.lastOutcome : ph;
  }
};
