:root {
  --ink: #1a1423;
  --wood0: #1e120b;
  --wood1: #3a2416;
  --wood2: #5c3a1e;
  --wood3: #8b5a2b;
  --wood4: #b07a42;
  --parch: #ecdcb2;
  --parch2: #d6bf8a;
  --gold: #f2c14e;
  --light: #f4ead5;
  --good: #6fd36a;
  --bad: #ff6b5e;
  --warn: #f2c14e;
  --sea: #24426b;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #08060c; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
body { font-family: 'Rubik', 'Trebuchet MS', system-ui, sans-serif; color: var(--light); -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased; }

#app { position: fixed; inset: 0; }
#stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 50% 50%; overflow: hidden; background: #120c18; font-size: 24px; line-height: 1.25; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
#ui, #overlay, #bubbles { position: absolute; inset: 0; }
#bubbles { pointer-events: none; z-index: 2; }
#ui { z-index: 3; }
#overlay { z-index: 10; pointer-events: none; }
#overlay > * { pointer-events: auto; }
#overlay > .toasts { pointer-events: none; }

#loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #120c18; color: var(--gold); font-size: 32px; z-index: 100; transition: opacity .5s; text-align: center; }
#loading small { color: var(--light); font-size: 18px; }
#loading.hide { opacity: 0; pointer-events: none; }

/* Döndürme ekranı */
#rotate { position: fixed; inset: 0; z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; background: radial-gradient(circle at 50% 40%, #24426b, #0b1022 70%); color: var(--light); }
#rotate.show { display: flex; }
#rotate h2 { font-size: 22px; margin: 18px 0 6px; color: var(--gold); }
#rotate p { font-size: 15px; margin: 0; opacity: .85; }
.rotIcon { width: 64px; height: 104px; border: 6px solid var(--light); border-radius: 10px; position: relative; animation: rot 2.4s infinite ease-in-out; image-rendering: pixelated; }
.rotIcon::after { content: ''; position: absolute; left: 50%; bottom: 6px; width: 10px; height: 10px; margin-left: -5px; background: var(--light); }
@keyframes rot { 0%, 25% { transform: rotate(0); } 55%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(-90deg); } }

/* İkonlar */
.ic { display: inline-block; width: 30px; height: 30px; background-size: 100% 100%; image-rendering: pixelated; vertical-align: middle; flex: none; }
.ic.big { width: 40px; height: 40px; }
.ic.huge { width: 64px; height: 64px; }

/* Paneller */
.panel { background: rgba(26, 15, 10, 0.9); border: 4px solid var(--wood3); box-shadow: 0 0 0 4px var(--wood0), inset 0 0 0 3px rgba(240, 190, 120, 0.12), 0 8px 0 4px rgba(0, 0, 0, 0.35); }
.panel.thin { padding: 6px 12px; }
.card { background: var(--parch); color: var(--ink); border: 3px solid var(--wood2); box-shadow: inset 0 -4px 0 rgba(120, 80, 40, .25), 0 3px 0 rgba(0, 0, 0, .35); }

/* Butonlar */
.btn, .tab, .iconBtn, .toggle { font-family: inherit; color: var(--light); cursor: pointer; border: 3px solid var(--wood0); background: linear-gradient(180deg, #a06a34, #7a4a22); box-shadow: inset -3px -4px 0 rgba(0, 0, 0, .3), inset 3px 3px 0 rgba(255, 230, 180, .25); font-size: 24px; min-height: 60px; padding: 6px 18px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-shadow: 2px 2px 0 rgba(0, 0, 0, .45); }
.btn:active, .tab:active, .iconBtn:active, .toggle:active, .optCard:active { transform: translateY(2px); box-shadow: inset 3px 3px 0 rgba(0, 0, 0, .35); }
.btn.sm { min-height: 52px; font-size: 21px; padding: 4px 12px; min-width: 76px; }
.btn.big { min-height: 76px; font-size: 30px; padding: 8px 26px; }
.btn.primary { background: linear-gradient(180deg, #e8a63a, #b8742a); color: #2a1406; text-shadow: 1px 1px 0 rgba(255, 230, 170, .5); }
.btn.danger { background: linear-gradient(180deg, #c8463a, #8e2a22); }
.btn.ghost { background: transparent; border-color: var(--wood3); box-shadow: none; }
.btn.locked, .locked { filter: grayscale(.85) brightness(.75); }
.iconBtn { min-width: 64px; padding: 6px; }
button { font-family: inherit; }

/* Durum çubuğu */
.topRow { position: absolute; left: calc(var(--safe-l, 0px) + 16px); right: calc(var(--safe-r, 0px) + 16px); top: calc(var(--safe-t, 0px) + 10px); display: flex; align-items: center; gap: 12px; z-index: 2; }
.statusbar { display: flex; align-items: center; gap: 10px; background: rgba(20, 12, 8, .96); border: 3px solid var(--wood3); padding: 4px 12px; margin-left: auto; box-shadow: 0 0 0 3px var(--wood0); }
.statusbar .stat { display: flex; align-items: center; gap: 4px; font-size: 26px; }
.statusbar .stat.full b { color: var(--warn); }
.hullbar { display: flex; align-items: center; gap: 6px; }
.hullbar .bar { position: relative; width: 170px; height: 26px; background: #2a1810; border: 3px solid var(--wood0); }
.hullbar.big .bar { width: 320px; height: 34px; }
.hullbar .fill { position: absolute; left: 0; top: 0; bottom: 0; transition: width .4s; }
.hullbar .barlabel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; text-shadow: 2px 2px 0 #000; }
.hullbar .cat { font-size: 20px; min-width: 96px; text-shadow: 2px 2px 0 #000; }

/* Item çubuğu */
.itembar { display: flex; align-items: center; gap: 6px; background: rgba(20, 12, 8, .85); border: 3px solid var(--wood3); padding: 6px 8px; box-shadow: 0 0 0 3px var(--wood0); }
.itembar .lbl { font-size: 18px; writing-mode: vertical-rl; transform: rotate(180deg); opacity: .7; }
.islot { position: relative; width: 66px; height: 66px; min-height: 0; padding: 0; display: flex; align-items: center; justify-content: center; background: #2a1810; border: 3px solid var(--wood2); cursor: pointer; }
.islot.empty { border-style: dashed; opacity: .45; }
.islot.r-uncommon { border-color: #5aa6c8; }
.islot.r-rare { border-color: #b98ae8; }
.islot.hl { box-shadow: 0 0 0 3px var(--gold), 0 0 14px var(--gold); animation: pulse 1s infinite; }
.islot .badge { position: absolute; right: 2px; bottom: 0; font-size: 16px; color: var(--gold); text-shadow: 1px 1px 0 #000; }
.islot .badge.uses { color: #d8e6f0; font-variant-numeric: tabular-nums; }
.islot .badge.uses.low { color: #ff8a6a; }
.itembar.compact .islot { width: 58px; height: 58px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px #fff3b0, 0 0 22px var(--gold); } }

/* Etiketler */
.tag, .chip, .catTag, .clsTag { display: inline-flex; align-items: center; gap: 4px; font-size: 18px; padding: 2px 8px; background: rgba(0, 0, 0, .35); border: 2px solid rgba(0, 0, 0, .4); color: var(--light); }
.card .tag { color: var(--ink); background: rgba(90, 58, 30, .15); }
.tag.r-rare { background: #b98ae8; color: var(--ink); }
.tag.r-uncommon { background: #8ac8e8; color: var(--ink); }
.tag.warn, .warnTag { background: #8a3a1a; color: #ffe0a0; }
.tag.gold { background: var(--gold); color: var(--ink); }
.tag.chain { background: #24426b; }
.chip { font-size: 19px; }
.chip.st-contraband, .chip.st-fine { background: #7e2525; }
.chip.st-hero, .chip.st-boom { background: #2f6a2f; }
.chip.st-damaged { background: #6a4a1a; }
.chip.st-pirateRep { background: #2a2a30; }
.clsTag { font-size: 16px; color: var(--ink); border: none; padding: 1px 6px; }

/* Ana menü */
.screen { position: absolute; inset: 0; }
.menu .titleBlock { position: absolute; left: calc(var(--safe-l) + 60px); top: 70px; max-width: 700px; }
.logo { font-size: 92px; margin: 0; color: var(--gold); text-shadow: 5px 5px 0 #6a2a10, 9px 9px 0 rgba(0, 0, 0, .5); letter-spacing: 2px; line-height: 1; font-weight: 600; }
.logo span { font-size: 48px; color: var(--light); }
.tagline { font-size: 24px; max-width: 620px; text-shadow: 2px 2px 0 #000; }
.menuButtons { position: absolute; right: calc(var(--safe-r) + 70px); top: 120px; width: 470px; display: flex; flex-direction: column; gap: 14px; }

/* Liman */

.upGrid { position: absolute; left: calc(var(--safe-l) + 16px); right: calc(var(--safe-r) + 16px); top: 100px; bottom: calc(var(--safe-b) + 36px); display: flex; gap: 10px; overflow-x: auto; }

.statsList { max-width: 700px; }

:{hull:-10,flag:{hostile:!0},next:"CH_X1_RED_4",nextAt:"route"}}},{label:"Hesaplaş",icon:"sword",chance:50,tags:["combat"],win:{text:"Muhafızları geri püskürttün. Kaptan, son karşılaşmanın açık denizde olacağını söyledi.",fx:{flag:{hostile:!0},next:"CH_X1_RED_4",nextAt:"route"}},lose:{text:"Koydan ağır hasarla çıktın.",fx:{hull:-25,flag:{hostile:!0},next:"CH_X1_RED_4",nextAt:"route"}}}]},{id:"CH_X1_RED_4",cat:"chain",chain:"CH_X1_RED_CAPTAIN",step:4,title:"Son Karşılaşma",tags:["pirate","attack"],art:{sky:"dusk",sea:"choppy",obj:["pirateShip"]},text:'Kırmızı yelkenler son kez yaklaştı. Kızıl Kaptan güvertesinde dimdik duruyordu. "Ya borç kapanır, ya biz."',options:[{label:"Kaptanı yen",icon:"cannon",chance:50,tags:["combat"],win:{text:"Son gülle direğini devirdi. Kızıl Kaptan teslim oldu; ambarından 350 altınlık ganimet aldın.",fx:{gold:350,xp:50,...He("CH_X1_RED_CAPTAIN","defeat",{ach:"ACH_X1_NIGHTMARE",rep:{red:-2}})}},lose:{text:"Savaş ikinizi de yordu. Kaptan çekilip gitti; borç kapanmadı ama hikâye bitti.",fx:{hull:-30,...He("CH_X1_RED_CAPTAIN","defeat")}}},{label:"Barış yap (150 altın)",icon:"hand",cost:{gold:150},win:{text:'Gemiler yanaştı; eski borcun bedelini ödedin. Kaptan elini uzattı: "Kardeşliğin önünde bir kez sözün geçer."',fx:{xp:60,...He("CH_X1_RED_CAPTAIN","peace",{ach:"ACH_X1_OLD_DEBTS",rep:{red:1},mem:{redPeace:!0}})}}},{label:"İttifak kur",icon:"flag",req:{cargoGoods:["GOOD_SILK","GOOD_PORCELAIN","GOOD_GOLD_BAR","GOOD_ANTIQUE","GOOD_WINE","GOOD_SPICE"]},hint:"Bir değerli mal verilir",win:{text:'Değerli bir sandığı hediye ettin. Kızıl Kaptan gemisini yanına çekti: "Bu denizlerde bir kez seni ben korurum."',fx:{xp:40,...He("CH_X1_RED_CAPTAIN","alliance",{rep:{red:2},mem:{redAlly:!0},cargoUseValuable:1})}}}]},{id:"CH_X1_SEAL_1",cat:"chain",chain:"CH_X1_GUILD_SEAL",step:1,title:"Mühürlü Boş Sandık",tags:["chest","trade"],art:{sky:"day",sea:"calm",obj:["chest"]},text:"Dalgalar boş ama üzerinde değerli bir lonca mührü taşıyan bir sandık getirdi. Mühür l eder gibi yapıp gizlice imzalı bir sözleşme kopyası aldın.",fx:{flag:{evidence:!0},next:"CH_X1_SEAL_4",nextAt:"route"}},lose:{text:"Fark edildin; konvoy gemileri gövdeni sıkıştırıp hırpaladı.",fx:{hull:-15,flag:{refused:!0},next:"CH_X1_SEAL_4",nextAt:"route"}}}]},{id:"CH_X1_SEAL_4",cat:"chain",chain:"CH_X1_GUILD_SEAL",step:4,title:"Mührün Gerçek Sahibi",tags:["trade"],art:{sky:"day",sea:"calm",obj:["merchantShip","warship"]},text:"Mührün gerçek sahibi yaşıyordu: yıllar önce kendi loncası tarafından ihanete uğrayan yaşlı bir tacir. Şimdi karar senindi.",options:[{label:"Yolsuzluğu ortaya çıkar",icon:"crown",win:{text:"Muhafız gemisi geldi; sahte kayıtları tutanlar zincirlendi. Tacir mührünü geri aldı ve sana loncanın şükran payını verdi.",fx:{gold:250,xp:60,status:"hero",...He("CH_X1_GUILD_SEAL","expose",{ach:"ACH_X1_TRUTH",rep:{crown:1,guild:-1}})}}},{label:"Belgeleri yüksek bedelle sat",icon:"coin",win:{text:"Yolsuz lonca üyeleri belgeler için servet ödedi. Vicdanın biraz ağır, keselerin çok ağır.",fx:{gold:500,xp:35,...He("CH_X1_GUILD_SEAL","sell",{rep:{guild:-2,red:1}})}}},{label:"Loncanın tarafını tut",icon:"compass",win:{text:'Belgeleri loncaya teslim ettin; meseleyi "aile içinde" çözdüler. Teşekkür olarak ticari ayrıcalık verdiler.',fx:{gold:300,xp:45,status:"boom",...He("CH_X1_GUILD_SEAL","guild",{rep:{guild:2}})}}}]},{id:"CH_X1_LIGHT_1",cat:"chain",chain:"CH_X1_LIGHTKEEPER",step:1,title:"Üç Kısa Işık",tags:["fog","lighthouse"],art:{sky:"fog",sea:"calm",obj:["lighthouse"],fx:["fog"]},text:"Sisli bir fenerden üç kısa ışık geldi. Sonra karanlık. Sonra yine üç kısa ışık. Bir yardım çağrısı.",options:[{label:"Işıkla cevap ver",icon:"lantern",win:{text:"Fenerini kaldırıp üç kez yaktın. Uzaktaki ışık bir an dondu… sonra yaklaşman için işaret verdi.",fx:{flag:{answered:!0},next:"CH_X1_LIGHT_2"}}},{label:"Araştır",icon:"eye",tags:["explore"],win:{text:"Dürbünle baktın: fenerin camı kırık, kapısı açıktı.",fx:{xp:10,next:"CH_X1_LIGHT_2"}}},{label:"Uzaklaş",icon:"no",tags:["pass"],win:{text:"Işıklar arkanda kaldı. Belki de bir gün geri dönersin.",fx:{...P1}}}]},{id:"CH_X1_LIGHT_2",cat:"chain",chain:"CH_X1_LIGHTKEEPER",step:2,title:"Terk Edilmiş İskele",tags:["fog","island"],art:{sky:"fog",sea:"calm",obj:["island","lighthouse"],fx:["fog"]},text:"Harap bir iskeleye yanaştın. Kapı aralık, merdivenler yosun tutmuştu. İçeriden bir öksürük sesi geldi.",options:[{label:"Araştır",icon:"boat",chance:70,tags:["explore"],win:{text:"Tayfan kıyıda yürüyüp fenerin dibinde bitkin yaşlı bir bekçi buldu. Yanında son yağ şişesi duruyordu.",fx:{xpExplore:15,flag:{found:!0},next:"CH_X1_LIGHT_3",nextAt:"route"}},lose:{text:"Çürük iskele çöktü; sandal ve gövde zarar gördü. Yine de bekçiye ulaştınız.",fx:{hull:-10,flag:{found:!0},next:"CH_X1_LIGHT_3",nextAt:"route"}}},{label:"Bekle",icon:"anchor",win:{text:"Sabaha kadar beklediniz. Fener hiç yanmadı.",fx:{next:"CH_X1_LIGHT_3",nextAt:"route"}}},{label:"Geri dön",icon:"back",tags:["pass"],win:{text:"Sis çok yoğundu. Geri döndün.",fx:{...P1}}}]},{id:"CH_X1_LIGHT_3",cat:"chain",chain:"CH_X1_LIGHTKEEPER",step:3,title:"Son Nöbet",tags:["fog","lighthouse"],art:{sky:"night",sea:"calm",obj:["island","lighthouse"]},text:"Fener bekçisinin akıbeti belli olmuştu. Fener sönük, bekçi yorgun. Son nöbet senin elindeydi.",options:[{label:"Bekçiyi kurtar",icon:"heart",win:{text:'Bekçiyi gemine aldın. Gözleri dolu dolu, feneri son kez seyretti. "Sen olmasaydın…"',fx:{xp:50,luckBuff:{add:10,events:2},...He("CH_X1_LIGHTKEEPER","rescue",{mysteryChain:!0})}}},{label:"Feneri yeniden çalıştır",icon:"lantern",win:{text:"Tayfan merdivenleri tırmandı, son yağı lambaya döktü. Fener yeniden yandı; ışık sislerin üstünde döndü ve yolları aydınlattı.",fx:{xp:60,reveal:3,codexNote:"lighthouse",...He("CH_X1_LIGHTKEEPER","relight",{ach:"ACH_X1_LIGHT",mysteryChain:!0})}}},{label:"Feneri terk et",icon:"no",win:{text:"Bekçiye erzak bıraktın ve yola çıktın. Arkanda fener karanlıkta kaldı.",fx:{xp:30,...He("CH_X1_LIGHTKEEPER","abandon",{mysteryChain:!0})}}}]},{id:"CH_X1_GROOT_1",cat:"chain",chain:"CH_X1_GROOT_LEGACY",step:1,title:"Tanıdık Çivi",tags:["timber","personal"],needCrew:"CREW_GROOT",altClose:!0,art:{sky:"day",sea:"calm",obj:["timber"]},text:"Denizden çekilen bir kereste parçasında eski bir usta işareti vardı. Groot tahtayı elinde çevirdi; yüzü birden ciddileşti.",options:[{label:"Groot'u dinle",icon:"talk",show:{crew:"CREW_GROOT"},win:{text:'"Bu ustamın işareti," dedi Groot. "Yarım kalan son gemisi… hâlâ bir yerlerde olmalı."',fx:{xp:10,next:"CH_X1_GROOT_2",nextAt:"route"}}},{label:"Tahtayı sakla",icon:"hammer",show:{noCrew:"CREW_GROOT"},win:{text:"İşaretin anlamını bilen kimse gemide değildi. Tahtayı bir köşeye kaldırdın.",fx:{...P1}}}]},{id:"CH_X1_GROOT_2",cat:"chain",chain:"CH_X1_GROOT_LEGACY",step:2,title:"Unutulmuş Atölye",tags:["shipyard","island","personal"],needCrew:"CREW_GROOT",altClose:!0,art:{sky:"overcast",sea:"calm",obj:["island","shipyard"]},text:"Ağaçlarla kaplı bir koyda çürümüş bir tersane duruyordu. Kızakta, yarısı bitmiş bir geminin iskeleti yatıyordu.",options:[{label:"Araştır",icon:"eye",show:{crew:"CREW_GROOT"},win:{text:"Groot kıyıya indi, eski tezgâhları tek tek okşadı. Ustasının alet çantasını buldu.",fx:{xp:10,flag:{tools:!0},next:"CH_X1_GROOT_3",nextAt:"route"}}},{label:"Malzemeleri al",icon:"crate",show:{crew:"CREW_GROOT"},win:{text:"Sağlam keresteleri gemiye taşıdınız.",fx:{hull:15,flag:{took:!0},next:"CH_X1_GROOT_3",nextAt:"route"}}},{label:"Groot'un isteğini yerine getir",icon:"heart",show:{crew:"CREW_GROOT"},win:{text:'Groot bir gece kızağın başında oturmak istedi. Sabah gözleri parlıyordu: "Onu bitirebilirim."',fx:{xp:15,flag:{wish:!0},next:"CH_X1_GROOT_3",nextAt:"route"}}},{label:"Atölyeyi geride bırak",icon:"no",show:{noCrew:"CREW_GROOT"},win:{text:"Groot artık gemide değildi. Atölyeyi uzaktan selamlayıp yola devam ettin.",fx:{...P1}}}]},{id:"CH_X1_GROOT_3",cat:"chain",chain:"CH_X1_GROOT_LEGACY",step:3,title:"Son Çivi",tags:["shipyard","island","personal","re
