apply plugin: 'com.android.application'

// ── Yükleme (upload) anahtarı ─────────────────────────────────────────────────
// Gizli bilgiler depoya GİRMEZ. Öncelik: ortam değişkenleri, yoksa android/keystore.properties (git dışı).
//   TOF_UPLOAD_STORE_FILE, TOF_UPLOAD_STORE_PASSWORD, TOF_UPLOAD_KEY_ALIAS, TOF_UPLOAD_KEY_PASSWORD
// Anahtar yoksa release derlemesi imzasız AAB üretmek yerine açık bir hatayla durur.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }
def signing = [
    storeFile: System.getenv('TOF_UPLOAD_STORE_FILE') ?: keystoreProps['storeFile'],
    storePassword: System.getenv('TOF_UPLOAD_STORE_PASSWORD') ?: keystoreProps['storePassword'],
    keyAlias: System.getenv('TOF_UPLOAD_KEY_ALIAS') ?: keystoreProps['keyAlias'],
    keyPassword: System.getenv('TOF_UPLOAD_KEY_PASSWORD') ?: keystoreProps['keyPassword'],
]
def hasSigning = signing.values().every { it }

android {
    namespace = "com.aygforge.tidesoffortune"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.aygforge.tidesoffortune"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Her Play yüklemesinde versionCode ARTMALI (aynı numara ikinci kez yüklenemez).
        versionCode 2
        versionName "0.1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasSigning) {
                storeFile rootProject.file(signing.storeFile)
                storePassword signing.storePassword
                keyAlias signing.keyAlias
                keyPassword signing.keyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig hasSigning ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// İmzasız release üretme: yükleme anahtarı tanımlı değilse release görevleri açık bir hatayla durur
gradle.taskGraph.whenReady { graph ->
    if (!hasSigning && graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') && (it.name.startsWith('bundle') || it.name.startsWith('assemble')) }) {
        throw new GradleException('Yükleme anahtarı tanımlı değil: android/keystore.properties dosyasını ya da TOF_UPLOAD_* ortam değişkenlerini ayarlayın (bkz. docs/ANDROID.md).')
    }
}
