<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="description" content="Mahjong: Zen Journey — a calm Mahjong Solitaire journey through 500 levels and 20 worlds.">
<title>Mahjong: Zen Journey</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='8' width='38' height='50' rx='7' fill='%23176b4b'/%3E%3Crect x='10' y='4' width='38' height='50' rx='7' fill='%23fbf4e2'/%3E%3Cpath d='M18 22h22M29 12v34M20 30h18v10H20z' stroke='%23c23a2b' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --accent: #2f7f57;
  --accent-2: #3c9a68;
  --ink: #1f2a26;
  --muted: #5d6b63;
  --paper: rgba(255, 251, 242, 0.92);
  --paper-solid: #fffbf2;
  --line: rgba(80, 64, 40, 0.14);
  --gold: #e6b04a;
  --shadow: 0 10px 30px rgba(10, 25, 18, 0.22);
  --r: 18px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --serif: "Palatino Linotype", "Book Antiqua", Palatino, "Noto Serif", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; width: 100%; overflow: hidden;
  background: #10251c; color: var(--ink); font-family: var(--sans);
  overscroll-behavior: none; -webkit-text-size-adjust: 100%;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
svg { display: block; }

#stage { position: fixed; inset: 0; display: flex; justify-content: center; align-items: stretch; overflow: hidden; background: #10251c; }
#stage-bg { position: absolute; inset: -60px; background-size: cover; background-position: center; filter: blur(22px) saturate(1.1) brightness(0.62); transform: scale(1.05); transition: background-image 0.8s; }
#app {
  position: relative; height: 100%; aspect-ratio: 9 / 16; max-width: 100%;
  overflow: hidden; isolation: isolate; box-shadow: 0 0 60px rgba(0, 0, 0, 0.45);
}
@supports not (aspect-ratio: 1) { #app { width: 100%; } }
#bg, #bg-next { position: absolute; inset: 0; background-size: cover; background-position: center bottom; z-index: -2; }
#bg-next { opacity: 0; transition: opacity 0.9s ease; }
#bg-next.show { opacity: 1; }
#ambient { position: absolute; inset: 0; z-index: -1; pointer-events: none; }

/* ---------- screens */
.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  padding: var(--sat) var(--sar) var(--sab) var(--sal);
  opacity: 0; visibility: hidden; transform: translateY(10px) scale(0.99);
  transition: opacity 0.32s ease, transform 0.32s ease, visibility 0s linear 0.32s;
}
.screen.active { opacity: 1; visibility: visible; transform: none; transition: opacity 0.32s ease, transform 0.32s ease, visibility 0s; }
.grow { flex: 1 1 auto; min-width: 0; }
.muted { color: var(--muted); }
.dark .muted { color: rgba(255, 255, 255, 0.7); }

/* ---------- logo */
.logo { text-align: center; color: #fff; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.35); }
.logo-mark { width: 132px; height: 112px; margin: 0 auto 4px; position: relative; }
.logo-mark .enso { position: absolute; inset: -8px 0 0; }
.logo-mark img { position: absolute; width: 50px; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.3)); }
.logo-mark img:nth-of-type(1) { left: 20px; top: 26px; transform: rotate(-12deg); }
.logo-mark img:nth-of-type(2) { left: 62px; top: 20px; transform: rotate(9deg); }
.logo-title { font-family: var(--serif); font-weight: 700; font-size: 40px; letter-spacing: 0.28em; margin: 0; padding-left: 0.28em; line-height: 1.05; }
.logo-sub { font-family: var(--serif); font-style: italic; font-size: 22px; letter-spacing: 0.08em; opacity: 0.95; margin-top: 2px; }
.logo-sub::before, .logo-sub::after { content: ''; display: inline-block; width: 34px; height: 1px; background: currentColor; opacity: 0.6; vertical-align: middle; margin: 0 10px; }

#scr-splash { justify-content: center; align-items: center; background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.15), rgba(0, 0, 0, 0.25)); }
.splash-logo { animation: splashIn 1.1s ease both; }
@keyframes splashIn { from { opacity: 0; transform: translateY(14px) scale(0.96); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.splash-dots { display: flex; gap: 8px; margin-top: 34px; }
.splash-dots i { width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: 0.4; animation: dot 1.2s infinite ease-in-out; }
.splash-dots i:nth-child(2) { animation-delay: 0.15s; } .splash-dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes dot { 50% { opacity: 1; transform: translateY(-4px); } }

/* ---------- buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 0 22px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--paper); color: var(--ink); font-weight: 600; font-size: 16px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16), inset 0 -2px 0 rgba(0, 0, 0, 0.08);
  transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s;
}
.btn > span[data-icon] { width: 20px; height: 20px; }
.btn:active, .tool:active, .icon-btn:active, .chip:active, .level-btn:active, .world-card:active { transform: scale(0.95); }
.btn.primary { background: linear-gradient(180deg, var(--accent-2), var(--accent)); color: #fff; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25), inset 0 -3px 0 rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
.btn.big { min-height: 58px; font-size: 19px; width: 100%; }
.btn.ghost { background: rgba(255, 251, 242, 0.82); }
.btn.round { flex-direction: column; gap: 3px; width: 86px; height: 72px; border-radius: 20px; padding: 0; font-size: 12px; }
.btn.round small { font-size: 12px; font-weight: 600; }
.btn.danger { background: #b9473a; color: #fff; }
.btn.small { min-height: 42px; font-size: 14px; padding: 0 16px; }
.btn:disabled { filter: grayscale(0.6) opacity(0.6); }
.icon-btn {
  width: 46px; height: 46px; flex: none; border: 0; border-radius: 14px; cursor: pointer;
  background: rgba(255, 251, 242, 0.88); color: var(--ink); display: grid; place-items: center; padding: 11px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.16); transition: transform 0.12s;
}
.chip { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px 0 7px; border-radius: 999px; border: 0; background: rgba(255, 251, 242, 0.9); font-size: 12px; font-weight: 700; cursor: pointer; }
.chip span[data-icon] { width: 16px; height: 16px; }
.star-ico { width: 18px; height: 18px; color: var(--gold); display: inline-block; }

/* ---------- topbars */
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 12px 6px; }
.topbar .title { margin: 0; font-family: var(--serif); font-size: 22px; color: #fff; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); text-align: center; }
.title-stack { text-align: center; color: #fff; }
.title-stack .title { font-size: 21px; }
.title-stack .muted { color: rgba(255, 255, 255, 0.85); font-size: 13px; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4); }
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 6px 14px 18px; touch-action: pan-y; }

/* ---------- menu */
.menu-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 0 24px 22px; max-width: 460px; width: 100%; margin: 0 auto; }
.menu-card { background: var(--paper); border-radius: var(--r); padding: 14px 16px 12px; box-shadow: var(--shadow); }
.menu-progress { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.menu-progress .label { display: block; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.menu-progress b { font-family: var(--serif); font-size: 30px; margin-right: 8px; }
.menu-stars { display: flex; align-items: center; gap: 4px; }
.menu-stars b { font-size: 22px; margin: 0; }
.bar { height: 8px; border-radius: 99px; background: rgba(0, 0, 0, 0.08); overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--accent-2), var(--gold)); transition: width 0.5s ease; }
.bar.thin { height: 5px; margin-top: 5px; background: rgba(255, 255, 255, 0.22); }
.menu-actions { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
.menu-row { display: flex; justify-content: space-between; gap: 10px; margin-top: 4px; }
.menu-row .btn.round { flex: 1; }

/* ---------- world map */
#world-list { display: flex; flex-direction: column; gap: 14px; }
.world-card {
  position: relative; display: flex; align-items: stretch; min-height: 112px; border-radius: 20px; overflow: hidden; cursor: pointer;
  background: var(--paper); box-shadow: var(--shadow); border: 0; padding: 0; text-align: left; transition: transform 0.12s;
}
.world-thumb { width: 104px; flex: none; background-size: cover; background-position: center bottom; position: relative; }
.world-thumb .wn { position: absolute; left: 8px; top: 8px; font: 700 12px var(--sans); color: #fff; background: rgba(0, 0, 0, 0.35); border-radius: 99px; padding: 2px 8px; }
.world-info { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.world-info h3 { margin: 0; font-family: var(--serif); font-size: 19px; }
.world-info p { margin: 0; font-size: 13px; color: var(--muted); }
.world-meta { margin-top: auto; display: flex; gap: 14px; font-size: 13px; font-weight: 700; align-items: center; }
.world-meta span { display: inline-flex; align-items: center; gap: 4px; }
.world-meta .star-ico { width: 15px; height: 15px; }
.world-card.locked { filter: saturate(0.25); }
.world-card.locked .world-thumb::after { content: ''; position: absolute; inset: 0; background: rgba(20, 25, 22, 0.45); }
.world-lock { position: absolute; right: 12px; top: 12px; width: 30px; height: 30px; padding: 6px; border-radius: 50%; background: rgba(0, 0, 0, 0.55); color: #fff; }
.world-card.complete::before { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 3px var(--gold); pointer-events: none; }
.world-card.current { box-shadow: var(--shadow), 0 0 0 3px rgba(255, 255, 255, 0.9); }

/* ---------- level grid */
.level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 440px; margin: 8px auto 0; }
.level-btn {
  position: relative; aspect-ratio: 0.8; border: 0; border-radius: 14px; cursor: pointer; padding: 0;
  background: linear-gradient(160deg, #fffdf6, #efe4cb); box-shadow: 4px 5px 0 #1d6a4b, 0 8px 14px rgba(0, 0, 0, 0.25);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; transition: transform 0.12s;
  min-height: 56px;
}
.level-btn b { font-family: var(--serif); font-size: 21px; line-height: 1; }
.level-btn .lstars { display: flex; gap: 1px; }
.level-btn .lstars span { width: 12px; height: 12px; color: rgba(0, 0, 0, 0.14); }
.level-btn .lstars span.on { color: var(--gold); }
.level-btn.locked { background: linear-gradient(160deg, #d9d4c8, #bdb7a9); box-shadow: 4px 5px 0 #5d6b63, 0 6px 12px rgba(0, 0, 0, 0.2); color: #6d6a62; }
.level-btn.locked .lk { width: 18px; height: 18px; }
.level-btn.final { grid-column: span 5; aspect-ratio: auto; height: 76px; flex-direction: row; gap: 14px; background: linear-gradient(160deg, #fff6dc, #f1d58f); box-shadow: 4px 5px 0 #9a6a1a, 0 8px 16px rgba(0, 0, 0, 0.28); }
.level-btn.final .ft { font: 700 12px var(--sans); letter-spacing: 0.18em; color: #8a5a12; }
.level-btn.final.locked { background: linear-gradient(160deg, #d9d4c8, #bdb7a9); box-shadow: 4px 5px 0 #5d6b63; }
.level-btn.next { animation: glowPulse 1.8s ease-in-out infinite; }
@keyframes glowPulse { 50% { box-shadow: 4px 5px 0 #1d6a4b, 0 0 0 4px rgba(255, 255, 255, 0.85), 0 8px 18px rgba(0, 0, 0, 0.3); } }
.level-btn .fam { font-size: 9px; color: var(--muted); max-width: 92%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* ---------- game screen */
.hud { display: flex; align-items: center; gap: 10px; padding: 8px 10px 4px; }
.hud-title { text-align: center; color: #fff; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.45); background: rgba(16, 32, 24, 0.42); border-radius: 16px; padding: 5px 10px 7px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.hud-level { font-family: var(--serif); font-weight: 700; font-size: 19px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.hud-world { font-size: 12px; opacity: 0.92; letter-spacing: 0.04em; }
.final-tag { font: 800 10px var(--sans); letter-spacing: 0.14em; background: var(--gold); color: #4a3000; border-radius: 99px; padding: 2px 7px; text-shadow: none; }
.hud .bar.thin { max-width: 200px; margin: 5px auto 0; }
.hud-sub { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 36px; flex: none; font-size: 12px; color: #fff; flex-wrap: nowrap; }
.hud-stat { display: inline-flex; align-items: baseline; gap: 6px; background: rgba(16, 32, 24, 0.42); border-radius: 99px; padding: 4px 11px; white-space: nowrap; }
.hud-stat > span + span::before { content: '·'; margin-right: 6px; opacity: 0.7; }
.hud-sub b { font-size: 14px; }
.dot-sep { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: 0.6; }
.warn { background: rgba(170, 60, 40, 0.85); border-radius: 99px; padding: 3px 9px; font-weight: 600; font-size: 11px; text-shadow: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: fadeIn 0.4s; min-width: 0; }
#board-wrap { position: relative; flex: 1; min-height: 0; margin: 0 6px; border-radius: 22px; overflow: hidden; touch-action: none; }
#board-wrap::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.06) 60%, rgba(0, 0, 0, 0.0) 100%); pointer-events: none; }
.dark #board-wrap::before { background: radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.03) 60%, rgba(0, 0, 0, 0) 100%); }
#board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
.toolbar { display: flex; justify-content: space-around; gap: 6px; padding: 8px 10px 10px; }
.tool {
  position: relative; flex: 1; max-width: 76px; min-height: 60px; border: 0; border-radius: 18px; cursor: pointer;
  background: var(--paper); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2), inset 0 -2px 0 rgba(0, 0, 0, 0.07);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; transition: transform 0.12s; padding: 6px 0;
}
.tool span[data-icon] { width: 24px; height: 24px; color: var(--accent); }
.tool small { font-size: 11px; font-weight: 700; color: var(--ink); }
.tool:disabled { opacity: 0.5; }
.tool .badge { position: absolute; top: 4px; right: 8px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font: 700 10px/18px var(--sans); }

/* ---------- coach marks */
#coach { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); width: min(92%, 380px); z-index: 5; pointer-events: auto; }
.coach-card { display: flex; align-items: center; gap: 12px; background: rgba(255, 251, 242, 0.96); border-radius: 16px; padding: 10px 12px 10px 10px; box-shadow: var(--shadow); animation: coachIn 0.4s ease both; font-size: 14px; line-height: 1.35; }
.coach-card .hand { width: 34px; height: 34px; flex: none; color: var(--accent); animation: tapHand 1.2s ease-in-out infinite; }
.coach-card .x { margin-left: auto; width: 32px; height: 32px; border: 0; background: transparent; padding: 7px; color: var(--muted); cursor: pointer; flex: none; }
@keyframes coachIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes tapHand { 50% { transform: translateY(-4px) scale(0.94); } }
.tool.coach-target { animation: toolPulse 1.2s ease-in-out infinite; }
@keyframes toolPulse { 50% { box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.95), 0 0 22px 6px rgba(255, 210, 110, 0.8); } }

/* ---------- modals */
#modal-root { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
.modal-back { position: absolute; inset: 0; background: rgba(10, 20, 16, 0.5); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px); pointer-events: auto; animation: fadeIn 0.22s ease both; }
.modal { width: 100%; max-width: 400px; max-height: 100%; overflow-y: auto; background: var(--paper-solid); border-radius: 26px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4); padding: 22px 20px 20px; animation: popIn 0.3s cubic-bezier(.2, 1.3, .4, 1) both; text-align: center; overscroll-behavior: contain; }
.modal h2 { margin: 0 0 6px; font-family: var(--serif); font-size: 26px; }
.modal p { margin: 6px 0; color: var(--muted); line-height: 1.45; font-size: 15px; }
.modal .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.modal .actions.row { flex-direction: row; }
.modal .actions.row .btn { flex: 1; padding: 0 10px; }
.modal-head { display: flex; align-items: center; gap: 8px; margin: -6px -6px 10px; }
.modal-head h2 { flex: 1; margin: 0; }
.modal-head .icon-btn { box-shadow: none; background: rgba(0, 0, 0, 0.05); }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes popIn { from { opacity: 0; transform: scale(0.9) translateY(12px); } }
.modal-back.closing { animation: fadeOut 0.18s ease both; }
@keyframes fadeOut { to { opacity: 0; } }

.win-stars { display: flex; justify-content: center; gap: 8px; margin: 10px 0 6px; }
.win-stars span { width: 58px; height: 58px; color: rgba(0, 0, 0, 0.1); transform: scale(0.4); opacity: 0.2; transition: transform 0.4s cubic-bezier(.2, 1.6, .4, 1), opacity 0.3s, color 0.3s; }
.win-stars span:nth-child(2) { width: 70px; height: 70px; margin-top: -10px; }
.win-stars span.on { color: var(--gold); transform: scale(1); opacity: 1; filter: drop-shadow(0 4px 8px rgba(200, 140, 20, 0.5)); }
.win-stars span.off { transform: scale(1); opacity: 1; }
.win-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 4px; }
.win-stats div { background: rgba(0, 0, 0, 0.04); border-radius: 14px; padding: 8px 4px; }
.win-stats b { display: block; font-size: 18px; font-family: var(--serif); }
.win-stats small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
.badge-new { display: inline-block; background: var(--gold); color: #4a3000; font-weight: 800; font-size: 11px; border-radius: 99px; padding: 2px 8px; margin-left: 6px; letter-spacing: 0.08em; }
.final-banner { font: 800 12px var(--sans); letter-spacing: 0.2em; color: #8a5a12; text-transform: uppercase; }

.settings-list { text-align: left; display: flex; flex-direction: column; gap: 4px; }
.set-row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 4px 2px; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row .ico { width: 22px; height: 22px; color: var(--accent); flex: none; }
.set-row label, .set-row .lbl { flex: 1; font-weight: 600; font-size: 15px; }
.set-row small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.switch { position: relative; width: 52px; height: 30px; flex: none; border-radius: 99px; background: #c9c2b2; border: 0; cursor: pointer; transition: background 0.2s; padding: 0; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25); transition: transform 0.2s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }
input[type=range] { flex: 1; accent-color: var(--accent); height: 30px; }
.set-section { margin: 14px 0 4px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 700; text-align: left; }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.btn-grid .btn { padding: 0 8px; font-size: 14px; min-height: 46px; }
.btn-grid .btn span[data-icon] { width: 18px; height: 18px; }
.storage-note { font-size: 12px; color: var(--muted); margin-top: 10px; text-align: left; }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.stats-grid div { background: rgba(0, 0, 0, 0.04); border-radius: 14px; padding: 10px; text-align: left; }
.stats-grid b { display: block; font-family: var(--serif); font-size: 22px; }

<script>

/* ===== core.js ===== */
/*
 * Mahjong: Zen Journey — core engine.
 * Shared by the game (browser) and the dev tools (Node): tile set, geometry,
 * freeness rules, solvers, level codec, layout signatures and the DOM-free
 * GameSession that implements Mahjong Solitaire rules.
 */
(function (root, factory) {
  'use strict';
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.MJCore = api;
}(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const LEVEL_COUNT = 500;
  const WORLD_SIZE = 25;
  const WORLD_COUNT = 20;

  // ---------------------------------------------------------------- tile set
  // Face ids: 0-8 Circles 1-9, 9-17 Bamboo 1-9, 18-26 Characters 1-9,
  // 27-30 Winds (E S W N), 31-33 Dragons (Red Green White),
  // 34-37 Flowers (Plum Orchid Chrysanthemum Bamboo), 38-41 Seasons.
  const FACE_COUNT = 42;
  const CLASS_COUNT = 36;
  const CLASS_FLOWER = 34;
  const CLASS_SEASON = 35;
  const SUITS = [
    { key: 'dots', name: 'Circles', start: 0, count: 9 },
    { key: 'bamboo', name: 'Bamboo', start: 9, count: 9 },
    { key: 'chars', name: 'Characters', start: 18, count: 9 },
    { key: 'wind', name: 'Wind', start: 27, count: 4 },
    { key: 'dragon', name: 'Dragon', start: 31, count: 3 },
    { key: 'flower', name: 'Flower', start: 34, count: 4 },
    { key: 'season', name: 'Season', start: 38, count: 4 }
  ];
  const RANK_NAMES = {
    wind: ['East', 'South', 'West', 'North'],
    dragon: ['Red', 'Green', 'White'],
    flower: ['Plum', 'Orchid', 'Chrysanthemum', 'Bamboo'],
    season: ['Spring', 'Summer', 'Autumn', 'Winter']
  };

  function faceClass(f) { return f < 34 ? f : (f < 38 ? CLASS_FLOWER : CLASS_SEASON); }
  function faceInfo(f) {
    for (const s of SUITS) {
      if (f >= s.start && f < s.start + s.count) {
        const rank = f - s.start;
        const named = RANK_NAMES[s.key];
        const label = named ? named[rank] + ' ' + s.name : s.name + ' ' + (rank + 1);
        return { suit: s.key, rank, label };
      }
    }
    return { suit: 'none', rank: 0, label: '?' };
  }

  const FAMILIES = [
    'Classic Turtle', 'Pyramid', 'Butterfly', 'Pagoda', 'Twin Towers',
    'Spiral', 'Diamond', 'Bridge', 'Lotus', 'Temple',
    'Mountain', 'Crescent', 'Cross', 'Hourglass', 'Dragon',
    'Fortress', 'Wave', 'Four Islands', 'Star', 'Grand Palace'
  ];

  const WORLD_NAMES = [
    'Bamboo Garden', 'Cherry Blossom', 'Autumn Temple', 'Misty Lake', 'Moonlight Garden',
    'Ancient Ruins', 'Lantern Village', 'Cloud Mountains', 'Jade Sanctuary', 'Golden Sands',
    'Lotus Paradise', 'Winter Palace', 'Festival of Lights', 'Starlight Harbor', 'Hidden Valley',
    'Sunken Temple', 'Crimson Canyon', 'Midnight Forest', 'Celestial Garden', "Dragon's Crown"
  ];

  // Difficulty curve from the design brief: [firstLevel, lastLevel, minTiles, maxTiles]
  const TILE_CURVE = [
    [1, 25, 24, 40], [26, 75, 40, 56], [76, 150, 48, 72], [151, 250, 56, 80],
    [251, 350, 64, 88], [351, 450, 72, 96], [451, 500, 80, 96]
  ];
  function tileRange(n) {
    for (const seg of TILE_CURVE) if (n >= seg[0] && n <= seg[1]) return { lo: seg[2], hi: seg[3], seg };
    return { lo: 24, hi: 96, seg: null };
  }

  function levelMeta(n) {
    const world = Math.floor((n - 1) / WORLD_SIZE); // 0-based
    const index = (n - 1) % WORLD_SIZE; // 0-based within world
    return {
      n, world, index,
      worldName: WORLD_NAMES[world],
      isFinal: index === WORLD_SIZE - 1,
      isWorldStart: index === 0,
      isTutorial: n <= 5
    };
  }

  // Board limits (half-tile units). 9 columns x 10 rows keeps tiles large
  // enough on a portrait phone; layouts never exceed it.
  const GRID = { maxCols: 9, maxRows: 10, maxX: 16, maxY: 18, maxZ: 7 };

  // ---------------------------------------------------------------- random
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function fnv1a(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }
  function levelSeed(n) { return fnv1a('mahjong-zen-journey/level/' + n); }
  function shuffleInPlace(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // ---------------------------------------------------------------- geometry
  // A tile at (x, y, z) covers the half-unit cells [x, x+2) x [y, y+2) on layer z.
  function buildGeometry(tiles) {
    const n = tiles.length;
    const above = [], below = [], left = [], right = [], overlaps = [];
    for (let i = 0; i < n; i++) { above.push([]); below.push([]); left.push([]); right.push([]); }
    for (let i = 0; i < n; i++) {
      const a = tiles[i];
      for (let j = i + 1; j < n; j++) {
        const b = tiles[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        if (dy <= -2 || dy >= 2) continue;
        if (a.z === b.z) {
          if (dx === 2) { right[i].push(j); left[j].push(i); }
          else if (dx === -2) { left[i].push(j); right[j].push(i); }
          else if (dx > -2 && dx < 2) overlaps.push([i, j]);
        } else if (dx > -2 && dx < 2) {
          if (b.z > a.z) { above[i].push(j); below[j].push(i); }
          else { above[j].push(i); below[i].push(j); }
        }
      }
    }
    return { n, tiles, above, below, left, right, overlaps, _belowAll: null };
  }

  // Transitive "is somewhere underneath" sets, used to prune impossible pairs.
  function belowAll(geom) {
    if (geom._belowAll) return geom._belowAll;
    const order = geom.tiles.map((t, i) => i).sort((a, b) => geom.tiles[a].z - geom.tiles[b].z);
    const sets = new Array(geom.n);
    for (const i of order) {
      const s = new Set();
      for (const b of geom.below[i]) { s.add(b); for (const bb of sets[b]) s.add(bb); }
      sets[i] = s;
    }
    geom._belowAll = sets;
    return sets;
  }

  // Unit-cell support: every one of the 4 cells under a raised tile must be occupied.
  function checkSupport(tiles) {
    const cells = new Set();
    for (const t of tiles) for (let dx = 0; dx < 2; dx++) for (let dy = 0; dy < 2; dy++) cells.add((t.z * 64 + t.y + dy) * 64 + t.x + dx);
    const bad = [];
    tiles.forEach((t, i) => {
      if (t.z === 0) return;
      for (let dx = 0; dx < 2; dx++) for (let dy = 0; dy < 2; dy++) {
        if (!cells.has(((t.z - 1) * 64 + t.y + dy) * 64 + t.x + dx)) { bad.push(i); return; }
      }
    });
    return bad;
  }

  function layoutBounds(tiles) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, maxZ = 0;
    for (const t of tiles) {
      if (t.x < minX) minX = t.x; if (t.y < minY) minY = t.y;
      if (t.x > maxX) maxX = t.x; if (t.y > maxY) maxY = t.y;
      if (t.z > maxZ) maxZ = t.z;
    }
    return { minX, minY, maxX, maxY, maxZ, spanX: maxX - minX + 2, spanY: maxY - minY + 2, layers: maxZ + 1 };
  }

  // ---------------------------------------------------------------- board state
  class BoardState {
    constructor(geom, present) {
      const n = geom.n;
      this.g = geom;
      this.present = new Uint8Array(n);
      this.cover = new Int16Array(n);
      this.lc = new Int16Array(n);
      this.rc = new Int16Array(n);
      this.remaining = 0;
      for (let i = 0; i < n; i++) this.present[i] = present ? (present[i] ? 1 : 0) : 1;
      for (let i = 0; i < n; i++) {
        if (this.present[i]) this.remaining++;
        let c = 0; for (const a of geom.above[i]) c += this.present[a]; this.cover[i] = c;
        c = 0; for (const l of geom.left[i]) c += this.present[l]; this.lc[i] = c;
        c = 0; for (const r of geom.right[i]) c += this.present[r]; this.rc[i] = c;
      }
    }
    isFree(i) {
      return this.present[i] === 1 && this.cover[i] === 0 && (this.lc[i] === 0 || this.rc[i] === 0);
    }
    remove(i) {
      const g = this.g;
      this.present[i] = 0; this.remaining--;
      for (const b of g.below[i]) this.cover[b]--;
      for (const r of g.right[i]) this.lc[r]--;
      for (const l of g.left[i]) this.rc[l]--;
    }
    restore(i) {
      const g = this.g;
      this.present[i] = 1; this.remaining++;
      for (const b of g.below[i]) this.cover[b]++;
      for (const r of g.right[i]) this.lc[r]++;
      for (const l of g.left[i]) this.rc[l]++;
    }
    freeList() {
      const out = [];
      for (let i = 0; i < this.g.n; i++) if (this.isFree(i)) out.push(i);
      return out;
    }
    key() {
      const p = this.present;
      let s = '';
      for (let i = 0; i < p.length; i += 15) {
        let v = 0;
        for (let j = 0; j < 15 && i + j < p.length; j++) if (p[i + j]) v |= 1 << j;
        s += String.fromCharCode(v + 32);
      }
      return s;
    }
  }

  function availablePairs(st, faces) {
    const groups = new Map();
    for (let i = 0; i < st.g.n; i++) {
      if (!st.isFree(i)) continue;
      const c = faceClass(faces[i]);
      let g = groups.get(c);
      if (!g) { g = []; groups.set(c, g); }
      g.push(i);
    }
    const pairs = [];
    for (const g of groups.values()) {
      for (let a = 0; a < g.length; a++) for (let b = a + 1; b < g.length; b++) pairs.push([g[a], g[b]]);
    }
    return pairs;
  }

  // ---------------------------------------------------------------- exact solver
  // Depth-first search over real matching moves with memoised dead states.
  // Safe-move reduction: if every remaining tile of a class is free, removing
  // them first never hurts (removals only free other tiles), so no branching.
  function solveExact(geom, faces, present, opts) {
    const budget = (opts && opts.budget) || 60000;
    const st = new BoardState(geom, present);
    const n = geom.n;
    const cls = new Int16Array(n);
    for (let i = 0; i < n; i++) cls[i] = faceClass(faces[i]);
    const below = belowAll(geom);
    const failed = new Set();
    const path = [];
    let nodes = 0, aborted = false;

  // ------------------------------------------------------------------ flowers & seasons
  function blossom(c, x, y, r, petal, center) {
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
      circle(c, x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.55, r * 0.5, petal);
    }
    circle(c, x, y, r * 0.3, center);
  }
  function leaf(c, x, y, len, w, angle, col) {
    c.save(); c.translate(x, y); c.rotate(angle);
    c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(w, -len * 0.5, 0, -len); c.quadraticCurveTo(-w, -len * 0.5, 0, 0);
    c.fillStyle = col; c.fill(); c.restore();
  }
  function drawFlower(c, k) {
    c.save();
    if (k === 0) { // plum
      c.strokeStyle = '#6b4226'; c.lineWidth = 5; c.lineCap = 'round';
      c.beginPath(); c.moveTo(18, 122); c.quadraticCurveTo(34, 80, 62, 66); c.quadraticCurveTo(76, 56, 80, 30); c.stroke();
      c.lineWidth = 3; c.beginPath(); c.moveTo(44, 86); c.quadraticCurveTo(30, 66, 30, 48); c.stroke();
      blossom(c, 74, 34, 17, '#e86a8d', COL.gold); blossom(c, 30, 46, 14, '#f08fab', COL.gold); blossom(c, 58, 74, 15, '#e0557c', COL.gold);
      circle(c, 22, 100, 4, '#e86a8d'); circle(c, 84, 60, 4, '#f08fab');
    } else if (k === 1) { // orchid
      const g = '#2c8a55';
      c.strokeStyle = g; c.lineWidth = 3.4; c.lineCap = 'round';
      for (const [cx, ex, ey] of [[20, 10, 40], [70, 90, 52], [40, 30, 20], [62, 84, 86]]) { c.beginPath(); c.moveTo(50, 124); c.quadraticCurveTo(cx, 80, ex, ey); c.stroke(); }
      for (let i = 0; i < 5; i++) leaf(c, 54, 58, 26, 9, -1.1 + i * 0.55, i % 2 ? '#9b6dd1' : '#7b4bb3');
      circle(c, 54, 58, 5, COL.gold);
      for (let i = 0; i < 3; i++) leaf(c, 30, 84, 16, 6, -0.6 + i * 0.6, '#b18ae0');
    } else if (k === 2) { // chrysanthemum
      leaf(c, 50, 124, 40, 12, -0.6, COL.green); leaf(c, 50, 124, 36, 11, 0.7, '#2c8a55');
      for (let ring = 0; ring < 2; ring++) {

    }

    index(c, k + 1, COL.red);

  function drawSeason(c, k) {

  function drawFace(c, f) {
    const info = Core.faceInfo(f);
    const k = info.rank;
    switch (info.suit) {
      case 'dots': return drawDots(c, k + 1);

      case 'chars': return drawChar(c, k + 1);
      case 'wind': return drawWind(c, k);

  }

  // ------------------------------------------------------------------ tile sprites
  const TILE_ASPECT = 0.76;
  const DEPTH = 0.1;
  function tileMetrics(W) {
    const H = W / TILE_ASPECT;
    const d = Math.max(2, W * DEPTH);
    const pad = Math.ceil(W * 0.14);
    return { W, H, d, pad, r: W * 0.13, spriteW: W + d + pad * 2, spriteH: H + d + pad * 2 };
  }
  function makeCanvas(w, h) {
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.ceil(w)); cv.height = Math.max(1, Math.ceil(h));
    return cv;
  }
  // Draws one tile (body + face) into ctx with the face's top-left at (0, 0).
  function paintTile(c, m, face, blocked) {
    const { W, H, d, r } = m;
    c.save();
    c.shadowColor = 'rgba(10,20,15,0.38)'; c.shadowBlur = W * 0.16; c.shadowOffsetX = W * 0.05; c.shadowOffsetY = W * 0.08;
    rr(c, d, d, W, H, r); c.fillStyle = '#134a36'; c.fill();
    c.restore();
    // jade back
    let g = c.createLinearGradient(d, d, W + d, H + d);
    g.addColorStop(0, '#3aa57c'); g.addColorStop(1, '#0f5139');
    rr(c, d, d, W, H, r); c.fillStyle = g; c.fill();
    // ivory middle layer
    g = c.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#efe3c4'); g.addColorStop(1, '#cdbb92');
    rr(c, d * 0.5, d * 0.5, W, H, r); c.fillStyle = g; c.fill();
    // face
    g = c.createLinearGradient(0, 0, W * 0.6, H);
    g.addColorStop(0, '#fffdf7'); g.addColorStop(1, '#f2e8d2');
    rr(c, 0, 0, W, H, r); c.fillStyle = g; c.fill();
    c.lineWidth = Math.max(1, W * 0.022); c.strokeStyle = 'rgba(120,96,60,0.55)'; c.stroke();
    // inner bevel
    c.save();
    rr(c, 0, 0, W, H, r); c.clip();
    c.lineWidth = W * 0.05;
    c.strokeStyle = 'rgba(255,255,255,0.9)';
    c.beginPath(); c.moveTo(W * 0.06, H - r); c.lineTo(W * 0.06, r); c.quadraticCurveTo(W * 0.06, H * 0.03, r, H * 0.03); c.lineTo(W - r, H * 0.03); c.stroke();
    c.strokeStyle = 'rgba(160,130,85,0.28)';
    c.beginPath(); c.moveTo(W * 0.96, r); c.lineTo(W * 0.96, H - r); c.quadraticCurveTo(W * 0.96, H * 0.975, W - r, H * 0.975); c.lineTo(r, H * 0.975); c.stroke();
    // symbol
    c.translate(W * 0.08, H * 0.065);
    c.scale(W * 0.84 / 100, H * 0.87 / 132);
    drawFace(c, face);
    c.restore();
    if (blocked) { rr(c, 0, 0, W, H, r); c.fillStyle = 'rgba(42,52,48,0.32)'; c.fill(); }
  }

  class TileAtlas {
    constructor() { this.key = ''; this.cache = new Map(); this.m = null; }
    ensure(W, dpr) {
      const q = Math.max(8, Math.round(W * dpr));
      const key = q + '';
      if (key === this.key) return;
      this.key = key;
      this.cache.clear();
      this.dpr = dpr;
      this.px = q; // tile width in device pixels
      this.m = tileMetrics(q);
    }
    sprite(face, blocked) {
      const k = face * 2 + (blocked ? 1 : 0);
      let s = this.cache.get(k);
      if (!s) {
        const m = this.m;
        s = makeCanvas(m.spriteW, m.spriteH);
        const c = s.getContext('2d');
        c.translate(m.pad, m.pad);
        paintTile(c, m, face, blocked);
        this.cache.set(k, s);
      }
      return s;
    }
  }

  // Standalone tile image (menus, tutorial cards) as a data URL.
  function tileDataURL(face, W) {
    const m = tileMetrics(W);
    const cv = makeCanvas(m.spriteW, m.spriteH);
    const c = cv.getContext('2d');
    c.translate(m.pad, m.pad);
    paintTile(c, m, face, false);
    return cv.toDataURL();
  }

  // ------------------------------------------------------------------ backgrounds (SVG)
  const VW = 400, VH = 720;
  function srng(seed) { return Core.mulberry32(seed); }
  function ridge(rng, y, amp, steps, col, op) {
    let d = `M0 ${VH} L0 ${y}`;
    let px = 0, py = y;
    const n = steps;
    for (let i = 1; i <= n; i++) {
      const x = i * VW / n;
      const ny = y - rng() * amp;
      const cx = (px + x) / 2;
      d += ` Q${cx.toFixed(1)} ${(Math.min(py, ny) - amp * 0.35 * rng()).toFixed(1)} ${x.toFixed(1)} ${ny.toFixed(1)}`;
      px = x; py = ny;
    }
    d += ` L${VW} ${VH} Z`;
    return `<path d="${d}" fill="${col}" opacity="${op || 1}"/>`;
  }
  function peaks(rng, y, h, count, col, op, snow) {
    let s = '';
    for (let i = 0; i < count; i++) {
      const x = (i + 0.5) * VW / count + (rng() - 0.5) * 60;
      const w = 90 + rng() * 120, hh = h * (0.6 + rng() * 0.5);
      s += `<path d="M${x - w} ${y} Q${x - w * 0.3} ${y - hh * 0.6} ${x} ${y - hh} Q${x + w * 0.35} ${y - hh * 0.55} ${x + w} ${y} Z" fill="${col}" opacity="${op || 1}"/>`;
      if (snow) s += `<path d="M${x - w * 0.18} ${y - hh * 0.78} Q${x - w * 0.06} ${y - hh * 0.96} ${x} ${y - hh} Q${x + w * 0.08} ${y - hh * 0.95} ${x + w * 0.2} ${y - hh * 0.76} Q${x + w * 0.05} ${y - hh * 0.82} ${x} ${y - hh * 0.74} Q${x - w * 0.06} ${y - hh * 0.84} ${x - w * 0.18} ${y - hh * 0.78}Z" fill="#fff" opacity="0.85"/>`;
    }
    return s;
  }
  function mist(y, col, op) {
    return `<ellipse cx="${VW * 0.3}" cy="${y}" rx="260" ry="34" fill="${col}" opacity="${op}" filter="url(#blur)"/><ellipse cx="${VW * 0.8}" cy="${y + 26}" rx="220" ry="28" fill="${col}" opacity="${op * 0.8}" filter="url(#blur)"/>`;
  }
  function stars(rng, n, maxY, col) {
    let s = '';
    for (let i = 0; i < n; i++) {
      const r = rng() < 0.1 ? 1.6 : 0.5 + rng() * 0.9;
      s += `<circle cx="${(rng() * VW).toFixed(1)}" cy="${(rng() * maxY).toFixed(1)}" r="${r.toFixed(2)}" fill="${col || '#fff'}" opacity="${(0.4 + rng() * 0.6).toFixed(2)}"/>`;
    }
    return s;
  }
  function orb(x, y, r, col, glow) {
    return `<circle cx="${x}" cy="${y}" r="${r * 2.6}" fill="url(#glow)" opacity="0.7"/><circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/>` + (glow ? `<circle cx="${x}" cy="${y}" r="${r * 1.25}" fill="none" stroke="${col}" stroke-opacity="0.35" stroke-width="3"/>` : '');
  }
  function bambooStalk(x, top, w, col, rng) {
    let s = `<rect x="${x - w / 2}" y="${top}" width="${w}" height="${VH - top}" rx="${w / 2}" fill="${col}"/>`;
    for (let y = top + 40 + rng() * 30; y < VH; y += 60 + rng() * 30) {
      s += `<rect x="${x - w * 0.65}" y="${y}" width="${w * 1.3}" height="${w * 0.28}" rx="${w * 0.14}" fill="${col}" opacity="0.9"/>`;
      if (rng() < 0.5) {
        const dir = rng() < 0.5 ? -1 : 1;
        s += `<path d="M${x} ${y} q${dir * 26} -14 ${dir * 52} -4 q${-dir * 24} 6 ${-dir * 52} 4z" fill="${col}" opacity="0.85"/>`;
      }
    }
    return s;
  }
  function blossomTree(rng, x, y, s, trunk, bloom) {
    let o = `<path d="M${x} ${VH} C${x - 6} ${y + 120} ${x + 10} ${y + 60} ${x} ${y}" stroke="${trunk}" stroke-width="${10 * s}" fill="none" stroke-linecap="round"/>`;
    for (let i = 0; i < 4; i++) {
      const a = -Math.PI / 2 + (rng() - 0.5) * 2.2;
      const len = 60 * s + rng() * 40 * s;
      const ex = x + Math.cos(a) * len, ey = y + Math.sin(a) * len * 0.7;
      o += `<path d="M${x} ${y + 10} Q${(x + ex) / 2} ${ey + 20} ${ex} ${ey}" stroke="${trunk}" stroke-width="${4 * s}" fill="none" stroke-linecap="round"/>`;
      for (let k = 0; k < 7; k++) o += `<circle cx="${(ex + (rng() - 0.5) * 50 * s).toFixed(1)}" cy="${(ey + (rng() - 0.5) * 34 * s).toFixed(1)}" r="${(10 + rng() * 14) * s}" fill="${bloom[k % bloom.length]}" opacity="0.9"/>`;
    }
    return o;
  }
  function pagodaSil(x, y, s, col) {
    let o = '';
    for (let i = 0; i < 4; i++) {
      const w = (70 - i * 14) * s, yy = y - i * 30 * s;
      o += `<rect x="${x - w * 0.32}" y="${yy - 20 * s}" width="${w * 0.64}" height="${20 * s}" fill="${col}"/>`;
      o += `<path d="M${x - w / 2 - 10 * s} ${yy - 18 * s} Q${x} ${yy - 34 * s} ${x + w / 2 + 10 * s} ${yy - 18 * s} L${x + w / 2} ${yy - 22 * s} L${x - w / 2} ${yy - 22 * s}Z" fill="${col}"/>`;
    }
    o += `<rect x="${x - 1.5 * s}" y="${y - 150 * s}" width="${3 * s}" height="${30 * s}" fill="${col}"/>`;
    return o;
  }
  function roofLine(x, y, w, col) {
    return `<path d="M${x - w / 2 - 14} ${y} Q${x} ${y - 26} ${x + w / 2 + 14} ${y} L${x + w / 2} ${y - 6} L${x - w / 2} ${y - 6}Z" fill="${col}"/><rect x="${x - w / 2 + 6}" y="${y}" width="${w - 12}" height="${VH - y}" fill="${col}"/>`;
  }
  function lantern(x, y, r, col) {
    return `<line x1="${x}" y1="${y - r * 1.6}" x2="${x}" y2="${y - r}" stroke="#2a1a1a" stroke-width="1.2"/><circle cx="${x}" cy="${y}" r="${r * 2.4}" fill="url(#glow)" opacity="0.8"/><ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * 1.2}" fill="${col}"/><rect x="${x - r * 0.5}" y="${y + r * 1.1}" width="${r}" height="${r * 0.3}" fill="#5a2a1a"/>`;
  }
  function pine(x, y, h, col) {
    const w = h * 0.36;
    let s = '';
    for (let i = 0; i < 4; i++) {
      const yy = y - i * h * 0.22, ww = w * (1 - i * 0.2);
      s += `<path d="M${x - ww} ${yy} L${x} ${yy - h * 0.38} L${x + ww} ${yy}Z" fill="${col}"/>`;
    }
    return s + `<rect x="${x - h * 0.03}" y="${y}" width="${h * 0.06}" height="${h * 0.1}" fill="${col}"/>`;
  }

  function scene(w, rng) {
    const [h1, h2, h3] = w.hill;
    let s = '';
    switch (w.scene) {
      case 'bamboo':
        s += orb(300, 140, 34, '#fffbe6') + ridge(rng, 420, 60, 5, h1, 0.7) + mist(430, '#fff', 0.5) + ridge(rng, 520, 50, 6, h2, 0.8);
        for (let i = 0; i < 5; i++) s += bambooStalk(10 + i * 22 + rng() * 10, 60 + rng() * 120, 9 + rng() * 5, i % 2 ? '#3f8f5e' : '#2f744b', rng);
        for (let i = 0; i < 5; i++) s += bambooStalk(VW - 10 - i * 22 - rng() * 10, 60 + rng() * 120, 9 + rng() * 5, i % 2 ? '#3f8f5e' : '#2f744b', rng);
        s += ridge(rng, 640, 30, 4, h3, 1);
        break;
      case 'sakura':
        s += orb(90, 130, 30, '#fff4f0') + ridge(rng, 430, 70, 4, h1, 0.6) + mist(440, '#fff', 0.45) + ridge(rng, 540, 40, 5, h2, 0.7);
        s += blossomTree(rng, 40, 240, 1.2, '#6d3b4a', ['#f7b6c8', '#f28fae', '#fbd3df']) + blossomTree(rng, VW - 30, 200, 1.1, '#6d3b4a', ['#f7b6c8', '#ffd6e2', '#ee86a6']);
        s += ridge(rng, 650, 24, 4, h3, 1);
        break;
      case 'autumn':
        s += orb(280, 150, 38, '#fff1d4') + ridge(rng, 430, 60, 5, h1, 0.7) + pagodaSil(310, 470, 0.9, h2) + mist(480, '#fde7c8', 0.5);
        s += blossomTree(rng, 30, 260, 1.1, '#5a2e1e', ['#e8742b', '#d9481f', '#f2a23a']) + blossomTree(rng, VW - 20, 300, 0.9, '#5a2e1e', ['#f2a23a', '#e05a24', '#c63a1e']);
        s += ridge(rng, 630, 30, 4, h3, 1);
        break;
      case 'lake': {
        s += orb(200, 170, 32, '#ffffff') + peaks(rng, 430, 160, 3, h1, 0.6) + peaks(rng, 440, 110, 4, h2, 0.75);
        s += `<rect x="0" y="440" width="${VW}" height="${VH - 440}" fill="${h3}" opacity="0.55"/>`;
        s += `<g transform="translate(0 880) scale(1 -1)" opacity="0.25">${peaks(srng(7), 440, 110, 4, h2, 1)}</g>`;
        for (let i = 0; i < 8; i++) s += `<rect x="${rng() * VW}" y="${460 + i * 30}" width="${40 + rng() * 80}" height="1.5" fill="#fff" opacity="0.5"/>`;
        s += mist(420, '#fff', 0.7) + mist(560, '#fff', 0.4);
        s += `<path d="M260 600 q30 10 60 0 l-8 8 h-44z" fill="#3a4f58"/><line x1="290" y1="560" x2="290" y2="600" stroke="#3a4f58" stroke-width="2"/>`;
        break;
      }
      case 'moon':
        s += stars(rng, 90, 420) + orb(280, 150, 46, '#f2f0ff', true) + ridge(rng, 480, 60, 5, h1, 0.9) + mist(500, '#9aa6e8', 0.25);
        s += ridge(rng, 580, 40, 6, h2, 1);
        for (const x of [40, 120, 300, 370]) s += lantern(x, 620 - rng() * 30, 7, '#fff2c4');
        s += ridge(rng, 660, 20, 4, h3, 1);
        break;
      case 'ruins':
        s += orb(110, 160, 36, '#fff3dc') + ridge(rng, 440, 60, 5, h1, 0.7) + mist(450, '#f6e8d0', 0.5);
        for (let i = 0; i < 6; i++) {
          const x = 20 + i * 72 + rng() * 20, hgt = 80 + rng() * 140;
          s += `<rect x="${x}" y="${600 - hgt}" width="22" height="${hgt}" fill="${h2}"/><rect x="${x - 5}" y="${600 - hgt}" width="32" height="8" fill="${h2}"/>`;
        }
        s += `<rect x="40" y="420" width="140" height="10" fill="${h2}" opacity="0.8" transform="rotate(-6 110 425)"/>` + ridge(rng, 610, 30, 5, h3, 1);
        break;
      case 'lanterns':
        s += stars(rng, 40, 300, '#ffd9b0') + ridge(rng, 470, 40, 5, h1, 0.9);
        for (let i = 0; i < 4; i++) s += roofLine(50 + i * 100, 520 + rng() * 40, 80, h2);
        for (let row = 0; row < 2; row++) {
          const y0 = 220 + row * 140;
          s += `<path d="M-10 ${y0} Q200 ${y0 + 60} 410 ${y0}" stroke="#2a1520" stroke-width="1.4" fill="none"/>`;
          for (let i = 0; i < 7; i++) { const t = (i + 0.5) / 7; s += lantern(-10 + t * 420, y0 + Math.sin(t * Math.PI) * 44 + 14, 9, i % 2 ? '#ff7a3a' : '#ff4a3a'); }
        }
        s += ridge(rng, 650, 16, 4, h3, 1);
        break;
      case 'peaks':
        s += orb(320, 120, 34, '#fff6e8') + peaks(rng, 520, 300, 3, h1, 0.8, true) + mist(480, '#fff', 0.8) + peaks(rng, 600, 200, 4, h2, 0.9, true) + mist(590, '#fff', 0.9) + mist(660, '#fff', 0.8);
        break;
      case 'jade':
        s += orb(200, 150, 30, '#f2fff8') + ridge(rng, 440, 50, 5, h1, 0.8) + mist(450, '#e8fff4', 0.5);
        s += `<circle cx="200" cy="470" r="120" fill="none" stroke="${h3}" stroke-width="34" opacity="0.85"/><rect x="0" y="560" width="${VW}" height="${VH - 560}" fill="${h3}"/>`;
        s += roofLine(200, 330, 200, h3).replace(/<rect[^>]*\/>/, '');
        break;
      case 'desert':
        s += orb(290, 160, 44, '#fff6d8') + `<path d="M0 470 Q100 420 200 460 T400 450 L400 720 L0 720Z" fill="${h1}"/>`;
        s += pagodaSil(110, 470, 0.7, h2) + `<path d="M0 560 Q120 510 240 560 T400 540 L400 720 L0 720Z" fill="${h2}"/><path d="M0 640 Q140 600 260 650 T400 630 L400 720 L0 720Z" fill="${h3}"/>`;
        break;
      case 'lotus':
        s += orb(110, 140, 30, '#fffafc') + ridge(rng, 420, 50, 5, h1, 0.6) + `<rect x="0" y="450" width="${VW}" height="${VH - 450}" fill="${h2}" opacity="0.6"/>` + mist(450, '#fff', 0.6);
        for (let i = 0; i < 9; i++) {
          const x = rng() * VW, y = 500 + rng() * 200, r = 16 + rng() * 22;
          s += `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * 0.4}" fill="${h3}"/>`;
          if (rng() < 0.6) s += `<path d="M${x - 10} ${y - 4} Q${x - 8} ${y - 22} ${x} ${y - 26} Q${x + 8} ${y - 22} ${x + 10} ${y - 4}Z" fill="#f4a3bf"/><path d="M${x - 4} ${y - 4} Q${x} ${y - 30} ${x + 4} ${y - 4}Z" fill="#fbd0de"/>`;
        }
        break;
      case 'winter':
        s += orb(260, 140, 30, '#ffffff') + peaks(rng, 480, 220, 3, h2, 0.7, true) + mist(470, '#fff', 0.7);
        s += pagodaSil(200, 560, 1.0, '#6f87a6') + `<path d="M140 500 Q200 480 260 500" stroke="#fff" stroke-width="5" fill="none"/>`;
        s += `<rect x="0" y="580" width="${VW}" height="${VH - 580}" fill="#f4f8fc"/>` + ridge(rng, 600, 18, 4, '#e2ecf6', 1);
        break;
      case 'festival':
        s += stars(rng, 40, 400);
        for (let i = 0; i < 4; i++) {
          const cx = 60 + rng() * 280, cy = 110 + rng() * 220, R = 40 + rng() * 40, col = ['#ffcf5a', '#ff6f91', '#7fd6ff', '#b18cff'][i];
          for (let k = 0; k < 18; k++) { const a = k / 18 * Math.PI * 2; s += `<line x1="${cx + Math.cos(a) * R * 0.25}" y1="${cy + Math.sin(a) * R * 0.25}" x2="${cx + Math.cos(a) * R}" y2="${cy + Math.sin(a) * R}" stroke="${col}" stroke-width="2" stroke-linecap="round" opacity="0.8"/>`; }
        }
        s += ridge(rng, 540, 30, 5, h1, 1);
        for (let i = 0; i < 4; i++) s += roofLine(50 + i * 100, 590 + rng() * 30, 80, h2);
        for (let i = 0; i < 10; i++) s += lantern(rng() * VW, 380 + rng() * 160, 5, '#ffb44a');
        break;
      case 'harbor':
        s += stars(rng, 140, 420) + orb(90, 120, 22, '#e9f3ff') + ridge(rng, 470, 40, 5, h1, 1);
        s += `<rect x="0" y="480" width="${VW}" height="${VH - 480}" fill="${h2}"/>`;
        s += `<rect x="330" y="360" width="16" height="120" fill="${h3}"/><path d="M326 360 h24 l-4 -16 h-16z" fill="${h3}"/><path d="M338 352 L0 300 L0 330Z" fill="#fff6c8" opacity="0.12"/><circle cx="338" cy="352" r="6" fill="#fff6c8"/>`;
        for (const [x, y] of [[80, 560], [200, 610], [290, 540]]) s += `<path d="M${x - 30} ${y} h60 l-10 12 h-40z" fill="${h3}"/><line x1="${x}" y1="${y - 50}" x2="${x}" y2="${y}" stroke="${h3}" stroke-width="2"/><path d="M${x} ${y - 48} L${x + 24} ${y - 6} L${x} ${y - 6}Z" fill="#d7e6f7" opacity="0.6"/>`;
        for (let i = 0; i < 14; i++) s += `<rect x="${rng() * VW}" y="${500 + rng() * 200}" width="${20 + rng() * 50}" height="1.4" fill="#cfe6ff" opacity="0.35"/>`;
        break;
      case 'valley':
        s += orb(200, 120, 30, '#fffff2') + `<path d="M0 200 L120 220 L150 720 L0 720Z" fill="${h2}"/><path d="M400 180 L270 230 L250 720 L400 720Z" fill="${h2}"/>`;
        s += `<rect x="168" y="230" width="64" height="420" fill="#e8f6ff" opacity="0.85"/><rect x="180" y="230" width="10" height="420" fill="#fff" opacity="0.8"/>` + mist(640, '#fff', 0.9);
        s += ridge(rng, 650, 30, 5, h3, 1);
        break;

  // Ambient world particles on a background canvas (~30 fps, paused when hidden).
