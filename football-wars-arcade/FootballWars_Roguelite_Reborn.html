<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070b17">
<meta name="mobile-web-app-capable" content="yes">
<title>Football Wars: Roguelite Reborn</title>
<meta name="description" content="FOOTBALL WARS: ROGUELITE REBORN — lead a 100-player Survivor Army through 200 levels of real-time 100 vs N football battles. Survive the waves, draft roguelite cards, unlock five Star Leaders. Single offline HTML file.">
<style>:root{
  --bg:#070b17;--panel:#101a33;--panel2:#15213f;--line:#22325a;--steel2:#8fa8d6;
  --text:#eaf0ff;--dim:#8d9bc0;--mint:#3df2b5;--gold:#ffcf3f;--coral:#ff5a64;--blue:#5ab8ff;--purple:#c77dff;--cyan:#2bd1ff;
  --r:14px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --c-common:#d8dee9;--c-rare:#5ab8ff;--c-epic:#c77dff;--c-legendary:#ffd23f;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.35 var(--sans);overscroll-behavior:none}
body{background:radial-gradient(900px 500px at 50% -180px,#14306e 0%,transparent 60%),radial-gradient(600px 400px at 100% 100%,#0d3640 0%,transparent 60%),var(--bg);touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
.hidden{display:none!important}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-top:var(--sat)}
/* top bar */
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(7,11,23,.94);border-bottom:1px solid var(--line)}
.hq{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;text-align:left;min-height:44px}
.hq .logo{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:900;color:#06121f;background:linear-gradient(135deg,var(--cyan),#3df2b5);flex:none;letter-spacing:-.05em}
.hq .t{min-width:0}.hq b{display:block;font-size:14px;letter-spacing:.06em}
.hq small{display:block;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cur{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.cur i{font-style:normal;width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;color:#1a1200;background:linear-gradient(135deg,#ffe27a,#ffb11f)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:18px;flex:none}
/* screens */
#screen{flex:1;padding:12px 12px calc(86px + var(--sab));outline:none}
h1,h2,h3{margin:0}
.title{font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--steel2);margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
.title .sp{flex:1}
.card{background:linear-gradient(180deg,var(--panel) 0%,#0c1530 100%);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;position:relative}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.dim{color:var(--dim)}.mint{color:var(--mint)}.gold-t{color:var(--gold)}.coral{color:var(--coral)}.cyan{color:var(--cyan)}
.small{font-size:12px}.tiny{font-size:11px}.center{text-align:center}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;border:1px solid var(--line);background:#0b1430;color:var(--steel2);white-space:nowrap}
.pill.mint{border-color:#1b6b52;color:var(--mint)}.pill.gold{border-color:#7a5b10;color:var(--gold)}.pill.coral{border-color:#7a2430;color:#ff98a0}.pill.purple{border-color:#5b2a80;color:var(--purple)}.pill.blue{border-color:#1f4b80;color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:800;letter-spacing:.02em}
.btn.primary{background:linear-gradient(180deg,#3df2b5,#17b383);color:#03150f;border-color:#0f7a59}
.btn.gold{background:linear-gradient(180deg,#ffe27a,#ffb11f);color:#241800;border-color:#a37400}
.btn.danger{background:#3a1220;border-color:#7a2430;color:#ffb3ba}
.btn.block{display:flex;width:100%}
.btn.big{min-height:64px;font-size:20px;letter-spacing:.06em}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns>.btn{flex:1}
.bar{height:8px;border-radius:99px;background:#0a1128;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mint))}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}.kv b{text-align:right}
/* HQ */
.hero{padding:16px;border-radius:18px;background:linear-gradient(160deg,#13306a 0%,#0c1636 60%,#0a2a2c 100%);border:1px solid #2b4a8a;position:relative;overflow:hidden}
.hero .ep{font-size:11px;letter-spacing:.16em;color:var(--cyan);font-weight:900;text-transform:uppercase}
.hero h1{font-size:26px;letter-spacing:.02em;margin:2px 0 6px}
.hero .lv{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.hero .army{position:absolute;right:10px;top:10px;opacity:.9;image-rendering:pixelated}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat3>div{background:#0a1430;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stat3 b{display:block;font-size:18px}.stat3 small{color:var(--dim);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.tip{border:1px dashed #2f6f8f;background:#08202c;border-radius:12px;padding:10px 36px 10px 12px;margin-bottom:10px;position:relative;font-size:13px}
.tip b{display:block;color:var(--cyan);margin-bottom:2px}
.tip .x{position:absolute;right:4px;top:4px;width:36px;height:36px;border:0;background:none;color:var(--dim);font-size:16px}
/* Map */
.eps{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.eps::-webkit-scrollbar{display:none}
.eps button{flex:none;min-width:48px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:900}
.eps button.on{background:var(--cyan);color:#04121c;border-color:var(--cyan)}.eps button.lock{opacity:.45}
.nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.node{min-height:78px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;position:relative}
.node .n{font-weight:900;font-size:17px}.node .ic{font-size:15px;line-height:1}
.node .tg{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.node .tg span{font-size:8.5px;font-weight:900;padding:1px 3px;border-radius:4px;background:#0a1128;color:var(--steel2);letter-spacing:.02em}
.node .tg .e{color:var(--purple)}.node .tg .b{color:#ff8a8a}.node .tg .s{color:#ffd27a}.node .tg .h{color:#ff7a3d}
.node.open{border-color:var(--mint);box-shadow:0 0 0 2px rgba(61,242,181,.25);animation:pulse 1.6s infinite}
.node.locked{opacity:.42}
.node.done{background:#0d1f2a}
.node.boss{background:linear-gradient(180deg,#3a1020,#1a0b18)}
.node .md{position:absolute;top:4px;right:4px;width:12px;height:12px;border-radius:50%}
.md.gold{background:#ffd23f}.md.silver{background:#cfd6e4}.md.bronze{background:#d08a4a}.md.clear{background:#5b7bb3}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(61,242,181,.10)}}
/* cards */
.gcard{border-radius:14px;border:2px solid var(--line);background:linear-gradient(180deg,#121c3a,#0b1330);padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
.gcard .art{width:52px;height:64px;border-radius:10px;display:grid;place-items:center;font-size:26px;flex:none;background:#0a1128;border:1px solid var(--line)}
.gcard h3{font-size:16px}.gcard p{margin:4px 0 0;font-size:13px;color:#cfd8f5}
.gcard.common{border-color:#5a647a}.gcard.rare{border-color:#2b6cb8}.gcard.epic{border-color:#7a3db0}.gcard.legendary{border-color:#c79a12;box-shadow:0 0 18px rgba(255,210,63,.18)}
.gcard.locked{opacity:.5}
.r-common{color:var(--c-common)}.r-rare{color:var(--c-rare)}.r-epic{color:var(--c-epic)}.r-legendary{color:var(--c-legendary)}
button.gcard{cursor:pointer}button.gcard:active{transform:scale(.99)}
.ranks{display:flex;gap:4px;margin-top:6px}.ranks i{width:16px;height:5px;border-radius:3px;background:#22325a}.ranks i.on{background:var(--gold)}.ranks i.new{background:var(--mint);animation:pulse 1s infinite}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.chips button{flex:none;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:800;font-size:12px}
.chips button.on{background:var(--cyan);color:#04121c}
/* training */
.trow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.trow .nm b{font-size:16px}.trow .nm small{display:block;color:var(--dim)}
/* leaders */
.lead{display:flex;gap:12px;align-items:center}.lead canvas{width:60px;height:60px;image-rendering:pixelated;background:#0a1128;border-radius:12px;border:1px solid var(--line);flex:none}
/* trophies */
.cups{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cup{border:1px solid var(--line);border-radius:12px;padding:6px 2px;text-align:center;background:var(--panel);font-size:10px;min-height:70px}
.cup b{display:block;font-size:22px;filter:grayscale(1) opacity(.35)}.cup.on b{filter:none}.cup.on{border-color:#7a5b10}
/* tab bar */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(7,11,23,.97);border-top:1px solid var(--line);padding-bottom:var(--sab)}
#tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
#tabbar button{background:none;border:0;min-height:58px;font-size:10px;font-weight:800;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0;letter-spacing:.02em}
#tabbar button .ic{font-size:19px;line-height:1}
#tabbar button.on{color:var(--cyan)}
/* modal & toast */
#modal{position:fixed;inset:0;z-index:60;background:rgba(3,5,12,.78);display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#0c1430;border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 14px calc(16px + var(--sab))}
#modal h2{font-size:20px;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:calc(76px + var(--sab));transform:translateX(-50%);z-index:80;background:#0f1d3a;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;text-align:center}
#toast.on{opacity:1}
/* run screens */
.runhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.wavegrid{display:flex;gap:6px;margin:8px 0}.wavegrid>div{flex:1;border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;background:#0a1430;font-size:11px}
.wavegrid>div b{display:block;font-size:15px}.wavegrid>div.now{border-color:var(--mint)}.wavegrid>div.done{opacity:.55}
.armybar{display:flex;height:14px;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:#2a0d18}.armybar i{background:linear-gradient(90deg,var(--cyan),var(--mint))}
.big-num{font-size:44px;font-weight:900;line-height:1}
.result{text-align:center;padding:20px 14px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,#132a5a,#0b1330)}
.result.win{border-color:#7a5b10;background:linear-gradient(180deg,#3a2f0a,#0b1330)}
.result.fail{border-color:#7a2430;background:linear-gradient(180deg,#3a1220,#0b1330)}
.medal{width:72px;height:72px;border-radius:50%;margin:8px auto;display:grid;place-items:center;font-size:30px;font-weight:900;color:#1a1200;border:3px solid #fff3}
.medal.gold{background:radial-gradient(#fff1a8,#ffcf3f 60%,#b8860b)}.medal.silver{background:radial-gradient(#fff,#cfd6e4 60%,#7d8799)}.medal.bronze{background:radial-gradient(#ffd9b0,#d08a4a 60%,#7a4a1c)}.medal.clear{background:radial-gradient(#cde,#5b7bb3 60%,#2a3d66)}
/* battle */
#battle{position:fixed;inset:0;z-index:50;background:#050811;display:flex;flex-direction:column;padding-top:var(--sat);padding-bottom:var(--sab)}
.bhud{flex:none;padding:4px 8px 2px;max-width:560px;width:100%;margin:0 auto}
.bh1{display:flex;align-items:center;gap:6px;font-weight:900;font-size:12px;min-height:44px}
.bh1 button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);flex:none;font-size:14px}
.bh1 .hl{color:var(--cyan)}.bh1 .hm{color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}.bh1 .hw{color:#cfd8f5;white-space:nowrap}
.bh1 .ht{font-size:18px;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}.bh1 .ht.ot{color:#ff8a3d}
.bh2{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.bh2>span{display:flex;flex-direction:column;line-height:1.05}.bh2 small{font-size:9px;letter-spacing:.1em;color:var(--dim);font-weight:800}
.bh2 b{font-size:22px;font-variant-numeric:tabular-nums}
.bh2 .hs b{color:var(--cyan)}.bh2 .hr{text-align:right}.bh2 .hr b{color:#ff8a8a}.bh2 .hg{text-align:center}.bh2 .hg b{color:var(--gold)}
#stageWrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#stage{image-rendering:pixelated;border-radius:6px;touch-action:none}
.bfoot{flex:none;max-width:560px;width:100%;margin:0 auto;padding:2px 8px 6px}
.leadbar{display:flex;gap:4px;justify-content:center;min-height:26px;margin-bottom:4px;flex-wrap:wrap}
.leadbar span{font-size:10px;font-weight:900;border-radius:999px;padding:3px 7px;background:#2a2108;color:var(--gold);border:1px solid #7a5b10;white-space:nowrap}
.leadbar span.ko{background:#1a1a24;color:#6b7390;border-color:#333;text-decoration:line-through}
.leadbar span.lock{opacity:.35}
.focusrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fbtn{min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:4px}
.fbtn b{font-size:15px;letter-spacing:.04em}.fbtn small{font-size:9.5px;color:var(--dim)}
.fbtn i{position:absolute;left:0;bottom:0;height:4px;background:var(--gold);width:0}
.fbtn.goal{border-color:#7a5b10}.fbtn.ko{border-color:#7a2430}.fbtn.surv{border-color:#1f4b80}
.fbtn.off{opacity:.45}
.fbtn.active{background:#2a2108;box-shadow:0 0 0 2px var(--gold) inset}
.focusinfo{text-align:center;font-size:11px;color:var(--dim);min-height:16px;margin-top:3px}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,8,17,.85);font-weight:900;letter-spacing:.1em}
.skiphint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);min-height:44px;border-radius:999px;border:1px solid var(--line);background:rgba(10,16,36,.9);padding:0 16px;font-weight:800}
.pausebox{position:absolute;inset:0;background:rgba(5,8,17,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
.pausebox .btn{min-width:220px}
.bttip{position:absolute;top:8px;left:8px;right:8px;background:rgba(8,32,44,.95);border:1px solid #2f6f8f;border-radius:12px;padding:8px 40px 8px 10px;font-size:12px}
.bttip b{color:var(--cyan);display:block}.bttip button{position:absolute;right:2px;top:2px;width:40px;height:40px;background:none;border:0;color:var(--dim)}
.flashfx{position:absolute;inset:0;background:#fff;opacity:.55;pointer-events:none;animation:fl .5s forwards}
@keyframes fl{to{opacity:0}}
.confetti{font-size:40px;animation:pop 1s ease-out}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.node.open,.ranks i.new,.confetti{animation:none}}
body.rm .node.open,body.rm .ranks i.new,body.rm .confetti{animation:none}
@media (max-width:360px){.nodes{gap:6px}.node{min-height:72px}.bh2 b{font-size:19px}.fbtn b{font-size:13px}}
@media (max-height:620px){.fbtn{min-height:48px}.fbtn small{display:none}.leadbar{min-height:20px;margin-bottom:2px}}
#battle:not(.hidden)~#toast{bottom:calc(150px + var(--sab))}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="tbHome" class="hq" data-nav="hq" aria-label="Arcade HQ"><span class="logo">FW</span><span class="t"><b>ARCADE HQ</b><small id="tbSub"></small></span></button>
    <span class="cur" id="tbCoins" aria-label="Coins"><i>¢</i><span>0</span></span>
    <button class="iconbtn" data-act="fullscreen" aria-label="Full screen">⛶</button>
  </header>
  <main id="screen" tabindex="-1"></main>
</div>
<nav id="tabbar"><div class="in">
  <button data-nav="map"><span class="ic">🗺️</span>Map</button>
  <button data-nav="training"><span class="ic">🏋️</span>Training</button>
  <button data-nav="codex"><span class="ic">🃏</span>Codex</button>
  <button data-nav="leaders"><span class="ic">⭐</span>Leaders</button>
  <button data-nav="trophy"><span class="ic">🏆</span>Trophies</button>
  <button data-nav="settings"><span class="ic">⚙️</span>Settings</button>
</div></nav>
<section id="battle" class="hidden" aria-label="Battle">
  <div class="bhud">
    <div class="bh1"><button id="btPause" aria-label="Pause">❚❚</button><span id="hLevel" class="hl"></span><span id="hMission" class="hm"></span><span id="hWave" class="hw"></span><span id="hTime" class="ht">0:45</span><button class="fsb" data-act="fullscreen" aria-label="Full screen">⛶</button></div>
    <div class="bh2"><span class="hs"><small>SURVIVORS</small><b id="hSurv">100</b></span><span id="hGoalBox" class="hg"><small>GOALS</small><b id="hGoals">0/0</b></span><span class="hr"><small>RIVALS</small><b id="hRiv">0</b></span></div>
  </div>
  <div id="stageWrap"><canvas id="stage" width="360" height="640"></canvas><div id="btTip" class="bttip hidden"></div><div id="btLoading" class="loading hidden">RESTORING WAVE…</div><button id="btSkip" class="skiphint hidden">Tap to continue ▸</button><div id="pauseBox" class="pausebox hidden"></div></div>
  <div class="bfoot">
    <div id="leadBar" class="leadbar"></div>
    <div class="focusrow">
      <button class="fbtn goal" data-focus="goal"><b>⚽ GOAL</b><small>attack the goal</small><i></i></button>
      <button class="fbtn ko" data-focus="ko"><b>💥 KO</b><small>hunt rivals</small><i></i></button>
      <button class="fbtn surv" data-focus="survive"><b>🛡 SURVIVE</b><small>protect the hurt</small><i></i></button>
    </div>
    <div id="focusInfo" class="focusinfo"></div>
  </div>
</section>
<div id="modal" class="hidden"></div>
<div id="toast"></div>
<script>/* ---- v4_data.js ---- */

function drawStanding(C, P, role, o) {

function drawFrame(C, P, role, f, back) {

    if (u.state === 'stun') st = 'stun';
    else if (u.state === 'tackle') st = 'tackle';

    else if (Math.abs(u.mvx) + Math.abs(u.mvy) > 4) st = 'run';

  }
  const F = FRAMES[st] || FRAMES.idle;

function buildLevels() {
  const L = [];
  for (let level = 1; level <= 200; level++) {
    const ep = Math.ceil(level / 20), n = level - (ep - 1) * 20;
    const kind = BOSS_LEVELS.includes(level) ? 'boss' : ELITE_LEVELS.includes(level) ? 'elite' : 'normal';
    const mission = GOAL_LEVELS.includes(level) ? 'goal' : KO_LEVELS.includes(level) ? 'ko' : 'survival';
    const soft = SOFT_WALLS.includes(level), hard = HARD_WALLS.includes(level);
    let goalTarget = 0;
    if (mission === 'goal') goalTarget = kind === 'boss' ? 3 : kind === 'elite' ? (hard ? 4 : 3) : soft ? 3 : hard ? 3 : 2;
    const counts = WAVE_COUNTS[kind];
    const E = EPISODES[ep - 1], prev = ep > 1 ? EPISODES[ep - 2] : null;
    const [P, S] = E.tactics;
    let waves;
    if (kind === 'boss') waves = BOSSES[level].waves.map(x => x[0]);
    else {
      waves = counts.map((_, i) => {
        const last = i === counts.length - 1;
        if (n <= 4) return P;
        if (n <= 8) return i % 2 ? S : P;
        if (n <= 14) return (i % 2 ? P : S);
        if (prev && i === 1) return prev.tactics[0];
        return last ? S : (i % 2 ? S : P);
      });
      if ((soft || hard || kind === 'elite') && n > 4) waves[waves.length - 1] = S;
    }
    L.push({ level, ep, n, kind, mission, soft, hard, goalTarget, waves: counts.length, counts: counts.slice(), coef: WAVE_COEF[kind].slice(), tactics: waves,
      boss: kind === 'boss' ? { name: BOSSES[level].name, cup: BOSSES[level].cup, plan: BOSSES[level].waves.map(x => x[1]) } : null });
  }
  return L;
}
const LEVELS = buildLevels();

<script>/* ---- rogue_core.js ---- */
/* FOOTBALL WARS: ROGUELITE REBORN — game logic (no DOM).
 * FWTraining · FWEconomy · FWMedals · FWSurvivorArmy · FWEnemyTactics · FWCardDraft · FWCampaignProgress ·
 * FWObjectiveResolver (re-exported from the engine) · FWBattleAdapter · FWRun · FWSaveManager · FWValidation */
(function (root) {
'use strict';
const E = root.FWEngine, D = root.FWCampaignData, K = root.FWCards, LD = root.FWLeaders;
const roundTo5 = x => Math.round(x / 5) * 5;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hash = s => E.hashStr(String(s));
const newRng = (...parts) => new E.Rng(hash(parts.join('|')));
E.RG.CARD_IDX = Object.fromEntries(K.CARDS.map(c => [c.id, c.idx]));

// ======================= FWTraining =======================
const TR = D.TRAINING;
const Training = {
  tier: L => Math.min(4, Math.floor((L - 1) / 20)),
  // value of a stat at Training level L: base + per-level gains (Rookie 0.60 … Legendary 0.24); breakthroughs are free
  value(stat, L) { let v = TR.base[stat]; for (let l = 2; l <= L; l++) v += TR.coef[Training.tier(l)]; return Math.round(v * 100) / 100; },
  cost(L) { if (L >= TR.max) return null; return roundTo5(TR.cost[Training.tier(L)] * Math.pow(1.055, (L - 1) % 20)); },
  values(levels) { const o = {}; for (const s of TR.stats) o[s] = Training.value(s, levels[s] || 1); return o; },
  canBuy(save, stat) {
    if (save.campaignCompleted) return { ok: false, why: 'Campaign complete — Training is read-only.' };
    if (save.run) return { ok: false, why: 'Training is closed during an active run.' };
    const L = save.training[stat]; const c = Training.cost(L);
    if (c == null) return { ok: false, why: 'Max level reached.' };
    if (save.coins < c) return { ok: false, why: 'Not enough Coins.' };
    return { ok: true, cost: c };
  },
  buy(save, stat) {
    if (TR.stats.indexOf(stat) < 0) return { ok: false, why: 'Unknown stat.' };
    const chk = Training.canBuy(save, stat); if (!chk.ok) return chk;   // validate first, then pay, then level up
    save.coins -= chk.cost; save.training[stat]++; save.stats.trainingSpent += chk.cost;
    return { ok: true, cost: chk.cost, level: save.training[stat] };
  },
  totalCost(from, to) { let s = 0; for (let l = from; l < to; l++) s += Training.cost(l); return s; }
};
// stat values → engine modifiers (the SAME mapping is used for the player army and for the Episode threat budget)
function statMods(st) {
  const r = (v, e) => Math.pow(Math.max(5, v) / 55, e);
  const techAt = clamp(30 + st.technique * 0.9, 1, 100), stam = clamp(30 + st.stamina * 0.85, 1, 100);
  return {
    dmg: r(st.attack, 1.0), hp: r(st.defense, 0.6) * r(st.stamina, 0.3), armor: (st.defense - 55) / 900, speed: r(st.speed, 0.35), rate: r(st.speed, 0.15),
    drain: clamp(1.35 - stam / 160, 0.6, 1.4), tech: 1 + 0.06 * (techAt - 70) / 30, gk: clamp(45 + st.defense * 0.5, 1, 100), crit: clamp(0.05 + (st.technique - 38) / 1000, 0.03, 0.12),
    knock: r(st.stamina, 0.3), teamwork: 1 + (st.technique - 55) / 300, shot: r(st.technique, 0.3), fin: techAt, techAt, press: clamp(40 + (st.speed + st.attack) * 0.3, 1, 100)
  };
}

// ======================= FWEnemyTactics =======================
// Calibrated on the real engine (tools/rogue_calibrate.js); a fixed table per Episode, never read from the player's Training.
// Kind / mission factors keep multi-wave Elite and Boss runs and the Total KO time limit fair (calibrated the same way).
const KIND_F = { normal: 1, elite: 0.88, boss: 0.62 }; let KO_F = 0.81;
// per-level fine tuning for the hardest exams (Elite + Hard Walls and late Bosses), from tools/rogue_tune_level.js
const LEVEL_ADJ = { 72: 0.95, 151: 0.85, 119: 0.97, 140: 0.97, 180: 0.85, 187: 0.92, 191: 0.87, 199: 0.95, 200: 0.90 };
const EP_K = [1.63, 1.85, 2.34, 1.91, 1.97, 1.79, 1.75, 1.46, 1.44, 1.20];
const SPECIALS = { possession: ['one_two_combo', 'precision_through_ball'], high_press: ['pressing_storm', 'high_line_interception'], counter: ['counter_burst', 'quick_transition'],
  defensive_block: ['iron_wall', 'last_line_save'], wing_attack: ['cross_fire', 'flank_overload'], physical: ['shoulder_charge', 'stamina_surge'] };
const Enemy = {
  local(L) { return L.ep === 1 ? 0.78 + 0.012 * (L.n - 1) : 0.88 + 0.012 * (L.n - 1); },
  wall(L) { return L.hard ? 1.13 : L.soft ? 1.06 : 1; },
  statLevel(ep) { return 38 + (D.THREAT[ep - 1] - 100) / 100 * 39; },
  strength(L, wave) { return EP_K[L.ep - 1] * KIND_F[L.kind] * (L.mission === 'ko' ? KO_F : 1) * (LEVEL_ADJ[L.level] || 1) * Enemy.local(L) * D.WAVE_COEF[L.kind][wave] * Enemy.wall(L); },
  mods(L, wave, tacticId) {
    const tac = D.TACTICS[tacticId], b = tac.bud, s = Enemy.statLevel(L.ep);
    const m = statMods({ attack: s * b[0], defense: s * b[1], speed: s * b[2], technique: s, stamina: s * (tacticId === 'marathon_squad' ? 1.12 : 1) });
    const f = Enemy.strength(L, wave);
    m.dmg *= Math.sqrt(f); m.hp *= Math.sqrt(f);
    return m;
  },
  roles(ep, count, tacticId, boss) {
    const row = boss && D.BOSS_ROLES[tacticId] ? D.EP_ROLES[D.BOSS_ROLES[tacticId] - 1] : D.EP_ROLES[ep - 1];
    const raw = row.map(x => x * count / 100), out = raw.map(Math.floor);
    let left = count - out.reduce((a, b) => a + b, 0);
    raw.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0] || a[1] - b[1]).forEach(([, i]) => { if (left > 0) { out[i]++; left--; } });
    for (const need of [6, 4]) if (out[need] < 1) { const big = out.indexOf(Math.max(...out)); out[big]--; out[need] = 1; } // one captain and a keeper in every wave
    const o = {}; D.ROLE_ORDER.forEach((r, i) => { o[r] = out[i]; }); return o;
  },
  team(L, wave) {
    const tid = L.tactics[wave], tac = D.TACTICS[tid], ep = D.EPISODES[L.ep - 1], count = L.counts[wave];
    const sp = SPECIALS[tac.arch];
    return { id: 'RRB_E' + L.ep + '_' + tid, name: tac.name, display_name_tr: tac.name, short: tac.name.split(' ')[0].slice(0, 8), type: 'club', country: ep.name,
      visual: { primary_color: ep.color[0], secondary_color: ep.color[1] },
      battle_profile: { power_index: 60, archetype: tac.arch, attributes: flatAttrs(), roles_per_100: Enemy.roles(L.ep, count, tid, L.kind === 'boss'), specials: sp.slice(0, L.ep <= 3 ? 1 : 2),
        aggression: 60, variance: { team_form_std_pct: 4, unit_trait_std_pct: 14, critical_chance_pct: 7, critical_multiplier: 1.45, streak_adaptation: true } } };
  }
};
function flatAttrs() { const o = {}; for (const k of E.ATTRS) o[k] = 70; return o; }

// ======================= FWSurvivorArmy =======================
const ARMY_VISUAL = { primary_color: '#2bd1ff', secondary_color: '#0b2a6b' };
const Army = {
  create(save, run) {
    const rng = newRng('RRB_ARMY', run.seed);
    const mods = statMods(Training.values(save.training));
    const unlocked = LD.LEADERS.filter(l => save.leaders.indexOf(l.id) >= 0);
    const out = []; let pid = 0;
    D.ROLE_ORDER.forEach((role, ri) => {
      const lead = unlocked.find(l => l.role === role);
      for (let i = 0; i < D.ARMY_ROLES[ri]; i++) {
        const skill = clamp(1 + rng.normal() * 0.14, 0.78, 1.22);
        const leader = i === 0 && lead ? lead.id : '';
        const maxHp = E.RG.unitMaxHp(role, leader ? Math.max(skill, 1.05) : skill, mods, !!leader);
        out.push({ pid: pid++, role, leader, name: leader ? lead.name : '', skill: +(leader ? Math.max(skill, 1.05) : skill).toFixed(4), maxHp: +maxHp.toFixed(3), hp: +maxHp.toFixed(3), alive: true, koWave: -1 });
      }
    });
    return out;
  },
  alive: roster => roster.filter(u => u.alive).length,
  roleCounts(roster) { const o = {}; for (const r of D.ROLE_ORDER) o[r] = 0; for (const u of roster) if (u.alive) o[u.role]++; return o; },
  team(save, run) {
    return { id: 'RRB_ARMY', name: 'Survivor Army', display_name_tr: 'Survivor Army', short: 'ARMY', type: 'club', country: 'Arcade HQ', player: true, visual: Object.assign({}, ARMY_VISUAL),
      battle_profile: { power_index: 60, archetype: 'possession', attributes: flatAttrs(), roles_per_100: Army.roleCounts(run.roster), specials: ['one_two_combo', 'last_line_save'], aggression: 62,
        variance: { team_form_std_pct: 4, unit_trait_std_pct: 14, critical_chance_pct: 7, critical_multiplier: 1.45, streak_adaptation: true } } };
  },
  // end of a cleared wave: HP carried over, base 10% heal (+ Field Medic), total ≤25% and never above max HP
  heal(run) {
    const medic = run.cards.S02 ? cardFx('S02', run.cards.S02).heal : 0;
    const f = Math.min(0.25, 0.10 + medic); let healed = 0;
    for (const u of run.roster) if (u.alive) { const before = u.hp; u.hp = +Math.min(u.maxHp, u.hp + u.maxHp * f).toFixed(3); healed += u.hp - before; }
    return { pct: f, healed: Math.round(healed) };
  }
};

// ======================= FWCards / FWCardDraft =======================
function cardFx(id, rank) {
  const c = K.BY_ID[id], o = {};
  for (const k in c.v) o[k] = Array.isArray(c.v[k]) ? c.v[k][Math.min(3, rank) - 1] : c.v[k];
  return o;
}
const Draft = {
  eligible(save, run) { return K.CARDS.filter(c => save.cards.indexOf(c.id) >= 0 && (run.cards[c.id] || 0) < 3); },
  // Balanced Category Draft: 3 different eligible cards, rarity weights 60/30/9/1 (re-normalised over rarities that have
  // eligible cards), at least two categories when the pool allows it. Deterministic from the run seed + draft counter.
  offer(save, run) {
    const rng = newRng('RRB_DRAFT', run.seed, run.draft.n);
    const pool = Draft.eligible(save, run), pick = [];
    const drawFrom = list => {
      const rar = Object.keys(K.RARITY_W).filter(r => list.some(c => c.rarity === r));
      if (!rar.length) return null;
      const tot = rar.reduce((a, r) => a + K.RARITY_W[r], 0); let x = rng.next() * tot, R = rar[rar.length - 1];
      for (const r of rar) { x -= K.RARITY_W[r]; if (x < 0) { R = r; break; } }
      const cs = list.filter(c => c.rarity === R); return cs[rng.int(cs.length)];
    };
    while (pick.length < 3) { const c = drawFrom(pool.filter(p => pick.indexOf(p) < 0)); if (!c) break; pick.push(c); }
    if (pick.length === 3 && pick.every(c => c.cat === pick[0].cat)) {
      const other = pool.filter(c => c.cat !== pick[0].cat);
      if (other.length) pick[2] = drawFrom(other);
    }
    return pick.map(c => c.id);
  },
  open(save, run) { if (!run.draft.offer) { run.draft.offer = Draft.offer(save, run); run.draft.offered.push(run.draft.offer.slice()); } return run.draft.offer; },
  pick(save, run, id) {
    const off = run.draft.offer; if (!off || off.indexOf(id) < 0) return { ok: false };
    const rank = Math.min(3, (run.cards[id] || 0) + 1); run.cards[id] = rank;
    run.draft.picks.push({ n: run.draft.n, wave: run.wave, id, rank }); run.draft.n++; run.draft.offer = null; run.draft.left--;
    return { ok: true, id, rank };
  },
  fx(run) { const o = {}; for (const id in run.cards) o[id] = cardFx(id, run.cards[id]); return o; }
};

// ======================= FWEconomy / FWMedals =======================
const Economy = {
  levelBase(L) { const b = D.ECONOMY.base[L.ep - 1], m = D.ECONOMY.mult; return b * (L.kind === 'boss' ? m.boss : L.kind === 'elite' ? m.elite : L.soft ? m.soft : m.normal); },
  medal(L, survivors) {
    if (survivors <= 0) return null;
    const t = D.ECONOMY.medals[L.kind === 'boss' ? 'boss' : L.kind === 'elite' ? 'elite' : 'normal'];
    return survivors >= t[0] ? 'gold' : survivors >= t[1] ? 'silver' : survivors >= t[2] ? 'bronze' : 'clear';
  },
  leaderBonus(startLeaders, aliveLeaders) { if (!startLeaders.length) return 0; const n = aliveLeaders.filter(x => startLeaders.indexOf(x) >= 0).length; return Math.min(D.ECONOMY.leaderMax, 0.02 * n / startLeaders.length); },
  win(L, survivors, startLeaders, aliveLeaders) {
    const base = Economy.levelBase(L), medal = Economy.medal(L, survivors);
    const mb = D.ECONOMY.medalBonus[medal] || 0, lb = Economy.leaderBonus(startLeaders, aliveLeaders);
    const bonus = Math.min(D.ECONOMY.bonusCap, mb + lb);
    return { base, medal, medalBonus: mb, leaderBonus: +lb.toFixed(4), bonus: +bonus.toFixed(4), coins: roundTo5(base * (1 + bonus)) };
  },
  fail(L, completedWaves) {
    const base = Economy.levelBase(L), cw = clamp(completedWaves, 0, L.waves - 1);
    return { base, completedWaves: cw, coins: roundTo5(base * (0.30 + 0.55 * cw / (L.waves - 1))) };
  }
};

// ======================= FWCampaignProgress =======================
const Progress = {
  level: n => D.LEVELS[n - 1] || null,
  next(save) { return save.campaignCompleted ? null : save.highest + 1; },
  state(save, n) { return save.completed[n] ? 'done' : n === save.highest + 1 && !save.campaignCompleted ? 'open' : 'locked'; },
  canStart(save, n) { return n >= 1 && n <= 200 && Progress.state(save, n) === 'open' && !save.run; },
  nextUnlock(save) {
    const from = save.highest + 1, out = [];
    for (let l = from; l <= 200 && out.length < 2; l++) {
      if (K.CARD_UNLOCKS[l]) out.push({ level: l, kind: 'card', id: K.CARD_UNLOCKS[l], name: K.BY_ID[K.CARD_UNLOCKS[l]].name });
      const ld = LD.LEADERS.find(x => x.unlock === l); if (ld) out.push({ level: l, kind: 'leader', id: ld.id, name: ld.name });
    }
    return out;
  },
  rewardsOf(n) {
    const o = []; if (K.CARD_UNLOCKS[n]) o.push({ kind: 'card', id: K.CARD_UNLOCKS[n] });
    const ld = LD.LEADERS.find(x => x.unlock === n); if (ld) o.push({ kind: 'leader', id: ld.id });
    if (D.BOSS_LEVELS.indexOf(n) >= 0) o.push({ kind: 'cup', id: n }); return o;
  }
};

// ======================= FWBattleAdapter (one engine world per wave) =======================
const Battle = {
  snapshot(save, run) {
    const L = Progress.level(run.level), wv = run.wave, final = wv === L.waves - 1;
    const tid = L.tactics[wv];
    const seed = hash('RRB_WAVE|' + run.seed + '|' + wv);
    return {
      v: 1, runId: run.id, level: L.level, wave: wv, waves: L.waves, seed, final,
      obj: { type: L.mission, final, waveSec: 45, otSec: 10, target: L.goalTarget, goalsBefore: run.goals },
      roster: run.roster.filter(u => u.alive).map(u => ({ pid: u.pid, role: u.role, leader: u.leader, name: u.name, skill: u.skill, maxHp: u.maxHp, hp: u.hp })),
      cards: Draft.fx(run), cardRanks: Object.assign({}, run.cards),
      ai: [{}, D.TACTICS[tid].ai], tactic: tid, bossCap: L.kind === 'boss',
      mods: [run.mods, Enemy.mods(L, wv, tid)],
      teamA: Army.team(save, run), teamB: Enemy.team(L, wv),
      label: 'Level ' + L.level + ' · Wave ' + (wv + 1) + '/' + L.waves
    };
  },
  worldOpts(snap, o) {
    o = o || {};
    return { seed: snap.seed, teamA: snap.teamA, teamB: snap.teamB, cfg: root.FW_ENGINE_CONFIG, duration: 'standard', fxLevel: o.fxLevel == null ? 1 : o.fxLevel,
      ruleset: 'fusion', fbIntensity: 'normal', goalAdv: true, headless: !!o.headless,
      rogue: { obj: snap.obj, roster: snap.roster, cards: snap.cards, ai: snap.ai, mods: snap.mods, bossCap: snap.bossCap, inputs: o.inputs || [] } };
  },
  runSlice(w, ticks) { let n = 0; while (w.phase !== 'ended' && n++ < ticks) { E.step(w); if (w.headless && w.events.length > 3000) w.events.length = 0; } return w.phase === 'ended'; },
  simulate(snap, inputs) { const w = E.createWorld(Battle.worldOpts(snap, { headless: true, inputs })); while (!Battle.runSlice(w, 100000)); return w; },
  result(w) { return E.rgSummary(w); }
};

// ======================= FWRun (attempt lifecycle) =======================
const Run = {
  start(save, n) {
    if (!Progress.canStart(save, n)) return null;

    const L = Progress.level(n);

  const V = { hq: viewHQ, map: viewMap, training: viewTraining, codex: viewCodex, leaders: viewLeaders, trophy: viewTrophy, settings: viewSettings, run: viewRun, result: viewResult, complete: viewComplete }[st.view] || viewHQ;
  $('screen').innerHTML = V(s);
  document.body.classList.toggle('rm', !!s.settings.reduceMotion);
  const ac = $('screen').querySelector('[data-crest]'); if (ac) ac.replaceWith(crest(armyTeam(), 44));
  $('screen').querySelectorAll('[data-sprite]').forEach(el => { const [role, v] = el.dataset.sprite.split(':'); const cv = spriteCv(role, +v || 0, 3); cv.className = el.className; el.replaceWith(cv); });
}

// ======================= FWTutorial (contextual, once, archived) =======================
function tipSeen(id) { return !!st.save.tips[id]; }
function tipHTML(id) {
  if (tipSeen(id) || !D.TIPS[id]) return '';
  const t = D.TIPS[id]; return '<div class="tip" data-tipbox="' + id + '"><b>💡 ' + esc(t.t) + '</b>' + esc(t.x) + '<button class="x" data-tipx="' + id + '" aria-label="Dismiss tip">✕</button></div>';
}
function markTip(id) { if (!st.save.tips[id]) { st.save.tips[id] = Date.now(); persist(); } }
const LEVEL_TIPS = { 1: ['army'], 2: ['training', 'focus'], 3: ['training', 'focus'], 6: ['soft_wall'], 7: ['goal_ch'], 9: ['elite_ko'], 14: ['soft_goal'], 17: ['elite_surv'], 20: ['boss'] };
const CLEAR_TIPS = { 5: 'pao', 10: 'quick_pass', 15: 'nazar', 19: 'counter' };
function levelTips(n) { return (LEVEL_TIPS[n] || []).map(tipHTML).join(''); }

// ======================= Arcade HQ =======================
function viewHQ(s) {
  if (s.campaignCompleted && !s.run) return viewHQComplete(s);
  const n = curLevel(), L = R.Progress.level(n), ep = D.EPISODES[L.ep - 1], M = MISSION[L.mission];
  const nu = R.Progress.nextUnlock(s);
  const run = s.run;
  const tags = [pillKind(L), '<span class="pill">' + M.ic + ' ' + M.n + '</span>', L.soft ? '<span class="pill gold">SOFT WALL</span>' : '', L.hard ? '<span class="pill coral">HARD WALL</span>' : ''].join('');
  let h = levelTips(n) + (s.highest >= 1 && s.highest < 4 ? tipHTML('training') : '');
  h += '<div class="hero"><span data-crest class="army"></span><div class="ep">Episode ' + L.ep + ' · ' + esc(ep.name) + '</div><h1>Level ' + L.level + '</h1><div class="lv">' + tags + '</div>' +
    '<div class="small dim" style="margin-bottom:12px">' + L.waves + ' waves · ' + L.counts.join(' → ') + ' rivals' + (L.mission === 'goal' ? ' · ' + L.goalTarget + ' real goals' : '') + (L.boss ? ' · Boss: ' + esc(L.boss.name) : '') + '</div>' +
    (run ? '<button class="btn primary big block" data-act="continue">▶ CONTINUE</button><div class="small dim center" style="margin-top:6px">' + runStatus(run) + '</div>'
      : '<button class="btn primary big block" data-act="brief" data-level="' + n + '">▶ PLAY</button>') +
    '<div class="stat3"><div><b>' + s.highest + '<span class="dim small">/200</span></b><small>Cleared</small></div><div><b>' + Object.keys(s.cups).length + '<span class="dim small">/10</span></b><small>Boss Cups</small></div><div><b>' + s.cards.length + '<span class="dim small">/48</span></b><small>Cards</small></div></div></div>';
  h += '<div class="title">Next unlocks</div>' + (nu.length ? nu.map(u => '<div class="card row"><span style="font-size:24px">' + (u.kind === 'leader' ? '⭐' : '🃏') + '</span><div class="grow"><b>' + esc(u.name) + '</b><div class="small dim">' + (u.kind === 'leader' ? 'Star Leader' : 'Card · ' + K.CAT_NAME[K.BY_ID[u.id].cat] + ' · ' + K.BY_ID[u.id].rarity) + '</div></div><span class="pill">Clear L' + u.level + '</span></div>').join('') : '<div class="card small dim">Every card and leader is unlocked.</div>');
  const lr = s.lastResult;
  if (lr && lr.kind !== 'abandon') h += '<div class="title">Last attempt</div><div class="card row"><span style="font-size:24px">' + (lr.kind === 'win' ? '🏁' : '✖') + '</span><div class="grow"><b>Level ' + lr.level + ' · ' + (lr.kind === 'win' ? 'Victory · ' + MEDAL_N[lr.medal] + ' (' + lr.survivors + ' survivors)' : 'Defeat') + '</b><div class="small dim">+' + fmt(lr.coins) + ' Coins</div></div></div>';
  h += '<div class="title">Your army</div><div class="card small">100 players every attempt: 16 strikers, 14 wingers, 12 playmakers, 34 defenders, 8 keepers, 15 supports, 1 captain. ' +
    'Leaders unlocked: <b>' + s.leaders.length + '/5</b>. Training avg level <b>' + Math.round(D.TRAINING.stats.reduce((a, k) => a + s.training[k], 0) / 5) + '</b>.</div>';
  return h;
}
function viewHQComplete(s) {
  return '<div class="hero center"><div class="ep">Campaign Complete</div><h1>Legend of 200 Levels</h1><div class="confetti">🏆</div><div class="small dim">All 200 levels cleared. No new levels exist after Level 200 — your records stay here forever.</div>' +
    '<div class="stat3"><div><b>200/200</b><small>Levels</small></div><div><b>' + Object.keys(s.cups).length + '/10</b><small>Cups</small></div><div><b>' + s.cards.length + '/48</b><small>Cards</small></div></div>' +
    '<div class="btns" style="margin-top:12px"><button class="btn gold" data-act="complete">Campaign summary</button><button class="btn" data-nav="trophy">Career archive</button></div></div>';
}
function pillKind(L) { return L.kind === 'boss' ? '<span class="pill coral">BOSS</span>' : L.kind === 'elite' ? '<span class="pill purple">ELITE</span>' : '<span class="pill">NORMAL</span>'; }
function runStatus(run) {
  const L = R.Progress.level(run.level), alive = R.Army.alive(run.roster);
  const ph = { draft: 'choosing a card', ready: 'wave ' + (run.wave + 1) + ' ready', battle: 'wave ' + (run.wave + 1) + ' in progress', clear: 'wave ' + run.wave + ' cleared', over: 'result pending' }[run.phase];
  return 'Level ' + run.level + ' · attempt ' + run.attempt + ' · ' + alive + ' survivors · ' + ph + (L.mission === 'goal' ? ' · goals ' + run.goals + '/' + L.goalTarget : '');
}

// ======================= Episode Map =======================
function viewMap(s) {
  const ep = st.ep, E0 = D.EPISODES[ep - 1], unl = e => (e - 1) * 20 <= s.highest;
  let h = '<div class="eps">' + D.EPISODES.map(e => '<button data-ep="' + e.n + '" class="' + (e.n === ep ? 'on' : '') + (unl(e.n) ? '' : ' lock') + '" aria-label="Episode ' + e.n + '">E' + e.n + '</button>').join('') + '</div>';
  const lv = D.LEVELS.filter(l => l.ep === ep), done = lv.filter(l => s.completed[l.level]).length;
  h += '<div class="title"><span>E' + ep + ' · ' + esc(E0.name) + '</span><span class="sp"></span><span class="pill">' + done + '/20</span></div>';
  h += '<div class="small dim" style="margin:-4px 2px 10px">Rival tactics: ' + E0.tactics.map(t => esc(D.TACTICS[t].name)).join(' · ') + '</div>';
  h += '<div class="nodes">' + lv.map(l => {
    const stt = R.Progress.state(s, l.level), rec = s.completed[l.level];
    const tg = (l.kind === 'elite' ? '<span class="e">ELITE</span>' : l.kind === 'boss' ? '<span class="b">BOSS</span>' : '') + (l.soft ? '<span class="s">SOFT</span>' : '') + (l.hard ? '<span class="h">HARD</span>' : '');
    return '<button class="node ' + stt + (l.kind === 'boss' ? ' boss' : '') + '" data-node="' + l.level + '" aria-label="Level ' + l.level + ' ' + MISSION[l.mission].n + ' ' + l.kind + (l.soft ? ' soft wall' : '') + (l.hard ? ' hard wall' : '') + ' ' + stt + '">' +
      (rec ? '<i class="md ' + rec.medal + '"></i>' : '') + '<span class="ic">' + (stt === 'locked' ? '🔒' : MISSION[l.mission].ic) + '</span><span class="n">' + l.level + '</span><span class="tg">' + tg + '</span></button>';
  }).join('') + '</div>';
  h += '<div class="small dim" style="margin-top:10px">🛡 Survival · ⚽ Goal Challenge · 💥 Total KO · medal dot = Survivor Medal of your first clear. Cleared levels cannot be replayed.</div>';
  return h;
}
function briefing(n) {
  const s = st.save, L = R.Progress.level(n), stt = R.Progress.state(s, n);
  if (stt === 'done') return recordModal(n);
  const M = MISSION[L.mission], E0 = D.EPISODES[L.ep - 1];
  const rules = L.mission === 'survival' ? 'Survive each 45 s wave with at least one player — or K.O. every rival. Goals give a small boost but never end the wave.'
    : L.mission === 'goal' ? 'Score <b>' + L.goalTarget + ' real goals</b> in total across all waves, and survive the final wave. Earlier waves end like Survival. In the final wave, if the target is still missing after 45 s, you get up to 10 s overtime.'
    : 'K.O. <b>every rival</b> in every wave within 45 s (+ up to 10 s overtime).';
  const base = R.Economy.levelBase(L), rw = R.Progress.rewardsOf(n);
  const waves = L.counts.map((c, i) => { const t = D.TACTICS[L.tactics[i]]; return '<div class="card" style="padding:8px 10px;margin-bottom:6px"><div class="row"><b class="grow">Wave ' + (i + 1) + ' · ' + c + ' rivals</b><span class="pill">' + esc(t.name) + '</span></div><div class="tiny dim">' + esc(L.boss ? L.boss.plan[i] + ' — ' : '') + esc(t.desc) + '</div></div>'; }).join('');
  const lead = s.leaders.map(id => LD.BY_ID[id].name).join(', ');
  modal('<div class="runhead">' + pillKind(L) + '<span class="pill">' + M.ic + ' ' + M.n + '</span>' + (L.soft ? '<span class="pill gold">SOFT WALL</span>' : '') + (L.hard ? '<span class="pill coral">HARD WALL</span>' : '') + '</div>' +
    '<h2>Level ' + n + (L.boss ? ' · ' + esc(L.boss.name) : '') + '</h2><div class="small dim">Episode ' + L.ep + ' · ' + esc(E0.name) + '</div>' + levelTips(n) +
    '<p class="small">' + rules + '</p>' + waves +
    '<div class="kv" style="margin:8px 0"><span>First-clear reward</span><b>' + fmt(base) + ' Coins + medal bonus (max +10%)</b><span>Defeat</span><b>' + fmt(R.Economy.fail(L, 0).coins) + '–' + fmt(R.Economy.fail(L, L.waves - 1).coins) + ' Coins</b>' +
    rw.map(u => '<span>Unlock</span><b class="gold-t">' + (u.kind === 'card' ? '🃏 ' + esc(K.BY_ID[u.id].name) : u.kind === 'leader' ? '⭐ ' + esc(LD.BY_ID[u.id].name) : '🏆 ' + esc(D.BOSSES[u.id].cup)) + '</b>').join('') + '</div>' +
    '<div class="small dim">Leaders in your army: ' + esc(lead) + '</div>' +
    (stt === 'open' ? (s.run ? '<p class="coral small">Finish or abandon your current run first.</p>' : '<button class="btn primary block big" data-act="start" data-level="' + n + '" style="margin-top:12px">▶ START LEVEL ' + n + '</button>') : '<p class="dim small center" style="margin-top:12px">🔒 Clear Level ' + (s.highest + 1) + ' first.</p>') +
    '<button class="btn block" data-act="close" style="margin-top:8px">Close</button>');
}
function recordModal(n) {
  const r = st.save.completed[n], L = R.Progress.level(n);
  if (!r || !r.medal) { modal('<h2>Level ' + n + '</h2><p class="dim">Cleared.</p><button class="btn block" data-act="close">Close</button>'); return; }
  const tr = D.TRAINING.stats.map(k => D.TRAINING.names[k].slice(0, 3) + ' ' + r.training[k]).join(' · ');
  modal('<h2>Level ' + n + ' · first clear</h2><div class="runhead">' + pillKind(L) + '<span class="pill">' + MISSION[L.mission].ic + ' ' + MISSION[L.mission].n + '</span>' + (r.cup ? '<span class="pill gold">🏆 ' + esc(r.cup) + '</span>' : '') + '</div>' +
    '<div class="medal ' + r.medal + '">' + MEDAL_N[r.medal][0] + '</div><div class="center"><b>' + MEDAL_N[r.medal] + ' Survivor Medal</b> · ' + r.survivors + ' survivors</div>' +
    '<div class="kv" style="margin-top:10px"><span>Survivors after each wave</span><b>' + r.waveSurvivors.join(' → ') + '</b><span>Leaders alive</span><b>' + (r.leadersAlive.map(id => LD.BY_ID[id].name).join(', ') || '—') + '</b>' +
    '<span>Real goals</span><b>' + r.goals + '</b><span>Tactical Focus</span><b>' + (r.focus.map(f => 'W' + (f.wave + 1) + ' ' + f.f.toUpperCase()).join(', ') || '—') + '</b><span>Coins earned</span><b>' + fmt(r.coins) + '</b>' +
    '<span>Attempt</span><b>#' + r.attempt + '</b><span>Training</span><b class="tiny">' + tr + '</b><span>Cleared</span><b>' + new Date(r.at).toLocaleString() + '</b></div>' +
    '<div class="title">Cards</div><div class="small">' + (r.cards.map(c => esc(K.BY_ID[c.id].name) + ' ' + 'I'.repeat(c.rank)).join(' · ') || '—') + '</div>' +
    '<p class="tiny dim">First-clear records are permanent. Cleared levels cannot be replayed.</p><button class="btn block" data-act="close">Close</button>');
}

// ======================= Training =======================
function viewTraining(s) {
  const lockRun = !!s.run, ro = s.campaignCompleted;
  let h = tipHTML('training') + '<div class="title"><span>Permanent Training</span><span class="sp"></span><span class="pill gold">¢ ' + fmt(s.coins) + '</span></div>';
  if (ro) h += '<div class="card small gold-t">Campaign complete — Training is read-only.</div>';
  else if (lockRun) h += '<div class="card small coral">Training is closed during an active run. Finish or abandon Level ' + s.run.level + ' first.</div>';
  h += D.TRAINING.stats.map(k => {
    const L = s.training[k], v = R.Training.value(k, L), c = R.Training.cost(L), tier = D.TRAINING.tiers[R.Training.tier(L)], chk = R.Training.canBuy(s, k);
    const nextV = c != null ? R.Training.value(k, L + 1) : null;
    return '<div class="card"><div class="trow"><div class="nm"><b>' + D.TRAINING.names[k] + '</b><small>Level ' + L + '/100 · ' + tier + ' · value ' + v.toFixed(1) + (nextV ? ' → ' + nextV.toFixed(1) : '') + '</small></div>' +
      '<button class="btn ' + (chk.ok ? 'gold' : '') + '" data-train="' + k + '"' + (chk.ok ? '' : ' disabled') + ' aria-label="Train ' + D.TRAINING.names[k] + '">' + (c == null ? 'MAX' : '¢ ' + fmt(c)) + '</button></div>' +
      '<div class="bar" style="margin-top:8px"><i style="width:' + L + '%"></i></div></div>';
  }).join('');
  h += '<div class="small dim">Tiers: Rookie 1–20 (+0.60/level) · Professional 21–40 (+0.48) · Elite 41–60 (+0.38) · Master 61–80 (+0.30) · Legendary 81–100 (+0.24). Breakthroughs are free. ' +
    'Attack → damage · Defense → HP & armour, keepers · Speed → movement & attack rate · Technique → shots, passes, crits · Stamina → HP, stamina drain, knockback. Rivals never read your Training.</div>';
  return h;
}

// ======================= Card Codex =======================
function cardHTML(c, rank, opts) {
  opts = opts || {};
  const locked = opts.locked, v = R.cardFx(c.id, Math.max(1, rank || 1));
  const rk = '<div class="ranks">' + [1, 2, 3].map(i => '<i class="' + (i <= (opts.cur || 0) ? 'on' : i === opts.next ? 'new' : '') + '"></i>').join('') + '</div>';
  return '<' + (opts.btn ? 'button data-pick="' + c.id + '"' : 'div') + ' class="gcard ' + c.rarity + (locked ? ' locked' : '') + '"><div class="art">' + (locked ? '🔒' : CAT_IC[c.cat]) + '</div><div class="grow"><div class="row"><h3 class="grow">' + esc(c.name) + '</h3><span class="tiny r-' + c.rarity + '">' + c.rarity.toUpperCase() + '</span></div>' +
    '<div class="tiny dim">' + K.CAT_NAME[c.cat] + ' · ' + c.id + (opts.rankLabel ? ' · ' + opts.rankLabel : '') + '</div>' + (locked ? '<p class="dim">Unlocks by clearing Level ' + c.unlock + '.</p>' : '<p>' + esc(c.desc(v)) + '</p>') + (opts.ranks !== false && !locked ? rk : '') + (opts.extra || '') + '</div></' + (opts.btn ? 'button' : 'div') + '>';
}
function viewCodex(s) {
  const cats = ['all'].concat(K.CATEGORIES);
  let h = '<div class="title"><span>Card Codex</span><span class="sp"></span><span class="pill">' + s.cards.length + '/48 discovered</span></div>';
  h += '<div class="chips">' + cats.map(c => '<button data-cat="' + c + '" class="' + (st.codexCat === c ? 'on' : '') + '">' + (c === 'all' ? 'All' : CAT_IC[c] + ' ' + K.CAT_NAME[c]) + '</button>').join('') + '</div>';
  const list = K.CARDS.filter(c => st.codexCat === 'all' || c.cat === st.codexCat);
  h += list.map(c => {
    const known = s.cards.indexOf(c.id) >= 0;
    const extra = known ? '<details class="tiny" style="margin-top:6px"><summary class="dim">Rank I / II / III</summary>' + [1, 2, 3].map(r => '<div>' + 'I'.repeat(r) + ': ' + esc(c.desc(R.cardFx(c.id, r))) + '</div>').join('') + '</details>' : '';
    return cardHTML(c, 1, { locked: !known, ranks: false, extra, rankLabel: known ? (c.unlock ? 'from L' + c.unlock : 'starter') : '' });
  }).join('');
  h += '<div class="small dim">Cards are temporary: drafted during an attempt, they reset when it ends. Rank III is the maximum; a Rank III card is never offered again in that run.</div>';
  return h;
}

// ======================= Star Leaders =======================
function viewLeaders(s) {
  let h = '<div class="title"><span>Star Leaders</span><span class="sp"></span><span class="pill">' + s.leaders.length + '/5</span></div>';
  h += '<div class="small dim" style="margin:-2px 2px 10px">Unlocked leaders automatically replace a standard player of their role in every new attempt (still exactly 100 players). Their synergy works only while they stand.</div>';
  h += LD.LEADERS.map(l => {
    const on = s.leaders.indexOf(l.id) >= 0, card = K.BY_ID[l.card];
    return '<div class="card lead' + (on ? '' : ' locked') + '" style="' + (on ? '' : 'opacity:.55') + '"><span data-sprite="' + l.role + ':' + (LD.LEADERS.indexOf(l) % 6) + '"></span><div class="grow"><div class="row"><b class="grow">' + esc(l.name) + '</b>' + (on ? '<span class="pill gold">UNLOCKED</span>' : '<span class="pill">🔒 Clear L' + l.unlock + '</span>') + '</div>' +
      '<div class="small dim">' + ROLE_N[l.role] + ' · +25% HP, slightly stronger · signature card: <b class="r-' + card.rarity + '">' + esc(card.name) + '</b></div><div class="small" style="margin-top:4px">' + esc(l.syn) + '</div></div></div>';
  }).join('');
  const ach = s.achievements;
  h += '<div class="title">Command achievements</div><div class="card small"><div class="kv"><span>Unbroken Command (all run-start leaders alive at victory)</span><b>' + ((ach.unbroken || []).length) + '</b>' +
    '<span>Perfect Command (all 5 alive)</span><b>' + ((ach.perfect || []).length) + '</b><span>Last Captain Standing (only one leader alive)</span><b>' + ((ach.last_captain || []).length) + '</b></div><div class="tiny dim" style="margin-top:6px">Cosmetic archive records only.</div></div>';
  return h;
}

// ======================= Career / Trophy Hall =======================
function viewTrophy(s) {
  const med = { gold: 0, silver: 0, bronze: 0, clear: 0 }; for (const k in s.completed) if (s.completed[k].medal) med[s.completed[k].medal]++;
  let h = '<div class="title">Boss Cups</div><div class="cups">' + D.CUPS.map(c => '<div class="cup' + (s.cups[c.level] ? ' on' : '') + '"><b>🏆</b>' + esc(c.name.replace(' Cup', '')) + '<div class="dim">L' + c.level + '</div></div>').join('') + '</div>';
  h += '<div class="title">Career</div><div class="card"><div class="kv"><span>Levels cleared</span><b>' + s.highest + '/200</b><span>Medals</span><b>🥇' + med.gold + ' 🥈' + med.silver + ' 🥉' + med.bronze + ' ⚪' + med.clear + '</b>' +
    '<span>Cards discovered</span><b>' + s.cards.length + '/48</b><span>Leaders</span><b>' + s.leaders.length + '/5</b><span>Attempts (wins / defeats / abandoned)</span><b>' + s.stats.runs + ' (' + s.stats.wins + ' / ' + s.stats.fails + ' / ' + s.stats.abandons + ')</b>' +
    '<span>Real goals scored</span><b>' + fmt(s.stats.goals) + '</b><span>Rivals knocked out</span><b>' + fmt(s.stats.kos) + '</b><span>Coins earned</span><b>' + fmt(s.stats.coinsEarned) + '</b></div></div>';
  h += '<div class="title">First-clear archive</div>';
  const eps = D.EPISODES.filter(e => s.completed[(e.n - 1) * 20 + 1]);
  if (!eps.length) h += '<div class="card small dim">Clear a level to start your archive.</div>';
  for (const e of eps) {
    h += '<div class="card"><b>E' + e.n + ' · ' + esc(e.name) + '</b><div class="row wrap" style="margin-top:6px;gap:4px">' + D.LEVELS.filter(l => l.ep === e.n && s.completed[l.level]).map(l => '<button class="pill" style="min-height:36px" data-node="' + l.level + '"><i class="md ' + s.completed[l.level].medal + '" style="width:9px;height:9px;border-radius:50%;display:inline-block"></i>' + l.level + '</button>').join('') + '</div></div>';
  }
  if (s.campaignCompleted) h += '<button class="btn gold block" data-act="complete">Campaign Complete summary</button>';
  return h;
}

  h += '<div class="title">Visuals</div><div class="card"><div class="chips">' + ['low', 'medium', 'high'].map(q => '<button data-vfx="' + q + '" class="' + (set.vfx === q ? 'on' : '') + '">VFX ' + q + '</button>').join('') + '</div>' + ck('reduceMotion', 'Reduce motion (no camera zoom, no shake)') +

  const frame = now => {
    if (st.battle !== B) return;
    const dtReal = Math.min(0.1, (now - B.last) / 1000); B.last = now;
    if (!B.paused) { // real time, 1×: an accumulator runs exactly one fixed 1/60 s step per 1/60 s of real time (never sped up, never skipped)
      B.acc += dtReal; let n = 0;
      while (B.acc >= E.DT - 1e-7 && n++ < 8) { E.step(w); B.acc -= E.DT; }
      if (B.acc > E.DT * 8) B.acc = 0; // after a long stall the battle waits instead of fast-forwarding
    }
    cam(B, dtReal);
    renderer.render(ctx, w.t, cv.width, cv.height);
    events(B);
    hudTick(B);
    if (!B.paused) AU.battleFeed(w, w.observer && w.observer.state);
    if (!B.paused && w.phase === 'battle' && w.tick - B.savedTick >= 120) checkpoint(B);
    if (w.phase === 'ended') {
      if (!B.applied) applyWave(B);
      if (!B.ended) { B.ended = true; B.endAt = now; $('btSkip').classList.remove('hidden'); }
      if (B.skip || now - B.endAt > 2600) { endLive(B); return; }
    }
    B.raf = requestAnimationFrame(frame);
  };
  if (B.ff) setTimeout(ff, 30); else B.raf = requestAnimationFrame(frame);
}
function cam(B, dt) {
  const w = B.w; let tx = 180, ty = E.MIDY, tz = 1;
  if (!B.rm) { tx = w.cam.x; ty = w.cam.y; tz = Math.min(1.12, w.cam.z); }
  if (B.rm) w.shake = 0;
  const k = Math.min(1, dt * 4), c = B.camS; c.x += (tx - c.x) * k; c.y += (ty - c.y) * k; c.z += (tz - c.z) * k;
  w.cam.x = c.x; w.cam.y = c.y; w.cam.z = Math.min(1.12, c.z);
}
function checkpoint(B) {
  const run = st.save.run; if (!run || !run.pending || B.applied) return;
  run.pending.lastTick = B.w.tick; run.pending.inputs = B.inputs.slice(); B.savedTick = B.w.tick; persist();
}
function issueFocus(f) {
  const B = st.battle; if (!B || B.paused || B.ff) return;
  const w = B.w;
  if (!E.rgCanFocus(w)) { sfx('error', 0.4); const F = w.rg.focus; toast(F.uses >= F.max ? 'No Focus left this wave' : F.kind ? 'A Focus is already active' : w.phase !== 'battle' ? 'Wait for kick-off' : 'Focus ready in ' + Math.ceil(F.nextOk - w.battleT) + 's'); return; }
  const inp = { k: w.tick + 1, f }; B.inputs.push(inp); w.rg.inputs.push(inp); // applied by the engine on the next fixed tick (logged for exact resume)
  markTip('focus'); $('btTip').classList.add('hidden');
  sfx('rg_focus', 0.6); AU.vibrate(25);
  checkpoint(B);
}
function setPause(on) {
  const B = st.battle; if (!B) return; B.paused = on;
  const box = $('pauseBox');
  if (on) {
    box.innerHTML = '<b style="font-size:22px">PAUSED</b><div class="small dim center">The simulation and Focus timers are stopped.</div><button class="btn primary" data-act="bt-resume">▶ Resume</button><button class="btn" data-act="bt-quit">Save &amp; return to HQ</button>';
    box.classList.remove('hidden'); AU.pause(true); checkpoint(B);
  } else { box.classList.add('hidden'); AU.pause(false); B.last = performance.now(); B.acc = 0; }
  $('btPause').textContent = on ? '▶' : '❚❚';
}
$('btPause').addEventListener('click', () => { if (st.battle && !st.battle.ff && !st.battle.ended) setPause(!st.battle.paused); });
$('btSkip').addEventListener('click', () => { if (st.battle) st.battle.skip = true; });
function quitWaveToHQ() { const B = st.battle; if (!B) return; checkpoint(B); teardown(B); go('hq'); }
function teardown(B) { cancelAnimationFrame(B.raf); AU.battleStop(); AU.pause(false); B.renderer.dispose(); st.battle = null; $('battle').classList.add('hidden'); document.body.style.overflow = ''; }
function applyWave(B) {
  B.applied = true;
  const sum = R.Battle.result(B.w);
  const out = R.Run.endWave(st.save, sum); persist();
  B.outcome = out;
  if (out === 'clear') { sfx('rg_wave', 0.6); AU.vibrate([40, 30, 60]); }
  else if (out === 'win') { sfx('levelup', 0.7); AU.vibrate([60, 40, 120]); }
  else { sfx('rg_lose', 0.6); AU.vibrate(200); }
}
function endLive(B) {
  teardown(B);
  if (B.outcome === 'clear') go('run'); else finishRun();
}
function buildLeadBar(B) {
  const u = B.w.units.filter(x => x.side === 0 && x.leader);
  $('leadBar').innerHTML = LD.LEADERS.map(l => { const x = u.find(y => y.leader === l.id); return '<span class="' + (!x ? 'lock' : x.alive ? '' : 'ko') + '">' + (x ? (x.alive ? '⭐' : '✖') : '🔒') + ' ' + esc(l.name.split(' ').pop()) + '</span>'; }).join('');
  B.leadSig = u.map(x => x.alive).join();
}
function hudTick(B) {
  const w = B.w, R0 = w.rg, o = R0.obj;
  const bt = w.phase === 'battle' ? w.battleT : w.phase === 'ended' ? (R0.result ? R0.result.battleT : w.battleT) : 0;
  const ot = bt > o.waveSec; const rem = ot ? o.waveSec + o.otSec - bt : o.waveSec - bt;
  const tEl = $('hTime'), sec = Math.ceil(Math.max(0, rem)); tEl.textContent = (ot ? '+' : '') + Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  tEl.classList.toggle('ot', ot || R0.ot);
  $('hSurv').textContent = w.teams[0].alive; $('hRiv').textContent = w.teams[1].alive;
  if (o.type === 'goal') $('hGoals').textContent = (o.goalsBefore + w.fb.goals[0]) + '/' + o.target;
  const sig = w.units.filter(x => x.side === 0 && x.leader).map(x => x.alive).join(); if (sig !== B.leadSig) buildLeadBar(B);
  const F = R0.focus, can = E.rgCanFocus(w);
  document.querySelectorAll('.fbtn').forEach(b => {
    const k = b.dataset.focus, act = F.kind === k;
    b.classList.toggle('active', act); b.classList.toggle('off', !can && !act); b.setAttribute('aria-disabled', String(!can && !act));
    const bar = b.querySelector('i'); bar.style.width = act ? Math.max(0, (F.until - w.battleT) / F.dur * 100) + '%' : '0';
  });
  let info = 'Focus left: ' + (F.max - F.uses) + '/' + F.max;
  if (F.kind) info = F.kind.toUpperCase() + ' Focus · ' + Math.max(0, F.until - w.battleT).toFixed(1) + 's';
  else if (F.uses < F.max && w.phase === 'battle' && w.battleT < F.nextOk) info += ' · ready in ' + Math.ceil(F.nextOk - w.battleT) + 's';
  if (B.cardMsg && performance.now() < B.cardT) info = B.cardMsg + ' · ' + info;
  $('focusInfo').textContent = info;
}
function events(B) {
  const w = B.w, ev = w.events, EV = E.EV;
  for (; B.evI < ev.length; B.evI++) {
    const e = ev[B.evI];
    if (e.type === EV.CARD && e.b >= 0) { const c = K.CARDS[e.b]; B.cardMsg = '🃏 ' + c.name; B.cardT = performance.now() + 1400; if (c.rarity === 'legendary' && !B.rm) { const fl = document.createElement('div'); fl.className = 'flashfx'; $('stageWrap').appendChild(fl); setTimeout(() => fl.remove(), 520); sfx('rev_legendary', 0.5); } }
    else if (e.type === EV.GOAL) { if (!tipSeen('goal_adv')) battleTip(B, 'goal_adv'); AU.vibrate(80); }
    else if (e.type === EV.KO && w.units[e.b] && w.units[e.b].side === 0) { if (!tipSeen('first_ko')) battleTip(B, 'first_ko'); }
    else if (e.type === EV.OVERTIME) sfx('rg_alarm', 0.4);
    else if (e.type === EV.EMERGENCY_GK) toast('Emergency keeper: a defender takes the gloves');
  }
  if (B.w.events.length > 5000 && B.evI >= B.w.events.length) { B.w.events.length = 0; B.evI = 0; }
}
function battleTip(B, id) {
  const t = D.TIPS[id]; if (!t) return; const el = $('btTip');
  el.innerHTML = '<b>💡 ' + esc(t.t) + '</b>' + esc(t.x) + '<button aria-label="Dismiss tip">✕</button>';
  el.classList.remove('hidden'); markTip(id);
  el.querySelector('button').onclick = () => el.classList.add('hidden');
  clearTimeout(B.tipT); B.tipT = setTimeout(() => el.classList.add('hidden'), 7000);
}
document.addEventListener('visibilitychange', () => { const B = st.battle; if (document.hidden && B && !B.ff && !B.ended) setPause(true); else if (document.hidden && st.save) persist(); });
window.addEventListener('pagehide', () => { const B = st.battle; if (B && !B.ff && !B.applied) checkpoint(B); });
document.addEventListener('keydown', e => {
  const B = st.battle; if (!B) return;
  if (e.key === ' ' || e.key === 'p') { e.preventDefault(); if (!B.ff && !B.ended) setPause(!B.paused); }
  else if (e.key === '1') issueFocus('goal'); else if (e.key === '2') issueFocus('ko'); else if (e.key === '3') issueFocus('survive');
});

// ======================= boot =======================
function boot() {
  const v = R.Validation.run();
  if (!v.ok) console.error('FWValidation failed', v.checks.filter(c => !c.ok));
  let ld; try { ld = R.Save.load(); } catch (e) { ld = { save: R.Save.defaults(), notice: 'Browser storage is blocked — progress cannot be saved here.' }; st.storageOk = false; }
  st.save = ld.save;
  if (ld.fresh) persist();
  const s = st.save;
  // a run that ended but whose result was not yet applied (closed during the outro)
  if (s.run && s.run.phase === 'over') { R.Run.finish(s); persist(); }
  st.view = 'hq';
  st.ep = R.Progress.level(curLevel()).ep;
  render();
  if (ld.notice) toast(ld.notice);
  if (s.run) toast('Run in progress — tap CONTINUE');
  root.FWArcadeUI = { st, go, render, startLevel, liveWave, issueFocus, setPause };
}
boot();
})(window);

</script>
