<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070b17">
<meta name="mobile-web-app-capable" content="yes">
<title>Football Wars — Arcade Reborn</title>
<meta name="description" content="FOOTBALL WARS — ARCADE REBORN: 100 vs 100 pixel football battles, 10-division arcade career, star draft packs, Momentum Strike. Single offline HTML file.">
<style>:root{
  --bg:#070b17;--bg2:#0b1226;--panel:#101a33;--panel2:#15213f;--line:#22325a;--steel:#5b7bb3;--steel2:#8fa8d6;
  --text:#eaf0ff;--dim:#8d9bc0;--mint:#3df2b5;--mint2:#1fbf8c;--gold:#ffcf3f;--gold2:#ff9f1c;--coral:#ff5a64;--blue:#5ab8ff;--purple:#c77dff;
  --r:14px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.35 var(--sans);overscroll-behavior:none}
body{background:radial-gradient(900px 500px at 50% -180px,#18306a 0%,transparent 60%),radial-gradient(600px 400px at 100% 100%,#0f3a3a 0%,transparent 60%),var(--bg);touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
#app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-top:var(--sat)}
/* ---------- top bar ---------- */
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(7,11,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#topbar .crest{width:34px;height:34px;image-rendering:pixelated;flex:none}
#topbar .who{min-width:0;flex:1}
#topbar .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .who small{color:var(--dim);font-size:11px}
.cur{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-weight:800;font-size:12px;white-space:nowrap}
.cur i{font-style:normal;width:14px;height:14px;border-radius:50%;display:inline-grid;place-items:center;font-size:9px;color:#1a1200}
.cur .c{background:linear-gradient(135deg,#ffe27a,#ffb11f)}
.cur .f{background:linear-gradient(135deg,#8ff3ff,#3d8bff);color:#001428;border-radius:3px;transform:rotate(45deg) scale(.8)}
.cur .f span{transform:rotate(-45deg)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:17px;flex:none}
/* ---------- screens ---------- */
#screen{flex:1;padding:12px 12px calc(84px + var(--sab))}
h1,h2,h3{margin:0}
.title{font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--steel2);margin:16px 2px 8px;display:flex;align-items:center;gap:8px}
.title .sp{flex:1}
.card{background:linear-gradient(180deg,var(--panel) 0%,#0c1530 100%);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;position:relative}
.card.gold{border-color:#7a5b10;box-shadow:0 0 0 1px rgba(255,207,63,.15) inset}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.dim{color:var(--dim)}.mint{color:var(--mint)}.gold-t{color:var(--gold)}.coral{color:var(--coral)}
.small{font-size:12px}.tiny{font-size:11px}
.mono{font-family:var(--mono)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;border:1px solid var(--line);background:#0b1430;color:var(--steel2);white-space:nowrap}
.pill.mint{border-color:#1b6b52;color:var(--mint)}.pill.gold{border-color:#7a5b10;color:var(--gold)}.pill.coral{border-color:#7a2430;color:#ff98a0}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);padding:10px 14px;border-radius:12px;font-weight:800;letter-spacing:.02em;transition:transform .08s,filter .15s;min-height:42px}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.mint{background:linear-gradient(135deg,#3df2b5,#1fbf8c);border:0;color:#02261b}
.btn.gold{background:linear-gradient(135deg,#ffe27a,#ffb11f);border:0;color:#2a1a00}
.btn.coral{background:linear-gradient(135deg,#ff7a84,#ff4757);border:0;color:#2a0004}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 10px;font-size:12px;border-radius:10px}
.btn.block{width:100%}
.battle-btn{display:block;width:100%;border:0;border-radius:18px;padding:18px 12px 16px;font-weight:900;font-size:26px;letter-spacing:.14em;color:#2a1a00;background:linear-gradient(135deg,#fff1a8 0%,#ffcf3f 40%,#ff9f1c 100%);box-shadow:0 10px 30px rgba(255,159,28,.28),0 0 0 1px rgba(255,255,255,.25) inset;text-shadow:0 1px 0 rgba(255,255,255,.5);position:relative;overflow:hidden}
.battle-btn small{display:block;font-size:11px;letter-spacing:.12em;font-weight:800;opacity:.8;margin-top:2px}
.battle-btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.2s infinite}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.battle-btn:disabled{filter:grayscale(.8);opacity:.6}
.battle-btn:disabled::after{display:none}
.bar{height:8px;background:#0a1228;border-radius:8px;overflow:hidden;border:1px solid #1a2a50}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint2),var(--mint));border-radius:8px}
.bar.gold i{background:linear-gradient(90deg,var(--gold2),var(--gold))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;font-weight:800;font-size:12px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.tile .ic{font-size:20px}
.tile .badge{position:absolute;top:6px;right:6px;background:var(--coral);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.vs img,.vs canvas{width:56px;height:56px;image-rendering:pixelated}
.vs .nm{font-weight:900;font-size:13px;margin-top:4px}
.vs .pw{font-family:var(--mono);font-size:12px;color:var(--dim)}
.vs .mid{font-weight:900;color:var(--gold);font-size:18px}
.crest{image-rendering:pixelated}
/* ---------- tab bar ---------- */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(7,11,23,.96);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--sab)}
#tabbar .in{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:720px}
#tabbar button{background:none;border:0;padding:8px 2px 9px;font-size:10px;font-weight:800;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;letter-spacing:.03em;position:relative}
#tabbar button .ic{font-size:19px;line-height:1}
#tabbar button.on{color:var(--mint)}
#tabbar button .badge{position:absolute;top:4px;left:55%;background:var(--coral);color:#fff;border-radius:999px;font-size:9px;padding:0 5px}
/* ---------- tables ---------- */
table.lg{width:100%;border-collapse:collapse;font-size:12px}
table.lg th{color:var(--dim);font-weight:700;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);font-size:11px}
table.lg td{padding:6px 4px;text-align:right;border-bottom:1px solid #16224a;white-space:nowrap}
table.lg td.nm,table.lg th.nm{text-align:left;max-width:150px;overflow:hidden;text-overflow:ellipsis}
table.lg tr.me td{background:rgba(61,242,181,.08);color:#fff;font-weight:800}
table.lg td.pos{width:24px;text-align:center;font-weight:900}
table.lg td.pos.z1{color:var(--gold)}table.lg td.pos.z2{color:var(--mint)}table.lg td.pos.z3{color:var(--steel2)}
table.lg img{width:18px;height:18px;vertical-align:-4px;margin-right:5px;image-rendering:pixelated}
.fx{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid #16224a;font-size:12px}
.fx .a{text-align:right}.fx .s{font-family:var(--mono);font-weight:800;background:#0a1228;border-radius:6px;padding:1px 7px;min-width:52px;text-align:center}
.fx.me{color:#fff;font-weight:800}
.fx .w{color:var(--mint)}
.seg{display:flex;background:#0a1228;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 8px;font-size:12px;font-weight:800;color:var(--dim);white-space:nowrap}
.seg button.on{background:var(--panel2);color:#fff}
/* ---------- upgrades ---------- */
.up{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.up .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:#0a1228;border:1px solid var(--line)}
.up .v{font-family:var(--mono);font-weight:800}
.up .lv{font-size:11px;color:var(--dim)}
/* ---------- star cards ---------- */
.stars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sc{border-radius:14px;padding:8px;background:linear-gradient(180deg,#14213f,#0c1530);border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer}
.sc .pt{width:100%;aspect-ratio:1;image-rendering:pixelated;border-radius:10px;display:block;background:#0a1228}
.sc .ovr{position:absolute;top:12px;left:12px;font-weight:900;font-size:20px;text-shadow:0 2px 0 #000a;line-height:1}
.sc .ovr small{display:block;font-size:9px;letter-spacing:.06em}
.sc .rb{position:absolute;top:12px;right:12px}
.sc .nm{font-weight:900;font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .ab{font-size:11px;color:var(--steel2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .ct{display:flex;justify-content:space-between;font-size:11px;margin-top:4px;color:var(--dim)}
.sc.common{border-color:#55607a}.sc.rare{border-color:#2d6fb3;box-shadow:0 0 0 1px rgba(90,184,255,.2) inset}
.sc.epic{border-color:#7b3fb3;box-shadow:0 0 14px rgba(199,125,255,.2),0 0 0 1px rgba(199,125,255,.25) inset}
.sc.legendary{border-color:#b38a12;box-shadow:0 0 18px rgba(255,207,63,.28),0 0 0 1px rgba(255,207,63,.35) inset;background:linear-gradient(180deg,#2a2410,#121a33 60%)}
.sc.expired{filter:grayscale(.85);opacity:.7}
.sc.act::after{content:"ACTIVE";position:absolute;bottom:8px;right:8px;font-size:9px;font-weight:900;background:var(--mint);color:#02261b;border-radius:6px;padding:1px 5px}
.sc.sel{outline:3px solid var(--gold);outline-offset:-3px}
.r-common{color:#d8dee9}.r-rare{color:var(--blue)}.r-epic{color:var(--purple)}.r-legendary{color:var(--gold)}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{aspect-ratio:3/4;border-radius:10px;border:1px dashed #2a3c6c;background:#0a1228;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--dim);overflow:hidden;position:relative;padding:3px;text-align:center}
.slot img{width:100%;image-rendering:pixelated;border-radius:6px}
.slot b{font-size:10px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot.f{border-style:solid}
/* ---------- packs ---------- */
.pack{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.pack .art{width:72px;height:96px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:11px;letter-spacing:.08em;text-align:center;position:relative;overflow:hidden}
.pack .art::before{content:"★";font-size:34px;display:block;line-height:1}
.pk-standard{background:linear-gradient(160deg,#2b4a86,#152448);border:1px solid #3c63ad;color:#bcd2ff}
.pk-premium{background:linear-gradient(160deg,#6b2fb3,#25124a);border:1px solid #9b5ae0;color:#ead2ff}
.pk-legend{background:linear-gradient(160deg,#ffcf3f,#b36b00);border:1px solid #ffe27a;color:#2a1a00}
.draft{position:fixed;inset:0;z-index:60;background:rgba(4,7,16,.96);display:flex;flex-direction:column;padding:calc(12px + var(--sat)) 12px calc(12px + var(--sab));overflow:auto}
.draft .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:640px;margin:0 auto;width:100%}
.draft .det{max-width:640px;margin:10px auto 0;width:100%}
.flip{animation:flip .5s both}
@keyframes flip{from{transform:rotateY(90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
.opening{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:radial-gradient(circle,#1d2c5a,#04070f 70%)}
.opening .pk{width:150px;height:200px;border-radius:16px;display:grid;place-items:center;font-weight:900;letter-spacing:.1em;animation:shake .9s infinite;box-shadow:0 0 60px currentColor}
.opening .pk::before{content:"★";font-size:70px;display:block}
@keyframes shake{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.06)}}
.opening .burst{position:absolute;width:20px;height:20px;border-radius:50%;animation:burst .7s forwards}
@keyframes burst{to{transform:scale(40);opacity:0}}
/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;z-index:80;background:rgba(3,6,14,.78);display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:16px 14px calc(16px + var(--sab))}
@media(min-width:700px){#modal{align-items:center}#modal .sheet{border-radius:18px}}
#modal h2{font-size:18px;margin-bottom:8px}
#toast{position:fixed;left:50%;top:calc(64px + var(--sat));transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:6px;pointer-events:none;width:min(92vw,420px)}
#toast div{background:#0e1a38;border:1px solid var(--line);border-left:4px solid var(--mint);border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;box-shadow:0 8px 24px #0008;animation:tin .25s}
#toast div.bad{border-left-color:var(--coral)}#toast div.gold{border-left-color:var(--gold)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
/* ---------- battle ---------- */
#battle{position:fixed;inset:0;z-index:50;background:#050810;display:flex;flex-direction:column;padding-top:var(--sat);padding-bottom:var(--sab);user-select:none;-webkit-user-select:none}
#battle .bt-top{display:flex;gap:6px;padding:6px 8px;align-items:center}
#battle .bt-top .lbl{flex:1;font-size:11px;color:var(--dim);font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#battle .bt-top button{min-width:40px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:900;font-size:13px}
#battle .bt-top button.on{border-color:var(--mint);color:var(--mint)}
#stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#stage{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#0d1322;border-radius:6px}
#battle .hud{padding:8px 10px 10px;background:linear-gradient(180deg,#0a1124,#070b17);border-top:1px solid var(--line)}
.mom{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;max-width:560px;margin:0 auto}
.mom .lab{display:flex;justify-content:space-between;font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--steel2);margin-bottom:4px}
.mom .fill{height:12px;background:#0a1228;border:1px solid #1a2a50;border-radius:8px;overflow:hidden}
.mom .fill i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2a5bd7,#3df2b5);transition:width .1s linear}
.mom .fill.ready i{background:linear-gradient(90deg,#ffcf3f,#ff9f1c);animation:pulse .6s infinite alternate}
@keyframes pulse{to{filter:brightness(1.35)}}
.timing{position:relative;height:26px;margin-top:6px;background:#0a1228;border:1px solid #1a2a50;border-radius:8px;overflow:hidden}
.timing .good{position:absolute;left:30%;width:40%;top:0;bottom:0;background:rgba(61,242,181,.18)}
.timing .perf{position:absolute;left:44%;width:12%;top:0;bottom:0;background:rgba(255,207,63,.45);box-shadow:0 0 12px rgba(255,207,63,.6)}
.timing .mk{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 8px #fff;border-radius:2px}
.timing.off{opacity:.35}
.timing .tx{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--dim)}
.strike{width:104px;height:72px;border-radius:16px;border:0;font-weight:900;font-size:17px;letter-spacing:.08em;background:#1a2547;color:#5f6f99}
.strike.ready{background:linear-gradient(135deg,#fff1a8,#ffcf3f 45%,#ff9f1c);color:#2a1a00;box-shadow:0 0 24px rgba(255,207,63,.55);animation:pulse .5s infinite alternate}
.strike small{display:block;font-size:10px;letter-spacing:.04em;margin-top:2px}
.qpop{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-weight:900;font-size:30px;letter-spacing:.08em;pointer-events:none;animation:qpop .9s forwards;text-shadow:0 3px 0 #000,0 0 20px currentColor;white-space:nowrap}
@keyframes qpop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.pausebox{position:absolute;inset:0;background:rgba(3,6,14,.8);display:grid;place-items:center;z-index:5}
.pausebox .in{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px;width:min(86vw,320px);display:grid;gap:8px}
.skiphint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:#fff;background:#0008;border-radius:999px;padding:4px 10px;font-weight:800}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#050810e6;z-index:4;font-weight:900;letter-spacing:.08em}
/* ---------- results ---------- */
.res-hd{text-align:center;padding:10px 0 6px}
.res-hd .big{font-size:44px;font-weight:900;letter-spacing:.1em;line-height:1}
.res-hd .big.win{background:linear-gradient(180deg,#fff1a8,#ffcf3f,#ff9f1c);-webkit-background-clip:text;background-clip:text;color:transparent}
.res-hd .big.loss{color:var(--coral)}
.rew{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.rew div{background:#0a1228;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.rew b{display:block;font-size:20px}
.rew span{font-size:10px;color:var(--dim);font-weight:800;letter-spacing:.06em}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12px}
.kv dt{color:var(--dim)}.kv dd{margin:0;text-align:right;font-family:var(--mono)}
.trophy{font-size:64px;text-align:center;filter:drop-shadow(0 0 20px rgba(255,207,63,.6));animation:pop .6s both}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:12px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* ---------- title / club select ---------- */
.titlescr{text-align:center;padding:20px 8px}
.titlescr canvas{width:min(92vw,520px);image-rendering:pixelated}
.clublist{display:grid;gap:6px;max-height:52vh;overflow:auto;padding-right:2px}
.clubrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:left}
.clubrow.sel{border-color:var(--mint);background:#0f2a2a}
.clubrow canvas,.clubrow img{width:32px;height:32px;image-rendering:pixelated}
input.search{width:100%;background:#0a1228;border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--text);font:inherit;outline:none}
input.search:focus{border-color:var(--mint)}
input[type=range]{width:100%;accent-color:var(--mint)}
.setrow{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.chk{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px}
.chk input{width:20px;height:20px;accent-color:var(--mint)}
.medal{font-size:20px}

  save.claims[id] = save.txn = (save.txn || 0) + 1;
  fn();
  return true;
}

// ======================= ArcadeUpgrades =======================
const Upgrades = {

  stats(save) { const o = {}; for (const k of STAT_KEYS) o[k] = Upgrades.value(k, save.upgrades[k]); return o; },
  // 5 arcade stats -> the 10 real V4 battle attributes
  attributes(st) {

    return {
      attack: r(st.attack), defense: r(st.defense), speed: r(st.speed), pressing: r((st.speed + st.defense + st.stamina) / 3), stamina: r(st.stamina),
      teamwork: r((st.technique + st.stamina) / 2), physical: r((st.defense + st.stamina) / 2), technique: r(st.technique),
      goalkeeping: r((st.defense + st.technique) / 2), finishing: r((st.attack + st.technique) / 2)

  },
  power(save) { const a = Upgrades.attributes(Upgrades.stats(save)); let m = 0; for (const k of E.ATTRS) m += a[k]; return Math.round(m / E.ATTRS.length * 10) / 10; },
  buy(save, key) {

// ======================= ArcadeProgression (Team XP / Level 1-50) =======================
const Progression = {
  MAX: 50, MILESTONES,
  xpToNext(level) { return 40 + 6 * (level - 1); },
  totalTo(level) { let t = 0; for (let l = 1; l < level; l++) t += Progression.xpToNext(l); return t; },
  levelCredits(n) { return 15 + 5 * n; },
  addXP(save, n, out) {
    if (save.level >= 50 || !n) return;
    save.xp += n;
    while (save.level < 50 && save.xp >= Progression.totalTo(save.level + 1)) {
      const nl = save.level + 1; save.level = nl;
      tx(save, 'lvl:' + nl, () => {
        const r = { credits: Progression.levelCredits(nl) }; applyReward(save, r, out);
        if (out) (out.levelUps = out.levelUps || []).push(nl);
        const ms = MILESTONES[nl];
        if (ms) tx(save, 'ms:' + nl, () => { applyReward(save, ms, out); if (out) (out.milestones = out.milestones || []).push(nl); });
      });
    }
    if (save.level >= 50) save.xp = Progression.totalTo(50);
  },
  progress(save) { if (save.level >= 50) return { cur: 1, need: 1, pct: 1 }; const base = Progression.totalTo(save.level), need = Progression.xpToNext(save.level); return { cur: save.xp - base, need, pct: (save.xp - base) / need }; }
};

};

// ======================= ArcadeStars =======================
const STAR_BY = new Map(DATA.STARS.map(s => [s.id, s]));
const Stars = {
  defs: DATA.STARS, def: id => STAR_BY.get(id), TIER: RARITY_TIER,

    if (sameRole >= PLAYER_ROLES[d.role]) return 'Only ' + PLAYER_ROLES[d.role] + ' ' + d.role + ' slot in the squad';

    save.active.splice(i, 1); if (Stars.canEquip(save, newId)) { save.active.splice(i, 0, oldId); return false; }
    save.active.splice(i, 0, newId); return true;

  },

};

// ======================= ArcadeDraft (Three-Star Draft Pack) =======================
function ovrRange(div, rarity) {
  const keys = [10, 7, 4, 1];
  if (OVR_REF[div]) return OVR_REF[div][rarity];
  for (let i = 0; i < 3; i++) { const a = keys[i], b = keys[i + 1]; if (div < a && div > b) { const t = (a - div) / (a - b), A = OVR_REF[a][rarity], B = OVR_REF[b][rarity]; return [Math.round(A[0] + (B[0] - A[0]) * t), Math.round(A[1] + (B[1] - A[1]) * t)]; } }
  return OVR_REF[10][rarity];
}
const Draft = {
  PACKS, ovrRange,
  unlocked(save, type) { return save.highestDiv <= PACKS[type].unlockDiv; },
  // pay = 'credits' | 'frags' | 'inventory'
  canOpen(save, type, pay) {
    if (save.pendingDraft) return 'Pick a star from your open draft first';
    if (!Draft.unlocked(save, type)) return 'Unlocks in Division ' + PACKS[type].unlockDiv;
    if (pay === 'credits' && save.credits < PACKS[type].credits) return 'Not enough Credits';
    if (pay === 'frags' && save.fragments < PACKS[type].frags) return 'Not enough Pack Fragments';
    if (pay === 'inventory' && !(save.packs[type] > 0)) return 'No unopened pack';
    return null;
  },
  // atomic: payment + RNG + pity + pending candidates are written together (then persisted by the caller)
  open(save, type, pay) {
    if (Draft.canOpen(save, type, pay)) return null;
    const n = ++save.packCounter, P = PACKS[type];
    const rng = newRng(save, 'pack:' + n);
    let rar = P.slots.map(t => rollTable(rng, t));
    let pityHit = false;
    if (P.pity && save.pity[type] >= P.pity && rar.indexOf('legendary') < 0) { rar[2] = 'legendary'; pityHit = true; }
    const cands = [], usedIds = new Set();
    for (let i = 0; i < 3; i++) {
      const pool = DATA.STARS.filter(s => s.rarity === rar[i] && !usedIds.has(s.id));
      const d = pool[rng.int(pool.length)]; usedIds.add(d.id); cands.push(d);
    }
    if (new Set(cands.map(c => c.role)).size < 2) { // guarantee at least two positions
      const pool = DATA.STARS.filter(s => s.rarity === rar[0] && s.role !== cands[1].role && !usedIds.has(s.id));
      cands[0] = pool[rng.int(pool.length)];
    }
    const out = cands.map(d => {
      const cr = CONTRACT[d.rarity], contract = cr[0] + rng.int(cr[1] - cr[0] + 1);
      const or = ovrRange(save.highestDiv, d.rarity), ovr = or[0] + rng.int(or[1] - or[0] + 1);
      const owned = save.stars[d.id];
      return { id: d.id, rarity: d.rarity, contract, ovr: owned ? owned.ovr : ovr, rolledOvr: ovr, dup: !!owned };
    });
    if (P.pity) save.pity[type] = out.some(c => c.rarity === 'legendary') ? 0 : save.pity[type] + 1;
    if (pay === 'credits') save.credits -= P.credits; else if (pay === 'frags') save.fragments -= P.frags; else save.packs[type]--;
    save.pendingDraft = { n, type, pay, cands: out, pityHit, at: Date.now() };
    return save.pendingDraft;
  },
  pick(save, idx) {
    const D = save.pendingDraft; if (!D || !D.cands[idx]) return null;
    const c = D.cands[idx]; let res = null;
    tx(save, 'draft:' + D.n, () => {
      const owned = save.stars[c.id];
      if (owned) { owned.contract += c.contract; res = { merged: true, id: c.id, added: c.contract, total: owned.contract }; }
      else { save.stars[c.id] = { id: c.id, ovr: c.ovr, contract: c.contract, rarity: c.rarity, got: Date.now(), battles: 0 }; res = { merged: false, id: c.id, total: c.contract }; }
      save.pendingDraft = null;
    });
    return res;
  }
};

// ======================= ArcadeLeague =======================
function roundRobin(ids, rng) {
  const t = ids.slice();
  for (let i = t.length - 1; i > 0; i--) { const j = rng.int(i + 1); const x = t[i]; t[i] = t[j]; t[j] = x; }
  const n = t.length, rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const m = [];
    for (let i = 0; i < n / 2; i++) m.push([t[i], t[n - 1 - i]]);
    rounds.push(m);
    t.splice(1, 0, t.pop()); // circle method: first fixed
  }
  return rounds;
}
const League = {
  BAND,
  assignDivisions(save) {
    const others = clubs().filter(c => c.id !== save.club).sort((a, b) => b.power - a.power || (a.id < b.id ? -1 : 1));
    const div = [];
    for (let d = 0; d < 9; d++) div.push(others.slice(d * 20, d * 20 + 20).map(c => c.id));
    div.push(others.slice(180).map(c => c.id).concat([save.club]));
    save.divisions = div;
  },
  divClubs(save, d) { return save.divisions[d - 1]; },
  // arcade rating of an AI club in a division: band position by source strength + small seasonal variation
  rating(save, id, d, seasonId) {
    if (id === save.club) return Upgrades.power(save);
    const list = save.divisions[d - 1].filter(x => x !== save.club).map(x => club(x)).sort((a, b) => a.power - b.power || (a.id < b.id ? -1 : 1));
    const i = list.findIndex(c => c.id === id), f = list.length > 1 ? i / (list.length - 1) : 0.5;
    const b = BAND[d], jit = d === 1 ? 2.5 : 1.2;
    const v = b[0] + (b[1] - b[0]) * f + (((hashStr(seasonId + '|' + id) % 1000) / 1000) * 2 - 1) * jit;
    return Math.round(clamp(v, b[0], b[1]) * 10) / 10;
  },
  newSeason(save, d) {
    save.seasonNo++;
    const seasonId = 'S' + save.seasonNo + '-D' + d;
    const ids = save.divisions[d - 1].slice();
    const rng = newRng(save, 'season:' + seasonId);
    const rounds = roundRobin(ids, rng);
    // Division 1 endless: per-season tactical variation of AI clubs (identity kept)
    const tactics = {};
    if (d === 1) { const arch = ['high_press', 'possession', 'counter', 'defensive_block', 'wing_attack', 'physical']; for (const id of ids) if (id !== save.club && rng.next() < 0.3) tactics[id] = arch[rng.int(arch.length)]; }
    save.league = { seasonId, div: d, rounds, round: 0, results: {}, aiQueue: [], phase: 'regular', tactics, endRank: 0, startedAt: Date.now() };
    save.promo = null;
    return save.league;
  },
  fixtureId(L, r, a, b) { return L.seasonId + ':R' + (r + 1) + ':' + a + '>' + b; },
  playerFixture(save, r) {
    const L = save.league; if (r == null) r = L.round; if (r >= 19) return null;
    const m = L.rounds[r].find(x => x[0] === save.club || x[1] === save.club);
    const opp = m[0] === save.club ? m[1] : m[0];
    return { id: League.fixtureId(L, r, m[0], m[1]), round: r, opp, pair: m };
  },
  table(save) {
    const L = save.league, rows = {};
    for (const id of save.divisions[L.div - 1]) rows[id] = { id, p: 0, w: 0, l: 0, pts: 0, gf: 0, ga: 0, sd: 0 };
    for (const fid in L.results) {
      const r = L.results[fid]; const A = rows[r.a], B = rows[r.b]; if (!A || !B) continue;
      A.p++; B.p++; A.gf += r.ga; A.ga += r.gb; B.gf += r.gb; B.ga += r.ga;
      if (r.winner === 0) { A.w++; A.pts += 3; B.l++; A.sd += r.surv; B.sd -= r.surv; } else { B.w++; B.pts += 3; A.l++; B.sd += r.surv; A.sd -= r.surv; }
    }
    const tb = id => hashStr(L.seasonId + '#' + id);
    return Object.values(rows).sort((x, y) => y.pts - x.pts || y.w - x.w || (y.gf - y.ga) - (x.gf - x.ga) || y.sd - x.sd || y.gf - x.gf || tb(x.id) - tb(y.id));
  },
  rank(save) { return League.table(save).findIndex(r => r.id === save.club) + 1; },
  // AI fixtures of a round become jobs (simulated for real by ArcadeBattleAdapter, headless)
  queueRound(save, r) {

  },
  aiJob(save) {

  },

// ======================= ArcadeChallenges =======================
const Challenges = {

  key: (d, k) => 'D' + d + ':' + k,
  unlocked(save, d) { return !!save.challenges.unlocked[d]; },
  rewardFirst(d, kind) { return { credits: Math.round(WIN_C[d] * CH_INFO[kind].mul), xp: 30, frags: 3 }; },
  rewardRepeat(d) { return { credits: Math.round(WIN_C[d] * 0.25) }; },
  medalBonus(d, medal) { return medal === 2 ? { credits: roundTo5(WIN_C[d] / 6), frags: 1 } : medal === 3 ? { credits: roundTo5(WIN_C[d] / 3), frags: 1 } : null; },
  oppStars(d) { return d <= 2 ? 5 : d <= 4 ? 4 : d <= 6 ? 3 : d <= 8 ? 2 : 1; },
  opponent(save, d, kind) {
    const ids = save.divisions[d - 1].filter(x => x !== save.club);
    const sid = 'CH:' + d + ':' + kind;
    const ratings = ids.map(id => ({ id, r: League.rating(save, id, d, 'challenge') })).sort((a, b) => b.r - a.r || (a.id < b.id ? -1 : 1));
    const avg = ratings.reduce((m, x) => m + x.r, 0) / ratings.length;
    if (kind === 'power') return { id: ratings[0].id, rating: Math.round((avg + 4) * 10) / 10 };

  },
  medal(won, surv) { return !won ? 0 : surv >= 30 ? 3 : surv >= 15 ? 2 : 1; },
  // returns reward summary; never touches league standings
  record(save, d, kind, won, surv, out) {
    const k = Challenges.key(d, kind); const st = save.challenges.done[k] || (save.challenges.done[k] = { won: false, medal: 0, plays: 0, wins: 0 });

};

// ======================= ArcadeEndgame / season flow =======================

let draftSel = 0;
function showDraft(animate) {
  const s = st.save, Dd = s.pendingDraft; if (!Dd) return;
  let box = $('draftBox'); if (!box) { box = document.createElement('div'); box.id = 'draftBox'; box.className = 'draft'; document.body.appendChild(box); }

    box.innerHTML = '<div style="text-align:center;margin-bottom:10px"><div class="tiny dim" style="font-weight:900;letter-spacing:.14em">' + Dd.type.toUpperCase() + ' DRAFT PACK' + (Dd.pityHit ? ' · PITY LEGENDARY' : '') + '</div><h2 style="font-size:20px;margin-top:2px">CHOOSE ONE STAR</h2></div>' +
      '<div class="cards">' + Dd.cands.map((x, i) => starCardHTML(x.id, x.ovr, x.contract, { draft: true, dup: x.dup, sel: i === draftSel, anim, attr: 'data-pick="' + i + '"', style: anim ? 'animation-delay:' + (i * 0.18) + 's' : '' })).join('') + '</div>' +
      '<div class="det card ' + d.rarity + '"><div class="row"><img src="' + portrait(c.id) + '" style="width:56px;height:56px;image-rendering:pixelated;border-radius:10px" alt=""><div class="grow"><div style="font-weight:900;font-size:16px">' + esc(d.name) + (d.nick ? ' <span class="tiny dim">“' + esc(d.nick) + '”</span>' : '') + '</div><div class="small">' + rarityPill(d.rarity) + ' <span class="pill">' + ROLE_N[d.role] + '</span> <span class="pill gold">OVR ' + c.ovr + '</span></div></div></div>' +
      '<div style="margin-top:8px"><b>' + esc(ABIL[d.ability][0]) + ' ' + TIER_N[A.Stars.TIER[d.rarity]] + '</b> <span class="tiny dim">(auto, max 2 uses per battle)</span><div class="small dim">' + esc(ABIL[d.ability][1]) + '</div></div>' +
      '<div class="small" style="margin-top:6px">📝 Contract: <b>' + c.contract + ' matches</b>' + (owned ? ' — <span class="gold-t">DUPLICATE: adds to your existing card (' + owned.contract + ' → ' + (owned.contract + c.contract) + '), OVR stays ' + owned.ovr + '</span>' : '') + '</div>' +
      '<button class="btn gold block" style="margin-top:10px" data-sign="1">SIGN ' + esc(d.name.toUpperCase()) + '</button></div>';
  };
  draftSel = Math.min(draftSel, 2);
  if (animate) {
    const ov = document.createElement('div'); ov.className = 'opening';
    const col = { standard: '#5a8cff', premium: '#c77dff', legend: '#ffcf3f' }[Dd.type];
    ov.innerHTML = '<div class="pk pk-' + Dd.type + '" style="color:' + col + '">' + Dd.type.toUpperCase() + '</div><div class="skiphint">tap to skip</div>';
    document.body.appendChild(ov);
    AU.play('pack_' + Dd.type, 0.7); AU.vibrate(30);
    let done = false;
    const finish = () => {
      if (done) return; done = true; ov.remove(); drawCards(true);
      const best = Dd.cands.reduce((m, x) => Math.max(m, A.RARITIES.indexOf(x.rarity)), 0);
      AU.play('rev_' + A.RARITIES[best], 0.7); if (best >= 3) AU.vibrate([40, 40, 80]);
    };
    ov.onclick = finish; setTimeout(() => { if (!done) { const b = document.createElement('div'); b.className = 'burst'; b.style.background = col; ov.appendChild(b); } }, 1700); setTimeout(finish, 2400);
  } else drawCards(false);
  box.onclick = e => {
    const p = e.target.closest('[data-pick]'); if (p) { draftSel = +p.dataset.pick; AU.ui(); drawCards(false); return; }
    if (e.target.closest('[data-sign]')) {

      draftSel = 0; render();
    }
  };
}

// ======================= actions =======================
function onAct(act, el) {
  const s = st.save;
  AU.init();
  if (act.startsWith('tab:')) { AU.ui(); return go(act.slice(4)); }
  if (act === 'fullscreen') return toggleFull();
  if (act === 'settings') return settingsModal();
  if (act === 'import') return importSave();
  if (act.startsWith('lsub:')) { st.sub.league = act.slice(5); return render(); }
  if (act.startsWith('cf:')) { st.sub.coll = act.slice(3); return render(); }
  if (act.startsWith('cs:')) { st.sub.sort = act.slice(3); return render(); }
  if (act.startsWith('chd:')) { st.sub.chDiv = +act.slice(4); return render(); }
  if (act.startsWith('up:')) { if (A.Upgrades.buy(s, act.slice(3))) { AU.play('upgrade', 0.6); AU.vibrate(15); persist(); render(); } return; }
  if (act.startsWith('open:')) {
    const [, type, pay] = act.split(':'); const why = A.Draft.canOpen(s, type, pay); if (why) { toast(why, 'bad'); return; }
    const res = A.Draft.open(s, type, pay); persist(); renderTop(); if (res) { draftSel = 0; showDraft(true); } return;
  }
  if (act === 'draft') { showDraft(false); return; }
  if (act === 'league') return startBattle('league', { attempt: 1 });
  if (act === 'quick') return startBattle('league', { attempt: 1 }, true);
  if (act === 'resume') return resumeBattle();
  if (act === 'rematch') return startBattle('league', { attempt: 2 });
  if (act === 'acceptloss') { const out = A.Battle.acceptLoss(s); persist(); toast('Loss accepted · ' + (out ? '+' + out.credits + ' C · +' + out.xp + ' XP' : ''), ''); afterOfficial(out); render(); return; }
  if (act === 'promote') { const out = A.Endgame.promote(s); persist(); AU.play('trophy', 0.7); celebrate(); toast('Welcome to ' + (s.division === 1 ? 'the Champions League (Division 1)' : 'Division ' + s.division) + '!', 'gold'); if (out) rewardsToast(out); render(); startAI(); return; }
  if (act === 'promo') { A.Endgame.promoStart(s); persist(); return startBattle('promo', {}); }
  if (act === 'replayseason') { confirmBox('Replay this Division ' + s.league.div + ' season? A fresh 19-match fixture list starts (fixture rewards are per new fixture).', () => { A.Endgame.replaySeason(s); persist(); render(); startAI(); }); return; }
  if (act === 'newseason') { A.Endgame.nextEndless(s); persist(); toast('New Champions League season!', 'gold'); render(); startAI(); return; }
  if (act.startsWith('ch:')) { const [, dd, k] = act.split(':'); return startBattle('challenge', { div: +dd, kind: k }); }
}
function rewardsToast(r) { const t = rewardLine(r).replace(/<[^>]+>/g, ''); if (t) toast(t, 'gold', 3500); }
function confirmBox(text, yes) { modal('<h2>Are you sure?</h2><p class="small">' + esc(text) + '</p><div class="grid2"><button class="btn ghost" data-m="no">Cancel</button><button class="btn coral" data-m="yes">Confirm</button></div>', m => { closeModal(); if (m === 'yes') yes(); }); }

// ======================= battle (ArcadeBattleAdapter + ArcadeMomentum UI) =======================
function startBattle(kind, ctx, quick) {
  const s = st.save;
  if (st.battle) return;
  if (s.pendingBattle) return resumeBattle();
  if (kind === 'league' && (s.league.phase !== 'regular' || s.league.round >= 19)) return;
  if (kind === 'league' && ctx.attempt === 2 && !s.pendingDecision) return;
  if (kind === 'league' && ctx.attempt === 1 && s.pendingDecision) return;
  stopAI();
  const snap = A.Battle.snapshot(s, kind, ctx);
  A.Battle.begin(s, snap); persist();
  if (quick) return quickSim(snap);
  liveBattle(snap, null);
}
function resumeBattle() {
  const P = st.save.pendingBattle; if (!P) return;
  stopAI();
  liveBattle(P.snap, { inputs: P.inputs || [], lastTick: P.lastTick || 0 });
}
function quickSim(snap) {
  modal('<h2>Quick Simulate</h2><p class="small dim">Running the real 100 vs 100 battle (automatic Momentum Strikes for both teams)…</p><div class="bar"><i id="qsBar" style="width:0"></i></div>');
  const w = E.createWorld(A.Battle.worldOpts(snap, { headless: true, auto: true }));
  st.battle = { quick: true };
  const stepf = () => {
    const done = A.Battle.runSlice(w, 400); const b = $('qsBar'); if (b) b.style.width = Math.min(100, w.t / 50 * 100) + '%';
    if (!done) { setTimeout(stepf, 0); return; }
    st.battle = null; closeModal(); finishBattle(snap, A.Battle.result(w));
  };
  setTimeout(stepf, 30);
}
function fitStage() {
  const B = st.battle; if (!B || !B.cv) return;
  const wrap = $('stageWrap'), r = wrap.getBoundingClientRect();
  let h = r.height - 4, w = h * 9 / 16; if (w > r.width - 4) { w = r.width - 4; h = w * 16 / 9; }
  const dpr = Math.min(root.devicePixelRatio || 1, QUALITY[st.save.settings.quality].dpr);
  const k = Math.max(1, Math.min(4, Math.round(h * dpr / 640)));
  B.cv.width = 360 * k; B.cv.height = 640 * k; B.cv.style.width = Math.floor(w) + 'px'; B.cv.style.height = Math.floor(h) + 'px';
}
function liveBattle(snap, resume) {
  const s = st.save, set = s.settings, q = QUALITY[set.quality] || QUALITY.medium;
  AU.init(); AU.apply(Object.assign({}, set));
  const bt = $('battle'); bt.classList.remove('hidden'); document.body.style.overflow = 'hidden';
  $('btLabel').textContent = snap.label;
  const w = E.createWorld(A.Battle.worldOpts(snap, { fxLevel: q.fx, inputs: resume ? resume.inputs : [] }));
  w.observer = D.createObserver({ smartCam: true, intensity: 'normal', epicFinale: true, mvpStreaks: true, fbAlerts: true, fbFollow: true });
  const teams = [snap.teamA, snap.teamB];
  const hc = S.color.cdist(S.color.vivid(teams[0].visual.primary_color), S.color.vivid(teams[1].visual.primary_color)) < 210;
  const kits = S.makeKits(teams[0], teams[1], 210);
  const atlases = [S.buildAtlas(teams[0], kits[0]), S.buildAtlas(teams[1], kits[1])];
  const logos = teams.map((t, i) => ({ small: crestCv(t.id, 26, i === 0 && s.goldenCrest), big: crestCv(t.id, 96, i === 0 && s.goldenCrest) }));
  const renderer = R.createRenderer({ world: w, teams, kits, atlases, logos, lang: 'en', labels: true, story: true, hc, fxLevel: q.fx, v3: { vfx: true, finale: true, mvp: true, momentum: false }, modeLabel: snap.label.toUpperCase(), fictional: false });
  const cv = $('stage'); const ctx = cv.getContext('2d');
  const B = st.battle = { snap, w, renderer, cv, ctx, paused: false, speed: set.speed === 2 ? 2 : 1, cam: set.smartCam !== false, last: performance.now(), evI: 0, savedTick: resume ? resume.lastTick : 0, waitInput: false, autoQ: false, ended: false, skip: false, ff: !!(resume && resume.lastTick > 0), usedSeen: 0 };
  fitStage(); updateBattleButtons();
  $('btLoading').classList.toggle('hidden', !B.ff);
  AU.battleStart();
  const ff = () => { // resume: recompute silently up to the last safe tick (same seed, snapshot and Momentum inputs)
    let n = 0; while (w.tick < resume.lastTick && n++ < 400) E.step(w);
    B.evI = w.events.length; B.usedSeen = w.arc.used.length;
    if (w.tick < resume.lastTick) { $('btLoading').textContent = 'RESTORING BATTLE… ' + Math.round(w.tick / resume.lastTick * 100) + '%'; setTimeout(ff, 0); return; }
    B.ff = false; $('btLoading').classList.add('hidden'); B.last = performance.now(); B.raf = requestAnimationFrame(frame);
  };
  const frame = now => {
    if (st.battle !== B) return;

    if (!B.paused) {

      E.advanceTo(w, w.t + dt * B.speed);
    }
    if (!B.cam) { w.cam.x = 180; w.cam.y = E.MIDY; w.cam.z = 1; }
    renderer.render(ctx, w.t, cv.width, cv.height);
    battleEvents(B);
    momentumHUD(B);

    if (!B.paused && w.phase === 'battle' && w.tick - B.savedTick >= 120) saveProgress(B);

function saveProgress(B) { const P = st.save.pendingBattle; if (!P || P.snap.battleId !== B.snap.battleId) return; P.inputs = B.w.arc.log.slice(); P.lastTick = B.w.tick; B.savedTick = B.w.tick; Store.write(); }
function battleEvents(B) {
  const w = B.w, ev = w.events, EV = E.EV, names = Object.keys(E.SPECIAL_NAMES);
  for (; B.evI < ev.length; B.evI++) {
    const e = ev[B.evI];
    if (e.type === EV.SPECIAL_FIRE) AU.play('ab_' + names[e.c], e.a === 0 ? 0.5 : 0.35, 0, 1);
    else if (e.type === EV.STAR_SPECIAL && e.a === 0) AU.vibrate(20);
    else if (e.type === EV.MOM_READY && e.a === 0) { AU.play('mom_ready', 0.6); AU.vibrate(25); }
    else if (e.type === EV.GOAL) AU.vibrate(e.b === 0 ? [50, 30, 50] : 30);
  }
  const U = w.arc.used;
  for (; B.usedSeen < U.length; B.usedSeen++) {
    const m = U[B.usedSeen];
    if (m.side !== 0) { qpop('RIVAL STRIKE', '#ff8a8a'); continue; }
    B.waitInput = false; B.autoQ = false;
    const txt = m.q === 'perfect' ? 'PERFECT!' : m.q === 'good' ? 'GOOD!' : 'STRIKE';
    qpop(txt + ' · ' + m.mode.toUpperCase(), m.q === 'perfect' ? '#ffcf3f' : m.q === 'good' ? '#3df2b5' : '#bfe4ff');
    AU.play('mom_' + m.q, 0.8); AU.vibrate(m.q === 'perfect' ? [30, 30, 90] : m.q === 'good' ? 50 : 25);
    saveProgress(B);
  }
}

    '<details class="card small"><summary style="font-weight:800;cursor:pointer">Match stats</summary><div class="kv" style="margin-top:8px">' +
    (fb ? '<dt>Possession</dt><dd>' + fb.possession.join(' / ') + ' %</dd><dt>Shots (on target)</dt><dd>' + fb.shots[0] + ' (' + fb.onTarget[0] + ') / ' + fb.shots[1] + ' (' + fb.onTarget[1] + ')</dd><dt>Saves</dt><dd>' + fb.saves.join(' / ') + '</dd><dt>Passes</dt><dd>' + fb.passes.join(' / ') + '</dd><dt>Interceptions</dt><dd>' + fb.intercepts.join(' / ') + '</dd>' : '') +
    '<dt>K.O.s</dt><dd>' + (res.kills ? res.kills.join(' / ') : '-') + '</dd><dt>Battle time</dt><dd>' + (res.battleSeconds || 0).toFixed(1) + ' s</dd><dt>Your Momentum Strikes</dt><dd>' + res.momentum.filter(m => m.side === 0).map(m => m.q[0].toUpperCase()).join(' ') + '</dd><dt>Rival strikes</dt><dd>' + res.momentum.filter(m => m.side === 1).length + '</dd>' + (res.abandoned ? '<dt>Note</dt><dd>abandoned</dd>' : '') + '</div></details>' +
    (out.canRematch ? '<div class="grid2"><button class="btn ghost" data-m="accept">Accept loss</button><button class="btn gold" data-m="rematch">REMATCH</button></div>' : '<button class="btn gold block" data-m="next">' + (out.kind === 'league' ? 'NEXT MATCH' : 'CONTINUE') + '</button>');
  modal(html, m => {
    if (m === 'rematch') { closeModal(); startBattle('league', { attempt: 2 }); return; }
    if (m === 'accept') { const o2 = A.Battle.acceptLoss(s); persist(); closeModal(); if (o2) rewardsToast(o2); afterOfficial(o2); render(); return; }
    if (m === 'next') { closeModal(); afterOfficial(r); if (out.kind === 'promo' && out.promo && out.promo.done && out.promo.success) { celebrate(); } go('home'); }
  });
  if (won) celebrate(12);
  render();
}
function celebrate(n) {
  const c = document.createElement('div'); c.className = 'confetti'; const cols = ['#ffcf3f', '#3df2b5', '#5ab8ff', '#ff5a64', '#ffffff'];
  for (let i = 0; i < (n || 40); i++) { const p = document.createElement('i'); p.style.left = Math.random() * 100 + '%'; p.style.background = cols[i % 5]; p.style.animationDelay = Math.random() * 0.6 + 's'; p.style.animationDuration = 1.6 + Math.random() * 1.4 + 's'; c.appendChild(p); }
  document.body.appendChild(c); setTimeout(() => c.remove(), 3400);
}

// ======================= season end / championship =======================
function checkSeasonEnd() {
  const s = st.save; if (!s || st.battle) return;
  if (s.league.phase !== 'regular' || !A.League.seasonComplete(s)) return;
  if (!$('modal').classList.contains('hidden') || $('draftBox') || document.querySelector('.opening')) { setTimeout(checkSeasonEnd, 1200); return; } // never cover an open result/draft
  const out = A.Endgame.closeSeason(s); persist(); if (!out) return;
  const t = A.League.table(s).slice(0, 3);
  const champ = out.rank === 1;
  if (champ) { AU.play('trophy', 0.8); celebrate(60); AU.vibrate([80, 50, 80, 50, 160]); }
  const head = out.div === 1 ? (champ ? 'CHAMPIONS LEAGUE WINNERS!' : 'SEASON COMPLETE') : champ ? 'DIVISION ' + out.div + ' CHAMPIONS!' : out.rank <= 3 ? 'PROMOTED!' : 'SEASON COMPLETE';
  const next = out.phase === 'promoted' ? '<button class="btn gold block" data-m="promote">ADVANCE TO DIVISION ' + (out.div - 1) + '</button>' : out.phase === 'promo' ? '<p class="small">You finished <b>#' + out.rank + '</b>. Win the <b>Promotion Challenge</b> (best of 3 vs Division ' + (out.div - 1) + ' sides) to move up. You can retry as often as you like.</p><button class="btn gold block" data-m="close">TO THE PROMOTION CHALLENGE</button>' : '<button class="btn gold block" data-m="close">CONTINUE</button>';
  modal('<div style="text-align:center">' + (champ || out.phase === 'promoted' ? '<div class="trophy">🏆</div>' : '<div class="trophy" style="filter:none">📋</div>') + '<h2 style="font-size:22px">' + head + '</h2><div class="dim small">Final position: #' + out.rank + ' of 20</div>' +
    (out.firstTitle ? '<div class="card gold" style="margin-top:10px"><b class="gold-t">FIRST DIVISION 1 TITLE!</b><br>Legend Draft Pack + Golden Team Crest unlocked.</div>' : '') + '</div>' +
    '<div class="card" style="margin-top:10px">' + t.map((r, i) => '<div class="fx' + (r.id === s.club ? ' me' : '') + '"><div class="a">' + ['🥇', '🥈', '🥉'][i] + ' ' + esc(A.club(r.id).displayName) + '</div><div class="s">' + r.pts + ' pts</div><div class="tiny dim">' + r.w + 'W ' + r.l + 'L</div></div>').join('') + '</div>' +
    (rewardLine(out) ? '<p class="small" style="text-align:center">' + rewardLine(out) + '</p>' : '') + next, m => {
    if (m === 'promote') { closeModal(); onAct('promote'); return; }
    closeModal(); render();
  });
  render();
}

// ======================= background AI league simulation =======================
function startAI() { if (st.ai.timer) return; st.ai.timer = setTimeout(aiTick, 300); }
function stopAI() { clearTimeout(st.ai.timer); st.ai.timer = 0; }
function aiTick() {
  st.ai.timer = 0;
  const s = st.save; if (!s || st.battle) return;
  const L = s.league;
  if (!L.aiQueue.length) { st.ai.w = null; checkSeasonEnd(); return; }
  if (!st.ai.w || !st.ai.job || st.ai.job.fixtureId !== L.aiQueue[0] || st.ai.job.seasonId !== L.seasonId) { st.ai.job = A.League.aiJob(s); st.ai.w = E.createWorld(A.Battle.aiOpts(s, st.ai.job)); }
  const t0 = performance.now(); let done = false;
  while (!done && performance.now() - t0 < 12) done = A.Battle.runSlice(st.ai.w, 60);
  if (done) {
    A.League.applyAI(s, st.ai.job, A.Battle.result(st.ai.w)); st.ai.w = null; st.ai.job = null; persist();
    if (!$('modal').classList.contains('hidden') || document.getElementById('draftBox')) { /* keep modal */ } else if (st.tab === 'home' || st.tab === 'league') render();
  }
  st.ai.timer = setTimeout(aiTick, done ? 30 : 8);
}

// ======================= settings / export / import =======================
function settingsModal() {
  const s = st.save, set = s ? s.settings : { master: 0.8, music: 0.5, sfx: 0.8, crowd: 0.6, mute: false, vibration: true, quality: 'medium', speed: 1, smartCam: true };
  const sl = (k, n) => '<div class="setrow"><span>' + n + '</span><input type="range" min="0" max="100" value="' + Math.round(set[k] * 100) + '" data-set="' + k + '"><span class="mono small">' + Math.round(set[k] * 100) + '</span></div>';
  const lic = root.FW_MASTER_DB.metadata.sources.find(x => x.license) || {};
  modal('<h2>Settings</h2>' + sl('master', 'Master volume') + sl('music', 'Music') + sl('sfx', 'Battle SFX') + sl('crowd', 'Crowd & ambience') +
    '<label class="chk"><input type="checkbox" data-set="mute"' + (set.mute ? ' checked' : '') + '> Mute all sound</label>' +
    '<label class="chk"><input type="checkbox" data-set="vibration"' + (set.vibration ? ' checked' : '') + '> Vibration (if supported)</label>' +
    '<label class="chk"><input type="checkbox" data-set="smartCam"' + (set.smartCam !== false ? ' checked' : '') + '> Smart battle camera</label>' +
    '<div class="setrow"><span>Graphics</span><div class="seg" style="grid-column:span 2">' + ['low', 'medium', 'high'].map(q => '<button data-m="q:' + q + '" class="' + (set.quality === q ? 'on' : '') + '">' + q[0].toUpperCase() + q.slice(1) + '</button>').join('') + '</div></div>' +
    '<p class="note">Low keeps all 100 vs 100 players — it only reduces particles, shake and pixel density. Battle results never depend on graphics, sound or speed.</p>' +
    (s ? '<div class="title">Save</div><div class="grid2"><button class="btn" data-m="export">Export Save (JSON)</button><button class="btn" data-m="import">Import Save</button></div>' +
      '<p class="note">' + (st.storageOk ? 'Autosave is ON (browser storage, with a backup copy).' : '<span class="coral">Autosave is NOT working in this browser.</span>') + ' Browser storage can be cleared by the browser — export a file now and then.</p>' +
      '<button class="btn coral block" data-m="reset" style="margin-top:6px">Delete career…</button>' : '') +
    '<div class="title">About</div><p class="note">FOOTBALL WARS — ARCADE REBORN · built on the Football Wars V4 deterministic 100v100 Football Fusion engine. Independent fan game: adapted club names, original pixel crests/kits, fictional stars; no official logos, sponsors, licensed kits or real player names/portraits. Not affiliated with any club or league. Club strength source: ' + esc(lic.attribution_required || 'beyondELO') + ' (' + esc(lic.license || 'CC BY 4.0') + '). Commercial distribution would require a legal review.</p>' +
    '<button class="btn mint block" data-m="close" style="margin-top:8px">Done</button>', m => {
    if (m === 'close') { closeModal(); render(); return; }
    if (m.startsWith('q:')) { set.quality = m.slice(2); if (s) persist(); settingsModal(); return; }
    if (m === 'export') return exportSave();
    if (m === 'import') return importSave();
    if (m === 'reset') return confirmBox('This deletes your whole career from this browser (export it first if you want to keep it).', () => { try { localStorage.removeItem(A.Save.KEY); localStorage.removeItem(A.Save.BAK); } catch (e) {} stopAI(); st.save = null; render(); });
  });
  $('modal').oninput = $('modal').onchange = e => {
    const k = e.target.dataset && e.target.dataset.set; if (!k) return;
    if (e.target.type === 'checkbox') set[k] = e.target.checked; else { set[k] = e.target.value / 100; e.target.nextElementSibling.textContent = e.target.value; }
    AU.init(); AU.apply(Object.assign({}, set)); if (s) persist();
  };
}
function exportSave() {
  try {
    const blob = new Blob([A.Save.serialize(st.save)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'FootballWarsArcade_' + A.club(st.save.club).displayName.replace(/[^a-z0-9]+/gi, '_') + '_D' + st.save.division + '.json';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('Save exported', '');
  } catch (e) { toast('Export failed: ' + e.message, 'bad'); }
}
function importSave() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try { const s = A.Save.parse(String(rd.result)); stopAI(); st.save = s; st.ai.w = null; persist(); closeModal(); st.tab = 'home'; render(); toast('Save imported: ' + A.club(s.club).displayName + ' · Division ' + s.division, 'gold'); startAI(); boot2(); }
      catch (e) { toast('Import failed: ' + e.message, 'bad', 4000); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

// ======================= boot =======================
function boot2() {
  const s = st.save; if (!s) return;
  AU.apply(Object.assign({}, s.settings));
  if (s.pendingBattle) {
    modal('<h2>Unfinished battle</h2><p class="small">' + esc(s.pendingBattle.snap.label) + ' was interrupted. Resume it exactly where it was (same seed, squads and Momentum inputs), or abandon it as a loss. Contracts were already used once and will not be used again.</p><div class="grid2"><button class="btn coral" data-m="abandon">Abandon (loss)</button><button class="btn gold" data-m="resume">RESUME BATTLE</button></div>', m => {
      closeModal();
      if (m === 'resume') resumeBattle();
      else { const snap = s.pendingBattle.snap; const out = A.Battle.abandon(s); persist(); if (out) showResults(out, {}); void snap; }
    });
  } else if (s.pendingDraft) { st.tab = 'packs'; render(); }
}
function boot() {
  st.storageOk = Store.available(); if (!st.storageOk) st.storageMsg = 'Browser storage is unavailable here: progress will NOT be saved. Use Export Save.';
  st.save = Store.load();
  document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) { e.preventDefault(); onAct(b.dataset.act, b); } const sc = e.target.closest('#screen [data-star]'); if (sc && st.save && st.save.stars[sc.dataset.star]) starModal(sc.dataset.star); });
  document.querySelectorAll('#tabbar [data-tab]').forEach(b => b.onclick = () => { AU.init(); AU.ui(); go(b.dataset.tab); });
  // battle controls
  $('strikeBtn').addEventListener('pointerdown', e => { e.preventDefault(); strike(); });
  $('btPause').onclick = () => setPause(!st.battle.paused);
  $('btSpeed').onclick = () => { const B = st.battle; B.speed = B.speed === 2 ? 1 : 2; st.save.settings.speed = B.speed; Store.write(); updateBattleButtons(); };
  $('btCam').onclick = () => { const B = st.battle; B.cam = !B.cam; st.save.settings.smartCam = B.cam; Store.write(); updateBattleButtons(); };
  $('btSkip').onclick = () => { if (st.battle) st.battle.skip = true; };
  $('pauseBox').onclick = e => {
    const b = e.target.closest('[data-b]'); if (!b) return; const B = st.battle;
    if (b.dataset.b === 'resume') setPause(false);
    else if (b.dataset.b === 'speed') { B.speed = B.speed === 2 ? 1 : 2; st.save.settings.speed = B.speed; setPause(true); }
    else if (b.dataset.b === 'cam') { B.cam = !B.cam; st.save.settings.smartCam = B.cam; setPause(true); }
    else if (b.dataset.b === 'mute') { st.save.settings.mute = !st.save.settings.mute; AU.apply({ mute: st.save.settings.mute }); setPause(true); }
    else if (b.dataset.b === 'abandon') { cancelAnimationFrame(B.raf); closeBattleView(); const out = A.Battle.abandon(st.save); persist(); if (out) showResults(out, {}); }
  };
  document.addEventListener('keydown', e => {
    if (!st.battle || !st.battle.w) return;
    if (e.code === 'Space') { e.preventDefault(); strike(); }
    else if (e.code === 'KeyP' || e.code === 'Escape') setPause(!st.battle.paused);
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && st.battle && st.battle.w && !st.battle.paused) setPause(true); if (document.hidden && st.save) Store.write(); });
  window.addEventListener('resize', fitStage);
  document.addEventListener('fullscreenchange', onFullChange); document.addEventListener('webkitfullscreenchange', onFullChange);
  if (!fsSupported()) document.documentElement.classList.add('no-fs');
  document.addEventListener('keydown', e => { if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey && !(e.target && /INPUT|TEXTAREA/.test(e.target.tagName))) toggleFull(); });
  window.addEventListener('pagehide', () => { if (st.battle && st.battle.w) saveProgress(st.battle); });
  render(); boot2(); if (st.save) startAI();
}
root.ArcadeApp = { boot, st, persist, render };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window);

</script>
</body>
