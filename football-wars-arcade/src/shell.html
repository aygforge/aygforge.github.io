<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070b17">
<meta name="mobile-web-app-capable" content="yes">
<title>Football Wars — Arcade Reborn</title>
<meta name="description" content="FOOTBALL WARS — ARCADE REBORN: 100 vs 100 pixel football battles, 10-division arcade career, star draft packs, Momentum Strike. Single offline HTML file.">
<style>/*@@CSS@@*/</style>
</head>
<body>
<div id="app">
  <header id="topbar" class="hidden"></header>
  <main id="screen"></main>
</div>
<nav id="tabbar" class="hidden"><div class="in">
  <button data-tab="home"><span class="ic">🏟️</span>Home</button>
  <button data-tab="league"><span class="ic">🏆</span>League</button>
  <button data-tab="upgrades"><span class="ic">⬆️</span>Upgrades<span class="badge hidden"></span></button>
  <button data-tab="packs"><span class="ic">🎁</span>Packs<span class="badge hidden"></span></button>
  <button data-tab="stars"><span class="ic">⭐</span>Stars</button>
  <button data-tab="challenges"><span class="ic">🎯</span>Challenges</button>
</div></nav>
<section id="battle" class="hidden" aria-label="Battle">
  <div class="bt-top"><button id="btPause" aria-label="Pause">❚❚</button><span class="lbl" id="btLabel"></span><button id="btSpeed" aria-label="Speed">1×</button><button id="btCam" aria-label="Smart camera">🎥</button><button id="btFull" class="fsbtn" data-act="fullscreen" aria-label="Full screen">⛶</button></div>
  <div id="stageWrap"><canvas id="stage" width="360" height="640"></canvas><div id="btLoading" class="loading hidden">RESTORING BATTLE…</div><button id="btSkip" class="skiphint hidden">Tap to continue ▸</button><div id="pauseBox" class="pausebox hidden"></div></div>
  <div class="hud"><div class="mom">
    <div><div class="lab"><span id="momTxt">MOMENTUM</span><span id="momUses">STRIKES 0/4</span></div>
      <div class="fill"><i id="momFill"></i></div>
      <div class="timing off" id="timing"><div class="good"></div><div class="perf"></div><div class="mk hidden" id="mk"></div><div class="tx" id="timingTx">TIMING BAR · NORMAL · GOOD · PERFECT</div></div></div>
    <button id="strikeBtn" class="strike">STRIKE<small>tap or SPACE</small></button>
  </div></div>
</section>
<div id="modal" class="hidden"></div>
<div id="toast"></div>
<!--@@SCRIPTS@@-->
</body>
</html>
