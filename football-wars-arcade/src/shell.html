<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070b17">
<meta name="mobile-web-app-capable" content="yes">
<title>Football Wars — Road to Glory</title>
<meta name="description" content="FOOTBALL WARS — ROAD TO GLORY: build your own club, field 100 players, unlock 24 auto Powers and permanent stars, and fight 100 vs 100 football battles through 10 divisions. Single offline HTML file.">
<style>/*@@CSS@@*/</style>
</head>
<body>
<div id="app">
  <header id="topbar" class="hidden"></header>
  <main id="screen"></main>
</div>
<nav id="tabbar" class="hidden"><div class="in">
  <button data-tab="club"><span class="ic">🏟️</span>Club<span class="badge hidden"></span></button>
  <button data-tab="squad"><span class="ic">👥</span>Squad<span class="badge hidden"></span></button>
  <button data-tab="powers"><span class="ic">⚡</span>Powers<span class="badge hidden"></span></button>
  <button data-tab="league"><span class="ic">🏆</span>League<span class="badge hidden"></span></button>
  <button data-tab="rewards"><span class="ic">🎁</span>Rewards<span class="badge hidden"></span></button>
</div></nav>
<section id="battle" class="hidden" aria-label="Battle">
  <div class="bt-top"><button id="btPause" aria-label="Pause">❚❚</button><span class="lbl" id="btLabel"></span><button id="btSpeed" aria-label="Speed">1×</button><button id="btCam" aria-label="Smart camera">🎥</button><button id="btFull" class="fsbtn" data-act="fullscreen" aria-label="Full screen">⛶</button></div>
  <div id="stageWrap"><canvas id="stage" width="360" height="640"></canvas><div id="pwFeed" class="pwfeed hidden"></div><div id="btLoading" class="loading hidden">RESTORING BATTLE…</div><button id="btSkip" class="skiphint hidden">Tap to continue ▸</button><div id="pauseBox" class="pausebox hidden"></div></div>
  <div class="hud">
    <div class="hudrow"><div id="starBar" class="starbar"></div><div id="pwList" class="pwlist"></div></div>
    <div id="legacyNote" class="cmdhelp hidden">This battle was started before the Road to Glory update and finishes with its original rules.</div>
    <div id="hudHelp" class="cmdhelp">Powers fire automatically · tap a star to follow it</div>
  </div>
</section>
<div id="modal" class="hidden"></div>
<div id="toast"></div>
<!--@@SCRIPTS@@-->
</body>
</html>
