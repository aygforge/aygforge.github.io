<style>
/* =========================================================
   DeliveRogue V1 — styles
   The DOM UI is authored at a fixed logical width of 360px
   and scaled with a CSS transform to fit the game frame.
   ========================================================= */
:root{
  --bg:#1b120d; --panel:#2b1d15; --panel2:#3a281c; --line:#5a3a26;
  --cream:#fff1dc; --cream2:#e9d3b4; --muted:#b59a7c; --caramel:#f2a541;
  --caramel2:#d9822b; --red:#e5533d; --mint:#5fd3b4; --blue:#5aa9e6;
  --gold:#ffd166; --dark:#140d09; --violet:#b78cff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:ui-rounded,"SF Pro Rounded","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--cream)}
#wrap{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#2a1b12 0%,#120b07 100%)}
#frame{position:relative;overflow:hidden;background:#1b120d;box-shadow:0 0 40px rgba(0,0,0,.6)}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;left:0;top:0;width:360px;transform-origin:0 0;pointer-events:none}
#ui *{pointer-events:auto}
#screen,#hud,#modal,#toasts{position:absolute;left:0;top:0;width:360px;height:100%}
#screen,#hud,#toasts{pointer-events:none}
#screen>*{pointer-events:auto}
#modal{display:none;background:rgba(10,6,4,.72);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#modal.open{display:flex;align-items:center;justify-content:center}
#toasts{display:flex;flex-direction:column;align-items:center;padding-top:168px;gap:6px}
#toasts *{pointer-events:none}
.toast{background:rgba(43,29,21,.95);border:2px solid var(--gold);border-radius:12px;padding:7px 12px;font-size:12px;font-weight:700;
  color:var(--cream);box-shadow:0 4px 0 rgba(0,0,0,.35);animation:toastIn .3s ease-out, toastOut .4s ease-in 2.6s forwards;max-width:300px;text-align:center}

#pauseBtn.show{display:block}
#hint{position:absolute;left:18px;right:18px;top:104px;text-align:center;font-size:13px;font-weight:700;color:var(--cream);

#hint.show{opacity:1}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}

.scroll::-webkit-scrollbar{width:0}

.btn{border:none;border-radius:14px;padding:12px 14px;font-weight:900;font-size:15px;color:#2a160b;background:linear-gradient(#ffc970,#f2a541);

.kv span{color:var(--muted);font-size:10px;font-weight:700}
.mast{font-size:11px;margin-top:6px;line-height:1.5}

.eq{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.eq img{width:52px;height:52px;flex:none;border-radius:12px;background:rgba(0,0,0,.3);image-rendering:auto}
.eq .info{flex:1;min-width:0}
.eq .nm{font-weight:900;font-size:14px}
.pips{display:flex;gap:2px;margin:4px 0}
.pips i{flex:1;height:6px;border-radius:2px;background:#4a3527}
.pips i.on{background:var(--caramel)}
.eq .bon{font-size:11px;color:var(--cream2)}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.skin img{width:64px;height:72px}
.skin.sel{border-color:var(--mint)}
.stat{display:flex;justify-content:space-between;font-size:12px;padding:6px 2px;border-bottom:1px dashed #4a3527}
.trophy{display:flex;gap:8px;align-items:center;padding:7px;border-radius:12px;margin-bottom:6px;background:rgba(0,0,0,.25)}
.trophy .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:#4a3527;flex:none}
.trophy.got .ic{background:linear-gradient(#ffd166,#f2a541)}
.trophy .tx{flex:1;font-size:12px}
.trophy .tx b{display:block;font-size:12.5px}

.quest{padding:9px;margin-bottom:8px}
.quest .row{justify-content:space-between}
.book{display:grid;grid-template-columns:1fr;gap:8px}
.ent{display:flex;gap:10px;align-items:center}
.ent img{width:56px;height:56px;border-radius:12px;background:rgba(0,0,0,.35);flex:none}
.ent .tx{font-size:11px;line-height:1.35;flex:1}
.ent .tx b{font-size:13px}
.ent.hid img{filter:brightness(0) opacity(.5)}
/* ---------- settings ---------- */
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px dashed #4a3527;font-weight:800;font-size:14px}
.tog{width:56px;height:30px;border-radius:999px;border:2px solid #6b4a33;background:#2b1d15;position:relative;padding:0}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#7a6250;transition:left .15s}
.tog.on{background:var(--mint);border-color:#a7f5e0}
.tog.on::after{left:28px;background:#fff}

.mbox{width:330px;max-height:92%;display:flex;flex-direction:column;background:linear-gradient(#3a281c,#251912);border:3px solid var(--line);border-radius:20px;
  padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.mbox h2{margin:2px 0 8px;text-align:center;font-size:20px}
.mbox .sub{text-align:center;font-size:12px;color:var(--cream2);margin-bottom:10px}
.skill{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px;margin-bottom:9px;border-radius:15px;border:2px solid var(--line);
  background:linear-gradient(#4a3424,#33231a);color:var(--cream);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.skill:active{transform:translateY(2px)}
.skill img{width:50px;height:50px;flex:none;border-radius:12px}
.skill .nm{font-weight:900;font-size:15px}
.skill .cat{font-size:10px;font-weight:900;padding:2px 7px;border-radius:7px;display:inline-block;margin:2px 0 3px;color:#1b120d}
.skill .ds{font-size:11.5px;color:var(--cream2);line-height:1.3}
.cat-attack{background:#ff8a73}.cat-elemental{background:#b78cff}.cat-defense{background:#5aa9e6}.cat-movement{background:#5fd3b4}
.intro .big{font-size:26px;font-weight:900;text-align:center;line-height:1.1}
.intro .tagline{text-align:center;color:var(--caramel);font-weight:900;font-size:12px;letter-spacing:2px}
.newe{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.3);border-radius:12px;padding:8px;margin-top:8px}
.newe img{width:46px;height:46px}
.newe .tx{font-size:11px;line-height:1.3}
.tip{font-size:12px;background:rgba(242,165,65,.15);border:1px dashed var(--caramel);border-radius:10px;padding:8px;margin-top:8px;line-height:1.35}
/* ---------- summary ---------- */
.sum-h{text-align:center;font-size:27px;font-weight:900;margin-top:6px;letter-spacing:.5px}
.sum-h.win{color:var(--gold);text-shadow:0 3px 0 #a5601d}
.sum-h.lose{color:#ff8a73;text-shadow:0 3px 0 #6e1f14}
.bigstars{display:flex;justify-content:center;gap:6px;font-size:40px;margin:4px 0}
.bigstars span{color:#4a3527;text-shadow:0 3px 0 rgba(0,0,0,.4);transform:scale(.4);opacity:0;animation:starIn .45s cubic-bezier(.2,1.6,.4,1) forwards}
.bigstars span.on{color:var(--gold)}
@keyframes starIn{to{transform:none;opacity:1}}
.grade{display:inline-flex;width:40px;height:40px;border-radius:12px;align-items:center;justify-content:center;font-size:24px;font-weight:900;
  background:linear-gradient(#ffd166,#f2a541);color:#2a160b !important;border:2px solid #fff1dc}

.rew{display:flex;justify-content:space-around;margin:8px 0}
.rew div{text-align:center;font-weight:900;font-size:20px}
.rew span:not(.coin){display:block;font-size:10px;color:var(--muted);font-weight:800}
.sum-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sum-btns .full{grid-column:1/3}
.badge{display:inline-block;font-size:10px;font-weight:900;background:var(--mint);color:#10322a;padding:2px 7px;border-radius:7px;margin:2px}
.epdone{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:auto;

.epdone .b{font-size:33px;font-weight:900;color:var(--gold);text-shadow:0 4px 0 #a5601d,0 10px 20px rgba(0,0,0,.6);animation:pop .6s ease-out;line-height:1.05;margin:8px 0}

     Save .................. versioned localStorage save + validation
     Audio / Haptic ........ Web Audio procedural SFX + music
     Input ................. pointer joystick + keyboard
     Art ................... procedural asset generator + asset registry
     MapBuilder / Nav ...... ASCII segment maps -> world grid, BFS fields
     Game .................. run state, player, combat, enemy AI, hazards

/* ---------------------------- Util ---------------------------- */
const TILE = 24, COLS = 15, VIEW_W = 360;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const fmtTime = s => { s = Math.max(0, s); const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ':' + (r < 10 ? '0' : '') + r; };

function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
/** Seeded RNG (mulberry32). */
function RNG(seed) {
  let a = seed >>> 0;
  const next = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

    next, range: (x, y) => x + (y - x) * next(), int: (x, y) => x + Math.floor(next() * (y - x + 1)),

  };
}

      episodes: { coffee: false },

      book, quests: { claimed: {} }, milestones: { unlocked: {}, claimed: {} }, mastery: {},

      tutorial: {}, settled: [], runCounter: 0,

    const g = obj(r.garage); GARAGE_ORDER.forEach(k => d.garage[k] = Math.floor(num(g[k], 0, 0, GARAGE_MAX)));
    d.unlocked = Math.floor(num(r.unlocked, 1, 1, NCH));
    for (let i = 0; i < NCH; i++) {
      d.stars[i] = Math.floor(num(Array.isArray(r.stars) ? r.stars[i] : 0, 0, 0, 3));
      d.bestTime[i] = num(Array.isArray(r.bestTime) ? r.bestTime[i] : 0, 0, 0, 9999);

    const st = obj(r.stats); for (const k in d.stats) d.stats[k] = Math.floor(num(st[k], 0, 0, 1e9));
    const bk = obj(r.book); ENEMY_ORDER.forEach(id => { const e = obj(bk[id]); d.book[id] = { seen: bool(e.seen, false), enc: Math.floor(num(e.enc, 0, 0, 1e9)), def: Math.floor(num(e.def, 0, 0, 1e9)) }; });
    const q = obj(obj(r.quests).claimed); QUESTS.forEach(x => { if (q[x.id] === true) d.quests.claimed[x.id] = true; });
    const ms = obj(r.milestones), mu = obj(ms.unlocked), mc = obj(ms.claimed);
    MILESTONES.forEach(x => { if (mu[x.id] === true) d.milestones.unlocked[x.id] = true; if (mc[x.id] === true) d.milestones.claimed[x.id] = true; });
    const ma = obj(r.mastery); for (const k in ma) if (ma[k] === true && /^C\d\d_\d$/.test(k)) d.mastery[k] = true;

  }

/* ========================= Nav / collision =========================
   One shared grid coordinate system for player, enemies, projectiles,
   hazards and camera. Entities are AABBs centred on (x, y) with .half.
   =================================================================== */
const Nav = (() => {
  let W = null;
  const isSolidT = t => t >= TT.WALL && t <= TT.VENT;
  function setWorld(w) { W = w; }
  function tileAt(c, r) { if (c < 0 || c >= COLS || r < 0 || r >= W.rows) return TT.WALL; return W.tile[r * COLS + c]; }
  function solid(c, r, enemy) { const t = tileAt(c, r); return isSolidT(t) || (enemy && t === TT.SAFE); }
  function blocked(x, y, half, enemy) {
    const c0 = Math.floor((x - half) / TILE), c1 = Math.floor((x + half - 0.001) / TILE);
    const r0 = Math.floor((y - half) / TILE), r1 = Math.floor((y + half - 0.001) / TILE);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (solid(c, r, enemy)) return true;
    return false;
  }
  /** Axis-separated swept movement with sub-steps (no tunnelling). Returns {hx, hy} hit flags. */
  function move(e, dx, dy, enemy, cornerAssist) {
    let hx = false, hy = false;
    const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 4));
    const sx = dx / steps, sy = dy / steps;
    for (let i = 0; i < steps; i++) {
      if (sx) {
        const ox = e.x; e.x += sx;
        if (blocked(e.x, e.y, e.half, enemy)) {
          if (sx > 0) { const c = Math.floor((e.x + e.half) / TILE); e.x = Math.max(ox, c * TILE - e.half - 0.01); }
          else { const c = Math.floor((e.x - e.half) / TILE); e.x = Math.min(ox, (c + 1) * TILE + e.half + 0.01); }
          if (blocked(e.x, e.y, e.half, enemy)) e.x = ox;
          hx = true;
          if (cornerAssist && Math.abs(sy) < Math.abs(sx) * 0.5) nudge(e, sx, 0, enemy);
        }
      }
      if (sy) {
        const oy = e.y; e.y += sy;
        if (blocked(e.x, e.y, e.half, enemy)) {
          if (sy > 0) { const r = Math.floor((e.y + e.half) / TILE); e.y = Math.max(oy, r * TILE - e.half - 0.01); }
          else { const r = Math.floor((e.y - e.half) / TILE); e.y = Math.min(oy, (r + 1) * TILE + e.half + 0.01); }
          if (blocked(e.x, e.y, e.half, enemy)) e.y = oy;
          hy = true;
          if (cornerAssist && Math.abs(sx) < Math.abs(sy) * 0.5) nudge(e, 0, sy, enemy);
        }
      }
    }
    if (blocked(e.x, e.y, e.half, enemy)) unstick(e, enemy);
    return { hx, hy };
  }
  /** Corner correction: if blocked by a corner edge, slide around it when nearly aligned with a gap. */
  function nudge(e, sx, sy, enemy) {
    for (let k = 1; k <= 7; k++) for (const s of [1, -1]) {
      const ox = sy ? s * k : 0, oy = sx ? s * k : 0;
      if (!blocked(e.x + ox + sx, e.y + oy + sy, e.half, enemy) && !blocked(e.x + ox, e.y + oy, e.half, enemy)) { e.x += Math.sign(ox) * Math.min(1.2, Math.abs(ox)); e.y += Math.sign(oy) * Math.min(1.2, Math.abs(oy)); return; }
    }
  }
  /** Last-resort: push an entity out of solids to the nearest free spot. */
  function unstick(e, enemy) {
    for (let rad = 2; rad <= 40; rad += 2) for (let a = 0; a < 8; a++) {
      const nx = e.x + Math.cos(a / 8 * TAU) * rad, ny = e.y + Math.sin(a / 8 * TAU) * rad;
      if (!blocked(nx, ny, e.half, enemy)) { e.x = nx; e.y = ny; return; }
    }
  }
  /** Line of sight through the tile grid (walls & furniture block). */
  function los(x0, y0, x1, y1) {
    const d = dist(x0, y0, x1, y1), n = Math.ceil(d / 6);
    for (let i = 1; i < n; i++) { const t = i / n, x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t; if (isSolidT(tileAt(Math.floor(x / TILE), Math.floor(y / TILE)))) return false; }
    return true;
  }
  /** Multi-source BFS distance field over walkable tiles. */
  function bfs(sources, enemy, maxD = 9999, out = null) {
    const n = W.rows * COLS, f = out || new Int16Array(n); f.fill(-1);
    const q = new Int32Array(n); let h = 0, t = 0;
    for (const [c, r] of sources) { if (c < 0 || c >= COLS || r < 0 || r >= W.rows) continue; const i = r * COLS + c; if (f[i] === -1) { f[i] = 0; q[t++] = i; } }
    while (h < t) {
      const i = q[h++], c = i % COLS, r = (i - c) / COLS, d = f[i]; if (d >= maxD) continue;
      if (c > 0 && f[i - 1] === -1 && !solid(c - 1, r, enemy)) { f[i - 1] = d + 1; q[t++] = i - 1; }
      if (c < COLS - 1 && f[i + 1] === -1 && !solid(c + 1, r, enemy)) { f[i + 1] = d + 1; q[t++] = i + 1; }
      if (r > 0 && f[i - COLS] === -1 && !solid(c, r - 1, enemy)) { f[i - COLS] = d + 1; q[t++] = i - COLS; }
      if (r < W.rows - 1 && f[i + COLS] === -1 && !solid(c, r + 1, enemy)) { f[i + COLS] = d + 1; q[t++] = i + COLS; }
    }
    return f;
  }
  /** Direction (unit vector) towards decreasing field value from world pos, 8-neighbour without corner cutting. */
  function flowDir(f, x, y) {
    const c = Math.floor(x / TILE), r = Math.floor(y / TILE), i = r * COLS + c;
    if (c < 0 || c >= COLS || r < 0 || r >= W.rows) return null;
    let best = f[i] >= 0 ? f[i] : 9999, bx = 0, by = 0, found = false;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue; const nc = c + dx, nr = r + dy; if (nc < 0 || nc >= COLS || nr < 0 || nr >= W.rows) continue;
      const v = f[nr * COLS + nc]; if (v < 0) continue;
      if (dx && dy && (f[r * COLS + nc] < 0 || f[nr * COLS + c] < 0)) continue;
      const vv = v + (dx && dy ? 0.4 : 0);
      if (vv < best) { best = vv; bx = dx; by = dy; found = true; }
    }
    if (!found) return null;
    const tx = (c + bx) * TILE + TILE / 2, ty = (r + by) * TILE + TILE / 2, m = Math.hypot(tx - x, ty - y) || 1;
    return { x: (tx - x) / m, y: (ty - y) / m };
  }
  function fieldAt(f, x, y) { const c = Math.floor(x / TILE), r = Math.floor(y / TILE); if (c < 0 || c >= COLS || r < 0 || r >= W.rows) return -1; return f[r * COLS + c]; }
  return { setWorld, tileAt, solid, blocked, move, los, bfs, flowDir, fieldAt, unstick, isSolidT };
})();

/* ========================= Map builder ========================= */
const MapBuilder = (() => {
  const CHAR = { '#': TT.WALL, C: TT.COUNTER, M: TT.MACHINE, T: TT.TABLE, B: TT.BOX, P: TT.PLANT, V: TT.VENT, s: TT.SPILL, z: TT.SAFE, g: TT.GRATE, D: TT.DROP, K: TT.SAFE, H: TT.SAFE };
  /** Build a world for chapter ch. Throws on malformed layout data (caught by validation tests). */
  function build(ch) {
    const lines = [], segs = [];
    ch.layout.forEach(([name, en], i) => {
      const s = SEGS[name]; if (!s) throw new Error('Unknown segment ' + name);
      const r0 = lines.length; s.forEach(row => { if (row.length !== COLS) throw new Error(`Segment ${name} row width ${row.length}`); lines.push(row); });
      segs.push({ name, idx: i, r0, r1: lines.length, enemies: en.split(/\s+/).filter(Boolean), slots: [], eslots: [], floor: [] });
    });
    const rows = lines.length;
    const w = { ch, rows, h: rows * TILE, tile: new Uint8Array(rows * COLS), flag: new Uint8Array(rows * COLS), ventDir: new Int8Array(rows * COLS),
      rowStyle: new Uint8Array(rows), rowSeg: new Int16Array(rows), segs, jets: [], grates: [], carts: [], heals: [], pickup: null, start: null, drop: null, checkpoint: null, chunks: new Map() };
    segs.forEach(s => { for (let r = s.r0; r < s.r1; r++) { w.rowSeg[r] = s.idx; w.rowStyle[r] = (s.idx + ch.n) % 3; } });
    let dx0 = 1e9, dy0 = 1e9, dx1 = -1, dy1 = -1;
    for (let r = 0; r < rows; r++) for (let c = 0; c < COLS; c++) {
      const ch2 = lines[r][c], i = r * COLS + c, cx = c * TILE + TILE / 2, cy = r * TILE + TILE / 2, seg = segs[w.rowSeg[r]];
      w.tile[i] = CHAR[ch2] !== undefined ? CHAR[ch2] : TT.FLOOR;
      switch (ch2) {
        case 'U': w.pickup = { x: cx, y: cy }; break;
        case '@': w.start = { x: cx, y: cy }; break;
        case 'H': w.heals.push({ x: cx, y: cy, used: false }); break;
        case 'K': w.checkpoint = { x: cx, y: cy, row: r, used: false }; break;
        case 'e': seg.slots.push({ x: cx, y: cy }); break;
        case 'E': seg.eslots.push({ x: cx, y: cy }); break;
        case 'm': w.carts.push({ x: cx, y: cy, row: r }); break;
        case 'r': w.flag[i] |= 1; break;
        case 'q': w.flag[i] |= 2; break;
        case 'g': w.grates.push({ x: cx, y: cy, r: 22 }); break;
        case 'D': dx0 = Math.min(dx0, c); dy0 = Math.min(dy0, r); dx1 = Math.max(dx1, c); dy1 = Math.max(dy1, r); break;
      }
      if (w.tile[i] === TT.FLOOR && ch2 !== '@' && ch2 !== 'U') seg.floor.push({ x: cx, y: cy, c, r });
    }
    if (!w.pickup || !w.start || dx1 < 0) throw new Error('Chapter ' + ch.n + ' missing pickup/start/drop');
    w.drop = { x0: dx0 * TILE, y0: dy0 * TILE, x1: (dx1 + 1) * TILE, y1: (dy1 + 1) * TILE, cx: (dx0 + dx1 + 1) * TILE / 2, cy: (dy0 + dy1 + 1) * TILE / 2, c0: dx0, c1: dx1, r0: dy0, r1: dy1 };
    Nav.setWorld(w);
    // vents -> horizontal steam jets crossing the corridor
    for (let r = 0; r < rows; r++) for (let c = 0; c < COLS; c++) {
      if (w.tile[r * COLS + c] !== TT.VENT) continue;
      const dir = !Nav.isSolidT(Nav.tileAt(c + 1, r)) ? 1 : -1; w.ventDir[r * COLS + c] = dir;
      let e = c + dir; while (!Nav.isSolidT(Nav.tileAt(e, r)) && e >= 0 && e < COLS) e += dir;
      const a = dir > 0 ? (c + 1) * TILE : (e + 1) * TILE, b = dir > 0 ? e * TILE : c * TILE;
      w.jets.push({ x0: a, x1: b, y: r * TILE + TILE / 2, dir, vx: dir > 0 ? (c + 1) * TILE : c * TILE });
    }
    // carts: compute patrol bounds along their row
    w.carts.forEach(k => {
      const c = Math.floor(k.x / TILE); let a = c, b = c;
      while (!Nav.isSolidT(Nav.tileAt(a - 1, k.row))) a--; while (!Nav.isSolidT(Nav.tileAt(b + 1, k.row))) b++;
      k.minX = a * TILE + 21; k.maxX = (b + 1) * TILE - 21; k.x = clamp(k.x, k.minX, k.maxX);
    });
    // nav fields
    const dropSrc = []; for (let r = dy0; r <= dy1; r++) for (let c = dx0; c <= dx1; c++) dropSrc.push([c, r]);
    w.dropField = Nav.bfs(dropSrc, false);
    w.pickField = Nav.bfs([[Math.floor(w.pickup.x / TILE), Math.floor(w.pickup.y / TILE)]], false);
    w.pathLen = Nav.fieldAt(w.dropField, w.pickup.x, w.pickup.y);
    return w;
  }
  /** Lazily render and cache 16-row chunks of the static map. */
  const CH_ROWS = 16;
  function chunk(w, k) { let c = w.chunks.get(k); if (!c) { c = Art.renderChunk(w, k * CH_ROWS, Math.min(w.rows, (k + 1) * CH_ROWS)); w.chunks.set(k, c); } return c; }
  return { build, chunk, CH_ROWS };
})();

/* ============================ Game ============================
   Run state, player controller, weapon/projectiles, combat, enemy AI,
   hazards, package & delivery logic. All mutable gameplay state lives in G.
   ============================================================== */
const View = { w: VIEW_W, h: 640, scale: 1, dpr: 1, low: false };
const Bus = (() => { const h = {}; return { on(n, f) { (h[n] = h[n] || []).push(f); }, emit(n, d) { (h[n] || []).forEach(f => f(d)); } }; })();

const G = {
  run: null, world: null, player: null, enemies: [], proj: [], eproj: [], lobs: [], puddles: [], zones: [],
  jets: [], grates: [], carts: [], parts: [], floats: [], bolts: [], cam: { y: 0, shake: 0, ox: 0, oy: 0 },
  enemyField: null, navT: 0, t: 0,
};

/* --------------------------- Skills --------------------------- */
const SkillMgr = {
  count(list, id) { let n = 0; for (const s of list) if (s === id) n++; return n; },
  /** Deterministic: modifiers are always recomputed from scratch from the picked list. */
  compute(list) {
    const c = id => SkillMgr.count(list, id);
    const elem = c('electric_card') ? 'electric' : c('frozen_payment') ? 'frozen' : c('burning_receipt') ? 'burn' : c('toxic_payment') ? 'toxic' : null;
    return {
      extra: c('double_order'), rapid: c('rapid_payment'), pierce: c('piercing_card'), bounce: c('ricochet') ? 2 : 0,
      critC: 0.15 * c('critical_receipt'), critM: 0.5 * c('critical_receipt'), diag: c('diagonal_delivery') > 0, elem,
      helmet: c('reinforced_helmet'), shield: c('emergency_shield') > 0, cashback: c('cashback') > 0,
      pkgMul: c('protective_packaging') ? 0.7 : 1, steamPkgMul: c('heat_resistant_bag') ? 0.4 : 1,
      express: c('express_courier'), brake: c('emergency_brake') > 0, lastMinute: c('last_minute') > 0,
      shortcut: c('shortcut_expert') > 0, balance: c('perfect_balance') > 0,
    };
  },
  /** Three distinct, compatible random choices. Elemental skills are mutually exclusive. */
  roll(run) {
    const hasElem = run.skills.some(id => SKILL_BY_ID[id].cat === 'elemental');
    const pool = SKILLS.filter(s => SkillMgr.count(run.skills, s.id) < s.max && !(hasElem && s.cat === 'elemental')).map(s => s.id);
    run.rng.shuffle(pool); return pool.slice(0, 3);
  },
  apply(run, id) {
    run.skills.push(id); run.mods = SkillMgr.compute(run.skills);
    const p = G.player, old = p.maxHp; Game.recalc();
    if (id === 'reinforced_helmet') p.hp = Math.min(p.maxHp, p.hp + 25);
    else p.hp = Math.min(p.hp, p.maxHp);
    if (id === 'emergency_shield') { p.shield = true; p.shieldCd = 8; }
    Fx.ring(p.x, p.y - 8, '#ffd166', 36); Audio.play('skill');
    void old;
  },
};

/* ----------------------------- FX ----------------------------- */
const Fx = {
  cap() { return View.low ? 110 : 220; },
  part(o) { if (G.parts.length >= Fx.cap()) G.parts.shift(); G.parts.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, life: 0.5, max: 0.5, size: 2, color: '#fff', grav: 0, kind: 'circ', drag: 2 }, o)); },
  burst(x, y, color, n = 8, spd = 80, size = 2, life = 0.45) { for (let i = 0; i < n; i++) { const a = Math.random() * TAU, s = spd * (0.4 + Math.random() * 0.8); Fx.part({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.6 + Math.random() * 0.6), max: life, size: size * (0.6 + Math.random() * 0.8), color, kind: Math.random() < 0.5 ? 'sq' : 'circ' }); } },

      res.killBonus = Math.min(st.kills * 2, Math.round(base * 0.1));
      res.coins = base + res.firstBonus + res.perfBonus + res.killBonus;
      res.xp = 40 + 15 * ch.n; if (res.first) res.xp = Math.round(res.xp * 1.5); if (stars === 3) res.xp += 10;
      s.completed[i] = true; res.prevStars = s.stars[i]; if (stars > s.stars[i]) s.stars[i] = stars;
      if (!s.bestTime[i] || st.time < s.bestTime[i]) { res.newBest = !!s.bestTime[i]; s.bestTime[i] = Math.round(st.time * 10) / 10; }
      if (ch.n < CHAPTERS.length && s.unlocked < ch.n + 1) { s.unlocked = ch.n + 1; res.unlockedNext = true; }
      if (ch.n === CHAPTERS.length && !s.episodes.coffee) { s.episodes.coffee = true; res.epComplete = true; }
      s.stats.deliveries++; if (st.pkgPct >= 0.7) s.stats.pkg70++;
      if (ch.pkg === 'FRAGILE_ORDER') s.stats.fragileDone++; if (ch.pkg === 'HEAVY_ORDER') s.stats.heavyDone++; if (stars === 3) s.stats.threeStarRuns++;
      ch.mastery.forEach((m, k) => {
        const key = ch.id + '_' + k;
        if (!s.mastery[key] && MASTERY_CHECK[m.k](m, st, ch)) { s.mastery[key] = true; s.stats.mastery++; res.coins += MASTERY_REWARD; res.mastery.push(MASTERY_TEXT[m.k](m)); }
      });
    } else {
      s.stats.failures++;
      const pr = st.progress || 0;
      if (pr >= 0.3 && st.time >= 15) { res.consolation = Math.min(Math.round(base * 0.15 * pr), Math.round(base * 0.15)); res.coins = res.consolation; res.xp = Math.round((20 + 5 * ch.n) * pr * 0.5); }
    }
    s.stats.kills += st.kills; s.stats.eliteKills += st.eliteKills;
    s.coins += res.coins; res.levelUps = addXp(s, res.xp); res.level = s.level;
    MILESTONES.forEach(m => { if (!s.milestones.unlocked[m.id] && m.check(s)) { s.milestones.unlocked[m.id] = true; res.milestones.push(m.name); } });
    QUESTS.forEach(q => { if (!qBefore.includes(q.id) && !s.quests.claimed[q.id] && questDone(s, q)) res.quests.push(q.text); });
    Save.write();
    return res;
  }
  function claimQuest(id) { const s = Save.data, q = QUESTS.find(x => x.id === id); if (!q || s.quests.claimed[id] || !questDone(s, q)) return false; s.quests.claimed[id] = true; s.coins += q.reward; Save.write(); return true; }
  function claimMilestone(id) { const s = Save.data, m = MILESTONES.find(x => x.id === id); if (!m || !s.milestones.unlocked[id] || s.milestones.claimed[id]) return false; s.milestones.claimed[id] = true; s.coins += m.reward; Save.write(); return true; }
  function buyUpgrade(id) { const s = Save.data, l = s.garage[id]; if (l >= GARAGE_MAX) return false; const c = garageCost(id, l); if (s.coins < c) return false; s.coins -= c; s.garage[id] = l + 1; Save.write(); return true; }
  function buySkin(id) { const s = Save.data, c = COSMETICS.find(x => x.id === id); if (!c || s.cosmetics.owned.includes(id) || s.level < c.lvl || s.coins < c.price) return false; s.coins -= c.price; s.cosmetics.owned.push(id); s.cosmetics.selected = id; Save.write(); return true; }
  function claimableCount() { const s = Save.data; return QUESTS.filter(q => !s.quests.claimed[q.id] && questDone(s, q)).length + MILESTONES.filter(m => s.milestones.unlocked[m.id] && !s.milestones.claimed[m.id]).length; }
  function totalStars() { return Save.data.stars.reduce((a, b) => a + b, 0); }
  return { settle, claimQuest, claimMilestone, buyUpgrade, buySkin, claimableCount, totalStars, questDone };
})();

    const opts = SkillMgr.roll(run);
    const title = info.checkpoint ? `☕ ${T('checkpoint')}` : `${T('chooseSkill')} <span class="muted" style="font-size:14px">${T('skillOf', run.pickIdx + 1, run.pickTotal)}</span>`;
    const cards = opts.map(id => {
      const s = SKILL_BY_ID[id], have = SkillMgr.count(run.skills, id);
      return `<button class="skill" data-a="pickskill" data-id="${id}"><img src="${Art.url(Art.skillIcon(id))}"><div><div class="nm">${s.name}</div>
        <span class="cat cat-${s.cat}">${T('cat_' + s.cat)}</span>${s.max > 1 ? ` <span class="small muted">${T('stack', have + 1, s.max)}</span>` : ''}<div class="ds">${s.desc}</div></div></button>`;
    }).join('');
    const owned = run.skills.length ? `<div class="small muted" style="text-align:center;margin-top:2px">${run.skills.map(id => SKILL_BY_ID[id].name).join(' · ')}</div>` : '';
    openModal(`<h2>${title}</h2><div class="sub">${info.checkpoint ? T('checkpointSub') : 'Bu teslimat boyunca geçerli. Süre durdu.'}</div>${cards}${owned}`, 'pick');
  }
  function showPause() {
    openModal(`<h2>❚❚ ${T('paused')}</h2><button class="btn mint wide" data-a="resume">▶ ${T('resume')}</button>
      <div style="margin:8px 0">${toggles(false)}</div>
      <div class="row"><button class="btn alt" style="flex:1" data-a="restart">↻ ${T('restart')}</button><button class="btn red" style="flex:1" data-a="quitask">✕ ${T('quitRun')}</button></div>`, 'pause');
  }
  function confirm(text, yes, cb, back) {
    confirmCb = cb;
    openModal(`<h2 style="font-size:17px">${text}</h2><div class="row" style="margin-top:10px"><button class="btn alt" style="flex:1" data-a="cancel" data-back="${back || ''}">${T('s_cancel')}</button><button class="btn red" style="flex:1" data-a="confirm">${yes}</button></div>`, 'confirm');
  }
  function togglePause() {
    const run = G.run; if (!run || current !== 'game') return;
    if (modalKind === 'pause') { closeModal(); Game.pause(false); }
    else if (!modalKind && run.state === 'play' && !run.paused) { if (Game.pause(true)) showPause(); }
  }

  /* ---------------- run lifecycle ---------------- */
  function startChapter(n) {
    if (n < 1 || n > Save.data.unlocked) return;
    G.parts.length = 0; G.floats.length = 0;
    const run = Game.start(n); sel = n - 1; go('game'); showIntro(run);
  }
  function onRunEnd(run) {
    lastResultRun = run;
    const res = run.settled;
    if (res && res.epComplete) {
      scr.innerHTML = `<div class="epdone"><div class="a">EPISODE 1</div><div class="b">${T('epComplete')}<br>${T('epComplete2')}</div><div class="small" style="max-width:260px;color:var(--cream2);margin-bottom:16px">${T('epComplete3')}</div><button class="btn" data-a="sumshow">${T('cont')} ▶</button></div>`;
      current = 'summary'; $('pauseBtn').classList.remove('show'); Audio.play('win');
      return;
    }
    showSummary(run);
  }
  function showSummary(run) {
    current = 'summary'; Main.scene = 'summary'; $('pauseBtn').classList.remove('show'); closeModal();
    const r = run.settled || {}, st = run.stats, ch = run.ch, s = Save.data, need = xpToNext(s.level);
    let html;
    if (run.success) {
      const stars = [1, 2, 3].map((k, i) => `<span class="${k <= r.stars ? 'on' : ''}" style="animation-delay:${0.15 + i * 0.22}s">★</span>`).join('');
      const extras = [r.first ? `<span class="badge">${T('firstBonus')} +${r.firstBonus}</span>` : '', r.perfBonus ? `<span class="badge">★ +${r.perfBonus}</span>` : '', r.killBonus ? `<span class="badge">👾 +${r.killBonus}</span>` : '',
        r.unlockedNext ? `<span class="badge" style="background:var(--gold)">${T('nextUnlocked')}</span>` : '', r.newBest ? `<span class="badge" style="background:#9fd8ff">${T('newBest')}</span>` : ''].join('');
      const mast = r.mastery.length ? `<div class="tip">🏅 ${r.mastery.map(m => T('masteryDone', m, MASTERY_REWARD)).join('<br>🏅 ')}</div>` : '';
      html = `<div class="sum-h win">${T('deliveryComplete')}</div><div style="text-align:center;font-weight:800;color:var(--cream2)">${T('chapter')} ${ch.n} · ${esc(ch.name)}</div>
        <div class="bigstars">${stars}</div>
        <div class="kv"><div><span>${T('grade')}</span><b><span class="grade">${r.grade}</span></b></div><div><span>${T('time')}</span><b>${fmtTime1(st.time)} <span class="muted small">/ 3★ ${ch.fast}s</span></b></div>
          <div><span>${T('remHp')}</span><b>${Math.ceil(st.hp)}/${st.maxHp}</b></div><div><span>${T('remPkg')}</span><b>${Math.ceil(st.pkgHp)}/${st.pkgMax} (${Math.round(st.pkgPct * 100)}%)</b></div>
          <div><span>${T('kills')}</span><b>${st.kills}${st.eliteKills ? ` (${st.eliteKills} ${T('elite')})` : ''}</b></div><div><span>${T('level')}</span><b>${s.level} · ${s.xp}/${need} XP</b></div></div>
        <div class="rew"><div><span>${T('coins')}</span><span class="coin"></span> +${r.coins}</div><div><span>${T('xp')}</span>+${r.xp}</div></div>
        <div style="text-align:center">${extras}</div>${mast}
        <div class="sum-btns">${ch.n < 12 && s.unlocked >= ch.n + 1 ? `<button class="btn mint full" data-a="next">${T('nextChapter')} ▶</button>` : ''}
          <button class="btn" data-a="replay">↻ ${T('replay')}</button><button class="btn alt" data-a="nav" data-to="prep">${T('toPrep')}</button>
          <button class="btn alt" data-a="nav" data-to="garage">🛵 ${T('garage')}</button><button class="btn alt" data-a="nav" data-to="menu">${T('toMenu')}</button></div>`;
    } else {
      html = `<div class="sum-h lose">${T('deliveryFailed')}</div><div style="text-align:center;font-weight:800;color:var(--cream2)">${T('chapter')} ${ch.n} · ${esc(ch.name)}</div>
        <div class="tip" style="text-align:center;font-size:14px;font-weight:800">${T('fail_' + run.reason)}</div>
        <div class="kv" style="margin-top:8px"><div><span>${T('grade')}</span><b><span class="grade F">F</span></b></div><div><span>${T('progressReached')}</span><b>%${Math.round((st.progress || 0) * 100)}</b></div>
          <div><span>${T('kills')}</span><b>${st.kills}</b></div><div><span>${T('time')}</span><b>${fmtTime1(st.time)}</b></div></div>
        <div class="bar" style="margin:10px 0"><i style="width:${Math.round((st.progress || 0) * 100)}%"></i></div>
        ${r.coins || r.xp ? `<div class="rew"><div><span>${T('consolation')}</span><span class="coin"></span> +${r.coins}</div><div><span>${T('xp')}</span>+${r.xp}</div></div>` : `<div class="small muted" style="text-align:center">${T('noReward')}</div>`}
        <div class="sum-btns"><button class="btn mint full" data-a="replay">↻ ${T('retry')}</button><button class="btn alt" data-a="nav" data-to="prep">${T('toPrep')}</button><button class="btn alt" data-a="nav" data-to="menu">${T('toMenu')}</button></div>`;
    }
    scr.innerHTML = `<div class="scr" style="background:rgba(16,10,7,.93)"><div class="scroll">${html}</div></div>`;
    if (run.success) setTimeout(() => Audio.play('coin'), 500);
    const later = []; if (r.levelUps) later.push(T('levelUp', s.level)); (r.milestones || []).forEach(m => later.push('🏆 ' + T('milestoneGot', m))); (r.quests || []).forEach(q => later.push('📋 ' + T('questReady', q)));
    later.forEach((m, i) => setTimeout(() => toast(m), 700 + i * 900));
  }

  /* ---------------- actions ---------------- */
  function onClick(e) {
    const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
    Audio.init();
    const a = b.dataset.a, s = Save.data;
    const NAV = ['nav', 'start', 'next', 'replay', 'back', 'begin', 'restart', 'confirm', 'sumshow', 'pickskill'];
    if (NAV.includes(a) && !navLock()) return;
    Audio.play('click');
    switch (a) {
      case 'nav': { const to = b.dataset.to; if (G.run && G.run.ended) { G.run = null; } if (to === 'prep' && current !== 'prep') { sel = current === 'menu' ? Math.min(11, s.unlocked - 1) : clamp(sel, 0, Math.min(11, s.unlocked - 1)); page = Math.min(9, Math.floor(sel / 3) * 3); } if (to === 'garage') garageBack = current; go(to); break; }
      case 'back': go(garageBack === 'summary' ? 'prep' : (garageBack && garageBack !== 'garage' ? garageBack : 'menu')); break;
      case 'page': page = clamp(page + (+b.dataset.d), 0, 9); refresh(); break;
      case 'selch': sel = +b.dataset.i; if (sel + 1 > s.unlocked) Audio.play('error'); refresh(); break;
      case 'start': startChapter(sel + 1); break;
      case 'next': startChapter(lastResultRun.n + 1); break;
      case 'replay': startChapter(lastResultRun.n); break;
      case 'begin': closeModal(); Game.beginPicks(); break;
      case 'pickskill': if (modalKind === 'pick') { closeModal(); Game.choose(b.dataset.id); } break;
      case 'resume': closeModal(); Game.pause(false); break;
      case 'restart': confirm(T('restart') + '?', T('restart'), () => { const n = G.run.n; Game.quit(); startChapter(n); }, 'pause'); break;
      case 'quitask': confirm(T('quitQ'), T('quitRun'), () => { const run = G.run; if (run) { Game.quit(); } G.run = null; sel = run ? run.n - 1 : sel; page = Math.min(9, Math.floor(sel / 3) * 3); go('prep'); }, 'pause'); break;
      case 'confirm': { const cb = confirmCb; confirmCb = null; closeModal(); if (cb) cb(); break; }
      case 'cancel': confirmCb = null; if (b.dataset.back === 'pause') showPause(); else closeModal(); break;
      case 'tog': { const k = b.dataset.k; s.settings[k] = !s.settings[k]; Save.write(); Audio.apply(); if (k === 'vibe' && s.settings.vibe) Haptic.buzz(30); b.classList.toggle('on', s.settings[k]); break; }
      case 'reset': confirm(T('s_resetQ'), T('s_resetYes'), () => { Save.reset(); Audio.apply(); sel = 0; page = 0; toast(T('s_resetDone')); go('menu'); }); break;
      case 'gtab': gTab = b.dataset.t; refresh(); break;
      case 'mtab': mTab = b.dataset.t; refresh(); break;
      case 'up': if (Progression.buyUpgrade(b.dataset.id)) { Audio.play('buy'); refresh(); } else Audio.play('error'); break;
      case 'skinbuy': if (Progression.buySkin(b.dataset.id)) { Audio.play('buy'); refresh(); } else Audio.play('error'); break;
      case 'skinsel': s.cosmetics.selected = b.dataset.id; Save.write(); refresh(); break;
      case 'claimq': if (Progression.claimQuest(b.dataset.id)) { Audio.play('coin'); refresh(); } break;
      case 'claimm': if (Progression.claimMilestone(b.dataset.id)) { Audio.play('coin'); refresh(); } break;
      case 'sumshow': showSummary(lastResultRun); break;
    }
  }
  let garageBack = 'menu';
  return { init, go, toast, togglePause, showPause, closeModal, get modalKind() { return modalKind; }, get current() { return current; } };
})();

/* ============================= Main =============================
   Scene controller, resize/high-DPI handling, visibility, main loop.
   ================================================================ */
const Main = (() => {
  let cv, frameEl, uiEl, last = 0, perfAcc = 0, perfN = 0, perfT = 0;
  const M = { scene: 'menu' };
  function resize() {
    const wrap = document.getElementById('wrap'), cs = getComputedStyle(wrap);
    const W = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), H = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const vh = clamp(VIEW_W * H / Math.max(1, W), 640, 800), scale = Math.min(W / VIEW_W, H / vh);
    View.h = Math.round(vh); View.scale = scale; View.dpr = Math.min(window.devicePixelRatio || 1, View.low ? 1 : 2);
    frameEl.style.width = (VIEW_W * scale) + 'px'; frameEl.style.height = (View.h * scale) + 'px';
    cv.width = Math.round(VIEW_W * scale * View.dpr); cv.height = Math.round(View.h * scale * View.dpr);
    uiEl.style.transform = `scale(${scale})`; uiEl.style.height = View.h + 'px';
  }
  function toLogical(cx, cy) { const r = cv.getBoundingClientRect(); return { x: (cx - r.left) / r.width * VIEW_W, y: (cy - r.top) / r.height * View.h }; }
  function loop(now) {
    let dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) dt = 0; dt = Math.min(dt, 0.05); // clamp after tab suspension / hitches
    // adaptive quality: drop to 1x DPR + fewer particles if frames are consistently slow
    if (!View.low && dt > 0) { perfAcc += dt; perfN++; perfT += dt; if (perfT > 3) { if (perfAcc / perfN > 1 / 38) { View.low = true; resize(); } perfAcc = 0; perfN = 0; perfT = 0; } }
    const inGame = (M.scene === 'game' || M.scene === 'summary') && G.run;
    Input.enabled = M.scene === 'game' && !!G.run && G.run.state === 'play' && !G.run.paused && !UI.modalKind;
    try {
      if (M.scene === 'game' && G.run) Game.update(dt); else G.t += dt;
      Render.frame(inGame);
    } catch (err) { console.error(err); }
    requestAnimationFrame(loop);
  }
  function init() {
    cv = document.getElementById('cv'); frameEl = document.getElementById('frame'); uiEl = document.getElementById('ui');
    Save.load(); Render.init(cv); Input.attach(cv, toLogical); resize(); UI.init(); UI.go('menu');
    window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 200));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { Input.reset(); if (M.scene === 'game' && G.run && G.run.state === 'play' && !G.run.paused && !UI.modalKind) { Game.pause(true); UI.showPause(); } Audio.suspend(); }
      else Audio.resume();
    });
    Input.onEscape = () => UI.togglePause();
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('touchmove', e => { if (!e.target.closest('.scroll')) e.preventDefault(); }, { passive: false });
    document.addEventListener('pointerdown', () => Audio.init(), { once: true });
    last = performance.now(); requestAnimationFrame(loop);
    window.__DR = { Art, G, Game, Save, UI, Main: M, CHAPTERS, MapBuilder, Nav, SkillMgr, Progression, View, Input, ENEMY_DB };
  }
  M.init = init;
  return M;
})();
Main.init();
})();
</script>
</body>
